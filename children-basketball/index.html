          const map = [2, 1, 3, 0, 4];
          for (let i = 0; i < state.offense.length; i++) {
            const p = state.offense[i];
            let bestS = 0;
            let bestD = 9999;
            for (let s = 0; s < PERIMETER_ARC_SLOTS.length; s++) {
              if (used[s]) continue;
              const d = hypot2(p.x - PERIMETER_ARC_SLOTS[s].x, Math.min(p.y, 9.5) - PERIMETER_ARC_SLOTS[s].y);
              if (d < bestD) {
                bestD = d;
                bestS = s;
              }
            }
            used[bestS] = true;
            map[i] = bestS;
          }
          m.slotForPlayer = map;
          m.cutterIdx = 2;
          m.cutPhase = "setup";
          m.cutTimer = 0;
          m.cutSide = 1;
          m.rotatedThisCut = false;
          m.completedCuts = 0;
          m.exchangeTimer = 0;
          m.exchangeFlip = 0;
          m.aiPassTimer = 0;
          m.redExchangeTimer = 0;
          m.redExchangeFlip = 0;
        }

        function pickNextOffBallCutter(prevIdx, excludedIdx) {
          let cand = prevIdx;
          for (let k = 0; k < 4; k++) {
            cand = (cand % 4) + 1;
            if (cand !== excludedIdx) return cand;
          }
          return 1;
        }

        /* Adjacent Arc-Ordered Fill: shifts only contiguous perimeter neighbors toward cut origin (0 paint crossings!) */
        function rotateOffBallSlotsOnCut(cutterIdx, excludedIdx) {
          const m = state.motion;
          let count = 0;
          for (let i = 1; i < state.offense.length; i++) {
            if (i === excludedIdx) continue;
            _arcOrderMates[count] = i;
            _arcOrderSlots[count] = m.slotForPlayer[i];
            count++;
          }
          if (count < 2) return;

          // Insertion sort 2..4 teammates by ascending perimeter arc index (0:L-Corner .. 4:R-Corner)
          for (let a = 1; a < count; a++) {
            const mVal = _arcOrderMates[a];
            const sVal = _arcOrderSlots[a];
            let b = a - 1;
            while (b >= 0 && _arcOrderSlots[b] > sVal) {
              _arcOrderMates[b + 1] = _arcOrderMates[b];
              _arcOrderSlots[b + 1] = _arcOrderSlots[b];
              b--;
            }
            _arcOrderMates[b + 1] = mVal;
            _arcOrderSlots[b + 1] = sVal;
          }

          let cutPos = -1;
          for (let k = 0; k < count; k++) {
            if (_arcOrderMates[k] === cutterIdx) {
              cutPos = k;
              break;
            }
          }
          if (cutPos === -1) return;

          // Clear out toward weak-side corner opposite ball (or opposite end if cutter started at that corner)
          const preferLeftClear = state.ball.x >= 0;
          let clearLeft = preferLeftClear;
          if (clearLeft && cutPos === 0) clearLeft = false;
          else if (!clearLeft && cutPos === count - 1) clearLeft = true;

          if (clearLeft) {
            const targetClearSlot = _arcOrderSlots[0];
            for (let j = 0; j < cutPos; j++) {
              m.slotForPlayer[_arcOrderMates[j]] = _arcOrderSlots[j + 1];
            }
            m.slotForPlayer[cutterIdx] = targetClearSlot;
          } else {
            const targetClearSlot = _arcOrderSlots[count - 1];
            for (let j = count - 1; j > cutPos; j--) {
              m.slotForPlayer[_arcOrderMates[j]] = _arcOrderSlots[j - 1];
            }
            m.slotForPlayer[cutterIdx] = targetClearSlot;
          }
        }

        function updateActiveOffBallTeammates(dt, excludedIdx) {
          const m = state.motion;
          const me = state.offense[0];
          const iHaveBall = !state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
          const bh = !state.ball.inFlight && state.ball.holderTeam === "offense" ? state.offense[state.ball.holderIdx] : null;

          // 1) Ensure active cutter is a valid off-ball AI teammate (1..4)
          if (m.cutterIdx < 1 || m.cutterIdx > 4 || m.cutterIdx === excludedIdx) {
            m.cutterIdx = pickNextOffBallCutter(m.cutterIdx || 1, excludedIdx);
            m.cutPhase = "setup";
            m.cutTimer = 0;
            m.rotatedThisCut = false;
          }

          // 2) Spacing Swap: if ★ YOU moves near an AI teammate's perimeter slot, swap slots!
          if (me.y < 11.5) {
            for (let i = 1; i < state.offense.length; i++) {
              if (i === excludedIdx) continue;
              if (i === m.cutterIdx && m.cutPhase === "slash") continue;
              const sIdx = m.slotForPlayer[i];
              const sl = PERIMETER_ARC_SLOTS[sIdx];
              const dxS = me.x - sl.x;
              const dyS = me.y - sl.y;
              if (dxS * dxS + dyS * dyS < 11.9025) {
                const myOldSlot = m.slotForPlayer[0];
                const oldSl = PERIMETER_ARC_SLOTS[myOldSlot];
                const dxO = me.x - oldSl.x;
                const dyO = me.y - oldSl.y;
                if (dxO * dxO + dyO * dyO >= 12.6025) {
                  m.slotForPlayer[i] = myOldSlot;
                  m.slotForPlayer[0] = sIdx;
                }
              }
            }
          }

          // 3) Periodic Weak-Side Wing-Corner Exchange (every 2.15s)
          m.exchangeTimer += dt;
          if (m.exchangeTimer >= 2.15) {
            m.exchangeTimer = 0;
            m.exchangeFlip ^= 1;
            const ballX = bh ? bh.x : state.ball.x;
            const weakS0 = ballX >= 0 ? 0 : 3;
            const weakS1 = ballX >= 0 ? 1 : 4;
            let pA = -1;
            let pB = -1;
            for (let i = 1; i < state.offense.length; i++) {
              if (i === excludedIdx || (i === m.cutterIdx && m.cutPhase === "slash")) continue;
              if (m.slotForPlayer[i] === weakS0) pA = i;
              else if (m.slotForPlayer[i] === weakS1) pB = i;
            }
            if (pA !== -1 && pB !== -1) {
              const tmp = m.slotForPlayer[pA];
              m.slotForPlayer[pA] = m.slotForPlayer[pB];
              m.slotForPlayer[pB] = tmp;
            }
          }

          // 4) Frontcourt 3-Phase Basket Cut & Clear-Out State Machine (5-Out Clear When ★ YOU Attacks Paint!)
          const inTransition = state.fullCourt && state.ball.y > 13.8;
          const meSpdSq = me.vx * me.vx + me.vy * me.vy;
          const userAttackingPaint = !inTransition && ((iHaveBall && (me.y < 6.8 || me.vy < -1.5)) || (!iHaveBall && me.y < 5.5 && meSpdSq > 6.76));
          if (!inTransition) {
            const cutPassInAir = state.ball.inFlight && (state.ball.wasCutPass || state.ball.wasAICutPass) && state.ball.targetIdx === m.cutterIdx;
            if (userAttackingPaint && !cutPassInAir) {
              if (m.cutPhase === "slash") {
                m.cutPhase = "clear";
                m.cutTimer = 0;
              } else if (m.cutPhase === "setup") {
                m.cutTimer = 0;
              }
            } else {
              m.cutTimer += dt;
              const cutter = state.offense[m.cutterIdx];
              const cSlot = PERIMETER_ARC_SLOTS[m.slotForPlayer[m.cutterIdx]];
              if (m.cutPhase === "setup") {
                m.cutSide = me.y < 5.0 && Math.abs(me.x) > 0.45 ? (me.x > 0 ? -1 : 1) : cSlot.x >= 0 ? 1 : -1;
                if (m.cutTimer >= 0.3) {
                  m.cutPhase = "slash";
                  m.cutTimer = 0;
                  m.rotatedThisCut = false;
                }
              } else if (m.cutPhase === "slash") {
                if (m.cutTimer >= 0.16 && !m.rotatedThisCut) {
                  rotateOffBallSlotsOnCut(m.cutterIdx, excludedIdx);
                  m.rotatedThisCut = true;
                }
                const cutX = m.cutSide * 1.22;
                const cutY = 2.08;
                if (!cutPassInAir && (hypot2(cutter.x - cutX, cutter.y - cutY) < 0.78 || m.cutTimer >= 0.98)) {
                  if (cutter.y < 3.6) m.completedCuts += 1;
                  m.cutPhase = "clear";
                  m.cutTimer = 0;
                }
              } else {
                const clearSlot = PERIMETER_ARC_SLOTS[m.slotForPlayer[m.cutterIdx]];
                if (hypot2(cutter.x - clearSlot.x, cutter.y - clearSlot.y) < 0.95 || m.cutTimer >= 0.48) {
                  m.cutterIdx = pickNextOffBallCutter(m.cutterIdx, excludedIdx);
                  m.cutPhase = "setup";
                  m.cutTimer = 0;
                  m.rotatedThisCut = false;
                }
              }
            }
          }

          // 5) Compute Drive Circle-Drift Offset from Ball-Handler Penetration
          let driveDriftX = 0;
          let driveDriftY = 0;
          let bhPenetrating = false;
          if (bh && bh.y < 6.5) {
            bhPenetrating = true;
            const pen = clamp((6.5 - bh.y) / 3.8, 0, 1);
            driveDriftX = clamp(-bh.x * 0.24, -1.15, 1.15) * pen;
            driveDriftY = (bh.y < 4.0 ? -0.45 : 0.35) * pen;
          }

          // 6) Move Each Off-Ball AI Teammate (5-Lane Fast Break / Cut / Circle Fill / V-Cut Rhythm)
          for (let i = 1; i < state.offense.length; i++) {
            if (i === excludedIdx) continue;
            const mate = state.offense[i];
            const sIdx = m.slotForPlayer[i];
            const slot = PERIMETER_ARC_SLOTS[sIdx];

            if (state.ball.inFlight && state.ball.flightType === "pass" && state.ball.passTeam === "offense" && state.ball.targetIdx === i) {
              const leadX = state.ball.wasCutPass ? m.cutSide * 1.05 : state.ball.toX;
              const leadY = state.ball.wasCutPass ? 2.05 : state.ball.toY;
              moveAgentToward(mate, leadX, leadY, 5.15, dt, false);
              mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
              continue;
            }

            // A. Wide 5-Lane Full-Court Fast-Break Waypoints (Get Wide First + Corner Lead Stagger + Opposite Trailer!)
            if (state.fullCourt && (mate.y > 11.8 || state.ball.y > 13.8)) {
              const uFb = clamp((mate.y - 9.0) / 10.0, 0, 1);
              const isRimRunner = i === m.cutterIdx;
              const refX = bh ? bh.x : me.x;
              const refY = bh ? bh.y : me.y;
              let fbX = slot.x;
              let fbY = slot.y;

              if (isRimRunner) {
                const rimSide = Math.abs(refX) > 0.55 ? (refX > 0 ? -1 : 1) : slot.x >= 0 ? 1 : -1;
                fbX = rimSide * 1.45;
                fbY = 2.4;
              } else if (sIdx === 2) {
                // Top-Key Trailer: opposite high-slot lane so center lane stays wide open for ★ YOU!
                const trailX = clamp(-refX * 0.65 + (refX >= 0 ? -2.45 : 2.45), -3.5, 3.5);
                fbX = lerp(slot.x, trailX, Math.max(0.45, uFb));
                fbY = lerp(slot.y, Math.max(8.2, refY + 1.4), uFb * 0.5);
              } else {
                // Wide Wing (slots 1, 3) & Deep Corner Lead Stagger (slots 0, 4: deltaY = -3.4m ahead of wings!)
                const isWing = sIdx === 1 || sIdx === 3;
                const sideSign = slot.x >= 0 ? 1 : -1;
                const wideX = sideSign * (isWing ? 5.65 : 6.42);
                fbX = lerp(slot.x, wideX, Math.max(0.55, uFb));
                const leadY = isWing ? Math.max(slot.y, mate.y - 5.2) : Math.max(slot.y, mate.y - 8.6);
                fbY = lerp(slot.y, leadY, uFb * 0.65);
              }

              // Transition repulsion from ★ YOU (d >= 2.45m) so AI never clogs user's fast-break lane!
              const dxFb = fbX - me.x;
              const dyFb = fbY - me.y;
              if (dxFb * dxFb + dyFb * dyFb < 6.0025) {
                const outSide = Math.abs(fbX - me.x) > 0.25 ? (fbX >= me.x ? 1 : -1) : i % 2 === 0 ? 1 : -1;
                fbX = clamp(me.x + outSide * 2.55, -6.65, 6.65);
              }

              moveAgentToward(mate, fbX, fbY, isRimRunner ? 5.28 : 5.12, dt, false);
              mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
              continue;
            }

            let tx = slot.x;
            let ty = slot.y;
            let spd = 4.15;

            // B. Active Cutter (Setup Jab -> 5.15 m/s Rim Slash -> Fast Clear-Out)
            if (!inTransition && i === m.cutterIdx) {
              if (m.cutPhase === "setup") {
                tx = lerp(slot.x, 0, 0.3);
                ty = clamp(slot.y - 0.9, 2.2, 9.2);
                spd = 3.95;
              } else if (m.cutPhase === "slash") {
                tx = m.cutSide * 1.22;
                ty = 2.08;
                spd = 5.15;
              } else {
                tx = slot.x;
                ty = slot.y;
                spd = 4.75;
              }
            } else {
              // C. Perimeter Circle Rotation + Drive Drift + Spot-Up Ready V-Cut Footwork
              const distToSlot = hypot2(mate.x - slot.x, mate.y - slot.y);
              const ph = state.simTime * 3.15 + i * 1.62;
              const jabScale = bhPenetrating ? 0.2 : 1.0;
              const vJabIn = Math.sin(ph) * 1.15 * jabScale;
              const vFlare = Math.cos(ph * 0.85) * 0.9;

              tx = slot.x + slot.cosC * vJabIn + slot.tangX * vFlare + driveDriftX;
              ty = slot.y + slot.sinC * vJabIn + slot.tangY * vFlare + driveDriftY;
              tx = clamp(tx, -6.65, 6.65);
              ty = clamp(ty, 1.65, 9.45);
              spd = distToSlot > 2.2 ? 4.35 : 3.45;
            }

            // D. Keep comfortable spacing from ★ YOU without pushing AI into the rim driving lane!
            const minKeep = iHaveBall ? 2.65 : 2.95;
            const dMe = hypot2(tx - me.x, ty - me.y);
            if (dMe < minKeep && me.y < 11.8) {
              if (iHaveBall && me.y < 7.5 && Math.abs(tx) < 2.2 && ty < me.y + 0.4) {
                const sideOut = slot.x >= 0 || (slot.x === 0 && me.x < 0) ? 1 : -1;
                tx = clamp(me.x + sideOut * minKeep, -6.65, 6.65);
                ty = clamp(Math.max(2.15, ty), 1.65, 9.55);
              } else {
                const pushAng = Math.atan2(ty - me.y, tx - me.x);
                tx = clamp(me.x + Math.cos(pushAng) * minKeep, -6.65, 6.65);
                ty = clamp(me.y + Math.sin(pushAng) * minKeep, 1.65, 9.55);
              }
            }

            moveAgentToward(mate, tx, ty, spd, dt, false);
            mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
          }
        }

        function updateDrillWeakSideMotion(dt, startIdx) {
          const me = state.offense[0];
          const m = state.motion;
          m.exchangeTimer += dt;
          if (m.exchangeTimer >= 2.45) {
            m.exchangeTimer = 0;
            m.exchangeFlip ^= 1;
          }
          for (let i = startIdx; i < state.offense.length; i++) {
            const mate = state.offense[i];
            let baseX = mate.homeX;
            let baseY = mate.homeY;
            if (startIdx <= 3 && (i === 3 || i === 4) && m.exchangeFlip === 1) {
              const other = state.offense[i === 3 ? 4 : 3];
              baseX = other.homeX;
              baseY = other.homeY;
            }
            const ph = state.simTime * 2.85 + i * 1.7;
            let tx = clamp(baseX + Math.cos(ph) * 0.95, -6.65, 6.65);
            let ty = clamp(baseY + Math.sin(ph * 1.15) * 1.05, 1.75, 9.45);

            if (state.targetSpot.active) {
              const dTarg = hypot2(tx - state.targetSpot.x, ty - state.targetSpot.y);
              if (dTarg < 3.85) {
                const ang = Math.atan2(ty - state.targetSpot.y, tx - state.targetSpot.x);
                tx = clamp(state.targetSpot.x + Math.cos(ang) * 3.85, -6.65, 6.65);
                ty = clamp(state.targetSpot.y + Math.sin(ang) * 3.85, 1.75, 9.45);
              }
            }
            if (hypot2(tx - me.x, ty - me.y) < 3.05) {
              const ang = Math.atan2(ty - me.y, tx - me.x);
              tx = clamp(me.x + Math.cos(ang) * 3.05, -6.65, 6.65);
              ty = clamp(me.y + Math.sin(ang) * 3.05, 1.75, 9.45);
            }

            moveAgentToward(mate, tx, ty, 3.35, dt);
            mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
          }
        }

        const FC_BLUE_SLOTS = [
          { x: 0.0, y: 8.6 },
          { x: -5.65, y: 6.1 },
          { x: 5.65, y: 6.1 },
          { x: -6.5, y: 2.2 },
          { x: 6.5, y: 2.2 },
        ];
        const FC_RED_SLOTS = [
          { x: 0.0, y: 19.4 },
          { x: -5.65, y: 21.9 },
          { x: 5.65, y: 21.9 },
          { x: -6.5, y: 25.8 },
          { x: 6.5, y: 25.8 },
        ];
        const HC_SHOT_REB_DROP = { x: COURT.rimX, y: COURT.rimY + 1.2 };
        const _fcRebDrop = { x: 0, y: 0 };
        const _swimTarget = { x: 0, y: 0 };

        function _findNearestOpponentWithin(p, oppArr, fallbackIdx) {
          let best = oppArr[fallbackIdx] || oppArr[0];
          let bestSq = 23.04; // 4.8m * 4.8m
          let found = false;
          for (let k = 0; k < oppArr.length; k++) {
            const cand = oppArr[k];
            const dx = cand.x - p.x;
            const dy = cand.y - p.y;
            const dSq = dx * dx + dy * dy;
            if (dSq < bestSq) {
              bestSq = dSq;
              best = cand;
              found = true;
            }
          }
          return found ? best : oppArr[fallbackIdx] || oppArr[0];
        }

        function _computeOuterHipSwimTarget(off, opp, dropX, dropY, maxY, out) {
          const inX = dropX - opp.x;
          const inY = dropY - opp.y;
          const dIn = Math.max(0.05, hypot2(inX, inY));
          const uInX = inX / dIn;
          const uInY = inY / dIn;
          const relX = off.x - opp.x;
          const relY = off.y - opp.y;
          const sideDot = relX * -uInY + relY * uInX;
          const swSign = Math.abs(sideDot) > 0.08 ? (sideDot >= 0 ? 1 : -1) : off.swimSign || 1;
          const nPerpX = -uInY * swSign;
          const nPerpY = uInX * swSign;
          out.x = clamp(opp.x + nPerpX * 0.92 + uInX * 0.35, -COURT.halfW + 0.55, COURT.halfW - 0.55);
          out.y = clamp(opp.y + nPerpY * 0.92 + uInY * 0.35, 0.65, maxY - 0.65);
          return out;
        }

        function updateFullCourtAI(dt) {
          const diff = getDiffProfile();
          const spdMult = diff.cpuActionMult;
          const defMult = diff.defSpeedMult;
          const me = state.offense[0];
          const blueSlots = FC_BLUE_SLOTS;
          const redSlots = FC_RED_SLOTS;

          // 0) Quick Baseline Inbound after a made basket
          if (state.inbound.active) {
            state.inbound.timer -= dt;
            if (state.inbound.team === "defense") {
              const inb = state.defense[1];
              moveAgentToward(inb, 1.45, -0.18, 5.0, dt, true);
              moveAgentToward(state.defense[0], 0.0, 4.2, 4.6 * spdMult, dt);
              inb.gazeAngle = Math.atan2(state.defense[0].y - inb.y, state.defense[0].x - inb.x);
              for (let i = 2; i < state.defense.length; i++) {
                moveAgentToward(state.defense[i], redSlots[i].x, lerp(state.defense[i].y, redSlots[i].y, 0.35), 4.4 * spdMult, dt);
              }
              for (let i = 1; i < state.offense.length; i++) {
                moveAgentToward(state.offense[i], redSlots[i].x * 0.82, 16.5 + i * 1.4, 4.2, dt);
              }
            } else {
              const inb = state.offense[1];
              moveAgentToward(inb, -1.45, COURT.fullLength + 0.18, 5.0, dt, true);
              inb.gazeAngle = Math.atan2(me.y - inb.y, me.x - inb.x);
              for (let i = 2; i < state.offense.length; i++) {
                moveAgentToward(state.offense[i], blueSlots[i].x, lerp(state.offense[i].y, blueSlots[i].y, 0.35), 4.5, dt);
              }
              for (let i = 0; i < state.defense.length; i++) {
                moveAgentToward(state.defense[i], blueSlots[i].x * 0.85, 11.5 - i * 1.1, 4.1 * defMult, dt);
              }
            }
            if (state.inbound.timer <= 0) {
              const iTeam = state.inbound.team;
              const pIdx = state.inbound.passerIdx;
              const inbPasser = iTeam === "defense" ? state.defense[pIdx] : state.offense[pIdx];
              if (inbPasser) {
                inbPasser.y = iTeam === "defense" ? Math.max(0.58, inbPasser.y) : Math.min(COURT.fullLength - 0.58, inbPasser.y);
              }
              let rIdx = state.inbound.receiverIdx;
              if (iTeam === "offense" && hypot2(me.x - state.offense[1].x, me.y - state.offense[1].y) > 16.0) {
                rIdx = 2;
              }
              state.inbound.active = false;
              startTeamPass(iTeam, pIdx, rIdx, { isInbound: true });
            }
            return;
          }

          // 1) Early Shot-Flight Box-Out + Loose-Ball 3D Rebound Scramble (Nearest-Matchup Seal + Outer-Hip Swim Move)
          const isShotFlightFC = state.ball.inFlight && state.ball.flightType === "shot";
          if (state.ball.loose || isShotFlightFC) {
            const redShot = state.ball.shooterTeam === "defense";
            let drop = _fcRebDrop;
            if (state.ball.loose) {
              drop = computeLooseBallDropSpot(_scratchDrop);
            } else {
              _fcRebDrop.x = COURT.rimX;
              _fcRebDrop.y = redShot ? COURT.southRimY - 1.2 : COURT.rimY + 1.2;
            }
            for (let i = 1; i < state.offense.length; i++) {
              const mate = state.offense[i];
              const opp = _findNearestOpponentWithin(mate, state.defense, i);
              const dDrop = hypot2(mate.x - drop.x, mate.y - drop.y);
              const shouldCrashOrSeal = redShot ? dDrop < 9.2 || i >= 2 : dDrop < 7.8 && i >= 2;
              if (shouldCrashOrSeal || (state.ball.loose && dDrop < 8.8)) {
                if (redShot) {
                  // Blue is Defensive Rebounding: Seal Inside Between Nearest Red Matchup & Drop Spot!
                  const dOpp = hypot2(opp.x - drop.x, opp.y - drop.y);
                  const closeBall = state.ball.loose && state.ball.looseTimer > 0.34 && dDrop < 2.2 && state.ball.z < 2.35;
                  let sx = drop.x;
                  let sy = drop.y;
                  if (!closeBall && dOpp < 6.0) {
                    const tSeal = clamp((dOpp - 0.68) / Math.max(0.68, dOpp), 0.18, 0.84);
                    sx = lerp(drop.x, opp.x, tSeal);
                    sy = lerp(drop.y, opp.y, tSeal);
                    if (dist2(mate, opp) < 1.25 && dDrop <= dOpp + 0.25) {
                      mate.boxOutTimer = Math.max(mate.boxOutTimer || 0, 0.25);
                    }
                  }
                  moveAgentToward(mate, sx, sy, 4.55, dt);
                } else {
                  // Blue is Offensive Rebounding: Outer-Hip Swim Move Around Boxed-Out Red Defender!
                  let sx = drop.x;
                  let sy = drop.y;
                  const dOpp = hypot2(opp.x - drop.x, opp.y - drop.y);
                  if (dist2(mate, opp) < 1.65 && dOpp < dDrop) {
                    _computeOuterHipSwimTarget(mate, opp, drop.x, drop.y, COURT.fullLength, _swimTarget);
                    sx = _swimTarget.x;
                    sy = _swimTarget.y;
                  }
                  moveAgentToward(mate, sx, sy, 4.55, dt);
                }
                if (state.ball.loose && hypot2(mate.x - state.ball.x, mate.y - state.ball.y) < 1.25 && state.ball.z > 1.35 && state.ball.z < 2.65) {
                  triggerJump(mate, 2.95);
                  mate.reboundReachTimer = Math.max(mate.reboundReachTimer || 0, 0.36);
                }
              } else {
                const safetyY = redShot ? 14.2 : 11.2;
                moveAgentToward(mate, blueSlots[i].x * 0.7, safetyY, 3.8, dt);
              }
              mate.gazeAngle = Math.atan2(drop.y - mate.y, drop.x - mate.x);
            }
            for (let i = 0; i < state.defense.length; i++) {
              const def = state.defense[i];
              if (def.reactionTimer > 0) {
                def.vx = def.inertiaVx;
                def.vy = def.inertiaVy;
                def.x = clamp(def.x + def.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
                def.y = clamp(def.y + def.vy * dt, 0.55, COURT.fullLength - 0.55);
                def.stridePhase += hypot2(def.vx, def.vy) * dt * 3.5;
                updatePlayerJumpAndPose(def, dt, false, false, false);
                continue;
              }
              const opp = _findNearestOpponentWithin(def, state.offense, i);
              const dDrop = hypot2(def.x - drop.x, def.y - drop.y);
              const shouldCrashOrSeal = !redShot ? dDrop < 9.2 || i >= 2 : dDrop < 7.8 && i >= 2;
              if (shouldCrashOrSeal || (state.ball.loose && dDrop < 9.0)) {
                if (!redShot) {
                  // Red is Defensive Rebounding: Seal Inside Between Nearest Blue Matchup & Drop Spot!
                  const dOpp = hypot2(opp.x - drop.x, opp.y - drop.y);
                  const closeBall = state.ball.loose && state.ball.looseTimer > 0.34 && dDrop < 2.15 && state.ball.z < 2.3;
                  let sx = drop.x;
                  let sy = drop.y;
                  if (!closeBall && dOpp < 6.0 && (def.offBalanceTimer || 0) <= 0) {
                    const tSeal = clamp((dOpp - 0.68) / Math.max(0.68, dOpp), 0.18, 0.84);
                    sx = lerp(drop.x, opp.x, tSeal);
                    sy = lerp(drop.y, opp.y, tSeal);
                    if (dist2(def, opp) < 1.25 && dDrop <= dOpp + 0.25) {
                      def.boxOutTimer = Math.max(def.boxOutTimer || 0, 0.25);
                    }
                  }
                  moveAgentToward(def, sx, sy, 4.45 * spdMult, dt);
                } else {
                  // Red is Offensive Rebounding: Outer-Hip Swim Move Around Box-Out!
                  let sx = drop.x;
                  let sy = drop.y;
                  const dOpp = hypot2(opp.x - drop.x, opp.y - drop.y);
                  if (dist2(def, opp) < 1.65 && dOpp < dDrop) {
                    _computeOuterHipSwimTarget(def, opp, drop.x, drop.y, COURT.fullLength, _swimTarget);
                    sx = _swimTarget.x;
                    sy = _swimTarget.y;
                  }
                  moveAgentToward(def, sx, sy, 4.45 * spdMult, dt);
                }
                if (
                  state.ball.loose &&
                  (def.offBalanceTimer || 0) <= 0 &&
                  hypot2(def.x - state.ball.x, def.y - state.ball.y) < 1.22 &&
                  state.ball.z > 1.35 &&
                  state.ball.z < 2.6
                ) {
                  triggerJump(def, 2.9);
                  def.reboundReachTimer = Math.max(def.reboundReachTimer || 0, 0.34);
                }
              } else {
                const safetyY = !redShot ? 13.8 : 16.8;
                moveAgentToward(def, redSlots[i].x * 0.7, safetyY, 3.8 * spdMult, dt);
              }
              def.gazeAngle = Math.atan2(drop.y - def.y, drop.x - def.x);
            }
            return;
          }

          // 2) Blue Team Has Possession -> Attack North Hoop (y = 1.575)!
          if (!isUserOnDefenseNow()) {
            const iHaveBall = !state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
            const m = state.motion;

            // Clear triple_threat freeze immediately if pass was a forward outlet push!
            if (
              !iHaveBall &&
              state.passAssist.active &&
              state.passAssist.mode === "triple_threat" &&
              !state.ball.inFlight &&
              state.ball.holderTeam === "offense" &&
              state.ball.holderIdx === state.passAssist.partnerIdx
            ) {
              const pCheck = state.offense[state.passAssist.partnerIdx];
              if (state.ball.fromY - pCheck.y > 4.0 || pCheck.y > 10.8) {
                state.passAssist.active = false;
              }
            }

            // Active Drive & Kick catch-and-shoot, Cut Layup, or Give & Go partner in frontcourt
            if (
              !iHaveBall &&
              state.passAssist.active &&
              !state.ball.inFlight &&
              state.ball.holderTeam === "offense" &&
              state.ball.holderIdx === state.passAssist.partnerIdx
            ) {
              const pIdx = state.passAssist.partnerIdx;
              const partner = state.offense[pIdx];
              if ((state.passAssist.mode === "drive_kick_shot" || state.passAssist.mode === "cut_layup") && partner.y < 11.5) {
                state.passAssist.timer -= dt;
                state.ball.gatherTimer = Math.max(0.05, state.passAssist.timer);
                if (state.passAssist.mode === "cut_layup") {
                  moveAgentToward(partner, COURT.rimX + (partner.x >= 0 ? 0.35 : -0.35), COURT.rimY + 0.55, 4.85, dt, false);
                } else {
                  moveAgentToward(partner, partner.x, partner.y, 0.8, dt);
                }
                partner.gazeAngle = Math.atan2(COURT.rimY - partner.y, COURT.rimX - partner.x);
                updateActiveOffBallTeammates(dt, pIdx);
                if (state.passAssist.timer <= 0 && state.playPhase === "live") {
                  state.passAssist.active = false;
                  startShot("offense", pIdx, null, true);
                }
              } else if (state.passAssist.mode === "triple_threat" && partner.y <= 10.8) {
                state.passAssist.returnLookTimer -= dt;
                moveAgentToward(partner, partner.x, partner.y, 1.1, dt);
                partner.gazeAngle = Math.atan2(me.y - partner.y, me.x - partner.x);
                updateActiveOffBallTeammates(dt, pIdx);
                if (state.passAssist.returnLookTimer <= 0) {
                  state.passAssist.active = false;
                }
              } else {
                state.passAssist.active = false;
                updateActiveOffBallTeammates(dt, state.ball.inFlight ? -1 : state.ball.holderIdx);
              }
            } else if (iHaveBall || state.ball.inFlight) {
              // YOU holds the ball (or pass is in the air): ALL 4 off-ball AI teammates run Read & React motion!
              updateActiveOffBallTeammates(dt, -1);
            } else {
              // An AI teammate (holderIdx > 0) holds the ball: other 3 AI teammates run active cuts & rotations!
              const hIdx = state.ball.holderIdx;
              const holder = state.offense[hIdx];
              updateActiveOffBallTeammates(dt, hIdx);

              m.aiPassTimer += dt;
              let holderNearDef = 99;
              for (let d = 0; d < state.defense.length; d++) {
                holderNearDef = Math.min(holderNearDef, dist2(holder, state.defense[d]));
              }
              const holderBreakaway = holderNearDef > 2.4 && me.y > holder.y + 1.5;
              const holderDrivingAhead = (holder.y < 7.5 && me.y > holder.y + 1.5) || holderBreakaway;
              const meAhead = !holderDrivingAhead && (me.y < holder.y - 1.2 || (holder.y < 13.8 && me.y < 11.8 && state.lane.open));
              const maxOutletDist = state.ball.outletReady ? 23.0 : 16.5;
              if (
                meAhead &&
                !checkPassLineBlocked(holder, me, _scratchPassBlock).blocked &&
                hypot2(me.x - holder.x, me.y - holder.y) < maxOutletDist
              ) {
                m.aiPassTimer = 0;
                const wasOutlet = !!state.ball.outletReady;
                state.ball.outletReady = false;
                startTeamPass("offense", hIdx, 0);
                setCoachMessage("good", "🔥", wasOutlet ? "OUTLET PASS! GO!" : holder.y > 12.0 ? "FAST BREAK! GO!" : "OPEN! PASS COMING!", 1.1);
              } else {
                // Fast-break AI outlet to open ahead AI wing when YOU is trailing behind!
                if (state.ball.outletReady && m.aiPassTimer >= 0.22) {
                  for (let w = 1; w < state.offense.length; w++) {
                    if (w === hIdx) continue;
                    const wing = state.offense[w];
                    if (
                      wing.y < holder.y - 3.0 &&
                      hypot2(wing.x - holder.x, wing.y - holder.y) < 19.5 &&
                      !checkPassLineBlocked(holder, wing, _scratchPassBlock).blocked
                    ) {
                      m.aiPassTimer = 0;
                      state.ball.outletReady = false;
                      startTeamPass("offense", hIdx, w);
                      setCoachMessage("good", "🔥", "FAST BREAK! GO!", 1.0);
                      break;
                    }
                  }
                }

                // Check if our slashing AI cutter is open in the paint!
                const cIdx = m.cutterIdx;
                const cutter = state.offense[cIdx];
                if (!state.ball.inFlight && cIdx >= 1 && cIdx !== hIdx && m.cutPhase === "slash" && cutter.y < 4.8 && m.aiPassTimer >= 0.62) {
                  const cDefDist = dist2(cutter, state.defense[cIdx]);
                  if (cDefDist > 1.2 && !checkPassLineBlocked(holder, cutter, _scratchPassBlock).blocked) {
                    m.aiPassTimer = 0;
                    startTeamPass("offense", hIdx, cIdx, { wasAICutPass: true });
                  }
                }

                if (!state.ball.inFlight) {
                  const slot = PERIMETER_ARC_SLOTS[m.slotForPlayer[hIdx]];
                  const probeX = holderBreakaway
                    ? holder.x >= 0
                      ? 0.55
                      : -0.55
                    : lerp(slot.x, 0, 0.48) + Math.sin(state.simTime * 2.6 + hIdx) * 0.95;
                  const probeY = holderBreakaway ? 2.05 : holder.y > 10.5 ? 7.6 : 4.25;
                  moveAgentToward(holder, probeX, probeY, (holderBreakaway ? 4.95 : 4.55) * spdMult, dt);
                  holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);

                  const dRim = hypot2(holder.x - COURT.rimX, holder.y - COURT.rimY);
                  let nearDef = 99;
                  for (let d = 0; d < state.defense.length; d++) nearDef = Math.min(nearDef, dist2(holder, state.defense[d]));
                  if (dRim < 2.85 && nearDef > 1.2) {
                    startShot("offense", hIdx, null, false);
                  } else if (holder.y < 10.2 && m.aiPassTimer >= 1.25) {
                    m.aiPassTimer = 0;
                    let bestM = !holderDrivingAhead && !checkPassLineBlocked(holder, me, _scratchPassBlock).blocked ? 0 : -1;
                    let bestOpen = -1;
                    if (bestM === -1) {
                      for (let k = 1; k < state.offense.length; k++) {
                        if (k === hIdx) continue;
                        const sep = dist2(state.offense[k], state.defense[k]);
                        if (!checkPassLineBlocked(holder, state.offense[k], _scratchPassBlock).blocked && sep > bestOpen) {
                          bestOpen = sep;
                          bestM = k;
                        }
                      }
                    }
                    if (bestM === -1) bestM = (hIdx % 4) + 1;
                    startTeamPass("offense", hIdx, bestM);
                  }
                }
              }
            }

            // Red AI Defense (Transition + Cutter Lag + Low-Man / Stay-Home / Closeout)
            const passToOffense = state.ball.inFlight && state.ball.flightType === "pass" && state.ball.passTeam === "offense";
            const kickInAir = passToOffense && state.ball.fromIdx === 0 && state.ball.t < 0.62;
            const activeBhIdx = !state.ball.inFlight && state.ball.holderTeam === "offense" ? state.ball.holderIdx : kickInAir ? 0 : -1;
            const activeBh = activeBhIdx >= 0 ? state.offense[activeBhIdx] : me;
            const bhDistRim = hypot2(activeBh.x - COURT.rimX, activeBh.y - COURT.rimY);
            const pDrive = activeBhIdx >= 0 && activeBh.y < 8.5 ? clamp((6.4 - bhDistRim) / 3.2, 0, 1) : 0;
            let fcLowManIdx = -1;
            if (pDrive > 0.04) {
              let bestLowSq = 9999;
              for (let k = 0; k < state.defense.length; k++) {
                if (k === activeBhIdx) continue;
                if (passToOffense && k === state.ball.targetIdx) continue;
                if (k === state.motion.cutterIdx && state.motion.cutPhase === "slash") continue;
                const offK = state.offense[k];
                if (offK.x * activeBh.x > 0.35) continue; // Weak-side or center only
                const dSq = (offK.x - COURT.rimX) * (offK.x - COURT.rimX) + (offK.y - COURT.rimY) * (offK.y - COURT.rimY);
                if (dSq < bestLowSq) {
                  bestLowSq = dSq;
                  fcLowManIdx = k;
                }
              }
            }

            const onBallCushFC = state.difficulty === "easy" ? 1.08 : state.difficulty === "medium" ? 1.04 : 1.0;
            for (let i = 0; i < state.defense.length; i++) {
              const def = state.defense[i];
              const man = state.offense[i];
              if (def.reactionTimer > 0) {
                def.vx = def.inertiaVx;
                def.vy = def.inertiaVy;
                def.x = clamp(def.x + def.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
                def.y = clamp(def.y + def.vy * dt, 0.55, COURT.fullLength - 0.55);
                updatePlayerJumpAndPose(def, dt, false, false, false);
                continue;
              }

              const manHasBall = !state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === i;
              const isPassReceiver = passToOffense && state.ball.targetIdx === i;
              const toRimX = COURT.rimX - man.x;
              const toRimY = COURT.rimY - man.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              const isUserConstSprint =
                i === 0 &&
                def.offBalanceTimer <= 0 &&
                state.rhythm.burstBoostTimer <= 0 &&
                keys.Shift &&
                (hypot2(man.vx, man.vy) > 1.0 || state.rhythm.monotoneSprintTime > 0);

              if (isUserConstSprint) {
                def.paceAdapt = Math.min(1.0, (def.paceAdapt || 0) + dt * 3.5);
                const lockCushion = manHasBall ? (state.difficulty === "easy" ? 1.06 : state.difficulty === "medium" ? 1.04 : 1.02) : 0.84;
                const tx = man.x + (toRimX / dRim) * lockCushion + man.vx * 0.115;
                const ty = man.y + (toRimY / dRim) * lockCushion + man.vy * 0.115;
                const chaseSpd = state.difficulty === "easy" ? 5.55 * defMult : 5.65;
                def.ballWatchFactor = 0.08;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                moveAgentToward(def, tx, ty, chaseSpd, dt, false, true);
                continue;
              }
              def.paceAdapt = Math.max(0, (def.paceAdapt || 0) - dt * 1.6);

              const cushion = manHasBall || isPassReceiver ? onBallCushFC : i === 0 ? 1.12 : 1.28;
              let tx = man.x + (toRimX / dRim) * cushion;
              let ty = man.y + (toRimY / dRim) * cushion;
              let defSpd = def.offBalanceTimer > 0 ? 1.65 : 4.65 * defMult;
              def.ballWatchFactor = clamp(0.25 + diff.ballWatchBoost, 0, 1);

              if (isPassReceiver && !state.ball.wasCutPass) {
                // Immediate Closeout at t = 0 when pass is thrown to this defender's matchup!
                def.ballWatchFactor = 0.12;
                defSpd = def.offBalanceTimer > 0 ? 1.65 : 5.05 * defMult;
              } else if (i === 0 && !manHasBall && state.passAssist.active && state.passAssist.mode === "triple_threat") {
                def.ballWatchFactor = 0.9;
                const tbX = state.ball.x - man.x;
                const tbY = state.ball.y - man.y;
                const dB = Math.max(0.01, hypot2(tbX, tbY));
                tx = man.x + (tbX / dB) * 0.78;
                ty = man.y + (tbY / dB) * 0.78;
              } else if (
                !manHasBall &&
                ((i === state.motion.cutterIdx && state.motion.cutPhase === "slash") ||
                  (passToOffense && state.ball.wasCutPass && state.ball.targetIdx === i))
              ) {
                // Cutter beat defender with setup V-step -> defender trails to the outside, opening interior cut lane!
                def.ballWatchFactor = 0.72;
                tx = clamp(man.x + state.motion.cutSide * 1.58, -6.5, 6.5);
                ty = clamp(man.y + 0.38, 1.35, 9.2);
                defSpd = 4.1 * defMult;
              } else if (!manHasBall && pDrive > 0.04) {
                const isStrongCorner = man.x * activeBh.x > 0.35 && man.y < 3.85;
                let wHelp = 0;
                let helpX = tx;
                let helpY = ty;
                if (isStrongCorner) {
                  wHelp = 0.08 * pDrive;
                  helpX = lerp(man.x, COURT.rimX, 0.25);
                  helpY = man.y;
                } else if (i === fcLowManIdx) {
                  wHelp = 0.76 * pDrive;
                  helpX = clamp(activeBh.x * 0.45, -1.1, 1.1);
                  helpY = COURT.rimY + 0.92;
                } else {
                  wHelp = 0.22 * pDrive;
                  helpX = clamp(activeBh.x * 0.55, -2.1, 2.1);
                  helpY = lerp(man.y, COURT.rimY + 1.85, 0.55);
                }
                tx = lerp(tx, helpX, wHelp);
                ty = lerp(ty, helpY, wHelp);
                def.ballWatchFactor = clamp(0.3 + wHelp * 0.68 + diff.ballWatchBoost, 0, 1);
              }

              def.gazeAngle =
                def.ballWatchFactor > 0.52 ? Math.atan2(state.ball.y - def.y, state.ball.x - def.x) : Math.atan2(man.y - def.y, man.x - def.x);
              moveAgentToward(def, tx, ty, defSpd, dt, false, (i === 0 || isPassReceiver) && def.offBalanceTimer <= 0);
            }
            return;
          }

          // 3) Red Team Has Possession -> Attack South Hoop (y = 26.425)!
          // Blue AI Teammates (1..4): Fast-Break Sprint Back + On-Ball Pressure + Low-Man Help & Recover!
          state.motion.redExchangeTimer += dt;
          if (state.motion.redExchangeTimer >= 2.15) {
            state.motion.redExchangeTimer = 0;
            state.motion.redExchangeFlip ^= 1;
          }

          const passToRed = state.ball.inFlight && state.ball.flightType === "pass" && state.ball.passTeam === "defense";
          const redBhIdxNow = !state.ball.inFlight && state.ball.holderTeam === "defense" ? state.ball.holderIdx : -1;
          const redBhRef = redBhIdxNow >= 0 ? state.defense[redBhIdxNow] : state.ball;
          const redDistSouthRim = hypot2(redBhRef.x - COURT.rimX, redBhRef.y - COURT.southRimY);
          const redDrive = state.ball.y > 18.0 ? clamp((6.8 - redDistSouthRim) / 3.4, 0.08, 0.88) : 0;
          let blueLowManIdx = -1;
          if (redDrive > 0.08) {
            let bestBlueSq = 9999;
            for (let k = 1; k < state.offense.length; k++) {
              if (k === redBhIdxNow || k === state.defDrill.cutterIdx) continue;
              if (passToRed && k === state.ball.targetIdx) continue;
              const rManK = state.defense[k];
              if (rManK.x * redBhRef.x > 0.35) continue;
              const dSq = (rManK.x - COURT.rimX) * (rManK.x - COURT.rimX) + (rManK.y - COURT.southRimY) * (rManK.y - COURT.southRimY);
              if (dSq < bestBlueSq) {
                bestBlueSq = dSq;
                blueLowManIdx = k;
              }
            }
          }

          for (let i = 1; i < state.offense.length; i++) {
            const blueDef = state.offense[i];
            const redMan = state.defense[i];
            const manHasBall = redBhIdxNow === i;
            const isRedReceiver = passToRed && state.ball.targetIdx === i;
            const sprintBack = blueDef.y < 17.2 && state.ball.y > 14.5;
            const toSouthX = COURT.rimX - redMan.x;
            const toSouthY = COURT.southRimY - redMan.y;
            const dSouth = Math.max(0.01, hypot2(toSouthX, toSouthY));
            const bCush = manHasBall || isRedReceiver ? 1.06 : 1.26;
            let tx = redMan.x + (toSouthX / dSouth) * bCush;
            let ty = redMan.y + (toSouthY / dSouth) * bCush;
            let bSpd = sprintBack ? 5.15 : isRedReceiver ? 4.95 : 4.65;

            if (manHasBall) {
              tx += Math.sin(state.simTime * 5.2 + i) * 0.28;
            } else if (isRedReceiver) {
              // Immediate Closeout on pass flight!
              bSpd = 4.95;
            } else if (i === state.defDrill.cutterIdx) {
              tx = lerp(redMan.x, state.ball.x, 0.22);
              ty = clamp(redMan.y + 0.45, 16.0, COURT.fullLength - 0.8);
            } else if (redDrive > 0.08) {
              const strongCorner = redMan.x * redBhRef.x > 0.35 && redMan.y > COURT.fullLength - 3.85;
              if (strongCorner) {
                tx = lerp(tx, COURT.rimX, 0.08 * redDrive);
              } else if (i === blueLowManIdx) {
                const wH = 0.68 * redDrive;
                tx = lerp(tx, clamp(redBhRef.x * 0.45, -1.1, 1.1), wH);
                ty = lerp(ty, COURT.southRimY - 0.95, wH);
              } else {
                const wH = 0.24 * redDrive;
                tx = lerp(tx, clamp(redBhRef.x * 0.55, -2.1, 2.1), wH);
                ty = lerp(ty, COURT.southRimY - 2.05, wH);
              }
            }
            moveAgentToward(blueDef, tx, clamp(ty, 1.0, COURT.fullLength - 0.8), bSpd, dt, false, sprintBack || isRedReceiver);
            blueDef.gazeAngle = Math.atan2(state.ball.y - blueDef.y, state.ball.x - blueDef.x);
          }

          if (state.ball.inFlight) {
            for (let i = 0; i < state.defense.length; i++) {
              const rP = state.defense[i];
              const ph = state.simTime * 2.9 + i * 1.4;
              moveAgentToward(rP, redSlots[i].x + Math.cos(ph) * 0.85, redSlots[i].y + Math.sin(ph) * 0.75, 4.45 * spdMult, dt);
            }
            return;
          }

          const dd = state.defDrill;
          dd.timer += dt * spdMult;
          dd.actionTimer += dt * spdMult;
          dd.passTimer = (dd.passTimer || 0) + dt * spdMult;

          const bhIdx = state.ball.holderIdx;
          const bh = state.defense[bhIdx];

          for (let i = 0; i < state.defense.length; i++) {
            const rP = state.defense[i];
            if (rP.reactionTimer > 0) {
              continue;
            }
            if (i === bhIdx) continue;
            if (i === dd.cutterIdx && bh.y > 16.5) {
              const cutX = redSlots[i].x >= 0 ? 1.15 : -1.15;
              moveAgentToward(rP, cutX, 25.75, 4.95 * spdMult, dt, false);
              if (hypot2(rP.x - cutX, rP.y - 25.75) < 1.35 || dd.passTimer > 2.0) {
                dd.cutterIdx = (dd.cutterIdx + 1) % 5;
                if (dd.cutterIdx === bhIdx) dd.cutterIdx = (dd.cutterIdx + 1) % 5;
                dd.passTimer = 0;
              }
            } else {
              let slotIdx = i;
              if (state.motion.redExchangeFlip === 1) {
                if (i === 1 && bhIdx !== 3) slotIdx = 3;
                else if (i === 3 && bhIdx !== 1) slotIdx = 1;
                else if (i === 2 && bhIdx !== 4) slotIdx = 4;
                else if (i === 4 && bhIdx !== 2) slotIdx = 2;
              }
              const ph = state.simTime * 3.0 + i * 1.55;
              const rx = clamp(redSlots[slotIdx].x + Math.cos(ph) * 1.05, -6.65, 6.65);
              const ry = clamp(redSlots[slotIdx].y + Math.sin(ph * 1.1) * 0.95, 17.5, COURT.fullLength - 1.1);
              moveAgentToward(rP, rx, ry, 4.55 * spdMult, dt);
            }
            rP.gazeAngle = Math.atan2(bh.y - rP.y, bh.x - rP.x);
          }

          if (bh.reactionTimer > 0) return;

          // Backcourt / Transition Push toward South Hoop (y = 26.425)
          if (bh.y < 17.5) {
            state.ball.gatherTimer = 0;
            if (dd.actionTimer > 0.55) {
              for (let m = 0; m < state.defense.length; m++) {
                if (m === bhIdx) continue;
                const wing = state.defense[m];
                if (wing.y > bh.y + 3.2 && wing.y > 14.5 && !checkTeamPassBlocked("defense", bh, wing, _scratchPassBlock).blocked) {
                  dd.actionTimer = 0;
                  startTeamPass("defense", bhIdx, m);
                  return;
                }
              }
            }
            const weaveX = clamp(redSlots[bhIdx].x * 0.35 + Math.sin(state.simTime * 2.2) * 1.1, -5.2, 5.2);
            moveAgentToward(bh, weaveX, 19.6, 4.55 * spdMult, dt);
            bh.gazeAngle = Math.atan2(COURT.southRimY - bh.y, COURT.rimX - bh.x);
            return;
          }

          // Frontcourt Offense around South Hoop (0, 26.425)
          if (dd.cutterIdx === -1 && dd.timer > 1.6) {
            dd.cutterIdx = (bhIdx + 2) % 5;
            if (dd.cutterIdx === bhIdx) dd.cutterIdx = (bhIdx + 1) % 5;
            dd.passTimer = 0;
          }

          if (state.ball.gatherTimer <= 0 && dd.cutterIdx !== -1 && dd.actionTimer > 0.85) {
            const cutter = state.defense[dd.cutterIdx];
            let closestBlue = 99;
            for (let b = 0; b < state.offense.length; b++) closestBlue = Math.min(closestBlue, dist2(cutter, state.offense[b]));
            if (
              closestBlue > 1.75 &&
              !checkTeamPassBlocked("defense", bh, cutter, _scratchPassBlock).blocked &&
              hypot2(cutter.x, cutter.y - 25.75) < 3.2
            ) {
              const target = dd.cutterIdx;
              dd.cutterIdx = -1;
              dd.actionTimer = 0;
              dd.passTimer = 0;
              startTeamPass("defense", bhIdx, target);
              setCoachMessage("warn", "🚨", "CUT PASS! CONTEST!", 1.0);
              return;
            }
          }

          const distSouthRim = hypot2(bh.x - COURT.rimX, bh.y - COURT.southRimY);
          let closestBlueDef = 99;
          for (let b = 0; b < state.offense.length; b++) {
            closestBlueDef = Math.min(closestBlueDef, dist2(bh, state.offense[b]));
          }

          if (
            (distSouthRim < 2.6 && dd.actionTimer > 0.45) ||
            (closestBlueDef > 2.25 && distSouthRim < 8.2 && dd.actionTimer > 1.05) ||
            dd.timer > 6.2
          ) {
            state.ball.gatherTimer += dt;
            moveAgentToward(bh, bh.x, bh.y, 0.9, dt);
            bh.gazeAngle = Math.atan2(COURT.southRimY - bh.y, COURT.rimX - bh.x);
            if (dist2(me, bh) < 3.6) {
              setCoachMessage("warn", "🖐️", "SHOT! PRESS SPACE!", 0.3);
            }
            const meInFrontSouth = (me.x - bh.x) * (COURT.rimX - bh.x) + (me.y - bh.y) * (COURT.southRimY - bh.y) > 0;
            if (dist2(me, bh) < 2.35 && me.contestTimer > 0 && meInFrontSouth) {
              state.ball.contestedByUser = true;
              state.ball.gatherTimer = 0;
              startShot("defense", bhIdx, null, false, { wasContested: true });
              return;
            }
            if (state.ball.gatherTimer >= diff.cpuGatherSec) {
              state.ball.gatherTimer = 0;
              const contestedByMe = dist2(me, bh) < 1.85 && me.contestTimer > 0 && meInFrontSouth;
              const contestedByAI = closestBlueDef < 1.02 && Math.random() < 0.38;
              startShot("defense", bhIdx, null, false, { wasContested: contestedByMe || contestedByAI });
              return;
            }
            return;
          }

          state.ball.gatherTimer = 0;

          if (dd.actionTimer > 0.95) {
            moveAgentToward(bh, bh.x * 0.25, 25.55, 4.35 * spdMult, dt);
            bh.gazeAngle = Math.atan2(COURT.southRimY - bh.y, COURT.rimX - bh.x);

            let paintBlueHelpers = 0;
            for (let b = 0; b < state.offense.length; b++) {
              if (dist2(bh, state.offense[b]) < 2.0) paintBlueHelpers++;
            }
            if (paintBlueHelpers >= 2 && dd.actionTimer > 1.45) {
              let bestM = (bhIdx + 1) % 5;
              let bestOpen = -1;
              for (let m = 0; m < state.defense.length; m++) {
                if (m === bhIdx) continue;
                let minB = 99;
                for (let b = 0; b < state.offense.length; b++) minB = Math.min(minB, dist2(state.defense[m], state.offense[b]));
                if (minB > bestOpen && !checkTeamPassBlocked("defense", bh, state.defense[m], _scratchPassBlock).blocked) {
                  bestOpen = minB;
                  bestM = m;
                }
              }
              dd.actionTimer = 0;
              startTeamPass("defense", bhIdx, bestM);
            }
          } else {
            moveAgentToward(bh, redSlots[bhIdx].x + Math.sin(state.simTime * 2.3) * 0.7, redSlots[bhIdx].y + 0.3, 3.2 * spdMult, dt);
            bh.gazeAngle = Math.atan2(COURT.southRimY - bh.y, COURT.rimX - bh.x);
          }
        }

        function updateOffenseAI(dt) {
          if (state.fullCourt) {
            updateFullCourtAI(dt);
            return;
          }
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;
          const pg = state.offense[1];

          // 1) Tutorials
          if (state.scenario === "tutorial") {
            const tut = state.tutorial;
            const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;
            if (!iHaveBall) {
              if (tut.step === 1) {
                moveAgentToward(pg, -1.3, 6.2 + Math.sin(state.simTime * 2) * 0.2, 2.2, dt);
              } else if (tut.step === 2) {
                const driveDepth = clamp(state.simTime / 0.6, 0, 1);
                moveAgentToward(pg, lerp(-0.9, -1.2, driveDepth), lerp(7.4, 3.7, driveDepth), 3.6, dt);
              } else {
                moveAgentToward(pg, pg.homeX + Math.sin(state.simTime * 1.6) * 0.4, pg.homeY, 2.4, dt);
              }
              pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
            }
            for (let i = iHaveBall ? 1 : 2; i < state.offense.length; i++) {
              moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.5, dt);
              state.offense[i].gazeAngle = Math.atan2(state.ball.y - state.offense[i].y, state.ball.x - state.offense[i].x);
            }
            return;
          }

          if (state.scenario === "learn_d") {
            const tut = state.tutorial;
            if (tut.step === 1) {
              const swingX = Math.sin(state.simTime * 2.1) * 2.35;
              moveAgentToward(state.offense[0], swingX, 8.0, 3.4, dt);
              state.offense[0].gazeAngle = Math.atan2(COURT.rimY - state.offense[0].y, COURT.rimX - state.offense[0].x);
            } else if (tut.step === 2) {
              moveAgentToward(state.offense[0], 0.0, 6.8, 2.0, dt);
              state.offense[0].gazeAngle = Math.atan2(COURT.rimY - state.offense[0].y, COURT.rimX - state.offense[0].x);
            } else if (tut.step === 3) {
              moveAgentToward(state.offense[1], 4.6 + Math.sin(state.simTime * 2) * 0.5, 6.6, 2.6, dt);
              moveAgentToward(state.offense[0], -5.65, 6.0, 2.2, dt);
            } else if (tut.step === 4) {
              if (!state.ball.inFlight && state.ball.holderIdx === 1) {
                moveAgentToward(state.offense[1], 0.3, 7.5, 3.2, dt);
              } else if (!state.ball.inFlight && state.ball.holderIdx === 0 && state.playPhase === "live") {
                state.phaseTimer += dt;
                state.ball.gatherTimer = 0.8;
                const dMe = dist2(state.defense[0], state.offense[0]);
                if (dMe < 2.3 && state.defense[0].contestTimer > 0) {
                  state.ball.contestedByUser = true;
                  startShot("offense", 0, false);
                } else if (state.phaseTimer > 1.85) {
                  startShot("offense", 0, true);
                }
              }
            }
            for (let i = 2; i < state.offense.length; i++) {
              moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.4, dt);
            }
            return;
          }

          // 1b) Half-Court Live Loose-Ball Offensive Rebound Crash + Outer-Hip Swim-Move Jostling!
          if (state.ball.loose) {
            const drop = computeLooseBallDropSpot(_scratchDrop);
            const startIdx = state.role === "offense" ? 1 : 0;
            for (let i = startIdx; i < state.offense.length; i++) {
              const off = state.offense[i];
              const def = _findNearestOpponentWithin(off, state.defense, i);
              const dDrop = hypot2(off.x - drop.x, off.y - drop.y);
              if (dDrop < 7.8 || i <= 2) {
                let sx = drop.x;
                let sy = drop.y;
                const dDef = hypot2(def.x - drop.x, def.y - drop.y);
                if (dist2(off, def) < 1.65 && dDef < dDrop) {
                  _computeOuterHipSwimTarget(off, def, drop.x, drop.y, COURT.length, _swimTarget);
                  sx = _swimTarget.x;
                  sy = _swimTarget.y;
                }
                moveAgentToward(off, sx, sy, 4.45, dt);
                if (hypot2(off.x - state.ball.x, off.y - state.ball.y) < 1.22 && state.ball.z > 1.35 && state.ball.z < 2.65) {
                  triggerJump(off, 2.95);
                  off.reboundReachTimer = Math.max(off.reboundReachTimer || 0, 0.36);
                }
              } else {
                moveAgentToward(off, off.homeX * 0.75, Math.max(7.2, off.homeY), 3.4, dt);
              }
              off.gazeAngle = Math.atan2(drop.y - off.y, drop.x - off.x);
            }
            return;
          }

          // 1c) Second-Chance CPU Offense Handler in Defense Practice Drills (if O2..O5 grabbed an offensive rebound)
          if (
            state.role === "defense" &&
            state.scenario !== "match" &&
            !state.ball.inFlight &&
            state.ball.holderTeam === "offense" &&
            state.ball.holderIdx >= 2
          ) {
            const rIdx = state.ball.holderIdx;
            const reb = state.offense[rIdx];
            const meDef = state.defense[0];
            state.phaseTimer += dt;
            state.ball.gatherTimer = 0.55;
            reb.gazeAngle = Math.atan2(COURT.rimY - reb.y, COURT.rimX - reb.x);
            if (dist2(meDef, reb) < 2.25 && meDef.contestTimer > 0) {
              state.ball.contestedByUser = true;
              startShot("offense", rIdx, false, false, { wasContested: true });
            } else if (state.phaseTimer > 0.62) {
              if (hypot2(reb.x - COURT.rimX, reb.y - COURT.rimY) < 3.6) {
                startShot("offense", rIdx, null, false);
              } else {
                state.phaseTimer = 0;
                state.defDrill.phase = "probe";
                state.defDrill.cutStage = 0;
                state.defDrill.timer = 0;
                startPass(rIdx, state.scenario === "def_onball" ? 0 : 1);
              }
            }
            return;
          }

          // 2) User on Offense (Drills & 5v5 Match Offense)
          if (state.role === "offense") {
            const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;
            if (iHaveBall) {
              if (state.scenario === "match") {
                // Full Read & React Motion Offense when YOU holds the ball in 5v5 MATCH!
                updateActiveOffBallTeammates(dt, -1);
                return;
              }
              if (state.scenario === "give_go") {
                const ph1 = state.simTime * 2.8;
                moveAgentToward(pg, pg.homeX + Math.cos(ph1) * 0.65, pg.homeY + Math.sin(ph1) * 0.55, 3.0, dt);
                pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
                updateDrillWeakSideMotion(dt, 2);
                return;
              }
              updateDrillWeakSideMotion(dt, 1);
              return;
            }

            // Active Assist Catch-and-Shoot, Cut Layup, or Triple-Threat Give & Go Partner!
            if (state.passAssist.active && !state.ball.inFlight && state.ball.holderIdx === state.passAssist.partnerIdx) {
              const pIdx = state.passAssist.partnerIdx;
              const partner = state.offense[pIdx];
              if (state.passAssist.mode === "drive_kick_shot" || state.passAssist.mode === "cut_layup") {
                state.passAssist.timer -= dt;
                state.ball.gatherTimer = Math.max(0.05, state.passAssist.timer);
                if (state.passAssist.mode === "cut_layup") {
                  moveAgentToward(partner, COURT.rimX + (partner.x >= 0 ? 0.35 : -0.35), COURT.rimY + 0.55, 4.85, dt, false);
                } else {
                  moveAgentToward(partner, partner.x, partner.y, 0.8, dt);
                }
                partner.gazeAngle = Math.atan2(COURT.rimY - partner.y, COURT.rimX - partner.x);
                if (state.scenario === "match") {
                  updateActiveOffBallTeammates(dt, pIdx);
                } else {
                  for (let i = 1; i < state.offense.length; i++) {
                    if (i === pIdx) continue;
                    const ph = state.simTime * 2.8 + i * 1.5;
                    moveAgentToward(
                      state.offense[i],
                      state.offense[i].homeX + Math.cos(ph) * 0.85,
                      state.offense[i].homeY + Math.sin(ph) * 0.85,
                      3.2,
                      dt
                    );
                    state.offense[i].gazeAngle = Math.atan2(COURT.rimY - state.offense[i].y, COURT.rimX - state.offense[i].x);
                  }
                }
                if (state.passAssist.timer <= 0 && state.playPhase === "live") {
                  state.passAssist.active = false;
                  startShot("offense", pIdx, null, true);
                }
                return;
              } else if (state.passAssist.mode === "triple_threat") {
                state.passAssist.returnLookTimer -= dt;
                moveAgentToward(partner, partner.x, partner.y, 1.1, dt);
                partner.gazeAngle = Math.atan2(state.offense[0].y - partner.y, state.offense[0].x - partner.x);
                if (state.scenario === "match") {
                  updateActiveOffBallTeammates(dt, pIdx);
                } else {
                  updateDrillWeakSideMotion(dt, pIdx === 1 ? 2 : 1);
                }
                if (state.passAssist.returnLookTimer <= 0 && state.scenario !== "give_go") {
                  state.passAssist.active = false;
                }
                return;
              }
            }

            if (state.scenario === "give_go") {
              moveAgentToward(pg, pg.homeX, pg.homeY, 2.6, dt);
              pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
              updateDrillWeakSideMotion(dt, 2);
              return;
            } else if (state.scenario === "relocation") {
              const wave = Math.sin(state.simTime * 1.15);
              const driveDepth = state.simTime > 0.45 ? 1.0 : state.simTime / 0.45;
              moveAgentToward(pg, lerp(0.0, side * 1.95, driveDepth), lerp(8.75, 3.55 + (wave > 0 ? wave * 0.45 : 0), driveDepth), 3.7, dt);
              pg.gazeAngle = Math.atan2(COURT.rimY - pg.y, COURT.rimX - pg.x);
              updateDrillWeakSideMotion(dt, 2);
              return;
            } else if (state.scenario === "cut") {
              moveAgentToward(pg, side * 2.2 + Math.sin(state.simTime * 1.8) * 0.85, 8.15 + Math.cos(state.simTime * 1.5) * 0.35, 2.8, dt);
              pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
              updateDrillWeakSideMotion(dt, 2);
              return;
            } else if (state.scenario === "vcut") {
              moveAgentToward(pg, side * 1.35 + Math.sin(state.simTime * 1.5) * 0.55, 8.55, 2.5, dt);
              pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
              updateDrillWeakSideMotion(dt, 2);
              return;
            } else if (state.scenario === "match") {
              const holderIdx = state.ball.holderIdx;
              const m = state.motion;
              if (state.ball.inFlight) {
                updateActiveOffBallTeammates(dt, -1);
                return;
              }
              const holder = state.offense[holderIdx];
              updateActiveOffBallTeammates(dt, holderIdx);

              // Dynamic probing dribble for AI ball-handler + active ball movement to open cutters / YOU!
              const slot = PERIMETER_ARC_SLOTS[m.slotForPlayer[holderIdx]];
              const probeX = lerp(slot.x, 0, 0.45) + Math.sin(state.simTime * 2.6 + holderIdx) * 1.05;
              const probeY = clamp(lerp(slot.y, 4.1, 0.5) + Math.cos(state.simTime * 2.1 + holderIdx) * 0.65, 2.8, 8.8);
              moveAgentToward(holder, probeX, probeY, 3.85, dt);
              holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);

              const dRimH = hypot2(holder.x - COURT.rimX, holder.y - COURT.rimY);
              let nearDefH = 99;
              for (let d = 0; d < state.defense.length; d++) nearDefH = Math.min(nearDefH, dist2(holder, state.defense[d]));
              if (dRimH < 2.65 && nearDefH > 1.22 && !state.lane.open) {
                startShot("offense", holderIdx, null, false);
                return;
              }

              m.aiPassTimer += dt;
              if (!state.lane.open && m.aiPassTimer >= 0.72) {
                const cIdx = m.cutterIdx;
                const cutter = state.offense[cIdx];
                if (
                  cIdx >= 1 &&
                  cIdx !== holderIdx &&
                  m.cutPhase === "slash" &&
                  cutter.y < 4.8 &&
                  dist2(cutter, state.defense[cIdx]) > 1.2 &&
                  !checkPassLineBlocked(holder, cutter, _scratchPassBlock).blocked
                ) {
                  m.aiPassTimer = 0;
                  startPass(holderIdx, cIdx, { wasAICutPass: true });
                } else if (m.aiPassTimer >= 1.25) {
                  m.aiPassTimer = 0;
                  let bestIdx = (holderIdx % 4) + 1;
                  let bestOpen = -1;
                  if (!checkPassLineBlocked(holder, state.offense[0], _scratchPassBlock).blocked) {
                    const sep0 = dist2(state.offense[0], state.defense[0]);
                    if (sep0 > 1.75) {
                      bestOpen = sep0;
                      bestIdx = 0;
                    }
                  }
                  for (let k = 1; k < state.offense.length; k++) {
                    if (k === holderIdx) continue;
                    const sep = dist2(state.offense[k], state.defense[k]);
                    if (!checkPassLineBlocked(holder, state.offense[k], _scratchPassBlock).blocked && sep > bestOpen) {
                      bestOpen = sep;
                      bestIdx = k;
                    }
                  }
                  startPass(holderIdx, bestIdx);
                }
              }
              return;
            }

            updateDrillWeakSideMotion(dt, 2);
            return;
          }

          // 3) User on Defense! (def_onball, defense_help, def_cut, and 5v5 MATCH Defense!)
          if (state.playPhase !== "live") return;

          if (state.scenario === "def_onball") {
            updateDefenseOnBallDrillAI(dt);
          } else if (state.scenario === "def_cut") {
            updateDefenseStopCutDrillAI(dt);
          } else if (state.scenario === "match") {
            updateDefenseMatchCPUOffenseAI(dt);
          } else {
            updateDefenseHelpDrillAI(dt);
          }
        }

        /* Defense Drill 1: 1v1 On-Ball Dribbler AI (Hesitation -> Crossover -> Drive / Pull-up) */
        function updateDefenseOnBallDrillAI(dt) {
          const me = state.defense[0];
          const bh = state.offense[0];
          const dd = state.defDrill;
          dd.timer += dt;

          for (let i = 1; i < state.offense.length; i++) {
            moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.2, dt);
          }

          if (dd.phase === "probe") {
            const swayX = Math.sin(dd.timer * 3.0) * 1.75;
            moveAgentToward(bh, swayX, 7.85, 3.5, dt);
            bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);
            if (dd.timer >= 1.15) {
              dd.phase = "hesi_cross";
              dd.timer = 0;
              dd.driveSide = me.x >= bh.x ? -1 : 1; // Attack weak foot!
              spawnDust(bh.x, bh.y, 4);
              setCoachMessage("warn", "💨", "CROSSOVER! SLIDE!", 0.9);
            }
          } else if (dd.phase === "hesi_cross") {
            // If user over-sprinted far to the wrong side, brief ankle-stumble!
            if (!dd.fakeDone && keys.Shift && (me.x - bh.x) * dd.driveSide < -0.95) {
              dd.fakeDone = true;
              me.offBalanceTimer = 0.45;
              setCoachMessage("warn", "⚡", "FAKED! RECOVER!", 0.8);
            }
            const targetX = dd.driveSide * 2.15;
            const targetY = 3.2;
            moveAgentToward(bh, targetX, targetY, 4.65, dt);
            bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);

            // Check if user walled off the driving lane!
            const toRimX = COURT.rimX - bh.x;
            const toRimY = COURT.rimY - bh.y;
            const seg = pointToSegmentInfo(me.x, me.y, bh.x, bh.y, bh.x + toRimX, bh.y + toRimY, _scratchSeg);
            const cutOff = seg.projT > 0.05 && seg.projT < 0.75 && seg.dist < 1.15;

            if (cutOff && dd.timer > 0.45) {
              dd.phase = "pullup";
              dd.timer = 0;
              state.ball.gatherTimer = 0.85;
              setCoachMessage("good", "🖐️", "STOPPED! HANDS UP!", 0.8);
            } else if (hypot2(bh.x - COURT.rimX, bh.y - COURT.rimY) < 1.65 || dd.timer > 1.85) {
              dd.phase = "pullup";
              dd.timer = 0;
              state.ball.gatherTimer = 0.65;
              setCoachMessage("warn", "🚨", "HANDS UP! SPACE!", 0.6);
            }
          } else if (dd.phase === "pullup") {
            moveAgentToward(bh, bh.x, bh.y, 1.0, dt);
            bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);
            const dMe = dist2(me, bh);
            const meInFrontDrill = (me.x - bh.x) * (COURT.rimX - bh.x) + (me.y - bh.y) * (COURT.rimY - bh.y) > 0;
            if (dMe < 2.35 && me.contestTimer > 0 && meInFrontDrill) {
              state.ball.contestedByUser = true;
              startShot("offense", 0, false);
            } else if (dd.timer > 0.8) {
              const contested = dMe < 1.65 && me.contestTimer > 0 && meInFrontDrill;
              startShot("offense", 0, contested ? false : null);
            }
          }
        }

        /* Defense Drill 2: Help Triangle & Closeout */
        function updateDefenseHelpDrillAI(dt) {
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;
          const myDef = state.defense[0];
          const myMan = state.offense[0];
          const handler = state.offense[1];

          const hTargetX = -side * 2.2 + Math.sin(state.simTime * 1.6) * 0.9;
          const hTargetY = 7.4 - Math.min(1.6, state.simTime * 0.35);

          const distMeToBall = hypot2(myDef.x - handler.x, myDef.y - handler.y);
          const distMeToMan = hypot2(myDef.x - myMan.x, myDef.y - myMan.y);
          const distMeToIdeal = hypot2(myDef.x - state.helpTriangle.idealX, myDef.y - state.helpTriangle.idealY);
          state.helpTriangle.distToIdeal = distMeToIdeal;

          if (!state.ball.inFlight && state.ball.holderIdx === 1) {
            if (distMeToBall < 2.65 && distMeToMan > 3.6) {
              state.helpTriangle.mistakeTimer += dt;
              state.helpTriangle.mistakeType = "ball_watch";
              moveAgentToward(myMan, side * 1.6, 2.2, 5.2, dt);
              if (state.helpTriangle.mistakeTimer > 0.45) {
                state.helpTriangle.passTriggered = true;
                startPass(1, 0);
                setCoachMessage("warn", "👀", "BALL WATCH! RUN BACK!", 1.5);
              }
            } else if (distMeToMan < 1.35 && myDef.y > 1.5 && Math.abs(myDef.x) > 4.3 && state.simTime > 1.8) {
              state.helpTriangle.mistakeTimer += dt;
              state.helpTriangle.mistakeType = "no_help";
              moveAgentToward(handler, -side * 0.55, 2.05, 5.1, dt);
              if (hypot2(handler.x - COURT.rimX, handler.y - COURT.rimY) < 1.35) {
                startShot("offense", 1, null);
              }
              return;
            } else {
              state.helpTriangle.mistakeTimer = Math.max(0, state.helpTriangle.mistakeTimer - dt);
              moveAgentToward(handler, hTargetX, hTargetY, 3.0, dt);

              if (distMeToIdeal < 1.65) {
                state.helpTriangle.goodHoldTimer += dt;
                if (state.helpTriangle.goodHoldTimer > 1.8 && !state.helpTriangle.passTriggered) {
                  state.helpTriangle.passTriggered = true;
                  startPass(1, 0);
                  setCoachMessage("good", "🏃", "CLOSEOUT! SPACE!", 1.8);
                }
              }
              moveAgentToward(myMan, myMan.homeX + Math.sin(state.simTime * 2.1) * 0.4, myMan.homeY + Math.cos(state.simTime * 1.7) * 0.5, 2.6, dt);
            }
          } else if (!state.ball.inFlight && state.ball.holderIdx === 0) {
            state.phaseTimer += dt;
            state.ball.gatherTimer = 0.8;
            myMan.gazeAngle = Math.atan2(COURT.rimY - myMan.y, COURT.rimX - myMan.x);
            if (distMeToMan < 2.25 && myDef.contestTimer > 0) {
              state.ball.contestedByUser = true;
              startShot("offense", 0, false);
            } else if (state.phaseTimer > 1.65) {
              const closeEnough = distMeToMan < 1.55 && myDef.contestTimer > 0;
              startShot("offense", 0, closeEnough ? false : null);
            }
          }

          for (let i = 2; i < state.offense.length; i++) {
            moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.4, dt);
          }
        }

        /* Defense Drill 3: Stop Backdoor & V-Cut */
        function updateDefenseStopCutDrillAI(dt) {
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;
          const me = state.defense[0];
          const cutter = state.offense[0];
          const pg = state.offense[1];
          const dd = state.defDrill;
          dd.timer += dt;

          moveAgentToward(pg, side * 2.0 + Math.sin(state.simTime * 1.8) * 0.6, 8.2, 2.6, dt);
          pg.gazeAngle = Math.atan2(cutter.y - pg.y, cutter.x - pg.x);
          for (let i = 2; i < state.offense.length; i++) {
            moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.3, dt);
          }

          if (!state.ball.inFlight && state.ball.holderIdx === 1) {
            if (dd.cutStage >= 2) {
              dd.cutStage = 0;
              dd.timer = 0;
            }
            if (dd.cutStage === 0) {
              // Fake high step toward ball first!
              moveAgentToward(cutter, side * 4.8, 7.0, 2.5, dt);
              if (dd.timer >= 0.85) {
                dd.cutStage = 1;
                dd.timer = 0;
                spawnDust(cutter.x, cutter.y, 5);
                setCoachMessage("warn", "⚡", "BACKDOOR CUT! BLOCK IT!", 1.2);
              }
            } else if (dd.cutStage === 1) {
              // Sudden burst to the rim!
              const cutX = side * 1.1;
              const cutY = 2.15;
              moveAgentToward(cutter, cutX, cutY, 5.1, dt);

              const seg = pointToSegmentInfo(me.x, me.y, pg.x, pg.y, cutter.x, cutter.y, _scratchSeg);
              const bodyDenied = dist2(me, cutter) < 1.45 && me.y <= cutter.y + 0.6;
              const laneDenied = seg.projT > 0.2 && seg.projT < 0.95 && seg.dist < 1.05;

              if (hypot2(cutter.x - cutX, cutter.y - cutY) < 1.5 || dd.timer > 1.15) {
                if (bodyDenied || laneDenied) {
                  // Kid denied the cut! Passer forced to throw contested or reset -> Defense Wins!
                  state.ball.contestedByUser = true;
                  spawnSparkles(me.x, me.y, "#22c55e", 14);
                  state.matchScore.stops += 1;
                  state.playPhase = "celebrate";
                  state.phaseTimer = 0;
                  setCoachMessage("celebrate", "🛑", "CUT DENIED!!", 2.0);
                } else {
                  // Cutter got behind user -> pass thrown (kid can still try to steal or contest!)
                  dd.cutStage = 2;
                  startPass(1, 0);
                }
              }
            }
          } else if (!state.ball.inFlight && state.ball.holderIdx === 0) {
            state.phaseTimer += dt;
            state.ball.gatherTimer = 0.5;
            if (dist2(me, cutter) < 2.2 && me.contestTimer > 0) {
              state.ball.contestedByUser = true;
              startShot("offense", 0, false);
            } else if (state.phaseTimer > 0.65) {
              startShot("offense", 0, null);
            }
          }
        }

        /* Full 5v5 Match CPU Offense AI (Passes, Cuts, Drives, Kick-Outs & Jumpers!) */
        function updateDefenseMatchCPUOffenseAI(dt) {
          const diff = getDiffProfile();
          const spdMult = diff.cpuActionMult;
          const dd = state.defDrill;
          dd.timer += dt * spdMult;
          dd.actionTimer += dt * spdMult;
          dd.passTimer = (dd.passTimer || 0) + dt * spdMult;

          if (state.ball.inFlight) return;

          const holderIdx = state.ball.holderIdx;
          const holder = state.offense[holderIdx];
          const me = state.defense[0];

          // Off-ball movement: rotating backdoor cuts + Wing-Corner Exchange + V-Cut footwork!
          state.motion.redExchangeTimer += dt;
          if (state.motion.redExchangeTimer >= 2.2) {
            state.motion.redExchangeTimer = 0;
            state.motion.redExchangeFlip ^= 1;
          }
          if (dd.cutterIdx === -1 && dd.timer > 1.2) {
            dd.cutterIdx = (holderIdx + 2) % 5;
            if (dd.cutterIdx === holderIdx) dd.cutterIdx = (holderIdx + 1) % 5;
            dd.passTimer = 0;
          }

          for (let i = 0; i < state.offense.length; i++) {
            if (i === holderIdx) continue;
            const off = state.offense[i];
            if (i === dd.cutterIdx) {
              const cutX = off.homeX >= 0 ? 1.15 : -1.15;
              moveAgentToward(off, cutX, 2.15, 4.95 * spdMult, dt, false);
              if (hypot2(off.x - cutX, off.y - 2.15) < 1.35 || dd.passTimer > 2.0) {
                dd.cutterIdx = (dd.cutterIdx + 1) % 5;
                if (dd.cutterIdx === holderIdx) dd.cutterIdx = (dd.cutterIdx + 1) % 5;
                dd.passTimer = 0;
              }
            } else {
              let baseX = off.homeX;
              let baseY = off.homeY;
              if (state.motion.redExchangeFlip === 1) {
                if (i === 3 && holderIdx !== 4) {
                  baseX = state.offense[4].homeX;
                  baseY = state.offense[4].homeY;
                } else if (i === 4 && holderIdx !== 3) {
                  baseX = state.offense[3].homeX;
                  baseY = state.offense[3].homeY;
                }
              }
              const ph = state.simTime * 3.0 + i * 1.55;
              moveAgentToward(
                off,
                clamp(baseX + Math.cos(ph) * 1.05, -6.65, 6.65),
                clamp(baseY + Math.sin(ph * 1.1) * 0.95, 1.8, 9.4),
                3.85 * spdMult,
                dt
              );
            }
