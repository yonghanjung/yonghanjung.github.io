        function drawArenaScoreboardHUD(ctx, W) {
          const youStr = String(state.matchScore.you).padStart(2, "0");
          const cpuStr = String(state.matchScore.cpu).padStart(2, "0");
          const targ = state.matchScore.target;
          const subTag =
            state.matchScore.winner === "you" ? "🏆 WIN!" : state.matchScore.winner === "cpu" ? "FINAL" : targ > 0 ? "TO " + targ : "FREE";

          const boxW = 216;
          const boxH = 26;
          const x = (W - boxW) * 0.5;
          const y = 6;

          ctx.save();
          ctx.fillStyle = "rgba(9, 13, 22, 0.92)";
          ctx.strokeStyle = state.matchScore.winner ? "#facc15" : "#38bdf8";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.roundRect(x, y, boxW, boxH, 8);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = "center";
          ctx.font = '900 10.5px "SF Pro Rounded", "Segoe UI", sans-serif';
          ctx.fillStyle = "#93c5fd";
          ctx.fillText("YOU", x + 26, y + 17);

          ctx.font = '900 15px ui-monospace, "SF Mono", Menlo, monospace';
          ctx.fillStyle = state.matchScore.youPopTimer > 0 ? "#fde047" : "#ffffff";
          ctx.fillText(youStr, x + 62, y + 18);

          ctx.font = '900 9.5px "SF Pro Rounded", "Segoe UI", sans-serif';
          ctx.fillStyle = "#fde047";
          ctx.fillText(subTag, x + boxW * 0.5, y + 16.5);

          ctx.font = '900 15px ui-monospace, "SF Mono", Menlo, monospace';
          ctx.fillStyle = state.matchScore.cpuPopTimer > 0 ? "#fde047" : "#ffffff";
          ctx.fillText(cpuStr, x + boxW - 62, y + 18);

          ctx.font = '900 10.5px "SF Pro Rounded", "Segoe UI", sans-serif';
          ctx.fillStyle = "#fca5a5";
          ctx.fillText("CPU", x + boxW - 26, y + 17);
          ctx.restore();
        }

        function drawPauseOverlayPill(ctx, W) {
          const text = "⏸ PAUSED (PRESS P)";
          ctx.save();
          ctx.font = "900 13.5px sans-serif";
          const tw = ctx.measureText(text).width + 28;
          const x = (W - tw) * 0.5;
          ctx.fillStyle = "#facc15";
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.roundRect(x, 8, tw, 28, 999);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#0f172a";
          ctx.textAlign = "center";
          ctx.fillText(text, W * 0.5, 26.5);
          ctx.restore();
        }

          if (curMoveMask !== 0 && !isBoardInputActive() && preset !== prevPreset) {

          if (preset !== "fps") {

          const smoothThirdPersonSwap = prevPreset !== "fps" && preset !== "fps" && prevPreset !== preset;

          state.cam.fpsManualYawOffset = 0;

          setCameraPreset(order[(cur + 1) % order.length]);

            if (state.viewMode !== "b") state.inputSurface = "3d";
            updateCamera(0, true);
            updatePassTarget();
            syncAllDOM();
            renderFrame();

          state.cam.preset = "free";
          state.cam.targetYaw = wrapAngle(state.cam.yaw + deltaRad);
          state.cam.yaw = state.cam.targetYaw;
          if (state.viewMode !== "b") state.inputSurface = "3d";
          updateCamera(0, true);
          updatePassTarget();
          syncAllDOM();
          renderFrame();

            const wasFullCourt = state.fullCourt;
            state.appMode = "practice";
            state.fullCourt = false;
            state.showHints = true;
            state.role = state.practiceRole || "offense";
            state.mainMode = state.role;
            if (wasFullCourt) {
              if (state.cam.preset !== "fps") state.cam.preset = "auto";
              if (state.viewMode !== "b") state.inputSurface = "3d";
            }
            state.scenario = state.role === "defense" ? state.lastDefenseScenario || "def_onball" : state.lastOffenseScenario || "relocation";
            resetScenario();
            renderFrame();
            return;
          }
          if (mode === "game") {
            setGameType(state.gameType || "full_court");
          }
        }

        function setGameType(gType) {
          if (gType === "full_court") {
            const modeChanged = state.appMode !== "game" || !state.fullCourt || !!state.matchScore.winner;
            state.appMode = "game";
            state.gameType = "full_court";
            state.mainMode = "full_court";
            state.fullCourt = true;
            state.role = "offense";
            state.scenario = "full_court";
            if (state.cam.preset !== "fps") state.cam.preset = "auto";
            if (state.viewMode !== "b") state.inputSurface = "3d";
            if (modeChanged) resetMatchScores();
            resetScenario();
            renderFrame();
            return;
          }
          if (gType === "half_court") {
            const wasFullCourt = state.fullCourt;
            const modeChanged = state.appMode !== "game" || wasFullCourt || state.scenario !== "match" || !!state.matchScore.winner;
            state.appMode = "game";
            state.gameType = "half_court";
            state.fullCourt = false;
            state.scenario = "match";
            if (state.matchFlow === "defense_only") state.role = "defense";
            else if (state.matchFlow === "offense_only") state.role = "offense";
            else state.role = state.matchOriginRole || "offense";
            state.mainMode = state.role;
            if (wasFullCourt) {
              if (state.cam.preset !== "fps") state.cam.preset = "auto";
              if (state.viewMode !== "b") state.inputSurface = "3d";
            }
            if (modeChanged) resetMatchScores();
            resetScenario();
            renderFrame();
          }
        }

        function setMainMode(mode) {
          if (mode === "full_court" || mode === "game") {
            setGameType("full_court");
            return;
          }
          if (mode === "practice") {
            setAppMode("practice");
            return;
          }
          if (mode === "offense" || mode === "defense") {
            setRole(mode);
          }
        }

        function setRole(role) {
          if (role !== "offense" && role !== "defense") return;
          const wasFullCourt = state.fullCourt;
          state.appMode = "practice";
          state.practiceRole = role;
          state.fullCourt = false;
          state.mainMode = role;
          state.role = role;
          if (wasFullCourt) {
            if (state.cam.preset !== "fps") state.cam.preset = "auto";
            if (state.viewMode !== "b") state.inputSurface = "3d";
          }
          state.scenario = role === "defense" ? state.lastDefenseScenario || "def_onball" : state.lastOffenseScenario || "relocation";
          resetScenario();
          renderFrame();
        }

        function setScenario(scenario, explicitRole) {
          if (!SCENARIO_META[scenario]) return;
          if (scenario === "full_court") {
            setGameType("full_court");
            return;
          }
          if (scenario === "match") {
            const wasFullCourt = state.fullCourt;
            const wasMatch = state.appMode === "game" && state.scenario === "match" && !wasFullCourt;
            state.appMode = "game";
            state.gameType = "half_court";
            state.fullCourt = false;
            state.scenario = "match";
            if (wasFullCourt) {
              if (state.cam.preset !== "fps") state.cam.preset = "auto";
              if (state.viewMode !== "b") state.inputSurface = "3d";
            }
            if (!wasMatch || state.matchScore.winner) {
              resetMatchScores();
            }
            if (explicitRole === "offense" || explicitRole === "defense") {
              state.role = explicitRole;
            }
            state.matchOriginRole = state.role;
            state.mainMode = state.role;
            resetScenario();
            renderFrame();
            return;
          }

          const wasFullCourt = state.fullCourt;
          state.appMode = "practice";
          state.fullCourt = false;
          state.scenario = scenario;
          if (wasFullCourt) {
            if (state.cam.preset !== "fps") state.cam.preset = "auto";
            if (state.viewMode !== "b") state.inputSurface = "3d";
          }
          state.role = SCENARIO_META[scenario].role;
          state.practiceRole = state.role;
          if (scenario === "tutorial" || scenario === "learn_d") {
            state.tutorial.step = 1;
            state.tutorial.completedSteps = { 1: false, 2: false, 3: false, 4: false };
          } else if (state.role === "offense") {
            state.lastOffenseScenario = scenario;
          } else {
            state.lastDefenseScenario = scenario;
          }
          state.mainMode = state.role;
          resetScenario();
          renderFrame();
        }

        function setMatchFlow(flow) {
          if (flow === "stay") {
            flow = state.role === "defense" ? "defense_only" : "offense_only";
          }
          if (flow !== "two_way" && flow !== "offense_only" && flow !== "defense_only") return;
          state.matchFlow = flow;
          if (state.appMode === "game" && !state.fullCourt && state.scenario === "match") {
            const targetRole = flow === "defense_only" ? "defense" : flow === "offense_only" ? "offense" : state.role;
            if (targetRole !== state.role) {
              state.role = targetRole;
              state.matchOriginRole = targetRole;
              state.mainMode = targetRole;
              resetScenario();
              renderFrame();
              return;
            }
          }
          syncAllDOM();
        }

        function setStartSpot(spotKey) {
          if (!START_SPOTS[spotKey]) return;
          state.startSpot = spotKey;
          resetScenario();
          renderFrame();
        }

        function setSpeed(mult) {
          state.speedScale = mult;
          syncAllDOM();
        }

        function togglePause() {
          state.paused = !state.paused;
          syncAllDOM();
          renderFrame();
        }

        function applyKeyCodeState(code, isDown) {
          if (code === "KeyW" || code === "ArrowUp") keys.W = isDown;
          else if (code === "KeyS" || code === "ArrowDown") keys.S = isDown;
          else if (code === "KeyA" || code === "ArrowLeft") keys.A = isDown;
          else if (code === "KeyD" || code === "ArrowRight") keys.D = isDown;
          else if (code === "ShiftLeft" || code === "ShiftRight") keys.Shift = isDown;
          updatePassTarget();
          syncKeycapsDOM();
        }

        window.addEventListener(
          "pointerdown",
          () => {
            if (state.soundEnabled) SoundEngine.unlock();
          },
          { passive: true }
        );

        window.addEventListener("keydown", (e) => {
          if (["Space", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
            e.preventDefault();
          }
          if (state.soundEnabled && e.code !== "KeyM") SoundEngine.unlock();
          applyKeyCodeState(e.code, true);

          if (e.repeat) return;
          if (e.code === "Space") handleSpaceAction();
          else if (e.code === "KeyE") handleSecondaryAction();
          else if (e.code === "Digit1" || e.code === "Numpad1") executeUserPass(1);
          else if (e.code === "Digit2" || e.code === "Numpad2") executeUserPass(2);
          else if (e.code === "Digit3" || e.code === "Numpad3") executeUserPass(3);
          else if (e.code === "Digit4" || e.code === "Numpad4") executeUserPass(4);
          else if (e.code === "KeyV") toggleFpsCamera();
          else if (e.code === "KeyQ") rotateCameraBy(-Math.PI / 6);
          else if (e.code === "KeyC") rotateCameraBy(Math.PI / 6);
          else if (e.code === "Minus" || e.code === "NumpadSubtract") adjustUserZoom(-0.12);
          else if (e.code === "Equal" || e.code === "NumpadAdd") adjustUserZoom(0.12);
          else if (e.code === "Digit0" || e.code === "Numpad0") setUserZoom(1.0);
          else if (e.code === "KeyM") toggleSound();
          else if (e.code === "KeyP") togglePause();
          else if (e.code === "KeyR") {
            if (state.playPhase === "match_over") startNewMatchGame();
            else {
              resetScenario();
              renderFrame();
            }
          } else if (e.code === "Tab") cycleViewMode();
        });

        window.addEventListener("keyup", (e) => {
          applyKeyCodeState(e.code, false);
        });

        function resetHeldInputState() {
          keys.W = keys.A = keys.S = keys.D = keys.Shift = false;
          if (state.cam) {
            state.cam.latchedInputMask = 0;
            state.cam.dragging = false;
          }
          canvasA.classList.remove("dragging");
          updatePassTarget();
          syncKeycapsDOM();
        }

        window.addEventListener("blur", resetHeldInputState);
        window.addEventListener("contextmenu", resetHeldInputState);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) resetHeldInputState();
        });

        window.addEventListener("resize", () => {
          resizeCanvases();
          renderFrame();
        });

        // Horizontal Pointer Drag on canvasA to Orbit 3D Camera 360 Degrees (Even While Paused!)
        canvasA.addEventListener("pointerdown", (ev) => {
          if (state.viewMode !== "b") setInputSurface("3d");
          state.cam.dragging = true;
          state.cam.dragLastX = ev.clientX;
          state.cam.dragLastY = ev.clientY || 0;
          canvasA.classList.add("dragging");
          if (canvasA.setPointerCapture) {
            try {
              canvasA.setPointerCapture(ev.pointerId);
            } catch (_) {}
          }
        });

        const panelAEl = DOM.panelA;
        const panelBEl = DOM.panelB;
        if (panelAEl) {
          panelAEl.addEventListener("pointerdown", (ev) => {
            const tgt = ev && ev.target;
            if (tgt === canvasA || (tgt && tgt.closest && tgt.closest("button"))) return;
            if (state.viewMode === "both") setInputSurface("3d");
          });
        }
        if (panelBEl) {
          panelBEl.addEventListener("pointerdown", (ev) => {
            const tgt = ev && ev.target;
            if (tgt === canvasB || (tgt && tgt.closest && tgt.closest("button"))) return;
            if (state.viewMode === "both") setInputSurface("board");
          });
        }
        canvasB.addEventListener("pointerdown", () => {
          if (state.viewMode === "both") setInputSurface("board");
        });
        canvasA.addEventListener("pointermove", (ev) => {
          if (!state.cam.dragging) return;
          const dx = ev.clientX - state.cam.dragLastX;
          const dy = (ev.clientY || 0) - (state.cam.dragLastY || 0);
          state.cam.dragLastX = ev.clientX;
          state.cam.dragLastY = ev.clientY || 0;
          if (state.cam.preset === "fps") {
            if (Math.abs(dx) > 0.2 || Math.abs(dy) > 0.2) {
              state.cam.fpsManualYawOffset = clamp((state.cam.fpsManualYawOffset || 0) - dx * 0.0075, -1.35, 1.35);
              state.cam.fpsManualPitchOffset = clamp((state.cam.fpsManualPitchOffset || 0) - dy * 0.0055, -0.16, 0.16);
              updateCamera(0, true);
              syncAllDOM();
              renderFrame();
            }
            return;
          }
          if (Math.abs(dx) > 0.2) {
            state.cam.preset = "free";
            state.cam.lastThirdPersonPreset = "auto";
            state.cam.targetYaw = wrapAngle(state.cam.yaw - dx * 0.0085);
            state.cam.yaw = state.cam.targetYaw;
            updateCamera(0, true);
            syncAllDOM();
            renderFrame();
          }
        });
        const endCamDrag = () => {
          state.cam.dragging = false;
          canvasA.classList.remove("dragging");
        };
        canvasA.addEventListener("pointerup", endCamDrag);
        canvasA.addEventListener("pointercancel", endCamDrag);
        canvasA.addEventListener("lostpointercapture", endCamDrag);
        canvasA.addEventListener(
          "wheel",
          (ev) => {
            if (ev.preventDefault) ev.preventDefault();
            adjustUserZoom(ev.deltaY < 0 ? 0.08 : -0.08);
          },
          { passive: false }
        );

        function bindClick(el, fn) {
          if (!el) return;
          el.addEventListener("click", (ev) => {
            fn(ev);
            el.blur();
          });
        }

        bindClick(document.getElementById("btnAppPractice"), () => setAppMode("practice"));
        bindClick(document.getElementById("btnAppGame"), () => setAppMode("game"));
        bindClick(document.getElementById("btnModeFullCourt"), () => setGameType("full_court"));
        bindClick(document.getElementById("btnGameHalfCourt"), () => setGameType("half_court"));
        bindClick(document.getElementById("btnRoleOffense"), () => setRole("offense"));
        bindClick(document.getElementById("btnRoleDefense"), () => setRole("defense"));
        bindClick(document.getElementById("btnFlowTwoWay"), () => setMatchFlow("two_way"));
        bindClick(document.getElementById("btnFlowOffOnly"), () => setMatchFlow("offense_only"));
        bindClick(document.getElementById("btnFlowDefOnly"), () => setMatchFlow("defense_only"));

        document.querySelectorAll(".view-mode-btn").forEach((btn) => {
          bindClick(btn, () => setViewMode(btn.getAttribute("data-view")));
        });

        document.querySelectorAll(".diff-btn").forEach((btn) => {
          bindClick(btn, () => setDifficulty(btn.getAttribute("data-diff")));
        });

        document.querySelectorAll(".cam-btn").forEach((btn) => {
          bindClick(btn, () => setCameraPreset(btn.getAttribute("data-cam")));
        });
        bindClick(document.getElementById("btnCamLeft"), () => rotateCameraBy(-Math.PI / 6));
        bindClick(document.getElementById("btnCamRight"), () => rotateCameraBy(Math.PI / 6));
        bindClick(document.getElementById("btnZoomOut"), () => adjustUserZoom(-0.12));
        bindClick(document.getElementById("btnZoomIn"), () => adjustUserZoom(0.12));
        bindClick(document.getElementById("btnSoundToggle"), () => toggleSound());

        document.querySelectorAll(".scenario-btn").forEach((btn) => {
          bindClick(btn, () => setScenario(btn.getAttribute("data-scenario"), btn.getAttribute("data-side")));
        });

        document.querySelectorAll(".spot-btn").forEach((btn) => {
          bindClick(btn, () => setStartSpot(btn.getAttribute("data-spot")));
        });

        document.querySelectorAll(".tut-step-pill").forEach((pill) => {
          bindClick(pill, () => setTutorialStep(parseInt(pill.getAttribute("data-tut-step"), 10)));
        });

        bindClick(document.getElementById("btnTutPrev"), () => {
          setTutorialStep(Math.max(1, state.tutorial.step - 1));
        });
        bindClick(document.getElementById("btnTutNext"), () => {
          setTutorialStep(Math.min(4, state.tutorial.step + 1));
        });
        bindClick(document.getElementById("btnTutFinishToMain"), () => {
          setMainMode("full_court");
        });

        bindClick(document.getElementById("btnHintToggle"), () => {
          state.showHints = !state.showHints;
          syncAllDOM();
          renderFrame();
        });

        document.querySelectorAll(".target-btn").forEach((btn) => {
          bindClick(btn, () => setTargetScore(btn.getAttribute("data-target")));
        });
        bindClick(document.getElementById("btnNewMatch"), () => startNewMatchGame());
        bindClick(document.getElementById("btnRematchWin"), () => startNewMatchGame());

        bindClick(document.getElementById("btnPause"), () => togglePause());
        bindClick(document.getElementById("btnReset"), () => {
          if (state.fullCourt || state.scenario === "match") {
            startNewMatchGame();
            return;
          }
          resetScenario();
          renderFrame();
        });
        bindClick(DOM.keycapSpace, () => handleSpaceAction());
        bindClick(DOM.keycapE, () => handleSecondaryAction());
        bindClick(DOM.keycapV, () => toggleFpsCamera());

        document.querySelectorAll("[data-hold]").forEach((btn) => {
          const code = btn.getAttribute("data-hold");
          const press = (ev) => {
            ev.preventDefault();
            applyKeyCodeState(code, true);
          };
          const release = (ev) => {
            ev.preventDefault();
            applyKeyCodeState(code, false);
          };
          btn.addEventListener("pointerdown", press);
          btn.addEventListener("pointerup", release);
          btn.addEventListener("pointerleave", release);
          btn.addEventListener("pointercancel", release);
        });

        /* =====================================================================
         * 12. Main Loop & Deterministic Verification Interface
         * ===================================================================== */
        function renderFrame() {
          renderPseudo3DA();
          renderTopDownB();
        }

        function getOrBakePlayerStackTile() {
          return null;
        }

        function bakePlayerStackPixels(playerObj, poseName, angleIdx) {
          return {
            width: STACK_W,
            height: STACK_H,
            sliceCount: 0,
            angleIdx: (((angleIdx || 0) % STACK_ANGLES) + STACK_ANGLES) % STACK_ANGLES,
            pixels: null,
          };
        }

        function getCachedStackStats() {
          return {
            initialBakeMs: 0,
            cachedFrames: 0,
            cachedModels: 0,
            ballSpinFrames: 0,
            stackLayers: STACK_LAYERS,
            stackAngles: STACK_ANGLES,
          };
        }

        setDifficulty("easy");
        resetScenario();
        renderFrame();

        let lastTs = performance.now();
        function frameLoop(now) {
          const dt = Math.max(0, (now - lastTs) / 1000);
          lastTs = now;
          stepSimulation(dt);
          renderFrame();
          requestAnimationFrame(frameLoop);
        }
        requestAnimationFrame(frameLoop);

        window.SpacingCoach = {
          COURT,
          DIFFICULTY_PROFILES,
          CAMERA_PRESETS,
          SoundEngine,
          toggleSound,
          SPR_W,
          SPR_H,
          STACK_W,
          STACK_H,
          STACK_LAYERS,
          STACK_ANGLES,
          state,
          keys,
          setAppMode,
          setGameType,
          setMainMode,
          setRole,
          setScenario,
          setTutorialStep,
          setMatchFlow,
          setTargetScore,
          startNewMatchGame,
          resetMatchScores,
          setStartSpot,
          setViewMode,
          setInputSurface,
          getBoardInputYaw,
          getActiveInputYaw,
          isBoardInputActive,
          setDifficulty,
          setCameraPreset,
          toggleFpsCamera,
          cycleCameraPreset,
          rotateCameraBy,
          createFirstPersonProjector,
          drawFirstPersonViewmodel,
          renderFirstPersonCourtA,
          getEffectiveZoom,
          setUserZoom,
          adjustUserZoom,
          getUserAssignedOffenseMan,
          computeLooseBallDropSpot,
          measurePlayerScreenHeight,
          measureFpsPlayerProportions,
          setSpeed,
          togglePause,
          resetScenario,
          stepSimulation,
          handleSpaceAction,
          handleSecondaryAction,
          handleManualPassRequest: handleSecondaryAction,
          executeUserPass,
          startTeamPass,
          updatePassTarget,
          switchDefenderToBall,
          isUserOnDefenseNow,
          isOpponentTeamSide,
          tickAllPlayerTimers,
          getPlayerPhysicalWeight,
          resolvePlayerCollisionsAndJostling,
          spawnRimBounceLooseBall,
          awardLooseBallRebound,
          classifyShotZone,
          computeShotMakeOutcome,
          startShot,
          solveTwoBoneIK3D,
          solvePlayerRig3D,
          facingToStackAngleIdx,
          getOrBakePlayerStackTile,
          bakePlayerStackPixels,
          getCachedStackStats,
          project3D,
          resolveLabelCollisions,
          renderFrame,
          clamp,
          worldDirFromScreenInput,
          pointToSegmentInfo,
          _scratchDir,
          _scratchSeg,
          DOM,
          DOM_CACHE,
          refreshDOMRegistry,
          setCoachMessage,
          syncCoachDOM,
          syncKeycapsDOM,
          syncLiveBadgesDOM,
          syncAllDOM,
        };
      })();
    </script>
  </body>
</html>
