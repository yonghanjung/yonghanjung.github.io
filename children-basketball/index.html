            quadTo(h0x, h0y, hMx, hMy, h1x, h1y);
            ctx.stroke();
            ctx.restore();

            // 3) Crisp Perpendicular ★ YOU Team + Gold Athletic Wrist Sweatband Cuff!
            ctx.save();
            ctx.translate(wristX, wristY);
            ctx.rotate(ang);
            ctx.fillStyle = jerseyBand;
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2.0;
            ctx.beginPath();
            ctx.roundRect(-rWrist * 0.62, -rWrist * 1.16, rWrist * 1.24, rWrist * 2.32, rWrist * 0.36);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = trimCol;
            ctx.beginPath();
            ctx.roundRect(-rWrist * 0.18, -rWrist * 1.1, rWrist * 0.36, rWrist * 2.2, 2.0);
            ctx.fill();
            ctx.restore();
          };

          const drawVMBasketball = (bx, by, rBall) => {
            ctx.save();
            ctx.beginPath();
            ctx.arc(bx, by, rBall, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.42)";
            ctx.lineWidth = 3.2;
            ctx.stroke();
            ctx.fillStyle = "#ea580c";
            ctx.fill();

            ctx.fillStyle = "#fb923c";
            ctx.beginPath();
            ctx.arc(bx - rBall * 0.24, by - rBall * 0.24, rBall * 0.58, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fed7aa";
            ctx.beginPath();
            ctx.arc(bx - rBall * 0.34, by - rBall * 0.34, rBall * 0.22, 0, Math.PI * 2);
            ctx.fill();

            const sp = state.ball.spinPhase;
            ctx.strokeStyle = "#271206";
            ctx.lineWidth = Math.max(1.8, rBall * 0.11);
            ctx.beginPath();
            ctx.ellipse(bx, by, rBall * 0.93, Math.max(2.0, Math.abs(Math.sin(sp)) * rBall * 0.88), 0.22, 0, Math.PI * 2);
            ctx.moveTo(bx - rBall * 0.93, by);
            ctx.lineTo(bx + rBall * 0.93, by);
            ctx.stroke();

            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.arc(bx, by, rBall, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          };

          const rootLX = W * 0.14 + swayX * 0.5;
          const rootLY = H + 26;
          const rootRX = W * 0.86 + swayX * 0.5;
          const rootRY = H + 26;

          // 1) Jumpshot / Layup Gooseneck Follow-Through!
          if ((me.shootFollowTimer || 0) > 0 && (me.contestTimer || 0) <= 0) {
            const u = clamp(me.shootFollowTimer / 0.85, 0, 1);
            const lift = Math.sin(Math.min(1, u * 1.25) * Math.PI * 0.5);
            drawVMForearmAndHand(rootLX, rootLY, W * 0.29, H * (0.76 - lift * 0.14), W * 0.41, H * (0.56 - lift * 0.18), -1, "open");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.7, H * (0.72 - lift * 0.18), W * 0.56, H * (0.48 - lift * 0.18), 1, "gooseneck");
            return;
          }

          // 2) Two-Hand High Rebound Snatch / Vertical Shot Block Contest!
          if ((me.reboundReachTimer || 0) > 0 || (me.contestTimer || 0) > 0) {
            drawVMForearmAndHand(rootLX, rootLY, W * 0.26, H * 0.62, W * 0.37, H * 0.25, -1, "open");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.74, H * 0.62, W * 0.63, H * 0.25, 1, "open");
            return;
          }

          // 2b) Disciplined Two-Arm Chest/Shoulder WALL UP! Defense Stance (center reticle unobstructed!)
          if ((me.wallUpTimer || 0) > 0) {
            drawVMForearmAndHand(rootLX, rootLY, W * 0.24, H * 0.68, W * 0.33, H * 0.39, -1, "open");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.76, H * 0.68, W * 0.67, H * 0.39, 1, "open");
            return;
          }

          // 3) Two-Hand Chest Pass Snap!
          if ((me.passPoseTimer || 0) > 0 && !userDefNow) {
            drawVMForearmAndHand(rootLX, rootLY, W * 0.28, H * 0.75, W * 0.41, H * 0.52, -1, "pass");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.72, H * 0.75, W * 0.59, H * 0.52, 1, "pass");
            return;
          }

          // 4) On-Ball Steal Poke Lunge!
          if ((me.stealLungeTimer || 0) > 0) {
            drawVMForearmAndHand(rootLX, rootLY, W * 0.19, H * 0.84, W * 0.25, H * 0.72, -1, "open");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.73, H * 0.72, W * 0.55, H * 0.49, 1, "open");
            return;
          }

          // 5) On-Ball Live Dribble, Gather, Crossover & Contact Off-Arm Protect Bar!
          if (iHaveBall) {
            if (state.ball.gatherTimer > 0) {
              const rB = clamp(unit * 0.125, 34, 58);
              const bx = W * 0.52 + swayX * 0.4;
              const by = H * 0.66 + swayY * 0.4;
              drawVMBasketball(bx, by, rB);
              drawVMForearmAndHand(rootLX, rootLY, W * 0.3, H * 0.82, bx - rB * 0.88, by + rB * 0.1, -1, "open");
              drawVMForearmAndHand(rootRX, rootRY, W * 0.74, H * 0.82, bx + rB * 0.78, by + rB * 0.22, 1, "dribble");
              return;
            }

            if (state.rhythm.crossoverTimer > 0) {
              const uC = 1.0 - clamp(state.rhythm.crossoverTimer / 0.72, 0, 1);
              const cDir = state.rhythm.crossoverDir || 1;
              const sweep = -Math.cos(uC * Math.PI) * cDir;
              const bx = W * (0.5 + sweep * 0.23);
              const by = H * (0.74 + Math.sin(uC * Math.PI) * 0.11);
              const rB = clamp(unit * 0.112, 30, 52);

              ctx.save();
              ctx.strokeStyle = "rgba(56, 189, 248, 0.42)";
              ctx.lineWidth = rB * 0.55;
              ctx.lineCap = "round";
              ctx.beginPath();
              const cStartX = W * (0.5 - cDir * 0.23);
              const cStartY = H * 0.74;
              ctx.moveTo(cStartX, cStartY);
              quadTo(cStartX, cStartY, W * 0.5, H * 0.88, bx, by);
              ctx.stroke();
              ctx.restore();

              drawVMBasketball(bx, by, rB);
              drawVMForearmAndHand(rootLX, rootLY, W * 0.25, H * 0.84, lerp(W * 0.26, bx - rB * 0.55, 0.55), by - rB * 0.45, -1, "dribble");
              drawVMForearmAndHand(rootRX, rootRY, W * 0.75, H * 0.84, lerp(W * 0.74, bx + rB * 0.55, 0.55), by - rB * 0.45, 1, "dribble");
              return;
            }

            const dHand = (me.dribbleHand || 1) >= 0 ? 1 : -1;
            const uB = state.ball.prevBouncePhase || 0;
            const parabola = 1.0 - 4.0 * (uB - 0.5) * (uB - 0.5);
            const rB = clamp(unit * (0.094 + parabola * 0.026), 27, 54);
            const dribX = W * (0.5 + dHand * 0.24) + swayX * 0.6;
            const ballY = lerp(H * 0.91, H * 0.69, parabola) + swayY * 0.4;
            const handY = lerp(H * 0.78, H * 0.62, parabola) + swayY * 0.4;

            drawVMBasketball(dribX, ballY, rB);

            if (dHand > 0) {
              if (cStrength > 0.05) {
                drawVMForearmAndHand(rootLX, rootLY, W * 0.2, H * 0.74, W * 0.38, H * 0.6, -1, "open");
              } else {
                drawVMForearmAndHand(rootLX, rootLY, W * 0.19, H * 0.85, W * 0.26 + swayX * 0.4, H * 0.74 + swayY * 0.5, -1, "open");
              }
              drawVMForearmAndHand(rootRX, rootRY, W * 0.8, H * 0.82, dribX + rB * 0.12, handY, 1, "dribble");
            } else {
              drawVMForearmAndHand(rootLX, rootLY, W * 0.2, H * 0.82, dribX - rB * 0.12, handY, -1, "dribble");
              if (cStrength > 0.05) {
                drawVMForearmAndHand(rootRX, rootRY, W * 0.8, H * 0.74, W * 0.62, H * 0.6, 1, "open");
              } else {
                drawVMForearmAndHand(rootRX, rootRY, W * 0.81, H * 0.85, W * 0.74 + swayX * 0.4, H * 0.74 + swayY * 0.5, 1, "open");
              }
            }
            return;
          }

          // 6) Wide Box-Out Seal, Off-Ball Open Target Hand, or Active Defense / Running Hands!
          if ((me.boxOutTimer || 0) > 0) {
            drawVMForearmAndHand(rootLX, rootLY, W * 0.24, H * 0.8, W * 0.14, H * 0.68, -1, "open");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.76, H * 0.8, W * 0.86, H * 0.68, 1, "open");
          } else if (!userDefNow && state.lane.open) {
            drawVMForearmAndHand(rootLX, rootLY, W * 0.2, H * 0.86, W * 0.24 + swayX, H * 0.76 + swayY, -1, "open");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.76, H * 0.76, W * 0.68, H * 0.54 + swayY * 0.4, 1, "open");
          } else if (userDefNow) {
            const defSway = Math.sin(state.simTime * 5.2) * 5.0;
            drawVMForearmAndHand(rootLX, rootLY, W * 0.19, H * 0.82, W * 0.23, H * 0.66 + defSway, -1, "open");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.81, H * 0.82, W * 0.77, H * 0.68 - defSway, 1, "open");
          } else {
            const pump = Math.sin(ph) * clamp(spd * 3.8, 0, 18);
            drawVMForearmAndHand(rootLX, rootLY, W * 0.19, H * 0.88, W * 0.23, H * 0.79 - pump, -1, "open");
            drawVMForearmAndHand(rootRX, rootRY, W * 0.81, H * 0.88, W * 0.77, H * 0.79 + pump, 1, "open");
          }
        }

        // Shared (7x15) Parquet Grid & Zero-Alloc Render Scratch Buffers
        const _PARQUET_BATCH_COLS = ["#f3cb8f", "#e8ba75", "#e0b069"];
        const _CROWD_PALETTE = ["#3b82f6", "#ef4444", "#facc15", "#22c55e", "#f8fafc", "#fb923c"];
        const _floorCamGrid = new Array(105);
        const _floorScrGrid = new Array(105);
        for (let i = 0; i < 105; i++) {
          _floorCamGrid[i] = { x: 0, y: 0, z: 1 };
          _floorScrGrid[i] = { x: 0, y: 0, z: 1, scale: 1 };
        }
        const _fpScratchC0 = { x: 0, y: 0, z: 1 };
        const _fpScratchC1 = { x: 0, y: 0, z: 1 };
        const _fpScratchC2 = { x: 0, y: 0, z: 1 };
        const _fpScratchC3 = { x: 0, y: 0, z: 1 };
        const _fpScratchSeg = [
          { x: 0, y: 0, z: 1, scale: 1 },
          { x: 0, y: 0, z: 1, scale: 1 },
        ];
        const _fpScratchQuad = [_fpScratchC0, _fpScratchC1, _fpScratchC2, _fpScratchC3];
        const _fpScratchRingCam = new Array(32);
        for (let i = 0; i < 32; i++) _fpScratchRingCam[i] = { x: 0, y: 0, z: 1 };
        const _fpDropScratch = { x: 0, y: 0 };
        const _fpsOccupiedHudBoxes = [];
        const _fpsPendingFloorLabels = [];
        const _fpsDefenderOccluders = [];
        const _fpsEdgePills = [];
        let _prevMaxOppOffBal = 0;
        let _oopsBannerUntil = -1;

        function _checkOpponentContestsFront(me, rimX, rimY) {
          if (!me) return false;
          const dxRim = rimX - me.x;
          const dyRim = rimY - me.y;
          const dRim = Math.max(0.01, hypot2(dxRim, dyRim));
          const ux = dxRim / dRim;
          const uy = dyRim / dRim;
          for (let i = 0; i < state.defense.length; i++) {
            const d = state.defense[i];
            const dx = d.x - me.x;
            const dy = d.y - me.y;
            const dist = hypot2(dx, dy);
            if (dist <= 1.6) {
              const along = dx * ux + dy * uy;
              if (along > -0.15 && along < dRim + 0.35) return true;
            }
          }
          return false;
        }

        /* Full Kid Eye-Level First-Person 3D Arena, Court, 9 Players & HUD Renderer */
        function renderFirstPersonCourtA(W, H, sxR, syR) {
          const courtLen = getCourtLength();
          const fp = createFirstPersonProjector(W, H);
          const me = getControlledPlayer();
          const userDefNow = isUserOnDefenseNow();
          const isTutMode = !state.fullCourt && (state.scenario === "tutorial" || state.scenario === "learn_d");
          const camYawEquiv = wrapAngle(fp.yaw + Math.PI * 0.5);
          const iHaveBallNow =
            !userDefNow && !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;

          // Detect rising opponent ankle-breaker (OOPS!) for rising chime + 0.75s burst pill!
          if (state.simTime < _oopsBannerUntil - 1.2) _oopsBannerUntil = -1;
          let maxOppOffBal = 0;
          const oppArr = userDefNow ? state.defense : state.offense;
          // Opponents are defense when user is on offense/fullCourt-offense, or offense[1..] when userDefNow in fullCourt
          if (state.fullCourt) {
            for (let i = 0; i < state.defense.length; i++) {
              if ((state.defense[i].offBalanceTimer || 0) > maxOppOffBal) maxOppOffBal = state.defense[i].offBalanceTimer;
            }
          } else if (state.role === "offense") {
            for (let i = 0; i < state.defense.length; i++) {
              if ((state.defense[i].offBalanceTimer || 0) > maxOppOffBal) maxOppOffBal = state.defense[i].offBalanceTimer;
            }
          } else {
            for (let i = 0; i < state.offense.length; i++) {
              if ((state.offense[i].offBalanceTimer || 0) > maxOppOffBal) maxOppOffBal = state.offense[i].offBalanceTimer;
            }
          }
          if (maxOppOffBal > _prevMaxOppOffBal + 0.18) {
            _oopsBannerUntil = state.simTime + 0.75;
            if (state.soundEnabled && typeof SoundEngine.playOopsChime === "function") {
              SoundEngine.playOopsChime();
            }
          }
          _prevMaxOppOffBal = maxOppOffBal;

          // 1. Arena Ceiling, Rafters, Overhead Spotlight Beams & Horizon-Tracked Bleachers!
          const horY = clamp(fp.horizonScreenY, -H * 0.5, H * 1.25);
          ctxA.fillStyle = "#0c1528";
          ctxA.fillRect(0, 0, W, H);

          if (horY > 0) {
            const ceilH = Math.max(1, horY - 38 * syR);
            ctxA.fillStyle = "#0f1b33";
            ctxA.fillRect(0, ceilH * 0.34, W, Math.max(0, ceilH * 0.66));
            ctxA.fillStyle = "#142342";
            ctxA.fillRect(0, ceilH * 0.68, W, Math.max(0, ceilH * 0.32));

            // Batched Horizontal Steel Purlin Cross-Trusses (1 stroke instead of 3)
            ctxA.strokeStyle = "rgba(71, 85, 105, 0.36)";
            ctxA.lineWidth = 1.5;
            ctxA.beginPath();
            for (let b = 1; b <= 3; b++) {
              const py = ceilH * (b * 0.24);
              ctxA.moveTo(0, py);
              ctxA.lineTo(W, py);
            }
            ctxA.stroke();

            // Batched Stadium Roof Rafters & Volumetric Arena Spotlight Cones (3 calls instead of 24)
            const rafterShift = (((fp.yaw / (Math.PI * 2)) % 1) + 1) % 1;
            const endY = Math.max(0, horY - 38 * syR);
            const lampY = Math.max(10, ceilH * 0.28);
            const coneBotY = Math.min(H, horY + 18 * syR);
            const coneHalfW = 34 * sxR;

            ctxA.fillStyle = "rgba(254, 243, 199, 0.048)";
            ctxA.beginPath();
            for (let r = -1; r <= 6; r++) {
              const rx = ((r + rafterShift * 6) / 6) * W;
              const lampX = lerp(rx, W * 0.5, 0.16);
              ctxA.moveTo(lampX - 5, lampY);
              ctxA.lineTo(lampX + 5, lampY);
              ctxA.lineTo(lampX + coneHalfW, coneBotY);
              ctxA.lineTo(lampX - coneHalfW, coneBotY);
              ctxA.closePath();
            }
            ctxA.fill();

            ctxA.strokeStyle = "rgba(100, 116, 139, 0.46)";
            ctxA.lineWidth = 2.2;
            ctxA.beginPath();
            for (let r = -1; r <= 6; r++) {
              const rx = ((r + rafterShift * 6) / 6) * W;
              ctxA.moveTo(rx, 0);
              ctxA.lineTo(lerp(rx, W * 0.5, 0.28), endY);
            }
            ctxA.stroke();

            ctxA.fillStyle = "rgba(254, 249, 195, 0.82)";
            ctxA.beginPath();
            for (let r = -1; r <= 6; r++) {
              const rx = ((r + rafterShift * 6) / 6) * W;
              const lampX = lerp(rx, W * 0.5, 0.16);
              ctxA.moveTo(lampX + 3.8, lampY);
              ctxA.arc(lampX, lampY, 3.8, 0, Math.PI * 2);
            }
            ctxA.fill();

            // Cheering Crowd Bleacher Band Seated Just Above Horizon
            const standTop = Math.max(0, horY - 40 * syR);
            const standH = Math.max(0, horY - standTop);
            if (standH > 4) {
              ctxA.fillStyle = "#172554";
              ctxA.fillRect(0, standTop, W, standH);
              ctxA.fillStyle = "#1e293b";
              ctxA.fillRect(0, Math.max(0, standTop - 7 * syR), W, 7 * syR);
              const yawCrowdShift = Math.round((fp.yaw / (Math.PI * 2)) * 220);
              const cheerHop = state.fx.crowdCheerTimer > 0 ? Math.abs(Math.sin(state.simTime * 20)) * 3 * syR : 0;
              for (let row = 0; row < 2; row++) {
                const ry = standTop + 6 * syR + row * 13 * syR;
                if (ry > horY - 4) continue;
                for (let cx = 8 + row * 6; cx < W - 8; cx += 16) {
                  const cIdx = (((Math.floor(cx) + yawCrowdShift + row * 7) % 6) + 6) % 6;
                  ctxA.fillStyle = _CROWD_PALETTE[cIdx];
                  ctxA.fillRect(cx, ry + 3 * syR - cheerHop, 7, 6 * syR);
                }
              }
              ctxA.fillStyle = "#f1c27d";
              ctxA.beginPath();
              for (let row = 0; row < 2; row++) {
                const ry = standTop + 6 * syR + row * 13 * syR;
                if (ry > horY - 4) continue;
                for (let cx = 8 + row * 6; cx < W - 8; cx += 16) {
                  ctxA.rect(cx + 1.5, ry - cheerHop, 4, 3.5 * syR);
                }
              }
              ctxA.fill();
            }
          }

          if (horY < H) {
            ctxA.fillStyle = "#111c33";
            ctxA.fillRect(0, Math.max(0, horY), W, H - Math.max(0, horY));
          }

          // Clipped Floor Polygon & Clipped Line/Ring Helpers (Zero NaN / Zero Redundant Splits!)
          const fillFloorQuadFPS = (x0, y0, x1, y1, col) => {
            fp.worldToCam(x0, y0, 0, _fpScratchC0);
            fp.worldToCam(x1, y0, 0, _fpScratchC1);
            fp.worldToCam(x1, y1, 0, _fpScratchC2);
            fp.worldToCam(x0, y1, 0, _fpScratchC3);
            if (_fpScratchC0.z < fp.Z_NEAR && _fpScratchC1.z < fp.Z_NEAR && _fpScratchC2.z < fp.Z_NEAR && _fpScratchC3.z < fp.Z_NEAR) return;
            const poly = fp.clipPolygonNear3D(_fpScratchQuad);
            if (!poly) return;
            ctxA.fillStyle = col;
            ctxA.beginPath();
            for (let i = 0; i < poly.length; i++) {
              if (i === 0) ctxA.moveTo(poly[i].x, poly[i].y);
              else ctxA.lineTo(poly[i].x, poly[i].y);
            }
            ctxA.closePath();
            ctxA.fill();
          };

          const addClippedFloorLineToPath = (x1, y1, x2, y2, wz) => {
            const seg = fp.clipSegmentNear3D(fp.worldToCam(x1, y1, wz, _fpScratchC0), fp.worldToCam(x2, y2, wz, _fpScratchC1), _fpScratchSeg);
            if (!seg) return;
            ctxA.moveTo(seg[0].x, seg[0].y);
            ctxA.lineTo(seg[1].x, seg[1].y);
          };

          const strokeWorldLineFPS = (x1, y1, x2, y2, col, lw, dash, zConst) => {
            const seg = fp.clipSegmentNear3D(
              fp.worldToCam(x1, y1, zConst || 0, _fpScratchC0),
              fp.worldToCam(x2, y2, zConst || 0, _fpScratchC1),
              _fpScratchSeg
            );
            if (!seg) return;
            ctxA.save();
            ctxA.strokeStyle = col;
            ctxA.lineWidth = lw;
            ctxA.lineCap = "round";
            if (dash) ctxA.setLineDash(dash);
            ctxA.beginPath();
            ctxA.moveTo(seg[0].x, seg[0].y);
            ctxA.lineTo(seg[1].x, seg[1].y);
            ctxA.stroke();
            ctxA.restore();
          };

          const drawWorldRingFPS = (cxW, cyW, rM, fillCol, strokeCol, lw, dash, a0, a1) => {
            const segs = 32;
            const isDefaultFull = a0 === undefined && a1 === undefined;
            const startA = isDefaultFull ? 0 : a0 === undefined ? 0 : a0;
            const endA = isDefaultFull ? Math.PI * 2 : a1 === undefined ? Math.PI * 2 : a1;
            const isClosedFull = isDefaultFull || Math.abs(endA - startA - Math.PI * 2) < 0.02;

            let anyNear = false;
            if (isDefaultFull) {
              for (let i = 0; i < segs; i++) {
                const cPt = fp.worldToCam(cxW + UNIT_CIRCLE_32.cos[i] * rM, cyW + UNIT_CIRCLE_32.sin[i] * rM, 0, _fpScratchRingCam[i]);
                if (cPt.z >= fp.Z_NEAR) anyNear = true;
              }
            } else {
              const stepA = (endA - startA) / segs;
              const cStep = Math.cos(stepA);
              const sStep = Math.sin(stepA);
              let ca = Math.cos(startA);
              let sa = Math.sin(startA);
              for (let i = 0; i < segs; i++) {
                const cPt = fp.worldToCam(cxW + ca * rM, cyW + sa * rM, 0, _fpScratchRingCam[i]);
                if (cPt.z >= fp.Z_NEAR) anyNear = true;
                const nextC = ca * cStep - sa * sStep;
                sa = sa * cStep + ca * sStep;
                ca = nextC;
              }
            }
            if (!anyNear) return;

            if (fillCol && isClosedFull) {
              const poly = fp.clipPolygonNear3D(_fpScratchRingCam);
              if (poly) {
                ctxA.fillStyle = fillCol;
                ctxA.beginPath();
                for (let i = 0; i < poly.length; i++) {
                  if (i === 0) ctxA.moveTo(poly[i].x, poly[i].y);
                  else ctxA.lineTo(poly[i].x, poly[i].y);
                }
                ctxA.closePath();
                ctxA.fill();
              }
            }

            if (strokeCol) {
              ctxA.save();
              ctxA.strokeStyle = strokeCol;
              ctxA.lineWidth = lw || 2.2;
              if (dash) ctxA.setLineDash(dash);
              ctxA.beginPath();
              let lastX = NaN;
              let lastY = NaN;
              const lastPtCam = isDefaultFull
                ? _fpScratchRingCam[0]
                : fp.worldToCam(cxW + Math.cos(endA) * rM, cyW + Math.sin(endA) * rM, 0, _fpScratchC0);
              for (let i = 0; i < segs; i++) {
                const cA = _fpScratchRingCam[i];
                const cB = i + 1 < segs ? _fpScratchRingCam[i + 1] : lastPtCam;
                const clipped = fp.clipSegmentNear3D(cA, cB, _fpScratchSeg);
                if (!clipped) {
                  lastX = NaN;
                  continue;
                }
                if (Math.abs(clipped[0].x - lastX) > 0.25 || Math.abs(clipped[0].y - lastY) > 0.25) {
                  ctxA.moveTo(clipped[0].x, clipped[0].y);
                }
                ctxA.lineTo(clipped[1].x, clipped[1].y);
                lastX = clipped[1].x;
                lastY = clipped[1].y;
              }
              ctxA.stroke();
              ctxA.restore();
            }
          };

          // 2. Royal Blue Court Apron, Shared (7x15) Frustum-Culled 3-Color Batched Parquet & Keys!
          fillFloorQuadFPS(-COURT.halfW - 1.0, -0.55, COURT.halfW + 1.0, courtLen + 0.55, "#1e3a8a");
          fillFloorQuadFPS(-COURT.halfW, 0, COURT.halfW, courtLen, "#ecc180");

          const yStep = state.fullCourt ? 2 : 1;
          const nRows = Math.round(courtLen / yStep);
          for (let r = 0; r <= nRows; r++) {
            const wy = r * yStep;
            const rowBase = r * 7;
            for (let c = 0; c <= 6; c++) {
              const wx = (c - 3) * 2.5;
              const camV = fp.worldToCam(wx, wy, 0, _floorCamGrid[rowBase + c]);
              if (camV.z >= fp.Z_NEAR) {
                fp.camToScreen(camV, _floorScrGrid[rowBase + c]);
              }
            }
          }

          // Batch only the 3 non-base parquet shades (skipping #ecc180 base overdraw!)
          for (let pass = 0; pass < 3; pass++) {
            ctxA.fillStyle = _PARQUET_BATCH_COLS[pass];
            ctxA.beginPath();
            let anyTile = false;
            for (let r = 0; r < nRows; r++) {
              const evenBand = r % 2 === 0;
              if (pass === 0 && !evenBand) continue;
              if (pass > 0 && evenBand) continue;
              const row0 = r * 7;
              const row1 = (r + 1) * 7;
              for (let c = 0; c < 6; c++) {
                const xb = c - 3;
                const alt = (r + xb) % 2 === 0;
                const tilePass = evenBand ? (alt ? 0 : -1) : alt ? 1 : 2;
                if (tilePass !== pass) continue;

                const i0 = row0 + c;
                const i1 = row0 + c + 1;
                const i2 = row1 + c + 1;
                const i3 = row1 + c;
                const c0 = _floorCamGrid[i0];
                const c1 = _floorCamGrid[i1];
                const c2 = _floorCamGrid[i2];
                const c3 = _floorCamGrid[i3];
                if (c0.z < fp.Z_NEAR && c1.z < fp.Z_NEAR && c2.z < fp.Z_NEAR && c3.z < fp.Z_NEAR) continue;

                if (c0.z >= fp.Z_NEAR && c1.z >= fp.Z_NEAR && c2.z >= fp.Z_NEAR && c3.z >= fp.Z_NEAR) {
                  const s0 = _floorScrGrid[i0];
                  const s1 = _floorScrGrid[i1];
                  const s2 = _floorScrGrid[i2];
                  const s3 = _floorScrGrid[i3];
                  const minX = Math.min(s0.x, s1.x, s2.x, s3.x);
                  const maxX = Math.max(s0.x, s1.x, s2.x, s3.x);
                  if (maxX < 0 || minX > W) continue;
                  const minY = Math.min(s0.y, s1.y, s2.y, s3.y);
                  const maxY = Math.max(s0.y, s1.y, s2.y, s3.y);
                  if (maxY < 0 || minY > H) continue;
                  ctxA.moveTo(s0.x, s0.y);
                  ctxA.lineTo(s1.x, s1.y);
                  ctxA.lineTo(s2.x, s2.y);
                  ctxA.lineTo(s3.x, s3.y);
                  ctxA.closePath();
                  anyTile = true;
                } else {
                  _fpScratchQuad[0] = c0;
                  _fpScratchQuad[1] = c1;
                  _fpScratchQuad[2] = c2;
                  _fpScratchQuad[3] = c3;
                  const poly = fp.clipPolygonNear3D(_fpScratchQuad);
                  if (!poly) continue;
                  let minX = poly[0].x,
                    maxX = poly[0].x,
                    minY = poly[0].y,
                    maxY = poly[0].y;
                  for (let k = 1; k < poly.length; k++) {
                    if (poly[k].x < minX) minX = poly[k].x;
                    if (poly[k].x > maxX) maxX = poly[k].x;
                    if (poly[k].y < minY) minY = poly[k].y;
                    if (poly[k].y > maxY) maxY = poly[k].y;
                  }
                  if (maxX < 0 || minX > W || maxY < 0 || minY > H) continue;
                  ctxA.moveTo(poly[0].x, poly[0].y);
                  for (let k = 1; k < poly.length; k++) ctxA.lineTo(poly[k].x, poly[k].y);
                  ctxA.closePath();
                  anyTile = true;
                }
              }
            }
            if (anyTile) ctxA.fill();
          }
          _fpScratchQuad[0] = _fpScratchC0;
          _fpScratchQuad[1] = _fpScratchC1;
          _fpScratchQuad[2] = _fpScratchC2;
          _fpScratchQuad[3] = _fpScratchC3;

          fillFloorQuadFPS(-COURT.paintHalfW, 0, COURT.paintHalfW, COURT.paintLen, "rgba(29, 78, 216, 0.80)");
          if (state.fullCourt) {
            fillFloorQuadFPS(-COURT.paintHalfW, courtLen - COURT.paintLen, COURT.paintHalfW, courtLen, "rgba(185, 28, 28, 0.78)");
          }

          // 3. Crisp Court Lines (1 Batched White Stroke + Precomputed LUT Rings!)
          ctxA.save();
          ctxA.strokeStyle = "#ffffff";
          ctxA.lineWidth = 2.4;
          ctxA.lineCap = "round";
          ctxA.beginPath();
          addClippedFloorLineToPath(-COURT.halfW, 0, COURT.halfW, 0, 0);
          addClippedFloorLineToPath(-COURT.halfW, courtLen, COURT.halfW, courtLen, 0);
          addClippedFloorLineToPath(-COURT.halfW, 0, -COURT.halfW, courtLen, 0);
          addClippedFloorLineToPath(COURT.halfW, 0, COURT.halfW, courtLen, 0);
          addClippedFloorLineToPath(-COURT.paintHalfW, 0, -COURT.paintHalfW, COURT.paintLen, 0);
          addClippedFloorLineToPath(COURT.paintHalfW, 0, COURT.paintHalfW, COURT.paintLen, 0);
          addClippedFloorLineToPath(-COURT.paintHalfW, COURT.paintLen, COURT.paintHalfW, COURT.paintLen, 0);
          addClippedFloorLineToPath(-COURT.threeCornerX, 0, -COURT.threeCornerX, COURT.threeBreakY, 0);
          addClippedFloorLineToPath(COURT.threeCornerX, 0, COURT.threeCornerX, COURT.threeBreakY, 0);
          if (state.fullCourt) {
            const sKeyTop = courtLen - COURT.paintLen;
            addClippedFloorLineToPath(-COURT.halfW, COURT.midY, COURT.halfW, COURT.midY, 0);
            addClippedFloorLineToPath(-COURT.paintHalfW, sKeyTop, -COURT.paintHalfW, courtLen, 0);
            addClippedFloorLineToPath(COURT.paintHalfW, sKeyTop, COURT.paintHalfW, courtLen, 0);
            addClippedFloorLineToPath(-COURT.paintHalfW, sKeyTop, COURT.paintHalfW, sKeyTop, 0);
            addClippedFloorLineToPath(-COURT.threeCornerX, COURT.southThreeBreakY, -COURT.threeCornerX, courtLen, 0);
            addClippedFloorLineToPath(COURT.threeCornerX, COURT.southThreeBreakY, COURT.threeCornerX, courtLen, 0);
          }
          ctxA.stroke();
          ctxA.restore();

          const arcA0 = THREE_BREAK_ANG;
          drawWorldRingFPS(0, COURT.paintLen, COURT.ftRadius, null, "#ffffff", 2.0);
          drawWorldRingFPS(0, COURT.rimY, COURT.noChargeRadius, null, "#ffffff", 2.0, null, 0, Math.PI);
          drawWorldRingFPS(COURT.rimX, COURT.rimY, COURT.threeRadius, null, "#ffffff", 2.4, null, arcA0, Math.PI - arcA0);

          if (state.fullCourt) {
            const sKeyTop = courtLen - COURT.paintLen;
            drawWorldRingFPS(0, COURT.midY, 1.8, "rgba(37, 99, 235, 0.22)", "#ffffff", 2.2);
            drawWorldRingFPS(0, sKeyTop, COURT.ftRadius, null, "#ffffff", 2.0);
            drawWorldRingFPS(0, COURT.southRimY, COURT.noChargeRadius, null, "#ffffff", 2.0, null, Math.PI, Math.PI * 2);
            drawWorldRingFPS(COURT.rimX, COURT.southRimY, COURT.threeRadius, null, "#ffffff", 2.4, null, Math.PI + arcA0, Math.PI * 2 - arcA0);
          }

          // 4. Tactical Floor Rings, Passing Lanes & Deferred Floor Badges (for Foreground Defender Occlusion!)
          const overlayLabels = [];
          _fpsPendingFloorLabels.length = 0;
          _fpsDefenderOccluders.length = 0;

          const queueFloorLabelFPS = (wx, wy, wz, text, bg, fg, priority, dyPx, isTutSpot) => {
            const c = fp.worldToCam(wx, wy, wz, _fpScratchC0);
            if (c.z < 0.45) return;
            const s = fp.camToScreen(c, _fpScratchSeg[0]);
            if (s.x < -30 || s.x > W + 30 || s.y < 24 || s.y > H - 18) return;
            _fpsPendingFloorLabels.push({
              anchorX: s.x,
              anchorY: s.y + (dyPx || 0),
              rawScreenY: s.y,
              camZ: c.z,
              text,
              bg,
              fg,
              priority: priority || 3,
              isTutSpot: !!isTutSpot,
            });
          };

          if (!state.fullCourt && state.role === "defense" && state.helpTriangle.show) {
            _fpScratchQuad.length = 3;
            fp.worldToCam(state.ball.x, state.ball.y, 0, _fpScratchC0);
            fp.worldToCam(state.offense[0].x, state.offense[0].y, 0, _fpScratchC1);
            fp.worldToCam(state.defense[0].x, state.defense[0].y, 0, _fpScratchC2);
            const tri = fp.clipPolygonNear3D(_fpScratchQuad);
            _fpScratchQuad.length = 4;
            _fpScratchQuad[3] = _fpScratchC3;
            if (tri) {
              ctxA.save();
              ctxA.fillStyle = "rgba(16, 185, 129, 0.24)";
              ctxA.strokeStyle = "#10b981";
              ctxA.lineWidth = 2.4;
              ctxA.setLineDash([6, 4]);
              ctxA.beginPath();
              for (let i = 0; i < tri.length; i++) {
                if (i === 0) ctxA.moveTo(tri[i].x, tri[i].y);
                else ctxA.lineTo(tri[i].x, tri[i].y);
              }
              ctxA.closePath();
              ctxA.fill();
              ctxA.stroke();
              ctxA.restore();
            }
          }

          if (userDefNow) {
            const myMan = getUserAssignedOffenseMan();
            if (me && myMan) {
              strokeWorldLineFPS(me.x, me.y, myMan.x, myMan.y, "rgba(56, 189, 248, 0.85)", 2.4, [6, 5]);
              const mPulse = 1 + Math.sin(state.simTime * 6.0) * 0.07;
              drawWorldRingFPS(myMan.x, myMan.y, 0.84 * mPulse, "rgba(56, 189, 248, 0.22)", "#38bdf8", 2.5);
              queueFloorLabelFPS(myMan.x, myMan.y, 0, "🛡️ GUARD", "#0369a1", "#ffffff", 3, 18, false);
            }
          }

          if (state.ball.inFlight) {
            const isShot = state.ball.flightType === "shot";
            const fPulse = 0.62 + Math.sin(state.simTime * 10.0) * 0.09;
            drawWorldRingFPS(
              state.ball.toX,
              state.ball.toY,
              fPulse,
              isShot ? "rgba(250, 204, 21, 0.24)" : "rgba(56, 189, 248, 0.24)",
              isShot ? "#facc15" : "#38bdf8",
              2.4,
              [5, 4]
            );
          } else if (state.ball.loose) {
            const drop = computeLooseBallDropSpot(_fpDropScratch);
            const rPulse = 0.85 + Math.sin(state.simTime * 11.0) * 0.1;
            drawWorldRingFPS(drop.x, drop.y, rPulse * 1.24, "rgba(250, 204, 21, 0.18)", "#facc15", 2.4, [6, 4]);
            drawWorldRingFPS(drop.x, drop.y, rPulse, "rgba(56, 189, 248, 0.30)", "#38bdf8", 2.6);
            strokeWorldLineFPS(state.ball.x, state.ball.y, drop.x, drop.y, "rgba(250, 204, 21, 0.85)", 2.2, [5, 4]);
            queueFloorLabelFPS(drop.x, drop.y, 0, "🏀 REBOUND", "#0369a1", "#ffffff", 2, 16, false);
          }

          // Check rim visibility for soft lock-on reticle & redundant ATTACK! floor pill suppression
          const rimProj = fp.projectWorld(COURT.rimX, COURT.rimY, COURT.rimZ);
          const rimInComfortView = rimProj.visible && rimProj.x > W * 0.14 && rimProj.x < W * 0.86 && rimProj.y > 38 && rimProj.y < H * 0.7;
          const showOddsPillNow = iHaveBallNow && (!state.fullCourt || (me && me.y <= 12.8));

          if ((state.showHints || isTutMode) && state.targetSpot.active) {
            const pulse = 1 + Math.sin(state.simTime * 5.2) * 0.08;
            const isWarnSpot = state.targetSpot.isWarn;
            // 3D Dotted Floor Breadcrumb Guide Line from YOU to Target Spot in Practice/Tutorial!
            if (me && (state.appMode === "practice" || isTutMode)) {
              const dSpot = hypot2(state.targetSpot.x - me.x, state.targetSpot.y - me.y);
              if (dSpot > Math.max(0.85, state.targetSpot.radius * 0.85)) {
                strokeWorldLineFPS(
                  me.x,
                  me.y,
                  state.targetSpot.x,
                  state.targetSpot.y,
                  isWarnSpot ? "rgba(251, 191, 36, 0.78)" : "rgba(74, 222, 128, 0.82)",
                  2.5,
                  [6, 5],
                  0.02
                );
              }
            }
            drawWorldRingFPS(
              state.targetSpot.x,
              state.targetSpot.y,
              state.targetSpot.radius * pulse,
              isWarnSpot ? "rgba(245, 158, 11, 0.30)" : "rgba(34, 197, 94, 0.30)",
              isWarnSpot ? "#f59e0b" : "#22c55e",
              2.6,
              [7, 5]
            );
            const lblUpper = String(state.targetSpot.label || "").toUpperCase();
            const isRedundantAttackSpot =
              !isTutMode &&
              iHaveBallNow &&
              showOddsPillNow &&
              rimInComfortView &&
              (lblUpper.indexOf("ATTACK") !== -1 || lblUpper.indexOf("SCORE") !== -1 || lblUpper.indexOf("SHOOT") !== -1);
            if (!isRedundantAttackSpot) {
              queueFloorLabelFPS(
                state.targetSpot.x,
                state.targetSpot.y,
                0,
                state.targetSpot.label,
                isWarnSpot ? "#fbbf24" : "#15803d",
                isWarnSpot ? "#0f172a" : "#ffffff",
                4,
                14,
                isTutMode
              );
            }
          }

          if (iHaveBallNow && state.passTarget.idx > 0) {
            const targetMate = state.offense[state.passTarget.idx];
            const pulse = 1 + Math.sin(state.simTime * 6.5) * 0.09;
            const clear = state.passTarget.laneOpen;
            strokeWorldLineFPS(me.x, me.y, targetMate.x, targetMate.y, clear ? "rgba(56, 189, 248, 0.86)" : "rgba(251, 146, 60, 0.86)", 2.6, [6, 5]);
            drawWorldRingFPS(
              targetMate.x,
              targetMate.y,
              0.95 * pulse,
              clear ? "rgba(56, 189, 248, 0.28)" : "rgba(251, 146, 60, 0.25)",
              clear ? "#38bdf8" : "#fb923c",
              2.6
            );
            queueFloorLabelFPS(
              targetMate.x,
              targetMate.y,
              0,
              "🎯 #" + targetMate.number + " E",
              clear ? "#0369a1" : "#fb923c",
              clear ? "#ffffff" : "#0f172a",
              2,
              18,
              false
            );
          }

          if (!userDefNow && state.lane.crowdedTeammateIdx !== -1) {
            const mate = state.offense[state.lane.crowdedTeammateIdx];
            drawWorldRingFPS(mate.x, mate.y, COURT.crowdingDist, "rgba(249, 115, 22, 0.26)", "#ea580c", 2.5, [5, 4]);
            queueFloorLabelFPS(mate.x, mate.y, 0.55, "⚠️ CLOSE!", "#fbbf24", "#0f172a", 2, 0, false);
          }

          if (!userDefNow && !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx !== 0) {
            const passer = state.offense[state.ball.holderIdx];
            if (state.lane.open) {
              strokeWorldLineFPS(passer.x, passer.y, me.x, me.y, "#22c55e", 4.0);
              queueFloorLabelFPS((passer.x + me.x) * 0.5, (passer.y + me.y) * 0.5, 0.35, "🟢 PASS!", "#15803d", "#ffffff", 2, 0, false);
            } else {
              strokeWorldLineFPS(passer.x, passer.y, me.x, me.y, "rgba(239, 68, 68, 0.82)", 2.4, [6, 5]);
            }
          }

          // Dust puffs in 3D space
          for (let i = 0; i < state.fx.dusts.length; i++) {
            const du = state.fx.dusts[i];
            const dc = fp.worldToCam(du.x, du.y, du.z, _fpScratchC0);
            if (dc.z < fp.Z_NEAR) continue;
            const dp = fp.camToScreen(dc, _fpScratchSeg[0]);
            const sz = clamp(dp.scale * 0.06, 3, 12);
            ctxA.fillStyle = "rgba(248, 250, 252, " + clamp(du.life * 2, 0.2, 0.85).toFixed(2) + ")";
            ctxA.fillRect(dp.x - sz * 0.5, dp.y - sz * 0.5, sz, sz);
          }

          // 5. True-Scale Depth-Sorted 3D Hoops + Other 9 Articulated 7yo Players + 3D Ball!
          const drawList = [];
          const northHoopCam = fp.worldToCam(0, COURT.backboardY, 2.0, _fpScratchC0);
          if (northHoopCam.z > -0.75) {
            drawList.push({ kind: "hoop", hoopSign: 1, camDepth: -northHoopCam.z });
          }
          if (state.fullCourt) {
            const southHoopCam = fp.worldToCam(0, COURT.southBackboardY, 2.0, _fpScratchC1);
            if (southHoopCam.z > -0.75) {
              drawList.push({ kind: "hoop", hoopSign: -1, camDepth: -southHoopCam.z });
            }
          }

          const pushVisiblePlayerFPS = (pl, isOff, idx, poolSlot) => {
            const jz = pl.jumpZ || 0;
            const cFoot = fp.worldToCam(pl.x, pl.y, jz, _fpScratchC0);
            const cWaist = fp.worldToCam(pl.x, pl.y, jz + 0.65, _fpScratchC1);
            const cHead = fp.worldToCam(pl.x, pl.y, jz + 1.3, _fpScratchC2);
            // BUG-R4 fix: keep close jumping defenders visible as long as foot, waist, OR head is in front of near plane!
            if (Math.max(cFoot.z, cWaist.z, cHead.z) < 0.24) return;
            // BUG-R3 fix: tight horizontal frustum cull synced to actual tanHalfHFov (+0.34m shoulder margin)!
            const refZ = Math.max(0.35, cWaist.z);
            if (Math.abs(cWaist.x) > refZ * fp.tanHalfHFov + 0.34) return;
            const teamKey = isOff ? "offense" : "defense";
            drawList.push({
              kind: "player",
              camDepth: -cWaist.z,
              rawMidZ: cWaist.z,
              p: pl,
              isOffense: isOff,
              isMe: false,
              poolSlot,
              hasBallNow: !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === teamKey && state.ball.holderIdx === idx,
            });
          };

          for (let i = 0; i < state.offense.length; i++) {
            const isMe = (state.fullCourt || state.role === "offense") && i === 0;
            if (isMe) continue;
            pushVisiblePlayerFPS(state.offense[i], true, i, i);
          }
          for (let i = 0; i < state.defense.length; i++) {
            const isMe = !state.fullCourt && state.role === "defense" && i === 0;
            if (isMe) continue;
            pushVisiblePlayerFPS(state.defense[i], false, i, 5 + i);
          }

          if (state.ball.inFlight || state.ball.loose) {
            const cBall = fp.worldToCam(state.ball.x, state.ball.y, state.ball.z, _fpScratchC0);
            if (cBall.z >= fp.Z_NEAR) {
              drawList.push({ kind: "ball", camDepth: -cBall.z });
            }
          }

          drawList.sort((a, b) => a.camDepth - b.camDepth);

          const p2sFPS = (wx, wy, wz, out) => fp.projectWorld(wx, wy, wz, out);
          const playerFpsOpts = {
            fp,
            centerCamZ: 1.0,
            rawMidZ: 1.0,
            camYawEquiv,
            cosCamEquiv: -fp.sinY,
            sinCamEquiv: fp.cosY,
            visScale: 1.0,
          };
          const freeBallFpsOpts = { fp };

          for (let i = 0; i < drawList.length; i++) {
            const item = drawList[i];
            if (item.kind === "hoop") {
              drawFirstPersonHoop3D(ctxA, item.hoopSign, fp);
            } else if (item.kind === "player") {
              const p = item.p;
              const plProj = fp.makePlayerProjector(p.x, p.y);
              playerFpsOpts.centerCamZ = plProj.effCamZ;
              playerFpsOpts.rawMidZ = plProj.rawMidZ;
              const drawn = drawArticulatedPlayer3D(ctxA, item, plProj.p2s, sxR, syR, playerFpsOpts);
              const isOpponent = isOpponentTeamSide(item.isOffense);

              // Record opponent screen-space silhouette for distant floor badge occlusion!
              if (isOpponent) {
                _fpsDefenderOccluders.push({
                  x0: drawn.projX - drawn.mPx * 0.36,
                  x1: drawn.projX + drawn.mPx * 0.36,
                  y0: drawn.headTopScreenY,
                  y1: drawn.ankleScreenY,
                  camZ: Math.max(0.25, item.rawMidZ),
                });
              }

              if (drawn.projX > -20 && drawn.projX < W + 20 && drawn.headTopScreenY > 20 && drawn.headTopScreenY < H - 20) {
                if (p.offBalanceTimer > 0 && isOpponent) {
                  overlayLabels.push({
                    anchorX: drawn.projX,
                    anchorY: drawn.headTopScreenY,
                    text: "⚡ OOPS!",
                    bg: "#fb923c",
                    fg: "#0f172a",
                    priority: 1,
                  });
                } else if ((p.wallUpTimer || 0) > 0 && !item.isOffense) {
                  overlayLabels.push({
                    anchorX: drawn.projX,
                    anchorY: drawn.headTopScreenY,
                    text: "🧱 WALL UP!",
                    bg: "#38bdf8",
                    fg: "#0f172a",
                    priority: 2,
                  });
                } else if (!item.isOffense && p.id === 0 && !userDefNow && p.ballWatchFactor > 0.55) {
                  overlayLabels.push({
                    anchorX: drawn.projX,
                    anchorY: drawn.headTopScreenY,
                    text: "👀 BALL!",
                    bg: "#fef08a",
                    fg: "#0f172a",
                    priority: 3,
                  });
                } else if (item.hasBallNow && state.ball.gatherTimer > 0 && userDefNow) {
                  overlayLabels.push({
                    anchorX: drawn.projX,
                    anchorY: drawn.headTopScreenY,
                    text: "🚨 SHOT!",
                    bg: "#b91c1c",
                    fg: "#ffffff",
                    priority: 2,
                  });
                }
              }
            } else {
              if (state.ball.inFlight) {
                const b = state.ball;
                const uCur = clamp(b.t, 0, 1);
                const isShot = b.flightType === "shot";
                const evalWorld = (s, outC) => {
                  const wx = lerp(b.fromX, b.toX, s);
                  const wy = lerp(b.fromY, b.toY, s);
                  const linZ = lerp(b.fromZ, b.toZ, s);
                  const wz = isShot ? linZ + Math.sin(s * Math.PI) * (4.55 - linZ * 0.65) : 1.22 + Math.sin(s * Math.PI) * 0.44;
                  return fp.worldToCam(wx, wy, wz, outC);
                };
                ctxA.save();
                ctxA.strokeStyle = isShot ? "rgba(254, 240, 138, 0.85)" : "rgba(125, 211, 252, 0.88)";
                ctxA.lineWidth = 2.4;
                ctxA.setLineDash([5, 4]);
                ctxA.beginPath();
                for (let k = 0; k < 12; k++) {
                  const s0 = lerp(uCur, 1.0, k / 12);
                  const s1 = lerp(uCur, 1.0, (k + 1) / 12);
                  const seg = fp.clipSegmentNear3D(evalWorld(s0, _fpScratchC0), evalWorld(s1, _fpScratchC1), _fpScratchSeg);
                  if (!seg) continue;
                  ctxA.moveTo(seg[0].x, seg[0].y);
                  ctxA.lineTo(seg[1].x, seg[1].y);
                }
                ctxA.stroke();
                ctxA.restore();
              } else if (state.ball.loose) {
                drawWorldRingFPS(state.ball.x, state.ball.y, 0.72, "rgba(56, 189, 248, 0.25)", "#38bdf8", 2.2);
                const dropV = fp.clipSegmentNear3D(
                  fp.worldToCam(state.ball.x, state.ball.y, state.ball.z, _fpScratchC0),
                  fp.worldToCam(state.ball.x, state.ball.y, 0, _fpScratchC1),
                  _fpScratchSeg
                );
                if (dropV) {
                  ctxA.save();
                  ctxA.strokeStyle = "rgba(250, 204, 21, 0.88)";
                  ctxA.lineWidth = 2.0;
                  ctxA.setLineDash([4, 3]);
                  ctxA.beginPath();
                  ctxA.moveTo(dropV[0].x, dropV[0].y);
                  ctxA.lineTo(dropV[1].x, dropV[1].y);
                  ctxA.stroke();
                  ctxA.restore();
                }
              }
              drawBasketballVolumetric3D(ctxA, p2sFPS, sxR, syR, state.ball.x, state.ball.y, state.ball.z, true, freeBallFpsOpts);
            }
          }

          // Filter deferred floor badges against foreground defender silhouettes (Occlusion Culling!)
          let occludedFloorCount = 0;
          for (let i = 0; i < _fpsPendingFloorLabels.length; i++) {
            const fb = _fpsPendingFloorLabels[i];
            let isOccluded = false;
            for (let j = 0; j < _fpsDefenderOccluders.length; j++) {
              const occ = _fpsDefenderOccluders[j];
              if (fb.camZ > occ.camZ + 0.65) {
                const xHit = fb.anchorX + 22 > occ.x0 && fb.anchorX - 22 < occ.x1;
                const yHit = (fb.rawScreenY >= occ.y0 - 6 && fb.rawScreenY <= occ.y1 + 8) || (fb.anchorY > occ.y0 && fb.anchorY - 22 < occ.y1);
                if (xHit && yHit) {
                  isOccluded = true;
                  break;
                }
              }
            }
            if (isOccluded) {
              occludedFloorCount++;
              if (fb.isTutSpot) {
                overlayLabels.push({
                  anchorX: fb.anchorX,
                  anchorY: fb.anchorY,
                  text: fb.text,
                  bg: fb.bg,
                  fg: fb.fg,
                  priority: fb.priority,
                  alpha: 0.42,
                });
              }
            } else {
              overlayLabels.push({
                anchorX: fb.anchorX,
                anchorY: fb.anchorY,
                text: fb.text,
                bg: fb.bg,
                fg: fb.fg,
                priority: fb.priority,
                alpha: 1.0,
              });
            }
          }
          state.lastOccludedFloorBadgesFPS = occludedFloorCount;

          // Forward-shifted FPS Sparkles (user-centered bursts project 1.15m ahead into view!) & Rising Score Popups
          for (let i = 0; i < state.fx.sparkles.length; i++) {
            const sp = state.fx.sparkles[i];
            let sxW = sp.x;
            let syW = sp.y;
            let szW = sp.z;
            if (me) {
              const dMe2 = (sp.x - me.x) * (sp.x - me.x) + (sp.y - me.y) * (sp.y - me.y);
              if (dMe2 < 0.92) {
                sxW = sp.x + fp.cosY * 1.15;
                syW = sp.y + fp.sinY * 1.15;
                szW = Math.max(0.55, sp.z);
              }
            }
            const sc = fp.worldToCam(sxW, syW, szW, _fpScratchC0);
            if (sc.z < fp.Z_NEAR) continue;
            const pt = fp.camToScreen(sc, _fpScratchSeg[0]);
            ctxA.fillStyle = sp.color;
            ctxA.fillRect(pt.x - 3.2, pt.y - 3.2, 6.4, 6.4);
          }
          if (state.fx.scorePopups.length > 0) {
            ctxA.save();
            ctxA.textAlign = "center";
            for (let i = 0; i < state.fx.scorePopups.length; i++) {
              const pop = state.fx.scorePopups[i];
              const pc = fp.worldToCam(pop.x, pop.y, pop.z, _fpScratchC0);
              if (pc.z < fp.Z_NEAR) continue;
              const pt = fp.camToScreen(pc, _fpScratchSeg[0]);
              ctxA.globalAlpha = clamp(pop.life / 0.45, 0, 1);
              ctxA.font = '900 22px "SF Pro Rounded", "Segoe UI", sans-serif';
              ctxA.strokeStyle = "#090d16";
              ctxA.lineWidth = 4.2;
              ctxA.strokeText(pop.text, pt.x, pt.y);
              ctxA.fillStyle = pop.color;
              ctxA.fillText(pop.text, pt.x, pt.y);
            }
            ctxA.restore();
          }

          // Pre-compute Fixed HUD Layout Rects BEFORE resolveLabelCollisions so 0 floating pills overlap HUD! (BUG-R1 fix!)
          _fpsOccupiedHudBoxes.length = 0;
          _fpsEdgePills.length = 0;

          const showTopScoreboard = !state.paused && state.appMode === "game" && (state.fullCourt || state.scenario === "match");
          if (showTopScoreboard) {
            _fpsOccupiedHudBoxes.push({ x: (W - 216) * 0.5, y: 6, w: 216, h: 26 });
          } else if (state.paused) {
            _fpsOccupiedHudBoxes.push({ x: (W - 196) * 0.5, y: 8, w: 196, h: 28 });
          }

          // Rim Soft Lock-On Reticle Coordinates + Contest-Aware Shot-Odds Pill
          let retX = W * 0.5;
          let retY = H * 0.45;
          if (iHaveBallNow && rimInComfortView) {
            retX = clamp(lerp(W * 0.5, rimProj.x, 0.68), W * 0.24, W * 0.76);
            retY = clamp(lerp(H * 0.44, rimProj.y, 0.68), 46, H * 0.58);
          }

          let oddsTxt = "";
          let oddsCol = "#38bdf8";
          let oddsW = 0;
          if (showOddsPillNow) {
            const zInfo = classifyShotZone("offense", me);
            const baseOddsTxt = zInfo.shotType === "layup" ? "LAYUP 80%" : zInfo.shotType === "three" ? "3PT 30%" : "2PT 50%";
            const contestedFront = _checkOpponentContestsFront(me, COURT.rimX, COURT.rimY);
            oddsTxt = contestedFront ? "⚠️ " + baseOddsTxt : baseOddsTxt;
            oddsCol = contestedFront ? "#fb923c" : zInfo.shotType === "layup" ? "#4ade80" : zInfo.shotType === "three" ? "#fde047" : "#38bdf8";
            ctxA.font = '900 10.5px "SF Pro Rounded", "Segoe UI", sans-serif';
            oddsW = Math.ceil(measureTextCached(ctxA, "10.5", oddsTxt)) + 16;
            _fpsOccupiedHudBoxes.push({ x: retX - Math.max(14, oddsW * 0.5), y: retY - 12, w: Math.max(28, oddsW), h: 46 });
          } else {
            _fpsOccupiedHudBoxes.push({ x: retX - 12, y: retY - 12, w: 24, h: 24 });
          }

          // Bottom Status Pill Selection (Priority: TIGHT -> BOX OUT -> WALL UP -> OOPS BURST)
          let bottomPillTxt = "";
          let bottomPillBg = "#fbbf24";
          let bottomPillFg = "#0f172a";
          if (state.dribblePressure.ratio >= 0.48) {
            bottomPillTxt = "⚠️ TIGHT!";
            bottomPillBg = "#fbbf24";
            bottomPillFg = "#0f172a";
          } else if (me && (me.boxOutTimer || 0) > 0) {
            bottomPillTxt = "💪 BOX OUT!";
            bottomPillBg = "#facc15";
            bottomPillFg = "#0f172a";
          } else if (me && (me.wallUpTimer || 0) > 0) {
            bottomPillTxt = "🧱 WALL UP!";
            bottomPillBg = "#38bdf8";
            bottomPillFg = "#0f172a";
          } else if (state.simTime < _oopsBannerUntil) {
            bottomPillTxt = "⚡ OOPS! BURST!";
            bottomPillBg = "#fb923c";
            bottomPillFg = "#0f172a";
          }

          let bottomPillW = 0;
          const bottomPillY = Math.max(38, H - 34);
          if (bottomPillTxt) {
            ctxA.font = '900 11.5px "SF Pro Rounded", "Segoe UI", sans-serif';
            bottomPillW = Math.ceil(measureTextCached(ctxA, "11.5", bottomPillTxt)) + 18;
            _fpsOccupiedHudBoxes.push({ x: W * 0.5 - bottomPillW * 0.5, y: bottomPillY, w: bottomPillW, h: 22 });
          }

          // Peripheral Off-Screen Awareness Edge Indicators (Azimuth-Mapped Y + 4-Way Target Spot!)
          ctxA.font = '900 11px "SF Pro Rounded", "Segoe UI", sans-serif';
          const queueEdgeArrow = (wx, wy, leftTxt, rightTxt, rearTxt, bgCol, fgCol, baseSlotFrac) => {
            const dx = wx - fp.eyeX;
            const dy = wy - fp.eyeY;
            if (hypot2(dx, dy) < 0.45) return;
            const xH = -dx * fp.sinY + dy * fp.cosY;
            const zH = dx * fp.cosY + dy * fp.sinY;
            const ang = Math.atan2(xH, zH);
            const edgeThresh = Math.min(0.82, Math.atan(fp.tanHalfHFov * 0.9));
            if (Math.abs(ang) <= edgeThresh) return;

            if (rearTxt && Math.abs(ang) > 2.28) {
              const bw = Math.ceil(measureTextCached(ctxA, "11", rearTxt)) + 14;
              const bx = clamp(W * 0.5 - bw * 0.5, 8, Math.max(8, W - bw - 8));
              const by = bottomPillTxt ? Math.max(38, bottomPillY - 27) : bottomPillY;
              _fpsEdgePills.push({ x: bx, y: by, w: bw, h: 22, txt: rearTxt, bg: bgCol, fg: fgCol });
              _fpsOccupiedHudBoxes.push({ x: bx, y: by, w: bw, h: 22 });
              return;
            }

            const isRight = ang > 0;
            const txt = isRight ? rightTxt : leftTxt;
            const bw = Math.ceil(measureTextCached(ctxA, "11", txt)) + 14;
            const bx = isRight ? Math.max(8, W - bw - 8) : 8;
            const depthShift = clamp(-zH * 3.5, -24, 34);
            let by = clamp(H * baseSlotFrac + depthShift, 42, Math.max(42, H - 62));
            for (let k = 0; k < _fpsEdgePills.length; k++) {
              const ep = _fpsEdgePills[k];
              if (Math.abs(ep.x - bx) < 40 && Math.abs(ep.y - by) < 25) {
                by = clamp(ep.y + 26, 42, Math.max(42, H - 36));
              }
            }
            _fpsEdgePills.push({ x: bx, y: by, w: bw, h: 22, txt, bg: bgCol, fg: fgCol });
            _fpsOccupiedHudBoxes.push({ x: bx, y: by, w: bw, h: 22 });
          };

          if (!iHaveBallNow) {
            queueEdgeArrow(state.ball.x, state.ball.y, "◀ 🏀", "🏀 ▶", null, "#fb923c", "#0f172a", 0.43);
          } else if (state.passTarget.idx > 0) {
            const pm = state.offense[state.passTarget.idx];
            if (pm) {
              queueEdgeArrow(pm.x, pm.y, "◀ 🎯 #" + pm.number, "🎯 #" + pm.number + " ▶", null, "#0369a1", "#ffffff", 0.43);
            }
          }
          if (userDefNow) {
            const man = getUserAssignedOffenseMan();
            if (man) queueEdgeArrow(man.x, man.y, "◀ 🛡️", "🛡️ ▶", null, "#0369a1", "#ffffff", 0.54);
          }
          if ((state.showHints || isTutMode) && state.targetSpot.active) {
            const warnSpot = state.targetSpot.isWarn;
            queueEdgeArrow(
              state.targetSpot.x,
              state.targetSpot.y,
              warnSpot ? "◀ ⚠️ SPOT" : "◀ 🟢 SPOT",
              warnSpot ? "⚠️ SPOT ▶" : "🟢 SPOT ▶",
              warnSpot ? "⚠️ SPOT ▼" : "🟢 SPOT ▼",
              warnSpot ? "#fbbf24" : "#15803d",
              warnSpot ? "#0f172a" : "#ffffff",
              0.34
            );
          }

          // 6. Collision-Free Floating Callout Pills (Aware of ALL Fixed HUD Rects!)
          ctxA.font = '900 12px "SF Pro Rounded", "Segoe UI", sans-serif';
          const resolved = resolveLabelCollisions(overlayLabels, W, H, (txt) => measureTextCached(ctxA, "12", txt), _fpsOccupiedHudBoxes);
          state.lastResolvedLabelsA = resolved;
          ctxA.textAlign = "center";
          for (let i = 0; i < resolved.length; i++) {
            const r = resolved[i];
            const centerX = r.x + r.w * 0.5;
            const useAlpha = r.alpha !== undefined && r.alpha < 0.99;
            if (useAlpha) {
              ctxA.save();
              ctxA.globalAlpha = r.alpha;
            }
            ctxA.fillStyle = r.bg;
            ctxA.strokeStyle = "#0f172a";
            ctxA.lineWidth = 1.8;
            ctxA.beginPath();
            ctxA.roundRect(r.x, r.y, r.w, r.h, 7);
            ctxA.fill();
            ctxA.stroke();
            ctxA.fillStyle = r.fg;
            ctxA.fillText(r.text, centerX, r.y + 15);
            if (useAlpha) ctxA.restore();
          }

          // 7. First-Person Kid Arms, Hands & Spinning Basketball Viewmodel!
          drawFirstPersonViewmodel(ctxA, W, H);

          // 8. Dual-Stroke Halo Aim Reticle (>= 8.5:1 Contrast) + Shot-Zone Odds Pill + Bottom & Edge Pills!
          ctxA.save();
          ctxA.lineCap = "round";
          const traceReticlePath = () => {
            ctxA.beginPath();
            ctxA.arc(retX, retY, iHaveBallNow ? 7.5 : 4.4, 0, Math.PI * 2);
            if (iHaveBallNow) {
              ctxA.moveTo(retX - 12.5, retY);
              ctxA.lineTo(retX - 5.2, retY);
              ctxA.moveTo(retX + 5.2, retY);
              ctxA.lineTo(retX + 12.5, retY);
              ctxA.moveTo(retX, retY - 12.5);
              ctxA.lineTo(retX, retY - 5.2);

          };
          traceReticlePath();
          ctxA.strokeStyle = "rgba(15, 23, 42, 0.92)";
          ctxA.lineWidth = 4.2;
          ctxA.stroke();
          traceReticlePath();
          ctxA.strokeStyle = iHaveBallNow ? "#fde047" : "#f8fafc";
          ctxA.lineWidth = 2.0;
          ctxA.stroke();

          if (showOddsPillNow && oddsTxt) {
            ctxA.font = '900 10.5px "SF Pro Rounded", "Segoe UI", sans-serif';
            ctxA.fillStyle = "rgba(15, 23, 42, 0.92)";
            ctxA.strokeStyle = oddsCol;
            ctxA.lineWidth = 1.8;
            ctxA.beginPath();
            ctxA.roundRect(retX - oddsW * 0.5, retY + 13, oddsW, 19, 6);
            ctxA.fill();
            ctxA.stroke();
            ctxA.fillStyle = oddsCol;
            ctxA.textAlign = "center";
            ctxA.fillText(oddsTxt, retX, retY + 26);
          }

          if (bottomPillTxt) {
            ctxA.font = '900 11.5px "SF Pro Rounded", "Segoe UI", sans-serif';
            ctxA.fillStyle = bottomPillBg;
            ctxA.strokeStyle = "#0f172a";
            ctxA.lineWidth = 1.8;
            ctxA.beginPath();
            ctxA.roundRect(W * 0.5 - bottomPillW * 0.5, bottomPillY, bottomPillW, 22, 7);
            ctxA.fill();
            ctxA.stroke();
            ctxA.fillStyle = bottomPillFg;
            ctxA.textAlign = "center";
            ctxA.fillText(bottomPillTxt, W * 0.5, bottomPillY + 15);
          }

          if (_fpsEdgePills.length > 0) {
            ctxA.font = '900 11px "SF Pro Rounded", "Segoe UI", sans-serif';
            ctxA.textAlign = "center";
            for (let i = 0; i < _fpsEdgePills.length; i++) {
              const ep = _fpsEdgePills[i];
              ctxA.fillStyle = ep.bg;
              ctxA.strokeStyle = "#0f172a";
              ctxA.lineWidth = 1.8;
              ctxA.beginPath();
              ctxA.roundRect(ep.x, ep.y, ep.w, ep.h, 7);
              ctxA.fill();
              ctxA.stroke();
              ctxA.fillStyle = ep.fg;
              ctxA.fillText(ep.txt, ep.x + ep.w * 0.5, ep.y + 15);
            }
          }
          ctxA.restore();

          if (showTopScoreboard) {
            drawArenaScoreboardHUD(ctxA, W);
          }
          if (state.paused) drawPauseOverlayPill(ctxA, W);
        }

        /* Deterministic FPS Player Proportion Inspector (Head Diameter / Total Height & Neck Check) */
        function measureFpsPlayerProportions(playerObj, isOffense, W, H) {
          const wSafe = W || 840;
          const hSafe = H || 448;
          const sxR = wSafe / REF_W;
          const syR = hSafe / REF_H;
          const fp = createFirstPersonProjector(wSafe, hSafe);
          const plProj = fp.makePlayerProjector(playerObj.x, playerObj.y);
          const camYawEquiv = wrapAngle(fp.yaw + Math.PI * 0.5);
          return drawArticulatedPlayer3D(
            ctxA,
            { p: playerObj, isOffense: !!isOffense, isMe: false, hasBallNow: false, poolSlot: 13 },
            plProj.p2s,
            sxR,
            syR,
            {
              fp,
              centerCamZ: plProj.effCamZ,
              rawMidZ: plProj.rawMidZ,
              camYawEquiv,
              cosCamEquiv: -fp.sinY,
              sinCamEquiv: fp.cosY,
              visScale: 1.0,
            }
          );
        }

        const _p2sScratch3D = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, distFromCam: 10, effZoom: 1 };
        const _p2sTmp0 = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, visible: true };
        const _p2sTmp1 = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, visible: true };
        const _p2sTmp2 = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, visible: true };
        const _p2sTmp3 = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, visible: true };
        const _arenaOccupiedHudBoxes = [];
        const _HALFCOURT_HASH_YS = [1.75, 2.65, 3.55, 4.45];

        function renderPseudo3DA() {
          if (state.viewMode === "b") return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const W = canvasA.width / dpr;
          const H = canvasA.height / dpr;
          if (W <= 0 || H <= 0) return;

          const courtLen = getCourtLength();
          const sxR = W / REF_W;
          const syR = H / REF_H;

          ctxA.save();
          ctxA.scale(dpr, dpr);

          if (state.cam.preset === "fps") {
            renderFirstPersonCourtA(W, H, sxR, syR);
            ctxA.restore();
            return;
          }

          _syncCam3DFrame();
          const p2s = (wx, wy, wz, out) => {
            const p = project3D(wx, wy, wz, _p2sScratch3D);
            if (out) {
              out.x = p.x * sxR;
              out.y = p.y * syR;
              out.floorY = p.floorY * syR;
              out.s = p.s;
              out.camDepth = p.camDepth;
              return out;
            }
            return { x: p.x * sxR, y: p.y * syR, floorY: p.floorY * syR, s: p.s, camDepth: p.camDepth };
          };

          // 1. Arena Stadium Backdrop, Tiered Crowd & Overhead Spotlights
          const horizonY = 56 * syR;
          ctxA.fillStyle = "#0b1120";
          ctxA.fillRect(0, 0, W, H);

          // LED Ribbon Strip
          ctxA.fillStyle = "#1e293b";
          ctxA.fillRect(0, 12 * syR, W, 8 * syR);
          const simTick3 = Math.floor(state.simTime * 3);
          for (let lx = 8; lx < W; lx += 28) {
            ctxA.fillStyle = (Math.floor(lx / 28) + simTick3) % 3 === 0 ? "#facc15" : "#38bdf8";
            ctxA.fillRect(lx, 14 * syR, 14, 3.5 * syR);
          }

          // Stadium Bleacher Tiers + Batched Crowd Heads
          const yawCrowdShift = Math.round((state.cam.yaw / (Math.PI * 2)) * 180);
          for (let row = 0; row < 3; row++) {
            const ry = (22 + row * 10) * syR;
            ctxA.fillStyle = row === 0 ? "#172554" : row === 1 ? "#1e293b" : "#0f172a";
            ctxA.fillRect(0, ry, W, 11 * syR);
            const cheerHop = state.fx.crowdCheerTimer > 0 ? Math.abs(Math.sin(state.simTime * 20 + row)) * 3 * syR : 0;
            for (let cx = 10 + row * 5; cx < W - 10; cx += 15) {
              const cIdx = (((Math.floor(cx) + yawCrowdShift + row * 7) % 6) + 6) % 6;
              ctxA.fillStyle = _CROWD_PALETTE[cIdx];
              ctxA.fillRect(cx, ry + 3 * syR - cheerHop, 7, 6 * syR);
            }
          }
          ctxA.fillStyle = "#f1c27d";
          ctxA.beginPath();
          for (let row = 0; row < 3; row++) {
            const ry = (22 + row * 10) * syR;
            const cheerHop = state.fx.crowdCheerTimer > 0 ? Math.abs(Math.sin(state.simTime * 20 + row)) * 3 * syR : 0;
            for (let cx = 10 + row * 5; cx < W - 10; cx += 15) {
              ctxA.rect(cx + 1.5, ry - cheerHop, 4, 3.5 * syR);
            }
          }
          ctxA.fill();

          // 2. Royal Blue Court Apron + Shared (7x15) 3-Color Batched Maple Parquet!
          const fillFloorQuad = (x0, y0, x1, y1, col) => {
            const q0 = p2s(x0, y0, 0, _p2sTmp0);
            const q1 = p2s(x1, y0, 0, _p2sTmp1);
            const q2 = p2s(x1, y1, 0, _p2sTmp2);
            const q3 = p2s(x0, y1, 0, _p2sTmp3);
            ctxA.fillStyle = col;
            ctxA.beginPath();
            ctxA.moveTo(q0.x, q0.y);
            ctxA.lineTo(q1.x, q1.y);
            ctxA.lineTo(q2.x, q2.y);
            ctxA.lineTo(q3.x, q3.y);
            ctxA.closePath();
            ctxA.fill();
          };

          fillFloorQuad(-COURT.halfW - 0.9, -0.45, COURT.halfW + 0.9, courtLen + 0.45, "#1e3a8a");
          fillFloorQuad(-COURT.halfW, 0, COURT.halfW, courtLen, "#ecc180");

          const yStep = state.fullCourt ? 2 : 1;
          const nRows = Math.round(courtLen / yStep);
          for (let r = 0; r <= nRows; r++) {
            const wy = r * yStep;
            const rowBase = r * 7;
            for (let c = 0; c <= 6; c++) {
              p2s((c - 3) * 2.5, wy, 0, _floorScrGrid[rowBase + c]);
            }
          }

          for (let pass = 0; pass < 3; pass++) {
            ctxA.fillStyle = _PARQUET_BATCH_COLS[pass];
            ctxA.beginPath();
            for (let r = 0; r < nRows; r++) {
              const evenBand = r % 2 === 0;
              if (pass === 0 && !evenBand) continue;
              if (pass > 0 && evenBand) continue;
              const row0 = r * 7;
              const row1 = (r + 1) * 7;
              for (let c = 0; c < 6; c++) {
                const xb = c - 3;
                const alt = (r + xb) % 2 === 0;
                const tilePass = evenBand ? (alt ? 0 : -1) : alt ? 1 : 2;
                if (tilePass !== pass) continue;
                const s0 = _floorScrGrid[row0 + c];
                const s1 = _floorScrGrid[row0 + c + 1];
                const s2 = _floorScrGrid[row1 + c + 1];
                const s3 = _floorScrGrid[row1 + c];
                ctxA.moveTo(s0.x, s0.y);
                ctxA.lineTo(s1.x, s1.y);
                ctxA.lineTo(s2.x, s2.y);
                ctxA.lineTo(s3.x, s3.y);
                ctxA.closePath();
              }
            }
            ctxA.fill();
          }

          // Overhead Arena Spotlight Sheen
          if (typeof ctxA.createRadialGradient === "function") {
            const spC = p2s(0, state.fullCourt ? 14.0 : 5.5, 0, _p2sTmp0);
            const grad = ctxA.createRadialGradient(spC.x, spC.y, 10, spC.x, spC.y, W * 0.48);
            grad.addColorStop(0, "rgba(255, 253, 240, 0.22)");
            grad.addColorStop(1, "rgba(255, 253, 240, 0.0)");
            ctxA.fillStyle = grad;
            ctxA.fillRect(0, horizonY, W, H - horizonY);
          }

          fillFloorQuad(-COURT.paintHalfW, 0, COURT.paintHalfW, COURT.paintLen, "rgba(29, 78, 216, 0.78)");
          if (state.fullCourt) {
            fillFloorQuad(-COURT.paintHalfW, courtLen - COURT.paintLen, COURT.paintHalfW, courtLen, "rgba(185, 28, 28, 0.76)");
          }

          // 3. Polished Hardwood Vertical Reflections (zero concat allocation!)
          ctxA.fillStyle = "rgba(37, 99, 235, 0.14)";
          for (let i = 0; i < state.offense.length; i++) {
            const pl = state.offense[i];
            const pf = p2s(pl.x, pl.y, 0, _p2sTmp0);
            const refW = 14 * pf.s * sxR;
            const refH = 20 * pf.s * syR;
            ctxA.fillRect(pf.x - refW * 0.5, pf.floorY + 2, refW, refH);
          }
          ctxA.fillStyle = "rgba(220, 38, 38, 0.14)";
          for (let i = 0; i < state.defense.length; i++) {
            const pl = state.defense[i];
            const pf = p2s(pl.x, pl.y, 0, _p2sTmp0);
            const refW = 14 * pf.s * sxR;
            const refH = 20 * pf.s * syR;
            ctxA.fillRect(pf.x - refW * 0.5, pf.floorY + 2, refW, refH);
          }

          // 4. Crisp Anti-Aliased Court Lines (Batched White Path + LUT Rings!)
          const addWorldLineToPath3D = (x1, y1, x2, y2) => {
            const segs = state.fullCourt ? 4 : 1;
            for (let s = 0; s <= segs; s++) {
              const t = s / segs;
              const pt = p2s(lerp(x1, x2, t), lerp(y1, y2, t), 0, _p2sTmp0);
              if (s === 0) ctxA.moveTo(pt.x, pt.y);
              else ctxA.lineTo(pt.x, pt.y);
            }
          };

          const strokeWorldLine = (x1, y1, x2, y2, col, lw, dash) => {
            ctxA.save();
            ctxA.strokeStyle = col;
            ctxA.lineWidth = lw;
            if (dash) ctxA.setLineDash(dash);
            ctxA.beginPath();
            addWorldLineToPath3D(x1, y1, x2, y2);
            ctxA.stroke();
            ctxA.restore();
          };

          const drawWorldRing = (cx, cy, rM, fillCol, strokeCol, lw, dash, a0, a1) => {
            const segs = 36;
            const isDefaultFull = a0 === undefined && a1 === undefined;
            ctxA.save();
            ctxA.beginPath();
            if (isDefaultFull) {
              for (let i = 0; i <= segs; i++) {
                const pt = p2s(cx + UNIT_CIRCLE_36.cos[i] * rM, cy + UNIT_CIRCLE_36.sin[i] * rM, 0, _p2sTmp0);
                if (i === 0) ctxA.moveTo(pt.x, pt.y);
                else ctxA.lineTo(pt.x, pt.y);
              }
            } else {
              const startA = a0 === undefined ? 0 : a0;
              const endA = a1 === undefined ? Math.PI * 2 : a1;
              const stepA = (endA - startA) / segs;
              const cStep = Math.cos(stepA);
              const sStep = Math.sin(stepA);
              let ca = Math.cos(startA);
              let sa = Math.sin(startA);
              for (let i = 0; i <= segs; i++) {
                const pt = p2s(cx + ca * rM, cy + sa * rM, 0, _p2sTmp0);
                if (i === 0) ctxA.moveTo(pt.x, pt.y);
                else ctxA.lineTo(pt.x, pt.y);
                const nextC = ca * cStep - sa * sStep;
                sa = sa * cStep + ca * sStep;
                ca = nextC;
              }
            }
            if (fillCol) {
              ctxA.fillStyle = fillCol;
              ctxA.fill();
            }
            if (strokeCol) {
              ctxA.strokeStyle = strokeCol;
              ctxA.lineWidth = lw || 2;
              if (dash) ctxA.setLineDash(dash);
              ctxA.stroke();
            }
            ctxA.restore();
          };

          ctxA.strokeStyle = "#ffffff";
          ctxA.lineWidth = 2.2;
          ctxA.beginPath();
          addWorldLineToPath3D(-COURT.halfW, 0, COURT.halfW, 0);
          addWorldLineToPath3D(-COURT.halfW, courtLen, COURT.halfW, courtLen);
          addWorldLineToPath3D(-COURT.halfW, 0, -COURT.halfW, courtLen);
          addWorldLineToPath3D(COURT.halfW, 0, COURT.halfW, courtLen);
          addWorldLineToPath3D(-COURT.paintHalfW, 0, -COURT.paintHalfW, COURT.paintLen);
          addWorldLineToPath3D(COURT.paintHalfW, 0, COURT.paintHalfW, COURT.paintLen);
          addWorldLineToPath3D(-COURT.paintHalfW, COURT.paintLen, COURT.paintHalfW, COURT.paintLen);
          addWorldLineToPath3D(-COURT.threeCornerX, 0, -COURT.threeCornerX, COURT.threeBreakY);
          addWorldLineToPath3D(COURT.threeCornerX, 0, COURT.threeCornerX, COURT.threeBreakY);
          if (state.fullCourt) {
            const sKeyTop = courtLen - COURT.paintLen;
            addWorldLineToPath3D(-COURT.halfW, COURT.midY, COURT.halfW, COURT.midY);
            addWorldLineToPath3D(-COURT.paintHalfW, sKeyTop, -COURT.paintHalfW, courtLen);
            addWorldLineToPath3D(COURT.paintHalfW, sKeyTop, COURT.paintHalfW, courtLen);
            addWorldLineToPath3D(-COURT.paintHalfW, sKeyTop, COURT.paintHalfW, sKeyTop);
            addWorldLineToPath3D(-COURT.threeCornerX, COURT.southThreeBreakY, -COURT.threeCornerX, courtLen);
            addWorldLineToPath3D(COURT.threeCornerX, COURT.southThreeBreakY, COURT.threeCornerX, courtLen);
          } else {
            for (let h = 0; h < _HALFCOURT_HASH_YS.length; h++) {
              const hy = _HALFCOURT_HASH_YS[h];
              addWorldLineToPath3D(-COURT.paintHalfW - 0.3, hy, -COURT.paintHalfW, hy);
              addWorldLineToPath3D(COURT.paintHalfW, hy, COURT.paintHalfW + 0.3, hy);
            }
          }
          ctxA.stroke();

          const arcA0 = THREE_BREAK_ANG;
          drawWorldRing(0, COURT.paintLen, COURT.ftRadius, null, "#ffffff", 2.0);
          drawWorldRing(0, COURT.rimY, COURT.noChargeRadius, null, "#ffffff", 1.8, null, 0, Math.PI);
          drawWorldRing(COURT.rimX, COURT.rimY, COURT.threeRadius, null, "#ffffff", 2.2, null, arcA0, Math.PI - arcA0);

          if (state.fullCourt) {
            const sKeyTop = courtLen - COURT.paintLen;
            drawWorldRing(0, COURT.midY, 1.8, "rgba(37, 99, 235, 0.22)", "#ffffff", 2.2);
            drawWorldRing(0, sKeyTop, COURT.ftRadius, null, "#ffffff", 2.0);
            drawWorldRing(0, COURT.southRimY, COURT.noChargeRadius, null, "#ffffff", 1.8, null, Math.PI, Math.PI * 2);
            drawWorldRing(COURT.rimX, COURT.southRimY, COURT.threeRadius, null, "#ffffff", 2.2, null, Math.PI + arcA0, Math.PI * 2 - arcA0);

            const aTail = p2s(0, 11.2, 0, _p2sTmp0);
            const aTip = p2s(0, 9.2, 0, _p2sTmp1);
            const aL = p2s(-0.7, 10.1, 0, _p2sTmp2);
            const aR = p2s(0.7, 10.1, 0, _p2sTmp3);
            ctxA.strokeStyle = "rgba(37, 99, 235, 0.42)";
            ctxA.lineWidth = 3.0;
            ctxA.beginPath();
            ctxA.moveTo(aTail.x, aTail.y);
            ctxA.lineTo(aTip.x, aTip.y);
            ctxA.moveTo(aL.x, aL.y);
            ctxA.lineTo(aTip.x, aTip.y);
            ctxA.lineTo(aR.x, aR.y);
            ctxA.stroke();
          } else {
            drawWorldRing(0, COURT.length, 1.8, null, "#ffffff", 2.0, null, Math.PI, Math.PI * 2);
          }

          // 5. Tactical Floor Overlays
          if (!state.fullCourt && state.role === "defense" && state.helpTriangle.show) {
            const pBall = p2s(state.ball.x, state.ball.y, 0, _p2sTmp0);
            const pMan = p2s(state.offense[0].x, state.offense[0].y, 0, _p2sTmp1);
            const pMe = p2s(state.defense[0].x, state.defense[0].y, 0, _p2sTmp2);
            ctxA.save();
            ctxA.fillStyle = "rgba(16, 185, 129, 0.25)";
            ctxA.strokeStyle = "#10b981";
            ctxA.lineWidth = 2.4;
            ctxA.setLineDash([6, 4]);
            ctxA.beginPath();
            ctxA.moveTo(pBall.x, pBall.y);
            ctxA.lineTo(pMan.x, pMan.y);
            ctxA.lineTo(pMe.x, pMe.y);
            ctxA.closePath();
            ctxA.fill();
            ctxA.stroke();
            ctxA.restore();
          }

          const overlayLabels = [];
          const isTutMode = !state.fullCourt && (state.scenario === "tutorial" || state.scenario === "learn_d");
          const userDefNow = isUserOnDefenseNow();

          // Defensive Matchup Tether + Assigned Man Target Ring (3D COURT)
          if (userDefNow) {
            const meDef = getControlledPlayer();
            const myMan = getUserAssignedOffenseMan();
            if (meDef && myMan) {
              strokeWorldLine(meDef.x, meDef.y, myMan.x, myMan.y, "rgba(56, 189, 248, 0.86)", 2.5, [6, 5]);
              const tFlow = (state.simTime * 1.9) % 1;
              const bead = p2s(lerp(meDef.x, myMan.x, tFlow), lerp(meDef.y, myMan.y, tFlow), 0.04, _p2sTmp0);
              ctxA.fillStyle = "#7dd3fc";
              ctxA.beginPath();
              ctxA.arc(bead.x, bead.y, 3.3, 0, Math.PI * 2);
              ctxA.fill();

              const mPulse = 1 + Math.sin(state.simTime * 6.0) * 0.07;
              drawWorldRing(myMan.x, myMan.y, 0.84 * mPulse, "rgba(56, 189, 248, 0.22)", "#38bdf8", 2.5);
              const manFloor = p2s(myMan.x, myMan.y, 0, _p2sTmp0);
              overlayLabels.push({
                anchorX: manFloor.x,
                anchorY: manFloor.floorY + 22,
                text: "🛡️ GUARD",
                bg: "#0369a1",
                fg: "#ffffff",
                priority: 3,
              });
            }
          }

          // In-Flight Landing Target Ring & Loose Rebound Drop Target Ring on Floor
          if (state.ball.inFlight) {
            const isShot = state.ball.flightType === "shot";
            const fPulse = 0.62 + Math.sin(state.simTime * 10.0) * 0.09;
            drawWorldRing(
              state.ball.toX,
              state.ball.toY,
              fPulse,
              isShot ? "rgba(250, 204, 21, 0.24)" : "rgba(56, 189, 248, 0.24)",
              isShot ? "#facc15" : "#38bdf8",
              2.4,
              [5, 4]
            );
          } else if (state.ball.loose) {
            const drop = computeLooseBallDropSpot(_fpDropScratch);
            const rPulse = 0.85 + Math.sin(state.simTime * 11.0) * 0.1;
            drawWorldRing(drop.x, drop.y, rPulse * 1.24, "rgba(250, 204, 21, 0.18)", "#facc15", 2.4, [6, 4]);

                  const wx = lerp(b.fromX, b.toX, s);
                  const wy = lerp(b.fromY, b.toY, s);
                  const linZ = lerp(b.fromZ, b.toZ, s);
                  const wz = isShot ? linZ + Math.sin(s * Math.PI) * (4.55 - linZ * 0.65) : 1.22 + Math.sin(s * Math.PI) * 0.44;
