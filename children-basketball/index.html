              setCoachMessage("warn", "💨", "CROSSOVER FIRST!", 0.9);
              return;
            }
            startShot("offense", 0, true, false);
            return;
          }

          if (!state.fullCourt && state.scenario === "give_go" && state.giveGoStage === 1) {
            setCoachMessage("warn", "🎯", "PASS WITH E!", 0.9);
            return;
          }

          if (state.fullCourt && me.y > 12.2) {
            SoundEngine.playDribbleBounce(0.82);
            setCoachMessage("warn", "🏃", "CROSS HALF COURT!", 0.9);
            return;
          }

          state.dribblePressure.timer = 0;
          state.dribblePressure.ratio = 0;
          startShot("offense", 0, null, false);
        }

        function handleSecondaryAction() {
          if (state.paused) return;
          if (state.playPhase === "match_over" || state.inbound.active) return;
          if (
            !state.fullCourt &&
            (state.scenario === "tutorial" || state.scenario === "learn_d") &&
            (state.tutorial.advanceTimer > 0 || state.tutorial.subPhase === "graduated")
          ) {
            return;
          }
          keys.CallFlash = 0.22;

          if (state.ball.loose) {
            if (state.fullCourt || state.role === "defense") {
              switchDefenderToBall();
            } else if (state.scenario === "match") {
              _switchHalfCourtOffenseLooseBallRebounder();
            }
            return;
          }

          if (isUserOnDefenseNow()) {
            switchDefenderToBall();
            return;
          }

          if (state.playPhase !== "live" || state.ball.inFlight || state.ball.loose) return;

          // On-ball E = Direct Pass to targeted teammate!
          if (state.ball.holderTeam === "offense" && state.ball.holderIdx === 0) {
            executeUserPass(0);
            return;
          }

          // Off-ball E = Call for Pass!
          const drillNeedsStep = !state.fullCourt && state.appMode === "practice" && state.scenario !== "match" && state.lane.scenarioReady === false;
          if (drillNeedsStep) {
            setCoachMessage("normal", "🟢", "GO TO GREEN!", 0.9);
            return;
          }

          if (state.lane.blockerIdx === -1 && state.lane.crowdedTeammateIdx === -1) {
            state.lane.openTimer = 0;
            const isGiveGoReturn =
              (!state.fullCourt && state.scenario === "give_go") || (state.passAssist.active && state.passAssist.mode === "triple_threat");
            startTeamPass("offense", state.ball.holderIdx, 0, { isReturnPass: isGiveGoReturn });
            setCoachMessage("good", "🙋", "NICE CALL! PASS!", 1.1);
          } else if (state.lane.crowdedTeammateIdx !== -1) {
            setCoachMessage("warn", "⚠️", "TOO CLOSE! SPREAD!", 1.0);
          } else {
            setCoachMessage("warn", "🔴", "BLOCKED! GET OPEN!", 1.0);
          }
        }

        function updateBallAndPhases(dt) {
          // 0) 3D Rim-Bounce Live Loose Ball / Rebound Physics (Full-Court & Half-Court!)
          if (state.ball.loose) {
            const b = state.ball;
            const cLen = getCourtLength();
            b.looseTimer += dt;
            b.spinPhase += dt * 9.0;

            if (b.rimKissPending && b.looseTimer >= 0.11) {
              b.rimKissPending = false;
              b.lvx *= 0.93;
              b.lvy *= 0.93;
              b.lvz = Math.max(0.85, b.lvz * 0.88);
              SoundEngine.playRimClank(0.48);
            }

            b.x = clamp(b.x + b.lvx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
            b.y = clamp(b.y + b.lvy * dt, 0.55, cLen - 0.55);
            b.z += b.lvz * dt;
            b.lvz -= 9.8 * dt;

            // 3D Backboard Plane Reflection (Zero Balls Ever Stuck Behind Glass or Stanchion!)
            if (b.y <= 1.28 && Math.abs(b.x) <= 1.15 && b.z <= 4.1) {
              if (b.lvy < -0.25) SoundEngine.playRimClank(0.42);
              b.y = 1.29;
              b.lvy = Math.max(0.55, Math.abs(b.lvy) * 0.62);
            } else if (state.fullCourt && b.y >= COURT.fullLength - 1.28 && Math.abs(b.x) <= 1.15 && b.z <= 4.1) {
              if (b.lvy > 0.25) SoundEngine.playRimClank(0.42);
              b.y = COURT.fullLength - 1.29;
              b.lvy = -Math.max(0.55, Math.abs(b.lvy) * 0.62);
            }

            // Hardwood Floor Bounce (Restitution 0.60, Horizontal Damping 0.80)
            if (b.z <= 0.24) {
              if (b.lvz < -0.5) {
                SoundEngine.playDribbleBounce(clamp(Math.abs(b.lvz) * 0.28, 0.45, 0.95));
              }
              b.z = 0.24;
              b.lvz = Math.abs(b.lvz) * 0.6;
              b.lvx *= 0.8;
              b.lvy *= 0.8;
            }
            if (b.trail.length > 0) _recycleBallTrail();

            // Safety Auto-Claim After 4.2s (Zero Infinite Loose-Ball Stalls!)
            if (b.looseTimer > 4.2) {
              let nearTeam = "offense";
              let nearIdx = 0;
              let nearDistSq = 9999;
              for (let i = 0; i < state.offense.length; i++) {
                const p = state.offense[i];
                const dSq = (p.x - b.x) * (p.x - b.x) + (p.y - b.y) * (p.y - b.y);
                if (dSq < nearDistSq) {
                  nearDistSq = dSq;
                  nearTeam = "offense";
                  nearIdx = i;
                }
              }
              for (let i = 0; i < state.defense.length; i++) {
                const p = state.defense[i];
                const dSq = (p.x - b.x) * (p.x - b.x) + (p.y - b.y) * (p.y - b.y);
                if (dSq < nearDistSq) {
                  nearDistSq = dSq;
                  nearTeam = "defense";
                  nearIdx = i;
                }
              }
              awardLooseBallRebound(nearTeam, nearIdx, false);
              return;
            }

            if (b.looseTimer >= 0.14) {
              let bestTeam = null;
              let bestIdx = -1;
              let bestScore = 999;
              const me = getControlledPlayer();
              const isEasy = state.difficulty === "easy";
              const userSealedOut = me ? _isUserSealedOutOnRebound(me, b.x, b.y) : false;

              if (me && (me.reboundAttemptTimer || 0) > 0 && (!userSealedOut || isEasy)) {
                const dropM = computeLooseBallDropSpot(_scratchDrop);
                const mxAim = lerp(b.x, dropM.x, 0.45);
                const myAim = lerp(b.y, dropM.y, 0.45);
                const dxM = mxAim - me.x;
                const dyM = myAim - me.y;
                const dMSq = dxM * dxM + dyM * dyM;
                if (dMSq > 0.0025 && dMSq <= 8.7025) {
                  const dM = Math.sqrt(dMSq);
                  const drift = Math.min(dM, 1.55 * dt);
                  me.x = clamp(me.x + (dxM / dM) * drift, -COURT.halfW + 0.45, COURT.halfW - 0.45);
                  me.y = clamp(me.y + ((myAim - me.y) / dM) * drift, 0.55, cLen - 0.55);
                }
              }

              for (let g = 0; g < 2; g++) {
                const arr = g === 0 ? state.offense : state.defense;
                const teamName = g === 0 ? "offense" : "defense";
                for (let i = 0; i < arr.length; i++) {
                  const p = arr[i];
                  if (!p) continue;
                  const isMe = p === me;
                  if (!isMe && (p.offBalanceTimer || 0) > 0) continue;
                  if (!isMe && b.looseTimer < 0.22) continue;

                  const dx = p.x - b.x;
                  const dy = p.y - b.y;
                  const dSq = dx * dx + dy * dy;
                  if (dSq > 4.84) continue; // > 2.20m early-out

                  const airborne = (p.jumpZ || 0) > 0.1;
                  const boxingOut = (p.boxOutTimer || 0) > 0;
                  const selfCooldown = (p.selfShotRebCooldown || 0) > 0 && (p.reboundAttemptTimer || 0) <= 0;
                  let reach = 1.02 + (airborne ? 0.26 : 0) + (boxingOut ? 0.14 : 0);
                  let maxCatchZ = airborne ? 2.74 : 2.38;
                  let bonus = boxingOut ? 0.24 : 0;

                  if (isMe) {
                    if ((p.reboundAttemptTimer || 0) > 0) {
                      reach = userSealedOut ? (isEasy ? 1.85 : 1.25) : 2.15;
                      maxCatchZ = 3.08;
                      bonus = userSealedOut ? (isEasy ? 0.55 : 0.15) : 0.88 + (boxingOut ? 0.35 : 0);
                    } else if (selfCooldown) {
                      // Prevents 98% passive auto-self-rebound without pressing SPACE!
                      reach = isEasy ? 1.15 : 0.98;
                      maxCatchZ = 2.35;
                      bonus = 0.0;
                    } else {
                      reach = userSealedOut ? (isEasy ? 1.65 : 1.15) : isEasy ? 1.82 : 1.58;
                      maxCatchZ = 2.58;
                      bonus = (userSealedOut ? 0.1 : 0.42) + (boxingOut ? 0.35 : 0);
                    }
                  } else if (selfCooldown) {
                    reach = 0.85;
                    bonus = -0.15;
                  }

                  if (b.z <= maxCatchZ && dSq <= reach * reach) {
                    const sc = Math.sqrt(dSq) - bonus;
                    if (sc < bestScore) {
                      bestScore = sc;
                      bestTeam = teamName;
                      bestIdx = i;
                    }
                  }
                }
              }

              if (bestTeam !== null) {
                const winnerP = bestTeam === "offense" ? state.offense[bestIdx] : state.defense[bestIdx];
                awardLooseBallRebound(bestTeam, bestIdx, !!(winnerP && (winnerP.reboundAttemptTimer || 0) > 0));
              }
            }
            return;
          }

          if (!state.ball.inFlight) {
            const b = state.ball;
            if (b.trail.length > 0) _recycleBallTrail();

            const inPostMakeWait =
              b.postMakeDrop &&
              (state.playPhase === "celebrate" ||
                (!state.fullCourt && state.scenario === "tutorial" && (state.tutorial.advanceTimer > 0 || state.tutorial.subPhase === "graduated")));
            if (inPostMakeWait) {
              b.x = clamp(b.x + b.lvx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
              b.y = clamp(b.y + b.lvy * dt, 0.55, getCourtLength() - 0.55);
              b.z += b.lvz * dt;
              b.lvz -= 9.8 * dt;
              if (b.z <= 0.24) {
                if (b.lvz < -0.55) {
                  SoundEngine.playDribbleBounce(clamp(Math.abs(b.lvz) * 0.24, 0.38, 0.78));
                }
                b.z = 0.24;
                b.lvz = Math.abs(b.lvz) * 0.52;
                b.lvx *= 0.78;
                b.lvy *= 0.78;
              }
              b.spinPhase += dt * 4.5;
            } else {
              b.postMakeDrop = false;
              const holder = b.holderTeam === "offense" ? state.offense[b.holderIdx] : state.defense[b.holderIdx];
              const holdAng = holder.facing !== undefined ? holder.facing : holder.gazeAngle;
              const cosF = Math.cos(holdAng);
              const sinF = Math.sin(holdAng);
              const rx = -sinF;
              const ry = cosF;
              const dHand = (holder.dribbleHand || 1) >= 0 ? 1 : -1;
              const holderSpd = Math.sqrt(holder.vx * holder.vx + holder.vy * holder.vy);
              const isGatherOrInb = b.gatherTimer > 0 || state.inbound.active;
              const isLowCross = !isUserOnDefenseNow() && b.holderTeam === "offense" && holder.id === 0 && state.rhythm.crossoverTimer > 0;

              // Continuous Phase Integrator (Zero Vertical Teleport Across Speed Thresholds!)
              const holderId = (b.holderTeam === "offense" ? 0 : 8) + b.holderIdx;
              if (b.prevBounceHolderId !== holderId || b.dribblePhase === undefined) {
                b.prevBounceHolderId = holderId;
                b.dribblePhase = (holder.id * 0.23) % 1.0;
              }
              let uBounce = b.dribblePhase;
              if (!isGatherOrInb && dt > 0 && state.playPhase === "live") {
                const spdRatio = clamp(holderSpd / 5.5, 0, 1);
                const freq = isLowCross ? 3.85 : lerp(2.45, 3.55, spdRatio);
                const nextRaw = uBounce + dt * freq;
                if (nextRaw >= 1.0) {
                  const isUserHolder =
                    (state.fullCourt && b.holderTeam === "offense" && holder.id === 0) ||
                    (!state.fullCourt && state.role === b.holderTeam && holder.id === 0);
                  SoundEngine.playDribbleBounce(isUserHolder ? 1.0 : 0.72);
                }
                uBounce = nextRaw % 1.0;
                b.dribblePhase = uBounce;
              }
              b.prevBouncePhase = uBounce;

              const parabola = 1.0 - 4.0 * (uBounce - 0.5) * (uBounce - 0.5);
              const minBounceZ = isLowCross ? 0.3 : 0.36;
              const ampBounceZ = isLowCross ? 0.34 : 0.4;
              // Single 0.30s Cosine Crossover Sweep Across Body (Zero Multi-Oscillation Jitter!)
              let sideOff = 0.06;
              if (!isGatherOrInb) {
                if (isLowCross) {
                  const uSweep = clamp((0.72 - state.rhythm.crossoverTimer) / 0.3, 0, 1);
                  sideOff = -Math.cos(Math.PI * uSweep) * 0.18 * dHand;
                } else {
                  sideOff = 0.18 * dHand;
                }
              }
              const fwdOff = 0.24;

              b.x = holder.x + cosF * fwdOff + rx * sideOff;
              b.y = holder.y + sinF * fwdOff + ry * sideOff;
              b.z = (holder.jumpZ || 0) + (isGatherOrInb ? 0.94 : minBounceZ + parabola * ampBounceZ);
              b.spinPhase += dt * (4.8 + holderSpd * 0.9);
            }
          } else {
            const b = state.ball;
            b.spinPhase += dt * 15.0;
            let trNode = null;
            if (b.trail.length >= 6) {
              trNode = b.trail.shift();
            } else if (_trailPool.length > 0) {
              trNode = _trailPool.pop();
            } else {
              trNode = { x: 0, y: 0, z: 0 };
            }
            trNode.x = b.x;
            trNode.y = b.y;
            trNode.z = b.z;
            b.trail.push(trNode);

            b.t += dt / b.duration;
            const u = clamp(b.t, 0, 1);

            if (b.flightType === "pass") {
              const pTeam = b.passTeam || "offense";
              const recvArr = pTeam === "offense" ? state.offense : state.defense;
              const target = recvArr[b.targetIdx];
              b.toX = target.x;
              b.toY = target.y;
              b.x = lerp(b.fromX, b.toX, u);
              b.y = lerp(b.fromY, b.toY, u);
              b.z = 1.22 + Math.sin(u * Math.PI) * 0.44;
              const inbSafe = !!b.isInbound;

              if (!inbSafe) {
                if (pTeam === "offense") {
                  // 1) User On-Ball Pass Deflection if thrown into a defender's lane!
                  if ((state.fullCourt || state.role === "offense") && b.fromIdx === 0) {
                    if (b.userPassBlockedBy !== -1 && u >= b.userPassBlockT) {
                      triggerUserPassDeflected(b.userPassBlockedBy);
                      return;
                    }
                    if (u > 0.2 && u < 0.86) {
                      for (let d = 0; d < state.defense.length; d++) {
                        const def = state.defense[d];
                        if (def.offBalanceTimer > 0) continue;
                        const closeAtRelease = (def.x - b.fromX) * (def.x - b.fromX) + (def.y - b.fromY) * (def.y - b.fromY) < 3.8025;
                        if (closeAtRelease && u < 0.38) continue;
                        const hitRad = closeAtRelease ? 0.32 : def.ballWatchFactor > 0.62 ? 0.36 : 0.56;
                        const dx = def.x - b.x;
                        const dy = def.y - b.y;
                        if (dx * dx + dy * dy <= hitRad * hitRad) {
                          triggerUserPassDeflected(d);
                          return;
                        }
                      }
                    }
                  }

                  // 2) Half-Court Defense Pass-Lane Steal by User!
                  if (!state.fullCourt && state.role === "defense" && u > 0.16 && u < 0.9) {
                    const meDef = state.defense[0];
                    const stealRadius = meDef.contestTimer > 0 ? 1.4 : 0.88;
                    const dx = meDef.x - b.x;
                    const dy = meDef.y - b.y;
                    if (dx * dx + dy * dy < stealRadius * stealRadius) {
                      triggerUserSteal(true);
                      return;
                    }
                  }
                } else {
                  // Full-Court Red CPU Pass -> Check Blue User & AI Interception!
                  if (u > 0.16 && u < 0.9) {
                    const meBlue = state.offense[0];
                    const myStealRad = meBlue.contestTimer > 0 ? 1.48 : 0.85;
                    const dxM = meBlue.x - b.x;
                    const dyM = meBlue.y - b.y;
                    if (dxM * dxM + dyM * dyM < myStealRad * myStealRad) {
                      triggerUserSteal(true);
                      return;
                    }
                    for (let mIdx = 1; mIdx < state.offense.length; mIdx++) {
                      const mate = state.offense[mIdx];
                      const dx = mate.x - b.x;
                      const dy = mate.y - b.y;
                      if (dx * dx + dy * dy < 0.2025) {
                        state.matchScore.steals += 1;
                        b.inFlight = false;
                        b.isInbound = false;
                        b.flightType = "none";
                        b.holderTeam = "offense";
                        b.holderIdx = mIdx;
                        _recycleBallTrail();
                        state.playPhase = "live";
                        SoundEngine.playStealOrBlock(true);
                        spawnSparkles(mate.x, mate.y, "#38bdf8", 12);
                        setCoachMessage("good", "⚡", "INTERCEPT!!", 1.2);
                        syncAllDOM();
                        return;
                      }
                    }
                  }
                }
              }

              if (u >= 1) {
                const prevFrom = b.fromIdx;
                const wasDK = b.wasDriveKickPass;
                const wasCut = b.wasCutPass;
                b.wasDriveKickPass = false;
                b.wasCutPass = false;
                b.wasAICutPass = false;
                b.isInbound = false;
                b.inFlight = false;
                b.flightType = "none";
                b.holderTeam = pTeam;
                b.holderIdx = b.targetIdx;
                _recycleBallTrail();
                state.playPhase = "live";
                state.phaseTimer = 0;
                SoundEngine.playCatchPop();

                if (pTeam === "offense") {
                  if ((state.fullCourt || state.role === "offense") && b.holderIdx === 0) {
                    state.passAssist.active = false;
                    if (!state.fullCourt && state.scenario === "give_go" && state.giveGoStage === 2) {
                      state.giveGoStage = 3;
                      setCoachMessage("good", "🔥", "FINISH! PRESS SPACE!", 1.0);
                    }
                    spawnSparkles(target.x, target.y, "#facc15", 8);
                  } else if ((state.fullCourt || state.role === "offense") && prevFrom === 0 && b.holderIdx > 0) {
                    const rIdx = b.holderIdx;
                    const rec = state.offense[rIdx];
                    let closestDefSq = 9999;
                    for (let d = 0; d < state.defense.length; d++) {
                      const def = state.defense[d];
                      const dSq = (rec.x - def.x) * (rec.x - def.x) + (rec.y - def.y) * (rec.y - def.y);
                      if (dSq < closestDefSq) closestDefSq = dSq;
                    }
                    const closestDef = Math.sqrt(closestDefSq);
                    const distRecRim = Math.sqrt((rec.x - COURT.rimX) * (rec.x - COURT.rimX) + (rec.y - COURT.rimY) * (rec.y - COURT.rimY));

                    if (state.scenario !== "give_go" && wasCut && distRecRim < 5.6 && closestDef >= 0.65) {
                      state.passAssist.active = true;
                      state.passAssist.mode = "cut_layup";
                      state.passAssist.partnerIdx = rIdx;
                      state.passAssist.timer = 0.18;
                      state.passAssist.returnLookTimer = 0;
                      state.passAssist.wasDriveKick = false;
                      b.gatherTimer = 0.18;
                      spawnSparkles(rec.x, rec.y, "#38bdf8", 12);
                      setCoachMessage("good", "🎯", "GREAT CUT PASS!", 1.0);
                    } else if (
                      state.scenario !== "give_go" &&
                      distRecRim < 9.6 &&
                      ((wasDK && closestDef >= 1.3) || (closestDef >= 1.85 && distRecRim < 7.6))
                    ) {
                      state.passAssist.active = true;
                      state.passAssist.mode = "drive_kick_shot";
                      state.passAssist.partnerIdx = rIdx;
                      state.passAssist.timer = 0.24;
                      state.passAssist.returnLookTimer = 0;
                      state.passAssist.wasDriveKick = true;
                      b.gatherTimer = 0.24;
                      spawnSparkles(rec.x, rec.y, "#38bdf8", 10);
                      setCoachMessage("good", "🎯", "GREAT PASS!", 0.9);
                    } else if (rec.y < 12.0) {

                }

            } else if (b.flightType === "shot") {
              b.x = lerp(b.fromX, b.toX, u);
              b.y = lerp(b.fromY, b.toY, u);
              const peakZ = 4.55;
              const linearZ = lerp(b.fromZ, b.toZ, u);
              b.z = linearZ + Math.sin(u * Math.PI) * (peakZ - linearZ * 0.65);

              if (u >= 1) {
                const wasAssist = b.assistedByUser;

                const pts = b.shotPoints || 2;
                const rim = getTeamTargetRim(sTeam);
                b.inFlight = false;
                b.flightType = "none";
                b.assistedByUser = false;
                _recycleBallTrail();
                if (b.shotMake) {
                  SoundEngine.playNetSwish(pts, wasAssist);
                } else {
                  SoundEngine.playRimClank();
                }

                // Seamless Non-Stop Full-Court Shot Resolution!
                if (state.fullCourt) {
                  if (b.shotMake) {
                    state.fx.netSwishTimer = 1.05;
                    state.fx.netSwishHoop = rim.sign;
                    state.fx.crowdCheerTimer = 1.25;
                    if (sTeam === "offense") {
                      recordMatchBasket("you", pts, rim.x, rim.y, wasAssist);
                      spawnSparkles(rim.x, rim.y, wasAssist ? "#38bdf8" : "#facc15", 22);
                      if (!checkAndHandleMatchWin(rim.x, rim.y)) {
                        const msg = wasAssist ? "ASSIST! +" + pts + "!" : pts === 3 ? "SPLASH!! +3!" : "SWISH!! +2!";
                        setCoachMessage("celebrate", "🏀", msg, 1.6);

                    } else {

                      if (!checkAndHandleMatchWin(rim.x, rim.y)) {
                        setCoachMessage("warn", "🏀", "CPU +" + pts + "! GO!", 1.5);
                        startFullCourtInbound("offense");
                      }
                    }
                  } else {
                    // Missed Shot -> Calibrated Live 3D Rim-Bounce Rebound!
                    if (sTeam === "defense" && b.contestedByUser) {
                      state.matchScore.stops += 1;
                      state.fx.crowdCheerTimer = 1.0;
                      spawnSparkles(state.offense[0].x, state.offense[0].y, "#22c55e", 12);
                      setCoachMessage("celebrate", "🛑", "GREAT STOP!!", 1.3);
                    } else {
                      setCoachMessage("normal", "🏀", "REBOUND! GET IT!", 1.1);
                    }
                    b.contestedByUser = false;
                    spawnRimBounceLooseBall(sTeam, rim, b.shotType, b.fromX);
                  }

                // Handle Offense Tutorial Shot Completion (Natural Swish Drop Beneath Hoop!)
                if (state.scenario === "tutorial") {
                  const tut = state.tutorial;
                  state.fx.netSwishTimer = 1.05;
                  state.fx.netSwishHoop = 1;
                  state.fx.crowdCheerTimer = 1.1;
                  spawnSparkles(COURT.rimX, COURT.rimY, "#facc15", 18);

                  b.postMakeDrop = true;

                  b.y = COURT.rimY + 0.08;

                  if (tut.step === 2) {

                  } else if (tut.step === 4) {

                    spawnSparkles(state.offense[0].x, state.offense[0].y, "#38bdf8", 18);
                    setCoachMessage("celebrate", "🏆", "ALL CLEAR! YOU ROCK!", 3.5);
                  }

                // Handle Defense Tutorial Shot Completion
                if (state.scenario === "learn_d") {
                  const tut = state.tutorial;
                  state.playPhase = "live";
                  if (!b.shotMake) {
                    tut.completedSteps[tut.step] = true;
                    state.fx.crowdCheerTimer = 1.1;
                    spawnSparkles(state.defense[0].x, state.defense[0].y, "#22c55e", 16);
                    if (tut.step === 2) {
                      tut.advanceTimer = 1.35;
                      tut.nextStepAfterAdvance = 3;
                      setCoachMessage("celebrate", "🛑", "GREAT STOP! NEXT: HELP!", 1.8);
                    } else if (tut.step === 4) {

                      setCoachMessage("celebrate", "🏆", "DEFENSE MASTER!!", 3.5);

                  } else {

                    setCoachMessage("warn", "🖐️", "TRY AGAIN! PRESS SPACE!", 1.2);
                  }

                }

                // Half-Court Missed Shot -> Live 3D Rim-Bounce Rebound (5v5 MATCH & Practice Drills)!
                if (!b.shotMake) {
                  if (state.role === "defense" && b.contestedByUser) {
                    state.fx.crowdCheerTimer = 1.0;
                    spawnSparkles(state.defense[0].x, state.defense[0].y, "#22c55e", 12);
                    setCoachMessage("good", "🛑", "CONTESTED! REBOUND!", 1.1);
                  } else {
                    setCoachMessage("normal", "🏀", "REBOUND! GET IT!", 1.1);
                  }
                  b.contestedByUser = false;
                  spawnRimBounceLooseBall(sTeam, rim, b.shotType, b.fromX);
                  syncAllDOM();
                  return;
                }

                // Half-Court Made Shot Resolution -> Natural Drop Through Net & Celebrate!
                state.playPhase = "celebrate";
                state.phaseTimer = 0;
                b.postMakeDrop = true;
                b.x = COURT.rimX;
                b.y = COURT.rimY + 0.08;
                b.z = COURT.rimZ - 0.12;
                b.lvx = (Math.random() - 0.5) * 0.3;
                b.lvy = 0.44;
                b.lvz = -1.85;

                if (state.role === "offense") {
                  state.fx.netSwishTimer = 1.05;
                  state.fx.netSwishHoop = 1;
                  state.fx.crowdCheerTimer = 1.25;
                  if (state.scenario === "match") {
                    recordMatchBasket("you", pts, COURT.rimX, COURT.rimY, wasAssist);
