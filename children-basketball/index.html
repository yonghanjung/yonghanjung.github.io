          // 5) Compute Drive Circle-Drift Offset from Ball-Handler Penetration
          let driveDriftX = 0;
          let driveDriftY = 0;
          if (bh && bh.y < 6.5) {
            const pen = clamp((6.5 - bh.y) / 3.8, 0, 1);
            driveDriftX = clamp(-bh.x * 0.24, -1.15, 1.15) * pen;
            driveDriftY = (bh.y < 4.0 ? -0.45 : 0.35) * pen;
          }

          // 6) Move Each Off-Ball AI Teammate (Fast Break / Cut / Circle Fill / V-Cut Rhythm)
          for (let i = 1; i < state.offense.length; i++) {
            if (i === excludedIdx) continue;
            const mate = state.offense[i];
            const slot = PERIMETER_ARC_SLOTS[m.slotForPlayer[i]];

            if (state.ball.inFlight && state.ball.flightType === "pass" && state.ball.passTeam === "offense" && state.ball.targetIdx === i) {
              const leadX = state.ball.wasCutPass ? m.cutSide * 1.05 : state.ball.toX;
              const leadY = state.ball.wasCutPass ? 2.05 : state.ball.toY;
              moveAgentToward(mate, leadX, leadY, 5.15, dt, true);
              mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
              continue;
            }

            // A. Full-Court Fast-Break Sprint (5.1 - 5.3 m/s!)
            if (state.fullCourt && (mate.y > 12.2 || state.ball.y > 14.0)) {
              const isRimRunner = i === m.cutterIdx;
              const fbX = isRimRunner ? (slot.x >= 0 ? 1.2 : -1.2) : slot.x;
              const fbY = isRimRunner ? 2.45 : slot.y;
              moveAgentToward(mate, fbX, fbY, isRimRunner ? 5.28 : 5.1, dt, true);
              mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
              continue;
            }

            let tx = slot.x;
            let ty = slot.y;
            let spd = 4.15;
            let useSprint = false;

            // B. Active Cutter (Setup Jab -> 5.15 m/s Rim Slash -> Fast Clear-Out)
            if (!inTransition && i === m.cutterIdx) {
              if (m.cutPhase === "setup") {
                tx = lerp(slot.x, 0, 0.3);
                ty = clamp(slot.y - 0.9, 2.2, 9.2);
                spd = 3.95;
              } else if (m.cutPhase === "slash") {
                tx = m.cutSide * 1.22;
                ty = 2.08;
                spd = 5.15;
                useSprint = true;
              } else {
                tx = slot.x;
                ty = slot.y;
                spd = 4.75;
                useSprint = true;
              }
            } else {
              // C. Perimeter Circle Rotation + Drive Drift + Continuous V-Cut / L-Cut Footwork
              const distToSlot = hypot2(mate.x - slot.x, mate.y - slot.y);
              const ph = state.simTime * 3.15 + i * 1.62;
              const vJabIn = Math.sin(ph) * 1.18;
              const vFlare = Math.cos(ph * 0.85) * 0.92;
              const toCenterAng = Math.atan2(4.8 - slot.y, 0 - slot.x);
              const tangX = -Math.sin(toCenterAng);
              const tangY = Math.cos(toCenterAng);

              tx = slot.x + Math.cos(toCenterAng) * vJabIn + tangX * vFlare + driveDriftX;
              ty = slot.y + Math.sin(toCenterAng) * vJabIn + tangY * vFlare + driveDriftY;
              tx = clamp(tx, -6.65, 6.65);
              ty = clamp(ty, 1.65, 9.45);
              spd = distToSlot > 2.2 ? 4.35 : 3.45;
              useSprint = distToSlot > 3.2;
            }

            // D. Keep comfortable spacing from ★ YOU so AI cuts/fills never crowd the user!
            const minKeep = iHaveBall ? 2.65 : 2.95;
            const dMe = hypot2(tx - me.x, ty - me.y);
            if (dMe < minKeep && me.y < 11.8) {
              const pushAng = Math.atan2(ty - me.y, tx - me.x);
              tx = clamp(me.x + Math.cos(pushAng) * minKeep, -6.65, 6.65);
              ty = clamp(me.y + Math.sin(pushAng) * minKeep, 1.65, 9.55);
            }

            moveAgentToward(mate, tx, ty, spd, dt, useSprint);
            mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
          }
        }

        function updateDrillWeakSideMotion(dt, startIdx) {
          const me = state.offense[0];
          const m = state.motion;
          m.exchangeTimer += dt;
          if (m.exchangeTimer >= 2.45) {
            m.exchangeTimer = 0;
            m.exchangeFlip ^= 1;
          }
          for (let i = startIdx; i < state.offense.length; i++) {
            const mate = state.offense[i];
            let baseX = mate.homeX;
            let baseY = mate.homeY;
            if (startIdx <= 3 && (i === 3 || i === 4) && m.exchangeFlip === 1) {
              const other = state.offense[i === 3 ? 4 : 3];
              baseX = other.homeX;
              baseY = other.homeY;
            }
            const ph = state.simTime * 2.85 + i * 1.7;
            let tx = clamp(baseX + Math.cos(ph) * 0.95, -6.65, 6.65);
            let ty = clamp(baseY + Math.sin(ph * 1.15) * 1.05, 1.75, 9.45);

            if (state.targetSpot.active) {
              const dTarg = hypot2(tx - state.targetSpot.x, ty - state.targetSpot.y);
              if (dTarg < 3.85) {
                const ang = Math.atan2(ty - state.targetSpot.y, tx - state.targetSpot.x);
                tx = clamp(state.targetSpot.x + Math.cos(ang) * 3.85, -6.65, 6.65);
                ty = clamp(state.targetSpot.y + Math.sin(ang) * 3.85, 1.75, 9.45);
              }
            }
            if (hypot2(tx - me.x, ty - me.y) < 3.05) {
              const ang = Math.atan2(ty - me.y, tx - me.x);
              tx = clamp(me.x + Math.cos(ang) * 3.05, -6.65, 6.65);
              ty = clamp(me.y + Math.sin(ang) * 3.05, 1.75, 9.45);
            }

            moveAgentToward(mate, tx, ty, 3.35, dt);
            mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
          }
        }

        function updateFullCourtAI(dt) {
          const diff = getDiffProfile();
          const spdMult = diff.cpuActionMult;
          const defMult = diff.defSpeedMult;
          const me = state.offense[0];

          const blueSlots = [
            { x: 0.0, y: 8.6 },
            { x: -5.65, y: 6.1 },
            { x: 5.65, y: 6.1 },
            { x: -6.5, y: 2.2 },
            { x: 6.5, y: 2.2 },
          ];
          const redSlots = [
            { x: 0.0, y: 19.4 },
            { x: -5.65, y: 21.9 },
            { x: 5.65, y: 21.9 },
            { x: -6.5, y: 25.8 },
            { x: 6.5, y: 25.8 },
          ];

          // 0) Quick Baseline Inbound after a made basket
          if (state.inbound.active) {
            state.inbound.timer -= dt;
            if (state.inbound.team === "defense") {
              const inb = state.defense[1];
              moveAgentToward(inb, 1.45, -0.18, 5.0, dt, true);
              moveAgentToward(state.defense[0], 0.0, 4.2, 4.6 * spdMult, dt);
              inb.gazeAngle = Math.atan2(state.defense[0].y - inb.y, state.defense[0].x - inb.x);
              for (let i = 2; i < state.defense.length; i++) {
                moveAgentToward(state.defense[i], redSlots[i].x, lerp(state.defense[i].y, redSlots[i].y, 0.35), 4.4 * spdMult, dt);
              }
              for (let i = 1; i < state.offense.length; i++) {
                moveAgentToward(state.offense[i], redSlots[i].x * 0.82, 16.5 + i * 1.4, 4.2, dt);
              }
            } else {
              const inb = state.offense[1];
              moveAgentToward(inb, -1.45, COURT.fullLength + 0.18, 5.0, dt, true);
              inb.gazeAngle = Math.atan2(me.y - inb.y, me.x - inb.x);
              for (let i = 2; i < state.offense.length; i++) {
                moveAgentToward(state.offense[i], blueSlots[i].x, lerp(state.offense[i].y, blueSlots[i].y, 0.35), 4.5, dt);
              }
              for (let i = 0; i < state.defense.length; i++) {
                moveAgentToward(state.defense[i], blueSlots[i].x * 0.85, 11.5 - i * 1.1, 4.1 * defMult, dt);
              }
            }
            if (state.inbound.timer <= 0) {
              const iTeam = state.inbound.team;
              let rIdx = state.inbound.receiverIdx;
              if (iTeam === "offense" && hypot2(me.x - state.offense[1].x, me.y - state.offense[1].y) > 16.0) {
                rIdx = 2;
              }
              state.inbound.active = false;
              startTeamPass(iTeam, state.inbound.passerIdx, rIdx, { isInbound: true });
            }
            return;
          }

          // 1) Loose-Ball 3D Rebound Scramble!
          if (state.ball.loose) {
            for (let i = 1; i < state.offense.length; i++) {
              const mate = state.offense[i];
              const dBall = hypot2(mate.x - state.ball.x, mate.y - state.ball.y);
              if (dBall < 8.5 || i <= 2) {
                moveAgentToward(mate, state.ball.x, state.ball.y, 4.5, dt);
              } else {
                moveAgentToward(mate, blueSlots[i].x * 0.7, 13.0, 3.6, dt);
              }
              mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
            }
            for (let i = 0; i < state.defense.length; i++) {
              const def = state.defense[i];
              if (def.reactionTimer > 0) {
                continue;
              }
              const dBall = hypot2(def.x - state.ball.x, def.y - state.ball.y);
              if (dBall < 9.0 || i >= 2) {
                moveAgentToward(def, state.ball.x, state.ball.y, 4.45 * spdMult, dt);
              } else {
                moveAgentToward(def, redSlots[i].x * 0.7, 15.5, 3.8 * spdMult, dt);
              }
              def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
            }
            return;
          }

          // 2) Blue Team Has Possession -> Attack North Hoop (y = 1.575)!
          if (!isUserOnDefenseNow()) {
            const iHaveBall = !state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
            const m = state.motion;

            // Active Drive & Kick catch-and-shoot, Cut Layup, or Give & Go partner in frontcourt
            if (
              !iHaveBall &&
              state.passAssist.active &&
              !state.ball.inFlight &&
              state.ball.holderTeam === "offense" &&
              state.ball.holderIdx === state.passAssist.partnerIdx
            ) {
              const pIdx = state.passAssist.partnerIdx;
              const partner = state.offense[pIdx];
              if ((state.passAssist.mode === "drive_kick_shot" || state.passAssist.mode === "cut_layup") && partner.y < 11.5) {
                state.passAssist.timer -= dt;
                state.ball.gatherTimer = Math.max(0.05, state.passAssist.timer);
                if (state.passAssist.mode === "cut_layup") {
                  moveAgentToward(partner, COURT.rimX + (partner.x >= 0 ? 0.35 : -0.35), COURT.rimY + 0.55, 4.85, dt, true);
                } else {
                  moveAgentToward(partner, partner.x, partner.y, 0.8, dt);
                }
                partner.gazeAngle = Math.atan2(COURT.rimY - partner.y, COURT.rimX - partner.x);
                updateActiveOffBallTeammates(dt, pIdx);
                if (state.passAssist.timer <= 0 && state.playPhase === "live") {
                  state.passAssist.active = false;
                  startShot("offense", pIdx, null, true);
                }
              } else if (state.passAssist.mode === "triple_threat" && partner.y < 12.5) {
                state.passAssist.returnLookTimer -= dt;
                moveAgentToward(partner, partner.x, partner.y, 1.1, dt);
                partner.gazeAngle = Math.atan2(me.y - partner.y, me.x - partner.x);
                updateActiveOffBallTeammates(dt, pIdx);
                if (state.passAssist.returnLookTimer <= 0) {
                  state.passAssist.active = false;
                }
              } else {
                state.passAssist.active = false;
                updateActiveOffBallTeammates(dt, state.ball.inFlight ? -1 : state.ball.holderIdx);
              }
            } else if (iHaveBall || state.ball.inFlight) {
              // ★ YOU holds the ball (or pass is in the air): ALL 4 off-ball AI teammates run Read & React motion!
              updateActiveOffBallTeammates(dt, -1);
            } else {
              // An AI teammate (holderIdx > 0) holds the ball: other 3 AI teammates run active cuts & rotations!
              const hIdx = state.ball.holderIdx;
              const holder = state.offense[hIdx];
              updateActiveOffBallTeammates(dt, hIdx);

              m.aiPassTimer += dt;
              const meAhead = me.y < holder.y - 1.2 || (holder.y < 11.0 && state.lane.open);
              if (meAhead && !checkPassLineBlocked(holder, me).blocked && hypot2(me.x - holder.x, me.y - holder.y) < 16.5) {
                m.aiPassTimer = 0;
                startTeamPass("offense", hIdx, 0);
                setCoachMessage("good", "🔥", holder.y > 12.0 ? "FAST BREAK! GO!" : "OPEN! PASS COMING!", 1.1);
              } else {
                // Check if our slashing AI cutter is open in the paint!
                const cIdx = m.cutterIdx;
                const cutter = state.offense[cIdx];
                if (cIdx >= 1 && cIdx !== hIdx && m.cutPhase === "slash" && cutter.y < 4.8 && m.aiPassTimer >= 0.72) {
                  const cDefDist = dist2(cutter, state.defense[cIdx]);
                  if (cDefDist > 1.2 && !checkPassLineBlocked(holder, cutter).blocked) {
                    m.aiPassTimer = 0;
                    startTeamPass("offense", hIdx, cIdx, { wasAICutPass: true });
                  }
                }

                if (!state.ball.inFlight) {
                  const slot = PERIMETER_ARC_SLOTS[m.slotForPlayer[hIdx]];
                  const probeX = lerp(slot.x, 0, 0.48) + Math.sin(state.simTime * 2.6 + hIdx) * 0.95;
                  const probeY = holder.y > 10.5 ? 7.6 : 4.25;
                  moveAgentToward(holder, probeX, probeY, 4.55 * spdMult, dt);
                  holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);

                  const dRim = hypot2(holder.x - COURT.rimX, holder.y - COURT.rimY);
                  let nearDef = 99;
                  for (let d = 0; d < state.defense.length; d++) nearDef = Math.min(nearDef, dist2(holder, state.defense[d]));
                  if (dRim < 2.85 && nearDef > 1.2) {
                    startShot("offense", hIdx, null, false);
                  } else if (holder.y < 10.2 && m.aiPassTimer >= 1.35) {
                    m.aiPassTimer = 0;
                    let bestM = !checkPassLineBlocked(holder, me).blocked ? 0 : -1;
                    let bestOpen = -1;
                    if (bestM === -1) {
                      for (let k = 1; k < state.offense.length; k++) {
                        if (k === hIdx) continue;
                        const sep = dist2(state.offense[k], state.defense[k]);
                        if (!checkPassLineBlocked(holder, state.offense[k]).blocked && sep > bestOpen) {
                          bestOpen = sep;
                          bestM = k;
                        }
                      }
                    }
                    if (bestM === -1) bestM = (hIdx % 4) + 1;
                    startTeamPass("offense", hIdx, bestM);
                  }
                }
              }
            }

            // Red AI Defense (Transition back to North Hoop y = 1.575 + Cutter Lag + Help Defense)
            const kickInAir =
              state.ball.inFlight &&
              state.ball.flightType === "pass" &&
              state.ball.passTeam === "offense" &&
              state.ball.fromIdx === 0 &&
              state.ball.t < 0.62;
            for (let i = 0; i < state.defense.length; i++) {
              const def = state.defense[i];
              const man = state.offense[i];
              if (def.reactionTimer > 0) {
                def.vx = def.inertiaVx;
                def.vy = def.inertiaVy;
                def.x = clamp(def.x + def.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
                def.y = clamp(def.y + def.vy * dt, 0.55, COURT.fullLength - 0.55);
                updatePlayerJumpAndPose(def, dt, false, false, false);
                continue;
              }

              const manHasBall = !state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === i;
              const toRimX = COURT.rimX - man.x;
              const toRimY = COURT.rimY - man.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              const isUserConstSprint =
                i === 0 &&
                def.offBalanceTimer <= 0 &&
                state.rhythm.burstBoostTimer <= 0 &&
                keys.Shift &&
                (hypot2(man.vx, man.vy) > 1.0 || state.rhythm.monotoneSprintTime > 0);

              if (isUserConstSprint) {
                def.paceAdapt = Math.min(1.0, (def.paceAdapt || 0) + dt * 3.5);
                const lockCushion = manHasBall ? (state.difficulty === "hard" ? 1.04 : 0.98) : 0.84;
                const tx = man.x + (toRimX / dRim) * lockCushion + man.vx * 0.115;
                const ty = man.y + (toRimY / dRim) * lockCushion + man.vy * 0.115;
                def.ballWatchFactor = 0.08;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                moveAgentToward(def, tx, ty, 5.65, dt, false, true);
                continue;
              }
              def.paceAdapt = Math.max(0, (def.paceAdapt || 0) - dt * 1.6);

              const cushion = manHasBall ? 1.06 - (state.difficulty === "hard" ? 0.08 : 0) : i === 0 ? 1.12 : 1.28;
              let tx = man.x + (toRimX / dRim) * cushion;
              let ty = man.y + (toRimY / dRim) * cushion;
              let defSpd = def.offBalanceTimer > 0 ? 1.65 : 4.65 * defMult;
              def.ballWatchFactor = clamp(0.25 + diff.ballWatchBoost, 0, 1);

              if (i === 0 && !manHasBall && state.passAssist.active && state.passAssist.mode === "triple_threat") {
                def.ballWatchFactor = 0.9;
                const tbX = state.ball.x - man.x;
                const tbY = state.ball.y - man.y;
                const dB = Math.max(0.01, hypot2(tbX, tbY));
                tx = man.x + (tbX / dB) * 0.78;
                ty = man.y + (tbY / dB) * 0.78;
              } else if (
                !manHasBall &&
                ((i === state.motion.cutterIdx && state.motion.cutPhase === "slash") ||
                  (state.ball.inFlight && state.ball.wasCutPass && state.ball.targetIdx === i))
              ) {
                // Cutter beat defender with setup V-step -> defender trails to the outside, opening interior cut lane!
                def.ballWatchFactor = 0.72;
                tx = clamp(man.x + state.motion.cutSide * 1.58, -6.5, 6.5);
                ty = clamp(man.y + 0.38, 1.35, 9.2);
                defSpd = 4.1 * defMult;
              } else if (!manHasBall && (iHaveBall || kickInAir) && me.y < 8.5) {
                const userDistRim = hypot2(me.x - COURT.rimX, me.y - COURT.rimY);
                const collapse = clamp((6.2 - userDistRim) / 3.0, 0, 0.7);
                if (collapse > 0.04) {
                  const helpX = COURT.rimX + (man.x >= 0 ? 0.65 : -0.65);
                  const helpY = COURT.rimY + 0.75;
                  tx = lerp(tx, helpX, collapse);
                  ty = lerp(ty, helpY, collapse);
                  def.ballWatchFactor = clamp(0.38 + collapse * 0.6 + diff.ballWatchBoost, 0, 1);
                }
              }

              def.gazeAngle =
                def.ballWatchFactor > 0.52 ? Math.atan2(state.ball.y - def.y, state.ball.x - def.x) : Math.atan2(man.y - def.y, man.x - def.x);
              moveAgentToward(def, tx, ty, defSpd, dt, false, i === 0 && def.offBalanceTimer <= 0);
            }
            return;
          }

          // 3) Red Team Has Possession -> Attack South Hoop (y = 26.425)!
          // Blue AI Teammates (1..4): Fast-Break Sprint Back + On-Ball Pressure + Help Stunt & Recover + Cut Deny!
          state.motion.redExchangeTimer += dt;
          if (state.motion.redExchangeTimer >= 2.15) {
            state.motion.redExchangeTimer = 0;
            state.motion.redExchangeFlip ^= 1;
          }

          for (let i = 1; i < state.offense.length; i++) {
            const blueDef = state.offense[i];
            const redMan = state.defense[i];
            const manHasBall = !state.ball.inFlight && state.ball.holderTeam === "defense" && state.ball.holderIdx === i;
            const sprintBack = blueDef.y < 17.2 && state.ball.y > 14.5;
            const toSouthX = COURT.rimX - redMan.x;
            const toSouthY = COURT.southRimY - redMan.y;
            const dSouth = Math.max(0.01, hypot2(toSouthX, toSouthY));
            let tx = redMan.x + (toSouthX / dSouth) * (manHasBall ? 1.06 : 1.28);
            let ty = redMan.y + (toSouthY / dSouth) * (manHasBall ? 1.06 : 1.28);

            if (manHasBall) {
              tx += Math.sin(state.simTime * 5.2 + i) * 0.32;
            } else if (i === state.defDrill.cutterIdx) {
              tx = lerp(redMan.x, state.ball.x, 0.22);
              ty = clamp(redMan.y + 0.45, 16.0, COURT.fullLength - 0.8);
            } else if (state.ball.y > 18.0) {
              const stunt = 0.5 + 0.5 * Math.sin(state.simTime * 4.1 + i * 1.5);
              const helpX = lerp(COURT.rimX, state.ball.x, 0.3);
              const helpY = COURT.southRimY - 2.15;
              tx = lerp(tx, helpX, 0.16 + stunt * 0.24);
              ty = lerp(ty, helpY, 0.16 + stunt * 0.22);
            }
            moveAgentToward(blueDef, tx, clamp(ty, 1.0, COURT.fullLength - 0.8), sprintBack ? 5.15 : 4.65, dt, sprintBack);
            blueDef.gazeAngle = Math.atan2(state.ball.y - blueDef.y, state.ball.x - blueDef.x);
          }

          if (state.ball.inFlight) {
            for (let i = 0; i < state.defense.length; i++) {
              const rP = state.defense[i];
              const ph = state.simTime * 2.9 + i * 1.4;
              moveAgentToward(rP, redSlots[i].x + Math.cos(ph) * 0.85, redSlots[i].y + Math.sin(ph) * 0.75, 4.45 * spdMult, dt);
            }
            return;
          }

          const dd = state.defDrill;
          dd.timer += dt * spdMult;
          dd.actionTimer += dt * spdMult;
          dd.passTimer = (dd.passTimer || 0) + dt * spdMult;

          const bhIdx = state.ball.holderIdx;
          const bh = state.defense[bhIdx];

          for (let i = 0; i < state.defense.length; i++) {
            const rP = state.defense[i];
            if (rP.reactionTimer > 0) {
              continue;
            }
            if (i === bhIdx) continue;
            if (i === dd.cutterIdx && bh.y > 16.5) {
              const cutX = redSlots[i].x >= 0 ? 1.15 : -1.15;
              moveAgentToward(rP, cutX, 25.75, 4.95 * spdMult, dt, true);
              if (hypot2(rP.x - cutX, rP.y - 25.75) < 1.35 || dd.passTimer > 2.0) {
                dd.cutterIdx = (dd.cutterIdx + 1) % 5;
                if (dd.cutterIdx === bhIdx) dd.cutterIdx = (dd.cutterIdx + 1) % 5;
                dd.passTimer = 0;
              }
            } else {
              let slotIdx = i;
              if (state.motion.redExchangeFlip === 1) {
                if (i === 1 && bhIdx !== 3) slotIdx = 3;
                else if (i === 3 && bhIdx !== 1) slotIdx = 1;
                else if (i === 2 && bhIdx !== 4) slotIdx = 4;
                else if (i === 4 && bhIdx !== 2) slotIdx = 2;
              }
              const ph = state.simTime * 3.0 + i * 1.55;
              const rx = clamp(redSlots[slotIdx].x + Math.cos(ph) * 1.05, -6.65, 6.65);
              const ry = clamp(redSlots[slotIdx].y + Math.sin(ph * 1.1) * 0.95, 17.5, COURT.fullLength - 1.1);
              moveAgentToward(rP, rx, ry, 4.55 * spdMult, dt);
            }
            rP.gazeAngle = Math.atan2(bh.y - rP.y, bh.x - rP.x);
          }

          if (bh.reactionTimer > 0) return;

          // Backcourt / Transition Push toward South Hoop (y = 26.425)
          if (bh.y < 17.5) {
            state.ball.gatherTimer = 0;
            if (dd.actionTimer > 0.55) {
              for (let m = 0; m < state.defense.length; m++) {
                if (m === bhIdx) continue;
                const wing = state.defense[m];
                if (wing.y > bh.y + 3.2 && wing.y > 14.5 && !checkTeamPassBlocked("defense", bh, wing).blocked) {
                  dd.actionTimer = 0;
                  startTeamPass("defense", bhIdx, m);
                  return;
                }
              }
            }
            const weaveX = clamp(redSlots[bhIdx].x * 0.35 + Math.sin(state.simTime * 2.2) * 1.1, -5.2, 5.2);
            moveAgentToward(bh, weaveX, 19.6, 4.55 * spdMult, dt);
            bh.gazeAngle = Math.atan2(COURT.southRimY - bh.y, COURT.rimX - bh.x);
            return;
          }

          // Frontcourt Offense around South Hoop (0, 26.425)
          if (dd.cutterIdx === -1 && dd.timer > 1.6) {
            dd.cutterIdx = (bhIdx + 2) % 5;
            if (dd.cutterIdx === bhIdx) dd.cutterIdx = (bhIdx + 1) % 5;
            dd.passTimer = 0;
          }

          if (state.ball.gatherTimer <= 0 && dd.cutterIdx !== -1 && dd.actionTimer > 0.85) {
            const cutter = state.defense[dd.cutterIdx];
            let closestBlue = 99;
            for (let b = 0; b < state.offense.length; b++) closestBlue = Math.min(closestBlue, dist2(cutter, state.offense[b]));
            if (closestBlue > 1.75 && !checkTeamPassBlocked("defense", bh, cutter).blocked && hypot2(cutter.x, cutter.y - 25.75) < 3.2) {
              const target = dd.cutterIdx;
              dd.cutterIdx = -1;
              dd.actionTimer = 0;
              dd.passTimer = 0;
              startTeamPass("defense", bhIdx, target);
              setCoachMessage("warn", "🚨", "CUT PASS! CONTEST!", 1.0);
              return;
            }
          }

          const distSouthRim = hypot2(bh.x - COURT.rimX, bh.y - COURT.southRimY);
          let closestBlueDef = 99;
          for (let b = 0; b < state.offense.length; b++) {
            closestBlueDef = Math.min(closestBlueDef, dist2(bh, state.offense[b]));
          }

          if (
            (distSouthRim < 2.6 && dd.actionTimer > 0.45) ||
            (closestBlueDef > 2.25 && distSouthRim < 8.2 && dd.actionTimer > 1.05) ||
            dd.timer > 6.2
          ) {
            state.ball.gatherTimer += dt;
            moveAgentToward(bh, bh.x, bh.y, 0.9, dt);
            bh.gazeAngle = Math.atan2(COURT.southRimY - bh.y, COURT.rimX - bh.x);
            if (dist2(me, bh) < 3.6) {
              setCoachMessage("warn", "🖐️", "SHOT! PRESS SPACE!", 0.3);
            }
            if (dist2(me, bh) < 2.35 && me.contestTimer > 0) {
              state.ball.contestedByUser = true;
              state.ball.gatherTimer = 0;
              startShot("defense", bhIdx, null, false, { wasContested: true });
              return;
            }
            if (state.ball.gatherTimer >= diff.cpuGatherSec) {
              state.ball.gatherTimer = 0;
              const contestedByMe = dist2(me, bh) < 1.85 && me.contestTimer > 0;
              const contestedByAI = closestBlueDef < 1.02 && Math.random() < 0.38;
              startShot("defense", bhIdx, null, false, { wasContested: contestedByMe || contestedByAI });
              return;
            }
            return;
          }

          state.ball.gatherTimer = 0;

          if (dd.actionTimer > 0.95) {
            moveAgentToward(bh, bh.x * 0.25, 25.55, 4.35 * spdMult, dt);
            bh.gazeAngle = Math.atan2(COURT.southRimY - bh.y, COURT.rimX - bh.x);

            let paintBlueHelpers = 0;
            for (let b = 0; b < state.offense.length; b++) {
              if (dist2(bh, state.offense[b]) < 2.0) paintBlueHelpers++;
            }
            if (paintBlueHelpers >= 2 && dd.actionTimer > 1.45) {
              let bestM = (bhIdx + 1) % 5;
              let bestOpen = -1;
              for (let m = 0; m < state.defense.length; m++) {
                if (m === bhIdx) continue;
                let minB = 99;
                for (let b = 0; b < state.offense.length; b++) minB = Math.min(minB, dist2(state.defense[m], state.offense[b]));
                if (minB > bestOpen && !checkTeamPassBlocked("defense", bh, state.defense[m]).blocked) {
                  bestOpen = minB;
                  bestM = m;
                }
              }
              dd.actionTimer = 0;
              startTeamPass("defense", bhIdx, bestM);
            }
          } else {
            moveAgentToward(bh, redSlots[bhIdx].x + Math.sin(state.simTime * 2.3) * 0.7, redSlots[bhIdx].y + 0.3, 3.2 * spdMult, dt);
            bh.gazeAngle = Math.atan2(COURT.southRimY - bh.y, COURT.rimX - bh.x);
          }
        }

        function updateOffenseAI(dt) {
          if (state.fullCourt) {
            updateFullCourtAI(dt);
            return;
          }
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;
          const pg = state.offense[1];

          // 1) Tutorials
          if (state.scenario === "tutorial") {
            const tut = state.tutorial;
            const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;
            if (!iHaveBall) {
              if (tut.step === 1) {
                moveAgentToward(pg, -1.3, 6.2 + Math.sin(state.simTime * 2) * 0.2, 2.2, dt);
              } else if (tut.step === 2) {
                const driveDepth = clamp(state.simTime / 0.6, 0, 1);
                moveAgentToward(pg, lerp(-0.9, -1.2, driveDepth), lerp(7.4, 3.7, driveDepth), 3.6, dt);
              } else {
                moveAgentToward(pg, pg.homeX + Math.sin(state.simTime * 1.6) * 0.4, pg.homeY, 2.4, dt);
              }
              pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
            }
            for (let i = iHaveBall ? 1 : 2; i < state.offense.length; i++) {
              moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.5, dt);
              state.offense[i].gazeAngle = Math.atan2(state.ball.y - state.offense[i].y, state.ball.x - state.offense[i].x);
            }
            return;
          }

          if (state.scenario === "learn_d") {
            const tut = state.tutorial;
            if (tut.step === 1) {
              const swingX = Math.sin(state.simTime * 2.1) * 2.35;
              moveAgentToward(state.offense[0], swingX, 8.0, 3.4, dt);
              state.offense[0].gazeAngle = Math.atan2(COURT.rimY - state.offense[0].y, COURT.rimX - state.offense[0].x);
            } else if (tut.step === 2) {
              moveAgentToward(state.offense[0], 0.0, 6.8, 2.0, dt);
              state.offense[0].gazeAngle = Math.atan2(COURT.rimY - state.offense[0].y, COURT.rimX - state.offense[0].x);
            } else if (tut.step === 3) {
              moveAgentToward(state.offense[1], 4.6 + Math.sin(state.simTime * 2) * 0.5, 6.6, 2.6, dt);
              moveAgentToward(state.offense[0], -5.65, 6.0, 2.2, dt);
            } else if (tut.step === 4) {
              if (!state.ball.inFlight && state.ball.holderIdx === 1) {
                moveAgentToward(state.offense[1], 0.3, 7.5, 3.2, dt);
              } else if (!state.ball.inFlight && state.ball.holderIdx === 0 && state.playPhase === "live") {
                state.phaseTimer += dt;
                state.ball.gatherTimer = 0.8;
                const dMe = dist2(state.defense[0], state.offense[0]);
                if (dMe < 2.3 && state.defense[0].contestTimer > 0) {
                  state.ball.contestedByUser = true;
                  startShot("offense", 0, false);
                } else if (state.phaseTimer > 1.85) {
                  startShot("offense", 0, true);
                }
              }
            }
            for (let i = 2; i < state.offense.length; i++) {
              moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.4, dt);
            }
            return;
          }

          // 2) User on Offense (Drills & 5v5 Match Offense)
          if (state.role === "offense") {
            const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;
            if (iHaveBall) {
              if (state.scenario === "match") {
                // Full Read & React Motion Offense when ★ YOU holds the ball in 5v5 MATCH!
                updateActiveOffBallTeammates(dt, -1);
                return;
              }
              if (state.scenario === "give_go") {
                const ph1 = state.simTime * 2.8;
                moveAgentToward(pg, pg.homeX + Math.cos(ph1) * 0.65, pg.homeY + Math.sin(ph1) * 0.55, 3.0, dt);
                pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
                updateDrillWeakSideMotion(dt, 2);
                return;
              }
              updateDrillWeakSideMotion(dt, 1);
              return;
            }

            // Active Assist Catch-and-Shoot, Cut Layup, or Triple-Threat Give & Go Partner!
            if (state.passAssist.active && !state.ball.inFlight && state.ball.holderIdx === state.passAssist.partnerIdx) {
              const pIdx = state.passAssist.partnerIdx;
              const partner = state.offense[pIdx];
              if (state.passAssist.mode === "drive_kick_shot" || state.passAssist.mode === "cut_layup") {
                state.passAssist.timer -= dt;
                state.ball.gatherTimer = Math.max(0.05, state.passAssist.timer);
                if (state.passAssist.mode === "cut_layup") {
                  moveAgentToward(partner, COURT.rimX + (partner.x >= 0 ? 0.35 : -0.35), COURT.rimY + 0.55, 4.85, dt, true);
                } else {
                  moveAgentToward(partner, partner.x, partner.y, 0.8, dt);
                }
                partner.gazeAngle = Math.atan2(COURT.rimY - partner.y, COURT.rimX - partner.x);
                if (state.scenario === "match") {
                  updateActiveOffBallTeammates(dt, pIdx);
                } else {
                  for (let i = 1; i < state.offense.length; i++) {
                    if (i === pIdx) continue;
                    const ph = state.simTime * 2.8 + i * 1.5;
                    moveAgentToward(
                      state.offense[i],
                      state.offense[i].homeX + Math.cos(ph) * 0.85,
                      state.offense[i].homeY + Math.sin(ph) * 0.85,
                      3.2,
                      dt
                    );
                    state.offense[i].gazeAngle = Math.atan2(COURT.rimY - state.offense[i].y, COURT.rimX - state.offense[i].x);
                  }
                }
                if (state.passAssist.timer <= 0 && state.playPhase === "live") {
                  state.passAssist.active = false;
                  startShot("offense", pIdx, null, true);
                }
                return;
              } else if (state.passAssist.mode === "triple_threat") {
                state.passAssist.returnLookTimer -= dt;
                moveAgentToward(partner, partner.x, partner.y, 1.1, dt);
                partner.gazeAngle = Math.atan2(state.offense[0].y - partner.y, state.offense[0].x - partner.x);
                if (state.scenario === "match") {
                  updateActiveOffBallTeammates(dt, pIdx);
                } else {
                  updateDrillWeakSideMotion(dt, pIdx === 1 ? 2 : 1);
                }
                if (state.passAssist.returnLookTimer <= 0 && state.scenario !== "give_go") {
                  state.passAssist.active = false;
                }
                return;
              }
            }

            if (state.scenario === "give_go") {
              moveAgentToward(pg, pg.homeX, pg.homeY, 2.6, dt);
              pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
              updateDrillWeakSideMotion(dt, 2);
              return;
            } else if (state.scenario === "relocation") {
              const wave = Math.sin(state.simTime * 1.15);
              const driveDepth = state.simTime > 0.45 ? 1.0 : state.simTime / 0.45;
              moveAgentToward(pg, lerp(0.0, side * 1.95, driveDepth), lerp(8.75, 3.55 + (wave > 0 ? wave * 0.45 : 0), driveDepth), 3.7, dt);
              pg.gazeAngle = Math.atan2(COURT.rimY - pg.y, COURT.rimX - pg.x);
              updateDrillWeakSideMotion(dt, 2);
              return;
            } else if (state.scenario === "cut") {
              moveAgentToward(pg, side * 2.2 + Math.sin(state.simTime * 1.8) * 0.85, 8.15 + Math.cos(state.simTime * 1.5) * 0.35, 2.8, dt);
              pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
              updateDrillWeakSideMotion(dt, 2);
              return;
            } else if (state.scenario === "vcut") {
              moveAgentToward(pg, side * 1.35 + Math.sin(state.simTime * 1.5) * 0.55, 8.55, 2.5, dt);
              pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
              updateDrillWeakSideMotion(dt, 2);
              return;
            } else if (state.scenario === "match") {
              const holderIdx = state.ball.holderIdx;
              const m = state.motion;
              if (state.ball.inFlight) {
                updateActiveOffBallTeammates(dt, -1);
                return;
              }
              const holder = state.offense[holderIdx];
              updateActiveOffBallTeammates(dt, holderIdx);

              // Dynamic probing dribble for AI ball-handler + active ball movement to open cutters / ★ YOU!
              const slot = PERIMETER_ARC_SLOTS[m.slotForPlayer[holderIdx]];
              const probeX = lerp(slot.x, 0, 0.45) + Math.sin(state.simTime * 2.6 + holderIdx) * 1.05;
              const probeY = clamp(lerp(slot.y, 4.1, 0.5) + Math.cos(state.simTime * 2.1 + holderIdx) * 0.65, 2.8, 8.8);
              moveAgentToward(holder, probeX, probeY, 3.85, dt);
              holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);

              const dRimH = hypot2(holder.x - COURT.rimX, holder.y - COURT.rimY);
              let nearDefH = 99;
              for (let d = 0; d < state.defense.length; d++) nearDefH = Math.min(nearDefH, dist2(holder, state.defense[d]));
              if (dRimH < 2.65 && nearDefH > 1.22 && !state.lane.open) {
                startShot("offense", holderIdx, null, false);
                return;
              }

              m.aiPassTimer += dt;
              if (!state.lane.open && m.aiPassTimer >= 0.85) {
                const cIdx = m.cutterIdx;
                const cutter = state.offense[cIdx];
                if (
                  cIdx >= 1 &&
                  cIdx !== holderIdx &&
                  m.cutPhase === "slash" &&
                  cutter.y < 4.8 &&
                  dist2(cutter, state.defense[cIdx]) > 1.2 &&
                  !checkPassLineBlocked(holder, cutter).blocked
                ) {
                  m.aiPassTimer = 0;
                  startPass(holderIdx, cIdx, { wasAICutPass: true });
                } else if (m.aiPassTimer >= 1.35) {
                  m.aiPassTimer = 0;
                  let bestIdx = (holderIdx % 4) + 1;
                  let bestOpen = -1;
                  for (let k = 1; k < state.offense.length; k++) {
                    if (k === holderIdx) continue;
                    const sep = dist2(state.offense[k], state.defense[k]);
                    if (!checkPassLineBlocked(holder, state.offense[k]).blocked && sep > bestOpen) {
                      bestOpen = sep;
                      bestIdx = k;
                    }
                  }
                  startPass(holderIdx, bestIdx);
                }
              }
              return;
            }

            updateDrillWeakSideMotion(dt, 2);
            return;
          }

          // 3) User on Defense! (def_onball, defense_help, def_cut, and 5v5 MATCH Defense!)
          if (state.playPhase !== "live") return;

          if (state.scenario === "def_onball") {
            updateDefenseOnBallDrillAI(dt);
          } else if (state.scenario === "def_cut") {
            updateDefenseStopCutDrillAI(dt);
          } else if (state.scenario === "match") {
            updateDefenseMatchCPUOffenseAI(dt);
          } else {
            updateDefenseHelpDrillAI(dt);
          }
        }

        /* Defense Drill 1: 1v1 On-Ball Dribbler AI (Hesitation -> Crossover -> Drive / Pull-up) */
        function updateDefenseOnBallDrillAI(dt) {
          const me = state.defense[0];
          const bh = state.offense[0];
          const dd = state.defDrill;
          dd.timer += dt;

          for (let i = 1; i < state.offense.length; i++) {
            moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.2, dt);
          }

          if (dd.phase === "probe") {
            const swayX = Math.sin(dd.timer * 3.0) * 1.75;
            moveAgentToward(bh, swayX, 7.85, 3.5, dt);
            bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);
            if (dd.timer >= 1.15) {
              dd.phase = "hesi_cross";
              dd.timer = 0;
              dd.driveSide = me.x >= bh.x ? -1 : 1; // Attack weak foot!
              spawnDust(bh.x, bh.y, 4);
              setCoachMessage("warn", "💨", "CROSSOVER! SLIDE!", 0.9);
            }
          } else if (dd.phase === "hesi_cross") {
            // If user over-sprinted far to the wrong side, brief ankle-stumble!
            if (!dd.fakeDone && keys.Shift && (me.x - bh.x) * dd.driveSide < -0.95) {
              dd.fakeDone = true;
              me.offBalanceTimer = 0.45;
              setCoachMessage("warn", "⚡", "FAKED! RECOVER!", 0.8);
            }
            const targetX = dd.driveSide * 2.15;
            const targetY = 3.2;
            moveAgentToward(bh, targetX, targetY, 4.65, dt);
            bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);

            // Check if user walled off the driving lane!
            const toRimX = COURT.rimX - bh.x;
            const toRimY = COURT.rimY - bh.y;
            const seg = pointToSegmentInfo(me.x, me.y, bh.x, bh.y, bh.x + toRimX, bh.y + toRimY);
            const cutOff = seg.projT > 0.05 && seg.projT < 0.75 && seg.dist < 1.15;

            if (cutOff && dd.timer > 0.45) {
              dd.phase = "pullup";
              dd.timer = 0;
              state.ball.gatherTimer = 0.85;
              setCoachMessage("good", "🖐️", "STOPPED! HANDS UP!", 0.8);
            } else if (hypot2(bh.x - COURT.rimX, bh.y - COURT.rimY) < 1.65 || dd.timer > 1.85) {
              dd.phase = "pullup";
              dd.timer = 0;
              state.ball.gatherTimer = 0.65;
              setCoachMessage("warn", "🚨", "HANDS UP! SPACE!", 0.6);
            }
          } else if (dd.phase === "pullup") {
            moveAgentToward(bh, bh.x, bh.y, 1.0, dt);
            bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);
            const dMe = dist2(me, bh);
            if (dMe < 2.35 && me.contestTimer > 0) {
              state.ball.contestedByUser = true;
              startShot("offense", 0, false);
            } else if (dd.timer > 0.8) {
              const contested = dMe < 1.65 && me.contestTimer > 0;
              startShot("offense", 0, contested ? false : null);
            }
          }
        }

        /* Defense Drill 2: Help Triangle & Closeout */
        function updateDefenseHelpDrillAI(dt) {
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;
          const myDef = state.defense[0];
          const myMan = state.offense[0];
          const handler = state.offense[1];

          const hTargetX = -side * 2.2 + Math.sin(state.simTime * 1.6) * 0.9;
          const hTargetY = 7.4 - Math.min(1.6, state.simTime * 0.35);

          const distMeToBall = hypot2(myDef.x - handler.x, myDef.y - handler.y);
          const distMeToMan = hypot2(myDef.x - myMan.x, myDef.y - myMan.y);
          const distMeToIdeal = hypot2(myDef.x - state.helpTriangle.idealX, myDef.y - state.helpTriangle.idealY);
          state.helpTriangle.distToIdeal = distMeToIdeal;

          if (!state.ball.inFlight && state.ball.holderIdx === 1) {
            if (distMeToBall < 2.65 && distMeToMan > 3.6) {
              state.helpTriangle.mistakeTimer += dt;
              state.helpTriangle.mistakeType = "ball_watch";
              moveAgentToward(myMan, side * 1.6, 2.2, 5.2, dt);
              if (state.helpTriangle.mistakeTimer > 0.45) {
                state.helpTriangle.passTriggered = true;
                startPass(1, 0);
                setCoachMessage("warn", "👀", "BALL WATCH! RUN BACK!", 1.5);
              }
            } else if (distMeToMan < 1.35 && myDef.y > 1.5 && Math.abs(myDef.x) > 4.3 && state.simTime > 1.8) {
              state.helpTriangle.mistakeTimer += dt;
              state.helpTriangle.mistakeType = "no_help";
              moveAgentToward(handler, -side * 0.55, 2.05, 5.1, dt);
              if (hypot2(handler.x - COURT.rimX, handler.y - COURT.rimY) < 1.35) {
                startShot("offense", 1, null);
              }
              return;
            } else {
              state.helpTriangle.mistakeTimer = Math.max(0, state.helpTriangle.mistakeTimer - dt);
              moveAgentToward(handler, hTargetX, hTargetY, 3.0, dt);

              if (distMeToIdeal < 1.65) {
                state.helpTriangle.goodHoldTimer += dt;
                if (state.helpTriangle.goodHoldTimer > 1.8 && !state.helpTriangle.passTriggered) {
                  state.helpTriangle.passTriggered = true;
                  startPass(1, 0);
                  setCoachMessage("good", "🏃", "CLOSEOUT! SPACE!", 1.8);
                }
              }
              moveAgentToward(myMan, myMan.homeX + Math.sin(state.simTime * 2.1) * 0.4, myMan.homeY + Math.cos(state.simTime * 1.7) * 0.5, 2.6, dt);
            }
          } else if (!state.ball.inFlight && state.ball.holderIdx === 0) {
            state.phaseTimer += dt;
            state.ball.gatherTimer = 0.8;
            myMan.gazeAngle = Math.atan2(COURT.rimY - myMan.y, COURT.rimX - myMan.x);
            if (distMeToMan < 2.25 && myDef.contestTimer > 0) {
              state.ball.contestedByUser = true;
              startShot("offense", 0, false);
            } else if (state.phaseTimer > 1.65) {
              const closeEnough = distMeToMan < 1.55 && myDef.contestTimer > 0;
              startShot("offense", 0, closeEnough ? false : null);
            }
          }

          for (let i = 2; i < state.offense.length; i++) {
            moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.4, dt);
          }
        }

        /* Defense Drill 3: Stop Backdoor & V-Cut */
        function updateDefenseStopCutDrillAI(dt) {
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;
          const me = state.defense[0];
          const cutter = state.offense[0];
          const pg = state.offense[1];
          const dd = state.defDrill;
          dd.timer += dt;

          moveAgentToward(pg, side * 2.0 + Math.sin(state.simTime * 1.8) * 0.6, 8.2, 2.6, dt);
          pg.gazeAngle = Math.atan2(cutter.y - pg.y, cutter.x - pg.x);
          for (let i = 2; i < state.offense.length; i++) {
            moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.3, dt);
          }

          if (!state.ball.inFlight && state.ball.holderIdx === 1) {
            if (dd.cutStage === 0) {
              // Fake high step toward ball first!
              moveAgentToward(cutter, side * 4.8, 7.0, 2.5, dt);
              if (dd.timer >= 0.85) {
                dd.cutStage = 1;
                dd.timer = 0;
                spawnDust(cutter.x, cutter.y, 5);
                setCoachMessage("warn", "⚡", "BACKDOOR CUT! BLOCK IT!", 1.2);
              }
            } else if (dd.cutStage === 1) {
              // Sudden burst to the rim!
              const cutX = side * 1.1;
              const cutY = 2.15;
              moveAgentToward(cutter, cutX, cutY, 5.1, dt);

              const seg = pointToSegmentInfo(me.x, me.y, pg.x, pg.y, cutter.x, cutter.y);
              const bodyDenied = dist2(me, cutter) < 1.45 && me.y <= cutter.y + 0.6;
              const laneDenied = seg.projT > 0.2 && seg.projT < 0.95 && seg.dist < 1.05;

              if (hypot2(cutter.x - cutX, cutter.y - cutY) < 1.5 || dd.timer > 1.15) {
                if (bodyDenied || laneDenied) {
                  // Kid denied the cut! Passer forced to throw contested or reset -> Defense Wins!
                  state.ball.contestedByUser = true;
                  spawnSparkles(me.x, me.y, "#22c55e", 14);
                  state.matchScore.stops += 1;
                  state.playPhase = "celebrate";
                  state.phaseTimer = 0;
                  setCoachMessage("celebrate", "🛑", "CUT DENIED!!", 2.0);
                } else {
                  // Cutter got behind user -> pass thrown (kid can still try to steal or contest!)
                  dd.cutStage = 2;
                  startPass(1, 0);
                }
              }
            }
          } else if (!state.ball.inFlight && state.ball.holderIdx === 0) {
            state.phaseTimer += dt;
            state.ball.gatherTimer = 0.5;
            if (dist2(me, cutter) < 2.2 && me.contestTimer > 0) {
              state.ball.contestedByUser = true;
              startShot("offense", 0, false);
            } else if (state.phaseTimer > 0.65) {
              startShot("offense", 0, null);
            }
          }
        }

        /* Full 5v5 Match CPU Offense AI (Passes, Cuts, Drives, Kick-Outs & Jumpers!) */
        function updateDefenseMatchCPUOffenseAI(dt) {
          const dd = state.defDrill;
          dd.timer += dt;
          dd.actionTimer += dt;
          dd.passTimer = (dd.passTimer || 0) + dt;

          if (state.ball.inFlight) return;

          const holderIdx = state.ball.holderIdx;
          const holder = state.offense[holderIdx];
          const me = state.defense[0];

          // Off-ball movement: rotating backdoor cuts + Wing-Corner Exchange + V-Cut footwork!
          state.motion.redExchangeTimer += dt;
          if (state.motion.redExchangeTimer >= 2.2) {
            state.motion.redExchangeTimer = 0;
            state.motion.redExchangeFlip ^= 1;
          }
          if (dd.cutterIdx === -1 && dd.timer > 1.2) {
            dd.cutterIdx = (holderIdx + 2) % 5;
            if (dd.cutterIdx === holderIdx) dd.cutterIdx = (holderIdx + 1) % 5;
            dd.passTimer = 0;
          }

          for (let i = 0; i < state.offense.length; i++) {
            if (i === holderIdx) continue;
            const off = state.offense[i];
            if (i === dd.cutterIdx) {
              const cutX = off.homeX >= 0 ? 1.15 : -1.15;
              moveAgentToward(off, cutX, 2.15, 4.95, dt, true);
              if (hypot2(off.x - cutX, off.y - 2.15) < 1.35 || dd.passTimer > 2.0) {
                dd.cutterIdx = (dd.cutterIdx + 1) % 5;
                if (dd.cutterIdx === holderIdx) dd.cutterIdx = (dd.cutterIdx + 1) % 5;
                dd.passTimer = 0;
              }
            } else {
              let baseX = off.homeX;
              let baseY = off.homeY;
              if (state.motion.redExchangeFlip === 1) {
                if (i === 3 && holderIdx !== 4) {
                  baseX = state.offense[4].homeX;
                  baseY = state.offense[4].homeY;
                } else if (i === 4 && holderIdx !== 3) {
                  baseX = state.offense[3].homeX;
                  baseY = state.offense[3].homeY;
                }
              }
              const ph = state.simTime * 3.0 + i * 1.55;
              moveAgentToward(off, clamp(baseX + Math.cos(ph) * 1.05, -6.65, 6.65), clamp(baseY + Math.sin(ph * 1.1) * 0.95, 1.8, 9.4), 3.85, dt);
            }
            off.gazeAngle = Math.atan2(holder.y - off.y, holder.x - off.x);
          }

          // Ball-handler decision tree:
          // 1) Check if cutter is wide open for an interior pass
          if (state.ball.gatherTimer <= 0 && dd.cutterIdx !== -1 && dd.actionTimer > 0.85) {
            const cutter = state.offense[dd.cutterIdx];
            const cutDef = state.defense[dd.cutterIdx];
            const segMe = pointToSegmentInfo(me.x, me.y, holder.x, holder.y, cutter.x, cutter.y);
            if (dist2(cutter, cutDef) > 1.75 && segMe.dist > 1.1 && hypot2(cutter.x, cutter.y - 2.2) < 3.0) {
              dd.actionTimer = 0;
              dd.passTimer = 0;
              const target = dd.cutterIdx;
              dd.cutterIdx = -1;
              startPass(holderIdx, target);
              setCoachMessage("warn", "🚨", "CUT PASS! CONTEST!", 1.0);
              return;
            }
          }

          // 2) If close to basket or open after ball movement, gather & shoot!
          const distRim = hypot2(holder.x - COURT.rimX, holder.y - COURT.rimY);
          let closestDef = 99;
          for (let d = 0; d < state.defense.length; d++) {
            closestDef = Math.min(closestDef, dist2(holder, state.defense[d]));
          }

          if ((distRim < 2.5 && dd.actionTimer > 0.55) || (closestDef > 2.25 && distRim < 8.2 && dd.actionTimer > 1.05) || dd.timer > 6.5) {
            state.ball.gatherTimer += dt;
            moveAgentToward(holder, holder.x, holder.y, 1.0, dt);
            holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);
            if (holderIdx === 0 || dist2(me, holder) < 3.2) {
              setCoachMessage("warn", "🖐️", "SHOT! HANDS UP!", 0.3);
            }
            if (dist2(me, holder) < 2.35 && me.contestTimer > 0) {
              state.ball.contestedByUser = true;
              state.ball.gatherTimer = 0;
              startShot("offense", holderIdx, null, false, { wasContested: true });
              return;
            }
            if (state.ball.gatherTimer >= 0.52) {
              state.ball.gatherTimer = 0;
              const contestedByMe = dist2(me, holder) < 1.85 && me.contestTimer > 0;
              const contestedByAI = holderIdx !== 0 && closestDef < 1.05 && Math.random() < 0.35;
              startShot("offense", holderIdx, null, false, { wasContested: contestedByMe || contestedByAI });
              return;
            }
            return;
          }

          state.ball.gatherTimer = 0;

          // 3) Drive toward paint; if paint is clogged by help defense, kick out!
          if (dd.actionTimer > 1.0) {
            const driveTx = holder.homeX * 0.25;
            const driveTy = 2.35;
            moveAgentToward(holder, driveTx, driveTy, 4.25, dt);
            holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);

            // Check help defense in paint
            let paintHelpers = 0;
            for (let d = 0; d < state.defense.length; d++) {
              if (d !== holderIdx && dist2(holder, state.defense[d]) < 2.05) {
                paintHelpers++;
              }
            }
            if ((paintHelpers > 0 || (holderIdx === 0 && dist2(holder, me) < 1.18 && me.y < holder.y)) && dd.actionTimer > 1.55) {
              // Kick out to most open teammate!
              let bestMate = (holderIdx + 1) % 5;
              let bestOpen = -1;
              for (let m = 0; m < state.offense.length; m++) {
                if (m === holderIdx) continue;
                const sep = dist2(state.offense[m], state.defense[m]);
                if (sep > bestOpen) {
                  bestOpen = sep;
                  bestMate = m;
                }
              }
              dd.actionTimer = 0;
              startPass(holderIdx, bestMate);
              if (bestMate === 0) {
                setCoachMessage("warn", "🏃", "PASS TO YOUR MAN!", 1.1);
              }
            }
          } else {
            moveAgentToward(holder, holder.homeX + Math.sin(state.simTime * 2.4) * 0.7, holder.homeY - 0.3, 3.0, dt);
            holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);
          }
        }

        function updateDefendersAI(dt) {
          if (state.fullCourt) return;
          const diff = getDiffProfile();
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;

          for (let i = 0; i < state.defense.length; i++) {
            if (state.role === "defense" && i === 0) {
              continue;
            }

            const def = state.defense[i];
            const man = state.offense[i];

            if (def.reactionTimer > 0) {
              def.vx = def.inertiaVx;
              def.vy = def.inertiaVy;
              def.x = clamp(def.x + def.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
              def.y = clamp(def.y + def.vy * dt, 0.55, COURT.length - 0.55);
              def.stridePhase += hypot2(def.vx, def.vy) * dt * 3.5;
              updatePlayerJumpAndPose(def, dt, false, false, false);
              continue;
            }

            let tx = man.x;
            let ty = man.y;
            let maxSpd = 4.65;
            def.ballWatchFactor = 0.25;
            const manHasBall = !state.ball.inFlight && state.ball.holderIdx === i;

            if (i === 0 && state.scenario === "tutorial") {
              const tut = state.tutorial;
              if (tut.step === 1) {
                tx = lerp(man.x, state.offense[1].x, 0.35);
                ty = lerp(man.y, state.offense[1].y, 0.35);
                def.ballWatchFactor = 0.4;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                maxSpd = 4.5;
              } else if (tut.step === 2) {
                if (manHasBall) {
                  const toRimX = COURT.rimX - man.x;
                  const toRimY = COURT.rimY - man.y;
                  const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                  tx = man.x + (toRimX / dRim) * 2.35;
                  ty = man.y + (toRimY / dRim) * 2.35;
                  maxSpd = 2.4;
                  def.ballWatchFactor = 0.0;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                } else {
                  const pg = state.offense[1];
                  if (dist2(man, pg) < COURT.crowdingDist) {
                    tx = lerp(man.x, pg.x, 0.42);
                    ty = lerp(man.y, pg.y, 0.42);
                    def.ballWatchFactor = 0.45;
                  } else {
                    tx = -1.95;
                    ty = 3.35;
                    def.ballWatchFactor = 0.88;
                  }
                  def.gazeAngle = Math.atan2(pg.y - def.y, pg.x - def.x);
                  maxSpd = 4.2;
                }
              } else if (tut.step === 3) {
                if (manHasBall) {
                  const toRimX = COURT.rimX - man.x;
                  const toRimY = COURT.rimY - man.y;
                  const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                  tx = man.x + (toRimX / dRim) * 2.1;
                  ty = man.y + (toRimY / dRim) * 2.1;
                  maxSpd = 2.6;
                  def.ballWatchFactor = 0.0;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                } else if (tut.subPhase === "3a_constant") {
                  def.paceAdapt = 1.0;
                  tx = man.x + 0.45 + man.vx * 0.14;
                  ty = man.y - 0.45 + man.vy * 0.14;
                  maxSpd = 5.45;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                } else {
                  def.ballWatchFactor = 0.92;
                  const toBallX = state.ball.x - man.x;
                  const toBallY = state.ball.y - man.y;
                  const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
                  tx = man.x + (toBallX / dBall) * 0.78;
                  ty = man.y + (toBallY / dBall) * 0.78;
                  maxSpd = def.offBalanceTimer > 0 ? 3.2 : 4.55;
                  def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
                }
              } else {
                if (!manHasBall) {
                  tx = -2.2;
                  ty = 3.5;
                  def.ballWatchFactor = 0.85;
                  def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
                  maxSpd = 3.8;
                } else if (tut.crossoverDone) {
                  tx = def.x;
                  ty = def.y;
                  maxSpd = 1.2;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                } else {
                  const toRimX = COURT.rimX - man.x;
                  const toRimY = COURT.rimY - man.y;
                  const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                  tx = man.x + (toRimX / dRim) * 1.15;
                  ty = man.y + (toRimY / dRim) * 1.15;
                  maxSpd = 4.9;
                  def.ballWatchFactor = 0.0;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                }
              }
            } else if (i === 0 && state.role === "offense") {
              const toRimX = COURT.rimX - man.x;
              const toRimY = COURT.rimY - man.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              const userConstSprintHC =
                def.offBalanceTimer <= 0 &&
                state.rhythm.burstBoostTimer <= 0 &&
                keys.Shift &&
                (hypot2(man.vx, man.vy) > 1.0 || state.rhythm.monotoneSprintTime > 0);

              if (userConstSprintHC) {
                // Constant Shift without Change of Pace -> Tight Lockdown Chase across ALL difficulties!
                def.paceAdapt = Math.min(1.0, (def.paceAdapt || 0) + dt * 3.5);
                const lockCushion = manHasBall ? (state.difficulty === "hard" ? 1.04 : 0.98) : 0.84;
                tx = man.x + (toRimX / dRim) * lockCushion + man.vx * 0.115;
                ty = man.y + (toRimY / dRim) * lockCushion + man.vy * 0.115;
                def.ballWatchFactor = 0.06;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                moveAgentToward(def, tx, ty, 5.65, dt, false, true);
                continue;
              }

              if (manHasBall) {
                const onBallCushion = 1.06 - (state.difficulty === "hard" ? 0.08 : 0);
                tx = man.x + (toRimX / dRim) * onBallCushion;
                ty = man.y + (toRimY / dRim) * onBallCushion;
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : 4.85;
                def.ballWatchFactor = 0.0;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              } else if (state.scenario === "relocation") {
                const pg = state.offense[1];
                const pgDriveProgress = clamp((7.5 - pg.y) / 3.6, 0, 1);
                if (dist2(man, pg) < COURT.crowdingDist) {
                  tx = lerp(man.x, pg.x, 0.42);
                  ty = lerp(man.y, pg.y, 0.42);
                  def.ballWatchFactor = 0.45;
                } else {
                  tx = lerp(man.x * 0.72, side * 2.05, pgDriveProgress * 0.85);
                  ty = lerp(man.y * 0.82, 3.25, pgDriveProgress * 0.85);
                  def.ballWatchFactor = pgDriveProgress * 0.88;
                }
                def.gazeAngle = def.ballWatchFactor > 0.5 ? Math.atan2(pg.y - def.y, pg.x - def.x) : Math.atan2(man.y - def.y, man.x - def.x);
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : 4.35;
              } else if (
                state.scenario === "cut" ||
                state.scenario === "give_go" ||
                (state.passAssist.active && state.passAssist.mode === "triple_threat")
              ) {
                const watchingBall =
                  state.scenario === "give_go" || (state.passAssist.active && state.passAssist.mode === "triple_threat") || state.simTime > 0.65;
                def.ballWatchFactor = watchingBall ? 0.94 : 0.35;
                const isMonotoneMove =
                  state.rhythm.monotoneSprintTime > 0.35 ||
                  (hypot2(man.vx, man.vy) > 0.5 && state.rhythm.burstBoostTimer <= 0 && def.offBalanceTimer <= 0);
                def.paceAdapt = isMonotoneMove ? Math.min(1.0, def.paceAdapt + dt * 2.2) : Math.max(0, def.paceAdapt - dt * 1.5);

                const toBallX = state.ball.x - man.x;
                const toBallY = state.ball.y - man.y;
                const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
                const denyDist = lerp(0.85, 0.55, def.paceAdapt);
                tx = man.x + (toBallX / dBall) * denyDist + man.vx * 0.14 * def.paceAdapt;
                ty = man.y + (toBallY / dBall) * denyDist + man.vy * 0.14 * def.paceAdapt;
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : lerp(4.75, 5.45, def.paceAdapt);
                def.gazeAngle = watchingBall ? Math.atan2(state.ball.y - def.y, state.ball.x - def.x) : Math.atan2(man.y - def.y, man.x - def.x);
              } else if (state.scenario === "vcut") {
                const isMonotoneMove =
                  state.rhythm.monotoneSprintTime > 0.35 ||
                  (hypot2(man.vx, man.vy) > 0.5 && state.rhythm.burstBoostTimer <= 0 && def.offBalanceTimer <= 0);
                def.paceAdapt = isMonotoneMove ? Math.min(1.0, def.paceAdapt + dt * 2.2) : Math.max(0, def.paceAdapt - dt * 1.5);
                const toBallX = state.ball.x - man.x;
                const toBallY = state.ball.y - man.y;
                const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
                tx = man.x + (toBallX / dBall) * 0.72 + man.vx * 0.14 * def.paceAdapt;
                ty = man.y + (toBallY / dBall) * 0.72 + man.vy * 0.14 * def.paceAdapt;
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : lerp(4.8, 5.45, def.paceAdapt);
                def.ballWatchFactor = 0.2;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              } else {
                const distManToBall = hypot2(man.x - state.ball.x, man.y - state.ball.y);
                const helpPull = clamp((distManToBall - 5.2) / 9.0, 0.04, 0.22);
                const baseX = man.x + (toRimX / dRim) * 1.08;
                const baseY = man.y + (toRimY / dRim) * 1.08;
                tx = lerp(baseX, COURT.rimX, helpPull);
                ty = lerp(baseY, COURT.rimY + 1.25, helpPull);
                def.ballWatchFactor = clamp(0.22 + helpPull * 1.4, 0, 1);
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : 4.85;
                def.gazeAngle =
                  def.ballWatchFactor > 0.5 ? Math.atan2(state.ball.y - def.y, state.ball.x - def.x) : Math.atan2(man.y - def.y, man.x - def.x);
              }
            } else {
              // Teammate defenders (in both Offense & Defense modes)
              const toRimX = COURT.rimX - man.x;
              const toRimY = COURT.rimY - man.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              const cushion = manHasBall ? 1.05 : 1.25;
              tx = man.x + (toRimX / dRim) * cushion;
              ty = man.y + (toRimY / dRim) * cushion;
              const kickInAir = state.ball.inFlight && state.ball.flightType === "pass" && state.ball.fromIdx === 0 && state.ball.t < 0.62;
              if (
                !manHasBall &&
                state.role === "offense" &&
                state.scenario === "match" &&
                ((i === state.motion.cutterIdx && state.motion.cutPhase === "slash") ||
                  (state.ball.inFlight && state.ball.wasCutPass && state.ball.targetIdx === i))
              ) {
                // Slashing teammate beat defender with V-step -> defender trails outside the paint lane!
                def.ballWatchFactor = 0.72;
                tx = clamp(man.x + state.motion.cutSide * 1.58, -6.5, 6.5);
                ty = clamp(man.y + 0.38, 1.35, 9.2);
                maxSpd = 4.05;
              } else if (!manHasBall && state.role === "offense" && ((!state.ball.inFlight && state.ball.holderIdx === 0) || kickInAir)) {
                // Help defense sinks low to protect the rim when YOU drive inside!
                const userP = state.offense[0];
                const userDistRim = hypot2(userP.x - COURT.rimX, userP.y - COURT.rimY);
                const collapse = clamp((6.2 - userDistRim) / 3.0, 0, 0.7);
                if (collapse > 0.04) {
                  const helpX = COURT.rimX + (man.x >= 0 ? 0.65 : -0.65);
                  const helpY = COURT.rimY + 0.75;
                  tx = lerp(tx, helpX, collapse);
                  ty = lerp(ty, helpY, collapse);
                  def.ballWatchFactor = 0.35 + collapse * 0.65;
                }
                maxSpd = 4.25;
              } else if (!manHasBall && state.role === "defense" && state.scenario === "match") {
                const stunt = 0.5 + 0.5 * Math.sin(state.simTime * 4.1 + i * 1.5);
                tx = lerp(tx, lerp(COURT.rimX, state.ball.x, 0.25), 0.16 + stunt * 0.22);
                ty = lerp(ty, COURT.rimY + 1.55, 0.16 + stunt * 0.2);
                maxSpd = 4.45;
              } else {
                maxSpd = 4.2;
              }
              def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
            }

            if (state.scenario !== "tutorial") {
              maxSpd *= diff.defSpeedMult;
              if (def.ballWatchFactor > 0.05) {
                def.ballWatchFactor = clamp(def.ballWatchFactor + diff.ballWatchBoost, 0, 1);
              }
            }

            moveAgentToward(def, tx, ty, maxSpd, dt);
          }
        }

        /* =====================================================================
         * 8. Passing Lanes, On-Ball Direct Pass, Steals, Shots & Full-Court Flow
         * ===================================================================== */
        function checkTeamPassBlocked(team, fromP, toP) {
          const oppArr = team === "offense" ? state.defense : state.offense;
          let blockerIdx = -1;
          let bestProjT = 1.0;
          let blockX = 0;
          let blockY = 0;
          for (let i = 0; i < oppArr.length; i++) {
            const def = oppArr[i];
            if (def.offBalanceTimer > 0) continue;
            const isOnBallDefender = team === "offense" && fromP.id === i && dist2(def, fromP) < 1.95;
            let blockRad = 0.62;
            let minProjT = 0.15;
            if (team === "offense") {
              if (isOnBallDefender) {
                blockRad = 0.34;
                minProjT = 0.38;
              } else {
                blockRad = def.ballWatchFactor > 0.62 ? 0.38 : 0.62;
              }
            } else {
              blockRad = state.difficulty === "easy" ? 0.32 : state.difficulty === "medium" ? 0.48 : 0.68;
            }
            const segNow = pointToSegmentInfo(def.x, def.y, fromP.x, fromP.y, toP.x, toP.y);
            const segLead = pointToSegmentInfo(def.x + def.vx * 0.12, def.y + def.vy * 0.12, fromP.x, fromP.y, toP.x, toP.y);
            const seg = segLead.dist < segNow.dist ? segLead : segNow;
            if (seg.projT > minProjT && seg.projT < 0.88 && seg.dist <= blockRad) {
              if (seg.projT < bestProjT) {
                bestProjT = seg.projT;
                blockerIdx = i;
                blockX = seg.cx;
                blockY = seg.cy;
              }
            }
          }
          return { blocked: blockerIdx !== -1, blockerIdx, projT: bestProjT, blockX, blockY };
        }

        function checkPassLineBlocked(fromP, toP) {
          return checkTeamPassBlocked("offense", fromP, toP);
        }

        function updatePassTarget() {
          const userOffenseReady =
            !isUserOnDefenseNow() &&
            !state.ball.inFlight &&
            !state.ball.loose &&
            state.ball.holderTeam === "offense" &&
            state.ball.holderIdx === 0 &&
            state.playPhase === "live";

          if (!userOffenseReady) {
            state.passTarget.idx = -1;
            state.passTarget.laneOpen = true;
            state.passTarget.blockerIdx = -1;
            return;
          }

          const me = state.offense[0];
          const screenRight = (keys.D ? 1 : 0) - (keys.A ? 1 : 0);
          const screenUp = (keys.W ? 1 : 0) - (keys.S ? 1 : 0);
          const hasDir = screenRight !== 0 || screenUp !== 0;
          let ix = 0;
          let iy = 0;
          if (hasDir) {
            const wd = worldDirFromScreenInput(screenRight, screenUp, getActiveInputYaw());
            const il = Math.max(0.001, hypot2(wd.x, wd.y));
            ix = wd.x / il;
            iy = wd.y / il;
          }

          let bestIdx = 1;
          let bestScore = -9999;
          let bestLine = { blocked: false, blockerIdx: -1, blockX: 0, blockY: 0 };
          let bestOpenness = 0;

          for (let m = 1; m < state.offense.length; m++) {
            const mate = state.offense[m];
            const dx = mate.x - me.x;
            const dy = mate.y - me.y;
            const dist = Math.max(0.01, hypot2(dx, dy));
            const lineInfo = checkPassLineBlocked(me, mate);

            let closestDef = 99;
            for (let d = 0; d < state.defense.length; d++) {
              closestDef = Math.min(closestDef, dist2(mate, state.defense[d]));
            }

            const isSlashingCutter =
              (state.fullCourt || state.scenario === "match") && m === state.motion.cutterIdx && state.motion.cutPhase === "slash" && mate.y < 6.4;

            let score = 0;
            if (hasDir) {
              const align = (dx * ix + dy * iy) / dist;
              const dirCutBonus = !lineInfo.blocked && isSlashingCutter ? 1.15 : 0;
              score = align * 5.4 + (lineInfo.blocked ? -2.2 : 0.8) + Math.min(closestDef, 4.2) * 0.22 - dist * 0.03 + dirCutBonus;
            } else {
              const giveGoBonus = !state.fullCourt && state.scenario === "give_go" && state.giveGoStage === 1 && m === 1 ? 1.8 : 0;
              const fastBreakBonus = state.fullCourt && mate.y < me.y - 2.0 ? 1.6 : 0;
              const cutSlashBonus = !lineInfo.blocked && isSlashingCutter && closestDef >= 1.0 ? 3.85 : 0;
              score =
                (lineInfo.blocked ? -9.5 : 3.0) +
                Math.min(closestDef, 5.0) * 1.15 -
                Math.abs(dist - 5.8) * 0.08 +
                giveGoBonus +
                fastBreakBonus +
                cutSlashBonus;
            }

            if (score > bestScore) {
              bestScore = score;
              bestIdx = m;
              bestLine = lineInfo;
              bestOpenness = closestDef;
            }
          }

          state.passTarget.idx = bestIdx;
          state.passTarget.laneOpen = !bestLine.blocked;
          state.passTarget.blockerIdx = bestLine.blockerIdx;
          state.passTarget.blockX = bestLine.blockX;
          state.passTarget.blockY = bestLine.blockY;
          state.passTarget.openness = bestOpenness;
        }

        function startTeamPass(team, fromIdx, toIdx, opts) {
          const teamArr = team === "offense" ? state.offense : state.defense;
          const sender = teamArr[fromIdx];
          const receiver = teamArr[toIdx];
          const courtLen = getCourtLength();
          sender.passPoseTimer = 0.32;
          sender.gazeAngle = Math.atan2(receiver.y - sender.y, receiver.x - sender.x);
          sender.facing = sender.gazeAngle;

          state.ball.passTeam = team;
          state.ball.inFlight = true;
          state.ball.loose = false;
          state.ball.flightType = "pass";
          state.ball.fromIdx = fromIdx;
          state.ball.fromX = sender.x;
          state.ball.fromY = sender.y;
          state.ball.fromZ = 1.25;
          state.ball.toX = clamp(receiver.x + receiver.vx * 0.16, -COURT.halfW + 0.5, COURT.halfW - 0.5);
          state.ball.toY = clamp(receiver.y + receiver.vy * 0.16, 0.7, courtLen - 0.6);
          state.ball.toZ = 1.25;
          state.ball.targetIdx = toIdx;
          state.ball.t = 0;
          state.ball.gatherTimer = 0;
          state.ball.trail = [];
          state.ball.userPassBlockedBy = opts && opts.blockedBy !== undefined ? opts.blockedBy : -1;
          state.ball.userPassBlockT = opts && opts.blockT !== undefined ? opts.blockT : 1.0;
          state.ball.wasDriveKickPass = !!(opts && opts.wasDriveKick);
          state.ball.wasCutPass = !!(opts && opts.wasCutPass);
          state.ball.wasAICutPass = !!(opts && opts.wasAICutPass);
          state.ball.isReturnPass = !!(opts && opts.isReturnPass);
          const d = hypot2(state.ball.toX - sender.x, state.ball.toY - sender.y);
          state.ball.duration = clamp(d / 16.5, 0.22, 0.62);
          state.playPhase = "pass_flight";
          SoundEngine.playPassZip();
        }

        function startPass(fromIdx, toIdx, opts) {
          startTeamPass("offense", fromIdx, toIdx, opts);
        }

        function executeUserPass(explicitMateIdx) {
          if (state.paused || state.playPhase !== "live") return false;
          if (isUserOnDefenseNow() || state.ball.inFlight || state.ball.loose || state.ball.holderTeam !== "offense" || state.ball.holderIdx !== 0)
            return false;

          if (!state.fullCourt && state.scenario === "tutorial") {
            setCoachMessage("warn", "🏀", "DRIBBLE & SHOOT!", 0.9);
            return false;
          }

          updatePassTarget();
          const toIdx =
            explicitMateIdx && explicitMateIdx >= 1 && explicitMateIdx < state.offense.length
              ? explicitMateIdx
              : state.passTarget.idx > 0
                ? state.passTarget.idx
                : 1;

          const me = state.offense[0];
          const receiver = state.offense[toIdx];
          const lineCheck = checkPassLineBlocked(me, receiver);

          let nearDefs = 0;
          let recClosestDef = 99;
          for (let d = 0; d < state.defense.length; d++) {
            if (dist2(me, state.defense[d]) < 3.25) nearDefs++;
            recClosestDef = Math.min(recClosestDef, dist2(receiver, state.defense[d]));
          }
          const distMeRim = hypot2(me.x - COURT.rimX, me.y - COURT.rimY);
          const wasDriveKick = state.scenario !== "give_go" && receiver.y < 11.5 && (distMeRim < 5.75 || me.y < 5.65 || nearDefs >= 2);
          const openOnRelease = recClosestDef >= 2.1;
          const isOutletAhead = state.fullCourt && receiver.y < me.y - 3.5 && me.y > 12.0;
          const wasCutPass =
            (state.fullCourt || state.scenario === "match") &&
            ((toIdx === state.motion.cutterIdx && state.motion.cutPhase === "slash" && receiver.y < 6.4) ||
              (receiver.y < 4.2 && hypot2(receiver.vx, receiver.vy) > 2.2));

          state.dribblePressure.timer = 0;
          state.dribblePressure.ratio = 0;
          keys.CallFlash = 0.22;
          startTeamPass("offense", 0, toIdx, {
            blockedBy: lineCheck.blocked ? lineCheck.blockerIdx : -1,
            blockT: lineCheck.blocked ? clamp(lineCheck.projT, 0.2, 0.86) : 1.0,
            wasDriveKick: wasDriveKick && openOnRelease,
            wasCutPass,
          });

          if (!lineCheck.blocked) {
            if (!state.fullCourt && state.scenario === "give_go" && state.giveGoStage === 1) {
              state.giveGoStage = 2;
              state.rhythm.slowMoveTime = 0;
              state.rhythm.copCount = 0;
              setCoachMessage("good", "🐢", "WALK... ⚡ CUT!", 1.3);
            } else if (wasCutPass) {
              setCoachMessage("good", "🎯", "GREAT CUT PASS!", 1.0);
            } else if (isOutletAhead) {
              setCoachMessage("good", "🔥", "FAST BREAK!", 1.0);
            } else if (wasDriveKick) {
              setCoachMessage("good", "🎯", "GREAT PASS!", 0.9);
            } else {
