            off.gazeAngle = Math.atan2(holder.y - off.y, holder.x - off.x);
          }

          // Ball-handler decision tree:
          // 1) Check if cutter is wide open for an interior pass
          if (state.ball.gatherTimer <= 0 && dd.cutterIdx !== -1 && dd.actionTimer > 0.85) {
            const cutter = state.offense[dd.cutterIdx];
            const cutDef = state.defense[dd.cutterIdx];
            if (
              dist2(cutter, cutDef) > 1.75 &&
              !checkPassLineBlocked(holder, cutter, _scratchPassBlock).blocked &&
              hypot2(cutter.x, cutter.y - 2.2) < 3.0
            ) {
              dd.actionTimer = 0;
              dd.passTimer = 0;
              const target = dd.cutterIdx;
              dd.cutterIdx = -1;
              startPass(holderIdx, target);
              setCoachMessage("warn", "🚨", "CUT PASS! CONTEST!", 1.0);
              return;
            }
          }

          // 2) If close to basket or open after ball movement, gather & shoot!
          const distRim = hypot2(holder.x - COURT.rimX, holder.y - COURT.rimY);
          let closestDef = 99;
          for (let d = 0; d < state.defense.length; d++) {
            closestDef = Math.min(closestDef, dist2(holder, state.defense[d]));
          }

          if ((distRim < 2.5 && dd.actionTimer > 0.55) || (closestDef > 2.25 && distRim < 8.2 && dd.actionTimer > 1.05) || dd.timer > 6.5) {
            state.ball.gatherTimer += dt;
            moveAgentToward(holder, holder.x, holder.y, 1.0, dt);
            holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);
            if (holderIdx === 0 || dist2(me, holder) < 3.2) {
              setCoachMessage("warn", "🖐️", "SHOT! HANDS UP!", 0.3);
            }
            const meInFrontNorth = (me.x - holder.x) * (COURT.rimX - holder.x) + (me.y - holder.y) * (COURT.rimY - holder.y) > 0;
            if (dist2(me, holder) < 2.35 && me.contestTimer > 0 && meInFrontNorth) {
              state.ball.contestedByUser = true;
              state.ball.gatherTimer = 0;
              startShot("offense", holderIdx, null, false, { wasContested: true });
              return;
            }
            if (state.ball.gatherTimer >= diff.cpuGatherSec) {
              state.ball.gatherTimer = 0;
              const contestedByMe = dist2(me, holder) < 1.85 && me.contestTimer > 0 && meInFrontNorth;
              const contestedByAI = holderIdx !== 0 && closestDef < 1.05 && Math.random() < 0.35;
              startShot("offense", holderIdx, null, false, { wasContested: contestedByMe || contestedByAI });
              return;
            }
            return;
          }

          state.ball.gatherTimer = 0;

          // 3) Drive toward paint; if paint is clogged by help defense, kick out!
          if (dd.actionTimer > 1.0) {
            const driveTx = holder.homeX * 0.25;
            const driveTy = 2.35;
            moveAgentToward(holder, driveTx, driveTy, 4.25 * spdMult, dt);
            holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);

            // Check help defense in paint
            let paintHelpers = 0;
            for (let d = 0; d < state.defense.length; d++) {
              if (d !== holderIdx && dist2(holder, state.defense[d]) < 2.05) {
                paintHelpers++;
              }
            }
            if ((paintHelpers > 0 || (holderIdx === 0 && dist2(holder, me) < 1.18 && me.y < holder.y)) && dd.actionTimer > 1.55) {
              // Kick out to most open teammate with clear pass lane!
              let bestMate = (holderIdx + 1) % 5;
              let bestOpen = -1;
              for (let m = 0; m < state.offense.length; m++) {
                if (m === holderIdx) continue;
                const sep = dist2(state.offense[m], state.defense[m]);
                if (!checkPassLineBlocked(holder, state.offense[m], _scratchPassBlock).blocked && sep > bestOpen) {
                  bestOpen = sep;
                  bestMate = m;
                }
              }
              dd.actionTimer = 0;
              startPass(holderIdx, bestMate);
              if (bestMate === 0) {
                setCoachMessage("warn", "🏃", "PASS TO YOUR MAN!", 1.1);
              }
            }
          } else {
            moveAgentToward(holder, holder.homeX + Math.sin(state.simTime * 2.4) * 0.7, holder.homeY - 0.3, 3.0 * spdMult, dt);
            holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);
          }
        }

        function updateDefendersAI(dt) {
          if (state.fullCourt) return;
          const diff = getDiffProfile();
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;

          // Half-Court Rebound Box-Out Seal & Loose-Ball Scramble for AI Defenders!
          const isLiveRebWindow =
            state.scenario !== "tutorial" &&
            state.scenario !== "learn_d" &&
            (state.ball.loose || (state.ball.inFlight && state.ball.flightType === "shot"));
          if (isLiveRebWindow) {
            const drop = state.ball.loose ? computeLooseBallDropSpot(_scratchDrop) : HC_SHOT_REB_DROP;
            for (let i = 0; i < state.defense.length; i++) {
              if (state.role === "defense" && i === 0) continue;
              const def = state.defense[i];
              const man = _findNearestOpponentWithin(def, state.offense, i);
              if (def.reactionTimer > 0) {
                def.vx = def.inertiaVx;
                def.vy = def.inertiaVy;
                def.x = clamp(def.x + def.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
                def.y = clamp(def.y + def.vy * dt, 0.55, COURT.length - 0.55);
                def.stridePhase += hypot2(def.vx, def.vy) * dt * 3.5;
                updatePlayerJumpAndPose(def, dt, false, false, false);
                continue;
              }
              const dDef = hypot2(def.x - drop.x, def.y - drop.y);
              const dMan = hypot2(man.x - drop.x, man.y - drop.y);
              const releaseToBall = state.ball.loose && state.ball.looseTimer > 0.34 && dDef < 2.15 && state.ball.z < 2.3;
              let sx = drop.x;
              let sy = drop.y;
              if (!releaseToBall && dMan < 6.2 && (def.offBalanceTimer || 0) <= 0) {
                const tSeal = clamp((dMan - 0.68) / Math.max(0.68, dMan), 0.18, 0.84);
                sx = lerp(drop.x, man.x, tSeal);
                sy = lerp(drop.y, man.y, tSeal);
                if (dist2(def, man) < 1.25 && dDef <= dMan + 0.25) {
                  def.boxOutTimer = Math.max(def.boxOutTimer || 0, 0.25);
                }
              }
              const rebSpd = (def.offBalanceTimer || 0) > 0 ? 1.65 : 4.45 * diff.defSpeedMult;
              moveAgentToward(def, sx, sy, rebSpd, dt);
              if (
                state.ball.loose &&
                (def.offBalanceTimer || 0) <= 0 &&
                hypot2(def.x - state.ball.x, def.y - state.ball.y) < 1.2 &&
                state.ball.z > 1.35 &&
                state.ball.z < 2.6
              ) {
                triggerJump(def, 2.9);
                def.reboundReachTimer = Math.max(def.reboundReachTimer || 0, 0.34);
              }
              def.ballWatchFactor = 0.2;
              def.gazeAngle = Math.atan2(drop.y - def.y, drop.x - def.x);
            }
            return;
          }

          // Precompute tactical help-defense state (Strong-Side Corner Stay Home + Weak-Side Low-Man + Immediate Kick Closeout)
          const hcPassInAir = state.ball.inFlight && state.ball.flightType === "pass";
          const kickInAirHC = hcPassInAir && state.ball.fromIdx === 0 && state.ball.t < 0.62;
          const hcBhIdx = !state.ball.inFlight ? state.ball.holderIdx : kickInAirHC ? 0 : -1;
          const hcBh = hcBhIdx >= 0 ? state.offense[hcBhIdx] : state.offense[0];
          const hcBhDistRim = hypot2(hcBh.x - COURT.rimX, hcBh.y - COURT.rimY);
          const hcDrive = hcBhIdx >= 0 && hcBh.y < 8.4 ? clamp((6.4 - hcBhDistRim) / 3.2, 0, 1) : 0;
          let hcLowManIdx = -1;
          if (hcDrive > 0.04 && state.scenario !== "tutorial") {
            let bestLowSq = 9999;
            for (let k = 1; k < state.defense.length; k++) {
              if (k === hcBhIdx) continue;
              if (hcPassInAir && k === state.ball.targetIdx) continue;
              if (state.role === "offense" && state.scenario === "match" && k === state.motion.cutterIdx && state.motion.cutPhase === "slash")
                continue;
              const offK = state.offense[k];
              if (offK.x * hcBh.x > 0.35) continue;
              const dSq = (offK.x - COURT.rimX) * (offK.x - COURT.rimX) + (offK.y - COURT.rimY) * (offK.y - COURT.rimY);
              if (dSq < bestLowSq) {
                bestLowSq = dSq;
                hcLowManIdx = k;
              }
            }
          }

          for (let i = 0; i < state.defense.length; i++) {
            if (state.role === "defense" && i === 0) {
              continue;
            }

            const def = state.defense[i];
            const man = state.offense[i];

            if (def.reactionTimer > 0) {
              def.vx = def.inertiaVx;
              def.vy = def.inertiaVy;
              def.x = clamp(def.x + def.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
              def.y = clamp(def.y + def.vy * dt, 0.55, COURT.length - 0.55);
              def.stridePhase += hypot2(def.vx, def.vy) * dt * 3.5;
              updatePlayerJumpAndPose(def, dt, false, false, false);
              continue;
            }

            let tx = man.x;
            let ty = man.y;
            let maxSpd = 4.65;
            let fastCloseout = false;
            def.ballWatchFactor = 0.25;
            const manHasBall = !state.ball.inFlight && state.ball.holderIdx === i;
            const isPassReceiverHC = hcPassInAir && state.ball.targetIdx === i;

            if (i === 0 && state.scenario === "tutorial") {
              const tut = state.tutorial;
              if (tut.step === 1) {
                tx = lerp(man.x, state.offense[1].x, 0.35);
                ty = lerp(man.y, state.offense[1].y, 0.35);
                def.ballWatchFactor = 0.4;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                maxSpd = 4.5;
              } else if (tut.step === 2) {
                if (manHasBall) {
                  const toRimX = COURT.rimX - man.x;
                  const toRimY = COURT.rimY - man.y;
                  const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                  tx = man.x + (toRimX / dRim) * 2.35;
                  ty = man.y + (toRimY / dRim) * 2.35;
                  maxSpd = 2.4;
                  def.ballWatchFactor = 0.0;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                } else {
                  const pg = state.offense[1];
                  if (dist2(man, pg) < COURT.crowdingDist) {
                    tx = lerp(man.x, pg.x, 0.42);
                    ty = lerp(man.y, pg.y, 0.42);
                    def.ballWatchFactor = 0.45;
                  } else {
                    tx = -1.95;
                    ty = 3.35;
                    def.ballWatchFactor = 0.88;
                  }
                  def.gazeAngle = Math.atan2(pg.y - def.y, pg.x - def.x);
                  maxSpd = 4.2;
                }
              } else if (tut.step === 3) {
                if (manHasBall) {
                  const toRimX = COURT.rimX - man.x;
                  const toRimY = COURT.rimY - man.y;
                  const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                  tx = man.x + (toRimX / dRim) * 2.1;
                  ty = man.y + (toRimY / dRim) * 2.1;
                  maxSpd = 2.6;
                  def.ballWatchFactor = 0.0;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                } else if (tut.subPhase === "3a_constant") {
                  def.paceAdapt = 1.0;
                  tx = man.x + 0.45 + man.vx * 0.14;
                  ty = man.y - 0.45 + man.vy * 0.14;
                  maxSpd = 5.45;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                } else {
                  def.ballWatchFactor = 0.92;
                  const toBallX = state.ball.x - man.x;
                  const toBallY = state.ball.y - man.y;
                  const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
                  tx = man.x + (toBallX / dBall) * 0.78;
                  ty = man.y + (toBallY / dBall) * 0.78;
                  maxSpd = def.offBalanceTimer > 0 ? 3.2 : 4.55;
                  def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
                }
              } else {
                if (!manHasBall) {
                  tx = -2.2;
                  ty = 3.5;
                  def.ballWatchFactor = 0.85;
                  def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
                  maxSpd = 3.8;
                } else if (tut.crossoverDone) {
                  tx = def.x;
                  ty = def.y;
                  maxSpd = 1.2;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                } else {
                  const toRimX = COURT.rimX - man.x;
                  const toRimY = COURT.rimY - man.y;
                  const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                  tx = man.x + (toRimX / dRim) * 1.15;
                  ty = man.y + (toRimY / dRim) * 1.15;
                  maxSpd = 4.9;
                  def.ballWatchFactor = 0.0;
                  def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                }
              }
            } else if (i === 0 && state.role === "offense") {
              const toRimX = COURT.rimX - man.x;
              const toRimY = COURT.rimY - man.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              const userConstSprintHC =
                def.offBalanceTimer <= 0 &&
                state.rhythm.burstBoostTimer <= 0 &&
                keys.Shift &&
                (hypot2(man.vx, man.vy) > 1.0 || state.rhythm.monotoneSprintTime > 0);

              if (userConstSprintHC) {
                // Constant Shift without Change of Pace -> Difficulty-Balanced Chase!
                def.paceAdapt = Math.min(1.0, (def.paceAdapt || 0) + dt * 3.5);
                const lockCushion = manHasBall ? (state.difficulty === "easy" ? 1.06 : state.difficulty === "medium" ? 1.04 : 1.02) : 0.84;
                tx = man.x + (toRimX / dRim) * lockCushion + man.vx * 0.115;
                ty = man.y + (toRimY / dRim) * lockCushion + man.vy * 0.115;
                const chaseSpd = state.difficulty === "easy" ? 5.55 * diff.defSpeedMult : 5.65;
                def.ballWatchFactor = 0.06;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
                moveAgentToward(def, tx, ty, chaseSpd, dt, false, true);
                continue;
              }

              if (manHasBall) {
                const onBallCushion = state.difficulty === "easy" ? 1.08 : state.difficulty === "medium" ? 1.04 : 1.0;
                tx = man.x + (toRimX / dRim) * onBallCushion;
                ty = man.y + (toRimY / dRim) * onBallCushion;
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : 4.85;
                def.ballWatchFactor = 0.0;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              } else if (state.scenario === "relocation") {
                const pg = state.offense[1];
                const pgDriveProgress = clamp((7.5 - pg.y) / 3.6, 0, 1);
                if (dist2(man, pg) < COURT.crowdingDist) {
                  tx = lerp(man.x, pg.x, 0.42);
                  ty = lerp(man.y, pg.y, 0.42);
                  def.ballWatchFactor = 0.45;
                } else {
                  tx = lerp(man.x * 0.72, side * 2.05, pgDriveProgress * 0.85);
                  ty = lerp(man.y * 0.82, 3.25, pgDriveProgress * 0.85);
                  def.ballWatchFactor = pgDriveProgress * 0.88;
                }
                def.gazeAngle = def.ballWatchFactor > 0.5 ? Math.atan2(pg.y - def.y, pg.x - def.x) : Math.atan2(man.y - def.y, man.x - def.x);
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : 4.35;
              } else if (
                state.scenario === "cut" ||
                state.scenario === "give_go" ||
                (state.passAssist.active && state.passAssist.mode === "triple_threat")
              ) {
                const watchingBall =
                  state.scenario === "give_go" || (state.passAssist.active && state.passAssist.mode === "triple_threat") || state.simTime > 0.65;
                def.ballWatchFactor = watchingBall ? 0.94 : 0.35;
                const isMonotoneMove =
                  state.rhythm.monotoneSprintTime > 0.35 ||
                  (hypot2(man.vx, man.vy) > 0.5 && state.rhythm.burstBoostTimer <= 0 && def.offBalanceTimer <= 0);
                def.paceAdapt = isMonotoneMove ? Math.min(1.0, def.paceAdapt + dt * 2.2) : Math.max(0, def.paceAdapt - dt * 1.5);

                const toBallX = state.ball.x - man.x;
                const toBallY = state.ball.y - man.y;
                const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
                const denyDist = lerp(0.85, 0.55, def.paceAdapt);
                tx = man.x + (toBallX / dBall) * denyDist + man.vx * 0.14 * def.paceAdapt;
                ty = man.y + (toBallY / dBall) * denyDist + man.vy * 0.14 * def.paceAdapt;
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : lerp(4.75, 5.45, def.paceAdapt);
                def.gazeAngle = watchingBall ? Math.atan2(state.ball.y - def.y, state.ball.x - def.x) : Math.atan2(man.y - def.y, man.x - def.x);
              } else if (state.scenario === "vcut") {
                const isMonotoneMove =
                  state.rhythm.monotoneSprintTime > 0.35 ||
                  (hypot2(man.vx, man.vy) > 0.5 && state.rhythm.burstBoostTimer <= 0 && def.offBalanceTimer <= 0);
                def.paceAdapt = isMonotoneMove ? Math.min(1.0, def.paceAdapt + dt * 2.2) : Math.max(0, def.paceAdapt - dt * 1.5);
                const toBallX = state.ball.x - man.x;
                const toBallY = state.ball.y - man.y;
                const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
                tx = man.x + (toBallX / dBall) * 0.72 + man.vx * 0.14 * def.paceAdapt;
                ty = man.y + (toBallY / dBall) * 0.72 + man.vy * 0.14 * def.paceAdapt;
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : lerp(4.8, 5.45, def.paceAdapt);
                def.ballWatchFactor = 0.2;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              } else {
                const distManToBall = hypot2(man.x - state.ball.x, man.y - state.ball.y);
                const helpPull = clamp((distManToBall - 5.2) / 9.0, 0.04, 0.22);
                const baseX = man.x + (toRimX / dRim) * 1.08;
                const baseY = man.y + (toRimY / dRim) * 1.08;
                tx = lerp(baseX, COURT.rimX, helpPull);
                ty = lerp(baseY, COURT.rimY + 1.25, helpPull);
                def.ballWatchFactor = clamp(0.22 + helpPull * 1.4, 0, 1);
                maxSpd = def.offBalanceTimer > 0 ? 1.65 : 4.85;
                def.gazeAngle =
                  def.ballWatchFactor > 0.5 ? Math.atan2(state.ball.y - def.y, state.ball.x - def.x) : Math.atan2(man.y - def.y, man.x - def.x);
              }
            } else {
              // Teammate defenders (in both Offense & Defense modes)
              const toRimX = COURT.rimX - man.x;
              const toRimY = COURT.rimY - man.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              const cushion = manHasBall || isPassReceiverHC ? 1.05 : 1.25;
              tx = man.x + (toRimX / dRim) * cushion;
              ty = man.y + (toRimY / dRim) * cushion;
              if (isPassReceiverHC && !state.ball.wasCutPass) {
                // Immediate Closeout at t = 0 when pass is thrown to this matchup!
                def.ballWatchFactor = 0.12;
                maxSpd = 5.05;
                fastCloseout = true;
              } else if (
                !manHasBall &&
                state.role === "offense" &&
                state.scenario === "match" &&
                ((i === state.motion.cutterIdx && state.motion.cutPhase === "slash") ||
                  (hcPassInAir && state.ball.wasCutPass && state.ball.targetIdx === i))
              ) {
                // Slashing teammate beat defender with V-step -> defender trails outside the paint lane!
                def.ballWatchFactor = 0.72;
                tx = clamp(man.x + state.motion.cutSide * 1.58, -6.5, 6.5);
                ty = clamp(man.y + 0.38, 1.35, 9.2);
                maxSpd = 4.05;
              } else if (!manHasBall && hcDrive > 0.04 && (state.role === "offense" || state.scenario === "match")) {
                const isStrongCorner = man.x * hcBh.x > 0.35 && man.y < 3.85;
                let wHelp = 0;
                let helpX = tx;
                let helpY = ty;
                if (isStrongCorner) {
                  wHelp = 0.08 * hcDrive;
                  helpX = lerp(man.x, COURT.rimX, 0.25);
                  helpY = man.y;
                } else if (i === hcLowManIdx) {
                  wHelp = 0.76 * hcDrive;
                  helpX = clamp(hcBh.x * 0.45, -1.1, 1.1);
                  helpY = COURT.rimY + 0.92;
                } else {
                  wHelp = 0.24 * hcDrive;
                  helpX = clamp(hcBh.x * 0.55, -2.1, 2.1);
                  helpY = lerp(man.y, COURT.rimY + 1.85, 0.55);
                }
                tx = lerp(tx, helpX, wHelp);
                ty = lerp(ty, helpY, wHelp);
                def.ballWatchFactor = 0.32 + wHelp * 0.65;
                maxSpd = state.role === "defense" ? 4.45 : 4.25;
              } else {
                maxSpd = state.role === "defense" ? 4.35 : 4.2;
              }
              def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
            }

            if (state.scenario !== "tutorial") {
              maxSpd *= diff.defSpeedMult;
              if (def.ballWatchFactor > 0.05) {
                def.ballWatchFactor = clamp(def.ballWatchFactor + diff.ballWatchBoost, 0, 1);
              }
            }

            moveAgentToward(def, tx, ty, maxSpd, dt, false, fastCloseout && def.offBalanceTimer <= 0);
          }
        }

        /* =====================================================================
         * 8. Passing Lanes, On-Ball Direct Pass, Steals, Shots & Full-Court Flow
         * ===================================================================== */
        const _scratchPassBlock = { blocked: false, blockerIdx: -1, projT: 1.0, blockX: 0, blockY: 0 };
        const _scratchPassBest = { blocked: false, blockerIdx: -1, projT: 1.0, blockX: 0, blockY: 0 };

        function checkTeamPassBlocked(team, fromP, toP, out) {
          const res = out || { blocked: false, blockerIdx: -1, projT: 1.0, blockX: 0, blockY: 0 };
          const oppArr = team === "offense" ? state.defense : state.offense;
          const ax = fromP.x;
          const ay = fromP.y;
          const vx = toP.x - ax;
          const vy = toP.y - ay;
          const lenSq = vx * vx + vy * vy;
          if (lenSq < 1e-6) {
            res.blocked = false;
            res.blockerIdx = -1;
            res.projT = 1.0;
            res.blockX = 0;
            res.blockY = 0;
            return res;
          }
          const invLenSq = 1.0 / lenSq;
          const defBlockRad = state.difficulty === "easy" ? 0.32 : state.difficulty === "medium" ? 0.48 : 0.68;
          let blockerIdx = -1;
          let bestProjT = 1.0;
          let blockX = 0;
          let blockY = 0;

          for (let i = 0; i < oppArr.length; i++) {
            const def = oppArr[i];
            if (def.offBalanceTimer > 0) continue;
            const dfx = def.x - ax;
            const dfy = def.y - ay;
            const closeToPasser = team === "offense" && dfx * dfx + dfy * dfy < 3.8025; // < 1.95m outlet grace for all defenders
            let blockRad = defBlockRad;
            let minProjT = 0.15;
            if (team === "offense") {
              if (closeToPasser) {
                blockRad = 0.34;
                minProjT = 0.38;
              } else {
                blockRad = def.ballWatchFactor > 0.62 ? 0.38 : 0.62;
              }
            }
            const blockRadSq = blockRad * blockRad;

            const tNow = clamp((dfx * vx + dfy * vy) * invLenSq, 0, 1);
            const cxNow = vx * tNow;
            const cyNow = vy * tNow;
            const dxNow = dfx - cxNow;
            const dyNow = dfy - cyNow;
            const dSqNow = dxNow * dxNow + dyNow * dyNow;

            const lfx = dfx + def.vx * 0.12;
            const lfy = dfy + def.vy * 0.12;
            const tLead = clamp((lfx * vx + lfy * vy) * invLenSq, 0, 1);
            const cxLead = vx * tLead;
            const cyLead = vy * tLead;
            const dxLead = lfx - cxLead;
            const dyLead = lfy - cyLead;
            const dSqLead = dxLead * dxLead + dyLead * dyLead;

            let useT = tNow;
            let useDSq = dSqNow;
            let useCx = ax + cxNow;
            let useCy = ay + cyNow;
            if (dSqLead < dSqNow) {
              useT = tLead;
              useDSq = dSqLead;
              useCx = ax + cxLead;
              useCy = ay + cyLead;
            }

            if (useT > minProjT && useT < 0.88 && useDSq <= blockRadSq && useT < bestProjT) {
              bestProjT = useT;
              blockerIdx = i;
              blockX = useCx;
              blockY = useCy;
            }
          }
          res.blocked = blockerIdx !== -1;
          res.blockerIdx = blockerIdx;
          res.projT = bestProjT;
          res.blockX = blockX;
          res.blockY = blockY;
          return res;
        }

        function checkPassLineBlocked(fromP, toP, out) {
          return checkTeamPassBlocked("offense", fromP, toP, out);
        }

        function updatePassTarget() {
          const userOffenseReady =
            !isUserOnDefenseNow() &&
            !state.ball.inFlight &&
            !state.ball.loose &&
            state.ball.holderTeam === "offense" &&
            state.ball.holderIdx === 0 &&
            state.playPhase === "live";

          if (!userOffenseReady) {
            state.passTarget.idx = -1;
            state.passTarget.laneOpen = true;
            state.passTarget.blockerIdx = -1;
            return;
          }

          const me = state.offense[0];
          const screenRight = (keys.D ? 1 : 0) - (keys.A ? 1 : 0);
          const screenUp = (keys.W ? 1 : 0) - (keys.S ? 1 : 0);
          const hasDir = screenRight !== 0 || screenUp !== 0;
          let ix = 0;
          let iy = 0;
          let isDrivingWithDir = false;
          if (hasDir) {
            const wd = worldDirFromScreenInput(screenRight, screenUp, getActiveInputYaw(), _scratchDir);
            const il = Math.max(0.001, Math.sqrt(wd.x * wd.x + wd.y * wd.y));
            ix = wd.x / il;
            iy = wd.y / il;
            const meSpdSq = me.vx * me.vx + me.vy * me.vy;
            if (meSpdSq > 3.24) {
              const meSpd = Math.sqrt(meSpdSq);
              const velDotDir = (me.vx * ix + me.vy * iy) / meSpd;
              if (velDotDir > 0.68 && (me.y < 8.8 || me.vy < -1.2)) {
                isDrivingWithDir = true;
              }
            }
          }

          let bestIdx = 1;
          let bestScore = -9999;
          let bestOpenness = 0;
          _scratchPassBest.blocked = false;
          _scratchPassBest.blockerIdx = -1;
          _scratchPassBest.blockX = 0;
          _scratchPassBest.blockY = 0;

          for (let m = 1; m < state.offense.length; m++) {
            const mate = state.offense[m];
            const dx = mate.x - me.x;
            const dy = mate.y - me.y;
            const dist = Math.max(0.01, Math.sqrt(dx * dx + dy * dy));
            const lineInfo = checkPassLineBlocked(me, mate, _scratchPassBlock);

            let closestDefSq = 9999;
            for (let d = 0; d < state.defense.length; d++) {
              const def = state.defense[d];
              const ddx = mate.x - def.x;
              const ddy = mate.y - def.y;
              const dSq = ddx * ddx + ddy * ddy;
              if (dSq < closestDefSq) closestDefSq = dSq;
            }
            const closestDef = Math.sqrt(closestDefSq);

            const isSlashingCutter =
              (state.fullCourt || state.scenario === "match") && m === state.motion.cutterIdx && state.motion.cutPhase === "slash" && mate.y < 6.4;
            const fastBreakAheadBonus = state.fullCourt && !lineInfo.blocked && mate.y < me.y - 2.0 ? 1.45 : 0;

            let score = 0;
            if (hasDir) {
              const align = (dx * ix + dy * iy) / dist;
              const alignWeight = isDrivingWithDir ? 2.15 : 4.65;
              const openWeight = isDrivingWithDir ? 1.08 : 0.45;
              const wideOpenKickBonus = !lineInfo.blocked && closestDef >= 1.95 ? 1.45 : 0;
              const dirCutBonus = !lineInfo.blocked && isSlashingCutter && closestDef >= 1.0 ? 1.85 : 0;
              score =
                align * alignWeight +
                (lineInfo.blocked ? -8.2 : 1.2) +
                Math.min(closestDef, 4.6) * openWeight -
                dist * 0.03 +
                wideOpenKickBonus +
                dirCutBonus +
                fastBreakAheadBonus * 0.75;
            } else {
              const giveGoBonus = !state.fullCourt && state.scenario === "give_go" && state.giveGoStage === 1 && m === 1 ? 1.8 : 0;
              const cutSlashBonus = !lineInfo.blocked && isSlashingCutter && closestDef >= 1.0 ? 3.85 : 0;
              score =
                (lineInfo.blocked ? -9.5 : 3.0) +
                Math.min(closestDef, 5.0) * 1.15 -
                Math.abs(dist - 5.8) * 0.08 +
                giveGoBonus +
                fastBreakAheadBonus +
                cutSlashBonus;
            }

            if (score > bestScore) {
              bestScore = score;
              bestIdx = m;
              bestOpenness = closestDef;
              _scratchPassBest.blocked = lineInfo.blocked;
              _scratchPassBest.blockerIdx = lineInfo.blockerIdx;
              _scratchPassBest.blockX = lineInfo.blockX;
              _scratchPassBest.blockY = lineInfo.blockY;
            }
          }

          state.passTarget.idx = bestIdx;
          state.passTarget.laneOpen = !_scratchPassBest.blocked;
          state.passTarget.blockerIdx = _scratchPassBest.blockerIdx;
          state.passTarget.blockX = _scratchPassBest.blockX;
          state.passTarget.blockY = _scratchPassBest.blockY;
          state.passTarget.openness = bestOpenness;
        }

        function startTeamPass(team, fromIdx, toIdx, opts) {
          const teamArr = team === "offense" ? state.offense : state.defense;
          const sender = teamArr[fromIdx];
          const receiver = teamArr[toIdx];
          const courtLen = getCourtLength();
          sender.passPoseTimer = 0.32;
          sender.gazeAngle = Math.atan2(receiver.y - sender.y, receiver.x - sender.x);
          sender.facing = sender.gazeAngle;

          state.ball.passTeam = team;
          state.ball.inFlight = true;
          state.ball.loose = false;
          state.ball.postMakeDrop = false;
          state.ball.isInbound = !!(opts && opts.isInbound);
          state.ball.flightType = "pass";
          state.ball.fromIdx = fromIdx;
          state.ball.fromX = sender.x;
          state.ball.fromY = sender.y;
          state.ball.fromZ = 1.25;
          state.ball.toX = clamp(receiver.x + receiver.vx * 0.16, -COURT.halfW + 0.5, COURT.halfW - 0.5);
          state.ball.toY = clamp(receiver.y + receiver.vy * 0.16, 0.7, courtLen - 0.6);
          state.ball.toZ = 1.25;
          state.ball.targetIdx = toIdx;
          state.ball.t = 0;
          state.ball.gatherTimer = 0;
          if (typeof _recycleBallTrail === "function") _recycleBallTrail();
          else state.ball.trail.length = 0;
          state.ball.userPassBlockedBy = opts && opts.blockedBy !== undefined ? opts.blockedBy : -1;
          state.ball.userPassBlockT = opts && opts.blockT !== undefined ? opts.blockT : 1.0;
          state.ball.wasDriveKickPass = !!(opts && opts.wasDriveKick);
          state.ball.wasCutPass = !!(opts && opts.wasCutPass);
          state.ball.wasAICutPass = !!(opts && opts.wasAICutPass);
          state.ball.isReturnPass = !!(opts && opts.isReturnPass);
          const d = hypot2(state.ball.toX - sender.x, state.ball.toY - sender.y);
          state.ball.duration = clamp(d / 18.5, 0.18, 0.52);
          state.playPhase = "pass_flight";
          SoundEngine.playPassZip();
        }

        function startPass(fromIdx, toIdx, opts) {
          startTeamPass("offense", fromIdx, toIdx, opts);
        }

        function executeUserPass(explicitMateIdx) {
          if (state.paused || state.playPhase !== "live" || state.inbound.active) return false;
          if (isUserOnDefenseNow() || state.ball.inFlight || state.ball.loose || state.ball.holderTeam !== "offense" || state.ball.holderIdx !== 0)
            return false;

          if (!state.fullCourt && state.scenario === "tutorial") {
            setCoachMessage("warn", "🏀", "DRIBBLE & SHOOT!", 0.9);
            return false;
          }

          updatePassTarget();
          const toIdx =
            explicitMateIdx && explicitMateIdx >= 1 && explicitMateIdx < state.offense.length
              ? explicitMateIdx
              : state.passTarget.idx > 0
                ? state.passTarget.idx
                : 1;

          const me = state.offense[0];
          const receiver = state.offense[toIdx];
          const lineCheck = checkPassLineBlocked(me, receiver, _scratchPassBlock);

          let nearDefs = 0;
          let recClosestDefSq = 9999;
          for (let d = 0; d < state.defense.length; d++) {
            const def = state.defense[d];
            if ((me.x - def.x) * (me.x - def.x) + (me.y - def.y) * (me.y - def.y) < 10.5625) nearDefs++;
            const rSq = (receiver.x - def.x) * (receiver.x - def.x) + (receiver.y - def.y) * (receiver.y - def.y);
            if (rSq < recClosestDefSq) recClosestDefSq = rSq;
          }
          const recClosestDef = Math.sqrt(recClosestDefSq);
          const distMeRim = hypot2(me.x - COURT.rimX, me.y - COURT.rimY);
          const wasDriveKick = state.scenario !== "give_go" && receiver.y < 11.8 && (distMeRim < 6.45 || me.y < 6.25 || nearDefs >= 2);
          const openOnRelease = recClosestDef >= 1.45;
          const isOutletAhead = state.fullCourt && receiver.y < me.y - 3.5 && me.y > 12.0;
          const wasCutPass =
            (state.fullCourt || state.scenario === "match") &&
            ((toIdx === state.motion.cutterIdx && state.motion.cutPhase === "slash" && receiver.y < 6.4) ||
              (receiver.y < 4.2 && receiver.vx * receiver.vx + receiver.vy * receiver.vy > 4.84));

          state.dribblePressure.timer = 0;
          state.dribblePressure.ratio = 0;
          keys.CallFlash = 0.22;
          startTeamPass("offense", 0, toIdx, {
            blockedBy: lineCheck.blocked ? lineCheck.blockerIdx : -1,
            blockT: lineCheck.blocked ? clamp(lineCheck.projT, 0.2, 0.86) : 1.0,
            wasDriveKick: wasDriveKick && openOnRelease,
            wasCutPass,
          });

          if (!lineCheck.blocked) {
            if (!state.fullCourt && state.scenario === "give_go" && state.giveGoStage === 1) {
              state.giveGoStage = 2;
              state.rhythm.slowMoveTime = 0;
              state.rhythm.copCount = 0;
              setCoachMessage("good", "🐢", "WALK... ⚡ CUT!", 1.3);
            } else if (wasCutPass) {
              setCoachMessage("good", "🎯", "GREAT CUT PASS!", 1.0);
            } else if (isOutletAhead) {
              setCoachMessage("good", "🔥", "FAST BREAK!", 1.0);
            } else if (wasDriveKick) {
              setCoachMessage("good", "🎯", "GREAT PASS!", 0.9);
            } else {
              setCoachMessage("good", "🎯", "PASS! NOW CUT!", 1.0);
            }
          }
          syncAllDOM();
          return true;
        }

        /* Exact Shot Zone & Probability Engine: Layup 80%, 2-Point Jumper 50%, 3-Pointer 30% */
        function classifyShotZone(team, shooter) {
          const rim = getTeamTargetRim(team);
          const dRim = hypot2(shooter.x - rim.x, shooter.y - rim.y);
          const isLayup = dRim <= 2.55;
          const isThree = !isLayup && (dRim >= 6.68 || (Math.abs(shooter.x) >= 6.42 && Math.abs(shooter.y - rim.y) <= 3.18));
          const shotType = isLayup ? "layup" : isThree ? "three" : "mid2";
          const baseProb = isLayup ? 0.8 : isThree ? 0.3 : 0.5;
          const points = isThree ? 3 : 2;
          return { rim, dRim, isLayup, isThree, shotType, baseProb, points };
        }

        function computeShotMakeOutcome(team, shooterIdx, opts) {
          const shooter = team === "offense" ? state.offense[shooterIdx] : state.defense[shooterIdx];
          const zone = classifyShotZone(team, shooter);
          const options = opts || {};

          if (typeof options.forceMake === "boolean") {
            return {
              willMake: options.forceMake,
              prob: options.forceMake ? 1.0 : 0.0,
              baseProb: zone.baseProb,
              shotType: zone.shotType,
              points: zone.points,
              wasContested: !!options.wasContested,
            };
          }

          // Beginner 4-Step Offense Tutorial (LEARN): deterministic clear so kid never stalls on Step 2-4!
          if (!state.fullCourt && state.scenario === "tutorial") {
            return {
              willMake: true,
              prob: 1.0,
              baseProb: zone.baseProb,
              shotType: zone.shotType,
              points: zone.points,
              wasContested: false,
            };
          }

          const defArr = team === "offense" ? state.defense : state.offense;
          const userTeam = state.fullCourt ? "offense" : state.role;
          const userIsDefendingThisShot = userTeam !== team;

          const invRim = 1.0 / Math.max(0.05, zone.dRim);
          const urx = (zone.rim.x - shooter.x) * invRim;
          const ury = (zone.rim.y - shooter.y) * invRim;

          let jumpContested = false;
          let maxRawC = 0.0;
          for (let i = 0; i < defArr.length; i++) {
            const def = defArr[i];
            if (!def || def.offBalanceTimer > 0) continue;
            const dx = def.x - shooter.x;
            const dy = def.y - shooter.y;
            const dSq = dx * dx + dy * dy;
            if (dSq > 3.61) continue; // > 1.90m: completely wide open (exact baseProb preserved!)
            const d = Math.sqrt(dSq);
            const frontDot = d > 1e-4 ? (dx * urx + dy * ury) / d : 1.0;
            // Rear-pursuit exemption: beaten defender behind shooter (frontDot <= -0.15) gives 0 contest!
            const dirW = clamp((frontDot + 0.15) / 0.75, 0.0, 1.0);
            if (dirW <= 0) continue;
            const isJump = (def.contestTimer || 0) > 0 || (def.jumpZ || 0) > 0.08;
            if (d <= 1.8 && isJump && dirW > 0.22) {
              jumpContested = true;
            }
            const prox = clamp((1.82 - d) / 1.05, 0.0, 1.0);
            const candRaw = prox * dirW * (isJump ? 1.22 : 0.92);
            if (candRaw > maxRawC) maxRawC = candRaw;
          }

          if (userIsDefendingThisShot && !state.fullCourt && state.appMode === "practice" && (jumpContested || options.wasContested)) {
            return {
              willMake: false,
              prob: 0.0,
              baseProb: zone.baseProb,
              shotType: zone.shotType,
              points: zone.points,
              wasContested: true,
            };
          }

          if (options.wasContested) {
            maxRawC = Math.max(maxRawC, 1.0);
          }

          let sev = 0.0;
          if (maxRawC > 0.02) {
            const diff = getDiffProfile();
            const forgiveShift = !userIsDefendingThisShot ? (diff.shotContestForgive || 0) * 0.95 : 0.0;
            sev = clamp(maxRawC - forgiveShift, 0.0, 1.0);
            if (!userIsDefendingThisShot && state.difficulty === "easy" && zone.isLayup) {
              sev = Math.min(sev, 0.61); // Keeps EASY contested layups >= ~52% so 7yo stays joyful!
            }
          }

          const wasContested = sev >= 0.32 || !!options.wasContested;
          const prob = sev <= 0 ? zone.baseProb : zone.baseProb * (1.0 - 0.75 * sev * sev);
          const rng = typeof options.rng === "function" ? options.rng() : Math.random();
          const willMake = rng < prob;

          return {
            willMake,
            prob,
            baseProb: zone.baseProb,
            shotType: zone.shotType,
            points: zone.points,
            wasContested,
          };
        }

        function _recycleBallTrail() {
          while (state.ball.trail.length > 0) {
            _trailPool.push(state.ball.trail.pop());
          }
        }

        function startShot(team, shooterIdx, explicitMake, assistedByUser, extraOpts) {
          const shooter = team === "offense" ? state.offense[shooterIdx] : state.defense[shooterIdx];
          const zone = classifyShotZone(team, shooter);
          const rim = zone.rim;
          const dRim = zone.dRim;
          shooter.layupMode = zone.isLayup;
          shooter.selfShotRebCooldown = zone.isLayup ? 0.62 : 0.4;
          triggerJump(shooter, shooter.layupMode ? 4.25 : 3.95);
          shooter.shootFollowTimer = 0.85;
          shooter.facing = Math.atan2(rim.y - shooter.y, rim.x - shooter.x);

          // Reactive Closeout Jump Contest by Nearby In-Position AI Defenders!
          if (state.fullCourt || state.scenario !== "tutorial") {
            const defArr = team === "offense" ? state.defense : state.offense;
            const meNow = getControlledPlayer();
            const invR = 1.0 / Math.max(0.05, dRim);
            const urx = (rim.x - shooter.x) * invR;
            const ury = (rim.y - shooter.y) * invR;
            for (let i = 0; i < defArr.length; i++) {
              const def = defArr[i];
              if (!def || def === meNow || (def.offBalanceTimer || 0) > 0 || (def.reactionTimer || 0) > 0) continue;
              const dx = def.x - shooter.x;
              const dy = def.y - shooter.y;
              const dSq = dx * dx + dy * dy;
              if (dSq > 0.0001 && dSq <= 2.4025) {
                // <= 1.55m
                const d = Math.sqrt(dSq);
                const fDot = (dx * urx + dy * ury) / d;
                if (fDot > 0.3) {
                  def.contestTimer = Math.max(def.contestTimer || 0, 0.52);
                  triggerJump(def, 2.95);
                }
              }
            }
          }

          const outcome =
            typeof explicitMake === "boolean"
              ? computeShotMakeOutcome(team, shooterIdx, Object.assign({}, extraOpts || {}, { forceMake: explicitMake }))
              : computeShotMakeOutcome(team, shooterIdx, extraOpts);
          const willMake = outcome.willMake;

          const incAng = Math.atan2(shooter.x - rim.x, Math.max(0.15, (shooter.y - rim.y) * rim.sign));
          const missSide = shooter.x >= 0 ? 1 : -1;
          const rimHitAng = clamp(incAng * 0.62 + missSide * 0.3, -1.32, 1.32);

          state.ball.inFlight = true;
          state.ball.loose = false;
          state.ball.postMakeDrop = false;
          state.ball.isInbound = false;
          state.ball.flightType = "shot";
          state.ball.shooterTeam = team;
          state.ball.shotPoints = zone.points;
          state.ball.shotType = zone.shotType;
          state.ball.wasContested = outcome.wasContested;
          state.ball.assistedByUser = !!assistedByUser;
          state.ball.fromX = shooter.x;
          state.ball.fromY = shooter.y;
          state.ball.fromZ = 1.68;
          state.ball.missRimAng = rimHitAng;
          state.ball.toX = willMake ? rim.x : rim.x + Math.sin(rimHitAng) * COURT.rimRadius;
          state.ball.toY = willMake ? rim.y : rim.y + rim.sign * Math.cos(rimHitAng) * COURT.rimRadius;
          state.ball.toZ = willMake ? rim.z : rim.z + 0.04;
          state.ball.t = 0;
          state.ball.gatherTimer = 0;
          _recycleBallTrail();
          state.ball.duration = clamp(0.48 + dRim * 0.052, 0.5, 0.95);
          state.ball.shotMake = willMake;
          state.playPhase = "shot_flight";
        }

        function triggerUserSteal(isIntercept) {
          state.matchScore.steals += 1;
          state.matchScore.stops += 1;
          state.fx.crowdCheerTimer = 1.2;
          SoundEngine.playStealOrBlock(true);

          if (state.fullCourt) {
            const me = state.offense[0];
            const prevHolder = !state.ball.inFlight && state.ball.holderTeam === "defense" ? state.defense[state.ball.holderIdx] : null;
            if (prevHolder) {
              prevHolder.offBalanceTimer = 0.65;
              prevHolder.reactionTimer = 0.35;
            }
            state.ball.inFlight = false;
            state.ball.loose = false;
            state.ball.postMakeDrop = false;
            state.ball.isInbound = false;
            state.ball.flightType = "none";
            state.ball.holderTeam = "offense";
            state.ball.holderIdx = 0;
            state.ball.x = me.x;
            state.ball.y = me.y;
            state.ball.z = 1.15;
            state.ball.gatherTimer = 0;
            _recycleBallTrail();
            state.dribblePressure.timer = 0;
            state.dribblePressure.ratio = 0;
            state.playPhase = "live";
            spawnSparkles(me.x, me.y, "#facc15", 18);
            setCoachMessage("celebrate", "⚡", isIntercept ? "INTERCEPT!!" : "STEAL!! FAST BREAK!", 1.5);
            syncAllDOM();
            return;
          }

          const me = state.defense[0];
          state.ball.inFlight = false;
          state.ball.loose = false;
          state.ball.postMakeDrop = false;
          state.ball.isInbound = false;
          state.ball.flightType = "none";
          state.ball.holderTeam = "defense";
          state.ball.holderIdx = 0;
          state.ball.x = me.x;
          state.ball.y = me.y;
          state.ball.z = 1.15;
          state.ball.contestedByUser = true;
          _recycleBallTrail();
          spawnSparkles(me.x, me.y, "#facc15", 18);

          if (state.scenario === "learn_d" && state.tutorial.step === 4) {
            state.tutorial.completedSteps[4] = true;
            state.tutorial.subPhase = "graduated";
            state.tutorial.highlightKeys = [];
            state.playPhase = "live";
            setCoachMessage("celebrate", "🏆", "DEFENSE MASTER!!", 3.5);
            syncAllDOM();
            return;
          }

          state.playPhase = "celebrate";
          state.phaseTimer = 0;
          setCoachMessage("celebrate", "⚡", isIntercept ? "INTERCEPT!!" : "STEAL!! GREAT D!", 2.0);
          syncAllDOM();
        }

        function triggerUserPassDeflected(blockerIdx) {
          const bIdx = blockerIdx >= 0 ? blockerIdx : 0;
          const def = state.defense[bIdx];
          triggerJump(def, 3.2);
          def.contestTimer = 0.6;
          state.ball.inFlight = false;
          state.ball.loose = false;
          state.ball.postMakeDrop = false;
          state.ball.isInbound = false;
          state.ball.flightType = "none";
          state.ball.holderTeam = "defense";
          state.ball.holderIdx = bIdx;
          state.ball.userPassBlockedBy = bIdx;
          state.ball.x = def.x;
          state.ball.y = def.y;
          state.ball.z = 1.25;
          state.ball.gatherTimer = 0;
          _recycleBallTrail();
          state.passAssist.active = false;
          spawnSparkles(def.x, def.y, "#ef4444", 14);
          SoundEngine.playStealOrBlock(false);

          if (state.fullCourt) {
            state.playPhase = "live";
            state.defDrill.timer = 0;
            state.defDrill.actionTimer = 0;
            state.defDrill.cutterIdx = -1;
            setCoachMessage("warn", "⚠️", "STOLEN! GET BACK!", 1.5);
            syncAllDOM();
            return;
          }

          if (state.scenario === "match") {
            state.matchScore.stops += 1;
          }
          state.playPhase = "celebrate";
          state.phaseTimer = 0.55;
          setCoachMessage("warn", "⚠️", "BLOCKED!", 1.6);
          syncAllDOM();
        }

        function evaluateSpacingAndLane(dt) {
          if (state.fullCourt) {
            const me = state.offense[0];
            let minDefSq = 9999;
            for (let d = 0; d < state.defense.length; d++) {
              const def = state.defense[d];
              const dx = me.x - def.x;
              const dy = me.y - def.y;
              const dSq = dx * dx + dy * dy;
              if (dSq < minDefSq) minDefSq = dSq;
            }
            const minDef = Math.sqrt(minDefSq);
            state.lane.mySeparation = minDef;
            state.lane.scenarioReady = true;

            const dMeRimSq = (me.x - COURT.rimX) * (me.x - COURT.rimX) + (me.y - COURT.rimY) * (me.y - COURT.rimY);
            const crowdRad = dMeRimSq < 12.96 ? 1.45 : COURT.crowdingDist;
            const crowdRadSq = crowdRad * crowdRad;

            let minMateDistSq = 9999;
            let crowdedIdx = -1;
            for (let i = 1; i < state.offense.length; i++) {
              const mate = state.offense[i];
              const dx = me.x - mate.x;
              const dy = me.y - mate.y;
              const dmSq = dx * dx + dy * dy;
              if (dmSq < minMateDistSq) {
                minMateDistSq = dmSq;
                if (dmSq < crowdRadSq && me.y < 12.0) crowdedIdx = i;
              }
            }
            state.lane.minTeammateDist = Math.sqrt(minMateDistSq);
            state.lane.crowdedTeammateIdx = crowdedIdx;

            if (isUserOnDefenseNow() || state.ball.loose) {
              const dxT = me.x - state.targetSpot.x;
              const dyT = me.y - state.targetSpot.y;
              state.lane.open = dxT * dxT + dyT * dyT < 2.7225;
              state.lane.blockerIdx = -1;
              return;
            }

            if (state.ball.inFlight || state.ball.holderTeam !== "offense" || state.ball.holderIdx === 0 || state.inbound.active) {
              state.lane.open = false;
              state.lane.openTimer = 0;
              state.lane.blockerIdx = -1;
              return;
            }

            const passer = state.offense[state.ball.holderIdx];
            const line = checkPassLineBlocked(passer, me);
            state.lane.blockerIdx = line.blocked ? line.blockerIdx : -1;
            state.lane.blockX = line.blockX;
            state.lane.blockY = line.blockY;

            const isReturnCut = state.passAssist.active && state.passAssist.mode === "triple_threat";
            const openReady = !line.blocked && crowdedIdx === -1 && (minDef > 1.25 || state.rhythm.burstBoostTimer > 0);
            state.lane.open = openReady;

            if (isReturnCut && openReady && (me.y < 6.5 || (me.y < 11.5 && minDef >= 1.8))) {
              state.lane.openTimer += dt;
              if (state.lane.openTimer >= 0.16) {
                state.lane.openTimer = 0;
                startTeamPass("offense", state.ball.holderIdx, 0, { isReturnPass: true });
                setCoachMessage("good", "⚡", "RETURN PASS!", 1.1);
              }
            } else {
              state.lane.openTimer = 0;
            }
            return;
          }

          const me = state.offense[0];
          const myDef = state.defense[0];
          state.lane.mySeparation = Math.sqrt((me.x - myDef.x) * (me.x - myDef.x) + (me.y - myDef.y) * (me.y - myDef.y));

          const dMeRim = Math.sqrt((me.x - COURT.rimX) * (me.x - COURT.rimX) + (me.y - COURT.rimY) * (me.y - COURT.rimY));
          const crowdRad = state.scenario === "match" && dMeRim < 3.6 ? 1.45 : COURT.crowdingDist;
          const crowdRadSq = crowdRad * crowdRad;

          let minMateDistSq = 9999;
          let crowdedIdx = -1;
          for (let i = 1; i < state.offense.length; i++) {
            const mate = state.offense[i];
            const dx = me.x - mate.x;
            const dy = me.y - mate.y;
            const dSq = dx * dx + dy * dy;
            if (dSq < minMateDistSq) {
              minMateDistSq = dSq;
              if (dSq < crowdRadSq) crowdedIdx = i;
            }
          }
          state.lane.minTeammateDist = Math.sqrt(minMateDistSq);
          state.lane.crowdedTeammateIdx = crowdedIdx;

          if (state.ball.loose) {
            const meNow = getControlledPlayer();
            state.lane.crowdedTeammateIdx = -1;
            state.lane.blockerIdx = -1;
            state.lane.openTimer = 0;
            state.lane.scenarioReady = true;
            if (meNow) {
              const dxT = meNow.x - state.targetSpot.x;
              const dyT = meNow.y - state.targetSpot.y;
              state.lane.open = dxT * dxT + dyT * dyT < 2.7225;
            } else {
              state.lane.open = false;
            }
            return;
          }

          if (state.role === "defense") {
            const dTarget = hypot2(state.defense[0].x - state.targetSpot.x, state.defense[0].y - state.targetSpot.y);
            state.helpTriangle.distToIdeal = dTarget;
            state.lane.open = dTarget < 1.55;
            state.lane.scenarioReady = true;
            return;
          }

          if (state.ball.inFlight || state.ball.holderTeam !== "offense" || state.ball.holderIdx === 0) {
            state.lane.open = false;
            state.lane.openTimer = 0;
            state.lane.blockerIdx = -1;
            state.lane.scenarioReady = true;
            return;
          }

          const passer = state.offense[state.ball.holderIdx];
          let blockerIdx = -1;
          let blockX = 0;
          let blockY = 0;

          for (let i = 0; i < state.defense.length; i++) {
            const def = state.defense[i];
            if (def.offBalanceTimer > 0) continue;
            const seg = pointToSegmentInfo(def.x, def.y, passer.x, passer.y, me.x, me.y, _scratchSeg);
            if (i === state.ball.holderIdx) {
              if (seg.projT > 0.36 && seg.projT < 0.92 && seg.dist < 0.42) {
                blockerIdx = i;
                blockX = seg.cx;
                blockY = seg.cy;
                break;
              }
              continue;
            }
            const dDefRim = Math.sqrt((def.x - COURT.rimX) * (def.x - COURT.rimX) + (def.y - COURT.rimY) * (def.y - COURT.rimY));
            const isTrailingBehindCut = dDefRim > dMeRim + 0.55;
            const blockRadius = isTrailingBehindCut ? 0.42 : i === 0 ? 0.88 : 0.78;
            const maxProjT = isTrailingBehindCut ? 0.85 : 0.96;
            if (seg.projT > 0.14 && seg.projT < maxProjT && seg.dist < blockRadius) {
              blockerIdx = i;
              blockX = seg.cx;
              blockY = seg.cy;
              break;
            }
          }

          const closeBlockDist = state.difficulty === "easy" && state.scenario === "match" ? 0.82 : 1.12;
          if (blockerIdx === -1 && state.lane.mySeparation < closeBlockDist && myDef.offBalanceTimer <= 0) {
            blockerIdx = 0;
            blockX = myDef.x;
            blockY = myDef.y;
          }

          let scenarioReady = true;
          if (state.scenario === "tutorial") {
            const tut = state.tutorial;
            if (tut.step === 1) scenarioReady = false;
            else if (tut.step === 2) scenarioReady = hypot2(me.x - -5.85, me.y - 5.65) < 2.2 && crowdedIdx === -1;
            else if (tut.step === 3) scenarioReady = tut.subPhase === "3b_burst" && tut.copSucceeded && me.y < 5.0;
            else if (tut.step === 4) scenarioReady = tut.subPhase === "get_ball" && hypot2(me.x - -5.5, me.y - 4.75) < 1.85;
          } else if (state.scenario === "relocation") {
            const dTarget = hypot2(me.x - state.targetSpot.x, me.y - state.targetSpot.y);
            if (dTarget > 2.85 || crowdedIdx !== -1) scenarioReady = false;
          } else if (state.scenario === "cut") {
            if (me.y > 4.65 && state.lane.mySeparation < 1.35) scenarioReady = false;
          } else if (state.scenario === "give_go") {
            const cutDeep = me.y < 5.75 && (state.rhythm.copCount > 0 || myDef.offBalanceTimer > 0 || state.lane.mySeparation > 1.4);
            if (!cutDeep) scenarioReady = false;
          } else if (state.scenario === "vcut") {
            if (state.vcutStage === 1 && state.lane.mySeparation < 1.45) scenarioReady = false;
          } else if (state.passAssist.active && state.passAssist.mode === "triple_threat") {
            const cutOpen =
              state.rhythm.burstBoostTimer > 0 ||
              myDef.offBalanceTimer > 0 ||
              (me.y < 4.8 && state.lane.mySeparation > 1.35) ||
              state.lane.mySeparation >= 1.85;
            if (!cutOpen) scenarioReady = false;
          }
          state.lane.scenarioReady = scenarioReady;

          const isCrowded = crowdedIdx !== -1;
          state.lane.blockerIdx = blockerIdx;
          state.lane.blockX = blockX;
          state.lane.blockY = blockY;
          state.lane.open = blockerIdx === -1 && !isCrowded && scenarioReady;

          const isReturnCut = state.scenario === "give_go" || (state.passAssist.active && state.passAssist.mode === "triple_threat");
          const passThreshold = isReturnCut ? 0.16 : COURT.autoPassThreshold;

          if (isCrowded && state.playPhase === "live" && state.scenario !== "tutorial") {
            state.lane.openTimer = 0;
            setCoachMessage("warn", "⚠️", "TOO CLOSE! SPREAD!", 0.45);
          } else if (state.lane.open && state.playPhase === "live") {
            state.lane.openTimer += dt;
            if (state.lane.openTimer >= passThreshold) {
              state.lane.openTimer = 0;
              startPass(state.ball.holderIdx, 0, { isReturnPass: isReturnCut });
              if (state.scenario !== "tutorial") {
                setCoachMessage("good", isReturnCut ? "⚡" : "🟢", isReturnCut ? "RETURN PASS!" : "OPEN! PASS COMING!", 1.2);
              }
            }
          } else {
            state.lane.openTimer = Math.max(0, state.lane.openTimer - dt * 2.0);
            if (state.rhythm.monotoneSprintTime > 1.15 && state.playPhase === "live" && state.scenario !== "tutorial") {
              setCoachMessage("warn", "🐢", "WALK FIRST, THEN SHIFT!", 0.7);
            }
          }
        }

        /* Calibrated Rim-Ring Continuous Bounce + ~26% Backboard Bank Generator */
        function spawnRimBounceLooseBall(sTeam, rim, shotZone, shooterX, rngFn) {
          const rng = typeof rngFn === "function" ? rngFn : Math.random;
          const zone = shotZone || state.ball.shotType || "mid2";
          let spdMin = 1.3;
          let spdMax = 2.1;
          let vzMin = 1.65;
          let vzMax = 2.25;
          if (zone === "layup") {
            spdMin = 0.9;
            spdMax = 1.55;
            vzMin = 1.35;
            vzMax = 1.92;
          } else if (zone === "three") {
            spdMin = 1.72;
            spdMax = 2.62;
            vzMin = 1.8;
            vzMax = 2.38;
          }

          const b = state.ball;
          const shX = shooterX !== undefined ? shooterX : b.fromX;
          const shY = b.fromY !== undefined ? b.fromY : rim.y + rim.sign * 4.5;
          const weakSign = shX > 0.45 ? -1 : shX < -0.45 ? 1 : 0;
          const weakBias = zone === "three" ? 0.38 : 0.24;
          const rebAng = clamp((rng() * 2.0 - 1.0) * 1.04 + weakSign * weakBias, -1.18, 1.18);
          const rebSpd = spdMin + rng() * (spdMax - spdMin);
          const lvz = vzMin + rng() * (vzMax - vzMin);

          // Zero-teleport start on actual rim ring (r = 0.24m)!
          const dxToRim = (b.toX || 0) - rim.x;
          const dyToRim = (b.toY || 0) - rim.y;
          const hasExactRimLanding = dxToRim * dxToRim + dyToRim * dyToRim <= 0.14;
          const ringAng = b.missRimAng !== undefined ? b.missRimAng : rebAng;
          const startX = hasExactRimLanding ? b.toX : rim.x + Math.sin(ringAng) * COURT.rimRadius;
          const startY = hasExactRimLanding ? b.toY : rim.y + rim.sign * Math.cos(ringAng) * COURT.rimRadius;

          const isDeepCorner = Math.abs(shY - rim.y) < 2.15 && Math.abs(shX) > 4.2;
          const doBackboardBank = !isDeepCorner && rng() < 0.255;

          b.inFlight = false;
          b.flightType = "none";
          b.loose = true;
          b.postMakeDrop = false;
          b.isInbound = false;
          b.looseTimer = 0;
          b.shooterTeam = sTeam || "offense";
          b.outletReady = false;
          b.x = clamp(startX, -COURT.halfW + 0.55, COURT.halfW - 0.55);
          b.y = clamp(startY, 1.3, getCourtLength() - 1.3);

          if (doBackboardBank) {
            // Back-rim carom upward into backboard glass (triggers 3D backboard reflection!)
            b.rimKissPending = false;
            b.z = COURT.rimZ + 0.14;
            b.lvx = clamp(-shX * 0.12 + (rng() * 2.0 - 1.0) * 0.72, -1.0, 1.0);
            b.lvy = -rim.sign * (1.58 + rng() * 0.62);
            b.lvz = 1.48 + rng() * 0.52;
          } else {
            b.rimKissPending = rng() < 0.28;
            b.z = COURT.rimZ + 0.04;
            b.lvx = Math.sin(rebAng) * rebSpd;
            b.lvy = rim.sign * Math.cos(rebAng) * rebSpd;
            b.lvz = lvz;
          }
          _recycleBallTrail();
          state.playPhase = "live";
        }

        /* Unified Rebound Possession Resolution Across Full-Court & Half-Court Modes */
        function awardLooseBallRebound(winnerTeam, winnerIdx, viaJumpSnatch) {
          const b = state.ball;
          b.loose = false;
          b.inFlight = false;
          b.postMakeDrop = false;
          b.isInbound = false;
          b.flightType = "none";
          b.rimKissPending = false;
          b.holderTeam = winnerTeam;
          b.holderIdx = winnerIdx;
          b.gatherTimer = 0;
          _recycleBallTrail();

          for (let i = 0; i < state.offense.length; i++) {
            if (state.offense[i]) {
              state.offense[i].reboundAttemptTimer = 0;
              state.offense[i].selfShotRebCooldown = 0;
            }
          }
          for (let i = 0; i < state.defense.length; i++) {
            if (state.defense[i]) {
              state.defense[i].reboundAttemptTimer = 0;
              state.defense[i].selfShotRebCooldown = 0;
            }
          }

          const winner = winnerTeam === "offense" ? state.offense[winnerIdx] : state.defense[winnerIdx];
          if (winner) {
            winner.reboundReachTimer = Math.max(winner.reboundReachTimer || 0, 0.28);
            if ((winner.jumpZ || 0) <= 0.05) {
              triggerJump(winner, viaJumpSnatch ? 3.25 : 2.55);
            }
            b.x = winner.x;
            b.y = winner.y;
            b.z = Math.max(1.15, (winner.jumpZ || 0) + 1.15);
          }

          SoundEngine.playCatchPop();
          state.passAssist.active = false;
          state.defDrill.timer = 0;
          state.defDrill.actionTimer = 0;
          state.defDrill.cutterIdx = -1;
          state.defDrill.cutStage = 0;
          state.defDrill.phase = "probe";
          state.dribblePressure.timer = 0;
          state.dribblePressure.ratio = 0;

          if (state.fullCourt) {
            state.playPhase = "live";
            b.outletReady = winnerTeam === "offense" && winnerIdx > 0 && b.shooterTeam === "defense";
            if (winner) {
              spawnSparkles(winner.x, winner.y, winnerTeam === "offense" ? "#38bdf8" : "#f87171", 12);
            }
            if (winnerTeam === "offense") {
              setCoachMessage("good", "🏀", winnerIdx === 0 ? "YOUR REBOUND! GO!" : "FAST BREAK! RUN!", 1.2);
            } else {
              setCoachMessage("warn", "🛡️", "GET BACK! DEFEND!", 1.2);
            }
            syncAllDOM();
            return;
          }

          // Half-Court Rebound Resolution (5v5 MATCH & Practice Drills)
          if (winnerTeam === "offense") {
            // Offensive Rebound -> Second-Chance Live Play Continues!
            state.playPhase = "live";
            state.phaseTimer = 0;
            if (winner) {
              spawnSparkles(winner.x, winner.y, "#38bdf8", 12);
            }
            if (state.role === "offense") {
              if (winnerIdx === 0) {
                setCoachMessage("good", "🏀", "REBOUND! SHOOT!", 1.25);
              } else {
                const dRim = winner ? hypot2(winner.x - COURT.rimX, winner.y - COURT.rimY) : 99;
                let nearDef = 99;
                if (winner) {
                  for (let d = 0; d < state.defense.length; d++) nearDef = Math.min(nearDef, dist2(winner, state.defense[d]));
                }
                if (state.scenario !== "give_go" && dRim < 2.55 && nearDef > 1.2) {
                  state.passAssist.active = true;
                  state.passAssist.mode = "cut_layup";
                  state.passAssist.partnerIdx = winnerIdx;
                  state.passAssist.timer = 0.26;
                  state.passAssist.returnLookTimer = 0;
                  state.passAssist.wasDriveKick = false;
                  state.ball.gatherTimer = 0.26;
                } else if (state.scenario !== "match") {
                  state.passAssist.active = true;
                  state.passAssist.mode = "triple_threat";
                  state.passAssist.partnerIdx = winnerIdx;
                  state.passAssist.timer = 0;
                  state.passAssist.returnLookTimer = 1.95;
                  state.passAssist.wasDriveKick = false;
                }
                setCoachMessage("good", "🏀", "SECOND CHANCE!", 1.15);
              }
            } else {
              setCoachMessage("warn", "🏀", "BOX OUT! DEFEND!", 1.15);
            }
          } else {
            // Defensive Rebound -> Fast Tempo Transition to Next Possession!
            state.playPhase = "celebrate";
            state.phaseTimer = 0.45;
            if (state.role === "defense") {
              state.matchScore.stops += 1;
              state.fx.crowdCheerTimer = 1.2;
              if (winner) {
                spawnSparkles(winner.x, winner.y, "#22c55e", 16);
              }
              setCoachMessage("celebrate", "🛑", "GREAT REBOUND!!", 1.5);
            } else {
              if (winner) {
                spawnSparkles(winner.x, winner.y, "#f87171", 8);
              }
              if (b.wasContested) {
                setCoachMessage("warn", "🧱", "CONTESTED! PASS!", 1.5);
              } else {
                setCoachMessage("normal", "🏀", "GOOD OPEN TRY!", 1.5);
              }
            }
          }
          syncAllDOM();
        }

        function _isUserSealedOutOnRebound(me, refX, refY) {
          if (!me) return false;
          const myIsOff = state.fullCourt ? true : state.role === "offense";
          const oppArr = myIsOff ? state.defense : state.offense;
          const dMeRef = Math.sqrt((me.x - refX) * (me.x - refX) + (me.y - refY) * (me.y - refY));
          for (let i = 0; i < oppArr.length; i++) {
            const opp = oppArr[i];
            if (!opp || (opp.boxOutTimer || 0) <= 0 || (opp.offBalanceTimer || 0) > 0) continue;
            const dx = me.x - opp.x;
            const dy = me.y - opp.y;
            if (dx * dx + dy * dy < 1.3225) {
              // < 1.15m
              const dOppRef = Math.sqrt((opp.x - refX) * (opp.x - refX) + (opp.y - refY) * (opp.y - refY));
              if (dOppRef < dMeRef - 0.22) {
                return true;
              }
            }
          }
          return false;
        }

        function applyUserReboundJumpAssist(me) {
          if (!me) return;
          triggerJump(me, 3.65);
          me.reboundReachTimer = 0.72;
          me.reboundAttemptTimer = 0.92;
          SoundEngine.playSneakerSqueak(0.82);

          let aimX = state.ball.toX;
          let aimY = state.ball.toY;
          if (state.ball.loose) {
            const targetPt = computeLooseBallDropSpot(_scratchDrop);
            aimX = lerp(state.ball.x, targetPt.x, 0.55);
            aimY = lerp(state.ball.y, targetPt.y, 0.55);
          }
          const sealedOut = _isUserSealedOutOnRebound(me, aimX, aimY);
          if (sealedOut && state.difficulty !== "easy") return;

          const dx = aimX - me.x;
          const dy = aimY - me.y;
          const dAim = Math.sqrt(dx * dx + dy * dy);
          if (dAim > 0.06 && dAim <= 2.95) {
            const ux = dx / dAim;
            const uy = dy / dAim;
            const magSpd = clamp(1.1 + dAim * 0.62, 1.1, 2.4);
            me.vx = lerp(me.vx, ux * magSpd * 1.35, 0.65);
            me.vy = lerp(me.vy, uy * magSpd * 1.35, 0.65);
            const stepScale = sealedOut ? 0.1 : 0.28;
            const stepM = Math.min(dAim * stepScale, sealedOut ? 0.14 : 0.42);
            const cLen = getCourtLength();
            me.x = clamp(me.x + ux * stepM, -COURT.halfW + 0.45, COURT.halfW - 0.45);
            me.y = clamp(me.y + uy * stepM, 0.55, cLen - 0.55);
          }
        }

        function _switchHalfCourtOffenseLooseBallRebounder() {
          const drop = computeLooseBallDropSpot(_scratchDrop);
          let bestIdx = -1;
          let bestDist = 999;
          for (let i = 1; i < state.offense.length; i++) {
            const d = hypot2(state.offense[i].x - drop.x, state.offense[i].y - drop.y);
            if (d < bestDist) {
              bestDist = d;
              bestIdx = i;
            }
          }
          const dMe = hypot2(state.offense[0].x - drop.x, state.offense[0].y - drop.y);
          if (bestIdx <= 0 || dMe <= bestDist + 0.25) return false;

          const oldMe = state.offense[0];
          oldMe.reactionTimer = 0;
          oldMe.offBalanceTimer = 0;
          state.offense[0] = state.offense[bestIdx];
          state.offense[bestIdx] = oldMe;
          state.offense[0].id = 0;
          state.offense[0].name = "YOU";
          state.offense[0].number = 7;
          state.offense[bestIdx].id = bestIdx;
          state.offense[bestIdx].name = "M" + bestIdx;
          state.offense[bestIdx].number = bestIdx;

          const tmpDef = state.defense[0];
          state.defense[0] = state.defense[bestIdx];
          state.defense[bestIdx] = tmpDef;
          state.defense[0].id = 0;
          state.defense[bestIdx].id = bestIdx;

          if (state.motion && state.motion.slotForPlayer) {
            const s0 = state.motion.slotForPlayer[0];
            state.motion.slotForPlayer[0] = state.motion.slotForPlayer[bestIdx];
            state.motion.slotForPlayer[bestIdx] = s0;
            if (state.motion.cutterIdx === 0) state.motion.cutterIdx = bestIdx;
            else if (state.motion.cutterIdx === bestIdx) state.motion.cutterIdx = 0;
          }
          spawnSparkles(state.offense[0].x, state.offense[0].y, "#facc15", 6);
          setCoachMessage("good", "🔄", "SWITCHED!", 0.8);
          return true;
        }

        function handleSpaceAction() {
          if (state.paused) return;
          if (state.playPhase === "match_over") {
            startNewMatchGame();
            return;
          }
          if (state.inbound.active) return;
          if (
            !state.fullCourt &&
            (state.scenario === "tutorial" || state.scenario === "learn_d") &&
            (state.tutorial.advanceTimer > 0 || state.tutorial.subPhase === "graduated")
          ) {
            return;
          }
          keys.SpaceFlash = 0.22;
          const me = getControlledPlayer();
          const isEasy = state.difficulty === "easy";

          // 0) Loose-Ball Rebound Snatch + One-Touch Aerial PUTBACK Tip-In!
          if (state.ball.loose) {
            const b = state.ball;
            const userTeam = !state.fullCourt && state.role === "defense" ? "defense" : "offense";
            const sealedOut = _isUserSealedOutOnRebound(me, b.x, b.y);
            applyUserReboundJumpAssist(me);

            const dMeBall = hypot2(me.x - b.x, me.y - b.y);
            if (userTeam === "offense" && state.scenario !== "give_go" && (!sealedOut || isEasy)) {
              const dMeRim = hypot2(me.x - COURT.rimX, me.y - COURT.rimY);
              if (dMeRim <= 1.9 && dMeBall <= 1.85 && b.z >= 1.72 && b.z <= 3.12 && b.looseTimer >= 0.08) {
                const tipX = b.x;
                const tipY = b.y;
                const tipZ = clamp(b.z, 1.85, 3.02);
                b.loose = false;
                triggerJump(me, 3.85);
                startShot("offense", 0, null, false);
                b.fromX = tipX;
                b.fromY = tipY;
                b.fromZ = tipZ;
                b.duration = 0.3;
                SoundEngine.playCatchPop();
                spawnSparkles(me.x, me.y, "#facc15", 10);
                setCoachMessage("good", "🔥", "PUTBACK!!", 1.1);
                syncAllDOM();
                return;
              }
            }

            const snatchReach = sealedOut ? (isEasy ? 1.85 : 1.25) : 2.18;
            if (dMeBall <= snatchReach && b.z <= 3.28) {
              awardLooseBallRebound(userTeam, 0, true);
            }
            return;
          }

          // 0b) Early Buffered Rebound Jump When Missed Shot Is Within 0.36s of Hitting Rim!
          if (
            state.ball.inFlight &&
            state.ball.flightType === "shot" &&
            !state.ball.shotMake &&
            state.scenario !== "tutorial" &&
            state.scenario !== "learn_d"
          ) {
            const remSec = Math.max(0, 1.0 - state.ball.t) * (state.ball.duration || 0.6);
            if (remSec <= 0.36) {
              applyUserReboundJumpAssist(me);
              if (isUserOnDefenseNow()) me.contestTimer = 0.52;
              return;
            }
          }

          // 1) Defense SPACE = Steal (Directional Probabilistic Poke / Pass Intercept) or Shot Contest!
          if (isUserOnDefenseNow()) {
            // Mid-air Pass Intercept!
            if (state.ball.inFlight && state.ball.flightType === "pass") {
              me.contestTimer = 0.72;
              triggerJump(me, 3.45);
              SoundEngine.playSneakerSqueak(0.85);
              if (!state.ball.isInbound && hypot2(me.x - state.ball.x, me.y - state.ball.y) <= 1.55) {
                triggerUserSteal(true);
                return;
              }
              setCoachMessage("good", "🖐️", "HANDS UP!", 0.7);
              return;
            }

            if (state.ball.inFlight || state.playPhase !== "live") {
              me.contestTimer = 0.72;
              triggerJump(me, 3.45);
              SoundEngine.playSneakerSqueak(0.8);
              return;
            }

            const oppTeam = state.fullCourt ? "defense" : "offense";
            const oppArr = state.fullCourt ? state.defense : state.offense;
            const allyArr = state.fullCourt ? state.offense : state.defense;
            const holder = oppArr[state.ball.holderIdx];
            const dHolder = dist2(me, holder);
            const oppRim = getTeamTargetRim(oppTeam);
            const dHolderRim = hypot2(holder.x - oppRim.x, holder.y - oppRim.y);

            const isShotContestSituation =
              state.ball.gatherTimer > 0 ||
              (!state.fullCourt && (state.scenario === "learn_d" || state.scenario === "defense_help") && dHolder < 2.35) ||
              (isEasy && dHolder > 1.45 && dHolder <= 2.25) ||
              (dHolderRim < 3.15 && dHolder > 1.45 && dHolder <= 2.05);

            if (isShotContestSituation) {
              me.contestTimer = 0.72;
              triggerJump(me, 3.45);
              SoundEngine.playSneakerSqueak(0.9);
              const meInFrontOfShooter = (me.x - holder.x) * (oppRim.x - holder.x) + (me.y - holder.y) * (oppRim.y - holder.y) > 0;
              if (state.ball.gatherTimer > 0 && dHolder < 2.35 && meInFrontOfShooter) {
                state.ball.contestedByUser = true;
                SoundEngine.playStealOrBlock(true);
                spawnSparkles(me.x, me.y, "#22c55e", 10);
                const isDefDrill = !state.fullCourt && state.appMode === "practice";
                startShot(oppTeam, state.ball.holderIdx, isDefDrill ? false : null, false, { wasContested: true });
                return;
              }
              setCoachMessage("good", "🖐️", "HANDS UP!", 0.7);
              return;
            }

            // On-Ball Poke Steal Attempt (0.58s cooldown)!
            if (state.stealCooldown > 0) return;
            state.stealCooldown = 0.58;
            me.stealLungeTimer = 0.34;
            me.passPoseTimer = 0.24;
            me.gazeAngle = Math.atan2(holder.y - me.y, holder.x - me.x);
            me.facing = me.gazeAngle;

            let allyHelpers = 0;
            for (let a = 0; a < allyArr.length; a++) {
              if (dist2(allyArr[a], holder) < 2.15) allyHelpers++;
            }
            const drivingIntoMe = (me.x - holder.x) * holder.vx + (me.y - holder.y) * holder.vy > 0.25;

            const hRimDx = oppRim.x - holder.x;
            const hRimDy = oppRim.y - holder.y;
            const hRimLen = Math.max(0.05, Math.sqrt(hRimDx * hRimDx + hRimDy * hRimDy));
            const toMeDx = me.x - holder.x;
            const toMeDy = me.y - holder.y;
            const frontStealCos = dHolder > 1e-4 ? (toMeDx * (hRimDx / hRimLen) + toMeDy * (hRimDy / hRimLen)) / dHolder : 1.0;
            const frontStealOk = frontStealCos > 0.22 || allyHelpers >= 2 || drivingIntoMe;

            if (dHolder <= 1.45) {
              const baseStealProb = isEasy ? 0.74 : state.difficulty === "medium" ? 0.52 : 0.38;
              const bonusProb = (drivingIntoMe ? 0.2 : 0) + (allyHelpers >= 2 ? 0.22 : 0);
              const finalStealProb = !state.fullCourt && state.scenario === "learn_d" ? 1.0 : clamp(baseStealProb + bonusProb, 0.2, 0.9);

              if (frontStealOk && dHolder <= (allyHelpers >= 2 || drivingIntoMe ? 1.45 : 1.38) && Math.random() < finalStealProb) {
                triggerUserSteal(false);
                return;
              }
              holder.vx *= 0.28;
              holder.vy *= 0.28;
              spawnDust(holder.x, holder.y, 4);
              SoundEngine.playBodyBump(0.55);
              setCoachMessage("good", "⚡", "CLOSE POKE!", 0.7);
              return;
            }

            // Spammed SPACE too far (> 1.45m) -> Reach-In Lunge (gentler 0.20s on EASY)!
            const whiffDur = isEasy ? 0.2 : 0.38;
            me.reactionTimer = whiffDur;
            me.offBalanceTimer = whiffDur;
            const lungeAng = Math.atan2(holder.y - me.y, holder.x - me.x);
            me.inertiaVx = Math.cos(lungeAng) * (isEasy ? 1.6 : 2.1);
            me.inertiaVy = Math.sin(lungeAng) * (isEasy ? 1.6 : 2.1);
            spawnDust(me.x, me.y, 4);
            setCoachMessage("warn", "⚠️", "REACH IN! RECOVER!", 0.8);
            return;
          }

          // 2) Offense SPACE = Shoot at North Hoop (0, 1.575)!
          if (state.playPhase !== "live") return;

          if (state.ball.inFlight || state.ball.holderTeam !== "offense" || state.ball.holderIdx !== 0) {
            if (state.scenario !== "tutorial") {
              setCoachMessage("normal", "🟢", "GET OPEN FIRST!", 0.9);
            }
            return;
          }

          if (!state.fullCourt && state.scenario === "tutorial") {
            const tut = state.tutorial;
            if (tut.step === 4 && !tut.crossoverDone) {
