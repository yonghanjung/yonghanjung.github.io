<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex" />
    <title>HOOP KID - Spacing &amp; Defense Arcade Coach</title>
    <style>
      :root {
        --bg-arena: #0b1120;
        --bg-card: #151f32;
        --bg-strip: #1e293b;
        --bg-pill: #0f172a;
        --border-card: #2d3d59;
        --ink-bright: #f8fafc;
        --ink-muted: #94a3b8;
        --blue-main: #2563eb;
        --blue-glow: #3b82f6;
        --red-main: #dc2626;
        --red-glow: #ef4444;
        --green-main: #16a34a;
        --green-bright: #22c55e;
        --gold-main: #eab308;
        --gold-bright: #facc15;
        --orange-main: #ea580c;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 10px 14px 16px;
        font-family:
          "SF Pro Rounded",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-arena) 68%);
        color: var(--ink-bright);
        min-height: 100vh;
        user-select: none;
      }

      .app-shell {
        max-width: 1480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Top Arena Bar */
      .top-header {
        background: var(--bg-card);
        border: 2px solid var(--border-card);
        border-radius: 16px;
        padding: 8px 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      .brand-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #fb923c, #ea580c);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
        box-shadow: 0 3px 10px rgba(234, 88, 12, 0.45);
      }

      .brand-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .brand-title h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #ffffff;
      }

      .brand-tag {
        font-size: 11px;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(250, 204, 21, 0.16);
        color: var(--gold-bright);
        border: 1px solid rgba(250, 204, 21, 0.4);
      }

      .toolbar-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .btn-group {
        display: inline-flex;
        background: var(--bg-pill);
        padding: 3px;
        border-radius: 12px;
        border: 1px solid #26354d;
        gap: 3px;
        align-items: center;
      }

      button {
        font-family: inherit;
        border: none;
        background: transparent;
        color: var(--ink-muted);
        font-size: 13px;
        font-weight: 800;
        padding: 6px 11px;
        border-radius: 9px;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background 0.14s ease,
          color 0.14s ease;
        white-space: nowrap;
      }

      button:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
      }

      button:active {
        transform: scale(0.96);
      }

      button.active {
        background: #334155;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      }

      button.active-blue {
        background: linear-gradient(180deg, #3b82f6, #1d4ed8);
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(59, 130, 246, 0.45);
      }

      button.active-red {
        background: linear-gradient(180deg, #ef4444, #b91c1c);
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(239, 68, 68, 0.45);
      }

      .top-mode-group {
        background: #090f1d;
        border: 2px solid #334155;
        padding: 3px;
        border-radius: 13px;
        gap: 4px;
      }

      .top-mode-btn {
        font-size: 14px;
        font-weight: 900;
        padding: 7px 15px;
        border-radius: 10px;
        letter-spacing: 0.02em;
      }

      .top-mode-btn.active-practice {
        background: linear-gradient(180deg, #10b981, #059669);
        color: #052e16;
        box-shadow: 0 2px 12px rgba(16, 185, 129, 0.48);
      }

      .top-mode-btn.active-game {
        background: linear-gradient(180deg, #facc15, #d97706);
        color: #0f172a;
        box-shadow: 0 2px 14px rgba(250, 204, 21, 0.55);
      }

      .subbar-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
      }

      .subbar-left {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .game-type-btn {
        background: var(--bg-strip);
        color: #cbd5e1;
        border: 2px solid #334155;
        border-bottom-width: 3px;
        border-radius: 11px;
        padding: 7px 14px;
        font-size: 13.5px;
        font-weight: 900;
      }

      .game-type-btn.active {
        background: linear-gradient(180deg, #0284c7, #1d4ed8);
        border-color: #7dd3fc;
        color: #ffffff;
        box-shadow: 0 3px 12px rgba(14, 165, 233, 0.45);
      }

      .diff-btn.active[data-diff="easy"] {
        background: linear-gradient(180deg, #22c55e, #15803d);
        color: #052e16;
        box-shadow: 0 2px 8px rgba(34, 197, 94, 0.4);
      }

      .diff-btn.active[data-diff="medium"] {
        background: linear-gradient(180deg, #3b82f6, #1d4ed8);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
      }

      .diff-btn.active[data-diff="hard"] {
        background: linear-gradient(180deg, #f97316, #dc2626);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.45);
      }

      button.action-pill {
        background: var(--bg-strip);
        color: #e2e8f0;
        border: 1.5px solid #334155;
        border-bottom-width: 3px;
        padding: 6px 11px;
        border-radius: 10px;
      }

      button.action-pill.active {
        background: rgba(22, 163, 74, 0.25);
        border-color: #22c55e;
        color: #86efac;
      }

      button.action-pill.paused {
        background: rgba(234, 179, 8, 0.25);
        border-color: var(--gold-bright);
        color: #fef08a;
      }

      /* Mode Cards & Match Controls Strip */
      .control-strip {
        background: var(--bg-card);
        border: 2px solid var(--border-card);
        border-radius: 16px;
        padding: 7px 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .scenario-cards {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .scenario-btn {
        background: var(--bg-strip);
        color: #cbd5e1;
        border: 2px solid #334155;
        border-bottom-width: 3px;
        border-radius: 11px;
        padding: 7px 13px;
        font-size: 13.5px;
        font-weight: 900;
        letter-spacing: 0.01em;
      }

      .scenario-btn.learn-card {
        border-color: #ca8a04;
        color: #fde047;
      }

      .scenario-btn.learn-card.active {
        background: linear-gradient(180deg, #eab308, #ca8a04);
        border-color: #fef08a;
        color: #0f172a;
        box-shadow: 0 3px 12px rgba(234, 179, 8, 0.4);
      }

      .scenario-btn.active {
        background: linear-gradient(180deg, #f97316, #c2410c);
        border-color: #fdba74;
        color: #ffffff;
        box-shadow: 0 3px 10px rgba(249, 115, 22, 0.35);
      }

      .scenario-btn.def-drill.active {
        background: linear-gradient(180deg, #ef4444, #b91c1c);
        border-color: #fca5a5;
        color: #ffffff;
        box-shadow: 0 3px 10px rgba(239, 68, 68, 0.38);
      }

      .right-sub-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* Large Arcade LED Match Scoreboard Bar (Full-Court & Half-Court 5v5 Match) */
      .match-scoreboard {
        display: none;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        background: linear-gradient(180deg, #090f1d 0%, #111c33 100%);
        border: 2.5px solid #38bdf8;
        border-radius: 16px;
        padding: 8px 14px;
        box-shadow:
          0 8px 24px rgba(2, 132, 199, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .match-scoreboard.visible {
        display: flex;
      }

      .match-scoreboard.win-glow {
        border-color: #facc15;
        box-shadow: 0 0 24px rgba(250, 204, 21, 0.45);
      }

      .sb-team {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 5px 14px;
        border-radius: 13px;
        min-width: 158px;
      }

      .sb-team.sb-blue {
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.34) 0%, rgba(15, 23, 42, 0.92) 100%);
        border: 2px solid #3b82f6;
        justify-content: space-between;
      }

      .sb-team.sb-red {
        background: linear-gradient(270deg, rgba(220, 38, 38, 0.34) 0%, rgba(15, 23, 42, 0.92) 100%);
        border: 2px solid #ef4444;
        justify-content: space-between;
      }

      .sb-tag {
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.04em;
        color: #f8fafc;
      }

      .sb-blue .sb-tag {
        color: #93c5fd;
      }
      .sb-red .sb-tag {
        color: #fca5a5;
      }

      .sb-digits {
        font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
        font-size: 28px;
        line-height: 1;
        font-weight: 900;
        color: #ffffff;
        min-width: 38px;
        text-align: center;
        text-shadow: 0 2px 10px rgba(56, 189, 248, 0.45);
        transition:
          transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
          color 0.16s ease;
      }

      .sb-red .sb-digits {
        text-shadow: 0 2px 10px rgba(248, 113, 113, 0.45);
      }

      .sb-digits.score-pop {
        transform: scale(1.34);
        color: #fde047;
        text-shadow: 0 0 16px rgba(250, 204, 21, 0.9);
      }

      .sb-center {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .sb-vs-pill {
        background: #0f172a;
        border: 1.5px solid #334155;
        color: #fde047;
        font-size: 12px;
        font-weight: 900;
        padding: 5px 10px;
        border-radius: 999px;
        letter-spacing: 0.04em;
      }

      .target-group {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: #0f172a;
        border: 1.5px solid #334155;
        padding: 2px 4px;
        border-radius: 10px;
      }

      .target-btn {
        font-size: 11.5px;
        font-weight: 900;
        padding: 4px 9px;
        border-radius: 7px;
        color: #94a3b8;
      }

      .target-btn.active {
        background: linear-gradient(180deg, #facc15, #eab308);
        color: #0f172a;
        box-shadow: 0 1px 6px rgba(250, 204, 21, 0.45);
      }

      .sb-stats-pill {
        background: #0f172a;
        border: 1.5px solid #334155;
        border-radius: 10px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 900;
        color: #4ade80;
      }

      .sb-newgame-btn {
        background: #1e293b;
        border: 1.5px solid #475569;
        color: #e2e8f0;
        border-radius: 10px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 900;
      }

      .sb-win-btn {
        background: linear-gradient(180deg, #fde047, #eab308);
        border: 2px solid #fef08a;
        color: #0f172a;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 900;
        box-shadow: 0 0 16px rgba(250, 204, 21, 0.65);
      }

      /* Interactive 4-Step Tutorial Strip */
      .tutorial-strip {
        background: #172554;
        border: 2px solid #3b82f6;
        border-radius: 14px;
        padding: 6px 12px;
        display: none;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .tutorial-strip.visible {
        display: flex;
      }

      .tut-steps-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .tut-step-pill {
        background: #0f172a;
        border: 2px solid #334155;
        color: #94a3b8;
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 900;
      }

      .tut-step-pill.done {
        background: rgba(22, 163, 74, 0.25);
        border-color: #22c55e;
        color: #86efac;
      }

      .tut-step-pill.current {
        background: #facc15;
        border-color: #fef08a;
        color: #0f172a;
      }

      .tut-nav-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tut-nav-btn {
        background: #1e293b;
        border: 1.5px solid #475569;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 800;
      }

      .tut-grad-btn {
        background: #22c55e;
        color: #052e16;
        border-radius: 9px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 900;
      }

      /* Ultra-Clean Single-Line Kid Callout Banner */
      .coach-banner {
        background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
        border: 2.5px solid #475569;
        border-radius: 16px;
        padding: 8px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .coach-banner.tone-good {
        background: linear-gradient(90deg, #052e16 0%, #14532d 100%);
        border-color: #22c55e;
      }

      .coach-banner.tone-warn {
        background: linear-gradient(90deg, #431407 0%, #7c2d12 100%);
        border-color: #fb923c;
      }

      .coach-banner.tone-celebrate {
        background: linear-gradient(90deg, #172554 0%, #1e40af 100%);
        border-color: #facc15;
      }

      .coach-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .coach-avatar {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 25px;
        flex-shrink: 0;
      }

      .coach-main-msg {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      }

      .status-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .live-badge {
        padding: 6px 13px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 900;
        background: #0f172a;
        border: 2px solid #475569;
        color: #e2e8f0;
      }

      .live-badge.pace-walk {
        border-color: #64748b;
        color: #cbd5e1;
      }
      .live-badge.pace-hesi {
        background: #422006;
        border-color: #facc15;
        color: #fef08a;
      }
      .live-badge.pace-sprint {
        background: #431407;
        border-color: #fb923c;
        color: #fed7aa;
      }
      .live-badge.pace-cop {
        background: #052e16;
        border-color: #4ade80;
        color: #bbf7d0;
        transform: scale(1.05);
      }
      .live-badge.pace-cross {
        background: #172554;
        border-color: #38bdf8;
        color: #bae6fd;
        transform: scale(1.05);
      }

      .live-badge.space-good {
        background: #052e16;
        border-color: #22c55e;
        color: #86efac;
      }
      .live-badge.space-warn {
        background: #431407;
        border-color: #f97316;
        color: #fdba74;
      }
      .live-badge.space-block {
        background: #450a0a;
        border-color: #ef4444;
        color: #fca5a5;
      }
      .live-badge.space-ball {
        background: #172554;
        border-color: #60a5fa;
        color: #bfdbfe;
      }

      /* Dual / Single Court Stage */
      .court-stage {
        display: grid;
        grid-template-columns: 1.22fr 1fr;
        gap: 12px;
        min-height: 460px;
      }

      .court-stage.mode-a-only,
      .court-stage.mode-b-only {
        grid-template-columns: 1fr;
      }

      .court-stage.mode-a-only .panel-b {
        display: none;
      }
      .court-stage.mode-b-only .panel-a {
        display: none;
      }

      .view-card {
        background: var(--bg-card);
        border: 2px solid var(--border-card);
        border-radius: 18px;
        padding: 8px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      }

      .view-card-header {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        min-height: 30px;
        padding: 0 4px;
      }

      .cam-controls {
        display: inline-flex;
        flex-wrap: nowrap;
        align-items: center;
        gap: 2px;
        background: var(--bg-pill);
        padding: 2px 4px;
        border-radius: 10px;
        border: 1px solid #26354d;
        flex-shrink: 0;
      }

      .cam-btn {
        font-size: 10.5px;
        font-weight: 900;
        padding: 4px 6px;
        border-radius: 7px;
        color: #cbd5e1;
      }

      .cam-btn.active {
        background: linear-gradient(180deg, #38bdf8, #0284c7);
        color: #0f172a;
        box-shadow: 0 1px 6px rgba(56, 189, 248, 0.45);
      }

      .cam-btn[data-cam="fps"].active {
        background: linear-gradient(180deg, #4ade80, #16a34a);
        color: #052e16;
        box-shadow: 0 1px 9px rgba(74, 222, 128, 0.58);
      }

      .cam-btn[data-cam="auto"].active {
        background: linear-gradient(180deg, #fde047, #f59e0b);
        color: #0f172a;
        box-shadow: 0 1px 8px rgba(250, 204, 21, 0.52);
      }

      .cam-rot-btn {
        font-size: 10.5px;
        font-weight: 900;
        padding: 4px 5px;
        border-radius: 7px;
        background: #1e293b;
        color: #fde047;
        border: 1px solid #334155;
      }

      .cam-zoom-btn {
        font-size: 10.5px;
        font-weight: 900;
        padding: 4px 5px;
        border-radius: 7px;
        background: #172554;
        color: #7dd3fc;
        border: 1px solid #1d4ed8;
      }

      .fullcourt-banner {
        display: none;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .fullcourt-banner.visible {
        display: inline-flex;
      }

      .fc-dir-pill {
        background: #0f172a;
        border: 1.5px solid #334155;
        color: #cbd5e1;
        border-radius: 9px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 900;
      }

      .view-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 900;
        color: #e2e8f0;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
      }

      #viewATitleText,
      #viewBTitleText {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .view-pill {
        font-size: 10.5px;
        font-weight: 900;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(249, 115, 22, 0.2);
        color: #fdba74;
        border: 1px solid rgba(249, 115, 22, 0.45);
        flex-shrink: 0;
      }

      .view-pill.pill-b {
        background: rgba(59, 130, 246, 0.2);
        color: #93c5fd;
        border-color: rgba(59, 130, 246, 0.45);
      }

      .board-input-pill {
        display: none;
        font-size: 10.5px;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.22);
        color: #7dd3fc;
        border: 1.5px solid #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.28);
        letter-spacing: 0.3px;
        flex-shrink: 0;
      }

      .board-input-pill.visible {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .view-card.surface-active {
        border-color: #38bdf8;
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.22);
      }

      .view-legend {
        display: flex;
        gap: 10px;
        font-size: 12px;
        font-weight: 800;
        color: var(--ink-muted);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .canvas-holder {
        position: relative;
        width: 100%;
        height: clamp(448px, calc(100vh - 406px), 620px);
        border-radius: 13px;
        overflow: hidden;
        background: #090d16;
        border: 2px solid #334155;
      }

      .court-stage.mode-a-only .canvas-holder,
      .court-stage.mode-b-only .canvas-holder {
        height: clamp(480px, calc(100vh - 406px), 660px);
      }

      .app-shell:has(.match-scoreboard.visible) .canvas-holder,
      .app-shell:has(.match-scoreboard.visible) .court-stage.mode-a-only .canvas-holder,
      .app-shell:has(.match-scoreboard.visible) .court-stage.mode-b-only .canvas-holder {
        height: clamp(448px, calc(100vh - 476px), 620px);
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #canvasA {
        cursor: grab;
        touch-action: none;
      }

      #canvasA.dragging {
        cursor: grabbing;

      /* Bottom Arcade Keycap Deck (Pure Visual, Zero Long Text) */
      .bottom-bar {
        background: var(--bg-card);
        border: 2px solid var(--border-card);
        border-radius: 16px;
        padding: 9px 14px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 18px;

      .keycap-deck {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .wasd-cluster {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(2, 46px);
        gap: 5px;
      }

      .extra-keys-cluster {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .keycap-btn {
        position: relative;
        background: #1e293b;
        border: 2px solid #475569;
        border-bottom-width: 4px;
        border-radius: 11px;
        color: #f8fafc;
        font-weight: 900;
        padding: 4px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1.1;
        touch-action: none;
      }

      .keycap-btn .k-main {
        font-size: 14.5px;
        font-weight: 900;
      }

      .keycap-btn .k-sub {
        font-size: 10px;
        font-weight: 800;
        color: #94a3b8;
      }

      .keycap-btn.wide-shift {
        min-width: 96px;
        height: 50px;
      }
      .keycap-btn.wide-space {
        min-width: 128px;
        height: 50px;
        border-color: #3b82f6;
      }
      .keycap-btn.wide-call {
        min-width: 94px;
        height: 50px;
      }
      .keycap-btn.wide-view {
        min-width: 86px;
        height: 50px;
        border-color: #22c55e;
      }
      .keycap-btn.wide-view .k-sub {
        color: #86efac;
      }
      .keycap-btn.wide-call.pass-ready {
        border-color: #38bdf8;
        background: linear-gradient(180deg, #0c4a6e 0%, #0f172a 100%);
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
      }
      .keycap-btn.wide-call.pass-ready .k-sub {
        color: #7dd3fc;
      }

      @keyframes keyPulseGlow {
        0%,
        100% {
          box-shadow:
            0 0 0 3px rgba(250, 204, 21, 0.55),
            0 4px 14px rgba(234, 179, 8, 0.45);
          transform: translateY(-2px) scale(1.05);
        }
        50% {
          box-shadow:
            0 0 0 6px rgba(34, 197, 94, 0.7),
            0 6px 18px rgba(34, 197, 94, 0.5);
          transform: translateY(-4px) scale(1.09);
        }
      }

      .keycap-btn.key-glow {
        background: linear-gradient(180deg, #fef08a 0%, #facc15 100%);
        border-color: #ca8a04;
        color: #0f172a;
        animation: keyPulseGlow 0.9s infinite ease-in-out;
        z-index: 2;
      }

      .keycap-btn.key-glow .k-sub {
        color: #713f12;
      }

      .keycap-btn.key-glow::after {
        content: "PRESS!";
        position: absolute;
        top: -16px;
        left: 50%;
        transform: translateX(-50%);
        background: #22c55e;
        color: #052e16;
        font-size: 9.5px;
        font-weight: 900;
        padding: 1px 6px;
        border-radius: 999px;
        pointer-events: none;
      }

      .keycap-btn.pressed {
        background: var(--orange-main) !important;
        border-color: #fdba74 !important;
        border-bottom-width: 2px;
        color: #ffffff !important;
        transform: translateY(2px) scale(0.96) !important;
        animation: none !important;
      }

      .keycap-btn.pressed .k-sub {
        color: #ffedd5 !important;
      }

      /* Single-row header fit on 1280px laptops */
      @media (max-width: 1380px) {

      @media (max-height: 860px) and (min-width: 981px) {

          border-radius: 9px;
        }

          font-size: 17.5px;
        }
        .live-badge {
          padding: 3px 10px;
          font-size: 12px;
        }
        .court-stage {
          grid-template-columns: 1.3fr 1fr;
          gap: 8px;
          min-height: 0;
        }
        .view-card {
          padding: 5px 8px 6px;
          gap: 4px;
          border-radius: 14px;
        }
        .view-card-header {
          min-height: 26px;
        }
        .canvas-holder {
          height: clamp(360px, calc(100vh - 298px), 540px);
        }
        .court-stage.mode-a-only .canvas-holder,
        .court-stage.mode-b-only .canvas-holder {
          height: clamp(380px, calc(100vh - 294px), 560px);
        }
        .app-shell:has(.match-scoreboard.visible) .canvas-holder,
        .app-shell:has(.match-scoreboard.visible) .court-stage.mode-a-only .canvas-holder,
        .app-shell:has(.match-scoreboard.visible) .court-stage.mode-b-only .canvas-holder {
          height: clamp(360px, calc(100vh - 332px), 540px);
        }
        .bottom-bar {
          padding: 4px 10px;
          border-radius: 12px;
          gap: 12px;

          grid-template-rows: repeat(2, 29px);

        .keycap-btn {

          border-bottom-width: 3px;
          border-radius: 8px;

        .keycap-btn .k-main {

        }
        .keycap-btn .k-sub {
          font-size: 8.5px;

        .keycap-btn.wide-shift {
          min-width: 82px;
          height: 38px;
        }
        .keycap-btn.wide-space {
          min-width: 108px;
          height: 38px;
        }
        .keycap-btn.wide-call {

          height: 38px;

      @media (max-width: 1120px) {

      }

      @media (max-width: 980px) {
        body {
          padding: 6px 8px 10px;

        .court-stage.mode-b-only .canvas-holder,

        .bottom-bar {

        .keycap-btn.wide-space,

  <body>
    <div class="app-shell">
      <!-- Top Header -->
      <header class="top-header">
        <div class="brand-group">
          <div class="brand-icon" aria-hidden="true">🏀</div>
          <div class="brand-title">
            <h1>HOOP KID</h1>
            <span class="brand-tag">SPACE &amp; D</span>
          </div>
        </div>

        <div class="toolbar-row">
          <!-- Top-Level 2-Mode Switch: 🎯 PRACTICE vs 🏆 GAME -->
          <div class="btn-group top-mode-group" id="topModeGroup" role="group" aria-label="App Mode">
            <button type="button" id="btnAppPractice" class="top-mode-btn" data-topmode="practice">🎯 PRACTICE</button>
            <button type="button" id="btnAppGame" class="top-mode-btn active-game" data-topmode="game">🏆 GAME</button>
          </div>

          <div class="btn-group" role="group" aria-label="View">
            <button type="button" class="view-mode-btn active" data-view="both">📺 SPLIT</button>
            <button type="button" class="view-mode-btn" data-view="a">🎥 3D COURT</button>
            <button type="button" class="view-mode-btn" data-view="b">📋 BOARD</button>
          </div>

          <div class="btn-group" role="group" aria-label="Difficulty">
            <button type="button" class="diff-btn active" data-diff="easy">🐣 EASY</button>
            <button type="button" class="diff-btn" data-diff="medium">🏀 MEDIUM</button>
            <button type="button" class="diff-btn" data-diff="hard">🔥 HARD</button>
          </div>

          <button type="button" id="btnSoundToggle" class="action-pill active" title="Toggle Sound (M)">🔊 SOUND</button>
          <button type="button" id="btnHintToggle" class="action-pill active">💡 HINTS</button>
          <button type="button" id="btnPause" class="action-pill">⏸ PAUSE</button>
          <button type="button" id="btnReset" class="action-pill">🔄 RESET</button>
        </div>
      </header>

      <!-- Practice Drills Strip vs Game Court Mode Strip -->
      <section class="control-strip" aria-label="Drills and Game">
        <!-- A) 🏆 GAME Sub-Bar (Full-Court 5v5 vs Half-Court 5v5) -->
        <div class="subbar-row" id="gameSubBar">
          <div class="subbar-left">
            <button type="button" class="game-type-btn active" id="btnModeFullCourt" data-gametype="full_court">🏟️ FULL COURT 5v5</button>
            <button type="button" class="game-type-btn" id="btnGameHalfCourt" data-gametype="half_court">🏀 HALF COURT 5v5</button>

            <div class="fullcourt-banner visible" id="fullCourtBanner">
              <span class="fc-dir-pill" style="color: #93c5fd">🔵 YOU SCORE ▶</span>
              <span class="fc-dir-pill" style="color: #fca5a5">◀ DEFEND CPU 🔴</span>
            </div>
          </div>

          <div class="right-sub-controls" id="halfCourtFlowWrap" style="display: none">
            <div class="btn-group" id="flowGroup" role="group" aria-label="Half Court Possession">
              <button type="button" id="btnFlowTwoWay" class="active">🔄 2-WAY</button>
              <button type="button" id="btnFlowOffOnly">🏀 OFFENSE ONLY</button>
              <button type="button" id="btnFlowDefOnly">🛡️ DEFENSE ONLY</button>
            </div>
          </div>
        </div>

        <!-- B) 🎯 PRACTICE Sub-Bar (Offense 5 Drills | Defense 4 Drills + Start Spots) -->
        <div class="subbar-row" id="practiceSubBar" style="display: none">
          <div class="subbar-left">
            <div class="btn-group" role="group" aria-label="Practice Side">
              <button type="button" id="btnRoleOffense" class="active-blue" data-role="offense">🏀 OFFENSE</button>
              <button type="button" id="btnRoleDefense" data-role="defense">🛡️ DEFENSE</button>
            </div>

            <div class="scenario-cards" id="scenarioCards">
              <!-- Offense 5 Practice Cards -->
              <button type="button" class="scenario-btn learn-card" data-side="offense" data-scenario="tutorial">🎓 LEARN</button>
              <button type="button" class="scenario-btn active" data-side="offense" data-scenario="relocation">1. SPREAD</button>
              <button type="button" class="scenario-btn" data-side="offense" data-scenario="cut">2. CUT</button>
              <button type="button" class="scenario-btn" data-side="offense" data-scenario="vcut">3. V-CUT</button>
              <button type="button" class="scenario-btn" data-side="offense" data-scenario="give_go">4. GIVE &amp; GO</button>

              <!-- Defense 4 Practice Cards -->
              <button type="button" class="scenario-btn learn-card" data-side="defense" data-scenario="learn_d" style="display: none">
                🎓 LEARN D
              </button>
              <button type="button" class="scenario-btn def-drill" data-side="defense" data-scenario="def_onball" style="display: none">
                1. ON-BALL
              </button>
              <button type="button" class="scenario-btn def-drill" data-side="defense" data-scenario="defense_help" style="display: none">
                2. HELP &amp; OUT
              </button>
              <button type="button" class="scenario-btn def-drill" data-side="defense" data-scenario="def_cut" style="display: none">
                3. STOP CUT
              </button>
            </div>
          </div>

          <div class="right-sub-controls">
            <div class="btn-group" id="startSpotGroup" role="group" aria-label="Start Spot">
              <button type="button" class="spot-btn active" data-spot="left_wing">L-WING</button>
              <button type="button" class="spot-btn" data-spot="right_wing">R-WING</button>
              <button type="button" class="spot-btn" data-spot="left_corner">L-CORNER</button>
              <button type="button" class="spot-btn" data-spot="right_corner">R-CORNER</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Dedicated 🏆 GAME Mode Large Arena LED Scoreboard -->
      <section class="match-scoreboard visible" id="matchHud" aria-label="5v5 Game Scoreboard">
        <div class="sb-team sb-blue">
          <span class="sb-tag">🔵 YOU</span>
          <span class="sb-digits" id="scoreYou">0</span>
        </div>

        <div class="sb-center">
          <span class="sb-vs-pill" id="matchModeLabel">🏟️ FULL COURT 5v5</span>

          <div class="target-group" role="group" aria-label="Target Score">
            <button type="button" class="target-btn active" data-target="11">🏆 TO 11</button>
            <button type="button" class="target-btn" data-target="21">🏆 TO 21</button>
            <button type="button" class="target-btn" data-target="0">∞ FREE</button>
          </div>

          <span class="sb-stats-pill" id="scoreStops">⚡ STEALS 0 · 🛑 STOPS 0</span>
          <button type="button" class="sb-newgame-btn" id="btnNewMatch">🔄 NEW GAME</button>
          <button type="button" class="sb-win-btn" id="btnRematchWin" style="display: none">🏆 REMATCH!</button>
        </div>

        <div class="sb-team sb-red">
          <span class="sb-digits" id="scoreCpu">0</span>
          <span class="sb-tag">CPU 🔴</span>
        </div>
      </section>

      <!-- 4-Step Tutorial Progress Strip (Offense LEARN & Defense LEARN D) -->
      <section class="tutorial-strip" id="tutorialStrip" aria-label="Tutorial Steps">
        <div class="tut-steps-row">
          <button type="button" class="tut-step-pill current" id="tutPill1" data-tut-step="1">1. CROWD</button>
          <button type="button" class="tut-step-pill" id="tutPill2" data-tut-step="2">2. SPREAD</button>
          <button type="button" class="tut-step-pill" id="tutPill3" data-tut-step="3">3. PACE</button>
          <button type="button" class="tut-step-pill" id="tutPill4" data-tut-step="4">4. CROSS</button>
        </div>
        <div class="tut-nav-group">
          <button type="button" class="tut-nav-btn" id="btnTutPrev">◀ PREV</button>
          <button type="button" class="tut-nav-btn" id="btnTutNext">NEXT ▶</button>
          <button type="button" class="tut-grad-btn" id="btnTutFinishToMain" style="display: none">🏆 PLAY GAME!</button>
        </div>
      </section>

      <!-- Single-Line Big Visual Callout Banner -->
      <section class="coach-banner" id="coachBanner" aria-live="polite">
        <div class="coach-left">
          <div class="coach-avatar" id="coachEmoji">🏀</div>
          <div class="coach-main-msg" id="coachMainMsg">🟢 GO TO GREEN!</div>
        </div>

        <div class="status-badges">
          <div class="live-badge pace-walk" id="paceBadge">👀 READY</div>
          <div class="live-badge space-good" id="spaceBadge">🟢 OPEN</div>
        </div>
      </section>

      <!-- Dual / Single Court Stage -->
      <main class="court-stage" id="courtStage">
        <!-- View A: 360-Degree Articulated Youth Basketball 3D Court -->
        <section class="view-card panel-a" id="panelA" aria-label="3D Court">
          <div class="view-card-header">
            <div class="view-title">
              <span class="view-pill" id="viewAPillText">👀 FPS VIEW</span>
              <span id="viewATitleText">FPS CAM</span>
            </div>
            <div class="cam-controls" role="group" aria-label="Camera Angle">
              <button type="button" class="cam-btn active" data-cam="fps" title="FPS Eye View (V)">👀 FPS (V)</button>
              <button type="button" class="cam-btn" data-cam="auto" title="Auto Cam (V)">🎥 AUTO</button>
              <button type="button" class="cam-btn" data-cam="tv" title="Broadcast Sideline">TV</button>
              <button type="button" class="cam-btn" data-cam="iso" title="45 Diagonal">ISO</button>
              <button type="button" class="cam-btn" data-cam="behind" title="Behind Player">BEHIND</button>

              <button type="button" class="cam-rot-btn" id="btnCamLeft" title="Rotate Left (Q)">◀ Q</button>

              <button type="button" class="cam-zoom-btn" id="btnZoomOut" title="Zoom Out (-)">🔍 -</button>
              <button type="button" class="cam-zoom-btn" id="btnZoomIn" title="Zoom In (+)">+</button>
            </div>
          </div>
          <div class="canvas-holder" id="holderA">
            <canvas id="canvasA"></canvas>

        <!-- View B: Top-Down Broadcast Tactical Board -->

          <div class="view-card-header">

              <span class="board-input-pill" id="boardInputBadge">🎮 WASD</span>
            </div>
            <div class="view-legend">
              <span style="color: #60a5fa">● YOU</span>
              <span style="color: #f87171">● CPU</span>
              <span style="color: #4ade80">››› PASS</span>

          const tempTarget = current - change;
          const temp = (v0 + omega * change) * dt;
          velObj[velKey] = (v0 - omega * temp) * exp;
          let output = tempTarget + (change + temp) * exp;
          if (target - current > 0.0 === output > target) {
            output = target;
            velObj[velKey] = 0;
          }
          return output;
        }

            return wrapAngle(target);
          }
          const unwrappedTarget = current + delta;
          const next = smoothDampScalar(current, unwrappedTarget, velObj, velKey, smoothTime, maxSpeedRad, dt);

          const cy = ay + vy * t;
          const d = hypot2(px - cx, py - cy);

            out.projT = t;
            out.cx = cx;

              return null;
            }
          }

          function getNoiseBuffer(ctx) {
            try {
              if (noiseBuffer && noiseBuffer.sampleRate === ctx.sampleRate) return noiseBuffer;
              const sr = safeNum(ctx.sampleRate, 44100) || 44100;
              const len = Math.max(1024, Math.floor(sr * 0.2));
              const buf = ctx.createBuffer(1, len, sr);
              const data = buf.getChannelData(0);
              let seed = 1337;
              for (let i = 0; i < len; i++) {
                seed = (seed * 16807) % 2147483647;
                data[i] = ((seed / 2147483647) * 2.0 - 1.0) * 0.85;
              }
              noiseBuffer = buf;
              return noiseBuffer;
            } catch (_) {
              return null;
            }
          }

          function playTone(ctx, type, f0, f1, startOffset, dur, peakGain) {
            const sOff = Math.max(0, safeNum(startOffset, 0));
            const dSafe = Math.max(0.012, safeNum(dur, 0.05));
            const f0Safe = Math.max(20, safeNum(f0, 220));
            const f1Safe = safeNum(f1, 0);
            const pkSafe = clamp(safeNum(peakGain, 0.05), 0.001, 1.0);
            const t0 = safeNum(ctx.currentTime, 0) + sOff;
            const dest = ensureMasterGain(ctx);
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type || "sine";
            osc.frequency.setValueAtTime(f0Safe, t0);
            if (f1Safe > 0 && f1Safe !== f0Safe) {
              osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1Safe), t0 + dSafe);
            }
            gain.gain.setValueAtTime(0.0008, t0);
            gain.gain.linearRampToValueAtTime(pkSafe, t0 + Math.min(0.012, dSafe * 0.22));
            gain.gain.exponentialRampToValueAtTime(0.0008, t0 + dSafe);
            osc.connect(gain);
            gain.connect(dest);
            let cleaned = false;
            osc.onended = () => {
              if (cleaned) return;
              cleaned = true;
              try {
                osc.disconnect();
              } catch (_) {}
              try {
                gain.disconnect();
              } catch (_) {}
            };
            osc.start(t0);
            osc.stop(t0 + dSafe + 0.01);
            counts.totalNodes += 2;
          }

          function playFilteredNoise(ctx, fStart, fEnd, qVal, startOffset, dur, peakGain) {
            const buf = getNoiseBuffer(ctx);
            if (!buf) return;
            const sOff = Math.max(0, safeNum(startOffset, 0));
            const dSafe = Math.max(0.012, safeNum(dur, 0.05));
            const f0Safe = Math.max(80, safeNum(fStart, 600));
            const f1Safe = safeNum(fEnd, 0);
            const qSafe = Math.max(0.2, safeNum(qVal, 2.0));
            const pkSafe = clamp(safeNum(peakGain, 0.05), 0.001, 1.0);
            const t0 = safeNum(ctx.currentTime, 0) + sOff;
            const dest = ensureMasterGain(ctx);
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = "bandpass";
            filter.Q.setValueAtTime(qSafe, t0);
            filter.frequency.setValueAtTime(f0Safe, t0);
            if (f1Safe > 0 && f1Safe !== f0Safe) {
              filter.frequency.exponentialRampToValueAtTime(Math.max(80, f1Safe), t0 + dSafe);
            }
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.0008, t0);
            gain.gain.linearRampToValueAtTime(pkSafe, t0 + Math.min(0.024, dSafe * 0.25));
            gain.gain.exponentialRampToValueAtTime(0.0008, t0 + dSafe);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(dest);
            let cleaned = false;
            src.onended = () => {
              if (cleaned) return;
              cleaned = true;
              try {
                src.disconnect();
              } catch (_) {}
              try {
                filter.disconnect();
              } catch (_) {}
              try {
                gain.disconnect();
              } catch (_) {}
            };
            src.start(t0);
            src.stop(t0 + dSafe + 0.01);
            counts.totalNodes += 3;
          }

          return {
            counts,
            get masterGain() {
              return masterGain;
            },
            unlock() {
              const ctx = ensureContext(true);
              if (ctx) {
                if (masterGain) {
                  try {
                    masterGain.gain.setValueAtTime(state.soundEnabled ? 1.0 : 0.0, safeNum(ctx.currentTime, 0));
                  } catch (_) {}
                }
                getNoiseBuffer(ctx);
              }
            },
            setMuted(isMuted) {
              if (audioCtx && masterGain) {
                try {
                  masterGain.gain.setValueAtTime(isMuted ? 0.0 : 1.0, safeNum(audioCtx.currentTime, 0));
                } catch (_) {}
              }
            },
            setCustomAudioContextClass(Ctor) {
              if (masterGain) {
                try {
                  masterGain.disconnect();
                } catch (_) {}
              }
              customCtxCtor = Ctor || null;
              audioCtx = null;
              masterGain = null;
              noiseBuffer = null;
              lastDribbleSim = -10;
              lastSqueakSim = -10;
              lastBumpSim = -10;
              lastChimeSim = -10;
            },
            resetCounts() {
              counts.dribble = 0;
              counts.squeak = 0;
              counts.pass = 0;
              counts.catch = 0;
              counts.swish = 0;
              counts.clank = 0;
              counts.steal = 0;
              counts.whistle = 0;
              counts.bump = 0;
              counts.totalNodes = 0;
              lastDribbleSim = -10;
              lastSqueakSim = -10;
              lastBumpSim = -10;
              lastChimeSim = -10;
            },
            playDribbleBounce(intensity) {
              if (!state.soundEnabled) return false;
              if (state.simTime >= lastDribbleSim && state.simTime - lastDribbleSim < 0.08) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                lastDribbleSim = state.simTime;
                const vol = clamp(safeNum(intensity, 1.0), 0.45, 1.25);
                playTone(ctx, "sine", 96, 48, 0, 0.095, 0.14 * vol);
                playTone(ctx, "triangle", 235, 92, 0, 0.028, 0.055 * vol);
                counts.dribble += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
            playSneakerSqueak(intensity) {
              if (!state.soundEnabled) return false;
              if (state.simTime >= lastSqueakSim && state.simTime - lastSqueakSim < 0.11) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                lastSqueakSim = state.simTime;
                const vol = clamp(safeNum(intensity, 1.0), 0.5, 1.2);
                playTone(ctx, "sine", 2180, 2760, 0, 0.042, 0.048 * vol);
                playTone(ctx, "sine", 2740, 2260, 0.032, 0.038, 0.036 * vol);
                counts.squeak += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
            playOopsChime() {
              if (!state.soundEnabled) return false;
              if (state.simTime >= lastChimeSim && state.simTime - lastChimeSim < 0.18) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                lastChimeSim = state.simTime;
                playTone(ctx, "triangle", 587.33, 783.99, 0, 0.085, 0.085);
                playTone(ctx, "triangle", 783.99, 1046.5, 0.055, 0.11, 0.09);
                return true;
              } catch (_) {
                return false;
              }
            },
            playPassZip() {
              if (!state.soundEnabled) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                playFilteredNoise(ctx, 680, 1420, 2.4, 0, 0.085, 0.065);
                playTone(ctx, "triangle", 148, 82, 0, 0.052, 0.075);
                counts.pass += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
            playCatchPop() {
              if (!state.soundEnabled) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                playTone(ctx, "sine", 168, 72, 0, 0.055, 0.11);
                playFilteredNoise(ctx, 950, 520, 3.0, 0, 0.035, 0.04);
                counts.catch += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
            playNetSwish(points, isAssist) {
              if (!state.soundEnabled) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                playFilteredNoise(ctx, 2100, 760, 2.1, 0, 0.19, 0.12);
                if (points === 3 || isAssist) {
                  for (let i = 0; i < SWISH_CHORD_NOTES.length; i++) {
                    const n = SWISH_CHORD_NOTES[i];
                    playTone(ctx, "triangle", n, n, 0.035 + i * 0.052, 0.14, 0.085);
                  }
                } else {
                  playTone(ctx, "triangle", 523.25, 523.25, 0.035, 0.13, 0.085);
                  playTone(ctx, "triangle", 783.99, 783.99, 0.09, 0.16, 0.095);
                }
                counts.swish += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
            playRimClank(volScale) {
              if (!state.soundEnabled) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                const v = clamp(safeNum(volScale, 1.0), 0.35, 1.2);
                playTone(ctx, "triangle", 324, 276, 0, 0.135, 0.115 * v);
                playTone(ctx, "sine", 748, 692, 0, 0.095, 0.055 * v);
                playTone(ctx, "sine", 96, 52, 0.01, 0.09, 0.09 * v);
                counts.clank += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
            playBodyBump(intensity) {
              if (!state.soundEnabled) return false;
              if (state.simTime >= lastBumpSim && state.simTime - lastBumpSim < 0.24) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                lastBumpSim = state.simTime;
                const vol = clamp(safeNum(intensity, 1.0), 0.45, 1.25);
                playTone(ctx, "triangle", 95, 46, 0, 0.095, 0.125 * vol);
                playTone(ctx, "sine", 78, 42, 0.006, 0.105, 0.11 * vol);
                playFilteredNoise(ctx, 280, 175, 1.8, 0, 0.065, 0.06 * vol);
                counts.bump += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
            playStealOrBlock(isPositive) {
              if (!state.soundEnabled) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                playFilteredNoise(ctx, 1350, 720, 2.8, 0, 0.05, 0.075);
                playTone(ctx, "triangle", 195, 84, 0, 0.065, 0.11);
                if (isPositive !== false) {
                  playTone(ctx, "triangle", 659.25, 659.25, 0.03, 0.09, 0.075);
                  playTone(ctx, "triangle", 880.0, 880.0, 0.085, 0.13, 0.085);
                } else {
                  playTone(ctx, "sawtooth", 330.0, 220.0, 0.03, 0.14, 0.055);
                }
                counts.steal += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
            playWhistle(isWin) {
              if (!state.soundEnabled) return false;
              try {
                const ctx = ensureContext(false);
                if (!ctx) return false;
                if (isWin) {
                  for (let i = 0; i < SWISH_CHORD_NOTES.length; i++) {
                    const n = SWISH_CHORD_NOTES[i];
                    playTone(ctx, "triangle", n, n, i * 0.075, 0.24, 0.095);
                  }
                } else {
                  playTone(ctx, "sine", 2780, 2720, 0, 0.19, 0.055);
                  playTone(ctx, "sine", 2915, 2855, 0.015, 0.18, 0.045);
                }
                counts.whistle += 1;
                return true;
              } catch (_) {
                return false;
              }
            },
          };
        })();

        function toggleSound(forceVal) {
          state.soundEnabled = typeof forceVal === "boolean" ? forceVal : !state.soundEnabled;
          SoundEngine.setMuted(!state.soundEnabled);
          if (state.soundEnabled) SoundEngine.unlock();
          syncAllDOM();
        }

        const COACH_TONE_PRIO = { normal: 0, warn: 1, good: 2, celebrate: 3 };

        function setCoachMessage(tone, emoji, main, lockSec) {
          const prevPrio = COACH_TONE_PRIO[state.coach.tone] || 0;
          const nextPrio = COACH_TONE_PRIO[tone] || 0;
          if (state.coach.lockTimer > 0) {
            if (!lockSec && tone !== "celebrate") return;
            if (nextPrio < prevPrio) return;
          }
          state.coach.tone = tone;
          state.coach.emoji = emoji;
          state.coach.main = main;
          if (lockSec && lockSec > 0) {
            state.coach.lockTimer = nextPrio > prevPrio ? lockSec : Math.max(state.coach.lockTimer, lockSec);
          }
          syncCoachDOM();
        }

        /* =====================================================================
         * 4. Player Builder & Scenario / Tutorial / Match Initialization
         * ===================================================================== */
        function makePlayer(id, name, number, x, y, team) {
          const hairPalette = ["#18181b", "#451a03", "#78350f", "#0f172a", "#7c2d12"];
          const skinPalette = [
            { light: "#fbd3a7", mid: "#f1ba80", dark: "#c98a4b" },
            { light: "#eab688", mid: "#d49966", dark: "#a66d3f" },
            { light: "#f6c89a", mid: "#e2a872", dark: "#b87b45" },
            { light: "#c68b59", mid: "#a46b3d", dark: "#784925" },
            { light: "#f4c493", mid: "#dda26b", dark: "#b37640" },
          ];
          const skin = skinPalette[(id + (team === "defense" ? 2 : 0)) % skinPalette.length];
          return {
            id,
            name,
            number,
            team,
            x,
            y,
            vx: 0,
            vy: 0,
            homeX: x,
            homeY: y,
            gazeAngle: team === "offense" ? -Math.PI * 0.5 : Math.PI * 0.5,
            facing: team === "offense" ? -Math.PI * 0.5 : Math.PI * 0.5,
            ballWatchFactor: 0.25,
            reactionTimer: 0,
            offBalanceTimer: 0,
            inertiaVx: 0,
            inertiaVy: 0,
            paceAdapt: 0,
            contestTimer: 0,
            shootFollowTimer: 0,
            passPoseTimer: 0,
            stealLungeTimer: 0,
            contactTimer: 0,
            contactDirX: 0,
            contactDirY: 0,
            boxOutTimer: 0,
            reboundAttemptTimer: 0,
            reboundReachTimer: 0,
            swimSign: id % 2 === 0 ? 1 : -1,
            layupMode: false,
            dribbleHand: 1,
            jumpZ: 0,
            jumpVz: 0,
            stridePhase: id * 1.15,
            crouch: 0,
            animState: "idle",
            hairStyle: id % 4,
            hairColor: hairPalette[id % hairPalette.length],
            skinLight: skin.light,
            skinMid: skin.mid,
            skinDark: skin.dark,
          };
        }

        function triggerJump(player, upVel) {
          if (player.jumpZ <= 0.02) {
            player.jumpVz = upVel || 3.8;
          }
        }

        function setupOffenseTutorialStep(stepNum, subMode) {
          const tut = state.tutorial;
          tut.step = stepNum;
          tut.timer = 0;
          tut.advanceTimer = 0;
          tut.nextStepAfterAdvance = 0;
          tut.walkHoldTimer = 0;
          tut.sprintHoldTimer = 0;
          tut.copSucceeded = false;
          tut.movedSide = 0;
          tut.sideHoldTimer = 0;
          tut.crossoverDone = false;
          tut.highlightKeys = [];

          let mePos = { x: -5.2, y: 6.2 };
          let pgPos = { x: -1.3, y: 6.2 };

          if (stepNum === 1) {
            tut.subPhase = "go_crowd";
            mePos = { x: -5.2, y: 6.2 };
            pgPos = { x: -1.3, y: 6.2 };
          } else if (stepNum === 2) {
            tut.subPhase = "spread_out";
            mePos = { x: -2.1, y: 6.2 };
            pgPos = { x: -0.9, y: 7.4 };
          } else if (stepNum === 3) {
            tut.subPhase = subMode || "3a_constant";
            mePos = { x: -5.3, y: 7.1 };
            pgPos = { x: -1.6, y: 8.4 };
          } else {
            tut.subPhase = "get_ball";
            mePos = { x: -5.5, y: 6.4 };
            pgPos = { x: -1.4, y: 8.2 };
          }

          state.offense = [
            makePlayer(0, "YOU", 7, mePos.x, mePos.y, "offense"),
            makePlayer(1, "PG", 1, pgPos.x, pgPos.y, "offense"),
            makePlayer(2, "PF", 2, 2.4, 8.8, "offense"),
            makePlayer(3, "SF", 3, 5.65, 6.15, "offense"),
            makePlayer(4, "SG", 4, 6.55, 2.15, "offense"),
          ];

          state.defense = state.offense.map((off, idx) => {
            const toRimX = COURT.rimX - off.x;
            const toRimY = COURT.rimY - off.y;
            const len = Math.max(0.01, hypot2(toRimX, toRimY));
            let dx = off.x + (toRimX / len) * 1.15;
            let dy = off.y + (toRimY / len) * 1.15;
            if (idx === 0 && stepNum === 3) {
              dx = off.x + 0.55;
              dy = off.y - 0.55;
            }
            return makePlayer(idx, "D" + (idx + 1), idx + 1, dx, dy, "defense");
          });

          state.ball.holderTeam = "offense";
          state.ball.holderIdx = 1;
          state.ball.inFlight = false;
          state.ball.flightType = "none";
          state.ball.x = pgPos.x;
          state.ball.y = pgPos.y;
          state.ball.z = 1.1;
          state.ball.gatherTimer = 0;
          state.ball.trail = [];
          state.playPhase = "live";
          state.phaseTimer = 0;
          state.coach.lockTimer = 0;

          if (stepNum === 1) setCoachMessage("normal", "🎓", "GO NEAR #1!", 0);
          else if (stepNum === 2) setCoachMessage("normal", "🟢", "SPREAD TO GREEN!", 0);
          else if (stepNum === 3 && tut.subPhase === "3a_constant") setCoachMessage("normal", "⚡", "HOLD SHIFT + W!", 0);
          else if (stepNum === 3) setCoachMessage("good", "🐢", "WALK SLOW (W)!", 0);
          else setCoachMessage("normal", "🟢", "GET THE PASS!", 0);
        }

        function setupDefenseTutorialStep(stepNum) {
          const tut = state.tutorial;
          tut.step = stepNum;
          tut.timer = 0;
          tut.advanceTimer = 0;
          tut.nextStepAfterAdvance = 0;
          tut.walkHoldTimer = 0;
          tut.sprintHoldTimer = 0;
          tut.copSucceeded = false;
          tut.movedSide = 0;
          tut.sideHoldTimer = 0;
          tut.crossoverDone = false;
          tut.highlightKeys = [];

          if (stepNum === 1) {
            // Step 1: Slide A/D in front of dribbler
            tut.subPhase = "slide";
            state.offense = [
              makePlayer(0, "O1", 1, 0.0, 8.1, "offense"),
              makePlayer(1, "O2", 2, -5.65, 6.15, "offense"),

              makePlayer(4, "O5", 5, 6.55, 2.15, "offense"),

              makePlayer(1, "O2", 2, -5.65, 6.15, "offense"),

            ];
            state.ball.holderIdx = 0;
          } else {
            // Step 3 (Help Triangle) & Step 4 (Closeout)
            tut.subPhase = stepNum === 3 ? "go_help" : "wait_kickout";
            const ballStartX = stepNum === 4 ? 0.6 : 4.8;
            const ballStartY = stepNum === 4 ? 8.3 : 6.8;
            state.offense = [
              makePlayer(0, "MAN", 2, -5.65, 6.0, "offense"),
              makePlayer(1, "BALL", 1, ballStartX, ballStartY, "offense"),
              makePlayer(2, "O3", 3, 4.8, 6.8, "offense"),
              makePlayer(3, "O4", 4, -6.55, 2.15, "offense"),
              makePlayer(4, "O5", 5, 6.55, 2.15, "offense"),
            ];
            state.ball.holderIdx = 1;
          }

          state.defense = state.offense.map((off, idx) => {
            const toRimX = COURT.rimX - off.x;
            const toRimY = COURT.rimY - off.y;
            const len = Math.max(0.01, hypot2(toRimX, toRimY));
            let dx = off.x + (toRimX / len) * 1.15;
            let dy = off.y + (toRimY / len) * 1.15;
            if (idx === 0 && stepNum === 1) {
              dx = 0.0;
              dy = 6.85;
            } else if (idx === 0 && stepNum === 2) {
              dx = 0.0;
              dy = 5.55;
            } else if (idx === 0 && stepNum === 3) {
              dx = -4.9;
              dy = 5.6;
            } else if (idx === 0 && stepNum === 4) {
              dx = -1.8;
              dy = 4.1;
            }
            return makePlayer(idx, idx === 0 ? "YOU" : "D" + (idx + 1), idx === 0 ? 7 : idx + 1, dx, dy, "defense");
          });

          const holder = state.offense[state.ball.holderIdx];
          state.ball.holderTeam = "offense";
          state.ball.inFlight = false;
          state.ball.flightType = "none";
          state.ball.x = holder.x;
          state.ball.y = holder.y;
          state.ball.z = 1.1;
          state.ball.gatherTimer = 0;
          state.ball.contestedByUser = false;
          state.ball.trail = [];
          state.playPhase = "live";
          state.phaseTimer = 0;
          state.coach.lockTimer = 0;

          if (stepNum === 1) setCoachMessage("normal", "🛡️", "SLIDE IN FRONT!", 0);
          else if (stepNum === 2) setCoachMessage("normal", "🖐️", "WAIT... HANDS UP!", 0);
          else if (stepNum === 3) setCoachMessage("normal", "🔺", "GO TO HELP SPOT!", 0);
          else setCoachMessage("normal", "🏃", "READY TO CLOSEOUT!", 0);
        }

        function getDiffProfile() {
          return DIFFICULTY_PROFILES[state.difficulty] || DIFFICULTY_PROFILES.easy;
        }

        function getCourtLength() {
          return state.fullCourt ? COURT.fullLength : COURT.length;
        }

        function getTeamTargetRim(team) {
          if (!state.fullCourt) {
            return { x: COURT.rimX, y: COURT.rimY, z: COURT.rimZ, sign: 1 };
          }
          if (team === "defense") {
            return { x: COURT.rimX, y: COURT.southRimY, z: COURT.rimZ, sign: -1 };
          }
          return { x: COURT.rimX, y: COURT.rimY, z: COURT.rimZ, sign: 1 };
        }

        function isUserOnDefenseNow() {
          if (!state.fullCourt) {
            return state.role === "defense";
          }
          if (state.ball.loose) return false;
          if (state.ball.inFlight) {
            return state.ball.flightType === "pass" ? state.ball.passTeam === "defense" : state.ball.shooterTeam === "defense";
          }
          return state.ball.holderTeam === "defense";
        }

        function buildFullCourtFormation() {
          // Blue (offense array) attacks North Hoop (y = 1.575); Red (defense array) attacks South Hoop (y = 26.425)
          state.offense = [

        function buildFormation() {
          if (state.fullCourt) {
            buildFullCourtFormation();

          if (state.scenario === "tutorial") {
            setupOffenseTutorialStep(state.tutorial.step);
            return;
          }
          if (state.scenario === "learn_d") {
            setupDefenseTutorialStep(state.tutorial.step);
            return;
          }

          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;

          // Special 1v1 On-Ball Defense formation: matchup #0 is the top ball-handler!
          if (state.scenario === "def_onball") {
            state.offense = [
              makePlayer(0, "BALL", 1, 0.0, 8.35, "offense"),
              makePlayer(1, "O2", 2, -5.75, 6.15, "offense"),
              makePlayer(2, "O3", 3, 5.75, 6.15, "offense"),
              makePlayer(3, "O4", 4, -6.55, 2.15, "offense"),
              makePlayer(4, "O5", 5, 6.55, 2.15, "offense"),
            ];
            state.defense = state.offense.map((off, idx) => {
              const toRimX = COURT.rimX - off.x;
              const toRimY = COURT.rimY - off.y;
              const len = Math.max(0.01, hypot2(toRimX, toRimY));
              const dx = idx === 0 ? 0.0 : off.x + (toRimX / len) * 1.2;
              const dy = idx === 0 ? 6.8 : off.y + (toRimY / len) * 1.2;
              return makePlayer(idx, idx === 0 ? "YOU" : "D" + (idx + 1), idx === 0 ? 7 : idx + 1, dx, dy, "defense");
            });
            return;
          }

          const slots = {
            top: { x: 0.0, y: 8.85 },
            sameWing: { x: side * 5.65, y: 6.15 },
            sameCorner: { x: side * 6.55, y: 2.15 },
            oppWing: { x: -side * 5.65, y: 6.15 },
            oppCorner: { x: -side * 6.55, y: 2.15 },
          };

          const meStart = { x: spot.x, y: spot.y };
          const mateSlot1 = { x: slots.top.x, y: slots.top.y };
          const mateSlot2 = spot.zone === "wing" ? { x: slots.sameCorner.x, y: slots.sameCorner.y } : { x: slots.sameWing.x, y: slots.sameWing.y };
          const mateSlot3 = { x: slots.oppWing.x, y: slots.oppWing.y };
          const mateSlot4 = { x: slots.oppCorner.x, y: slots.oppCorner.y };

          if (state.scenario === "relocation") {
            mateSlot2.x = -side * 2.8;
            mateSlot2.y = 2.05;
          } else if (state.scenario === "cut" || state.scenario === "def_cut") {
            mateSlot1.x = side * 2.1;
            mateSlot1.y = 8.35;
            mateSlot2.x = -side * 1.9;
            mateSlot2.y = 8.85;

            mateSlot1.x = side * 1.5;
            mateSlot1.y = 8.55;
            mateSlot2.x = -side * 2.1;
            mateSlot2.y = 8.85;
          } else if (state.scenario === "give_go") {
            if (spot.zone === "wing") {
              meStart.x = side * 1.75;
              meStart.y = 8.25;
              mateSlot1.x = side * 5.55;
              mateSlot1.y = 5.75;
            } else {
              meStart.x = side * 5.45;
              meStart.y = 6.25;
              mateSlot1.x = side * 6.45;
              mateSlot1.y = 2.35;
            }
            mateSlot2.x = -side * 2.35;
            mateSlot2.y = 8.65;
            mateSlot3.x = -side * 5.75;
            mateSlot3.y = 5.95;
            mateSlot4.x = -side * 6.55;
            mateSlot4.y = 2.15;
          }

          const isOffRole = state.role === "offense";
          state.offense = [
            makePlayer(0, isOffRole ? "YOU" : "MAN", isOffRole ? 7 : 2, meStart.x, meStart.y, "offense"),
            makePlayer(1, "PG", 1, mateSlot1.x, mateSlot1.y, "offense"),
            makePlayer(2, "PF", isOffRole ? 2 : 3, mateSlot2.x, mateSlot2.y, "offense"),
            makePlayer(3, "SF", isOffRole ? 3 : 4, mateSlot3.x, mateSlot3.y, "offense"),
            makePlayer(4, "SG", isOffRole ? 4 : 5, mateSlot4.x, mateSlot4.y, "offense"),
          ];

          state.defense = state.offense.map((off, idx) => {
            const toRimX = COURT.rimX - off.x;
            const toRimY = COURT.rimY - off.y;
            const len = Math.max(0.01, hypot2(toRimX, toRimY));
            const cushion = idx === 0 ? 1.05 : 1.25;
            let dx = off.x + (toRimX / len) * cushion;
            let dy = off.y + (toRimY / len) * cushion;

            if (idx === 0 && state.scenario === "vcut") {
              const ballRef = state.offense[1];
              dx = lerp(off.x, ballRef.x, 0.22);
              dy = lerp(off.y, ballRef.y, 0.22);
            } else if (idx === 0 && state.scenario === "cut") {
              dx = off.x + -side * 0.45;
              dy = off.y + 0.55;
            } else if (idx === 0 && state.scenario === "give_go") {
              dx = off.x + (toRimX / len) * 1.15;
              dy = off.y + (toRimY / len) * 1.15;
            } else if (idx === 1 && state.scenario === "give_go") {
              dx = off.x + (toRimX / len) * 1.45;
              dy = off.y + (toRimY / len) * 1.45;
            } else if (idx === 0 && state.scenario === "defense_help") {
              dx = lerp(off.x, 0, 0.35);
              dy = lerp(off.y, COURT.rimY + 1.5, 0.35);
            } else if (idx === 0 && state.scenario === "def_cut") {
              dx = off.x + -side * 0.35;
              dy = off.y + 0.35;
            }

            return makePlayer(
              idx,
              idx === 0 && state.role === "defense" ? "YOU" : "D" + (idx + 1),
              idx === 0 && state.role === "defense" ? 7 : idx + 1,
              dx,
              dy,
              "defense"
