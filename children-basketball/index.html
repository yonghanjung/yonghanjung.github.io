              drawTaperedCapsule2D(ctx, hip, knee, mPx * 0.082, mPx * 0.064, skinMain, skinHi, inkCol, inkW);
              // Loose Basketball Short Leg + Outer Side Trim Stripe
              drawTaperedCapsule2D(ctx, hip, shortHem, mPx * 0.118, mPx * 0.106, shortsMain, shortsShade, inkCol, inkW);
              const outSign = hip.x >= S.pelvis.x ? 1 : -1;
              ctx.strokeStyle = trimCol;
              ctx.lineWidth = Math.max(1.2, mPx * 0.042);
              ctx.beginPath();
              ctx.moveTo(hip.x + outSign * mPx * 0.06, hip.y);
              ctx.lineTo(shortHem.x + outSign * mPx * 0.06, shortHem.y);
              ctx.stroke();

              // Upper Calf (skin) + Athletic White Crew Sock (lower shin)
              drawTaperedCapsule2D(ctx, knee, sockMid, mPx * 0.062, mPx * 0.052, skinMain, skinHi, inkCol, inkW);
              drawTaperedCapsule2D(ctx, sockMid, ankle, mPx * 0.055, mPx * 0.048, "#f8fafc", jerseyHi, inkCol, inkW);

              // Sculpted Youth Basketball Sneaker (Team Upper + Crisp White Midsole + Toe Cap)
              drawTaperedCapsule2D(ctx, ankle, toe, mPx * 0.064, mPx * 0.056, shoeCol, jerseyHi, inkCol, inkW);
              ctx.strokeStyle = "#ffffff";
              ctx.lineWidth = Math.max(1.3, mPx * 0.048);
              ctx.beginPath();
              ctx.moveTo(ankle.x, ankle.y + mPx * 0.032);
              ctx.lineTo(toe.x, toe.y + mPx * 0.028);
              ctx.stroke();
            };
          };

          // Helper: Draw One 2-Joint Arm (Shoulder -> Elbow -> Wristband -> Expressive Hand)
          const makeArmDrawer = (isRight) => {
            const sh = isRight ? S.R_shoulder : S.L_shoulder;
            const el = isRight ? S.R_elbow : S.L_elbow;
            const hd = isRight ? S.R_hand : S.L_hand;
            const wristBand = { x: lerp(el.x, hd.x, 0.78), y: lerp(el.y, hd.y, 0.78) };

            return () => {
              drawTaperedCapsule2D(ctx, sh, el, mPx * 0.058, mPx * 0.048, skinMain, skinHi, inkCol, inkW);
              drawTaperedCapsule2D(ctx, el, hd, mPx * 0.048, mPx * 0.04, skinMain, skinHi, inkCol, inkW);

              // Sweatband on wrist
              ctx.strokeStyle = trimCol;
              ctx.lineWidth = Math.max(1.6, mPx * 0.055);
              ctx.beginPath();
              ctx.moveTo(wristBand.x, wristBand.y);
              ctx.lineTo(lerp(el.x, hd.x, 0.88), lerp(el.y, hd.y, 0.88));
              ctx.stroke();

              // Hand / Palm (+ Gooseneck snapped fingers on jumpshot!)
              const handR = Math.max(2.1, mPx * 0.05);
              ctx.fillStyle = skinHi;
              ctx.strokeStyle = inkCol;
              ctx.lineWidth = inkW * 0.9;
              ctx.beginPath();
              ctx.arc(hd.x, hd.y, handR, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();

              if (isRight && rig.gooseneckR) {
                ctx.strokeStyle = skinMain;
                ctx.lineWidth = Math.max(1.5, mPx * 0.038);
                ctx.beginPath();
                ctx.moveTo(hd.x, hd.y);
                ctx.lineTo(hd.x + sideDot * mPx * 0.06, hd.y + mPx * 0.065);
                ctx.stroke();
              }
            };
          };

          // Helper: Draw Athletic Sleeveless Torso Jersey + Shorts Waistband + #Number
          const drawTorsoAndShorts = () => {
            // Pelvis / Shorts Hip Bridge
            drawTaperedCapsule2D(ctx, S.L_hip, S.R_hip, mPx * 0.105, mPx * 0.105, shortsMain, shortsShade, inkCol, inkW);

            // Screen-Sorted Left/Right Shoulders (prevents bowtie twist when frontDot > 0!)
            const leftIsL = S.L_shoulder.x <= S.R_shoulder.x;
            let shLeftX = leftIsL ? S.L_shoulder.x : S.R_shoulder.x;
            let shLeftY = leftIsL ? S.L_shoulder.y : S.R_shoulder.y;
            let shRightX = leftIsL ? S.R_shoulder.x : S.L_shoulder.x;
            let shRightY = leftIsL ? S.R_shoulder.y : S.L_shoulder.y;

            const minTorsoHalfW = mPx * 0.135;
            if (shRightX - shLeftX < minTorsoHalfW * 2) {
              // Side profile view: preserve realistic chest thickness around shoulderCenter!
              const midShY = (shLeftY + shRightY) * 0.5;
              shLeftX = S.shoulderCenter.x - minTorsoHalfW;
              shRightX = S.shoulderCenter.x + minTorsoHalfW;
              shLeftY = midShY;
              shRightY = midShY;
            }

            const spanPx = shRightX - shLeftX;
            const hipHalfPx = Math.max(mPx * 0.115, spanPx * 0.38);
            const lWaistX = S.pelvis.x - hipHalfPx;
            const rWaistX = S.pelvis.x + hipHalfPx;
            const waistY = S.pelvis.y + mPx * 0.02;

            ctx.beginPath();
            ctx.moveTo(shLeftX, shLeftY);
            ctx.lineTo(shRightX, shRightY);
            ctx.lineTo(rWaistX, waistY);
            ctx.lineTo(lWaistX, waistY);
            ctx.closePath();
            ctx.fillStyle = jerseyMain;
            ctx.fill();

            // Directional Side Shade Panel Strictly Inside Jersey Silhouette (lerp 0.52..1.0)
            ctx.fillStyle = jerseyShade;
            ctx.beginPath();
            ctx.moveTo(lerp(shLeftX, shRightX, 0.52), lerp(shLeftY, shRightY, 0.52));
            ctx.lineTo(shRightX, shRightY);
            ctx.lineTo(rWaistX, waistY);
            ctx.lineTo(lerp(lWaistX, rWaistX, 0.52), waistY);
            ctx.closePath();
            ctx.fill();

            // Crisp V-Neck / Round Collar Trim & Waistband Stripe
            ctx.strokeStyle = trimCol;
            ctx.lineWidth = Math.max(1.4, mPx * 0.048);
            ctx.beginPath();
            ctx.moveTo(lerp(shLeftX, shRightX, 0.28), lerp(shLeftY, shRightY, 0.28) + mPx * 0.01);
            ctx.lineTo(lerp(shLeftX, shRightX, 0.5), lerp(shLeftY, shRightY, 0.5) + (frontDot > 0 ? mPx * 0.075 : mPx * 0.035));
            ctx.lineTo(lerp(shLeftX, shRightX, 0.72), lerp(shLeftY, shRightY, 0.72) + mPx * 0.01);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(lWaistX, waistY);
            ctx.lineTo(rWaistX, waistY);
            ctx.stroke();

            // Jersey Outer Contrast Rim Halo + Crisp Ink Outline
            ctx.beginPath();
            ctx.moveTo(shLeftX, shLeftY);
            ctx.lineTo(shRightX, shRightY);
            ctx.lineTo(rWaistX, waistY);
            ctx.lineTo(lWaistX, waistY);
            ctx.closePath();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.32)";
            ctx.lineWidth = inkW + 1.6;
            ctx.stroke();
            ctx.strokeStyle = inkCol;
            ctx.lineWidth = inkW;
            ctx.stroke();

            // Perspective-Foreshortened Larger Jersey Number (#7 for ★ YOU, #1..#5 for others) on Chest AND Back!
            const visFace = Math.abs(frontDot);
            if (visFace > 0.2 && mPx >= 18) {
              const numCx = (S.shoulderCenter.x + S.pelvis.x) * 0.5;
              const numCy = lerp(S.shoulderCenter.y, waistY, 0.57);
              ctx.save();
              ctx.translate(numCx, numCy);
              ctx.scale(clamp(visFace, 0.45, 1.0), 1.0);
              ctx.font = "900 " + Math.max(10, Math.round(mPx * 0.32)) + 'px "SF Pro Rounded", sans-serif';
              ctx.textAlign = "center";
              ctx.strokeStyle = "#0f172a";
              ctx.lineWidth = 2.8;
              ctx.strokeText(String(p.number), 0, mPx * 0.085);
              ctx.fillStyle = isMe ? "#fef08a" : "#ffffff";
              ctx.fillText(String(p.number), 0, mPx * 0.085);
              ctx.restore();
            }
          };

          // Helper: Draw Neck, 5.2-Head-Ratio Ellipsoidal Youth Head, Face, Hair & ★ YOU Fluttering Ribbons!
          const drawHeadAndHair = () => {
            const drawRibbonTails = () => {
              if (!isMe) return;
              ctx.save();
              ctx.lineCap = "round";
              ctx.strokeStyle = "#0f172a";
              ctx.lineWidth = Math.max(2.6, mPx * 0.095);
              ctx.beginPath();
              ctx.moveTo(S.ribbonKnot.x, S.ribbonKnot.y);
              ctx.lineTo(S.ribbonTipL.x, S.ribbonTipL.y);
              ctx.moveTo(S.ribbonKnot.x, S.ribbonKnot.y);
              ctx.lineTo(S.ribbonTipR.x, S.ribbonTipR.y);
              ctx.stroke();

              ctx.strokeStyle = "#facc15";
              ctx.lineWidth = Math.max(1.5, mPx * 0.055);
              ctx.beginPath();
              ctx.moveTo(S.ribbonKnot.x, S.ribbonKnot.y);
              ctx.lineTo(S.ribbonTipL.x, S.ribbonTipL.y);
              ctx.stroke();
              ctx.strokeStyle = "#eab308";
              ctx.beginPath();
              ctx.moveTo(S.ribbonKnot.x, S.ribbonKnot.y);
              ctx.lineTo(S.ribbonTipR.x, S.ribbonTipR.y);
              ctx.stroke();
              ctx.restore();
            };

            // If facing camera, ribbon tails sit BEHIND the head!
            if (frontDot > 0) drawRibbonTails();

            // Slender 7-year-old neck
            drawTaperedCapsule2D(ctx, S.shoulderCenter, S.neck, mPx * 0.052, mPx * 0.048, skinDark, null, inkCol, inkW * 0.85);

            const headRx = Math.max(4.4, mPx * 0.112);
            const headRy = Math.max(5.2, mPx * 0.132);
            const hx = S.head.x;
            const hy = S.head.y;

            // Ears (visible in front/back/3-quarter views)
            if (Math.abs(frontDot) > 0.3) {
              const earOff = headRx * 0.94;
              ctx.fillStyle = skinDark;
              ctx.strokeStyle = inkCol;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.arc(hx - earOff, hy + headRy * 0.06, headRx * 0.24, 0, Math.PI * 2);
              ctx.arc(hx + earOff, hy + headRy * 0.06, headRx * 0.24, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            }

            // Sculpted Youth Ellipsoidal Head + Outer Contrast Halo
            ctx.beginPath();
            ctx.ellipse(hx, hy, headRx, headRy, 0, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.30)";
            ctx.lineWidth = inkW + 1.5;
            ctx.stroke();
            ctx.fillStyle = skinMain;
            ctx.fill();
            ctx.strokeStyle = inkCol;
            ctx.lineWidth = inkW;
            ctx.stroke();

            // Warm cheek/forehead highlight
            ctx.fillStyle = skinHi;
            ctx.beginPath();
            ctx.ellipse(hx - headRx * 0.22, hy - headRy * 0.18, headRx * 0.45, headRy * 0.42, 0, 0, Math.PI * 2);
            ctx.fill();

            // Expressive Youth Face (when facing toward camera: frontDot > -0.10)
            if (frontDot > -0.08) {
              const faceShiftX = sideDot * headRx * 0.46;
              const eyeSpan = headRx * 0.36 * clamp(frontDot + 0.35, 0.22, 1.0);
              const eyeY = hy + headRy * 0.06;
              const eyeR = Math.max(1.1, headRx * 0.15);

              ctx.fillStyle = "#0f172a";
              ctx.beginPath();
              ctx.arc(hx + faceShiftX - eyeSpan, eyeY, eyeR, 0, Math.PI * 2);
              if (frontDot > 0.18) {
                ctx.arc(hx + faceShiftX + eyeSpan, eyeY, eyeR, 0, Math.PI * 2);
              }
              ctx.fill();

              // Crisp eye sparkle
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(hx + faceShiftX - eyeSpan - eyeR * 0.25, eyeY - eyeR * 0.28, eyeR * 0.38, 0, Math.PI * 2);
              ctx.fill();

              // Determined athletic eyebrows
              ctx.strokeStyle = hairCol;
              ctx.lineWidth = Math.max(1.1, headRx * 0.13);
              ctx.beginPath();
              ctx.moveTo(hx + faceShiftX - eyeSpan - eyeR, eyeY - eyeR * 1.45);
              ctx.lineTo(hx + faceShiftX - eyeSpan + eyeR, eyeY - eyeR * 1.25);
              if (frontDot > 0.18) {
                ctx.moveTo(hx + faceShiftX + eyeSpan - eyeR, eyeY - eyeR * 1.25);
                ctx.lineTo(hx + faceShiftX + eyeSpan + eyeR, eyeY - eyeR * 1.45);
              }
              ctx.stroke();
            }

            // 3D Athletic Hair Cap (Full back hair when facing away, sporty fringe crown when facing camera!)
            ctx.fillStyle = hairCol;
            ctx.strokeStyle = inkCol;
            ctx.lineWidth = inkW * 0.9;
            ctx.beginPath();
            if (frontDot <= 0.05) {
              // Back / 3-quarter back view: hair covers upper 72% of back of head cleanly
              ctx.ellipse(hx - sideDot * headRx * 0.08, hy - headRy * 0.14, headRx * 1.05, headRy * 0.88, 0, Math.PI * 0.88, Math.PI * 2.12);
              ctx.closePath();
            } else {
              // Front / profile view: stylish athletic hair crown + spiky/textured top
              ctx.ellipse(hx - sideDot * headRx * 0.1, hy - headRy * 0.34, headRx * 1.04, headRy * 0.68, 0, Math.PI, Math.PI * 2);
              ctx.closePath();
            }
            ctx.fill();
            ctx.stroke();

            if (p.hairStyle === 1 || isMe) {
              // Extra sporty crown tuft on top of head!
              ctx.fillStyle = hairCol;
              ctx.beginPath();
              ctx.arc(hx, hy - headRy * 0.92, headRx * 0.38, 0, Math.PI * 2);
              ctx.fill();
            }

            // ★ YOU Signature Wraparound Golden Athletic Headband!
            if (isMe) {
              ctx.fillStyle = "#facc15";
              ctx.strokeStyle = "#0f172a";
              ctx.lineWidth = 1.3;
              ctx.beginPath();
              ctx.roundRect(hx - headRx * 1.04, hy - headRy * 0.44, headRx * 2.08, Math.max(2.8, headRy * 0.26), 3);
              ctx.fill();
              ctx.stroke();
            }

            // If facing away from camera, ribbon knot & fluttering tails sit IN FRONT of back of head!
            if (frontDot <= 0) drawRibbonTails();
          };

          // Per-Limb 3D Depth Sort (Back-to-Front across all 6 anatomical groups + live dribbled ball!)
          const limbParts = [
            { depth: (S.L_knee.camDepth + S.L_ankle.camDepth) * 0.5, fn: makeLegDrawer(false) },
            { depth: (S.R_knee.camDepth + S.R_ankle.camDepth) * 0.5, fn: makeLegDrawer(true) },
            { depth: (S.pelvis.camDepth + S.chest.camDepth) * 0.5, fn: drawTorsoAndShorts },
            { depth: (S.L_elbow.camDepth + S.L_hand.camDepth) * 0.5, fn: makeArmDrawer(false) },
            { depth: (S.R_elbow.camDepth + S.R_hand.camDepth) * 0.5, fn: makeArmDrawer(true) },
            { depth: S.head.camDepth + 0.04, fn: drawHeadAndHair },
          ];

          // Interleave live dribbled/held basketball directly into the ball-handler's per-limb sort!
          if (hasBallNow && !state.ball.inFlight && !state.ball.loose) {
            const dHand = (p.dribbleHand || 1) >= 0 ? 1 : -1;
            const handRW =
              state.ball.gatherTimer > 0
                ? {
                    x: (rw.L_hand.x + rw.R_hand.x) * 0.5,
                    y: (rw.L_hand.y + rw.R_hand.y) * 0.5,
                    z: (rw.L_hand.z + rw.R_hand.z) * 0.5 - 0.04 * visScale,
                  }
                : {
                    x: dHand > 0 ? rw.R_hand.x : rw.L_hand.x,
                    y: dHand > 0 ? rw.R_hand.y : rw.L_hand.y,
                    z: clamp(state.ball.z * visScale, 0.16, Math.max(0.22, (dHand > 0 ? rw.R_hand.z : rw.L_hand.z) - 0.11 * visScale)),
                  };
            const ballDepth = project3D(handRW.x, handRW.y, handRW.z).camDepth;
            limbParts.push({
              depth: ballDepth,
              fn: () => drawBasketballVolumetric3D(ctx, p2s, sxR, syR, handRW.x, handRW.y, handRW.z, true),
            });
          }

          limbParts.sort((a, b) => a.depth - b.depth);
          for (let i = 0; i < limbParts.length; i++) {
            limbParts[i].fn();
          }

          // Overhead Ball-Handler Pointer (🏀▾) on Non-YOU Ball-Handlers for 0.1s Instant Ball Read!
          let extraTopOffset = 0;
          if (hasBallNow && !isMe) {
            const bob = Math.sin(state.simTime * 9.0) * 2.2;
            const ptrX = S.head.x;
            const tipY = S.headTop.y - Math.max(5, mPx * 0.1) + bob;
            ctx.fillStyle = "#fb923c";
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(ptrX, tipY);
            ctx.lineTo(ptrX - 5.5, tipY - 7.5);
            ctx.lineTo(ptrX + 5.5, tipY - 7.5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(ptrX, tipY - 13.5, 5.2, 0, Math.PI * 2);
            ctx.fillStyle = "#f97316";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.4;
            ctx.stroke();
            extraTopOffset = 20;
          }

          ctx.restore();
          const ankleScreenY = Math.max(S.L_ankle.y, S.R_ankle.y);
          return {
            projX: floorProj.x,
            headTopScreenY: S.headTop.y - Math.max(6, mPx * 0.14) - extraTopOffset,
            eyeScreenY: S.head.y,
            ankleScreenY,
            pixelHeight: ankleScreenY - S.headTop.y,
          };
        }

        function renderPseudo3DA() {
          if (state.viewMode === "b") return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const W = canvasA.width / dpr;
          const H = canvasA.height / dpr;
          if (W <= 0 || H <= 0) return;

          const courtLen = getCourtLength();
          const sxR = W / REF_W;
          const syR = H / REF_H;
          const p2s = (wx, wy, wz) => {
            const p = project3D(wx, wy, wz);
            return { x: p.x * sxR, y: p.y * syR, floorY: p.floorY * syR, s: p.s, camDepth: p.camDepth };
          };

          ctxA.save();
          ctxA.scale(dpr, dpr);

          // 1. Arena Stadium Backdrop, Tiered Crowd & Overhead Spotlights
          const horizonY = 56 * syR;
          ctxA.fillStyle = "#0b1120";
          ctxA.fillRect(0, 0, W, H);

          // LED Ribbon Strip
          ctxA.fillStyle = "#1e293b";
          ctxA.fillRect(0, 12 * syR, W, 8 * syR);
          for (let lx = 8; lx < W; lx += 28) {
            ctxA.fillStyle = (Math.floor(lx / 28) + Math.floor(state.simTime * 3)) % 3 === 0 ? "#facc15" : "#38bdf8";
            ctxA.fillRect(lx, 14 * syR, 14, 3.5 * syR);
          }

          // Stadium Bleacher Tiers + Cheering Pixel Crowd Silhouettes
          const crowdColors = ["#3b82f6", "#ef4444", "#facc15", "#22c55e", "#f8fafc", "#fb923c"];
          const yawCrowdShift = Math.round((state.cam.yaw / (Math.PI * 2)) * 180);
          for (let row = 0; row < 3; row++) {
            const ry = (22 + row * 10) * syR;
            ctxA.fillStyle = row === 0 ? "#172554" : row === 1 ? "#1e293b" : "#0f172a";
            ctxA.fillRect(0, ry, W, 11 * syR);
            const cheerHop = state.fx.crowdCheerTimer > 0 ? Math.abs(Math.sin(state.simTime * 20 + row)) * 3 * syR : 0;
            for (let cx = 10 + row * 5; cx < W - 10; cx += 15) {
              const cIdx = (((Math.floor(cx) + yawCrowdShift + row * 7) % crowdColors.length) + crowdColors.length) % crowdColors.length;
              ctxA.fillStyle = crowdColors[cIdx];
              ctxA.fillRect(cx, ry + 3 * syR - cheerHop, 7, 6 * syR);
              ctxA.fillStyle = "#f1c27d";
              ctxA.fillRect(cx + 1.5, ry - cheerHop, 4, 3.5 * syR);
            }
          }

          // 2. Royal Blue Court Apron + Golden Maple Parquet Hardwood
          const apTL = p2s(-COURT.halfW - 0.9, -0.45, 0);
          const apTR = p2s(COURT.halfW + 0.9, -0.45, 0);
          const apBR = p2s(COURT.halfW + 0.9, courtLen + 0.45, 0);
          const apBL = p2s(-COURT.halfW - 0.9, courtLen + 0.45, 0);
          ctxA.fillStyle = "#1e3a8a";
          ctxA.beginPath();
          ctxA.moveTo(apTL.x, apTL.y);
          ctxA.lineTo(apTR.x, apTR.y);
          ctxA.lineTo(apBR.x, apBR.y);
          ctxA.lineTo(apBL.x, apBL.y);
          ctxA.closePath();
          ctxA.fill();

          const yStep = state.fullCourt ? 2 : 1;
          for (let ym = 0; ym < courtLen; ym += yStep) {
            for (let xb = -3; xb < 3; xb++) {
              const x0 = xb * 2.5;
              const x1 = (xb + 1) * 2.5;
              const tl = p2s(x0, ym, 0);
              const tr = p2s(x1, ym, 0);
              const br = p2s(x1, ym + yStep, 0);
              const bl = p2s(x0, ym + yStep, 0);
              const bandIdx = Math.floor(ym / yStep);
              const alt = (bandIdx + xb) % 2 === 0;
              ctxA.fillStyle = bandIdx % 2 === 0 ? (alt ? "#f3cb8f" : "#ecc180") : alt ? "#e8ba75" : "#e0b069";
              ctxA.beginPath();
              ctxA.moveTo(tl.x, tl.y);
              ctxA.lineTo(tr.x, tr.y);
              ctxA.lineTo(br.x, br.y);
              ctxA.lineTo(bl.x, bl.y);
              ctxA.closePath();
              ctxA.fill();
            }
          }

          // Overhead Arena Spotlight Sheen
          if (typeof ctxA.createRadialGradient === "function") {
            const spC = p2s(0, state.fullCourt ? 14.0 : 5.5, 0);
            const grad = ctxA.createRadialGradient(spC.x, spC.y, 10, spC.x, spC.y, W * 0.48);
            grad.addColorStop(0, "rgba(255, 253, 240, 0.22)");
            grad.addColorStop(1, "rgba(255, 253, 240, 0.0)");
            ctxA.fillStyle = grad;
            ctxA.fillRect(0, horizonY, W, H - horizonY);
          }

          // North Painted Key (Blue)
          const fillFloorQuad = (x0, y0, x1, y1, col) => {
            const q0 = p2s(x0, y0, 0);
            const q1 = p2s(x1, y0, 0);
            const q2 = p2s(x1, y1, 0);
            const q3 = p2s(x0, y1, 0);
            ctxA.fillStyle = col;
            ctxA.beginPath();
            ctxA.moveTo(q0.x, q0.y);
            ctxA.lineTo(q1.x, q1.y);
            ctxA.lineTo(q2.x, q2.y);
            ctxA.lineTo(q3.x, q3.y);
            ctxA.closePath();
            ctxA.fill();
          };

          fillFloorQuad(-COURT.paintHalfW, 0, COURT.paintHalfW, COURT.paintLen, "rgba(29, 78, 216, 0.78)");
          if (state.fullCourt) {
            // South Painted Key (Red CPU Target)
            fillFloorQuad(-COURT.paintHalfW, courtLen - COURT.paintLen, COURT.paintHalfW, courtLen, "rgba(185, 28, 28, 0.76)");
          }

          // 3. Polished Hardwood Vertical Reflections
          const allPlayers = state.offense.concat(state.defense);
          for (let i = 0; i < allPlayers.length; i++) {
            const pl = allPlayers[i];
            const pf = p2s(pl.x, pl.y, 0);
            const refW = 14 * pf.s * sxR;
            const refH = 20 * pf.s * syR;
            ctxA.fillStyle = pl.team === "offense" ? "rgba(37, 99, 235, 0.14)" : "rgba(220, 38, 38, 0.14)";
            ctxA.fillRect(pf.x - refW * 0.5, pf.floorY + 2, refW, refH);
          }

          // 4. Crisp Anti-Aliased Court Lines
          const strokeWorldLine = (x1, y1, x2, y2, col, lw, dash) => {
            const segs = state.fullCourt ? 4 : 1;
            ctxA.save();
            ctxA.strokeStyle = col;
            ctxA.lineWidth = lw;
            if (dash) ctxA.setLineDash(dash);
            ctxA.beginPath();
            for (let s = 0; s <= segs; s++) {
              const t = s / segs;
              const pt = p2s(lerp(x1, x2, t), lerp(y1, y2, t), 0);
              if (s === 0) ctxA.moveTo(pt.x, pt.y);
              else ctxA.lineTo(pt.x, pt.y);
            }
            ctxA.stroke();
            ctxA.restore();
          };

          const drawWorldRing = (cx, cy, rM, fillCol, strokeCol, lw, dash, a0, a1) => {
            const segs = 36;
            const startA = a0 === undefined ? 0 : a0;
            const endA = a1 === undefined ? Math.PI * 2 : a1;
            ctxA.save();
            ctxA.beginPath();
            for (let i = 0; i <= segs; i++) {
              const a = lerp(startA, endA, i / segs);
              const pt = p2s(cx + Math.cos(a) * rM, cy + Math.sin(a) * rM, 0);
              if (i === 0) ctxA.moveTo(pt.x, pt.y);
              else ctxA.lineTo(pt.x, pt.y);
            }
            if (fillCol) {
              ctxA.fillStyle = fillCol;
              ctxA.fill();
            }
            if (strokeCol) {
              ctxA.strokeStyle = strokeCol;
              ctxA.lineWidth = lw || 2;
              if (dash) ctxA.setLineDash(dash);
              ctxA.stroke();
            }
            ctxA.restore();
          };

          // Outer Boundary & Midcourt
          strokeWorldLine(-COURT.halfW, 0, COURT.halfW, 0, "#ffffff", 2.4);
          strokeWorldLine(-COURT.halfW, courtLen, COURT.halfW, courtLen, "#ffffff", 2.4);
          strokeWorldLine(-COURT.halfW, 0, -COURT.halfW, courtLen, "#ffffff", 2.4);
          strokeWorldLine(COURT.halfW, 0, COURT.halfW, courtLen, "#ffffff", 2.4);

          // North Key & 3PT Line
          strokeWorldLine(-COURT.paintHalfW, 0, -COURT.paintHalfW, COURT.paintLen, "#ffffff", 2.0);
          strokeWorldLine(COURT.paintHalfW, 0, COURT.paintHalfW, COURT.paintLen, "#ffffff", 2.0);
          strokeWorldLine(-COURT.paintHalfW, COURT.paintLen, COURT.paintHalfW, COURT.paintLen, "#ffffff", 2.0);
          drawWorldRing(0, COURT.paintLen, COURT.ftRadius, null, "#ffffff", 2.0);
          drawWorldRing(0, COURT.rimY, COURT.noChargeRadius, null, "#ffffff", 1.8, null, 0, Math.PI);

          strokeWorldLine(-COURT.threeCornerX, 0, -COURT.threeCornerX, COURT.threeBreakY, "#ffffff", 2.2);
          strokeWorldLine(COURT.threeCornerX, 0, COURT.threeCornerX, COURT.threeBreakY, "#ffffff", 2.2);
          const arcA0 = Math.atan2(COURT.threeBreakY - COURT.rimY, COURT.threeCornerX);
          drawWorldRing(COURT.rimX, COURT.rimY, COURT.threeRadius, null, "#ffffff", 2.2, null, arcA0, Math.PI - arcA0);

          if (state.fullCourt) {
            // Half-Court Line, Center Circle & South Key / South 3PT Arc
            strokeWorldLine(-COURT.halfW, COURT.midY, COURT.halfW, COURT.midY, "#ffffff", 2.2);
            drawWorldRing(0, COURT.midY, 1.8, "rgba(37, 99, 235, 0.22)", "#ffffff", 2.2);

            const sKeyTop = courtLen - COURT.paintLen;
            strokeWorldLine(-COURT.paintHalfW, sKeyTop, -COURT.paintHalfW, courtLen, "#ffffff", 2.0);
            strokeWorldLine(COURT.paintHalfW, sKeyTop, COURT.paintHalfW, courtLen, "#ffffff", 2.0);
            strokeWorldLine(-COURT.paintHalfW, sKeyTop, COURT.paintHalfW, sKeyTop, "#ffffff", 2.0);
            drawWorldRing(0, sKeyTop, COURT.ftRadius, null, "#ffffff", 2.0);
            drawWorldRing(0, COURT.southRimY, COURT.noChargeRadius, null, "#ffffff", 1.8, null, Math.PI, Math.PI * 2);

            strokeWorldLine(-COURT.threeCornerX, COURT.southThreeBreakY, -COURT.threeCornerX, courtLen, "#ffffff", 2.2);
            strokeWorldLine(COURT.threeCornerX, COURT.southThreeBreakY, COURT.threeCornerX, courtLen, "#ffffff", 2.2);
            drawWorldRing(COURT.rimX, COURT.southRimY, COURT.threeRadius, null, "#ffffff", 2.2, null, Math.PI + arcA0, Math.PI * 2 - arcA0);

            // Floor Direction Arrows toward North Hoop (Blue YOU Scores)
            const aTail = p2s(0, 11.2, 0);
            const aTip = p2s(0, 9.2, 0);
            const aL = p2s(-0.7, 10.1, 0);
            const aR = p2s(0.7, 10.1, 0);
            ctxA.strokeStyle = "rgba(37, 99, 235, 0.42)";
            ctxA.lineWidth = 3.0;
            ctxA.beginPath();
            ctxA.moveTo(aTail.x, aTail.y);
            ctxA.lineTo(aTip.x, aTip.y);
            ctxA.moveTo(aL.x, aL.y);
            ctxA.lineTo(aTip.x, aTip.y);
            ctxA.lineTo(aR.x, aR.y);
            ctxA.stroke();
          } else {
            const hashYs = [1.75, 2.65, 3.55, 4.45];
            for (let h = 0; h < hashYs.length; h++) {
              strokeWorldLine(-COURT.paintHalfW - 0.3, hashYs[h], -COURT.paintHalfW, hashYs[h], "#ffffff", 1.8);
              strokeWorldLine(COURT.paintHalfW, hashYs[h], COURT.paintHalfW + 0.3, hashYs[h], "#ffffff", 1.8);
            }
            drawWorldRing(0, COURT.length, 1.8, null, "#ffffff", 2.0, null, Math.PI, Math.PI * 2);
          }

          // 5. Tactical Floor Overlays
          if (!state.fullCourt && state.role === "defense" && state.helpTriangle.show) {
            const pBall = p2s(state.ball.x, state.ball.y, 0);
            const pMan = p2s(state.offense[0].x, state.offense[0].y, 0);
            const pMe = p2s(state.defense[0].x, state.defense[0].y, 0);
            ctxA.save();
            ctxA.fillStyle = "rgba(16, 185, 129, 0.25)";
            ctxA.strokeStyle = "#10b981";
            ctxA.lineWidth = 2.4;
            ctxA.setLineDash([6, 4]);
            ctxA.beginPath();
            ctxA.moveTo(pBall.x, pBall.y);
            ctxA.lineTo(pMan.x, pMan.y);
            ctxA.lineTo(pMe.x, pMe.y);
            ctxA.closePath();
            ctxA.fill();
            ctxA.stroke();
            ctxA.restore();
          }

          const overlayLabels = [];
          const isTutMode = !state.fullCourt && (state.scenario === "tutorial" || state.scenario === "learn_d");
          const userDefNow = isUserOnDefenseNow();

          // Defensive Matchup Tether + Assigned Man Target Ring (3D COURT)
          if (userDefNow) {
            const meDef = getControlledPlayer();
            const myMan = getUserAssignedOffenseMan();
            if (meDef && myMan) {
              strokeWorldLine(meDef.x, meDef.y, myMan.x, myMan.y, "rgba(56, 189, 248, 0.86)", 2.5, [6, 5]);
              const tFlow = (state.simTime * 1.9) % 1;
              const bead = p2s(lerp(meDef.x, myMan.x, tFlow), lerp(meDef.y, myMan.y, tFlow), 0.04);
              ctxA.fillStyle = "#7dd3fc";
              ctxA.beginPath();
              ctxA.arc(bead.x, bead.y, 3.3, 0, Math.PI * 2);
              ctxA.fill();

              const mPulse = 1 + Math.sin(state.simTime * 6.0) * 0.07;
              drawWorldRing(myMan.x, myMan.y, 0.84 * mPulse, "rgba(56, 189, 248, 0.22)", "#38bdf8", 2.5);
              const manFloor = p2s(myMan.x, myMan.y, 0);
              overlayLabels.push({
                anchorX: manFloor.x,
                anchorY: manFloor.floorY + 22,
                text: "🛡️ GUARD",
                bg: "#0369a1",
                fg: "#ffffff",
                priority: 3,
              });
            }
          }

          // In-Flight Landing Target Ring & Loose Rebound Drop Target Ring on Floor
          if (state.ball.inFlight) {
            const isShot = state.ball.flightType === "shot";
            const fPulse = 0.62 + Math.sin(state.simTime * 10.0) * 0.09;
            drawWorldRing(
              state.ball.toX,
              state.ball.toY,
              fPulse,
              isShot ? "rgba(250, 204, 21, 0.24)" : "rgba(56, 189, 248, 0.24)",
              isShot ? "#facc15" : "#38bdf8",
              2.4,
              [5, 4]
            );
          } else if (state.ball.loose) {
            const drop = computeLooseBallDropSpot();
            const rPulse = 0.85 + Math.sin(state.simTime * 11.0) * 0.1;
            drawWorldRing(drop.x, drop.y, rPulse, "rgba(56, 189, 248, 0.28)", "#38bdf8", 2.6, [5, 4]);
            const dropFloor = p2s(drop.x, drop.y, 0);
            overlayLabels.push({
              anchorX: dropFloor.x,
              anchorY: dropFloor.floorY + 20,
              text: "🏀 REBOUND",
              bg: "#0284c7",
              fg: "#ffffff",
              priority: 2,
            });
          }

          if ((state.showHints || isTutMode) && state.targetSpot.active) {
            const pulse = 1 + Math.sin(state.simTime * 5.2) * 0.08;
            const isWarnSpot = state.targetSpot.isWarn;
            drawWorldRing(
              state.targetSpot.x,
              state.targetSpot.y,
              state.targetSpot.radius * pulse,
              isWarnSpot ? "rgba(245, 158, 11, 0.30)" : "rgba(34, 197, 94, 0.30)",
              isWarnSpot ? "#f59e0b" : "#22c55e",
              2.6,
              [7, 5]
            );
            const spotCenter = p2s(state.targetSpot.x, state.targetSpot.y, 0);
            overlayLabels.push({
              anchorX: spotCenter.x,
              anchorY: spotCenter.y + 18,
              text: state.targetSpot.label,
              bg: isWarnSpot ? "#d97706" : "#15803d",
              fg: "#ffffff",
              priority: 4,
            });
          }

          // Amber Pulsing Dribble Pressure Warning Ring (TIGHT!)
          if (state.dribblePressure.ratio >= 0.48) {
            const me = state.offense[0];
            const warnPulse = 0.92 + Math.sin(state.simTime * 18) * 0.12;
            drawWorldRing(me.x, me.y, warnPulse, "rgba(245, 158, 11, 0.28)", "#f59e0b", 2.8);
            const meFloor = p2s(me.x, me.y, 0);
            overlayLabels.push({
              anchorX: meFloor.x,
              anchorY: meFloor.floorY + 22,
              text: "⚠️ TIGHT!",
              bg: "#d97706",
              fg: "#ffffff",
              priority: 1,
            });
          }

          // Sky-Blue On-Ball Pass Target Ring & Dashed Guide (E Key)
          if (
            !userDefNow &&
            !state.ball.inFlight &&
            !state.ball.loose &&
            state.ball.holderTeam === "offense" &&
            state.ball.holderIdx === 0 &&
            state.passTarget.idx > 0
          ) {
            const me = state.offense[0];
            const targetMate = state.offense[state.passTarget.idx];
            const pulse = 1 + Math.sin(state.simTime * 6.5) * 0.09;
            const clear = state.passTarget.laneOpen;
            strokeWorldLine(me.x, me.y, targetMate.x, targetMate.y, clear ? "rgba(56, 189, 248, 0.86)" : "rgba(251, 146, 60, 0.86)", 2.6, [6, 5]);
            drawWorldRing(
              targetMate.x,
              targetMate.y,
              0.95 * pulse,
              clear ? "rgba(56, 189, 248, 0.28)" : "rgba(251, 146, 60, 0.25)",
              clear ? "#38bdf8" : "#fb923c",
              2.6
            );
            const mateFloor = p2s(targetMate.x, targetMate.y, 0);
            overlayLabels.push({
              anchorX: mateFloor.x,
              anchorY: mateFloor.floorY + 22,
              text: "🎯 E",
              bg: clear ? "#0284c7" : "#c2410c",
              fg: "#ffffff",
              priority: 2,
            });
          }

          if (!userDefNow && state.lane.crowdedTeammateIdx !== -1) {
            const mate = state.offense[state.lane.crowdedTeammateIdx];
            const me = state.offense[0];
            drawWorldRing(mate.x, mate.y, COURT.crowdingDist, "rgba(249, 115, 22, 0.26)", "#ea580c", 2.5, [5, 4]);
            const warnPos = p2s((me.x + mate.x) * 0.5, (me.y + mate.y) * 0.5, 0.7);
            overlayLabels.push({
              anchorX: warnPos.x,
              anchorY: warnPos.y,
              text: "⚠️ CLOSE!",
              bg: "#ea580c",
              fg: "#ffffff",
              priority: 2,
            });
          }

          if (!userDefNow && !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx !== 0) {
            const passer = state.offense[state.ball.holderIdx];
            const me = state.offense[0];
            if (state.lane.open) {
              strokeWorldLine(passer.x, passer.y, me.x, me.y, "#22c55e", 4.2);
              const flow = (state.simTime * 2.2) % 1;
              for (let k = 0; k < 3; k++) {
                const f = ((k + flow) / 3) * 0.84 + 0.08;
                const fp = p2s(lerp(passer.x, me.x, f), lerp(passer.y, me.y, f), 0.05);
                ctxA.fillStyle = "#dcfce7";
                ctxA.beginPath();
                ctxA.arc(fp.x, fp.y, 3.8, 0, Math.PI * 2);
                ctxA.fill();
              }
              const mid = p2s((passer.x + me.x) * 0.5, (passer.y + me.y) * 0.5, 0.35);
              overlayLabels.push({
                anchorX: mid.x,
                anchorY: mid.y,
                text: "🟢 PASS!",
                bg: "#16a34a",
                fg: "#ffffff",
                priority: 2,
              });
            } else {
              strokeWorldLine(passer.x, passer.y, me.x, me.y, "rgba(239, 68, 68, 0.82)", 2.4, [6, 5]);
            }
          }

          // Dust Puffs
          for (let i = 0; i < state.fx.dusts.length; i++) {
            const du = state.fx.dusts[i];
            const dp = p2s(du.x, du.y, du.z);
            ctxA.fillStyle = "rgba(248, 250, 252, " + clamp(du.life * 2, 0.2, 0.85).toFixed(2) + ")";
            ctxA.fillRect(dp.x - 3, dp.y - 3, 6, 6);
          }

          // 6. True Painter's Algorithm Depth Sort: Hoops + 10 Sprite-Stacked Players + 3D Ball!
          const drawList = [];
          drawList.push({
            kind: "hoop",
            hoopSign: 1,
            camDepth: project3D(0, COURT.backboardY, 0).camDepth,
          });
          if (state.fullCourt) {
            drawList.push({
              kind: "hoop",
              hoopSign: -1,
              camDepth: project3D(0, COURT.southBackboardY, 0).camDepth,
            });
          }

          for (let i = 0; i < state.offense.length; i++) {
            const pl = state.offense[i];
            drawList.push({
              kind: "player",
              camDepth: project3D(pl.x, pl.y, 0).camDepth,
              p: pl,
              isOffense: true,
              isMe: (state.fullCourt || state.role === "offense") && i === 0,
              hasBallNow: !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === i,
            });
          }
          for (let i = 0; i < state.defense.length; i++) {
            const pl = state.defense[i];
            drawList.push({
              kind: "player",
              camDepth: project3D(pl.x, pl.y, 0).camDepth,
              p: pl,
              isOffense: false,
              isMe: !state.fullCourt && state.role === "defense" && i === 0,
              hasBallNow: !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "defense" && state.ball.holderIdx === i,
            });
          }
          if (state.ball.inFlight || state.ball.loose) {
            drawList.push({
              kind: "ball",
              camDepth: project3D(state.ball.x, state.ball.y, state.ball.z).camDepth,
            });
          }
          drawList.sort((a, b) => a.camDepth - b.camDepth);

          for (let i = 0; i < drawList.length; i++) {
            const item = drawList[i];
            if (item.kind === "hoop") {
              drawStackedHoop3D(item.hoopSign, p2s, sxR, syR);
            } else if (item.kind === "player") {
              const p = item.p;
              const drawn = drawArticulatedPlayer3D(ctxA, item, p2s, sxR, syR);

              // Defender Ball-Watching Sightline Beam
              if (!item.isOffense && !userDefNow && p.ballWatchFactor > 0.55 && !item.isMe) {
                const bP = p2s(state.ball.x, state.ball.y, 1.0);
                ctxA.save();
                ctxA.strokeStyle = "rgba(250, 204, 21, 0.75)";
                ctxA.lineWidth = 1.8;
                ctxA.setLineDash([4, 4]);
                ctxA.beginPath();
                ctxA.moveTo(drawn.projX, drawn.eyeScreenY);
                ctxA.lineTo(lerp(drawn.projX, bP.x, 0.45), lerp(drawn.eyeScreenY, bP.y, 0.45));
                ctxA.stroke();
                ctxA.restore();
              }

              // Minimal Kid-Friendly Badges (1-2 Words Max; OOPS strictly on opponents, NEVER on teammates!)
              const headTopY = drawn.headTopScreenY;
              const isOpponent = isOpponentTeamSide(item.isOffense);
              if (item.isMe) {
                overlayLabels.push({ anchorX: drawn.projX, anchorY: headTopY, text: "★ YOU", bg: "#facc15", fg: "#0f172a", priority: 1 });
              } else if (p.offBalanceTimer > 0 && isOpponent) {
                overlayLabels.push({ anchorX: drawn.projX, anchorY: headTopY, text: "⚡ OOPS!", bg: "#f97316", fg: "#ffffff", priority: 1 });
              } else if (!item.isOffense && p.id === 0 && !userDefNow && p.ballWatchFactor > 0.55) {
                overlayLabels.push({ anchorX: drawn.projX, anchorY: headTopY, text: "👀 BALL!", bg: "#fef08a", fg: "#0f172a", priority: 3 });
              } else if (item.hasBallNow && state.ball.gatherTimer > 0 && userDefNow) {
                overlayLabels.push({ anchorX: drawn.projX, anchorY: headTopY, text: "🚨 SHOT!", bg: "#ef4444", fg: "#ffffff", priority: 2 });
              }
            } else {
              if (state.ball.inFlight) {
                // Smooth 3D Parabolic Trajectory Guide Arc (Start -> Current Ball -> Target)
                const b = state.ball;
                const uCur = clamp(b.t, 0, 1);
                const isShot = b.flightType === "shot";
                const evalFlightPos = (s) => {
                  const wx = lerp(b.fromX, b.toX, s);
                  const wy = lerp(b.fromY, b.toY, s);
                  let wz = 1.22;
                  if (isShot) {
                    const linZ = lerp(b.fromZ, b.toZ, s);
                    wz = linZ + Math.sin(s * Math.PI) * (4.55 - linZ * 0.65);
                  } else {
                    wz = 1.22 + Math.sin(s * Math.PI) * 0.44;
                  }
                  return p2s(wx, wy, wz);
                };

                ctxA.save();
                ctxA.lineCap = "round";
                // Past parabolic arc (0 .. uCur)
                if (uCur > 0.02) {
                  ctxA.strokeStyle = isShot ? "rgba(250, 204, 21, 0.55)" : "rgba(56, 189, 248, 0.55)";
                  ctxA.lineWidth = 3.0;
                  ctxA.beginPath();
                  for (let k = 0; k <= 10; k++) {
                    const pt = evalFlightPos((k / 10) * uCur);
                    if (k === 0) ctxA.moveTo(pt.x, pt.y);
                    else ctxA.lineTo(pt.x, pt.y);
                  }
                  ctxA.stroke();
                }
                // Forward predicted parabolic guide arc (uCur .. 1.0)
                if (uCur < 0.98) {
                  ctxA.strokeStyle = isShot ? "rgba(254, 240, 138, 0.82)" : "rgba(125, 211, 252, 0.85)";
                  ctxA.lineWidth = 2.4;
                  ctxA.setLineDash([5, 4]);
                  ctxA.beginPath();
                  for (let k = 0; k <= 12; k++) {
                    const pt = evalFlightPos(lerp(uCur, 1.0, k / 12));
                    if (k === 0) ctxA.moveTo(pt.x, pt.y);
                    else ctxA.lineTo(pt.x, pt.y);
                  }
                  ctxA.stroke();
                }
                ctxA.restore();
              } else if (state.ball.loose) {
                drawWorldRing(state.ball.x, state.ball.y, 0.72, "rgba(56, 189, 248, 0.25)", "#38bdf8", 2.2);
              }
              drawBasketballVolumetric3D(ctxA, p2s, sxR, syR, state.ball.x, state.ball.y, state.ball.z, true);
            }
          }

          // Sparkle Particles
          for (let i = 0; i < state.fx.sparkles.length; i++) {
            const sp = state.fx.sparkles[i];
            const pt = p2s(sp.x, sp.y, sp.z);
            ctxA.fillStyle = sp.color;
            ctxA.fillRect(pt.x - 2.5, pt.y - 2.5, 5, 5);
          }

          // Rising +2! / +3! Rim Score Popups
          if (state.fx.scorePopups.length > 0) {
            ctxA.save();
            ctxA.textAlign = "center";
            for (let i = 0; i < state.fx.scorePopups.length; i++) {
              const pop = state.fx.scorePopups[i];
              const pt = p2s(pop.x, pop.y, pop.z);
              const alpha = clamp(pop.life / 0.45, 0, 1);
              ctxA.globalAlpha = alpha;
              ctxA.font = '900 20px "SF Pro Rounded", "Segoe UI", sans-serif';
              ctxA.strokeStyle = "#090d16";
              ctxA.lineWidth = 4.2;
              ctxA.strokeText(pop.text, pt.x, pt.y);
              ctxA.fillStyle = pop.color;
              ctxA.fillText(pop.text, pt.x, pt.y);
            }
            ctxA.restore();
          }

          // 8. Collision-Free Floating Callout Pills
          ctxA.font = '900 12px "SF Pro Rounded", "Segoe UI", sans-serif';
          const resolved = resolveLabelCollisions(overlayLabels, W, H, (txt) => ctxA.measureText(txt).width);
          state.lastResolvedLabelsA = resolved;

          ctxA.textAlign = "center";
          for (let i = 0; i < resolved.length; i++) {
            const r = resolved[i];
            const centerX = r.x + r.w * 0.5;
            const bottomY = r.y + r.h;

            if (hypot2(centerX - r.anchorX, bottomY - r.anchorY) > 18) {
              ctxA.save();
              ctxA.strokeStyle = "rgba(255, 255, 255, 0.75)";
              ctxA.lineWidth = 1.5;
              ctxA.setLineDash([3, 3]);
              ctxA.beginPath();
              ctxA.moveTo(centerX, r.y + r.h * 0.5);
              ctxA.lineTo(clamp(r.anchorX, 10, W - 10), clamp(r.anchorY, 36, H - 10));
              ctxA.stroke();
              ctxA.restore();
            }

            ctxA.fillStyle = r.bg;
            ctxA.strokeStyle = "#0f172a";
            ctxA.lineWidth = 1.8;
            ctxA.beginPath();
            ctxA.roundRect(r.x, r.y, r.w, r.h, 7);
            ctxA.fill();
            ctxA.stroke();
            ctxA.fillStyle = r.fg;
            ctxA.fillText(r.text, centerX, r.y + 15);
          }

          // 9. In-Canvas Arena Overhead Mini LED Scoreboard (🏆 GAME Mode Only!)
          if (!state.paused && state.appMode === "game" && (state.fullCourt || state.scenario === "match")) {
            drawArenaScoreboardHUD(ctxA, W);
          }

          if (state.paused) drawPauseOverlayPill(ctxA, W);
          ctxA.restore();
        }

        function drawArenaScoreboardHUD(ctx, W) {
          const youStr = String(state.matchScore.you).padStart(2, "0");
          const cpuStr = String(state.matchScore.cpu).padStart(2, "0");
          const targ = state.matchScore.target;
          const subTag =
            state.matchScore.winner === "you" ? "🏆 WIN!" : state.matchScore.winner === "cpu" ? "FINAL" : targ > 0 ? "TO " + targ : "FREE";

          const boxW = 216;
          const boxH = 26;
          const x = (W - boxW) * 0.5;
          const y = 6;

          ctx.save();
          ctx.fillStyle = "rgba(9, 13, 22, 0.92)";
          ctx.strokeStyle = state.matchScore.winner ? "#facc15" : "#38bdf8";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.roundRect(x, y, boxW, boxH, 8);
          ctx.fill();
          ctx.stroke();

          ctx.textAlign = "center";
          ctx.font = '900 10.5px "SF Pro Rounded", "Segoe UI", sans-serif';
          ctx.fillStyle = "#93c5fd";
          ctx.fillText("YOU", x + 26, y + 17);

          ctx.font = '900 15px ui-monospace, "SF Mono", Menlo, monospace';
          ctx.fillStyle = state.matchScore.youPopTimer > 0 ? "#fde047" : "#ffffff";
          ctx.fillText(youStr, x + 62, y + 18);

          ctx.font = '900 9.5px "SF Pro Rounded", "Segoe UI", sans-serif';
          ctx.fillStyle = "#fde047";
          ctx.fillText(subTag, x + boxW * 0.5, y + 16.5);

          ctx.font = '900 15px ui-monospace, "SF Mono", Menlo, monospace';
          ctx.fillStyle = state.matchScore.cpuPopTimer > 0 ? "#fde047" : "#ffffff";
          ctx.fillText(cpuStr, x + boxW - 62, y + 18);

          ctx.font = '900 10.5px "SF Pro Rounded", "Segoe UI", sans-serif';
          ctx.fillStyle = "#fca5a5";
          ctx.fillText("CPU", x + boxW - 26, y + 17);
          ctx.restore();
        }

        function drawPauseOverlayPill(ctx, W) {
          const text = "⏸ PAUSED (PRESS P)";
          ctx.save();
          ctx.font = "900 13.5px sans-serif";
          const tw = ctx.measureText(text).width + 28;
          const x = (W - tw) * 0.5;
          ctx.fillStyle = "#facc15";
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.roundRect(x, 8, tw, 28, 999);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#0f172a";
          ctx.textAlign = "center";
          ctx.fillText(text, W * 0.5, 26.5);
          ctx.restore();
        }

        /* =====================================================================
         * 11. DOM Sync, Keycap Glows & Input Listeners (E Pass + Digit 1~4)
         * ===================================================================== */
        function syncCoachDOM() {
          const banner = document.getElementById("coachBanner");
          banner.className = "coach-banner" + (state.coach.tone !== "normal" ? " tone-" + state.coach.tone : "");
          document.getElementById("coachEmoji").textContent = state.coach.emoji;
          document.getElementById("coachMainMsg").textContent = state.coach.main;
        }

        function syncKeycapsDOM() {
          const showGlow =
            !state.fullCourt && (state.scenario === "tutorial" || state.scenario === "learn_d" || (state.scenario === "give_go" && state.showHints));
          const hl = state.tutorial.highlightKeys || [];
          const map = [
            { id: "keycapW", key: "W", down: keys.W },
            { id: "keycapA", key: "A", down: keys.A },
            { id: "keycapS", key: "S", down: keys.S },
            { id: "keycapD", key: "D", down: keys.D },
            { id: "keycapShift", key: "Shift", down: keys.Shift },
            { id: "keycapSpace", key: "Space", down: keys.SpaceFlash > 0 },
            { id: "keycapE", key: "E", down: keys.CallFlash > 0 },
          ];
          for (let i = 0; i < map.length; i++) {
            const item = map[i];
            const el = document.getElementById(item.id);
            if (!el) continue;
            el.classList.toggle("pressed", !!item.down);
            el.classList.toggle("key-glow", showGlow && hl.indexOf(item.key) !== -1 && !item.down);
          }

          const userDefNow = isUserOnDefenseNow();
          const iHaveBall =
            !userDefNow && !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
          const keycapE = document.getElementById("keycapE");
          if (keycapE) {
            keycapE.classList.toggle("pass-ready", iHaveBall);
          }

          const spMain = document.getElementById("labelSpaceMain");
          const spSub = document.getElementById("labelSpaceSub");
          const eMain = document.getElementById("labelEMain");
          const eSub = document.getElementById("labelESub");
          if (spMain && spSub && eMain && eSub) {
            if (state.ball.loose) {
              spMain.textContent = "🏀 SPACE";
              spSub.textContent = "REBOUND";
              eMain.textContent = "🏃 E";
              eSub.textContent = "READY";
            } else if (userDefNow) {
              spMain.textContent = "⚡ SPACE";
              spSub.textContent = "STEAL · BLOCK";
              eMain.textContent = "🔄 E";
              eSub.textContent = "SWITCH";
            } else if (iHaveBall) {
              spMain.textContent = "🏀 SPACE";
              spSub.textContent = "SHOOT";
              eMain.textContent = "🎯 E";
              eSub.textContent = "PASS";
            } else {
              spMain.textContent = "🏀 SPACE";
              spSub.textContent = "SHOOT";
              eMain.textContent = "🙋 E";
              eSub.textContent = "CALL";
            }
          }
        }

        function syncLiveBadgesDOM() {
          const paceEl = document.getElementById("paceBadge");
          paceEl.textContent = state.rhythm.currentLabel;
          paceEl.className = "live-badge " + state.rhythm.badgeClass;

          const spaceEl = document.getElementById("spaceBadge");
          if (state.ball.loose) {
            spaceEl.textContent = "🏀 LOOSE BALL!";
            spaceEl.className = "live-badge space-ball";
            return;
          }
          if (isUserOnDefenseNow()) {
            if (state.ball.gatherTimer > 0) {
              spaceEl.textContent = "🚨 BLOCK! SPACE!";
              spaceEl.className = "live-badge space-warn";
            } else if (state.lane.open) {
              spaceEl.textContent = "🛡️ GOOD D · ⚡ STEAL";
              spaceEl.className = "live-badge space-good";
            } else {
              spaceEl.textContent = "🛡️ DEFEND!";
              spaceEl.className = "live-badge space-warn";
            }
            return;
          }

          if (state.dribblePressure.ratio >= 0.48) {
            spaceEl.textContent = "⚠️ TIGHT! PASS E!";
            spaceEl.className = "live-badge space-warn";
          } else if (!state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0) {
            spaceEl.textContent = "🏀 SHOOT · 🎯 PASS";
            spaceEl.className = "live-badge space-ball";
          } else if (state.lane.crowdedTeammateIdx !== -1) {
            spaceEl.textContent = "⚠️ CROWDED";
            spaceEl.className = "live-badge space-warn";
          } else if (state.lane.open) {
            spaceEl.textContent = "🟢 OPEN!";
            spaceEl.className = "live-badge space-good";
          } else {
            spaceEl.textContent = "🔴 BLOCKED";
            spaceEl.className = "live-badge space-block";
          }
        }

        function syncAllDOM() {
          const isGame = state.appMode === "game";

          // 1. Top-Level 2-Mode Switch: 🎯 PRACTICE vs 🏆 GAME
          const btnPrac = document.getElementById("btnAppPractice");
          const btnGame = document.getElementById("btnAppGame");
          if (btnPrac) btnPrac.className = "top-mode-btn" + (!isGame ? " active-practice" : "");
          if (btnGame) btnGame.className = "top-mode-btn" + (isGame ? " active-game" : "");

          const gameSub = document.getElementById("gameSubBar");
          const pracSub = document.getElementById("practiceSubBar");
          if (gameSub) gameSub.style.display = isGame ? "" : "none";
          if (pracSub) pracSub.style.display = !isGame ? "" : "none";

          // 2. 🏆 GAME Sub-Bar (Full-Court 5v5 vs Half-Court 5v5)
          const btnFC = document.getElementById("btnModeFullCourt");
          const btnHC = document.getElementById("btnGameHalfCourt");
          if (btnFC) btnFC.classList.toggle("active", isGame && state.fullCourt);
          if (btnHC) btnHC.classList.toggle("active", isGame && !state.fullCourt);

          const fcBanner = document.getElementById("fullCourtBanner");
          if (fcBanner) fcBanner.classList.toggle("visible", isGame && state.fullCourt);

          const hcFlowWrap = document.getElementById("halfCourtFlowWrap");
          if (hcFlowWrap) hcFlowWrap.style.display = isGame && !state.fullCourt ? "" : "none";

          const flowTwo = document.getElementById("btnFlowTwoWay");
          const flowOff = document.getElementById("btnFlowOffOnly");
          const flowDef = document.getElementById("btnFlowDefOnly");
          if (flowTwo) flowTwo.classList.toggle("active", state.matchFlow === "two_way");
          if (flowOff) flowOff.classList.toggle("active", state.matchFlow === "offense_only");
          if (flowDef) flowDef.classList.toggle("active", state.matchFlow === "defense_only");

          // 3. 🎯 PRACTICE Sub-Bar (Offense 5 Cards vs Defense 4 Cards)
          const btnOff = document.getElementById("btnRoleOffense");
          const btnDef = document.getElementById("btnRoleDefense");
          if (btnOff) btnOff.className = !isGame && state.role === "offense" ? "active-blue" : "";
          if (btnDef) btnDef.className = !isGame && state.role === "defense" ? "active-red" : "";

          document.querySelectorAll(".scenario-btn").forEach((btn) => {
            const cardSide = btn.getAttribute("data-side");
            const sc = btn.getAttribute("data-scenario");
            btn.style.display = !isGame && cardSide === state.role ? "" : "none";
            btn.classList.toggle("active", !isGame && cardSide === state.role && sc === state.scenario);
          });

          // 4. Match HUD & Large Arena LED Scoreboard (🏆 GAME Mode ONLY!)
          const showScoreHud = isGame;
          const matchHud = document.getElementById("matchHud");
          if (matchHud) {
            matchHud.classList.toggle("visible", showScoreHud);
            matchHud.classList.toggle("win-glow", showScoreHud && !!state.matchScore.winner);
          }

          const modeLabel = document.getElementById("matchModeLabel");
          if (modeLabel) {
            modeLabel.textContent = state.fullCourt ? "🏟️ FULL COURT 5v5" : "🏀 HALF COURT 5v5";
          }

          document.querySelectorAll(".target-btn").forEach((btn) => {
            btn.classList.toggle("active", parseInt(btn.getAttribute("data-target"), 10) === state.matchScore.target);
          });

          const sYou = document.getElementById("scoreYou");
          const sCpu = document.getElementById("scoreCpu");
          const sStop = document.getElementById("scoreStops");
          if (sYou) {
            sYou.textContent = String(state.matchScore.you);
            sYou.classList.toggle("score-pop", state.matchScore.youPopTimer > 0);
          }
          if (sCpu) {
            sCpu.textContent = String(state.matchScore.cpu);
            sCpu.classList.toggle("score-pop", state.matchScore.cpuPopTimer > 0);
          }
          if (sStop) {
            sStop.textContent = "⚡ STEALS " + state.matchScore.steals + " · 🛑 STOPS " + state.matchScore.stops;
          }

          const winBtn = document.getElementById("btnRematchWin");
          if (winBtn) {
            winBtn.style.display = showScoreHud && state.matchScore.winner ? "" : "none";
            winBtn.textContent = state.matchScore.winner === "you" ? "🏆 YOU WIN! PLAY AGAIN" : "🏀 REMATCH!";
          }

          // Tutorial Progress Bar (Practice LEARN & LEARN D Only)
          const isTut = !isGame && (state.scenario === "tutorial" || state.scenario === "learn_d");
          const tutStrip = document.getElementById("tutorialStrip");
          if (tutStrip) tutStrip.classList.toggle("visible", isTut);

          const spotGroup = document.getElementById("startSpotGroup");
          if (spotGroup) {
            const hideSpots = isGame || isTut || state.scenario === "def_onball";
            spotGroup.style.display = hideSpots ? "none" : "";
          }

          const tutLabels =
            state.scenario === "learn_d" ? ["1. SLIDE", "2. HANDS UP", "3. HELP", "4. CLOSEOUT"] : ["1. CROWD", "2. SPREAD", "3. PACE", "4. CROSS"];
          document.querySelectorAll(".tut-step-pill").forEach((pill, idx) => {
            const st = idx + 1;
            pill.textContent = tutLabels[idx];
            pill.classList.toggle("current", st === state.tutorial.step);
            pill.classList.toggle("done", !!state.tutorial.completedSteps[st] && st !== state.tutorial.step);
          });

          const gradBtn = document.getElementById("btnTutFinishToMain");
          if (gradBtn) {
            gradBtn.style.display = isTut && state.tutorial.subPhase === "graduated" ? "" : "none";
          }

          const stage = document.getElementById("courtStage");
          stage.className = "court-stage" + (state.viewMode === "a" ? " mode-a-only" : state.viewMode === "b" ? " mode-b-only" : "");
          document.querySelectorAll(".view-mode-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.getAttribute("data-view") === state.viewMode);
          });

          document.querySelectorAll(".diff-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.getAttribute("data-diff") === state.difficulty);
          });

          document.querySelectorAll(".cam-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.getAttribute("data-cam") === state.cam.preset);
          });

          const viewBTitle = document.getElementById("viewBTitleText");
          if (viewBTitle) {
            viewBTitle.textContent = state.fullCourt ? "FULL COURT MAP" : "5 DOTS MAP";
          }

          const boardInputOn = isBoardInputActive();
          const boardBadge = document.getElementById("boardInputBadge");
          if (boardBadge) {
            boardBadge.classList.toggle("visible", state.viewMode === "b" || (state.viewMode === "both" && boardInputOn));
          }
          const panelAEl = document.getElementById("panelA");
          const panelBEl = document.getElementById("panelB");
          if (panelAEl && panelBEl) {
            panelAEl.classList.toggle("surface-active", state.viewMode === "both" && !boardInputOn);
            panelBEl.classList.toggle("surface-active", state.viewMode === "both" && boardInputOn);
          }

          document.querySelectorAll(".spot-btn").forEach((btn) => {
            btn.classList.toggle("active", btn.getAttribute("data-spot") === state.startSpot);
          });

          const viewATitle = document.getElementById("viewATitleText");
          if (viewATitle) {
            const zPct = Math.round((state.cam.userZoom || 1.0) * 100);
            const modeTxt = state.cam.preset === "auto" ? "SMART CAM" : "DRAG 360";
            viewATitle.textContent = zPct !== 100 ? modeTxt + " · " + zPct + "%" : modeTxt + " · ZOOM";
          }

          const soundBtn = document.getElementById("btnSoundToggle");
          if (soundBtn) {
            soundBtn.textContent = state.soundEnabled ? "🔊 SOUND" : "🔇 MUTE";
            soundBtn.classList.toggle("active", !!state.soundEnabled);
          }

          const hintBtn = document.getElementById("btnHintToggle");
          hintBtn.classList.toggle("active", state.showHints);

          const pauseBtn = document.getElementById("btnPause");
          pauseBtn.textContent = state.paused ? "▶️ PLAY" : "⏸ PAUSE";
          pauseBtn.classList.toggle("paused", state.paused);

          syncCoachDOM();
          syncLiveBadgesDOM();
          syncKeycapsDOM();
          resizeCanvases();
        }

        function setInputSurface(surface) {
          if (surface !== "3d" && surface !== "board") return;
          if (state.inputSurface === surface) return;
          state.inputSurface = surface;
          updatePassTarget();
          syncAllDOM();
          renderFrame();
        }

        function setViewMode(mode) {
          if (mode !== "both" && mode !== "a" && mode !== "b") return;
          state.viewMode = mode;
          if (mode === "b") state.inputSurface = "board";
          else if (mode === "a") state.inputSurface = "3d";
          updatePassTarget();
          syncAllDOM();
          renderFrame();
        }

        function cycleViewMode() {
          const order = ["both", "a", "b"];
          setViewMode(order[(order.indexOf(state.viewMode) + 1) % order.length]);
        }

        function setCameraPreset(preset) {
          if (!Object.prototype.hasOwnProperty.call(CAMERA_PRESETS, preset)) return;
          state.cam.preset = preset;
          if (state.viewMode !== "b") state.inputSurface = "3d";
          updateCamera(0, true);
          updatePassTarget();
          syncAllDOM();
          renderFrame();
        }

        function cycleCameraPreset() {
          const order = ["auto", "tv", "iso", "behind", "follow"];
          const cur = order.indexOf(state.cam.preset);
          setCameraPreset(order[(cur + 1) % order.length]);
        }

        function rotateCameraBy(deltaRad) {
          state.cam.preset = "free";
          state.cam.targetYaw = wrapAngle(state.cam.yaw + deltaRad);
          state.cam.yaw = state.cam.targetYaw;
          if (state.viewMode !== "b") state.inputSurface = "3d";
          updateCamera(0, true);
          updatePassTarget();
          syncAllDOM();
          renderFrame();
        }

        function setDifficulty(diffKey) {
          if (!DIFFICULTY_PROFILES[diffKey]) return;
          state.difficulty = diffKey;
          state.speedScale = DIFFICULTY_PROFILES[diffKey].speedScale;
          syncAllDOM();
        }

        function setAppMode(mode) {
          if (mode === "practice") {
            const wasFullCourt = state.fullCourt;
            state.appMode = "practice";
            state.fullCourt = false;
            state.showHints = true;
            state.role = state.practiceRole || "offense";
            state.mainMode = state.role;
            if (wasFullCourt) {
              state.cam.preset = "auto";
              if (state.viewMode !== "b") state.inputSurface = "3d";
            }
            state.scenario = state.role === "defense" ? state.lastDefenseScenario || "def_onball" : state.lastOffenseScenario || "relocation";
            resetScenario();
            renderFrame();
            return;
          }
          if (mode === "game") {
            setGameType(state.gameType || "full_court");
          }
        }

        function setGameType(gType) {
          if (gType === "full_court") {
            const modeChanged = state.appMode !== "game" || !state.fullCourt || !!state.matchScore.winner;
            state.appMode = "game";
            state.gameType = "full_court";
            state.mainMode = "full_court";
            state.fullCourt = true;
            state.role = "offense";
            state.scenario = "full_court";
            state.cam.preset = "auto";
            if (state.viewMode !== "b") state.inputSurface = "3d";
            if (modeChanged) resetMatchScores();
            resetScenario();
            renderFrame();
            return;
          }
          if (gType === "half_court") {
            const wasFullCourt = state.fullCourt;
            const modeChanged = state.appMode !== "game" || wasFullCourt || state.scenario !== "match" || !!state.matchScore.winner;
            state.appMode = "game";
            state.gameType = "half_court";
            state.fullCourt = false;
            state.scenario = "match";
            if (state.matchFlow === "defense_only") state.role = "defense";
            else if (state.matchFlow === "offense_only") state.role = "offense";
            else state.role = state.matchOriginRole || "offense";
            state.mainMode = state.role;
            if (wasFullCourt) {
              state.cam.preset = "auto";
              if (state.viewMode !== "b") state.inputSurface = "3d";
            }
            if (modeChanged) resetMatchScores();
            resetScenario();
            renderFrame();
          }
        }

        function setMainMode(mode) {
          if (mode === "full_court" || mode === "game") {
            setGameType("full_court");
            return;
          }
          if (mode === "practice") {
            setAppMode("practice");
            return;
          }
          if (mode === "offense" || mode === "defense") {
            setRole(mode);
          }
        }

        function setRole(role) {
          if (role !== "offense" && role !== "defense") return;
          const wasFullCourt = state.fullCourt;
          state.appMode = "practice";
          state.practiceRole = role;
          state.fullCourt = false;
          state.mainMode = role;
          state.role = role;
          if (wasFullCourt) {
            state.cam.preset = "auto";
            if (state.viewMode !== "b") state.inputSurface = "3d";
          }
          state.scenario = role === "defense" ? state.lastDefenseScenario || "def_onball" : state.lastOffenseScenario || "relocation";
          resetScenario();
          renderFrame();
        }

        function setScenario(scenario, explicitRole) {
          if (!SCENARIO_META[scenario]) return;
          if (scenario === "full_court") {
            setGameType("full_court");
            return;
          }
          if (scenario === "match") {
            const wasFullCourt = state.fullCourt;
            const wasMatch = state.appMode === "game" && state.scenario === "match" && !wasFullCourt;
            state.appMode = "game";
            state.gameType = "half_court";
            state.fullCourt = false;
            state.scenario = "match";
            if (wasFullCourt) {
              state.cam.preset = "auto";
              if (state.viewMode !== "b") state.inputSurface = "3d";
            }
            if (!wasMatch || state.matchScore.winner) {
              resetMatchScores();
            }
            if (explicitRole === "offense" || explicitRole === "defense") {
              state.role = explicitRole;
            }
            state.matchOriginRole = state.role;
            state.mainMode = state.role;
            resetScenario();
            renderFrame();
            return;
          }

          const wasFullCourt = state.fullCourt;
          state.appMode = "practice";
          state.fullCourt = false;
          state.scenario = scenario;
          if (wasFullCourt) {
            state.cam.preset = "auto";
            if (state.viewMode !== "b") state.inputSurface = "3d";
          }
          state.role = SCENARIO_META[scenario].role;
          state.practiceRole = state.role;
          if (scenario === "tutorial" || scenario === "learn_d") {
            state.tutorial.step = 1;
            state.tutorial.completedSteps = { 1: false, 2: false, 3: false, 4: false };
          } else if (state.role === "offense") {
            state.lastOffenseScenario = scenario;
          } else {
            state.lastDefenseScenario = scenario;
          }
          state.mainMode = state.role;
          resetScenario();
          renderFrame();
        }

        function setMatchFlow(flow) {
          if (flow === "stay") {
            flow = state.role === "defense" ? "defense_only" : "offense_only";
          }
          if (flow !== "two_way" && flow !== "offense_only" && flow !== "defense_only") return;
          state.matchFlow = flow;
          if (state.appMode === "game" && !state.fullCourt && state.scenario === "match") {
            const targetRole = flow === "defense_only" ? "defense" : flow === "offense_only" ? "offense" : state.role;
            if (targetRole !== state.role) {
              state.role = targetRole;
              state.matchOriginRole = targetRole;
              state.mainMode = targetRole;
              resetScenario();
              renderFrame();
              return;
            }
          }
          syncAllDOM();
        }

        function setStartSpot(spotKey) {
          if (!START_SPOTS[spotKey]) return;
          state.startSpot = spotKey;
          resetScenario();
          renderFrame();
        }

        function setSpeed(mult) {
          state.speedScale = mult;
          syncAllDOM();
        }

        function togglePause() {
          state.paused = !state.paused;
          syncAllDOM();
          renderFrame();
        }

        function applyKeyCodeState(code, isDown) {
          if (code === "KeyW" || code === "ArrowUp") keys.W = isDown;
          else if (code === "KeyS" || code === "ArrowDown") keys.S = isDown;
          else if (code === "KeyA" || code === "ArrowLeft") keys.A = isDown;
          else if (code === "KeyD" || code === "ArrowRight") keys.D = isDown;
          else if (code === "ShiftLeft" || code === "ShiftRight") keys.Shift = isDown;
          updatePassTarget();
          syncKeycapsDOM();
        }

        window.addEventListener(
          "pointerdown",
          () => {
            if (state.soundEnabled) SoundEngine.unlock();
          },
          { passive: true }
        );

        window.addEventListener("keydown", (e) => {
          if (["Space", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
            e.preventDefault();
          }
          if (state.soundEnabled && e.code !== "KeyM") SoundEngine.unlock();
          applyKeyCodeState(e.code, true);

          if (e.repeat) return;
          if (e.code === "Space") handleSpaceAction();
          else if (e.code === "KeyE") handleSecondaryAction();
          else if (e.code === "Digit1" || e.code === "Numpad1") executeUserPass(1);
          else if (e.code === "Digit2" || e.code === "Numpad2") executeUserPass(2);
          else if (e.code === "Digit3" || e.code === "Numpad3") executeUserPass(3);
          else if (e.code === "Digit4" || e.code === "Numpad4") executeUserPass(4);
          else if (e.code === "KeyV") cycleCameraPreset();
          else if (e.code === "KeyQ") rotateCameraBy(-Math.PI / 6);
          else if (e.code === "KeyC") rotateCameraBy(Math.PI / 6);
          else if (e.code === "Minus" || e.code === "NumpadSubtract") adjustUserZoom(-0.12);
          else if (e.code === "Equal" || e.code === "NumpadAdd") adjustUserZoom(0.12);
          else if (e.code === "Digit0" || e.code === "Numpad0") setUserZoom(1.0);
          else if (e.code === "KeyM") toggleSound();
          else if (e.code === "KeyP") togglePause();
          else if (e.code === "KeyR") {
            if (state.playPhase === "match_over") startNewMatchGame();
            else {
              resetScenario();
              renderFrame();
            }
          } else if (e.code === "Tab") cycleViewMode();
        });

        window.addEventListener("keyup", (e) => {
          applyKeyCodeState(e.code, false);
        });

        window.addEventListener("blur", () => {
          keys.W = keys.A = keys.S = keys.D = keys.Shift = false;
          state.cam.dragging = false;
          canvasA.classList.remove("dragging");
          syncKeycapsDOM();
        });

        window.addEventListener("resize", () => {
          resizeCanvases();
          renderFrame();
        });

        // Horizontal Pointer Drag on canvasA to Orbit 3D Camera 360 Degrees (Even While Paused!)
        canvasA.addEventListener("pointerdown", (ev) => {
          if (state.viewMode !== "b") setInputSurface("3d");
          state.cam.dragging = true;
          state.cam.dragLastX = ev.clientX;
          canvasA.classList.add("dragging");
          if (canvasA.setPointerCapture) {
            try {
              canvasA.setPointerCapture(ev.pointerId);
            } catch (_) {}
          }
        });

        const panelAEl = document.getElementById("panelA");
        const panelBEl = document.getElementById("panelB");
        if (panelAEl) {
          panelAEl.addEventListener("pointerdown", () => {
            if (state.viewMode === "both") setInputSurface("3d");
          });
        }
        if (panelBEl) {
          panelBEl.addEventListener("pointerdown", () => {
            if (state.viewMode === "both") setInputSurface("board");
          });
        }
        canvasB.addEventListener("pointerdown", () => {
          if (state.viewMode === "both") setInputSurface("board");
        });
        canvasA.addEventListener("pointermove", (ev) => {
          if (!state.cam.dragging) return;
          const dx = ev.clientX - state.cam.dragLastX;
          state.cam.dragLastX = ev.clientX;
          if (Math.abs(dx) > 0.2) {
            state.cam.preset = "free";
            state.cam.targetYaw = wrapAngle(state.cam.yaw - dx * 0.0085);
            state.cam.yaw = state.cam.targetYaw;
            updateCamera(0, true);
            syncAllDOM();
            renderFrame();
          }
        });
        const endCamDrag = () => {
          state.cam.dragging = false;
          canvasA.classList.remove("dragging");
        };
        canvasA.addEventListener("pointerup", endCamDrag);
        canvasA.addEventListener("pointercancel", endCamDrag);
        canvasA.addEventListener(
          "wheel",
          (ev) => {
            if (ev.preventDefault) ev.preventDefault();
            adjustUserZoom(ev.deltaY < 0 ? 0.08 : -0.08);
          },
          { passive: false }
        );

        function bindClick(el, fn) {
          if (!el) return;
          el.addEventListener("click", (ev) => {
            fn(ev);
            el.blur();
          });
        }

        bindClick(document.getElementById("btnAppPractice"), () => setAppMode("practice"));
        bindClick(document.getElementById("btnAppGame"), () => setAppMode("game"));
        bindClick(document.getElementById("btnModeFullCourt"), () => setGameType("full_court"));
        bindClick(document.getElementById("btnGameHalfCourt"), () => setGameType("half_court"));
        bindClick(document.getElementById("btnRoleOffense"), () => setRole("offense"));
        bindClick(document.getElementById("btnRoleDefense"), () => setRole("defense"));
        bindClick(document.getElementById("btnFlowTwoWay"), () => setMatchFlow("two_way"));
        bindClick(document.getElementById("btnFlowOffOnly"), () => setMatchFlow("offense_only"));
        bindClick(document.getElementById("btnFlowDefOnly"), () => setMatchFlow("defense_only"));

        document.querySelectorAll(".view-mode-btn").forEach((btn) => {
          bindClick(btn, () => setViewMode(btn.getAttribute("data-view")));
        });

        document.querySelectorAll(".diff-btn").forEach((btn) => {
          bindClick(btn, () => setDifficulty(btn.getAttribute("data-diff")));
        });

        document.querySelectorAll(".cam-btn").forEach((btn) => {
          bindClick(btn, () => setCameraPreset(btn.getAttribute("data-cam")));
        });
        bindClick(document.getElementById("btnCamLeft"), () => rotateCameraBy(-Math.PI / 6));
        bindClick(document.getElementById("btnCamRight"), () => rotateCameraBy(Math.PI / 6));
        bindClick(document.getElementById("btnZoomOut"), () => adjustUserZoom(-0.12));
        bindClick(document.getElementById("btnZoomIn"), () => adjustUserZoom(0.12));
        bindClick(document.getElementById("btnSoundToggle"), () => toggleSound());

        document.querySelectorAll(".scenario-btn").forEach((btn) => {
          bindClick(btn, () => setScenario(btn.getAttribute("data-scenario"), btn.getAttribute("data-side")));
        });

        document.querySelectorAll(".spot-btn").forEach((btn) => {
          bindClick(btn, () => setStartSpot(btn.getAttribute("data-spot")));
        });

        document.querySelectorAll(".tut-step-pill").forEach((pill) => {
          bindClick(pill, () => setTutorialStep(parseInt(pill.getAttribute("data-tut-step"), 10)));
        });

        bindClick(document.getElementById("btnTutPrev"), () => {
          setTutorialStep(Math.max(1, state.tutorial.step - 1));
        });
        bindClick(document.getElementById("btnTutNext"), () => {
          setTutorialStep(Math.min(4, state.tutorial.step + 1));
        });
        bindClick(document.getElementById("btnTutFinishToMain"), () => {
          setMainMode("full_court");
        });

        bindClick(document.getElementById("btnHintToggle"), () => {
          state.showHints = !state.showHints;
          syncAllDOM();
          renderFrame();
        });

        document.querySelectorAll(".target-btn").forEach((btn) => {
          bindClick(btn, () => setTargetScore(btn.getAttribute("data-target")));
        });
        bindClick(document.getElementById("btnNewMatch"), () => startNewMatchGame());
        bindClick(document.getElementById("btnRematchWin"), () => startNewMatchGame());

        bindClick(document.getElementById("btnPause"), () => togglePause());
        bindClick(document.getElementById("btnReset"), () => {
          if (state.fullCourt || state.scenario === "match") {
            startNewMatchGame();
            return;
          }
          resetScenario();
          renderFrame();
        });
        bindClick(document.getElementById("keycapSpace"), () => handleSpaceAction());
        bindClick(document.getElementById("keycapE"), () => handleSecondaryAction());

        document.querySelectorAll("[data-hold]").forEach((btn) => {
          const code = btn.getAttribute("data-hold");
          const press = (ev) => {
            ev.preventDefault();
            applyKeyCodeState(code, true);
          };
          const release = (ev) => {
            ev.preventDefault();
            applyKeyCodeState(code, false);
          };
          btn.addEventListener("pointerdown", press);
          btn.addEventListener("pointerup", release);
          btn.addEventListener("pointerleave", release);
          btn.addEventListener("pointercancel", release);
        });

        /* =====================================================================
         * 12. Main Loop & Deterministic Verification Interface
         * ===================================================================== */
        function renderFrame() {
          renderPseudo3DA();
          renderTopDownB();
        }

        function getCachedStackStats() {
          return {
            initialBakeMs,
            cachedFrames: stackFrameCache.size,
            cachedModels: voxelModelCache.size,
            ballSpinFrames: ballFrameCanvases.length,
            stackLayers: STACK_LAYERS,
            stackAngles: STACK_ANGLES,
          };
        }

        initSpriteStackEngine();
        setDifficulty("easy");
        resetScenario();
        renderFrame();

        let lastTs = performance.now();
        function frameLoop(now) {
          const dt = Math.max(0, (now - lastTs) / 1000);
          lastTs = now;
          stepSimulation(dt);
          renderFrame();
          requestAnimationFrame(frameLoop);
        }
        requestAnimationFrame(frameLoop);

        window.SpacingCoach = {
          COURT,
          DIFFICULTY_PROFILES,
          CAMERA_PRESETS,
          SoundEngine,
          toggleSound,
          SPR_W,
          SPR_H,
          STACK_W,
          STACK_H,
          STACK_LAYERS,
          STACK_ANGLES,
          state,
          keys,
          setAppMode,
          setGameType,
          setMainMode,
          setRole,
          setScenario,
          setTutorialStep,
          setMatchFlow,
          setTargetScore,
          startNewMatchGame,
          resetMatchScores,
          setStartSpot,
          setViewMode,
          setInputSurface,
          getBoardInputYaw,
          getActiveInputYaw,
          isBoardInputActive,
          setDifficulty,
          setCameraPreset,
          cycleCameraPreset,
          rotateCameraBy,
          getEffectiveZoom,
          setUserZoom,
          adjustUserZoom,
          getUserAssignedOffenseMan,
          computeLooseBallDropSpot,
          measurePlayerScreenHeight,
          setSpeed,
          togglePause,
          resetScenario,
          stepSimulation,
          handleSpaceAction,
          handleSecondaryAction,
          handleManualPassRequest: handleSecondaryAction,
          executeUserPass,
          startTeamPass,
          updatePassTarget,
          switchDefenderToBall,
          isUserOnDefenseNow,
          isOpponentTeamSide,
          tickAllPlayerTimers,
          classifyShotZone,
          computeShotMakeOutcome,
          startShot,
          solveTwoBoneIK3D,
          solvePlayerRig3D,
          facingToStackAngleIdx,
          getOrBakePlayerStackTile,
          bakePlayerStackPixels,
          getCachedStackStats,
          project3D,
          resolveLabelCollisions,
          renderFrame,
        };
      })();
    </script>
  </body>
</html>
