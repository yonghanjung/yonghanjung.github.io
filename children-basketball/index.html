              moveAgentToward(state.offense[1], 0.3, 7.5, 3.2, dt);
            } else if (!state.ball.inFlight && state.ball.holderIdx === 0 && state.playPhase === 'live') {
              state.phaseTimer += dt;
              state.ball.gatherTimer = 0.8;
              const dMe = dist2(state.defense[0], state.offense[0]);
              if (dMe < 2.3 && state.defense[0].contestTimer > 0) {
                state.ball.contestedByUser = true;
                startShot('offense', 0, false);
              } else if (state.phaseTimer > 1.85) {
                startShot('offense', 0, true);
              }
            }
          }
          for (let i = 2; i < state.offense.length; i++) {
            moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.4, dt);
          }
          return;
        }

        // 2) User on Offense (Drills & 5v5 Match Offense)
        if (state.role === 'offense') {
          const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;
          if (iHaveBall) {
            for (let i = 1; i < state.offense.length; i++) {
              const mate = state.offense[i];
              let tx = mate.homeX;
              let ty = mate.homeY;
              if (hypot2(mate.x - state.offense[0].x, mate.y - state.offense[0].y) < 3.8) {
                tx = clamp(mate.homeX + (mate.homeX >= 0 ? 1.0 : -1.0), -6.7, 6.7);
                ty = clamp(mate.homeY + 1.0, 1.8, 9.5);
              }
              moveAgentToward(mate, tx, ty, 3.4, dt);
              mate.gazeAngle = Math.atan2(state.offense[0].y - mate.y, state.offense[0].x - mate.x);
            }
            return;
          }

          if (state.scenario === 'relocation') {
            const wave = Math.sin(state.simTime * 1.15);
            const driveDepth = state.simTime > 0.45 ? 1.0 : state.simTime / 0.45;
            moveAgentToward(pg, lerp(0.0, side * 1.95, driveDepth), lerp(8.75, 3.55 + (wave > 0 ? wave * 0.45 : 0), driveDepth), 3.7, dt);
            pg.gazeAngle = Math.atan2(COURT.rimY - pg.y, COURT.rimX - pg.x);
          } else if (state.scenario === 'cut') {
            moveAgentToward(pg, side * 2.2 + Math.sin(state.simTime * 1.8) * 0.85, 8.15 + Math.cos(state.simTime * 1.5) * 0.35, 2.8, dt);
            pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
          } else if (state.scenario === 'vcut') {
            moveAgentToward(pg, side * 1.35 + Math.sin(state.simTime * 1.5) * 0.55, 8.55, 2.5, dt);
            pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
          } else if (state.scenario === 'match') {
            const holderIdx = state.ball.holderIdx;
            const cycle = state.simTime % 5.6;
            for (let i = 1; i < state.offense.length; i++) {
              const mate = state.offense[i];
              let tx = mate.homeX;
              let ty = mate.homeY;
              if (i === holderIdx && !state.ball.inFlight && cycle > 1.4 && cycle < 4.2) {
                tx = lerp(mate.homeX, 0, 0.55);
                ty = lerp(mate.homeY, 3.8, 0.55);
              }
              moveAgentToward(mate, tx, ty, 3.4, dt);
              mate.gazeAngle = Math.atan2(COURT.rimY - mate.y, COURT.rimX - mate.x);
            }
            if (!state.ball.inFlight && state.ball.holderIdx !== 0 && Math.floor((state.simTime - dt) / 3.4) < Math.floor(state.simTime / 3.4)) {
              if (!state.lane.open) {
                const nextIdx = (state.ball.holderIdx % 4) + 1;
                startPass(state.ball.holderIdx, nextIdx);
              }
            }
            return;
          }

          for (let i = 2; i < state.offense.length; i++) {
            const mate = state.offense[i];
            moveAgentToward(mate, mate.homeX, mate.homeY, 2.8, dt);
            mate.gazeAngle = Math.atan2(state.ball.y - mate.y, state.ball.x - mate.x);
          }
          return;
        }

        // 3) User on Defense! (def_onball, defense_help, def_cut, and 5v5 MATCH Defense!)
        if (state.playPhase !== 'live') return;

        if (state.scenario === 'def_onball') {
          updateDefenseOnBallDrillAI(dt);
        } else if (state.scenario === 'def_cut') {
          updateDefenseStopCutDrillAI(dt);
        } else if (state.scenario === 'match') {
          updateDefenseMatchCPUOffenseAI(dt);
        } else {
          updateDefenseHelpDrillAI(dt);
        }
      }

      /* Defense Drill 1: 1v1 On-Ball Dribbler AI (Hesitation -> Crossover -> Drive / Pull-up) */
      function updateDefenseOnBallDrillAI(dt) {
        const me = state.defense[0];
        const bh = state.offense[0];
        const dd = state.defDrill;
        dd.timer += dt;

        for (let i = 1; i < state.offense.length; i++) {
          moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.2, dt);
        }

        if (dd.phase === 'probe') {
          const swayX = Math.sin(dd.timer * 3.0) * 1.75;
          moveAgentToward(bh, swayX, 7.85, 3.5, dt);
          bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);
          if (dd.timer >= 1.15) {
            dd.phase = 'hesi_cross';
            dd.timer = 0;
            dd.driveSide = me.x >= bh.x ? -1 : 1; // Attack weak foot!
            spawnDust(bh.x, bh.y, 4);
            setCoachMessage('warn', '💨', 'CROSSOVER! SLIDE!', 0.9);
          }
        } else if (dd.phase === 'hesi_cross') {
          // If user over-sprinted far to the wrong side, brief ankle-stumble!
          if (!dd.fakeDone && keys.Shift && (me.x - bh.x) * dd.driveSide < -0.95) {
            dd.fakeDone = true;
            me.offBalanceTimer = 0.45;
            setCoachMessage('warn', '⚡', 'FAKED! RECOVER!', 0.8);
          }
          const targetX = dd.driveSide * 2.15;
          const targetY = 3.2;
          moveAgentToward(bh, targetX, targetY, 4.65, dt);
          bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);

          // Check if user walled off the driving lane!
          const toRimX = COURT.rimX - bh.x;
          const toRimY = COURT.rimY - bh.y;
          const seg = pointToSegmentInfo(me.x, me.y, bh.x, bh.y, bh.x + toRimX, bh.y + toRimY);
          const cutOff = seg.projT > 0.05 && seg.projT < 0.75 && seg.dist < 1.15;

          if (cutOff && dd.timer > 0.45) {
            dd.phase = 'pullup';
            dd.timer = 0;
            state.ball.gatherTimer = 0.85;
            setCoachMessage('good', '🖐️', 'STOPPED! HANDS UP!', 0.8);
          } else if (hypot2(bh.x - COURT.rimX, bh.y - COURT.rimY) < 1.65 || dd.timer > 1.85) {
            dd.phase = 'pullup';
            dd.timer = 0;
            state.ball.gatherTimer = 0.65;
            setCoachMessage('warn', '🚨', 'HANDS UP! SPACE!', 0.6);
          }
        } else if (dd.phase === 'pullup') {
          moveAgentToward(bh, bh.x, bh.y, 1.0, dt);
          bh.gazeAngle = Math.atan2(COURT.rimY - bh.y, COURT.rimX - bh.x);
          const dMe = dist2(me, bh);
          if (dMe < 2.35 && me.contestTimer > 0) {
            state.ball.contestedByUser = true;
            startShot('offense', 0, false);
          } else if (dd.timer > 0.80) {
            const contested = dMe < 1.65 && me.contestTimer > 0;
            startShot('offense', 0, !contested);
          }
        }
      }

      /* Defense Drill 2: Help Triangle & Closeout */
      function updateDefenseHelpDrillAI(dt) {
        const spot = START_SPOTS[state.startSpot];
        const side = spot.side;
        const myDef = state.defense[0];
        const myMan = state.offense[0];
        const handler = state.offense[1];

        const hTargetX = -side * 2.2 + Math.sin(state.simTime * 1.6) * 0.9;
        const hTargetY = 7.4 - Math.min(1.6, state.simTime * 0.35);

        const distMeToBall = hypot2(myDef.x - handler.x, myDef.y - handler.y);
        const distMeToMan = hypot2(myDef.x - myMan.x, myDef.y - myMan.y);
        const distMeToIdeal = hypot2(myDef.x - state.helpTriangle.idealX, myDef.y - state.helpTriangle.idealY);
        state.helpTriangle.distToIdeal = distMeToIdeal;

        if (!state.ball.inFlight && state.ball.holderIdx === 1) {
          if (distMeToBall < 2.65 && distMeToMan > 3.6) {
            state.helpTriangle.mistakeTimer += dt;
            state.helpTriangle.mistakeType = 'ball_watch';
            moveAgentToward(myMan, side * 1.6, 2.2, 5.2, dt);
            if (state.helpTriangle.mistakeTimer > 0.45) {
              state.helpTriangle.passTriggered = true;
              startPass(1, 0);
              setCoachMessage('warn', '👀', 'BALL WATCH! RUN BACK!', 1.5);
            }
          } else if (distMeToMan < 1.35 && myDef.y > 1.5 && Math.abs(myDef.x) > 4.3 && state.simTime > 1.8) {
            state.helpTriangle.mistakeTimer += dt;
            state.helpTriangle.mistakeType = 'no_help';
            moveAgentToward(handler, -side * 0.55, 2.05, 5.1, dt);
            if (hypot2(handler.x - COURT.rimX, handler.y - COURT.rimY) < 1.35) {
              startShot('offense', 1, true);
            }
            return;
          } else {
            state.helpTriangle.mistakeTimer = Math.max(0, state.helpTriangle.mistakeTimer - dt);
            moveAgentToward(handler, hTargetX, hTargetY, 3.0, dt);

            if (distMeToIdeal < 1.65) {
              state.helpTriangle.goodHoldTimer += dt;
              if (state.helpTriangle.goodHoldTimer > 1.8 && !state.helpTriangle.passTriggered) {
                state.helpTriangle.passTriggered = true;
                startPass(1, 0);
                setCoachMessage('good', '🏃', 'CLOSEOUT! SPACE!', 1.8);
              }
            }
            moveAgentToward(myMan, myMan.homeX + Math.sin(state.simTime * 2.1) * 0.4, myMan.homeY + Math.cos(state.simTime * 1.7) * 0.5, 2.6, dt);
          }
        } else if (!state.ball.inFlight && state.ball.holderIdx === 0) {
          state.phaseTimer += dt;
          state.ball.gatherTimer = 0.8;
          myMan.gazeAngle = Math.atan2(COURT.rimY - myMan.y, COURT.rimX - myMan.x);
          if (distMeToMan < 2.25 && myDef.contestTimer > 0) {
            state.ball.contestedByUser = true;
            startShot('offense', 0, false);
          } else if (state.phaseTimer > 1.65) {
            const closeEnough = distMeToMan < 1.55 && myDef.contestTimer > 0;
            startShot('offense', 0, !closeEnough);
          }
        }

        for (let i = 2; i < state.offense.length; i++) {
          moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.4, dt);
        }
      }

      /* Defense Drill 3: Stop Backdoor & V-Cut */
      function updateDefenseStopCutDrillAI(dt) {
        const spot = START_SPOTS[state.startSpot];
        const side = spot.side;
        const me = state.defense[0];
        const cutter = state.offense[0];
        const pg = state.offense[1];
        const dd = state.defDrill;
        dd.timer += dt;

        moveAgentToward(pg, side * 2.0 + Math.sin(state.simTime * 1.8) * 0.6, 8.2, 2.6, dt);
        pg.gazeAngle = Math.atan2(cutter.y - pg.y, cutter.x - pg.x);
        for (let i = 2; i < state.offense.length; i++) {
          moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.3, dt);
        }

        if (!state.ball.inFlight && state.ball.holderIdx === 1) {
          if (dd.cutStage === 0) {
            // Fake high step toward ball first!
            moveAgentToward(cutter, side * 4.8, 7.0, 2.5, dt);
            if (dd.timer >= 0.85) {
              dd.cutStage = 1;
              dd.timer = 0;
              spawnDust(cutter.x, cutter.y, 5);
              setCoachMessage('warn', '⚡', 'BACKDOOR CUT! BLOCK IT!', 1.2);
            }
          } else if (dd.cutStage === 1) {
            // Sudden burst to the rim!
            const cutX = side * 1.1;
            const cutY = 2.15;
            moveAgentToward(cutter, cutX, cutY, 5.1, dt);

            const seg = pointToSegmentInfo(me.x, me.y, pg.x, pg.y, cutter.x, cutter.y);
            const bodyDenied = dist2(me, cutter) < 1.45 && me.y <= cutter.y + 0.6;
            const laneDenied = seg.projT > 0.2 && seg.projT < 0.95 && seg.dist < 1.05;

            if (hypot2(cutter.x - cutX, cutter.y - cutY) < 1.5 || dd.timer > 1.15) {
              if (bodyDenied || laneDenied) {
                // Kid denied the cut! Passer forced to throw contested or reset -> Defense Wins!
                state.ball.contestedByUser = true;
                spawnSparkles(me.x, me.y, '#22c55e', 14);
                state.matchScore.stops += 1;
                state.playPhase = 'celebrate';
                state.phaseTimer = 0;
                setCoachMessage('celebrate', '🛑', 'CUT DENIED!!', 2.0);
              } else {
                // Cutter got behind user -> pass thrown (kid can still try to steal or contest!)
                dd.cutStage = 2;
                startPass(1, 0);
              }
            }
          }
        } else if (!state.ball.inFlight && state.ball.holderIdx === 0) {
          state.phaseTimer += dt;
          state.ball.gatherTimer = 0.5;
          if (dist2(me, cutter) < 2.2 && me.contestTimer > 0) {
            state.ball.contestedByUser = true;
            startShot('offense', 0, false);
          } else if (state.phaseTimer > 0.65) {
            startShot('offense', 0, true);
          }
        }
      }

      /* Full 5v5 Match CPU Offense AI (Passes, Cuts, Drives, Kick-Outs & Jumpers!) */
      function updateDefenseMatchCPUOffenseAI(dt) {
        const dd = state.defDrill;
        dd.timer += dt;
        dd.actionTimer += dt;

        if (state.ball.inFlight) return;

        const holderIdx = state.ball.holderIdx;
        const holder = state.offense[holderIdx];
        const me = state.defense[0];

        // Off-ball movement: periodically send an off-ball wing on a backdoor cut
        if (dd.cutterIdx === -1 && dd.timer > 1.6) {
          dd.cutterIdx = (holderIdx + 2) % 5;
          if (dd.cutterIdx === holderIdx) dd.cutterIdx = (holderIdx + 1) % 5;
          dd.passTimer = 0;
        }

        for (let i = 0; i < state.offense.length; i++) {
          if (i === holderIdx) continue;
          const off = state.offense[i];
          if (i === dd.cutterIdx) {
            moveAgentToward(off, off.homeX >= 0 ? 1.1 : -1.1, 2.2, 4.7, dt);
            if (hypot2(off.x, off.y - 2.2) < 1.6 && dd.timer > 3.2) {
              dd.cutterIdx = -1;
            }
          } else {
            moveAgentToward(off, off.homeX + Math.sin(state.simTime * 1.4 + i) * 0.4, off.homeY, 2.8, dt);
          }
          off.gazeAngle = Math.atan2(holder.y - off.y, holder.x - off.x);
        }

        // Ball-handler decision tree:
        // 1) Check if cutter is wide open for an interior pass
        if (dd.cutterIdx !== -1 && dd.actionTimer > 0.85) {
          const cutter = state.offense[dd.cutterIdx];
          const cutDef = state.defense[dd.cutterIdx];
          const segMe = pointToSegmentInfo(me.x, me.y, holder.x, holder.y, cutter.x, cutter.y);
          if (dist2(cutter, cutDef) > 1.75 && segMe.dist > 1.1 && hypot2(cutter.x, cutter.y - 2.2) < 3.0) {
            dd.actionTimer = 0;
            const target = dd.cutterIdx;
            dd.cutterIdx = -1;
            startPass(holderIdx, target);
            setCoachMessage('warn', '🚨', 'CUT PASS! CONTEST!', 1.0);
            return;
          }
        }

        // 2) If close to basket or open after ball movement, gather & shoot!
        const distRim = hypot2(holder.x - COURT.rimX, holder.y - COURT.rimY);
        let closestDef = 99;
        for (let d = 0; d < state.defense.length; d++) {
          closestDef = Math.min(closestDef, dist2(holder, state.defense[d]));
        }

        if ((distRim < 2.5 && dd.actionTimer > 0.55) || (closestDef > 2.25 && distRim < 7.6 && dd.actionTimer > 1.1) || dd.timer > 6.5) {
          state.ball.gatherTimer += dt;
          moveAgentToward(holder, holder.x, holder.y, 1.0, dt);
          holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);
          if (holderIdx === 0 || dist2(me, holder) < 3.2) {
            setCoachMessage('warn', '🖐️', 'SHOT! HANDS UP!', 0.3);
          }
          if (dist2(me, holder) < 2.35 && me.contestTimer > 0) {
            state.ball.contestedByUser = true;
            state.ball.gatherTimer = 0;
            startShot('offense', holderIdx, false);
            return;
          }
          if (state.ball.gatherTimer >= 0.52) {
            state.ball.gatherTimer = 0;
            const contestedByMe = dist2(me, holder) < 1.85 && me.contestTimer > 0;
            const contestedByAI = holderIdx !== 0 && closestDef < 1.05 && Math.random() < 0.35;
            startShot('offense', holderIdx, !(contestedByMe || contestedByAI));
            return;
          }
          return;
        }

        state.ball.gatherTimer = 0;

        // 3) Drive toward paint; if paint is clogged by help defense, kick out!
        if (dd.actionTimer > 1.0) {
          const driveTx = holder.homeX * 0.25;
          const driveTy = 2.35;
          moveAgentToward(holder, driveTx, driveTy, 4.25, dt);
          holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);

          // Check help defense in paint
          let paintHelpers = 0;
          for (let d = 0; d < state.defense.length; d++) {
            if (d !== holderIdx && dist2(holder, state.defense[d]) < 2.05) {
              paintHelpers++;
            }
          }
          if ((paintHelpers > 0 || (holderIdx === 0 && dist2(holder, me) < 1.18 && me.y < holder.y)) && dd.actionTimer > 1.55) {
            // Kick out to most open teammate!
            let bestMate = (holderIdx + 1) % 5;
            let bestOpen = -1;
            for (let m = 0; m < state.offense.length; m++) {
              if (m === holderIdx) continue;
              const sep = dist2(state.offense[m], state.defense[m]);
              if (sep > bestOpen) {
                bestOpen = sep;
                bestMate = m;
              }
            }
            dd.actionTimer = 0;
            startPass(holderIdx, bestMate);
            if (bestMate === 0) {
              setCoachMessage('warn', '🏃', 'PASS TO YOUR MAN!', 1.1);
            }
          }
        } else {
          moveAgentToward(holder, holder.homeX + Math.sin(state.simTime * 2.4) * 0.7, holder.homeY - 0.3, 3.0, dt);
          holder.gazeAngle = Math.atan2(COURT.rimY - holder.y, COURT.rimX - holder.x);
        }
      }

      function updateDefendersAI(dt) {
        const spot = START_SPOTS[state.startSpot];
        const side = spot.side;

        for (let i = 0; i < state.defense.length; i++) {
          if (state.role === 'defense' && i === 0) {
            continue;
          }

          const def = state.defense[i];
          const man = state.offense[i];

          if (def.offBalanceTimer > 0) def.offBalanceTimer = Math.max(0, def.offBalanceTimer - dt);

          if (def.reactionTimer > 0) {
            def.reactionTimer = Math.max(0, def.reactionTimer - dt);
            def.vx = def.inertiaVx;
            def.vy = def.inertiaVy;
            def.x = clamp(def.x + def.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
            def.y = clamp(def.y + def.vy * dt, 0.55, COURT.length - 0.55);
            def.stridePhase += hypot2(def.vx, def.vy) * dt * 3.5;
            updatePlayerJumpAndPose(def, dt, false, false, false);
            continue;
          }

          let tx = man.x;
          let ty = man.y;
          let maxSpd = 4.65;
          def.ballWatchFactor = 0.25;
          const manHasBall = !state.ball.inFlight && state.ball.holderIdx === i;

          if (i === 0 && state.scenario === 'tutorial') {
            const tut = state.tutorial;
            if (tut.step === 1) {
              tx = lerp(man.x, state.offense[1].x, 0.35);
              ty = lerp(man.y, state.offense[1].y, 0.35);
              def.ballWatchFactor = 0.4;
              def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              maxSpd = 4.5;
            } else if (tut.step === 2) {
              if (manHasBall) {
                const toRimX = COURT.rimX - man.x;
                const toRimY = COURT.rimY - man.y;
                const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                tx = man.x + (toRimX / dRim) * 2.35;
                ty = man.y + (toRimY / dRim) * 2.35;
                maxSpd = 2.4;
                def.ballWatchFactor = 0.0;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              } else {
                const pg = state.offense[1];
                if (dist2(man, pg) < COURT.crowdingDist) {
                  tx = lerp(man.x, pg.x, 0.42);
                  ty = lerp(man.y, pg.y, 0.42);
                  def.ballWatchFactor = 0.45;
                } else {
                  tx = -1.95;
                  ty = 3.35;
                  def.ballWatchFactor = 0.88;
                }
                def.gazeAngle = Math.atan2(pg.y - def.y, pg.x - def.x);
                maxSpd = 4.2;
              }
            } else if (tut.step === 3) {
              if (manHasBall) {
                const toRimX = COURT.rimX - man.x;
                const toRimY = COURT.rimY - man.y;
                const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                tx = man.x + (toRimX / dRim) * 2.1;
                ty = man.y + (toRimY / dRim) * 2.1;
                maxSpd = 2.6;
                def.ballWatchFactor = 0.0;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              } else if (tut.subPhase === '3a_constant') {
                def.paceAdapt = 1.0;
                tx = man.x + 0.45 + man.vx * 0.14;
                ty = man.y - 0.45 + man.vy * 0.14;
                maxSpd = 5.45;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              } else {
                def.ballWatchFactor = 0.92;
                const toBallX = state.ball.x - man.x;
                const toBallY = state.ball.y - man.y;
                const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
                tx = man.x + (toBallX / dBall) * 0.78;
                ty = man.y + (toBallY / dBall) * 0.78;
                maxSpd = def.offBalanceTimer > 0 ? 3.2 : 4.55;
                def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
              }
            } else {
              if (!manHasBall) {
                tx = -2.2;
                ty = 3.5;
                def.ballWatchFactor = 0.85;
                def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
                maxSpd = 3.8;
              } else if (tut.crossoverDone) {
                tx = def.x;
                ty = def.y;
                maxSpd = 1.2;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              } else {
                const toRimX = COURT.rimX - man.x;
                const toRimY = COURT.rimY - man.y;
                const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
                tx = man.x + (toRimX / dRim) * 1.15;
                ty = man.y + (toRimY / dRim) * 1.15;
                maxSpd = 4.9;
                def.ballWatchFactor = 0.0;
                def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
              }
            }
          } else if (i === 0 && state.role === 'offense') {
            if (manHasBall) {
              const toRimX = COURT.rimX - man.x;
              const toRimY = COURT.rimY - man.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              tx = man.x + (toRimX / dRim) * 0.92;
              ty = man.y + (toRimY / dRim) * 0.92;
              maxSpd = def.offBalanceTimer > 0 ? 3.5 : 4.55;
              def.ballWatchFactor = 0.0;
              def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
            } else if (state.scenario === 'relocation') {
              const pg = state.offense[1];
              const pgDriveProgress = clamp((7.5 - pg.y) / 3.6, 0, 1);
              if (dist2(man, pg) < COURT.crowdingDist) {
                tx = lerp(man.x, pg.x, 0.42);
                ty = lerp(man.y, pg.y, 0.42);
                def.ballWatchFactor = 0.45;
              } else {
                tx = lerp(man.x * 0.72, side * 2.05, pgDriveProgress * 0.85);
                ty = lerp(man.y * 0.82, 3.25, pgDriveProgress * 0.85);
                def.ballWatchFactor = pgDriveProgress * 0.88;
              }
              def.gazeAngle = def.ballWatchFactor > 0.5
                ? Math.atan2(pg.y - def.y, pg.x - def.x)
                : Math.atan2(man.y - def.y, man.x - def.x);
              maxSpd = 4.3;
            } else if (state.scenario === 'cut') {
              const watchingBall = state.simTime > 0.65;
              def.ballWatchFactor = watchingBall ? 0.92 : 0.35;
              const isMonotoneMove = state.rhythm.monotoneSprintTime > 0.40 ||
                (hypot2(man.vx, man.vy) > 0.5 && state.rhythm.burstBoostTimer <= 0 && def.offBalanceTimer <= 0);
              def.paceAdapt = isMonotoneMove
                ? Math.min(1.0, def.paceAdapt + dt * 2.2)
                : Math.max(0, def.paceAdapt - dt * 1.5);

              const toBallX = state.ball.x - man.x;
              const toBallY = state.ball.y - man.y;
              const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
              const denyDist = lerp(0.85, 0.52, def.paceAdapt);
              tx = man.x + (toBallX / dBall) * denyDist + man.vx * 0.14 * def.paceAdapt;
              ty = man.y + (toBallY / dBall) * denyDist + man.vy * 0.14 * def.paceAdapt;
              maxSpd = def.offBalanceTimer > 0 ? 3.45 : lerp(4.70, 5.45, def.paceAdapt);
              def.gazeAngle = watchingBall
                ? Math.atan2(state.ball.y - def.y, state.ball.x - def.x)
                : Math.atan2(man.y - def.y, man.x - def.x);
            } else if (state.scenario === 'vcut') {
              const isMonotoneMove = state.rhythm.monotoneSprintTime > 0.40 ||
                (hypot2(man.vx, man.vy) > 0.5 && state.rhythm.burstBoostTimer <= 0 && def.offBalanceTimer <= 0);
              def.paceAdapt = isMonotoneMove
                ? Math.min(1.0, def.paceAdapt + dt * 2.2)
                : Math.max(0, def.paceAdapt - dt * 1.5);
              const toBallX = state.ball.x - man.x;
              const toBallY = state.ball.y - man.y;
              const dBall = Math.max(0.01, hypot2(toBallX, toBallY));
              tx = man.x + (toBallX / dBall) * 0.72 + man.vx * 0.14 * def.paceAdapt;
              ty = man.y + (toBallY / dBall) * 0.72 + man.vy * 0.14 * def.paceAdapt;
              maxSpd = def.offBalanceTimer > 0 ? 3.40 : lerp(4.80, 5.45, def.paceAdapt);
              def.ballWatchFactor = 0.20;
              def.gazeAngle = Math.atan2(man.y - def.y, man.x - def.x);
            } else {
              const distManToBall = hypot2(man.x - state.ball.x, man.y - state.ball.y);
              const helpPull = clamp((distManToBall - 4.0) / 8.0, 0.08, 0.45);
              tx = lerp(man.x, COURT.rimX, 0.22 + helpPull * 0.45);
              ty = lerp(man.y, COURT.rimY + 1.4, 0.22 + helpPull * 0.45);
              def.ballWatchFactor = helpPull * 1.5;
              maxSpd = def.offBalanceTimer > 0 ? 3.55 : 4.65;
              def.gazeAngle = def.ballWatchFactor > 0.5
                ? Math.atan2(state.ball.y - def.y, state.ball.x - def.x)
                : Math.atan2(man.y - def.y, man.x - def.x);
            }
          } else {
            // Teammate defenders (in both Offense & Defense modes)
            const toRimX = COURT.rimX - man.x;
            const toRimY = COURT.rimY - man.y;
            const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
            const cushion = manHasBall ? 1.05 : 1.25;
            tx = man.x + (toRimX / dRim) * cushion;
            ty = man.y + (toRimY / dRim) * cushion;
            if (!manHasBall && state.role === 'defense' && state.scenario === 'match') {
              tx = lerp(tx, COURT.rimX, 0.18);
              ty = lerp(ty, COURT.rimY + 1.4, 0.18);
            }
            maxSpd = 4.15;
            def.gazeAngle = Math.atan2(state.ball.y - def.y, state.ball.x - def.x);
          }

          moveAgentToward(def, tx, ty, maxSpd, dt);
        }
      }

      /* =====================================================================
       * 8. Passing Lanes, Steals, Contests, Shots & 2-Way Match Transitions
       * ===================================================================== */
      function startPass(fromIdx, toIdx) {
        const sender = state.offense[fromIdx];
        const receiver = state.offense[toIdx];
        state.ball.inFlight = true;
        state.ball.flightType = 'pass';
        state.ball.fromX = sender.x;
        state.ball.fromY = sender.y;
        state.ball.fromZ = 1.25;
        state.ball.toX = clamp(receiver.x + receiver.vx * 0.16, -COURT.halfW + 0.5, COURT.halfW - 0.5);
        state.ball.toY = clamp(receiver.y + receiver.vy * 0.16, 0.7, COURT.length - 0.6);
        state.ball.toZ = 1.25;
        state.ball.targetIdx = toIdx;
        state.ball.t = 0;
        state.ball.gatherTimer = 0;
        state.ball.trail = [];
        const d = hypot2(state.ball.toX - sender.x, state.ball.toY - sender.y);
        state.ball.duration = clamp(d / 15.0, 0.24, 0.50);
        state.playPhase = 'pass_flight';
      }

      function startShot(team, shooterIdx, willMake) {
        const shooter = team === 'offense' ? state.offense[shooterIdx] : state.defense[shooterIdx];
        triggerJump(shooter, 4.0);
        shooter.shootFollowTimer = 0.85;

        state.ball.inFlight = true;
        state.ball.flightType = 'shot';
        state.ball.shooterTeam = team;
        state.ball.fromX = shooter.x;
        state.ball.fromY = shooter.y;
        state.ball.fromZ = 2.15;
        state.ball.toX = willMake ? COURT.rimX : COURT.rimX + (shooter.x >= 0 ? 0.38 : -0.38);
        state.ball.toY = willMake ? COURT.rimY : COURT.rimY + 0.26;
        state.ball.toZ = COURT.rimZ;
        state.ball.t = 0;
        state.ball.gatherTimer = 0;
        state.ball.trail = [];
        const d = hypot2(shooter.x - COURT.rimX, shooter.y - COURT.rimY);
        state.ball.duration = clamp(0.48 + d * 0.055, 0.50, 0.92);
        state.ball.shotMake = willMake;
        state.playPhase = 'shot_flight';
      }

      function triggerUserSteal() {
        const me = state.defense[0];
        state.ball.inFlight = false;
        state.ball.flightType = 'none';
        state.ball.x = me.x;
        state.ball.y = me.y;
        state.ball.z = 1.15;
        state.ball.contestedByUser = true;
        state.matchScore.stops += 1;
        state.fx.crowdCheerTimer = 1.2;
        spawnSparkles(me.x, me.y, '#facc15', 18);

        if (state.scenario === 'learn_d' && state.tutorial.step === 4) {
          state.tutorial.completedSteps[4] = true;
          state.tutorial.subPhase = 'graduated';
          state.tutorial.highlightKeys = [];
          state.playPhase = 'live';
          setCoachMessage('celebrate', '🏆', 'DEFENSE MASTER!!', 3.5);
          syncAllDOM();
          return;
        }

        state.playPhase = 'celebrate';
        state.phaseTimer = 0;
        setCoachMessage('celebrate', '⚡', 'STEAL!! GREAT D!', 2.0);
        syncAllDOM();
      }

      function evaluateSpacingAndLane(dt) {
        const me = state.offense[0];
        const myDef = state.defense[0];
        state.lane.mySeparation = dist2(me, myDef);

        let minMateDist = 99;
        let crowdedIdx = -1;
        for (let i = 1; i < state.offense.length; i++) {
          const d = dist2(me, state.offense[i]);
          if (d < minMateDist) {
            minMateDist = d;
            if (d < COURT.crowdingDist) crowdedIdx = i;
          }
        }
        state.lane.minTeammateDist = minMateDist;
        state.lane.crowdedTeammateIdx = crowdedIdx;

        if (state.role === 'defense') {
          const dTarget = hypot2(state.defense[0].x - state.targetSpot.x, state.defense[0].y - state.targetSpot.y);
          state.helpTriangle.distToIdeal = dTarget;
          state.lane.open = dTarget < 1.55;
          return;
        }

        if (state.ball.inFlight || state.ball.holderIdx === 0) {
          state.lane.open = false;
          state.lane.openTimer = 0;
          state.lane.blockerIdx = -1;
          return;
        }

        const passer = state.offense[state.ball.holderIdx];
        let blockerIdx = -1;
        let blockX = 0;
        let blockY = 0;

        for (let i = 0; i < state.defense.length; i++) {
          const def = state.defense[i];
          const seg = pointToSegmentInfo(def.x, def.y, passer.x, passer.y, me.x, me.y);
          if (i === state.ball.holderIdx) {
            if (seg.projT > 0.36 && seg.projT < 0.92 && seg.dist < 0.42) {
              blockerIdx = i;
              blockX = seg.cx;
              blockY = seg.cy;
              break;
            }
            continue;
          }
          const blockRadius = i === 0 ? 0.88 : 0.78;
          if (seg.projT > 0.14 && seg.projT < 0.96 && seg.dist < blockRadius) {
            blockerIdx = i;
            blockX = seg.cx;
            blockY = seg.cy;
            break;
          }
        }

        if (blockerIdx === -1 && state.lane.mySeparation < 1.12 && myDef.offBalanceTimer <= 0) {
          blockerIdx = 0;
          blockX = myDef.x;
          blockY = myDef.y;
        }

        let scenarioReady = true;
        if (state.scenario === 'tutorial') {
          const tut = state.tutorial;
          if (tut.step === 1) scenarioReady = false;
          else if (tut.step === 2) scenarioReady = hypot2(me.x - (-5.85), me.y - 5.65) < 2.2 && crowdedIdx === -1;
          else if (tut.step === 3) scenarioReady = tut.subPhase === '3b_burst' && tut.copSucceeded && me.y < 5.0;
          else if (tut.step === 4) scenarioReady = tut.subPhase === 'get_ball' && hypot2(me.x - (-5.5), me.y - 4.75) < 1.85;
        } else if (state.scenario === 'relocation') {
          const dTarget = hypot2(me.x - state.targetSpot.x, me.y - state.targetSpot.y);
          if (dTarget > 2.85 || crowdedIdx !== -1) scenarioReady = false;
        } else if (state.scenario === 'cut') {
          if (me.y > 4.65 && state.lane.mySeparation < 1.35) scenarioReady = false;
        } else if (state.scenario === 'vcut') {
          if (state.vcutStage === 1 && state.lane.mySeparation < 1.45) scenarioReady = false;
        }

        const isCrowded = crowdedIdx !== -1;
        state.lane.blockerIdx = blockerIdx;
        state.lane.blockX = blockX;
        state.lane.blockY = blockY;
        state.lane.open = (blockerIdx === -1) && !isCrowded && scenarioReady;

        if (isCrowded && state.playPhase === 'live' && state.scenario !== 'tutorial') {
          state.lane.openTimer = 0;
          setCoachMessage('warn', '⚠️', 'TOO CLOSE! SPREAD!', 0.45);
        } else if (state.lane.open && state.playPhase === 'live') {
          state.lane.openTimer += dt;
          if (state.lane.openTimer >= COURT.autoPassThreshold) {
            state.lane.openTimer = 0;
            startPass(state.ball.holderIdx, 0);
            if (state.scenario !== 'tutorial') {
              setCoachMessage('good', '🟢', 'OPEN! PASS COMING!', 1.3);
            }
          }
        } else {
          state.lane.openTimer = Math.max(0, state.lane.openTimer - dt * 2.0);
          if (state.rhythm.monotoneSprintTime > 1.15 && state.playPhase === 'live' && state.scenario !== 'tutorial') {
            setCoachMessage('warn', '🐢', 'WALK FIRST, THEN SHIFT!', 0.7);
          }
        }
      }

      function handleSpaceAction() {
        if (state.paused) return;
        keys.SpaceFlash = 0.22;

        if (state.role === 'defense') {
          const meDef = state.defense[0];
          meDef.contestTimer = 0.72;
          triggerJump(meDef, 3.45);

          // 1) Mid-air Pass Steal if close to flying pass!
          if (state.ball.inFlight && state.ball.flightType === 'pass') {
            if (hypot2(meDef.x - state.ball.x, meDef.y - state.ball.y) < 1.55) {
              triggerUserSteal();
              return;
            }
          }

          // 2) Contest shooter!
          const holder = state.offense[state.ball.holderIdx];
          const dHolder = dist2(meDef, holder);
          if (!state.ball.inFlight && state.playPhase === 'live' && dHolder < 2.35) {
            if (state.ball.gatherTimer > 0 || state.ball.holderIdx === 0 || state.scenario === 'defense_help' || state.scenario === 'learn_d') {
              state.ball.contestedByUser = true;
              spawnSparkles(meDef.x, meDef.y, '#22c55e', 10);
              startShot('offense', state.ball.holderIdx, false);
              return;
            }
          }
          setCoachMessage('good', '🖐️', 'HANDS UP!', 0.7);
          return;
        }

        // Offense SPACE = Shoot!
        if (state.playPhase !== 'live') return;

        if (state.ball.inFlight || state.ball.holderIdx !== 0) {
          if (state.scenario !== 'tutorial') {
            setCoachMessage('normal', '🟢', 'GET OPEN FIRST!', 0.9);
          }
          return;
        }

        const me = state.offense[0];

        if (state.scenario === 'tutorial') {
          const tut = state.tutorial;
          if (tut.step === 4 && !tut.crossoverDone) {
            setCoachMessage('warn', '💨', 'CROSSOVER FIRST!', 0.9);
            return;
          }
          startShot('offense', 0, true);
          return;
        }

        let closestDefDist = 99;
        let closestDefOffBalance = false;
        for (let i = 0; i < state.defense.length; i++) {
          const d = dist2(me, state.defense[i]);
          if (d < closestDefDist) {
            closestDefDist = d;
            closestDefOffBalance = state.defense[i].offBalanceTimer > 0;
          }
        }

        const distToRim = hypot2(me.x - COURT.rimX, me.y - COURT.rimY);
        let willMake = true;
        if (distToRim <= 3.1 && (closestDefDist >= 1.05 || closestDefOffBalance)) {
          willMake = true;
        } else if (closestDefDist >= 1.45 || closestDefOffBalance) {
          willMake = distToRim < 9.2;
        } else {
          willMake = false;
        }

        startShot('offense', 0, willMake);
      }

      function handleSecondaryAction() {
        if (state.paused || state.playPhase !== 'live') return;
        keys.CallFlash = 0.22;

        if (state.role === 'defense') {
          switchDefenderToBall();
          return;
        }

        if (state.ball.inFlight || state.ball.holderIdx === 0) return;

        if (state.lane.blockerIdx === -1 && state.lane.crowdedTeammateIdx === -1) {
          state.lane.openTimer = 0;
          startPass(state.ball.holderIdx, 0);
          setCoachMessage('good', '🙋', 'NICE CALL! PASS!', 1.1);
        } else if (state.lane.crowdedTeammateIdx !== -1) {
          setCoachMessage('warn', '⚠️', 'TOO CLOSE! SPREAD!', 1.0);
        } else {
          setCoachMessage('warn', '🔴', 'BLOCKED! GET OPEN!', 1.0);
        }
      }

      function updateBallAndPhases(dt) {
        if (!state.ball.inFlight) {
          const holder = state.ball.holderTeam === 'offense'
            ? state.offense[state.ball.holderIdx]
            : state.defense[state.ball.holderIdx];
          const dribbleBounce = state.ball.gatherTimer > 0 ? 0.95 : Math.abs(Math.sin(state.simTime * 8.8));
          const crossShift = (state.role === 'offense' && holder.id === 0 && state.rhythm.crossoverTimer > 0)
            ? Math.sin(state.rhythm.crossoverTimer * 18) * 0.35
            : 0;
          state.ball.x = holder.x + Math.cos(holder.gazeAngle) * 0.28 + crossShift;
          state.ball.y = holder.y + Math.sin(holder.gazeAngle) * 0.28;
          state.ball.z = (holder.jumpZ || 0) + 0.22 + dribbleBounce * 0.82;
          state.ball.spinPhase += dt * 6.0;
          state.ball.trail = [];
        } else {
          state.ball.spinPhase += dt * 15.0;
          state.ball.trail.push({ x: state.ball.x, y: state.ball.y, z: state.ball.z });
          if (state.ball.trail.length > 6) state.ball.trail.shift();

          state.ball.t += dt / state.ball.duration;
          const u = clamp(state.ball.t, 0, 1);

          if (state.ball.flightType === 'pass') {
            const target = state.offense[state.ball.targetIdx];
            state.ball.toX = target.x;
            state.ball.toY = target.y;
            state.ball.x = lerp(state.ball.fromX, state.ball.toX, u);
            state.ball.y = lerp(state.ball.fromY, state.ball.toY, u);
            state.ball.z = 1.22 + Math.sin(u * Math.PI) * 0.42;

            // Automatic Pass Lane Steal if user defender stands right in the pass path!
            if (state.role === 'defense' && u > 0.16 && u < 0.90) {
              const meDef = state.defense[0];
              const stealRadius = meDef.contestTimer > 0 ? 1.40 : 0.88;
              if (hypot2(meDef.x - state.ball.x, meDef.y - state.ball.y) < stealRadius) {
                triggerUserSteal();
                return;
              }
            }

            if (u >= 1) {
              state.ball.inFlight = false;
              state.ball.flightType = 'none';
              state.ball.holderIdx = state.ball.targetIdx;
              state.ball.trail = [];
              state.playPhase = 'live';
              state.phaseTimer = 0;
              if (state.role === 'offense' && state.ball.holderIdx === 0) {
                spawnSparkles(target.x, target.y, '#facc15', 8);
              }
            }
          } else if (state.ball.flightType === 'shot') {
            state.ball.x = lerp(state.ball.fromX, state.ball.toX, u);
            state.ball.y = lerp(state.ball.fromY, state.ball.toY, u);
            const peakZ = 4.55;
            const linearZ = lerp(state.ball.fromZ, state.ball.toZ, u);
            state.ball.z = linearZ + Math.sin(u * Math.PI) * (peakZ - linearZ * 0.65);

            if (u >= 1) {
              state.ball.inFlight = false;
              state.ball.flightType = 'none';
              state.ball.trail = [];

              // Handle Offense Tutorial Shot Completion
              if (state.scenario === 'tutorial') {
                const tut = state.tutorial;
                state.fx.netSwishTimer = 1.05;
                state.fx.crowdCheerTimer = 1.1;
                spawnSparkles(COURT.rimX, COURT.rimY, '#facc15', 18);
                tut.completedSteps[tut.step] = true;
                state.playPhase = 'live';

                if (tut.step === 2) {
                  tut.advanceTimer = 1.35;
                  tut.nextStepAfterAdvance = 3;
                  setCoachMessage('celebrate', '🎉', 'SWISH! NEXT: PACE!', 1.8);
                } else if (tut.step === 3) {
                  tut.advanceTimer = 1.35;
                  tut.nextStepAfterAdvance = 4;
                  setCoachMessage('celebrate', '🔥', 'GREAT CUT! NEXT: CROSS!', 1.8);
                } else if (tut.step === 4) {
                  tut.subPhase = 'graduated';
                  tut.highlightKeys = [];
                  spawnSparkles(state.offense[0].x, state.offense[0].y, '#38bdf8', 18);
                  setCoachMessage('celebrate', '🏆', 'ALL CLEAR! YOU ROCK!', 3.5);
                }
                syncAllDOM();
                return;
              }

              // Handle Defense Tutorial Shot Completion
              if (state.scenario === 'learn_d') {
                const tut = state.tutorial;
                state.playPhase = 'live';
                if (!state.ball.shotMake) {
                  tut.completedSteps[tut.step] = true;
                  state.fx.crowdCheerTimer = 1.1;
                  spawnSparkles(state.defense[0].x, state.defense[0].y, '#22c55e', 16);
                  if (tut.step === 2) {
                    tut.advanceTimer = 1.35;
                    tut.nextStepAfterAdvance = 3;
                    setCoachMessage('celebrate', '🛑', 'GREAT STOP! NEXT: HELP!', 1.8);
                  } else if (tut.step === 4) {
                    tut.subPhase = 'graduated';
                    tut.highlightKeys = [];
                    setCoachMessage('celebrate', '🏆', 'DEFENSE MASTER!!', 3.5);
                  }
                } else {
                  tut.advanceTimer = 1.0;
                  tut.nextStepAfterAdvance = tut.step;
                  setCoachMessage('warn', '🖐️', 'TRY AGAIN! PRESS SPACE!', 1.2);
                }
                syncAllDOM();
                return;
              }

              // Standard Drill or 5v5 Match Resolution
              state.playPhase = 'celebrate';
              state.phaseTimer = 0;

              if (state.role === 'offense') {
                if (state.ball.shotMake) {
                  state.fx.netSwishTimer = 1.05;
                  state.fx.crowdCheerTimer = 1.2;
                  if (state.scenario === 'match') state.matchScore.you += 2;
                  spawnSparkles(COURT.rimX, COURT.rimY, '#facc15', 18);
                  setCoachMessage('celebrate', '🏀', 'SWISH!! +2!', 2.0);
                } else {
                  setCoachMessage('warn', '🧱', 'GUARDED! GET OPEN!', 2.0);
                }
              } else {
                if (!state.ball.shotMake) {
                  state.fx.crowdCheerTimer = 1.2;
                  state.matchScore.stops += 1;
                  spawnSparkles(state.defense[0].x, state.defense[0].y, '#22c55e', 16);
                  setCoachMessage('celebrate', '🛑', 'GREAT STOP!!', 2.0);
                } else {
                  state.fx.netSwishTimer = 0.85;
                  if (state.scenario === 'match') state.matchScore.cpu += 2;
                  const hint = state.helpTriangle.mistakeType === 'ball_watch'
                    ? 'WATCH YOUR MAN!'
                    : (state.helpTriangle.mistakeType === 'no_help' ? 'HELP INSIDE!' : 'HANDS UP FASTER!');
                  setCoachMessage('warn', '🏀', hint, 2.0);
                }
              }
              syncAllDOM();
            }
          }
        }

        if (state.playPhase === 'celebrate') {
          state.phaseTimer += dt;
          if (state.phaseTimer >= 1.85) {
            if (state.scenario === 'match' && state.matchFlow === 'two_way') {
              state.role = state.role === 'offense' ? 'defense' : 'offense';
            }
            resetScenario();
          }
        }
      }

      function spawnSparkles(wx, wy, color, count) {
        for (let i = 0; i < count; i++) {
          const ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
          const spd = 1.2 + Math.random() * 2.4;
          state.fx.sparkles.push({
            x: wx,
            y: wy,
            z: 1.4 + Math.random() * 0.9,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            vz: 1.6 + Math.random() * 2.0,
            life: 0.70,
            maxLife: 0.70,
            color
          });
        }
      }

      function updateEffects(dt) {
        if (keys.SpaceFlash > 0) keys.SpaceFlash = Math.max(0, keys.SpaceFlash - dt);
        if (keys.CallFlash > 0) keys.CallFlash = Math.max(0, keys.CallFlash - dt);
        if (state.fx.netSwishTimer > 0) state.fx.netSwishTimer = Math.max(0, state.fx.netSwishTimer - dt);
        if (state.fx.crowdCheerTimer > 0) state.fx.crowdCheerTimer = Math.max(0, state.fx.crowdCheerTimer - dt);

        const me = getControlledPlayer();
        state.fx.camX = lerp(state.fx.camX, clamp(me.x * 0.42, -3.1, 3.1), clamp(5.8 * dt, 0, 1));

        for (let i = state.fx.sparkles.length - 1; i >= 0; i--) {
          const sp = state.fx.sparkles[i];
          sp.life -= dt;
          if (sp.life <= 0) {
            state.fx.sparkles.splice(i, 1);
            continue;
          }
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.z = Math.max(0.1, sp.z + sp.vz * dt);
          sp.vz -= 6.5 * dt;
        }

        for (let i = state.fx.dusts.length - 1; i >= 0; i--) {
          const du = state.fx.dusts[i];
          du.life -= dt;
          if (du.life <= 0) {
            state.fx.dusts.splice(i, 1);
            continue;
          }
          du.x += du.vx * dt;
          du.y += du.vy * dt;
          du.z += du.vz * dt;
        }
      }

      function stepSimulation(realDt) {
        const clampedReal = Math.min(realDt, 0.05);
        if (state.coach.lockTimer > 0) {
          state.coach.lockTimer = Math.max(0, state.coach.lockTimer - clampedReal);
        }
        if (state.paused) return;

        const dt = clampedReal * state.speedScale;
        state.simTime += dt;

        if (state.playPhase !== 'celebrate') {
          updateUserPlayer(dt);
          updateTargetSpot(dt);
          updateOffenseAI(dt);
          updateDefendersAI(dt);
          evaluateSpacingAndLane(dt);
          updateTutorialLogic(dt);
        }
        updateBallAndPhases(dt);
        updateEffects(dt);
        syncLiveBadgesDOM();
        syncKeycapsDOM();
      }

      /* =====================================================================
       * 9. View B Renderer: Broadcast Tactical Board (Glossy Tokens & Cones)
       * ===================================================================== */
      const canvasA = document.getElementById('canvasA');
      const canvasB = document.getElementById('canvasB');
      const ctxA = canvasA.getContext('2d');
      const ctxB = canvasB.getContext('2d');

      // Dedicated 48x64 High-Detail Outlined Arcade Pixel Sprite Surface
      const SPR_W = 48;
      const SPR_H = 64;
      const spriteCanvas = document.createElement('canvas');
      spriteCanvas.width = SPR_W;
      spriteCanvas.height = SPR_H;
      const sctx = spriteCanvas.getContext('2d');
      const sprBuf = new Uint32Array(SPR_W * SPR_H);
      const sprOutlineBuf = new Uint32Array(SPR_W * SPR_H);
      const hasImageDataSupport = typeof sctx.createImageData === 'function' && typeof sctx.putImageData === 'function';
      const sprImgData = hasImageDataSupport ? sctx.createImageData(SPR_W, SPR_H) : null;

      function resizeCanvases() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const holders = [
          { holder: document.getElementById('holderA'), canvas: canvasA },
          { holder: document.getElementById('holderB'), canvas: canvasB }
        ];
        for (let i = 0; i < holders.length; i++) {
          const h = holders[i].holder;
          const c = holders[i].canvas;
          if (!h || h.offsetParent === null) continue;
          const w = Math.max(240, h.clientWidth);
          const ht = Math.max(220, h.clientHeight);
          if (c.width !== Math.round(w * dpr) || c.height !== Math.round(ht * dpr)) {
            c.width = Math.round(w * dpr);
            c.height = Math.round(ht * dpr);
          }
        }
      }

      function renderTopDownB() {
        if (state.viewMode === 'a') return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const W = canvasB.width / dpr;
        const H = canvasB.height / dpr;
        if (W <= 0 || H <= 0) return;

        ctxB.save();
        ctxB.scale(dpr, dpr);

        ctxB.fillStyle = '#0f172a';
        ctxB.fillRect(0, 0, W, H);

        const pad = 18;
        const scale = Math.min((W - pad * 2) / COURT.width, (H - pad * 2) / COURT.length);
        const courtPxW = COURT.width * scale;
        const courtPxH = COURT.length * scale;
        const originX = (W - courtPxW) * 0.5 + courtPxW * 0.5;
        const originY = (H - courtPxH) * 0.5;

        const toSX = (wx) => originX + wx * scale;
        const toSY = (wy) => originY + wy * scale;

        // Royal Blue Court Apron
        ctxB.fillStyle = '#1e3a8a';
        ctxB.fillRect(toSX(-COURT.halfW) - 8, toSY(0) - 8, courtPxW + 16, courtPxH + 16);

        // Maple Hardwood Planks
        ctxB.fillStyle = '#eec68a';
        ctxB.fillRect(toSX(-COURT.halfW), toSY(0), courtPxW, courtPxH);

        for (let xm = -7; xm <= 6; xm += 1) {
          ctxB.fillStyle = (xm % 2 === 0) ? 'rgba(180, 118, 48, 0.12)' : 'rgba(255, 245, 225, 0.14)';
          ctxB.fillRect(toSX(xm), toSY(0), scale, courtPxH);
        }

        // Inside 3-pt warm highlight & Two-Tone Paint
        const startAng = Math.atan2(COURT.threeBreakY - COURT.rimY, COURT.threeCornerX);
        const endAng = Math.PI - startAng;
        ctxB.fillStyle = 'rgba(255, 250, 235, 0.20)';
        ctxB.beginPath();
        ctxB.moveTo(toSX(-COURT.threeCornerX), toSY(0));
        ctxB.lineTo(toSX(-COURT.threeCornerX), toSY(COURT.threeBreakY));
        ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), COURT.threeRadius * scale, endAng, startAng, true);
        ctxB.lineTo(toSX(COURT.threeCornerX), toSY(0));
        ctxB.closePath();
        ctxB.fill();

        ctxB.fillStyle = '#1d4ed8';
        ctxB.fillRect(toSX(-COURT.paintHalfW), toSY(0), COURT.paintHalfW * 2 * scale, COURT.paintLen * scale);
        ctxB.fillStyle = 'rgba(234, 88, 12, 0.25)';
        ctxB.fillRect(toSX(-COURT.paintHalfW + 0.35), toSY(0), (COURT.paintHalfW * 2 - 0.7) * scale, COURT.paintLen * scale);

        // Crisp Court Lines
        ctxB.strokeStyle = '#ffffff';
        ctxB.lineWidth = 2.2;
        ctxB.strokeRect(toSX(-COURT.halfW), toSY(0), courtPxW, courtPxH);
        ctxB.strokeRect(toSX(-COURT.paintHalfW), toSY(0), COURT.paintHalfW * 2 * scale, COURT.paintLen * scale);

        ctxB.beginPath();
        ctxB.arc(toSX(0), toSY(COURT.paintLen), COURT.ftRadius * scale, 0, Math.PI * 2);
        ctxB.stroke();

        ctxB.beginPath();
        ctxB.arc(toSX(0), toSY(COURT.rimY), COURT.noChargeRadius * scale, 0, Math.PI);
        ctxB.stroke();

        ctxB.beginPath();
        ctxB.arc(toSX(0), toSY(COURT.length), 1.8 * scale, Math.PI, Math.PI * 2);
        ctxB.stroke();

        ctxB.beginPath();
        ctxB.moveTo(toSX(-COURT.threeCornerX), toSY(0));
        ctxB.lineTo(toSX(-COURT.threeCornerX), toSY(COURT.threeBreakY));
        ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), COURT.threeRadius * scale, endAng, startAng, true);
        ctxB.lineTo(toSX(COURT.threeCornerX), toSY(0));
        ctxB.stroke();

        // Backboard & Rim
        ctxB.strokeStyle = '#0f172a';
        ctxB.lineWidth = 3.5;
        ctxB.beginPath();
        ctxB.moveTo(toSX(-COURT.backboardHalfW), toSY(COURT.backboardY));
        ctxB.lineTo(toSX(COURT.backboardHalfW), toSY(COURT.backboardY));
        ctxB.stroke();

        ctxB.strokeStyle = '#ea580c';
        ctxB.lineWidth = 2.8;
        ctxB.beginPath();
        ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), (COURT.rimRadius + state.fx.netSwishTimer * 0.12) * scale, 0, Math.PI * 2);
        ctxB.stroke();

        // Help Triangle Gem Overlay
        if (state.role === 'defense' && state.helpTriangle.show) {
          const meDef = state.defense[0];
          const myMan = state.offense[0];
          ctxB.save();
          ctxB.fillStyle = 'rgba(16, 185, 129, 0.24)';
          ctxB.strokeStyle = '#10b981';
          ctxB.lineWidth = 2.4;
          ctxB.setLineDash([6, 4]);
          ctxB.beginPath();
          ctxB.moveTo(toSX(state.ball.x), toSY(state.ball.y));
          ctxB.lineTo(toSX(myMan.x), toSY(myMan.y));
          ctxB.lineTo(toSX(meDef.x), toSY(meDef.y));
          ctxB.closePath();
          ctxB.fill();
          ctxB.stroke();
          ctxB.restore();
        }

        // Target Spot Circle
        const isTutMode = state.scenario === 'tutorial' || state.scenario === 'learn_d';
        if ((state.showHints || isTutMode) && state.targetSpot.active) {
          const pulse = 1 + Math.sin(state.simTime * 5.2) * 0.07;
          const rx = toSX(state.targetSpot.x);
          const ry = toSY(state.targetSpot.y);
          const rr = state.targetSpot.radius * scale * pulse;
          const isWarnSpot = state.targetSpot.isWarn;

          ctxB.save();
          ctxB.fillStyle = isWarnSpot ? 'rgba(245, 158, 11, 0.28)' : 'rgba(34, 197, 94, 0.28)';
          ctxB.strokeStyle = isWarnSpot ? '#f59e0b' : '#16a34a';
          ctxB.lineWidth = 2.8;
          ctxB.setLineDash([7, 5]);
          ctxB.beginPath();
          ctxB.arc(rx, ry, rr, 0, Math.PI * 2);
          ctxB.fill();
          ctxB.stroke();
          ctxB.setLineDash([]);

          ctxB.fillStyle = '#0f172a';
          ctxB.font = '900 11.5px sans-serif';
          ctxB.textAlign = 'center';
          ctxB.fillText(state.targetSpot.label, rx, ry + 4);
          ctxB.restore();
        }

        // Crowding Warning Ring
        if (state.role === 'offense' && state.lane.crowdedTeammateIdx !== -1) {
          const mate = state.offense[state.lane.crowdedTeammateIdx];
          ctxB.save();
          ctxB.fillStyle = 'rgba(249, 115, 22, 0.24)';
          ctxB.strokeStyle = '#ea580c';
          ctxB.lineWidth = 2.6;
          ctxB.setLineDash([5, 4]);
          ctxB.beginPath();
          ctxB.arc(toSX(mate.x), toSY(mate.y), COURT.crowdingDist * scale, 0, Math.PI * 2);
          ctxB.fill();
          ctxB.stroke();
          ctxB.restore();
        }

        // Defender Vision Cones (±38 deg)
        const coneHalfAng = (38 * Math.PI) / 180;
        for (let i = 0; i < state.defense.length; i++) {
          const d = state.defense[i];
          if (state.role === 'defense' && i === 0) continue;
          const sx = toSX(d.x);
          const sy = toSY(d.y);
          const coneR = (d.ballWatchFactor > 0.55 ? 3.1 : 2.3) * scale;

          ctxB.save();
          ctxB.fillStyle = d.ballWatchFactor > 0.55
            ? 'rgba(250, 204, 21, 0.30)'
            : 'rgba(239, 68, 68, 0.15)';
          ctxB.beginPath();
          ctxB.moveTo(sx, sy);
          ctxB.arc(sx, sy, coneR, d.gazeAngle - coneHalfAng, d.gazeAngle + coneHalfAng);
          ctxB.closePath();
          ctxB.fill();
          ctxB.restore();
        }

        // Flowing Neon Green Passing Lane or Red Blocked X
        if (state.role === 'offense' && !state.ball.inFlight && state.ball.holderIdx !== 0) {
          const passer = state.offense[state.ball.holderIdx];
          const me = state.offense[0];
          const x1 = toSX(passer.x);
          const y1 = toSY(passer.y);
          const x2 = toSX(me.x);
          const y2 = toSY(me.y);

          ctxB.save();
          if (state.lane.open) {
            ctxB.strokeStyle = 'rgba(34, 197, 94, 0.36)';
            ctxB.lineWidth = 9;
            ctxB.beginPath();
            ctxB.moveTo(x1, y1);
            ctxB.lineTo(x2, y2);
            ctxB.stroke();

            ctxB.strokeStyle = '#16a34a';
            ctxB.lineWidth = 3.5;
            ctxB.beginPath();
            ctxB.moveTo(x1, y1);
            ctxB.lineTo(x2, y2);
            ctxB.stroke();

            const ang = Math.atan2(y2 - y1, x2 - x1);
            const flowOffset = (state.simTime * 2.1) % 1;
            ctxB.strokeStyle = '#dcfce7';
            ctxB.lineWidth = 2.6;
            for (let k = 0; k < 4; k++) {
              const f = ((k + flowOffset) / 4) * 0.84 + 0.08;
              ctxB.save();
              ctxB.translate(lerp(x1, x2, f), lerp(y1, y2, f));
              ctxB.rotate(ang);
              ctxB.beginPath();
              ctxB.moveTo(-5, -5);
              ctxB.lineTo(3, 0);
              ctxB.lineTo(-5, 5);
              ctxB.stroke();
              ctxB.restore();
            }
          } else {
            ctxB.strokeStyle = 'rgba(220, 38, 38, 0.78)';
            ctxB.lineWidth = 2.5;
            ctxB.setLineDash([7, 6]);
            ctxB.beginPath();
            ctxB.moveTo(x1, y1);
            ctxB.lineTo(x2, y2);
            ctxB.stroke();
            ctxB.setLineDash([]);

            if (state.lane.blockerIdx !== -1) {
              const bx = toSX(state.lane.blockX);
              const by = toSY(state.lane.blockY);
              ctxB.fillStyle = '#dc2626';
              ctxB.beginPath();
              ctxB.arc(bx, by, 8.5, 0, Math.PI * 2);
              ctxB.fill();
              ctxB.strokeStyle = '#ffffff';
              ctxB.lineWidth = 2.2;
              ctxB.beginPath();
              ctxB.moveTo(bx - 3.5, by - 3.5);
              ctxB.lineTo(bx + 3.5, by + 3.5);
              ctxB.moveTo(bx + 3.5, by - 3.5);
              ctxB.lineTo(bx - 3.5, by + 3.5);
              ctxB.stroke();
            }
          }
          ctxB.restore();
        }

        // Glossy Player Tokens (Defenders & Offense)
        function drawToken(p, isOff, isMe) {
          const sx = toSX(p.x);
          const sy = toSY(p.y);
          const rPx = Math.max(10.5, 0.50 * scale);

          // Drop shadow
          ctxB.fillStyle = 'rgba(15, 23, 42, 0.35)';
          ctxB.beginPath();
          ctxB.arc(sx, sy + 2.5, rPx, 0, Math.PI * 2);
          ctxB.fill();

          if (isMe) {
            ctxB.strokeStyle = '#facc15';
            ctxB.lineWidth = 4.5;
            ctxB.beginPath();
            ctxB.arc(sx, sy, rPx + 4.5, 0, Math.PI * 2);
            ctxB.stroke();
          }

          ctxB.fillStyle = isOff ? '#2563eb' : (p.offBalanceTimer > 0 ? '#f97316' : '#dc2626');
          ctxB.strokeStyle = '#ffffff';
          ctxB.lineWidth = 2.2;
          ctxB.beginPath();
          ctxB.arc(sx, sy, rPx, 0, Math.PI * 2);
          ctxB.fill();
          ctxB.stroke();

          // Glossy top highlight arc
          ctxB.fillStyle = 'rgba(255, 255, 255, 0.25)';
          ctxB.beginPath();
          ctxB.arc(sx, sy - rPx * 0.25, rPx * 0.65, 0, Math.PI * 2);
          ctxB.fill();

          ctxB.fillStyle = isMe ? '#fef08a' : '#ffffff';
          ctxB.font = '900 11.5px sans-serif';
          ctxB.textAlign = 'center';
          ctxB.fillText(isMe ? '★' : String(p.number), sx, sy + 4);

          if (p.offBalanceTimer > 0) {
            ctxB.font = '900 13px sans-serif';
            ctxB.fillText('⚡', sx, sy - rPx - 4);
          } else if (!isOff && p.ballWatchFactor > 0.55) {
            ctxB.font = '900 12px sans-serif';
            ctxB.fillText('👀', sx, sy - rPx - 4);
          }
        }

        for (let i = 0; i < state.defense.length; i++) {
          drawToken(state.defense[i], false, state.role === 'defense' && i === 0);
        }
        for (let i = 0; i < state.offense.length; i++) {
          drawToken(state.offense[i], true, state.role === 'offense' && i === 0);
        }

        // Basketball Token + Pre-shot Gather Warning Halo
        const bx = toSX(state.ball.x);
        const by = toSY(state.ball.y);
        if (state.ball.gatherTimer > 0) {
          ctxB.strokeStyle = '#facc15';
          ctxB.lineWidth = 3;
          ctxB.beginPath();
          ctxB.arc(bx, by, 13 + Math.sin(state.simTime * 22) * 2, 0, Math.PI * 2);
          ctxB.stroke();
        }
        const ballR = Math.max(6.8, (0.29 + Math.min(0.18, state.ball.z * 0.04)) * scale);
        ctxB.fillStyle = '#f97316';
        ctxB.strokeStyle = '#7c2d12';
        ctxB.lineWidth = 2;
        ctxB.beginPath();
        ctxB.arc(bx, by, ballR, 0, Math.PI * 2);
        ctxB.fill();
        ctxB.stroke();

        if (state.paused) drawPauseOverlayPill(ctxB, W);
        ctxB.restore();
      }

      /* =====================================================================
       * 10. View A Hybrid Renderer:
       *     - HD Retina Arena Hardwood, Spotlights, Reflections & Smooth Lines
       *     - 48x64 Outlined 32-Bit Arcade Pixel Sprites (imageSmoothingEnabled = false)
       * ===================================================================== */
      const REF_W = 420;
      const REF_H = 270;

      function project3D(wx, wy, wz) {
        const camDepth = 21.6;
        const refDist = 9.6;
        const s = refDist / Math.max(4.2, camDepth - wy);
        const s0 = refDist / camDepth;
        const sMax = refDist / (camDepth - COURT.length);
        const u = (s - s0) / (sMax - s0);

        const floorTop = 56;
        const floorBot = 262;
        const baseScale = 27.2;

        const px = REF_W * 0.5 + (wx - state.fx.camX) * baseScale * s;
        const pyFloor = floorTop + u * (floorBot - floorTop);
        const py = pyFloor - (wz || 0) * baseScale * s * 0.86;
        return { x: px, y: py, floorY: pyFloor, s };
      }

      function hexToAbgr(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
      }

      function pRect(buf, x, y, w, h, abgr) {
        const x0 = Math.max(0, Math.round(x));
        const y0 = Math.max(0, Math.round(y));
        const x1 = Math.min(SPR_W, Math.round(x + w));
        const y1 = Math.min(SPR_H, Math.round(y + h));
        for (let py = y0; py < y1; py++) {
          const row = py * SPR_W;
          for (let px = x0; px < x1; px++) {
            buf[row + px] = abgr;
          }
        }
      }

      function pLine(buf, x0, y0, x1, y1, thickness, abgr) {
        const steps = Math.max(1, Math.ceil(hypot2(x1 - x0, y1 - y0) * 1.5));
        const half = thickness * 0.5;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          pRect(buf, lerp(x0, x1, t) - half, lerp(y0, y1, t) - half, thickness, thickness, abgr);
        }
      }

      function pDigit5x7(buf, numStr, cx, topY, abgr) {
        const rows = PIXEL_DIGITS_5X7[numStr];
        if (!rows) return;
        const sx = Math.round(cx - 2);
        const sy = Math.round(topY);
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 5; c++) {
            if (rows[r][c] === '1') {
              pRect(buf, sx + c, sy + r, 1, 1, abgr);
            }
          }
        }
      }

      /* Rasterize 48x64 Outlined 3-Tone Arcade Pixel Character */
      function buildOutlinedPlayerSprite(p, isOffense, isMe, hasBallNow) {
        sprBuf.fill(0);

        const spd = hypot2(p.vx, p.vy);
        const isSprint = p.animState === 'sprint';
        const isOffBal = p.animState === 'offbalance';
        const isCross = p.animState === 'crossover';
        const isHesi = p.animState === 'hesitate';
        const isJump = p.animState === 'jump';

        const strideSin = spd > 0.35 ? Math.sin(p.stridePhase) : 0;
        const leanX = Math.round(clamp(p.vx * (isCross ? 1.3 : 0.75), -4, 4));
        const wobbleX = isOffBal ? Math.round(Math.sin(state.simTime * 30) * 4) : 0;
        const crouchY = (isHesi ? 4 : 0) + (!isOffense && !isJump ? 2 : 0);
        const cx = 24 + leanX + wobbleX;
        const footY = 57;

        const cSkinL = hexToAbgr(p.skinLight);
        const cSkinM = hexToAbgr(p.skinMid);
        const cSkinD = hexToAbgr(p.skinDark);
        const cHair = hexToAbgr(p.hairColor);
        const cWhite = hexToAbgr('#f8fafc');
        const cGold = hexToAbgr('#facc15');
        const cGoldDark = hexToAbgr('#ca8a04');
        const cDarkEye = hexToAbgr('#0f172a');

        let jLight = isOffense ? hexToAbgr('#60a5fa') : hexToAbgr('#f87171');
        let jMid = isOffense ? hexToAbgr('#2563eb') : hexToAbgr('#dc2626');
        let jDark = isOffense ? hexToAbgr('#1e3a8a') : hexToAbgr('#991b1b');
        let jTrim = isMe ? cGold : cWhite;

        if (!isOffense && isOffBal) {
          jLight = hexToAbgr('#fdba74');
          jMid = hexToAbgr('#ea580c');
          jDark = hexToAbgr('#9a3412');
        }

        // 1. Legs, Socks & 3-Tone High-Top Sneakers
        const spread = (!isOffense || isHesi || isOffBal) ? 6 : 4;
        const lLift = isJump ? 3 : Math.max(0, Math.round(strideSin * (isSprint ? 5 : 3)));
        const rLift = isJump ? 3 : Math.max(0, Math.round(-strideSin * (isSprint ? 5 : 3)));
        const lx = cx - spread - 2;
        const rx = cx + spread - 1;
        const hipY = 42 + crouchY;

        // Calves (3-tone skin)
        const lFootTop = footY - 4 - lLift;
        const rFootTop = footY - 4 - rLift;
        pLine(sprBuf, cx - 3, hipY, lx + 1.5, lFootTop, 4, cSkinM);
        pLine(sprBuf, cx - 4, hipY, lx + 0.5, lFootTop, 1.5, cSkinD);
        pLine(sprBuf, cx + 3, hipY, rx + 1.5, rFootTop, 4, cSkinM);
        pLine(sprBuf, cx + 4, hipY, rx + 2.5, rFootTop, 1.5, cSkinL);

        // Crew Socks
        pRect(sprBuf, lx, lFootTop - 2, 4, 3, cWhite);
        pRect(sprBuf, rx, rFootTop - 2, 4, 3, cWhite);

        // High-Top Sneakers (upper + gold/team accent + white sole)
        const shoeCol = isMe ? cGold : jMid;
        pRect(sprBuf, lx - 1, lFootTop, 6, 3, shoeCol);
        pRect(sprBuf, lx - 1, lFootTop + 3, 6, 1, cWhite);
        pRect(sprBuf, rx - 1, rFootTop, 6, 3, shoeCol);
        pRect(sprBuf, rx - 1, rFootTop + 3, 6, 1, cWhite);

        // 2. Basketball Shorts (Split legs + side trim)
        const shortsY = 36 + crouchY;
        pRect(sprBuf, cx - 7, shortsY, 6, 7, jDark);
        pRect(sprBuf, cx + 1, shortsY, 6, 7, jDark);
        pRect(sprBuf, cx - 6, shortsY, 12, 3, jMid);
        pRect(sprBuf, cx - 7, shortsY, 1, 7, jTrim);
        pRect(sprBuf, cx + 6, shortsY, 1, 7, jTrim);

        // 3. Back Arms (drawn behind or alongside torso) & Articulated Hands
        const torsoY = 22 + crouchY + (isSprint ? 2 : 0);
        const lShX = cx - 8;
        const rShX = cx + 8;
        const shY = torsoY + 2;

        if (p.shootFollowTimer > 0) {
          pLine(sprBuf, lShX, shY, lShX - 2, shY + 9, 3.5, cSkinM);
          pLine(sprBuf, rShX, shY, rShX + 2, torsoY - 12, 3.5, cSkinL);
          pRect(sprBuf, rShX + 1, torsoY - 14, 4, 3, cSkinL);
        } else if (p.contestTimer > 0) {
          pLine(sprBuf, lShX, shY, lShX - 2, torsoY - 13, 3.5, cSkinL);
          pLine(sprBuf, rShX, shY, rShX + 2, torsoY - 13, 3.5, cSkinL);
        } else if (!isOffense) {
          const wingY = shY + 2;
          pLine(sprBuf, lShX, shY, lShX - 7, wingY - wobbleX, 3.5, cSkinM);
          pLine(sprBuf, rShX, shY, rShX + 7, wingY + wobbleX, 3.5, cSkinL);
        } else if (hasBallNow) {
          const handDrop = Math.round((1 - clamp(state.ball.z, 0.2, 1.1)) * 7);
          pLine(sprBuf, lShX, shY, lShX - 3, shY + 9, 3.5, cSkinM);
          pLine(sprBuf, rShX, shY, rShX + 4, shY + 5 + handDrop, 3.5, cSkinL);
        } else {
          const armSwing = Math.round(strideSin * 4);
          pLine(sprBuf, lShX, shY, lShX - 2, shY + 9 - armSwing, 3.5, cSkinM);
          pLine(sprBuf, rShX, shY, rShX + 2, shY + 9 + armSwing, 3.5, cSkinL);
        }

        // 4. Jersey Torso (3-Tone Shading + Collar Trim + 5x7 Pixel Jersey Number)
        pRect(sprBuf, cx - 7, torsoY, 14, 15, jMid);
        pRect(sprBuf, cx - 7, torsoY + 1, 3, 14, jDark);
        pRect(sprBuf, cx + 4, torsoY + 1, 3, 14, jLight);
        // V-Neck & Shoulder Trim
        pRect(sprBuf, cx - 6, torsoY, 12, 2, jTrim);
        pRect(sprBuf, cx - 2, torsoY + 2, 4, 1, jTrim);
        pDigit5x7(sprBuf, String(p.number), cx, torsoY + 5, isMe ? cGold : cWhite);

        // 5. Rounded Pixel Head, Hair, Gold Headband & Directional Eyes
        const headY = torsoY - 14;
        // Neck
        pRect(sprBuf, cx - 2, torsoY - 2, 4, 3, cSkinD);
        // Rounded Face (12x12)
        pRect(sprBuf, cx - 5, headY + 2, 10, 11, cSkinM);
        pRect(sprBuf, cx - 6, headY + 3, 12, 9, cSkinM);
        pRect(sprBuf, cx - 6, headY + 4, 2, 7, cSkinD);
        pRect(sprBuf, cx + 4, headY + 3, 2, 7, cSkinL);
        // Ears
        pRect(sprBuf, cx - 7, headY + 6, 1, 3, cSkinD);
        pRect(sprBuf, cx + 6, headY + 6, 1, 3, cSkinM);

        // Hair Style
        pRect(sprBuf, cx - 6, headY, 12, 4, cHair);
        pRect(sprBuf, cx - 5, headY - 1, 10, 2, cHair);
        if (p.hairStyle === 0) {
          pRect(sprBuf, cx - 4, headY - 2, 2, 2, cHair);
          pRect(sprBuf, cx, headY - 2, 3, 2, cHair);
        } else if (p.hairStyle === 1) {
          pRect(sprBuf, cx - 7, headY + 1, 14, 3, cHair);
        }

        // ★ YOU Signature Golden Headband + Ribbon Tails
        if (isMe) {
          pRect(sprBuf, cx - 6, headY + 3, 12, 2, cGold);
          pRect(sprBuf, cx - 6, headY + 4, 4, 1, cGoldDark);
          const tailX = p.vx >= 0 ? cx - 9 : cx + 7;
          pRect(sprBuf, tailX, headY + 4, 3, 2, cGold);
          pRect(sprBuf, tailX + (p.vx >= 0 ? -1 : 1), headY + 6, 2, 2, cGoldDark);
        }

        // Eyes (3x3 sclera + 2x2 directional pupils)
        const lookDx = clamp(Math.round(Math.cos(p.gazeAngle) * 1.4), -1, 1);
        const eyeY = headY + 6;
        pRect(sprBuf, cx - 4, eyeY, 3, 3, cWhite);
        pRect(sprBuf, cx + 1, eyeY, 3, 3, cWhite);
        pRect(sprBuf, cx - 3 + lookDx, eyeY + 1, 2, 2, cDarkEye);
        pRect(sprBuf, cx + 2 + lookDx, eyeY + 1, 2, 2, cDarkEye);

        // 6. Automatic 1px Arcade Pixel Outline Pass (#0f172a)
        const outlineColor = (isMe && state.rhythm.burstBoostTimer > 0)
          ? hexToAbgr('#fef08a')
          : hexToAbgr('#0b1120');
        sprOutlineBuf.set(sprBuf);
        for (let y = 1; y < SPR_H - 1; y++) {
          const row = y * SPR_W;
          for (let x = 1; x < SPR_W - 1; x++) {
            if (sprBuf[row + x] === 0) {
              if (
                sprBuf[row + x - 1] !== 0 ||
                sprBuf[row + x + 1] !== 0 ||
                sprBuf[row - SPR_W + x] !== 0 ||
                sprBuf[row + SPR_W + x] !== 0
              ) {
                sprOutlineBuf[row + x] = outlineColor;
              }
            }
          }
        }

        if (hasImageDataSupport && sprImgData) {
          const view32 = new Uint32Array(sprImgData.data.buffer);
          view32.set(sprOutlineBuf);
          sctx.putImageData(sprImgData, 0, 0);
        } else {
          // Fallback for minimal headless test mocks
          sctx.clearRect(0, 0, SPR_W, SPR_H);
          sctx.fillStyle = isOffense ? '#2563eb' : '#dc2626';
          sctx.fillRect(16, 12, 16, 44);
        }
      }

      /* Collision-Free Floating Label Layout (0 AABB Overlaps Guaranteed) */
      function resolveLabelCollisions(rawLabels, canvasW, canvasH, measureFn) {
        const sorted = rawLabels.slice().sort((a, b) => (a.priority || 5) - (b.priority || 5));
        const placed = [];
        const pad = 5;
        const boxH = 22;
        const yOffsets = [0, -26, 26, -52, 52, -78, 78, -104, 104];
        const xOffsets = [0, -32, 32, -64, 64];

        for (let i = 0; i < sorted.length; i++) {
          const item = sorted[i];
          const boxW = Math.min(canvasW - 16, Math.ceil(measureFn(item.text)) + 16);
          const anchorX = item.anchorX;
          const anchorY = item.anchorY;

          let chosenX = clamp(anchorX - boxW * 0.5, 6, Math.max(6, canvasW - boxW - 6));
          let chosenY = clamp(anchorY - boxH, 36, Math.max(36, canvasH - boxH - 6));
          let found = false;

          for (let yo = 0; yo < yOffsets.length && !found; yo++) {
            for (let xo = 0; xo < xOffsets.length && !found; xo++) {
              const candX = clamp(anchorX + xOffsets[xo] - boxW * 0.5, 6, Math.max(6, canvasW - boxW - 6));
              const candY = clamp(anchorY + yOffsets[yo] - boxH, 36, Math.max(36, canvasH - boxH - 6));
              let hit = false;
              for (let p = 0; p < placed.length; p++) {
                const b = placed[p];
                if (candX < b.x + b.w + pad && candX + boxW + pad > b.x && candY < b.y + b.h + pad && candY + boxH + pad > b.y) {
                  hit = true;
                  break;
                }
              }
              if (!hit) {
                chosenX = candX;
                chosenY = candY;
                found = true;
              }
            }
          }

          if (!found && placed.length > 0) {
            let lowestBottom = 36;
            for (let p = 0; p < placed.length; p++) {
              lowestBottom = Math.max(lowestBottom, placed[p].y + placed[p].h + pad);
            }
            chosenY = lowestBottom;
          }

          placed.push({
            x: chosenX,
            y: chosenY,
            w: boxW,
            h: boxH,
            anchorX,
            anchorY,
            text: item.text,
            bg: item.bg,
            fg: item.fg
          });
        }
        return placed;
      }

      function renderPseudo3DA() {
        if (state.viewMode === 'b') return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const W = canvasA.width / dpr;
        const H = canvasA.height / dpr;
        if (W <= 0 || H <= 0) return;

        const sxR = W / REF_W;
        const syR = H / REF_H;
        const p2s = (wx, wy, wz) => {
          const p = project3D(wx, wy, wz);
          return { x: p.x * sxR, y: p.y * syR, floorY: p.floorY * syR, s: p.s };
        };

        ctxA.save();
        ctxA.scale(dpr, dpr);

        // 1. Arena Stadium Backdrop, Tiered Crowd & Overhead Spotlights
        const horizonY = 56 * syR;
        ctxA.fillStyle = '#0b1120';
        ctxA.fillRect(0, 0, W, H);

        // LED Ribbon Strip
        ctxA.fillStyle = '#1e293b';
        ctxA.fillRect(0, 12 * syR, W, 8 * syR);
        for (let lx = 8; lx < W; lx += 28) {
          ctxA.fillStyle = ((Math.floor(lx / 28) + Math.floor(state.simTime * 3)) % 3 === 0) ? '#facc15' : '#38bdf8';
          ctxA.fillRect(lx, 14 * syR, 14, 3.5 * syR);
        }

        // Stadium Bleacher Tiers + Cheering Pixel Crowd Silhouettes
        const crowdColors = ['#3b82f6', '#ef4444', '#facc15', '#22c55e', '#f8fafc', '#fb923c'];
        for (let row = 0; row < 3; row++) {
          const ry = (22 + row * 10) * syR;
          ctxA.fillStyle = row === 0 ? '#172554' : (row === 1 ? '#1e293b' : '#0f172a');
          ctxA.fillRect(0, ry, W, 11 * syR);
          const cheerHop = state.fx.crowdCheerTimer > 0 ? Math.abs(Math.sin(state.simTime * 20 + row)) * 3 * syR : 0;
          for (let cx = 10 + row * 5; cx < W - 10; cx += 15) {
            const cIdx = (Math.floor(cx) + row * 7) % crowdColors.length;
            ctxA.fillStyle = crowdColors[cIdx];
            ctxA.fillRect(cx, ry + 3 * syR - cheerHop, 7, 6 * syR);
            ctxA.fillStyle = '#f1c27d';
            ctxA.fillRect(cx + 1.5, ry - cheerHop, 4, 3.5 * syR);
          }
        }

        // Baseline Padded Arena Wall
        const wallC = p2s(0, 0, 0);
        const padW = 190 * sxR;
        ctxA.fillStyle = '#1e3a8a';
        ctxA.fillRect(wallC.x - padW * 0.5, 29 * syR, padW, horizonY - 28 * syR);
        ctxA.strokeStyle = '#3b82f6';
        ctxA.lineWidth = 1.5;
        ctxA.strokeRect(wallC.x - padW * 0.5, 29 * syR, padW, horizonY - 28 * syR);

        // 2. Royal Blue & Orange Court Apron + Golden Maple Parquet Hardwood
        const apTL = p2s(-COURT.halfW - 0.9, -0.35, 0);
        const apTR = p2s(COURT.halfW + 0.9, -0.35, 0);
        const apBR = p2s(COURT.halfW + 0.9, 14.3, 0);
        const apBL = p2s(-COURT.halfW - 0.9, 14.3, 0);
        ctxA.fillStyle = '#1e3a8a';
        ctxA.beginPath();
        ctxA.moveTo(apTL.x, apTL.y);
        ctxA.lineTo(apTR.x, apTR.y);
        ctxA.lineTo(apBR.x, apBR.y);
        ctxA.lineTo(apBL.x, apBL.y);
        ctxA.closePath();
        ctxA.fill();

        for (let ym = 0; ym < 14; ym++) {
          for (let xb = -3; xb < 3; xb++) {
            const x0 = xb * 2.5;
            const x1 = (xb + 1) * 2.5;
            const tl = p2s(x0, ym, 0);
            const tr = p2s(x1, ym, 0);
            const br = p2s(x1, ym + 1, 0);
            const bl = p2s(x0, ym + 1, 0);
            const alt = (ym + xb) % 2 === 0;
            ctxA.fillStyle = (ym % 2 === 0) ? (alt ? '#f3cb8f' : '#ecc180') : (alt ? '#e8ba75' : '#e0b069');
            ctxA.beginPath();
            ctxA.moveTo(tl.x, tl.y);
            ctxA.lineTo(tr.x, tr.y);
            ctxA.lineTo(br.x, br.y);
            ctxA.lineTo(bl.x, bl.y);
            ctxA.closePath();
            ctxA.fill();
          }
        }

        // Overhead Arena Spotlight Sheen
        if (typeof ctxA.createRadialGradient === 'function') {
          const spC = p2s(0, 5.5, 0);
          const grad = ctxA.createRadialGradient(spC.x, spC.y, 10, spC.x, spC.y, W * 0.45);
          grad.addColorStop(0, 'rgba(255, 253, 240, 0.24)');
          grad.addColorStop(1, 'rgba(255, 253, 240, 0.0)');
          ctxA.fillStyle = grad;
