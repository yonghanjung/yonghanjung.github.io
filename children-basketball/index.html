              setCoachMessage("good", "🎯", "PASS! NOW CUT!", 1.0);
            }
          }
          syncAllDOM();
          return true;
        }

        /* Exact Shot Zone & Probability Engine: Layup 80%, 2-Point Jumper 50%, 3-Pointer 30% */
        function classifyShotZone(team, shooter) {
          const rim = getTeamTargetRim(team);
          const dRim = hypot2(shooter.x - rim.x, shooter.y - rim.y);
          const isLayup = dRim <= 2.55;
          const isThree = !isLayup && (dRim >= 6.68 || (Math.abs(shooter.x) >= 6.42 && Math.abs(shooter.y - rim.y) <= 3.18));
          const shotType = isLayup ? "layup" : isThree ? "three" : "mid2";
          const baseProb = isLayup ? 0.8 : isThree ? 0.3 : 0.5;
          const points = isThree ? 3 : 2;
          return { rim, dRim, isLayup, isThree, shotType, baseProb, points };
        }

        function computeShotMakeOutcome(team, shooterIdx, opts) {
          const shooter = team === "offense" ? state.offense[shooterIdx] : state.defense[shooterIdx];
          const zone = classifyShotZone(team, shooter);
          const options = opts || {};

          if (typeof options.forceMake === "boolean") {
            return {
              willMake: options.forceMake,
              prob: options.forceMake ? 1.0 : 0.0,
              baseProb: zone.baseProb,
              shotType: zone.shotType,
              points: zone.points,
              wasContested: !!options.wasContested,
            };
          }

          // Beginner 4-Step Offense Tutorial (LEARN): deterministic clear so kid never stalls on Step 2-4!
          if (!state.fullCourt && state.scenario === "tutorial") {
            return {
              willMake: true,
              prob: 1.0,
              baseProb: zone.baseProb,
              shotType: zone.shotType,
              points: zone.points,
              wasContested: false,
            };
          }

          const defArr = team === "offense" ? state.defense : state.offense;
          const userTeam = state.fullCourt ? "offense" : state.role;
          const userIsDefendingThisShot = userTeam !== team;

          let closestDefDist = 99;
          let jumpContested = false;
          for (let i = 0; i < defArr.length; i++) {
            const def = defArr[i];
            if (!def || def.offBalanceTimer > 0) continue;
            const d = dist2(shooter, def);
            if (d < closestDefDist) closestDefDist = d;
            if (d <= 1.75 && def.contestTimer > 0) {
              jumpContested = true;
            }
          }

          if (userIsDefendingThisShot && !state.fullCourt && state.appMode === "practice" && (jumpContested || options.wasContested)) {
            return {
              willMake: false,
              prob: 0.0,
              baseProb: zone.baseProb,
              shotType: zone.shotType,
              points: zone.points,
              wasContested: true,
            };
          }

          const bodySmothered = closestDefDist <= 0.95;
          const heavilyContested = jumpContested || bodySmothered || !!options.wasContested;
          const prob = heavilyContested ? zone.baseProb * 0.25 : zone.baseProb;
          const rng = typeof options.rng === "function" ? options.rng() : Math.random();
          const willMake = rng < prob;

          return {
            willMake,
            prob,
            baseProb: zone.baseProb,
            shotType: zone.shotType,
            points: zone.points,
            wasContested: heavilyContested,
          };
        }

        function startShot(team, shooterIdx, explicitMake, assistedByUser, extraOpts) {
          const shooter = team === "offense" ? state.offense[shooterIdx] : state.defense[shooterIdx];
          const zone = classifyShotZone(team, shooter);
          const rim = zone.rim;
          const dRim = zone.dRim;
          shooter.layupMode = zone.isLayup;
          triggerJump(shooter, shooter.layupMode ? 4.25 : 3.95);
          shooter.shootFollowTimer = 0.85;
          shooter.facing = Math.atan2(rim.y - shooter.y, rim.x - shooter.x);

          const outcome =
            typeof explicitMake === "boolean"
              ? computeShotMakeOutcome(team, shooterIdx, Object.assign({}, extraOpts || {}, { forceMake: explicitMake }))
              : computeShotMakeOutcome(team, shooterIdx, extraOpts);
          const willMake = outcome.willMake;

          state.ball.inFlight = true;
          state.ball.loose = false;
          state.ball.flightType = "shot";
          state.ball.shooterTeam = team;
          state.ball.shotPoints = zone.points;
          state.ball.shotType = zone.shotType;
          state.ball.wasContested = outcome.wasContested;
          state.ball.assistedByUser = !!assistedByUser;
          state.ball.fromX = shooter.x;
          state.ball.fromY = shooter.y;
          state.ball.fromZ = 1.68;
          state.ball.toX = willMake ? rim.x : rim.x + (shooter.x >= 0 ? 0.38 : -0.38);
          state.ball.toY = willMake ? rim.y : rim.y + rim.sign * 0.28;
          state.ball.toZ = rim.z;
          state.ball.t = 0;
          state.ball.gatherTimer = 0;
          state.ball.trail = [];
          state.ball.duration = clamp(0.48 + dRim * 0.052, 0.5, 0.95);
          state.ball.shotMake = willMake;
          state.playPhase = "shot_flight";
        }

        function triggerUserSteal(isIntercept) {
          state.matchScore.steals += 1;
          state.matchScore.stops += 1;
          state.fx.crowdCheerTimer = 1.2;
          SoundEngine.playStealOrBlock(true);

          if (state.fullCourt) {
            const me = state.offense[0];
            const prevHolder = !state.ball.inFlight && state.ball.holderTeam === "defense" ? state.defense[state.ball.holderIdx] : null;
            if (prevHolder) {
              prevHolder.offBalanceTimer = 0.65;
              prevHolder.reactionTimer = 0.35;
            }
            state.ball.inFlight = false;
            state.ball.loose = false;
            state.ball.flightType = "none";
            state.ball.holderTeam = "offense";
            state.ball.holderIdx = 0;
            state.ball.x = me.x;
            state.ball.y = me.y;
            state.ball.z = 1.15;
            state.ball.gatherTimer = 0;
            state.ball.trail = [];
            state.dribblePressure.timer = 0;
            state.dribblePressure.ratio = 0;
            state.playPhase = "live";
            spawnSparkles(me.x, me.y, "#facc15", 18);
            setCoachMessage("celebrate", "⚡", isIntercept ? "INTERCEPT!!" : "STEAL!! FAST BREAK!", 1.5);
            syncAllDOM();
            return;
          }

          const me = state.defense[0];
          state.ball.inFlight = false;
          state.ball.loose = false;
          state.ball.flightType = "none";
          state.ball.holderTeam = "defense";
          state.ball.holderIdx = 0;
          state.ball.x = me.x;
          state.ball.y = me.y;
          state.ball.z = 1.15;
          state.ball.contestedByUser = true;
          spawnSparkles(me.x, me.y, "#facc15", 18);

          if (state.scenario === "learn_d" && state.tutorial.step === 4) {
            state.tutorial.completedSteps[4] = true;
            state.tutorial.subPhase = "graduated";
            state.tutorial.highlightKeys = [];
            state.playPhase = "live";
            setCoachMessage("celebrate", "🏆", "DEFENSE MASTER!!", 3.5);
            syncAllDOM();
            return;
          }

          state.playPhase = "celebrate";
          state.phaseTimer = 0;
          setCoachMessage("celebrate", "⚡", isIntercept ? "INTERCEPT!!" : "STEAL!! GREAT D!", 2.0);
          syncAllDOM();
        }

        function triggerUserPassDeflected(blockerIdx) {
          const bIdx = blockerIdx >= 0 ? blockerIdx : 0;
          const def = state.defense[bIdx];
          triggerJump(def, 3.2);
          def.contestTimer = 0.6;
          state.ball.inFlight = false;
          state.ball.loose = false;
          state.ball.flightType = "none";
          state.ball.holderTeam = "defense";
          state.ball.holderIdx = bIdx;
          state.ball.userPassBlockedBy = bIdx;
          state.ball.x = def.x;
          state.ball.y = def.y;
          state.ball.z = 1.25;
          state.ball.gatherTimer = 0;
          state.ball.trail = [];
          state.passAssist.active = false;
          spawnSparkles(def.x, def.y, "#ef4444", 14);
          SoundEngine.playStealOrBlock(false);

          if (state.fullCourt) {
            state.playPhase = "live";
            state.defDrill.timer = 0;
            state.defDrill.actionTimer = 0;
            state.defDrill.cutterIdx = -1;
            setCoachMessage("warn", "⚠️", "STOLEN! GET BACK!", 1.5);
            syncAllDOM();
            return;
          }

          if (state.scenario === "match") {
            state.matchScore.stops += 1;
          }
          state.playPhase = "celebrate";
          state.phaseTimer = 0.55;
          setCoachMessage("warn", "⚠️", "BLOCKED!", 1.6);
          syncAllDOM();
        }

        function evaluateSpacingAndLane(dt) {
          if (state.fullCourt) {
            const me = state.offense[0];
            let minDef = 99;
            for (let d = 0; d < state.defense.length; d++) minDef = Math.min(minDef, dist2(me, state.defense[d]));
            state.lane.mySeparation = minDef;

            let minMateDist = 99;
            let crowdedIdx = -1;
            for (let i = 1; i < state.offense.length; i++) {
              const dm = dist2(me, state.offense[i]);
              if (dm < minMateDist) {
                minMateDist = dm;
                if (dm < COURT.crowdingDist && me.y < 12.0) crowdedIdx = i;
              }
            }
            state.lane.minTeammateDist = minMateDist;
            state.lane.crowdedTeammateIdx = crowdedIdx;

            if (isUserOnDefenseNow() || state.ball.loose) {
              const dTarget = hypot2(me.x - state.targetSpot.x, me.y - state.targetSpot.y);
              state.lane.open = dTarget < 1.65;
              state.lane.blockerIdx = -1;
              return;
            }

            if (state.ball.inFlight || state.ball.holderTeam !== "offense" || state.ball.holderIdx === 0 || state.inbound.active) {
              state.lane.open = false;
              state.lane.openTimer = 0;
              state.lane.blockerIdx = -1;
              return;
            }

            const passer = state.offense[state.ball.holderIdx];
            const line = checkPassLineBlocked(passer, me);
            state.lane.blockerIdx = line.blocked ? line.blockerIdx : -1;
            state.lane.blockX = line.blockX;
            state.lane.blockY = line.blockY;

            const isReturnCut = state.passAssist.active && state.passAssist.mode === "triple_threat";
            const openReady = !line.blocked && crowdedIdx === -1 && (minDef > 1.25 || state.rhythm.burstBoostTimer > 0);
            state.lane.open = openReady;

            if (isReturnCut && openReady && me.y < 6.5) {
              state.lane.openTimer += dt;
              if (state.lane.openTimer >= 0.16) {
                state.lane.openTimer = 0;
                startTeamPass("offense", state.ball.holderIdx, 0, { isReturnPass: true });
                setCoachMessage("good", "⚡", "RETURN PASS!", 1.1);
              }
            } else {
              state.lane.openTimer = 0;
            }
            return;
          }

          const me = state.offense[0];
          const myDef = state.defense[0];
          state.lane.mySeparation = dist2(me, myDef);

          let minMateDist = 99;
          let crowdedIdx = -1;
          for (let i = 1; i < state.offense.length; i++) {
            const d = dist2(me, state.offense[i]);
            if (d < minMateDist) {
              minMateDist = d;
              if (d < COURT.crowdingDist) crowdedIdx = i;
            }
          }
          state.lane.minTeammateDist = minMateDist;
          state.lane.crowdedTeammateIdx = crowdedIdx;

          if (state.role === "defense") {
            const dTarget = hypot2(state.defense[0].x - state.targetSpot.x, state.defense[0].y - state.targetSpot.y);
            state.helpTriangle.distToIdeal = dTarget;
            state.lane.open = dTarget < 1.55;
            return;
          }

          if (state.ball.inFlight || state.ball.holderIdx === 0) {
            state.lane.open = false;
            state.lane.openTimer = 0;
            state.lane.blockerIdx = -1;
            return;
          }

          const passer = state.offense[state.ball.holderIdx];
          let blockerIdx = -1;
          let blockX = 0;
          let blockY = 0;

          for (let i = 0; i < state.defense.length; i++) {
            const def = state.defense[i];
            if (def.offBalanceTimer > 0) continue;
            const seg = pointToSegmentInfo(def.x, def.y, passer.x, passer.y, me.x, me.y);
            if (i === state.ball.holderIdx) {
              if (seg.projT > 0.36 && seg.projT < 0.92 && seg.dist < 0.42) {
                blockerIdx = i;
                blockX = seg.cx;
                blockY = seg.cy;
                break;
              }
              continue;
            }
            const blockRadius = i === 0 ? 0.88 : 0.78;
            if (seg.projT > 0.14 && seg.projT < 0.96 && seg.dist < blockRadius) {
              blockerIdx = i;
              blockX = seg.cx;
              blockY = seg.cy;
              break;
            }
          }

          if (blockerIdx === -1 && state.lane.mySeparation < 1.12 && myDef.offBalanceTimer <= 0) {
            blockerIdx = 0;
            blockX = myDef.x;
            blockY = myDef.y;
          }

          let scenarioReady = true;
          if (state.scenario === "tutorial") {
            const tut = state.tutorial;
            if (tut.step === 1) scenarioReady = false;
            else if (tut.step === 2) scenarioReady = hypot2(me.x - -5.85, me.y - 5.65) < 2.2 && crowdedIdx === -1;
            else if (tut.step === 3) scenarioReady = tut.subPhase === "3b_burst" && tut.copSucceeded && me.y < 5.0;
            else if (tut.step === 4) scenarioReady = tut.subPhase === "get_ball" && hypot2(me.x - -5.5, me.y - 4.75) < 1.85;
          } else if (state.scenario === "relocation") {
            const dTarget = hypot2(me.x - state.targetSpot.x, me.y - state.targetSpot.y);
            if (dTarget > 2.85 || crowdedIdx !== -1) scenarioReady = false;
          } else if (state.scenario === "cut") {
            if (me.y > 4.65 && state.lane.mySeparation < 1.35) scenarioReady = false;
          } else if (state.scenario === "give_go") {
            const cutDeep = me.y < 5.75 && (state.rhythm.copCount > 0 || myDef.offBalanceTimer > 0 || state.lane.mySeparation > 1.4);
            if (!cutDeep) scenarioReady = false;
          } else if (state.scenario === "vcut") {
            if (state.vcutStage === 1 && state.lane.mySeparation < 1.45) scenarioReady = false;
          } else if (state.passAssist.active && state.passAssist.mode === "triple_threat") {
            const cutOpen = state.rhythm.burstBoostTimer > 0 || myDef.offBalanceTimer > 0 || (me.y < 4.8 && state.lane.mySeparation > 1.35);
            if (!cutOpen) scenarioReady = false;
          }

          const isCrowded = crowdedIdx !== -1;
          state.lane.blockerIdx = blockerIdx;
          state.lane.blockX = blockX;
          state.lane.blockY = blockY;
          state.lane.open = blockerIdx === -1 && !isCrowded && scenarioReady;

          const isReturnCut = state.scenario === "give_go" || (state.passAssist.active && state.passAssist.mode === "triple_threat");
          const passThreshold = isReturnCut ? 0.16 : COURT.autoPassThreshold;

          if (isCrowded && state.playPhase === "live" && state.scenario !== "tutorial") {
            state.lane.openTimer = 0;
            setCoachMessage("warn", "⚠️", "TOO CLOSE! SPREAD!", 0.45);
          } else if (state.lane.open && state.playPhase === "live") {
            state.lane.openTimer += dt;
            if (state.lane.openTimer >= passThreshold) {
              state.lane.openTimer = 0;
              startPass(state.ball.holderIdx, 0, { isReturnPass: isReturnCut });
              if (state.scenario !== "tutorial") {
                setCoachMessage("good", isReturnCut ? "⚡" : "🟢", isReturnCut ? "RETURN PASS!" : "OPEN! PASS COMING!", 1.2);
              }
            }
          } else {
            state.lane.openTimer = Math.max(0, state.lane.openTimer - dt * 2.0);
            if (state.rhythm.monotoneSprintTime > 1.15 && state.playPhase === "live" && state.scenario !== "tutorial") {
              setCoachMessage("warn", "🐢", "WALK FIRST, THEN SHIFT!", 0.7);
            }
          }
        }

        function handleSpaceAction() {
          if (state.paused) return;
          if (state.playPhase === "match_over") {
            startNewMatchGame();
            return;
          }
          keys.SpaceFlash = 0.22;
          const me = getControlledPlayer();

          // 0) Loose-Ball Rebound Snatch!
          if (state.ball.loose) {
            triggerJump(me, 3.45);
            SoundEngine.playSneakerSqueak(0.8);
            if (hypot2(me.x - state.ball.x, me.y - state.ball.y) <= 1.65 && state.ball.z <= 2.65) {
              state.ball.loose = false;
              state.ball.holderTeam = "offense";
              state.ball.holderIdx = 0;
              state.ball.gatherTimer = 0;
              state.playPhase = "live";
              SoundEngine.playCatchPop();
              spawnSparkles(me.x, me.y, "#38bdf8", 12);
              setCoachMessage("good", "🏀", "YOUR REBOUND! GO!", 1.2);
              syncAllDOM();
            }
            return;
          }

          // 1) Defense SPACE = Steal (On-Ball Poke / Pass Intercept) or Shot Contest!
          if (isUserOnDefenseNow()) {
            // Mid-air Pass Intercept!
            if (state.ball.inFlight && state.ball.flightType === "pass") {
              me.contestTimer = 0.72;
              triggerJump(me, 3.45);
              SoundEngine.playSneakerSqueak(0.85);
              if (hypot2(me.x - state.ball.x, me.y - state.ball.y) <= 1.55) {
                triggerUserSteal(true);
                return;
              }
              setCoachMessage("good", "🖐️", "HANDS UP!", 0.7);
              return;
            }

            if (state.ball.inFlight || state.playPhase !== "live") {
              me.contestTimer = 0.72;
              triggerJump(me, 3.45);
              SoundEngine.playSneakerSqueak(0.8);
              return;
            }

            const oppTeam = state.fullCourt ? "defense" : "offense";
            const oppArr = state.fullCourt ? state.defense : state.offense;
            const allyArr = state.fullCourt ? state.offense : state.defense;
            const holder = oppArr[state.ball.holderIdx];
            const dHolder = dist2(me, holder);

            const isShotContestSituation =
              state.ball.gatherTimer > 0 ||
              (!state.fullCourt && (state.scenario === "learn_d" || state.scenario === "defense_help") && dHolder < 2.35);

            if (isShotContestSituation) {
              me.contestTimer = 0.72;
              triggerJump(me, 3.45);
              SoundEngine.playSneakerSqueak(0.9);
              if (dHolder < 2.35) {
                state.ball.contestedByUser = true;
                SoundEngine.playStealOrBlock(true);
                spawnSparkles(me.x, me.y, "#22c55e", 10);
                const isDefDrill = !state.fullCourt && state.appMode === "practice";
                startShot(oppTeam, state.ball.holderIdx, isDefDrill ? false : null, false, { wasContested: true });
                return;
              }
              setCoachMessage("good", "🖐️", "HANDS UP!", 0.7);
              return;
            }

            // On-Ball Poke Steal Attempt (0.58s cooldown)!
            if (state.stealCooldown > 0) return;
            state.stealCooldown = 0.58;
            me.stealLungeTimer = 0.34;
            me.passPoseTimer = 0.24;
            me.gazeAngle = Math.atan2(holder.y - me.y, holder.x - me.x);
            me.facing = me.gazeAngle;

            let allyHelpers = 0;
            for (let a = 0; a < allyArr.length; a++) {
              if (dist2(allyArr[a], holder) < 2.15) allyHelpers++;
            }
            const drivingIntoMe = (me.x - holder.x) * holder.vx + (me.y - holder.y) * holder.vy > 0.25;

            if (dHolder <= 1.38 || (dHolder <= 1.45 && (allyHelpers >= 2 || drivingIntoMe))) {
              triggerUserSteal(false);
              return;
            }
            if (dHolder <= 1.45) {
              holder.vx *= 0.25;
              holder.vy *= 0.25;
              spawnDust(holder.x, holder.y, 4);
              setCoachMessage("good", "⚡", "CLOSE POKE!", 0.7);
              return;
            }

            // Spammed SPACE too far (> 1.45m) -> 0.40s Reach-In Lunge!
            me.reactionTimer = 0.4;
            me.offBalanceTimer = 0.4;
            const lungeAng = Math.atan2(holder.y - me.y, holder.x - me.x);
            me.inertiaVx = Math.cos(lungeAng) * 2.2;
            me.inertiaVy = Math.sin(lungeAng) * 2.2;
            spawnDust(me.x, me.y, 4);
            setCoachMessage("warn", "⚠️", "REACH IN! RECOVER!", 0.8);
            return;
          }

          // 2) Offense SPACE = Shoot at North Hoop (0, 1.575)!
          if (state.playPhase !== "live") return;

          if (state.ball.inFlight || state.ball.holderTeam !== "offense" || state.ball.holderIdx !== 0) {
            if (state.scenario !== "tutorial") {
              setCoachMessage("normal", "🟢", "GET OPEN FIRST!", 0.9);
            }
            return;
          }

          if (!state.fullCourt && state.scenario === "tutorial") {
            const tut = state.tutorial;
            if (tut.step === 4 && !tut.crossoverDone) {
              setCoachMessage("warn", "💨", "CROSSOVER FIRST!", 0.9);
              return;
            }
            startShot("offense", 0, true, false);
            return;
          }

          if (!state.fullCourt && state.scenario === "give_go" && state.giveGoStage === 1) {
            setCoachMessage("warn", "🎯", "PASS WITH E!", 0.9);
            return;
          }

          if (state.fullCourt && me.y > 12.2) {
            setCoachMessage("warn", "🏃", "CROSS HALF COURT!", 0.9);
            return;
          }

          state.dribblePressure.timer = 0;
          state.dribblePressure.ratio = 0;
          startShot("offense", 0, null, false);
        }

        function handleSecondaryAction() {
          if (state.paused) return;
          keys.CallFlash = 0.22;

          if (isUserOnDefenseNow()) {
            switchDefenderToBall();
            return;
          }

          if (state.playPhase !== "live" || state.ball.inFlight || state.ball.loose) return;

          // On-ball E = Direct Pass to targeted teammate!
          if (state.ball.holderTeam === "offense" && state.ball.holderIdx === 0) {
            executeUserPass(0);
            return;
          }

          // Off-ball E = Call for Pass!
          if (state.lane.blockerIdx === -1 && state.lane.crowdedTeammateIdx === -1) {
            state.lane.openTimer = 0;
            const isGiveGoReturn =
              (!state.fullCourt && state.scenario === "give_go") || (state.passAssist.active && state.passAssist.mode === "triple_threat");
            startTeamPass("offense", state.ball.holderIdx, 0, { isReturnPass: isGiveGoReturn });
            setCoachMessage("good", "🙋", "NICE CALL! PASS!", 1.1);
          } else if (state.lane.crowdedTeammateIdx !== -1) {
            setCoachMessage("warn", "⚠️", "TOO CLOSE! SPREAD!", 1.0);
          } else {
            setCoachMessage("warn", "🔴", "BLOCKED! GET OPEN!", 1.0);
          }
        }

        function updateBallAndPhases(dt) {
          // 0) 3D Rim-Bounce Live Loose Ball / Rebound Physics (Full Court!)
          if (state.ball.loose) {
            const b = state.ball;
            b.looseTimer += dt;
            b.spinPhase += dt * 9.0;
            b.x = clamp(b.x + b.lvx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
            b.y = clamp(b.y + b.lvy * dt, 0.55, getCourtLength() - 0.55);
            b.z += b.lvz * dt;
            b.lvz -= 9.8 * dt;
            if (b.z <= 0.24) {
              if (b.lvz < -0.55) {
                SoundEngine.playDribbleBounce(clamp(Math.abs(b.lvz) * 0.28, 0.45, 0.95));
              }
              b.z = 0.24;
              b.lvz = Math.abs(b.lvz) * 0.58;
              b.lvx *= 0.78;
              b.lvy *= 0.78;
            }
            b.trail = [];

            if (b.looseTimer >= 0.16 && b.z <= 2.35) {
              let bestTeam = null;
              let bestIdx = -1;
              let bestScore = 999;

              for (let i = 0; i < state.offense.length; i++) {
                const p = state.offense[i];
                const reach = (i === 0 ? 1.25 : 0.98) + (p.jumpZ > 0.12 ? 0.28 : 0);
                const d = hypot2(p.x - b.x, p.y - b.y);
                if (d <= reach && d - (i === 0 ? 0.2 : 0) < bestScore) {
                  bestScore = d - (i === 0 ? 0.2 : 0);
                  bestTeam = "offense";
                  bestIdx = i;
                }
              }
              for (let i = 0; i < state.defense.length; i++) {
                const p = state.defense[i];
                if (p.offBalanceTimer > 0) continue;
                const reach = 0.96 + (p.jumpZ > 0.12 ? 0.25 : 0);
                const d = hypot2(p.x - b.x, p.y - b.y);
                if (d <= reach && d < bestScore) {
                  bestScore = d;
                  bestTeam = "defense";
                  bestIdx = i;
                }
              }

              if (bestTeam !== null) {
                b.loose = false;
                b.holderTeam = bestTeam;
                b.holderIdx = bestIdx;
                b.gatherTimer = 0;
                state.playPhase = "live";
                SoundEngine.playCatchPop();
                state.passAssist.active = false;
                state.defDrill.timer = 0;
                state.defDrill.actionTimer = 0;
                state.defDrill.cutterIdx = -1;
                const winner = bestTeam === "offense" ? state.offense[bestIdx] : state.defense[bestIdx];
                triggerJump(winner, 2.5);
                spawnSparkles(winner.x, winner.y, bestTeam === "offense" ? "#38bdf8" : "#f87171", 10);
                if (bestTeam === "offense") {
                  setCoachMessage("good", "🏀", bestIdx === 0 ? "YOUR REBOUND! GO!" : "FAST BREAK! RUN!", 1.2);
                } else {
                  setCoachMessage("warn", "🛡️", "GET BACK! DEFEND!", 1.2);
                }
                syncAllDOM();
              }
            }
            return;
          }

          if (!state.ball.inFlight) {
            const holder = state.ball.holderTeam === "offense" ? state.offense[state.ball.holderIdx] : state.defense[state.ball.holderIdx];
            const holdAng = holder.facing !== undefined ? holder.facing : holder.gazeAngle;
            const cosF = Math.cos(holdAng);
            const sinF = Math.sin(holdAng);
            // Right-hand side vector in world space: (-sinF, cosF)
            const rx = -sinF;
            const ry = cosF;
            const dHand = holder.dribbleHand || 1;
            const holderSpd = hypot2(holder.vx, holder.vy);
            const isGatherOrInb = state.ball.gatherTimer > 0 || state.inbound.active;
            const isLowCross = !isUserOnDefenseNow() && state.ball.holderTeam === "offense" && holder.id === 0 && state.rhythm.crossoverTimer > 0;
            const uBounce = (((state.simTime * (holderSpd > 3.2 ? 3.25 : 2.55) + holder.id * 0.23) % 1) + 1) % 1;
            const holderKey = state.ball.holderTeam + ":" + state.ball.holderIdx;
            if (!isGatherOrInb && dt > 0 && state.playPhase === "live") {
              if (
                state.ball.prevBounceHolderKey === holderKey &&
                uBounce < state.ball.prevBouncePhase &&
                state.ball.prevBouncePhase - uBounce > 0.35
              ) {
                const isUserHolder =
                  (state.fullCourt && state.ball.holderTeam === "offense" && holder.id === 0) ||
                  (!state.fullCourt && state.role === state.ball.holderTeam && holder.id === 0);
                SoundEngine.playDribbleBounce(isUserHolder ? 1.0 : 0.72);
              }
            }
            state.ball.prevBounceHolderKey = holderKey;
            state.ball.prevBouncePhase = uBounce;
            // Realistic gravity parabola: floor bounce -> waist pocket (0.35m..0.76m) synced with hand!
            const parabola = 1.0 - 4.0 * (uBounce - 0.5) * (uBounce - 0.5);
            const minBounceZ = isLowCross ? 0.3 : 0.36;
            const ampBounceZ = isLowCross ? 0.34 : 0.4;
            const crossSlide = isLowCross ? Math.sin(state.rhythm.crossoverTimer * 16.0) * 0.14 : 0;
            const sideOff = isGatherOrInb ? 0.06 : 0.18 * dHand + crossSlide;
            const fwdOff = isGatherOrInb ? 0.24 : 0.24;

            state.ball.x = holder.x + cosF * fwdOff + rx * sideOff;
            state.ball.y = holder.y + sinF * fwdOff + ry * sideOff;
            state.ball.z = (holder.jumpZ || 0) + (isGatherOrInb ? 0.94 : minBounceZ + parabola * ampBounceZ);
            state.ball.spinPhase += dt * (4.8 + holderSpd * 0.9);
            state.ball.trail = [];
          } else {
            state.ball.spinPhase += dt * 15.0;
            state.ball.trail.push({ x: state.ball.x, y: state.ball.y, z: state.ball.z });
            if (state.ball.trail.length > 6) state.ball.trail.shift();

            state.ball.t += dt / state.ball.duration;
            const u = clamp(state.ball.t, 0, 1);

            if (state.ball.flightType === "pass") {
              const pTeam = state.ball.passTeam || "offense";
              const recvArr = pTeam === "offense" ? state.offense : state.defense;
              const target = recvArr[state.ball.targetIdx];
              state.ball.toX = target.x;
              state.ball.toY = target.y;
              state.ball.x = lerp(state.ball.fromX, state.ball.toX, u);
              state.ball.y = lerp(state.ball.fromY, state.ball.toY, u);
              state.ball.z = 1.22 + Math.sin(u * Math.PI) * 0.44;

              if (pTeam === "offense") {
                // 1) User On-Ball Pass Deflection if thrown into a defender's lane!
                if ((state.fullCourt || state.role === "offense") && state.ball.fromIdx === 0) {
                  if (state.ball.userPassBlockedBy !== -1 && u >= state.ball.userPassBlockT) {
                    triggerUserPassDeflected(state.ball.userPassBlockedBy);
                    return;
                  }
                  if (u > 0.2 && u < 0.86) {
                    for (let d = 0; d < state.defense.length; d++) {
                      const def = state.defense[d];
                      if (def.offBalanceTimer > 0) continue;
                      if (d === 0 && u < 0.38) continue;
                      const hitRad = d === 0 ? 0.32 : def.ballWatchFactor > 0.62 ? 0.36 : 0.56;
                      if (hypot2(def.x - state.ball.x, def.y - state.ball.y) <= hitRad) {
                        triggerUserPassDeflected(d);
                        return;
                      }
                    }
                  }
                }

                // 2) Half-Court Defense Pass-Lane Steal by User!
                if (!state.fullCourt && state.role === "defense" && u > 0.16 && u < 0.9) {
                  const meDef = state.defense[0];
                  const stealRadius = meDef.contestTimer > 0 ? 1.4 : 0.88;
                  if (hypot2(meDef.x - state.ball.x, meDef.y - state.ball.y) < stealRadius) {
                    triggerUserSteal(true);
                    return;
                  }
                }
              } else {
                // Full-Court Red CPU Pass -> Check Blue User & AI Interception!
                if (u > 0.16 && u < 0.9) {
                  const meBlue = state.offense[0];
                  const myStealRad = meBlue.contestTimer > 0 ? 1.48 : 0.85;
                  if (hypot2(meBlue.x - state.ball.x, meBlue.y - state.ball.y) < myStealRad) {
                    triggerUserSteal(true);
                    return;
                  }
                  for (let b = 1; b < state.offense.length; b++) {
                    const mate = state.offense[b];
                    if (hypot2(mate.x - state.ball.x, mate.y - state.ball.y) < 0.45) {
                      state.matchScore.steals += 1;
                      state.ball.inFlight = false;
                      state.ball.flightType = "none";
                      state.ball.holderTeam = "offense";
                      state.ball.holderIdx = b;
                      state.playPhase = "live";
                      SoundEngine.playStealOrBlock(true);
                      spawnSparkles(mate.x, mate.y, "#38bdf8", 12);
                      setCoachMessage("good", "⚡", "INTERCEPT!!", 1.2);
                      syncAllDOM();
                      return;
                    }
                  }
                }
              }

              if (u >= 1) {
                const prevFrom = state.ball.fromIdx;
                const wasDK = state.ball.wasDriveKickPass;
                const wasCut = state.ball.wasCutPass;
                state.ball.wasDriveKickPass = false;
                state.ball.wasCutPass = false;
                state.ball.wasAICutPass = false;
                state.ball.inFlight = false;
                state.ball.flightType = "none";
                state.ball.holderTeam = pTeam;
                state.ball.holderIdx = state.ball.targetIdx;
                state.ball.trail = [];
                state.playPhase = "live";
                state.phaseTimer = 0;
                SoundEngine.playCatchPop();

                if (pTeam === "offense") {
                  if ((state.fullCourt || state.role === "offense") && state.ball.holderIdx === 0) {
                    state.passAssist.active = false;
                    if (!state.fullCourt && state.scenario === "give_go" && state.giveGoStage === 2) {
                      state.giveGoStage = 3;
                      setCoachMessage("good", "🔥", "FINISH! PRESS SPACE!", 1.0);
                    }
                    spawnSparkles(target.x, target.y, "#facc15", 8);
                  } else if ((state.fullCourt || state.role === "offense") && prevFrom === 0 && state.ball.holderIdx > 0) {
                    const rIdx = state.ball.holderIdx;
                    const rec = state.offense[rIdx];
                    let closestDef = 99;
                    for (let d = 0; d < state.defense.length; d++) {
                      closestDef = Math.min(closestDef, dist2(rec, state.defense[d]));
                    }
                    const distRecRim = hypot2(rec.x - COURT.rimX, rec.y - COURT.rimY);

                    if (state.scenario !== "give_go" && wasCut && distRecRim < 5.6 && closestDef >= 0.65) {
                      state.passAssist.active = true;
                      state.passAssist.mode = "cut_layup";
                      state.passAssist.partnerIdx = rIdx;
                      state.passAssist.timer = 0.18;
                      state.passAssist.returnLookTimer = 0;
                      state.passAssist.wasDriveKick = false;
                      state.ball.gatherTimer = 0.18;
                      spawnSparkles(rec.x, rec.y, "#38bdf8", 12);
                      setCoachMessage("good", "🎯", "GREAT CUT PASS!", 1.0);
                    } else if (
                      state.scenario !== "give_go" &&
                      distRecRim < 8.8 &&
                      ((wasDK && closestDef >= 1.75) || (closestDef >= 2.1 && distRecRim < 3.6))
                    ) {
                      state.passAssist.active = true;
                      state.passAssist.mode = "drive_kick_shot";
                      state.passAssist.partnerIdx = rIdx;
                      state.passAssist.timer = 0.24;
                      state.passAssist.returnLookTimer = 0;
                      state.passAssist.wasDriveKick = true;
                      state.ball.gatherTimer = 0.24;
                      spawnSparkles(rec.x, rec.y, "#38bdf8", 10);
                      setCoachMessage("good", "🎯", "GREAT PASS!", 0.9);
                    } else if (rec.y < 12.0) {
                      state.passAssist.active = true;
                      state.passAssist.mode = "triple_threat";
                      state.passAssist.partnerIdx = rIdx;
                      state.passAssist.timer = 0;
                      state.passAssist.returnLookTimer = state.scenario === "give_go" ? 99.0 : 1.85;
                      state.passAssist.wasDriveKick = false;
                      spawnSparkles(rec.x, rec.y, "#38bdf8", 6);
                    }
                  }
                }
                syncAllDOM();
              }
            } else if (state.ball.flightType === "shot") {
              state.ball.x = lerp(state.ball.fromX, state.ball.toX, u);
              state.ball.y = lerp(state.ball.fromY, state.ball.toY, u);
              const peakZ = 4.55;
              const linearZ = lerp(state.ball.fromZ, state.ball.toZ, u);
              state.ball.z = linearZ + Math.sin(u * Math.PI) * (peakZ - linearZ * 0.65);

              if (u >= 1) {
                const wasAssist = state.ball.assistedByUser;
                const sTeam = state.ball.shooterTeam;
                const pts = state.ball.shotPoints || 2;
                const rim = getTeamTargetRim(sTeam);
                state.ball.inFlight = false;
                state.ball.flightType = "none";
                state.ball.assistedByUser = false;
                state.ball.trail = [];
                if (state.ball.shotMake) {
                  SoundEngine.playNetSwish(pts, wasAssist);
                } else {
                  SoundEngine.playRimClank();
                }

                // Seamless Non-Stop Full-Court Shot Resolution!
                if (state.fullCourt) {
                  if (state.ball.shotMake) {
                    state.fx.netSwishTimer = 1.05;
                    state.fx.netSwishHoop = rim.sign;
                    state.fx.crowdCheerTimer = 1.25;
                    if (sTeam === "offense") {
                      recordMatchBasket("you", pts, rim.x, rim.y, wasAssist);
                      spawnSparkles(rim.x, rim.y, wasAssist ? "#38bdf8" : "#facc15", 22);
                      if (!checkAndHandleMatchWin(rim.x, rim.y)) {
                        const msg = wasAssist ? "ASSIST! +" + pts + "!" : pts === 3 ? "SPLASH!! +3!" : "SWISH!! +2!";
                        setCoachMessage("celebrate", "🏀", msg, 1.6);
                        startFullCourtInbound("defense");
                      }
                    } else {
                      recordMatchBasket("cpu", pts, rim.x, rim.y, false);
                      spawnSparkles(rim.x, rim.y, "#f87171", 14);
                      if (!checkAndHandleMatchWin(rim.x, rim.y)) {
                        setCoachMessage("warn", "🏀", "CPU +" + pts + "! GO!", 1.5);
                        startFullCourtInbound("offense");
                      }
                    }
                  } else {
                    // Missed Shot -> Live 3D Rim-Bounce Rebound!
                    if (sTeam === "defense" && state.ball.contestedByUser) {
                      state.matchScore.stops += 1;
                      state.fx.crowdCheerTimer = 1.0;
                      spawnSparkles(state.offense[0].x, state.offense[0].y, "#22c55e", 12);
                      setCoachMessage("celebrate", "🛑", "GREAT STOP!!", 1.3);
                    } else {
                      setCoachMessage("normal", "🏀", "REBOUND! GET IT!", 1.1);
                    }
                    state.ball.contestedByUser = false;
                    state.ball.loose = true;
                    state.ball.looseTimer = 0;
                    state.ball.x = rim.x + (Math.random() - 0.5) * 0.35;
                    state.ball.y = rim.y + rim.sign * 0.32;
                    state.ball.z = COURT.rimZ + 0.12;
                    const rebAng = (Math.random() - 0.5) * 1.35;
                    const rebSpd = 2.4 + Math.random() * 1.6;
                    state.ball.lvx = Math.sin(rebAng) * rebSpd;
                    state.ball.lvy = rim.sign * Math.cos(rebAng) * rebSpd;
                    state.ball.lvz = 3.1 + Math.random() * 1.1;
                    state.playPhase = "live";
                  }
                  syncAllDOM();
                  return;
                }

                // Handle Offense Tutorial Shot Completion
                if (state.scenario === "tutorial") {
                  const tut = state.tutorial;
                  state.fx.netSwishTimer = 1.05;
                  state.fx.netSwishHoop = 1;
                  state.fx.crowdCheerTimer = 1.1;
                  spawnSparkles(COURT.rimX, COURT.rimY, "#facc15", 18);
                  tut.completedSteps[tut.step] = true;
                  state.playPhase = "live";

                  if (tut.step === 2) {
                    tut.advanceTimer = 1.35;
                    tut.nextStepAfterAdvance = 3;
                    setCoachMessage("celebrate", "🎉", "SWISH! NEXT: PACE!", 1.8);
                  } else if (tut.step === 3) {
                    tut.advanceTimer = 1.35;
                    tut.nextStepAfterAdvance = 4;
                    setCoachMessage("celebrate", "🔥", "GREAT CUT! NEXT: CROSS!", 1.8);
                  } else if (tut.step === 4) {
                    tut.subPhase = "graduated";
                    tut.highlightKeys = [];
                    spawnSparkles(state.offense[0].x, state.offense[0].y, "#38bdf8", 18);
                    setCoachMessage("celebrate", "🏆", "ALL CLEAR! YOU ROCK!", 3.5);
                  }
                  syncAllDOM();
                  return;
                }

                // Handle Defense Tutorial Shot Completion
                if (state.scenario === "learn_d") {
                  const tut = state.tutorial;
                  state.playPhase = "live";
                  if (!state.ball.shotMake) {
                    tut.completedSteps[tut.step] = true;
                    state.fx.crowdCheerTimer = 1.1;
                    spawnSparkles(state.defense[0].x, state.defense[0].y, "#22c55e", 16);
                    if (tut.step === 2) {
                      tut.advanceTimer = 1.35;
                      tut.nextStepAfterAdvance = 3;
                      setCoachMessage("celebrate", "🛑", "GREAT STOP! NEXT: HELP!", 1.8);
                    } else if (tut.step === 4) {
                      tut.subPhase = "graduated";
                      tut.highlightKeys = [];
                      setCoachMessage("celebrate", "🏆", "DEFENSE MASTER!!", 3.5);
                    }
                  } else {
                    tut.advanceTimer = 1.0;
                    tut.nextStepAfterAdvance = tut.step;
                    setCoachMessage("warn", "🖐️", "TRY AGAIN! PRESS SPACE!", 1.2);
                  }
                  syncAllDOM();
                  return;
                }

                // Standard Drill or Half-Court 5v5 Match Resolution
                state.playPhase = "celebrate";
                state.phaseTimer = 0;

                if (state.role === "offense") {
                  if (state.ball.shotMake) {
                    state.fx.netSwishTimer = 1.05;
                    state.fx.netSwishHoop = 1;
                    state.fx.crowdCheerTimer = 1.25;
                    if (state.scenario === "match") {
                      recordMatchBasket("you", pts, COURT.rimX, COURT.rimY, wasAssist);
                    }
                    if (state.scenario === "match" && checkAndHandleMatchWin(COURT.rimX, COURT.rimY)) {
                      // Handled victory banner & fireworks
                    } else if (wasAssist) {
                      spawnSparkles(COURT.rimX, COURT.rimY, "#38bdf8", 20);
                      setCoachMessage("celebrate", "🏀", "ASSIST! +" + pts + "!", 2.0);
                    } else if (state.scenario === "give_go" && state.giveGoStage >= 2) {
                      spawnSparkles(COURT.rimX, COURT.rimY, "#facc15", 22);
                      setCoachMessage("celebrate", "🏀", "GIVE & GO!!", 2.0);
                    } else {
                      spawnSparkles(COURT.rimX, COURT.rimY, "#facc15", 18);
                      const swishMsg = pts === 3 ? "SPLASH!! +3!" : "SWISH!! +" + pts + "!";
                      setCoachMessage("celebrate", "🏀", swishMsg, 2.0);
                    }
                  } else if (state.ball.wasContested) {
                    setCoachMessage("warn", "🧱", "CONTESTED! PASS!", 2.0);
                  } else {
                    setCoachMessage("normal", "🏀", "GOOD OPEN TRY!", 1.8);
                  }
                } else {
                  if (!state.ball.shotMake) {
                    state.fx.crowdCheerTimer = 1.2;
                    state.matchScore.stops += 1;
                    spawnSparkles(state.defense[0].x, state.defense[0].y, "#22c55e", 16);
                    setCoachMessage("celebrate", "🛑", "GREAT STOP!!", 2.0);
                  } else {
                    state.fx.netSwishTimer = 0.85;
                    state.fx.netSwishHoop = 1;
                    if (state.scenario === "match") {
                      recordMatchBasket("cpu", pts, COURT.rimX, COURT.rimY, false);
                    }
                    if (state.scenario === "match" && checkAndHandleMatchWin(COURT.rimX, COURT.rimY)) {
                      // Handled CPU win banner
                    } else {
                      const hint =
                        state.helpTriangle.mistakeType === "ball_watch"
                          ? "WATCH YOUR MAN!"
                          : state.helpTriangle.mistakeType === "no_help"
                            ? "HELP INSIDE!"
                            : "HANDS UP FASTER!";
                      setCoachMessage("warn", "🏀", hint, 2.0);
                    }
                  }
                }
                syncAllDOM();
              }
            }
          }

          if (state.playPhase === "celebrate") {
            state.phaseTimer += dt;
            if (state.phaseTimer >= 1.85) {
              if (state.appMode === "game" && state.scenario === "match") {
                if (state.matchFlow === "two_way") {
                  state.role = state.role === "offense" ? "defense" : "offense";
                } else if (state.matchFlow === "offense_only") {
                  state.role = "offense";
                } else if (state.matchFlow === "defense_only") {
                  state.role = "defense";
                }
              }
              resetScenario();
            }
          }
        }

        function spawnScorePopup(wx, wy, text, color) {
          state.fx.scorePopups.push({
            x: wx,
            y: wy,
            z: COURT.rimZ + 0.55,
            vz: 1.55,
            life: 1.25,
            maxLife: 1.25,
            text,
            color,
          });
        }

        function recordMatchBasket(side, pts, rimX, rimY, wasAssist) {
          if (side === "you") {
            state.matchScore.you += pts;
            state.matchScore.youPopTimer = 0.48;
            spawnScorePopup(rimX, rimY, "+" + pts + "!", wasAssist ? "#38bdf8" : "#fde047");
          } else {
            state.matchScore.cpu += pts;
            state.matchScore.cpuPopTimer = 0.48;
            spawnScorePopup(rimX, rimY, "+" + pts + "!", "#f87171");
          }
        }

        function checkAndHandleMatchWin(rimX, rimY) {
          const target = state.matchScore.target;
          if (!target || target <= 0) return false;
          if (state.matchScore.you >= target) {
            state.matchScore.winner = "you";
            state.playPhase = "match_over";
            state.inbound.active = false;
            state.fx.crowdCheerTimer = 3.0;
            SoundEngine.playWhistle(true);
            spawnSparkles(rimX, rimY, "#facc15", 32);
            spawnSparkles(rimX, rimY, "#38bdf8", 24);
            setCoachMessage("celebrate", "🏆", "YOU WIN!!", 4.0);
            return true;
          }
          if (state.matchScore.cpu >= target) {
            state.matchScore.winner = "cpu";
            state.playPhase = "match_over";
            state.inbound.active = false;
            SoundEngine.playWhistle(false);
            spawnSparkles(rimX, rimY, "#f87171", 20);
            setCoachMessage("warn", "🏀", "CPU WINS! REMATCH!", 4.0);
            return true;
          }
          return false;
        }

        function resetMatchScores() {
          const keepTarget = state.matchScore && state.matchScore.target !== undefined ? state.matchScore.target : 11;
          state.matchScore = {
            you: 0,
            cpu: 0,
            stops: 0,
            steals: 0,
            target: keepTarget,
            winner: null,
            youPopTimer: 0,
            cpuPopTimer: 0,
          };
          state.fx.scorePopups = [];
        }

        function startNewMatchGame() {
          resetMatchScores();
          if (!state.fullCourt && state.scenario === "match") {
            state.role = state.matchOriginRole || "offense";
          }
          resetScenario();
          SoundEngine.playWhistle(false);
          setCoachMessage("good", "🏆", "NEW MATCH! SCORE!", 1.2);
          syncAllDOM();
          renderFrame();
        }

        function setTargetScore(targetPts) {
          const val = parseInt(targetPts, 10);
          if (val !== 11 && val !== 21 && val !== 0) return;
          state.matchScore.target = val;
          if (state.playPhase === "match_over") {
            if (val === 0 || (state.matchScore.you < val && state.matchScore.cpu < val)) {
              state.matchScore.winner = null;
              resetScenario();
            }
          } else if (val > 0 && (state.fullCourt || state.scenario === "match")) {
            const rim = getTeamTargetRim("offense");
            checkAndHandleMatchWin(rim.x, rim.y);
          }
          syncAllDOM();
          renderFrame();
        }

        function spawnSparkles(wx, wy, color, count) {
          for (let i = 0; i < count; i++) {
            const ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
            const spd = 1.2 + Math.random() * 2.4;
            state.fx.sparkles.push({
              x: wx,
              y: wy,
              z: 1.4 + Math.random() * 0.9,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              vz: 1.6 + Math.random() * 2.0,
              life: 0.7,
              maxLife: 0.7,
              color,
            });
          }
        }

        function getEffectiveZoom() {
          const az = state.cam && state.cam.autoZoom ? state.cam.autoZoom : 1.0;
          const uz = state.cam && state.cam.userZoom ? state.cam.userZoom : 1.0;
          return clamp(az * uz, 0.7, 1.85);
        }

        function setUserZoom(val) {
          state.cam.userZoom = clamp(Number(val) || 1.0, 0.8, 1.5);
          syncAllDOM();
          renderFrame();
        }

        function adjustUserZoom(delta) {
          setUserZoom((state.cam.userZoom || 1.0) + delta);
        }

        function getUserAssignedOffenseMan() {
          if (!isUserOnDefenseNow()) return null;
          return state.fullCourt ? state.defense[0] : state.offense[0];
        }

        function computeLooseBallDropSpot() {
          const b = state.ball;
          const dz = Math.max(0, b.z - 0.24);
          const disc = b.lvz * b.lvz + 2.0 * 9.8 * dz;
          const tDrop = clamp((b.lvz + Math.sqrt(Math.max(0, disc))) / 9.8, 0, 0.85);
          const cLen = getCourtLength();
          return {
            x: clamp(b.x + b.lvx * tDrop, -COURT.halfW + 0.45, COURT.halfW - 0.45),
            y: clamp(b.y + b.lvy * tDrop, 0.55, cLen - 0.55),
          };
        }

        function updateCamera(dt, instant) {
          const me = getControlledPlayer();
          if (!me) return;

          const defNow = isUserOnDefenseNow();
          const activeRimX = COURT.rimX;
          const activeRimY = state.fullCourt && defNow ? COURT.southRimY : COURT.rimY;

          // Weighted Smart Director Focus: 46% YOU + 38% Ball + 16% Active Rim
          const rawFX = 0.46 * me.x + 0.38 * state.ball.x + 0.16 * activeRimX;
          const rawFY = 0.46 * me.y + 0.38 * state.ball.y + 0.16 * activeRimY;

          let targetFX = 0.0;
          let targetFY = 7.0;
          let targetAutoZoom = 1.0;

          if (state.cam.preset === "auto") {
            const spread = Math.max(
              hypot2(me.x - state.ball.x, me.y - state.ball.y),
              hypot2(me.x - activeRimX, me.y - activeRimY) * 0.58,
              hypot2(state.ball.x - activeRimX, state.ball.y - activeRimY) * 0.58
            );
            targetAutoZoom = lerp(1.16, 0.94, clamp((spread - 3.8) / 8.7, 0, 1));

            if (state.fullCourt) {
              // Smoothly open North Hoop (-108..-113 deg) on offense & South Hoop (-67..-72 deg) on defense
              const endBias = clamp((14.0 - rawFY) / 11.5, -1.0, 1.0);
              const sideBias = clamp(rawFX * 0.018, -0.08, 0.08);
              state.cam.targetYaw = wrapAngle(-Math.PI * 0.5 - endBias * 0.35 + sideBias);
              targetFX = clamp(rawFX * 0.68, -3.4, 3.4);
              targetFY = clamp(rawFY, 5.4, 22.6);
            } else {
              // Half-Court Smart 3/4 Director Angle (+/- 22 deg) so passing lanes & defender vision open stereoscopically
              const avgWX = 0.56 * me.x + 0.44 * state.ball.x;
              state.cam.targetYaw = clamp(-avgWX * 0.068, -0.38, 0.38);
              targetFX = clamp(rawFX * 0.65, -3.2, 3.2);
              targetFY = clamp(rawFY * 0.72 + 1.6, 4.2, 7.8);
            }
          } else {
            if (state.cam.preset === "tv") {
              state.cam.targetYaw = CAMERA_PRESETS.tv;
            } else if (state.cam.preset === "iso") {
              state.cam.targetYaw = CAMERA_PRESETS.iso;
            } else if (state.cam.preset === "behind") {
              state.cam.targetYaw = CAMERA_PRESETS.behind;
            } else if (state.cam.preset === "follow") {
              const gx = activeRimX - me.x;
              const gy = activeRimY - me.y;
              if (hypot2(gx, gy) > 0.25) {
                state.cam.targetYaw = Math.atan2(gx, -gy);
              }
            }

            targetAutoZoom = 1.0;
            if (state.fullCourt) {
              if (state.cam.preset === "follow") {
                targetFX = clamp(me.x * 0.5, -3.5, 3.5);
                targetFY = clamp(me.y, 7.5, 20.5);
              } else {
                targetFX = clamp(rawFX * 0.42, -2.6, 2.6);
                targetFY = clamp(rawFY, 6.2, 21.8);
              }
            } else {
              if (state.cam.preset === "behind" && Math.abs(state.cam.yaw) < 0.05) {
                targetFX = clamp(me.x * 0.42, -3.1, 3.1);
                targetFY = 6.6;
              } else if (state.cam.preset === "follow") {
                targetFX = clamp(me.x * 0.48, -3.2, 3.2);
                targetFY = clamp(me.y * 0.55 + 2.6, 4.2, 8.4);
              } else {
                targetFX = clamp(me.x * 0.28, -2.2, 2.2);
                targetFY = 6.5;
              }
            }
          }

          state.cam.targetAutoZoom = targetAutoZoom;

          if (instant || dt <= 0 || state.cam.dragging) {
            state.cam.yaw = state.cam.targetYaw;
            state.cam.focusX = targetFX;
            state.cam.focusY = targetFY;
            state.cam.autoZoom = targetAutoZoom;
            state.cam.velFX = 0;
            state.cam.velFY = 0;
            state.cam.velYaw = 0;
            state.cam.velZoom = 0;
          } else {
            const dtCam = Math.min(dt, 0.04);
            const yawSmooth = state.cam.preset === "auto" ? 0.52 : 0.26;
            const posSmooth = state.cam.preset === "auto" ? 0.36 : 0.24;
            const zoomSmooth = 0.45;
            state.cam.yaw = smoothDampAngle(state.cam.yaw, state.cam.targetYaw, state.cam, "velYaw", yawSmooth, 1.65, dtCam);
            state.cam.focusX = smoothDampScalar(state.cam.focusX, targetFX, state.cam, "velFX", posSmooth, 16.0, dtCam);
            state.cam.focusY = smoothDampScalar(state.cam.focusY, targetFY, state.cam, "velFY", posSmooth, 18.0, dtCam);
            state.cam.autoZoom = smoothDampScalar(state.cam.autoZoom, targetAutoZoom, state.cam, "velZoom", zoomSmooth, 1.4, dtCam);
          }
        }

        function updateEffects(dt) {
          if (keys.SpaceFlash > 0) keys.SpaceFlash = Math.max(0, keys.SpaceFlash - dt);
          if (keys.CallFlash > 0) keys.CallFlash = Math.max(0, keys.CallFlash - dt);
          if (state.fx.netSwishTimer > 0) state.fx.netSwishTimer = Math.max(0, state.fx.netSwishTimer - dt);
          if (state.fx.crowdCheerTimer > 0) state.fx.crowdCheerTimer = Math.max(0, state.fx.crowdCheerTimer - dt);

          if (state.matchScore.youPopTimer > 0) {
            state.matchScore.youPopTimer = Math.max(0, state.matchScore.youPopTimer - dt);
            const sYou = document.getElementById("scoreYou");
            if (sYou) sYou.classList.toggle("score-pop", state.matchScore.youPopTimer > 0);
          }
          if (state.matchScore.cpuPopTimer > 0) {
            state.matchScore.cpuPopTimer = Math.max(0, state.matchScore.cpuPopTimer - dt);
            const sCpu = document.getElementById("scoreCpu");
            if (sCpu) sCpu.classList.toggle("score-pop", state.matchScore.cpuPopTimer > 0);
          }

          const me = getControlledPlayer();
          state.fx.camX = lerp(state.fx.camX, clamp(me.x * 0.42, -3.1, 3.1), clamp(5.8 * dt, 0, 1));
          updateCamera(dt, false);

          for (let i = state.fx.scorePopups.length - 1; i >= 0; i--) {
            const pop = state.fx.scorePopups[i];
            pop.life -= dt;
            if (pop.life <= 0) {
              state.fx.scorePopups.splice(i, 1);
              continue;
            }
            pop.z += pop.vz * dt;
            pop.vz *= 0.96;
          }

          for (let i = state.fx.sparkles.length - 1; i >= 0; i--) {
            const sp = state.fx.sparkles[i];
            sp.life -= dt;
            if (sp.life <= 0) {
              state.fx.sparkles.splice(i, 1);
              continue;
            }
            sp.x += sp.vx * dt;
            sp.y += sp.vy * dt;
            sp.z = Math.max(0.1, sp.z + sp.vz * dt);
            sp.vz -= 6.5 * dt;
          }

          for (let i = state.fx.dusts.length - 1; i >= 0; i--) {
            const du = state.fx.dusts[i];
            du.life -= dt;
            if (du.life <= 0) {
              state.fx.dusts.splice(i, 1);
              continue;
            }
            du.x += du.vx * dt;
            du.y += du.vy * dt;
            du.z += du.vz * dt;
          }
        }

        function stepSimulation(realDt) {
          const clampedReal = Math.min(realDt, 0.05);
          if (state.coach.lockTimer > 0) {
            state.coach.lockTimer = Math.max(0, state.coach.lockTimer - clampedReal);
          }
          if (state.paused) return;

          const dt = clampedReal * state.speedScale;
          state.simTime += dt;
          tickAllPlayerTimers(dt);

          if (state.playPhase !== "celebrate" && state.playPhase !== "match_over") {
            updateUserPlayer(dt);
            updateTargetSpot(dt);
            updateOffenseAI(dt);
            updateDefendersAI(dt);
            updateDribblePressure(dt);
            evaluateSpacingAndLane(dt);
            updatePassTarget();
            updateTutorialLogic(dt);
          } else {
            state.passTarget.idx = -1;
            state.dribblePressure.timer = 0;
            state.dribblePressure.ratio = 0;
          }
          updateAllPlayerFacings(dt);
          updateBallAndPhases(dt);
          updateEffects(dt);
          syncLiveBadgesDOM();
          syncKeycapsDOM();
        }

        /* =====================================================================
         * 9. View B Renderer: Broadcast Tactical Board (360 Cones & Pass Target)
         * ===================================================================== */
        const canvasA = document.getElementById("canvasA");
        const canvasB = document.getElementById("canvasB");
        const ctxA = canvasA.getContext("2d");
        const ctxB = canvasB.getContext("2d");

        function resizeCanvases() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const holders = [
            { holder: document.getElementById("holderA"), canvas: canvasA },
            { holder: document.getElementById("holderB"), canvas: canvasB },
          ];
          for (let i = 0; i < holders.length; i++) {
            const h = holders[i].holder;
            const c = holders[i].canvas;
            if (!h || h.offsetParent === null) continue;
            const w = Math.max(240, h.clientWidth);
            const ht = Math.max(220, h.clientHeight);
            if (c.width !== Math.round(w * dpr) || c.height !== Math.round(ht * dpr)) {
              c.width = Math.round(w * dpr);
              c.height = Math.round(ht * dpr);
            }
          }
        }

        function drawCameraBadgeOnBoard(ctx, W, H, arrowScreenAng) {
          const cx = W - 44;
          const cy = H - 22;
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.90)";
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.roundRect(cx - 34, cy - 13, 68, 26, 8);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#bae6fd";
          ctx.font = "900 10px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText("🎥", cx - 28, cy + 4);

          const ax = cx + 12;
          const ay = cy;
          ctx.fillStyle = "rgba(56, 189, 248, 0.32)";
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.arc(ax, ay, 11, arrowScreenAng - 0.48, arrowScreenAng + 0.48);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "#facc15";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(ax - Math.cos(arrowScreenAng) * 5, ay - Math.sin(arrowScreenAng) * 5);
          ctx.lineTo(ax + Math.cos(arrowScreenAng) * 8, ay + Math.sin(arrowScreenAng) * 8);
          ctx.stroke();
          ctx.restore();
        }

        /* Pure Orthogonal WASD 4-Way Cross Pad Badge for 📋 BOARD Mode */
        function drawBoardCardinalBadge(ctx, W, H) {
          const cx = W - 52;
          const cy = H - 22;
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.roundRect(cx - 42, cy - 13, 84, 26, 8);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#7dd3fc";
          ctx.font = "900 9.5px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText("WASD", cx - 35, cy + 3.5);

          const px = cx + 21;
          const py = cy;
          ctx.strokeStyle = "#64748b";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(px, py - 8);
          ctx.lineTo(px, py + 8);
          ctx.moveTo(px - 8, py);
          ctx.lineTo(px + 8, py);
          ctx.stroke();

          const drawTip = (dx, dy, active) => {
            ctx.fillStyle = active ? "#facc15" : "#cbd5e1";
            ctx.beginPath();
            ctx.arc(px + dx, py + dy, active ? 3.2 : 2.3, 0, Math.PI * 2);
            ctx.fill();
          };
          drawTip(0, -8, keys.W);
          drawTip(0, 8, keys.S);
          drawTip(-8, 0, keys.A);
          drawTip(8, 0, keys.D);
          ctx.restore();
        }

        function renderFullCourtTopDownB(W, H) {
          const pad = 16;
          const scale = Math.min((W - pad * 2) / COURT.fullLength, (H - pad * 2 - 10) / COURT.width);
          const courtPxW = COURT.fullLength * scale;
          const courtPxH = COURT.width * scale;
          const leftX = (W - courtPxW) * 0.5;
          const topY = (H - courtPxH) * 0.5;
          const midY = topY + courtPxH * 0.5;

          // Horizontal mapping matching TV Cam (South y=28 on LEFT, North y=0 on RIGHT, wx=-7.5 TOP, wx=+7.5 BOTTOM)
          const mapX = (wy) => leftX + (COURT.fullLength - wy) * scale;
          const mapY = (wx) => midY + wx * scale;
          const mapAng = (rad) => rad + Math.PI * 0.5;

          // Royal Blue Court Apron
          ctxB.fillStyle = "#1e3a8a";
          ctxB.fillRect(leftX - 7, topY - 7, courtPxW + 14, courtPxH + 14);

          // Maple Hardwood Planks
          ctxB.fillStyle = "#eec68a";
          ctxB.fillRect(leftX, topY, courtPxW, courtPxH);
          for (let ym = 0; ym < 28; ym++) {
            ctxB.fillStyle = ym % 2 === 0 ? "rgba(180, 118, 48, 0.11)" : "rgba(255, 245, 225, 0.13)";
            ctxB.fillRect(mapX(ym + 1), topY, scale, courtPxH);
          }

          // Right Key (North Hoop y = 0..5.8, Blue YOU Target) & Left Key (South Hoop y = 22.2..28, Red CPU Target)
          ctxB.fillStyle = "rgba(37, 99, 235, 0.80)";
          ctxB.fillRect(mapX(COURT.paintLen), mapY(-COURT.paintHalfW), COURT.paintLen * scale, COURT.paintHalfW * 2 * scale);
          ctxB.fillStyle = "rgba(220, 38, 38, 0.76)";
          ctxB.fillRect(leftX, mapY(-COURT.paintHalfW), COURT.paintLen * scale, COURT.paintHalfW * 2 * scale);

          // Subtle Floor Goal Labels
          ctxB.save();
          ctxB.font = "900 10px sans-serif";
          ctxB.textAlign = "center";
          ctxB.fillStyle = "rgba(29, 78, 216, 0.55)";
          ctxB.fillText("YOU SCORE ▶", mapX(9.2), midY + 4);
          ctxB.fillStyle = "rgba(185, 28, 28, 0.55)";
          ctxB.fillText("◀ DEFEND", mapX(18.8), midY + 4);
          ctxB.restore();

          // Crisp Court Lines, Midcourt & Center Circle
          ctxB.strokeStyle = "#ffffff";
          ctxB.lineWidth = 2.0;
          ctxB.strokeRect(leftX, topY, courtPxW, courtPxH);
          ctxB.strokeRect(mapX(COURT.paintLen), mapY(-COURT.paintHalfW), COURT.paintLen * scale, COURT.paintHalfW * 2 * scale);
          ctxB.strokeRect(leftX, mapY(-COURT.paintHalfW), COURT.paintLen * scale, COURT.paintHalfW * 2 * scale);

          // Half-court line & Center circle
          ctxB.beginPath();
          ctxB.moveTo(mapX(COURT.midY), topY);
          ctxB.lineTo(mapX(COURT.midY), topY + courtPxH);
          ctxB.stroke();

          ctxB.beginPath();
          ctxB.arc(mapX(COURT.midY), midY, 1.8 * scale, 0, Math.PI * 2);
          ctxB.stroke();

          // Both Free-Throw Circles & Restricted Arcs
          ctxB.beginPath();
          ctxB.arc(mapX(COURT.paintLen), midY, COURT.ftRadius * scale, 0, Math.PI * 2);
          ctxB.stroke();
          ctxB.beginPath();
          ctxB.arc(mapX(COURT.fullLength - COURT.paintLen), midY, COURT.ftRadius * scale, 0, Math.PI * 2);
          ctxB.stroke();

          ctxB.beginPath();
          ctxB.arc(mapX(COURT.rimY), midY, COURT.noChargeRadius * scale, Math.PI * 0.5, Math.PI * 1.5);
          ctxB.stroke();
          ctxB.beginPath();
          ctxB.arc(mapX(COURT.southRimY), midY, COURT.noChargeRadius * scale, -Math.PI * 0.5, Math.PI * 0.5);
          ctxB.stroke();

          // Right (North) 3PT Line & Left (South) 3PT Line
          const breakAng = Math.atan2(COURT.threeBreakY - COURT.rimY, COURT.threeCornerX);
          ctxB.beginPath();
          ctxB.moveTo(mapX(0), mapY(-COURT.threeCornerX));
          ctxB.lineTo(mapX(COURT.threeBreakY), mapY(-COURT.threeCornerX));
          ctxB.arc(mapX(COURT.rimY), midY, COURT.threeRadius * scale, -(Math.PI * 0.5 + breakAng), Math.PI * 0.5 + breakAng, true);
          ctxB.lineTo(mapX(0), mapY(COURT.threeCornerX));
          ctxB.stroke();

          ctxB.beginPath();
          ctxB.moveTo(mapX(COURT.fullLength), mapY(-COURT.threeCornerX));
          ctxB.lineTo(mapX(COURT.southThreeBreakY), mapY(-COURT.threeCornerX));
          ctxB.arc(mapX(COURT.southRimY), midY, COURT.threeRadius * scale, -(Math.PI * 0.5 - breakAng), Math.PI * 0.5 - breakAng, false);
          ctxB.lineTo(mapX(COURT.fullLength), mapY(COURT.threeCornerX));
          ctxB.stroke();

          // Both Backboards & Rims
          ctxB.strokeStyle = "#0f172a";
          ctxB.lineWidth = 3.2;
          ctxB.beginPath();
          ctxB.moveTo(mapX(COURT.backboardY), mapY(-COURT.backboardHalfW));
          ctxB.lineTo(mapX(COURT.backboardY), mapY(COURT.backboardHalfW));
          ctxB.moveTo(mapX(COURT.southBackboardY), mapY(-COURT.backboardHalfW));
          ctxB.lineTo(mapX(COURT.southBackboardY), mapY(COURT.backboardHalfW));
          ctxB.stroke();

          ctxB.strokeStyle = "#ea580c";
          ctxB.lineWidth = 2.6;
          ctxB.beginPath();
          ctxB.arc(mapX(COURT.rimY), midY, COURT.rimRadius * scale + 1.5, 0, Math.PI * 2);
          ctxB.stroke();
          ctxB.beginPath();
          ctxB.arc(mapX(COURT.southRimY), midY, COURT.rimRadius * scale + 1.5, 0, Math.PI * 2);
          ctxB.stroke();

          // Target Spot Circle
          if (state.showHints && state.targetSpot.active) {
            const pulse = 1 + Math.sin(state.simTime * 5.2) * 0.07;
            const rx = mapX(state.targetSpot.y);
            const ry = mapY(state.targetSpot.x);
            const rr = state.targetSpot.radius * scale * pulse;
            ctxB.save();
            ctxB.fillStyle = isUserOnDefenseNow() ? "rgba(56, 189, 248, 0.24)" : "rgba(34, 197, 94, 0.26)";
            ctxB.strokeStyle = isUserOnDefenseNow() ? "#38bdf8" : "#16a34a";
            ctxB.lineWidth = 2.4;
            ctxB.setLineDash([6, 4]);
            ctxB.beginPath();
            ctxB.arc(rx, ry, rr, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.fillStyle = "#0f172a";
            ctxB.font = "900 10px sans-serif";
            ctxB.textAlign = "center";
            ctxB.fillText(state.targetSpot.label, rx, ry + 3.5);
            ctxB.restore();
          }

          // On-Ball Direct Pass Target Ring (E Key)
          if (
            !isUserOnDefenseNow() &&
            !state.ball.inFlight &&
            !state.ball.loose &&
            state.ball.holderTeam === "offense" &&
            state.ball.holderIdx === 0 &&
            state.passTarget.idx > 0
          ) {
            const me = state.offense[0];
            const targetMate = state.offense[state.passTarget.idx];
            const mx = mapX(me.y);
            const my = mapY(me.x);
            const tx = mapX(targetMate.y);
            const ty = mapY(targetMate.x);
            const ringR = 0.92 * scale * (1 + Math.sin(state.simTime * 6.5) * 0.09);

            ctxB.save();
            ctxB.strokeStyle = state.passTarget.laneOpen ? "rgba(56, 189, 248, 0.85)" : "rgba(251, 146, 60, 0.85)";
            ctxB.lineWidth = 2.2;
            ctxB.setLineDash([5, 4]);
            ctxB.beginPath();
            ctxB.moveTo(mx, my);
            ctxB.lineTo(tx, ty);
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.fillStyle = state.passTarget.laneOpen ? "rgba(56, 189, 248, 0.24)" : "rgba(251, 146, 60, 0.22)";
            ctxB.strokeStyle = state.passTarget.laneOpen ? "#38bdf8" : "#fb923c";
            ctxB.lineWidth = 2.4;
            ctxB.beginPath();
            ctxB.arc(tx, ty, ringR, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();
          }

          // Amber Dribble Strip Warning Ring (TIGHT!)
          if (state.dribblePressure.ratio >= 0.48) {
            const me = state.offense[0];
            ctxB.save();
            ctxB.fillStyle = "rgba(245, 158, 11, 0.28)";
            ctxB.strokeStyle = "#f59e0b";
            ctxB.lineWidth = 2.8;
            ctxB.beginPath();
            ctxB.arc(mapX(me.y), mapY(me.x), (0.95 + Math.sin(state.simTime * 18) * 0.12) * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();
          }

          // Defender Vision Cones
          const coneHalfAng = (38 * Math.PI) / 180;
          const defList = isUserOnDefenseNow() ? state.offense.slice(1) : state.defense;
          for (let i = 0; i < defList.length; i++) {
            const d = defList[i];
            const sx = mapX(d.y);
            const sy = mapY(d.x);
            const coneR = 2.3 * scale;
            const dirAng = mapAng(d.facing !== undefined ? d.facing : d.gazeAngle);
            ctxB.save();
            ctxB.fillStyle = d.ballWatchFactor > 0.55 ? "rgba(250, 204, 21, 0.26)" : "rgba(239, 68, 68, 0.14)";
            ctxB.beginPath();
            ctxB.moveTo(sx, sy);
            ctxB.arc(sx, sy, coneR, dirAng - coneHalfAng, dirAng + coneHalfAng);
            ctxB.closePath();
            ctxB.fill();
            ctxB.restore();
          }

          // Defensive Matchup Tether + Assigned Man Target Ring (Full-Court Defense)
          if (isUserOnDefenseNow()) {
            const meBlue = state.offense[0];
            const myMan = getUserAssignedOffenseMan();
            if (meBlue && myMan) {
              const mx = mapX(meBlue.y);
              const my = mapY(meBlue.x);
              const ox = mapX(myMan.y);
              const oy = mapY(myMan.x);
              ctxB.save();
              ctxB.strokeStyle = "rgba(56, 189, 248, 0.88)";
              ctxB.lineWidth = 2.4;
              ctxB.setLineDash([5, 4]);
              ctxB.beginPath();
              ctxB.moveTo(mx, my);
              ctxB.lineTo(ox, oy);
              ctxB.stroke();
              ctxB.setLineDash([]);
              ctxB.fillStyle = "rgba(56, 189, 248, 0.22)";
              ctxB.strokeStyle = "#38bdf8";
              ctxB.lineWidth = 2.4;
              ctxB.beginPath();
              ctxB.arc(ox, oy, Math.max(12, 0.72 * scale), 0, Math.PI * 2);
              ctxB.fill();
              ctxB.stroke();
              ctxB.restore();
            }
          }

          // In-Flight Pass / Shot Trajectory Guide & Loose Rebound Landing Target Ring on Full-Court Board
          if (state.ball.inFlight) {
            const fx = mapX(state.ball.fromY);
            const fy = mapY(state.ball.fromX);
            const tx = mapX(state.ball.toY);
            const ty = mapY(state.ball.toX);
            const isShot = state.ball.flightType === "shot";
            ctxB.save();
            ctxB.strokeStyle = isShot ? "rgba(250, 204, 21, 0.85)" : "rgba(56, 189, 248, 0.85)";
            ctxB.lineWidth = 2.2;
            ctxB.setLineDash([5, 4]);
            ctxB.beginPath();
            ctxB.moveTo(fx, fy);
            ctxB.lineTo(tx, ty);
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.strokeStyle = isShot ? "#facc15" : "#38bdf8";
            ctxB.lineWidth = 2.2;
            ctxB.beginPath();
            ctxB.arc(tx, ty, (0.58 + Math.sin(state.simTime * 9.0) * 0.08) * scale, 0, Math.PI * 2);
            ctxB.stroke();
            ctxB.restore();
          } else if (state.ball.loose) {
            const drop = computeLooseBallDropSpot();
            const dx = mapX(drop.y);
            const dy = mapY(drop.x);
            ctxB.save();
            ctxB.fillStyle = "rgba(56, 189, 248, 0.24)";
            ctxB.strokeStyle = "#38bdf8";
            ctxB.lineWidth = 2.5;
            ctxB.setLineDash([4, 3]);
            ctxB.beginPath();
            ctxB.arc(dx, dy, (0.76 + Math.sin(state.simTime * 10.0) * 0.09) * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();
          }

          // Player Tokens
          const drawFCToken = (p, isBlue, isMe, hasBallNow) => {
            const sx = mapX(p.y);
            const sy = mapY(p.x);
            const rPx = Math.max(8.5, 0.52 * scale);
            const fAng = mapAng(p.facing !== undefined ? p.facing : p.gazeAngle);

            ctxB.fillStyle = "rgba(15, 23, 42, 0.35)";
            ctxB.beginPath();
            ctxB.arc(sx, sy + 2, rPx, 0, Math.PI * 2);
            ctxB.fill();

            if (hasBallNow) {
              const bPulse = 1 + Math.sin(state.simTime * 8.5) * 0.08;
              ctxB.save();
              ctxB.strokeStyle = "#fb923c";
              ctxB.lineWidth = 3.2;
              ctxB.beginPath();
              ctxB.arc(sx, sy, (rPx + 5.6) * bPulse, 0, Math.PI * 2);
              ctxB.stroke();
              ctxB.strokeStyle = "#ffffff";
              ctxB.lineWidth = 1.6;
              ctxB.beginPath();
              ctxB.arc(sx, sy, rPx + 2.8, 0, Math.PI * 2);
              ctxB.stroke();
              ctxB.restore();
            }

            if (isMe) {
              ctxB.strokeStyle = "#facc15";
              ctxB.lineWidth = 3.8;
              ctxB.beginPath();
              ctxB.arc(sx, sy, rPx + 3.8, 0, Math.PI * 2);
              ctxB.stroke();
            }

            ctxB.fillStyle = isMe ? "#facc15" : "#ffffff";
            ctxB.beginPath();
            ctxB.moveTo(sx + Math.cos(fAng) * (rPx + 3.8), sy + Math.sin(fAng) * (rPx + 3.8));
            ctxB.lineTo(sx + Math.cos(fAng - 0.45) * (rPx - 1), sy + Math.sin(fAng - 0.45) * (rPx - 1));
            ctxB.lineTo(sx + Math.cos(fAng + 0.45) * (rPx - 1), sy + Math.sin(fAng + 0.45) * (rPx - 1));
            ctxB.closePath();
            ctxB.fill();

            const oppTokenFC = !isBlue;
            ctxB.fillStyle = isBlue ? "#2563eb" : p.offBalanceTimer > 0 && oppTokenFC ? "#f97316" : "#dc2626";
            ctxB.strokeStyle = "#ffffff";
            ctxB.lineWidth = 1.9;
            ctxB.beginPath();
            ctxB.arc(sx, sy, rPx, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();

            ctxB.fillStyle = isMe ? "#fef08a" : "#ffffff";
            ctxB.font = "900 10px sans-serif";
            ctxB.textAlign = "center";
            ctxB.fillText(isMe ? "★" : String(p.number), sx, sy + 3.5);
            if (oppTokenFC && p.offBalanceTimer > 0) {
              ctxB.font = "900 11px sans-serif";
              ctxB.fillText("⚡", sx, sy - rPx - 3);
            }
          };

          for (let i = 0; i < state.defense.length; i++) {
            const hb = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "defense" && state.ball.holderIdx === i;
            drawFCToken(state.defense[i], false, false, hb);
          }
          for (let i = 0; i < state.offense.length; i++) {
            const hb = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === i;
            drawFCToken(state.offense[i], true, i === 0, hb);
          }

          // Basketball Token
          const bx = mapX(state.ball.y);
          const by = mapY(state.ball.x);
          if (state.ball.gatherTimer > 0 || state.ball.loose) {
            ctxB.strokeStyle = state.ball.loose ? "#38bdf8" : "#facc15";
            ctxB.lineWidth = 2.6;
            ctxB.beginPath();
            ctxB.arc(bx, by, 11 + Math.sin(state.simTime * 22) * 2, 0, Math.PI * 2);
            ctxB.stroke();
          }
          const ballR = Math.max(5.8, (0.3 + Math.min(0.16, state.ball.z * 0.04)) * scale);
          ctxB.fillStyle = "#f97316";
          ctxB.strokeStyle = "#7c2d12";
          ctxB.lineWidth = 1.8;
          ctxB.beginPath();
          ctxB.arc(bx, by, ballR, 0, Math.PI * 2);
          ctxB.fill();
          ctxB.stroke();

          // In 📋 BOARD sole view (or board-focused input), show orthogonal WASD cross instead of 3D camera compass
          if (state.viewMode === "b" || isBoardInputActive()) {
            drawBoardCardinalBadge(ctxB, W, H);
          } else {
            drawCameraBadgeOnBoard(ctxB, W, H, state.cam.yaw);
          }
