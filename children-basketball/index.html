<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex" />
    <title>HOOP KID - Spacing &amp; Defense Arcade Coach</title>
    <style>
      :root {
        --bg-arena: #0b1120;
        --bg-card: #151f32;
        --bg-strip: #1e293b;
        --bg-pill: #0f172a;
        --border-card: #2d3d59;
        --ink-bright: #f8fafc;
        --ink-muted: #94a3b8;
        --blue-main: #2563eb;
        --blue-glow: #3b82f6;
        --red-main: #dc2626;
        --red-glow: #ef4444;
        --green-main: #16a34a;
        --green-bright: #22c55e;
        --gold-main: #eab308;
        --gold-bright: #facc15;
        --orange-main: #ea580c;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 10px 14px 16px;
        font-family:
          "SF Pro Rounded",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-arena) 68%);
        color: var(--ink-bright);
        min-height: 100vh;
        user-select: none;
      }

      .app-shell {
        max-width: 1480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Top Arena Bar */
      .top-header {
        background: var(--bg-card);
        border: 2px solid var(--border-card);
        border-radius: 16px;
        padding: 8px 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      .brand-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, #fb923c, #ea580c);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
        box-shadow: 0 3px 10px rgba(234, 88, 12, 0.45);
      }

      .brand-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .brand-title h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #ffffff;
      }

      .brand-tag {
        font-size: 11px;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(250, 204, 21, 0.16);
        color: var(--gold-bright);
        border: 1px solid rgba(250, 204, 21, 0.4);
      }

      .toolbar-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .btn-group {
        display: inline-flex;
        background: var(--bg-pill);
        padding: 3px;
        border-radius: 12px;
        border: 1px solid #26354d;
        gap: 3px;
        align-items: center;
      }

      button {
        font-family: inherit;
        border: none;
        background: transparent;
        color: var(--ink-muted);
        font-size: 13px;
        font-weight: 800;
        padding: 6px 11px;
        border-radius: 9px;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          background 0.14s ease,
          color 0.14s ease;
        white-space: nowrap;
      }

      button:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
      }

      button:active {
        transform: scale(0.96);
      }

      button.active {
        background: #334155;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      }

      button.active-blue {
        background: linear-gradient(180deg, #3b82f6, #1d4ed8);
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(59, 130, 246, 0.45);
      }

      button.active-red {
        background: linear-gradient(180deg, #ef4444, #b91c1c);
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(239, 68, 68, 0.45);
      }

      button.active-arena {
        background: linear-gradient(180deg, #f59e0b, #d97706);
        color: #0f172a;
        box-shadow: 0 2px 12px rgba(245, 158, 11, 0.5);
      }

      .top-mode-group {
        background: #090f1d;
        border: 2px solid #334155;
        padding: 3px;
        border-radius: 13px;
        gap: 4px;
      }

      .top-mode-btn {
        font-size: 14px;
        font-weight: 900;
        padding: 7px 15px;
        border-radius: 10px;
        letter-spacing: 0.02em;
      }

      .top-mode-btn.active-practice {
        background: linear-gradient(180deg, #10b981, #059669);
        color: #052e16;
        box-shadow: 0 2px 12px rgba(16, 185, 129, 0.48);
      }

      .top-mode-btn.active-game {
        background: linear-gradient(180deg, #facc15, #d97706);
        color: #0f172a;
        box-shadow: 0 2px 14px rgba(250, 204, 21, 0.55);
      }

      .subbar-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
      }

      .subbar-left {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .game-type-btn {
        background: var(--bg-strip);
        color: #cbd5e1;
        border: 2px solid #334155;
        border-bottom-width: 3px;
        border-radius: 11px;
        padding: 7px 14px;
        font-size: 13.5px;
        font-weight: 900;
      }

      .game-type-btn.active {
        background: linear-gradient(180deg, #0284c7, #1d4ed8);
        border-color: #7dd3fc;
        color: #ffffff;
        box-shadow: 0 3px 12px rgba(14, 165, 233, 0.45);
      }

      .diff-btn.active[data-diff="easy"] {
        background: linear-gradient(180deg, #22c55e, #15803d);
        color: #052e16;
        box-shadow: 0 2px 8px rgba(34, 197, 94, 0.4);
      }

      .diff-btn.active[data-diff="medium"] {
        background: linear-gradient(180deg, #3b82f6, #1d4ed8);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
      }

      .diff-btn.active[data-diff="hard"] {
        background: linear-gradient(180deg, #f97316, #dc2626);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.45);
      }

      button.action-pill {
        background: var(--bg-strip);
        color: #e2e8f0;
        border: 1.5px solid #334155;
        border-bottom-width: 3px;
        padding: 6px 11px;
        border-radius: 10px;
      }

      button.action-pill.active {
        background: rgba(22, 163, 74, 0.25);
        border-color: #22c55e;
        color: #86efac;
      }

      button.action-pill.paused {
        background: rgba(234, 179, 8, 0.25);
        border-color: var(--gold-bright);
        color: #fef08a;
      }

      /* Mode Cards & Match Controls Strip */
      .control-strip {
        background: var(--bg-card);
        border: 2px solid var(--border-card);
        border-radius: 16px;
        padding: 7px 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .scenario-cards {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .scenario-btn {
        background: var(--bg-strip);
        color: #cbd5e1;
        border: 2px solid #334155;
        border-bottom-width: 3px;
        border-radius: 11px;
        padding: 7px 13px;
        font-size: 13.5px;
        font-weight: 900;
        letter-spacing: 0.01em;
      }

      .scenario-btn.learn-card {
        border-color: #ca8a04;
        color: #fde047;
      }

      .scenario-btn.learn-card.active {
        background: linear-gradient(180deg, #eab308, #ca8a04);
        border-color: #fef08a;
        color: #0f172a;
        box-shadow: 0 3px 12px rgba(234, 179, 8, 0.4);
      }

      .scenario-btn.match-card {
        border-color: #0ea5e9;
        color: #7dd3fc;
      }

      .scenario-btn.match-card.active {
        background: linear-gradient(180deg, #0284c7, #0369a1);
        border-color: #7dd3fc;
        color: #ffffff;
        box-shadow: 0 3px 12px rgba(14, 165, 233, 0.45);
      }

      .scenario-btn.active {
        background: linear-gradient(180deg, #f97316, #c2410c);
        border-color: #fdba74;
        color: #ffffff;
        box-shadow: 0 3px 10px rgba(249, 115, 22, 0.35);
      }

      .scenario-btn.def-drill.active {
        background: linear-gradient(180deg, #ef4444, #b91c1c);
        border-color: #fca5a5;
        color: #ffffff;
        box-shadow: 0 3px 10px rgba(239, 68, 68, 0.38);
      }

      .right-sub-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* Large Arcade LED Match Scoreboard Bar (Full-Court & Half-Court 5v5 Match) */
      .match-scoreboard {
        display: none;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        background: linear-gradient(180deg, #090f1d 0%, #111c33 100%);
        border: 2.5px solid #38bdf8;
        border-radius: 16px;
        padding: 8px 14px;
        box-shadow:
          0 8px 24px rgba(2, 132, 199, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .match-scoreboard.visible {
        display: flex;
      }

      .match-scoreboard.win-glow {
        border-color: #facc15;
        box-shadow: 0 0 24px rgba(250, 204, 21, 0.45);
      }

      .sb-team {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 5px 14px;
        border-radius: 13px;
        min-width: 158px;
      }

      .sb-team.sb-blue {
        background: linear-gradient(90deg, rgba(37, 99, 235, 0.34) 0%, rgba(15, 23, 42, 0.92) 100%);
        border: 2px solid #3b82f6;
        justify-content: space-between;
      }

      .sb-team.sb-red {
        background: linear-gradient(270deg, rgba(220, 38, 38, 0.34) 0%, rgba(15, 23, 42, 0.92) 100%);
        border: 2px solid #ef4444;
        justify-content: space-between;
      }

      .sb-tag {
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.04em;
        color: #f8fafc;
      }

      .sb-blue .sb-tag {
        color: #93c5fd;
      }
      .sb-red .sb-tag {
        color: #fca5a5;
      }

      .sb-digits {
        font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
        font-size: 28px;
        line-height: 1;
        font-weight: 900;
        color: #ffffff;
        min-width: 38px;
        text-align: center;
        text-shadow: 0 2px 10px rgba(56, 189, 248, 0.45);
        transition:
          transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
          color 0.16s ease;
      }

      .sb-red .sb-digits {
        text-shadow: 0 2px 10px rgba(248, 113, 113, 0.45);
      }

      .sb-digits.score-pop {
        transform: scale(1.34);
        color: #fde047;
        text-shadow: 0 0 16px rgba(250, 204, 21, 0.9);
      }

      .sb-center {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .sb-vs-pill {
        background: #0f172a;
        border: 1.5px solid #334155;
        color: #fde047;
        font-size: 12px;
        font-weight: 900;
        padding: 5px 10px;
        border-radius: 999px;
        letter-spacing: 0.04em;
      }

      .target-group {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: #0f172a;
        border: 1.5px solid #334155;
        padding: 2px 4px;
        border-radius: 10px;
      }

      .target-btn {
        font-size: 11.5px;
        font-weight: 900;
        padding: 4px 9px;
        border-radius: 7px;
        color: #94a3b8;
      }

      .target-btn.active {
        background: linear-gradient(180deg, #facc15, #eab308);
        color: #0f172a;
        box-shadow: 0 1px 6px rgba(250, 204, 21, 0.45);
      }

      .sb-stats-pill {
        background: #0f172a;
        border: 1.5px solid #334155;
        border-radius: 10px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 900;
        color: #4ade80;
      }

      .sb-newgame-btn {
        background: #1e293b;
        border: 1.5px solid #475569;
        color: #e2e8f0;
        border-radius: 10px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 900;
      }

      .sb-win-btn {
        background: linear-gradient(180deg, #fde047, #eab308);
        border: 2px solid #fef08a;
        color: #0f172a;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 900;
        box-shadow: 0 0 16px rgba(250, 204, 21, 0.65);
      }

      /* Interactive 4-Step Tutorial Strip */
      .tutorial-strip {
        background: #172554;
        border: 2px solid #3b82f6;
        border-radius: 14px;
        padding: 6px 12px;
        display: none;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .tutorial-strip.visible {
        display: flex;
      }

      .tut-steps-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .tut-step-pill {
        background: #0f172a;
        border: 2px solid #334155;
        color: #94a3b8;
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 900;
      }

      .tut-step-pill.done {
        background: rgba(22, 163, 74, 0.25);
        border-color: #22c55e;
        color: #86efac;
      }

      .tut-step-pill.current {
        background: #facc15;
        border-color: #fef08a;
        color: #0f172a;
      }

      .tut-nav-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tut-nav-btn {
        background: #1e293b;
        border: 1.5px solid #475569;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 800;
      }

      .tut-grad-btn {
        background: #22c55e;
        color: #052e16;
        border-radius: 9px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 900;
      }

      /* Ultra-Clean Single-Line Kid Callout Banner */
      .coach-banner {
        background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
        border: 2.5px solid #475569;
        border-radius: 16px;
        padding: 8px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .coach-banner.tone-good {
        background: linear-gradient(90deg, #052e16 0%, #14532d 100%);
        border-color: #22c55e;
      }

      .coach-banner.tone-warn {
        background: linear-gradient(90deg, #431407 0%, #7c2d12 100%);
        border-color: #fb923c;
      }

      .coach-banner.tone-celebrate {
        background: linear-gradient(90deg, #172554 0%, #1e40af 100%);
        border-color: #facc15;
      }

      .coach-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .coach-avatar {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 25px;
        flex-shrink: 0;
      }

      .coach-main-msg {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      }

      .status-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .live-badge {
        padding: 6px 13px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 900;
        background: #0f172a;
        border: 2px solid #475569;
        color: #e2e8f0;
      }

      .live-badge.pace-walk {
        border-color: #64748b;
        color: #cbd5e1;
      }
      .live-badge.pace-hesi {
        background: #422006;
        border-color: #facc15;
        color: #fef08a;
      }
      .live-badge.pace-sprint {
        background: #431407;
        border-color: #fb923c;
        color: #fed7aa;
      }
      .live-badge.pace-cop {
        background: #052e16;
        border-color: #4ade80;
        color: #bbf7d0;
        transform: scale(1.05);
      }
      .live-badge.pace-cross {
        background: #172554;
        border-color: #38bdf8;
        color: #bae6fd;
        transform: scale(1.05);
      }

      .live-badge.space-good {
        background: #052e16;
        border-color: #22c55e;
        color: #86efac;
      }
      .live-badge.space-warn {
        background: #431407;
        border-color: #f97316;
        color: #fdba74;
      }
      .live-badge.space-block {
        background: #450a0a;
        border-color: #ef4444;
        color: #fca5a5;
      }
      .live-badge.space-ball {
        background: #172554;
        border-color: #60a5fa;
        color: #bfdbfe;
      }

      /* Dual / Single Court Stage */
      .court-stage {
        display: grid;
        grid-template-columns: 1.22fr 1fr;
        gap: 12px;
        min-height: 460px;
      }

      .court-stage.mode-a-only,
      .court-stage.mode-b-only {
        grid-template-columns: 1fr;
      }

      .court-stage.mode-a-only .panel-b {
        display: none;
      }
      .court-stage.mode-b-only .panel-a {
        display: none;
      }

      .view-card {
        background: var(--bg-card);
        border: 2px solid var(--border-card);
        border-radius: 18px;
        padding: 8px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      }

      .view-card-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 0 4px;
      }

      .cam-controls {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px;
        background: var(--bg-pill);
        padding: 2px 4px;
        border-radius: 10px;
        border: 1px solid #26354d;
      }

      .cam-btn {
        font-size: 11px;
        font-weight: 900;
        padding: 4px 7px;
        border-radius: 7px;
        color: #cbd5e1;
      }

      .cam-btn.active {
        background: linear-gradient(180deg, #38bdf8, #0284c7);
        color: #0f172a;
        box-shadow: 0 1px 6px rgba(56, 189, 248, 0.45);
      }

      .cam-btn[data-cam="auto"].active {
        background: linear-gradient(180deg, #fde047, #f59e0b);
        color: #0f172a;
        box-shadow: 0 1px 8px rgba(250, 204, 21, 0.52);
      }

      .cam-rot-btn {
        font-size: 11px;
        font-weight: 900;
        padding: 4px 6px;
        border-radius: 7px;
        background: #1e293b;
        color: #fde047;
        border: 1px solid #334155;
      }

      .cam-zoom-btn {
        font-size: 11px;
        font-weight: 900;
        padding: 4px 6px;
        border-radius: 7px;
        background: #172554;
        color: #7dd3fc;
        border: 1px solid #1d4ed8;
      }

      .fullcourt-banner {
        display: none;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .fullcourt-banner.visible {
        display: inline-flex;
      }

      .fc-pill {
        background: linear-gradient(90deg, #0f172a, #1e293b);
        border: 2px solid #f59e0b;
        color: #fde047;
        border-radius: 10px;
        padding: 5px 11px;
        font-size: 13px;
        font-weight: 900;
      }

      .fc-dir-pill {
        background: #0f172a;
        border: 1.5px solid #334155;
        color: #cbd5e1;
        border-radius: 9px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 900;
      }

      .view-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 900;
        color: #e2e8f0;
      }

      .view-pill {
        font-size: 11px;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(249, 115, 22, 0.2);
        color: #fdba74;
        border: 1px solid rgba(249, 115, 22, 0.45);
      }

      .view-pill.pill-b {
        background: rgba(59, 130, 246, 0.2);
        color: #93c5fd;
        border-color: rgba(59, 130, 246, 0.45);
      }

      .board-input-pill {
        display: none;
        font-size: 10.5px;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.22);
        color: #7dd3fc;
        border: 1.5px solid #38bdf8;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.28);
        letter-spacing: 0.3px;
      }

        function buildFormation() {
          if (state.fullCourt) {

          if (state.scenario === "learn_d") {
            setupDefenseTutorialStep(state.tutorial.step);
            return;
          }

          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;

          // Special 1v1 On-Ball Defense formation: matchup #0 is the top ball-handler!
          if (state.scenario === "def_onball") {
            state.offense = [
              makePlayer(0, "BALL", 1, 0.0, 8.35, "offense"),

              const toRimX = COURT.rimX - off.x;
              const toRimY = COURT.rimY - off.y;

              const dx = idx === 0 ? 0.0 : off.x + (toRimX / len) * 1.2;
              const dy = idx === 0 ? 6.95 : off.y + (toRimY / len) * 1.2;
              return makePlayer(idx, idx === 0 ? "YOU" : "D" + (idx + 1), idx === 0 ? 7 : idx + 1, dx, dy, "defense");
            });
            return;
          }

          const slots = {
            top: { x: 0.0, y: 8.85 },
            sameWing: { x: side * 5.65, y: 6.15 },
            sameCorner: { x: side * 6.55, y: 2.15 },
            oppWing: { x: -side * 5.65, y: 6.15 },
            oppCorner: { x: -side * 6.55, y: 2.15 },
          };

          const meStart = { x: spot.x, y: spot.y };
          const mateSlot1 = { x: slots.top.x, y: slots.top.y };
          const mateSlot2 = spot.zone === "wing" ? { x: slots.sameCorner.x, y: slots.sameCorner.y } : { x: slots.sameWing.x, y: slots.sameWing.y };
          const mateSlot3 = { x: slots.oppWing.x, y: slots.oppWing.y };
          const mateSlot4 = { x: slots.oppCorner.x, y: slots.oppCorner.y };

          if (state.scenario === "relocation") {
            mateSlot2.x = -side * 2.8;
            mateSlot2.y = 2.05;
          } else if (state.scenario === "cut" || state.scenario === "def_cut") {
            mateSlot1.x = side * 2.1;
            mateSlot1.y = 8.35;
            mateSlot2.x = -side * 1.9;
            mateSlot2.y = 8.85;
          } else if (state.scenario === "vcut") {
            mateSlot1.x = side * 1.5;
            mateSlot1.y = 8.55;
            mateSlot2.x = -side * 2.1;
            mateSlot2.y = 8.85;
          } else if (state.scenario === "give_go") {
            if (spot.zone === "wing") {
              meStart.x = side * 1.75;
              meStart.y = 8.25;
              mateSlot1.x = side * 5.55;
              mateSlot1.y = 5.75;
            } else {
              meStart.x = side * 5.45;
              meStart.y = 6.25;
              mateSlot1.x = side * 6.45;
              mateSlot1.y = 2.35;
            }
            mateSlot2.x = -side * 2.35;
            mateSlot2.y = 8.65;
            mateSlot3.x = -side * 5.75;
            mateSlot3.y = 5.95;
            mateSlot4.x = -side * 6.55;
            mateSlot4.y = 2.15;
          }

          const isOffRole = state.role === "offense";
          state.offense = [
            makePlayer(0, isOffRole ? "YOU" : "MAN", isOffRole ? 7 : 2, meStart.x, meStart.y, "offense"),
            makePlayer(1, "PG", 1, mateSlot1.x, mateSlot1.y, "offense"),
            makePlayer(2, "PF", isOffRole ? 2 : 3, mateSlot2.x, mateSlot2.y, "offense"),
            makePlayer(3, "SF", isOffRole ? 3 : 4, mateSlot3.x, mateSlot3.y, "offense"),
            makePlayer(4, "SG", isOffRole ? 4 : 5, mateSlot4.x, mateSlot4.y, "offense"),
          ];

          state.defense = state.offense.map((off, idx) => {
            const toRimX = COURT.rimX - off.x;
            const toRimY = COURT.rimY - off.y;
            const len = Math.max(0.01, hypot2(toRimX, toRimY));
            const cushion = idx === 0 ? 1.05 : 1.25;
            let dx = off.x + (toRimX / len) * cushion;
            let dy = off.y + (toRimY / len) * cushion;

            if (idx === 0 && state.scenario === "vcut") {
              const ballRef = state.offense[1];
              dx = lerp(off.x, ballRef.x, 0.22);
              dy = lerp(off.y, ballRef.y, 0.22);

              dx = off.x + -side * 0.45;
              dy = off.y + 0.55;
            } else if (idx === 0 && state.scenario === "give_go") {
              dx = off.x + (toRimX / len) * 1.15;
              dy = off.y + (toRimY / len) * 1.15;
            } else if (idx === 1 && state.scenario === "give_go") {
              dx = off.x + (toRimX / len) * 1.45;
              dy = off.y + (toRimY / len) * 1.45;
            } else if (idx === 0 && state.scenario === "defense_help") {
              dx = lerp(off.x, 0, 0.35);
              dy = lerp(off.y, COURT.rimY + 1.5, 0.35);
            } else if (idx === 0 && state.scenario === "def_cut") {
              dx = off.x + -side * 0.35;
              dy = off.y + 0.35;
            }

            return makePlayer(
              idx,
              idx === 0 && state.role === "defense" ? "YOU" : "D" + (idx + 1),
              idx === 0 && state.role === "defense" ? 7 : idx + 1,
              dx,
              dy,
              "defense"

        /* Instant Defender Switch (E Key on Defense): swaps slot 0 with target defender cleanly */
        function switchDefenderToBall() {
          if (state.fullCourt) {
            if (!isUserOnDefenseNow()) return false;
            const ballX = state.ball.x;
            const ballY = state.ball.y;
            let bestIdx = -1;
            let bestDist = 999;
            for (let i = 1; i < state.offense.length; i++) {
              const d = hypot2(state.offense[i].x - ballX, state.offense[i].y - ballY);
              if (d < bestDist) {
                bestDist = d;
                bestIdx = i;
              }
            }
            const dMe = hypot2(state.offense[0].x - ballX, state.offense[0].y - ballY);
            if (dMe < bestDist - 0.5) {
              // Already closest to ball: switch to Blue helper closest to South Hoop!
              let rimBest = 1;
              let rimDist = 999;
              for (let i = 1; i < state.offense.length; i++) {
                const dr = hypot2(state.offense[i].x - COURT.rimX, state.offense[i].y - COURT.southRimY);
                if (dr < rimDist) {
                  rimDist = dr;
                  rimBest = i;
                }
              }
              bestIdx = rimBest;
            }
            if (bestIdx <= 0 || bestIdx >= state.offense.length) return false;

            const tmpBlue = state.offense[0];
            state.offense[0] = state.offense[bestIdx];
            state.offense[bestIdx] = tmpBlue;
            state.offense[0].id = 0;
            state.offense[0].name = "YOU";
            state.offense[0].number = 7;
            state.offense[bestIdx].id = bestIdx;
            state.offense[bestIdx].name = "M" + bestIdx;
            state.offense[bestIdx].number = bestIdx;

            const tmpRed = state.defense[0];
            state.defense[0] = state.defense[bestIdx];
            state.defense[bestIdx] = tmpRed;
            state.defense[0].id = 0;
            state.defense[bestIdx].id = bestIdx;
            if (state.ball.holderTeam === "defense") {
              if (state.ball.holderIdx === 0) state.ball.holderIdx = bestIdx;
              else if (state.ball.holderIdx === bestIdx) state.ball.holderIdx = 0;
            }
            if (state.ball.inFlight && state.ball.passTeam === "defense") {
              if (state.ball.targetIdx === 0) state.ball.targetIdx = bestIdx;
              else if (state.ball.targetIdx === bestIdx) state.ball.targetIdx = 0;
            }

            spawnSparkles(state.offense[0].x, state.offense[0].y, "#facc15", 6);
            setCoachMessage("good", "🔄", "SWITCHED!", 0.8);
            return true;
          }

          if (state.role !== "defense") return false;
          let targetIdx = state.ball.inFlight ? state.ball.targetIdx : state.ball.holderIdx;
          if (targetIdx === 0) {
            // Already on ball-handler: switch to defender guarding player closest to rim!
            let bestIdx = 1;
            let bestRimDist = 99;
            for (let i = 1; i < state.offense.length; i++) {
              const d = hypot2(state.offense[i].x - COURT.rimX, state.offense[i].y - COURT.rimY);
              if (d < bestRimDist) {
                bestRimDist = d;
                bestIdx = i;
              }
            }
            targetIdx = bestIdx;
          }
          if (targetIdx <= 0 || targetIdx >= state.defense.length) return false;

          const tmpDef = state.defense[0];
          state.defense[0] = state.defense[targetIdx];
          state.defense[targetIdx] = tmpDef;
          state.defense[0].id = 0;
          state.defense[0].name = "YOU";
          state.defense[0].number = 7;
          state.defense[targetIdx].id = targetIdx;
          state.defense[targetIdx].name = "D" + (targetIdx + 1);
          state.defense[targetIdx].number = targetIdx + 1;

          const tmpOff = state.offense[0];
          state.offense[0] = state.offense[targetIdx];
          state.offense[targetIdx] = tmpOff;
          state.offense[0].id = 0;
          state.offense[targetIdx].id = targetIdx;

          if (state.ball.holderIdx === 0) state.ball.holderIdx = targetIdx;
          else if (state.ball.holderIdx === targetIdx) state.ball.holderIdx = 0;

          if (state.ball.targetIdx === 0) state.ball.targetIdx = targetIdx;
          else if (state.ball.targetIdx === targetIdx) state.ball.targetIdx = 0;

          if (state.defDrill.cutterIdx === 0) state.defDrill.cutterIdx = targetIdx;
          else if (state.defDrill.cutterIdx === targetIdx) state.defDrill.cutterIdx = 0;

          spawnSparkles(state.defense[0].x, state.defense[0].y, "#facc15", 6);
          setCoachMessage("good", "🔄", "SWITCHED!", 0.8);
          return true;
        }

        /* =====================================================================
         * 5. Physics, Change of Pace Engine & User Movement
         * ===================================================================== */
        function spawnDust(wx, wy, count) {
          for (let i = 0; i < count; i++) {
            state.fx.dusts.push({
              x: wx + (Math.random() - 0.5) * 0.35,
              y: wy + (Math.random() - 0.5) * 0.22,
              z: 0.05 + Math.random() * 0.12,
              vx: (Math.random() - 0.5) * 0.8,
              vy: (Math.random() - 0.5) * 0.5,
              vz: 0.45 + Math.random() * 0.55,
              life: 0.42,
              maxLife: 0.42,
            });
          }
        }

        function triggerDefenderOffBalance(defender, oldPlayerVx, oldPlayerVy, isCrossover, burstDirX, burstDirY) {
          const diff = getDiffProfile();
          const baseOffBal =
            state.difficulty === "easy"
              ? isCrossover
                ? 1.32
                : 1.25
              : state.difficulty === "medium"
                ? isCrossover
                  ? 1.02
                  : 0.95
                : isCrossover
                  ? 0.78
                  : 0.72;
          defender.reactionTimer = Math.max(diff.defReactDelay, state.difficulty === "easy" ? 0.38 : state.difficulty === "medium" ? 0.3 : 0.22);
          defender.offBalanceTimer = baseOffBal;

          const me = getControlledPlayer();
          const bx = burstDirX !== undefined ? burstDirX : 0;
          const by = burstDirY !== undefined ? burstDirY : -1;
          const bLen = Math.max(0.01, hypot2(bx, by));
          const ux = bx / bLen;
          const uy = by / bLen;
          const px = -uy;
          const py = ux;

          const slideScale = isCrossover ? 1.28 : 1.05;
          let candVx = (Math.abs(defender.vx) > 0.4 ? defender.vx : oldPlayerVx) * slideScale;
          let candVy = (Math.abs(defender.vy) > 0.4 ? defender.vy : oldPlayerVy) * slideScale;

          // If defender's momentum was aligned with user's new burst (e.g. In-and-Out Shift-Release-Shift!),
          // defender bites flat-footed on the hesitation check & stumbles off the driving lane!
          const alongBurst = candVx * ux + candVy * uy;
          if (alongBurst > 0.25 || hypot2(candVx, candVy) < 0.8) {
            const relLat = me ? (defender.x - me.x) * px + (defender.y - me.y) * py : 0.2;
            const latSign = relLat >= 0 ? 1 : -1;
            candVx = px * latSign * 2.55 - ux * 1.05;
            candVy = py * latSign * 2.55 - uy * 1.05;
          } else {
            candVx -= ux * 0.65;
            candVy -= uy * 0.65;
          }

          defender.inertiaVx = clamp(candVx, -4.6, 4.6);
          defender.inertiaVy = clamp(candVy, -4.6, 4.6);
          defender.paceAdapt = 0;
          spawnDust(defender.x, defender.y, 6);
          spawnSparkles(defender.x, defender.y, "#fb923c", 8);
        }

        function isOpponentTeamSide(isOffenseSide) {
          if (state.fullCourt) return !isOffenseSide;
          return state.role === "defense" ? !!isOffenseSide : !isOffenseSide;
        }

        function tickAllPlayerTimers(dt) {
          if (dt <= 0) return;
          const realStep = state.speedScale > 0.01 ? dt / state.speedScale : dt;
          const groups = [
            { arr: state.offense, isOffSide: true },
            { arr: state.defense, isOffSide: false },
          ];
          for (let g = 0; g < groups.length; g++) {
            const arr = groups[g].arr;
            const isOpp = isOpponentTeamSide(groups[g].isOffSide);
            const offBalStep = isOpp ? dt : Math.max(dt, realStep);
            for (let i = 0; i < arr.length; i++) {
              const p = arr[i];
              if (!p) continue;
              if (p.offBalanceTimer > 0) p.offBalanceTimer = Math.max(0, p.offBalanceTimer - offBalStep);
              if (p.reactionTimer > 0) p.reactionTimer = Math.max(0, p.reactionTimer - offBalStep);
              if (p.stealLungeTimer > 0) p.stealLungeTimer = Math.max(0, p.stealLungeTimer - offBalStep);
            }
          }
        }

        function updatePlayerJumpAndPose(p, dt, isSprint, isHesi, isCross) {
          if (p.shootFollowTimer > 0) p.shootFollowTimer = Math.max(0, p.shootFollowTimer - dt);
          if (p.contestTimer > 0) p.contestTimer = Math.max(0, p.contestTimer - dt);
          if (p.passPoseTimer > 0) p.passPoseTimer = Math.max(0, p.passPoseTimer - dt);

          if (p.jumpZ > 0 || p.jumpVz > 0) {
            p.jumpZ += p.jumpVz * dt;
            p.jumpVz -= 11.5 * dt;
            if (p.jumpZ <= 0) {
              p.jumpZ = 0;
              p.jumpVz = 0;
            }
          }
          if (p.jumpZ <= 0.01 && p.shootFollowTimer <= 0) {
            p.layupMode = false;
          }

          const spd = hypot2(p.vx, p.vy);
          if (p.jumpZ > 0.04) p.animState = "jump";
          else if (p.offBalanceTimer > 0) p.animState = "offbalance";
          else if (p.passPoseTimer > 0) p.animState = "pass";
          else if (isCross) p.animState = "crossover";
          else if (isHesi) p.animState = "hesitate";
          else if (isSprint && spd > 3.6) p.animState = "sprint";
          else if (spd > 0.35) p.animState = "walk";
          else p.animState = "idle";
        }

        function updateAllPlayerFacings(dt) {
          const userDefNow = isUserOnDefenseNow();
          for (let i = 0; i < state.offense.length; i++) {
            const p = state.offense[i];
            const isMe = (state.fullCourt || state.role === "offense") && i === 0;
            const hasBall = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === i;
            const spd = hypot2(p.vx, p.vy);
            let desired = p.gazeAngle;

            if (p.offBalanceTimer > 0) {
              const baseAng = Math.atan2(p.inertiaVy || 0.6, p.inertiaVx || 1.0);
              desired = wrapAngle(baseAng + 1.45 + Math.sin(state.simTime * 16 + i) * 0.4);
            } else if (p.passPoseTimer > 0) {
              desired = p.gazeAngle;
            } else if (p.shootFollowTimer > 0 || (hasBall && state.ball.gatherTimer > 0)) {
              desired = Math.atan2(COURT.rimY - p.y, COURT.rimX - p.x);
            } else if (isMe && spd > 0.45) {
              desired = Math.atan2(p.vy, p.vx);
            } else if (state.fullCourt && userDefNow) {
              desired = spd > 4.2 ? Math.atan2(p.vy, p.vx) : Math.atan2(state.ball.y - p.y, state.ball.x - p.x);
            } else if (spd > 0.45) {
              desired = Math.atan2(p.vy, p.vx);
            } else if (hasBall) {
              if (state.passAssist.active && state.passAssist.mode === "triple_threat" && i === state.passAssist.partnerIdx) {
                desired = Math.atan2(state.offense[0].y - p.y, state.offense[0].x - p.x);
              } else {
                desired = Math.atan2(COURT.rimY - p.y, COURT.rimX - p.x);
              }
            } else {
              desired = Math.atan2(state.ball.y - p.y, state.ball.x - p.x);
            }
            p.facing = dt <= 0 ? desired : lerpAngle(p.facing, desired, clamp(15.0 * dt, 0, 1));
          }

          for (let i = 0; i < state.defense.length; i++) {
            const d = state.defense[i];
            const isMe = !state.fullCourt && state.role === "defense" && i === 0;
            const hasBall = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "defense" && state.ball.holderIdx === i;
            const spd = hypot2(d.vx, d.vy);
            let desired = d.gazeAngle;

            if (d.offBalanceTimer > 0) {
              const baseAng = Math.atan2(d.inertiaVy || 0.6, d.inertiaVx || 1.0);
              desired = wrapAngle(baseAng + 1.55 + Math.sin(state.simTime * 16 + i) * 0.45);
            } else if (d.passPoseTimer > 0) {
              desired = d.gazeAngle;
            } else if (d.shootFollowTimer > 0 || (hasBall && state.ball.gatherTimer > 0)) {
              desired = Math.atan2(COURT.southRimY - d.y, COURT.rimX - d.x);
            } else if (hasBall) {
              desired = spd > 0.65 ? Math.atan2(d.vy, d.vx) : Math.atan2(COURT.southRimY - d.y, COURT.rimX - d.x);
            } else if (isMe && spd > 0.45) {
              desired = Math.atan2(d.vy, d.vx);
            } else if (!isMe && (!state.fullCourt || !userDefNow) && d.ballWatchFactor > 0.52) {
              desired = Math.atan2(state.ball.y - d.y, state.ball.x - d.x);
            } else if (spd > 4.35) {
              desired = Math.atan2(d.vy, d.vx);
            } else {
              desired = d.gazeAngle;
            }
            d.facing = dt <= 0 ? desired : lerpAngle(d.facing, desired, clamp(14.0 * dt, 0, 1));
          }
        }

        function updateUserPlayer(dt) {
          const me = getControlledPlayer();
          const r = state.rhythm;
          const courtLen = getCourtLength();
          const userDefNow = isUserOnDefenseNow();

          if (state.stealCooldown > 0) state.stealCooldown = Math.max(0, state.stealCooldown - dt);
          if (r.copCooldown > 0) r.copCooldown = Math.max(0, r.copCooldown - dt);
          if (r.burstBoostTimer > 0) r.burstBoostTimer = Math.max(0, r.burstBoostTimer - dt);
          if (r.crossoverTimer > 0) r.crossoverTimer = Math.max(0, r.crossoverTimer - dt);
          if (r.hesitationTimer > 0) r.hesitationTimer = Math.max(0, r.hesitationTimer - dt);
          if (r.lateralSwitchWindow > 0) r.lateralSwitchWindow = Math.max(0, r.lateralSwitchWindow - dt);
          if (state.fx.dustEmitCooldown > 0) state.fx.dustEmitCooldown = Math.max(0, state.fx.dustEmitCooldown - dt);

          if (me.reactionTimer > 0) {
            me.x = clamp(me.x + me.inertiaVx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
            me.y = clamp(me.y + me.inertiaVy * dt, 0.55, courtLen - 0.55);
            updatePlayerJumpAndPose(me, dt, false, false, false);
            return;
          }

          const screenRight = (keys.D ? 1 : 0) - (keys.A ? 1 : 0);
          const screenUp = (keys.W ? 1 : 0) - (keys.S ? 1 : 0);
          const hasInput = screenRight !== 0 || screenUp !== 0;

          let ix = 0;
          let iy = 0;
          if (hasInput) {
            const wDir = worldDirFromScreenInput(screenRight, screenUp, getActiveInputYaw());
            const len = Math.max(0.001, hypot2(wDir.x, wDir.y));
            ix = wDir.x / len;
            iy = wDir.y / len;
          }

          const prevSpeed = hypot2(me.vx, me.vy);
          const inputDt = state.speedScale > 0.01 ? dt / state.speedScale : dt;
          const iHaveBall =
            !userDefNow && !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;

          const toRimX = COURT.rimX - me.x;
          const toRimY = COURT.rimY - me.y;
          const toRimLen = Math.max(0.01, hypot2(toRimX, toRimY));
          const retreatDot = hasInput ? (ix * toRimX + iy * toRimY) / toRimLen : 0;

          // Track Shift -> Release/Pause -> Shift Cadence Window!
          if (!userDefNow && !keys.Shift) {
            if (r.sprintActiveTime >= 0.095) {
              r.hesiReleaseWindow = 1.3;
              r.offShiftElapsed = 0;
            }
            r.sprintActiveTime = 0;
            if (r.hesiReleaseWindow > 0) {
              r.hesiReleaseWindow = Math.max(0, r.hesiReleaseWindow - inputDt);
              r.offShiftElapsed += inputDt;
            }
          } else if (userDefNow) {
            r.sprintActiveTime = 0;
            r.hesiReleaseWindow = 0;
            r.offShiftElapsed = 0;
          }

          const isHesitationStep = !userDefNow && hasInput && !keys.Shift && retreatDot < -0.55 && me.y < 12.8;
          if (isHesitationStep) {
            r.hesitationTimer = 0.85;
            r.slowMoveTime = Math.max(r.slowMoveTime, 0.26);
            me.crouch = 1;
          } else if (!userDefNow && !keys.Shift && r.hesiReleaseWindow > 0) {
            me.crouch = Math.max(me.crouch, 0.75);
          } else {
            me.crouch = Math.max(0, me.crouch - dt * 5);
          }

          const perpX = -toRimY / toRimLen;
          const perpY = toRimX / toRimLen;
          const latProj = hasInput ? ix * perpX + iy * perpY : 0;
          const currentLat = Math.abs(latProj) > 0.42 ? (latProj > 0 ? 1 : -1) : 0;
          let switchedLateral = false;
          if (currentLat !== 0) {
            if (r.lastLateralSign !== 0 && currentLat !== r.lastLateralSign && r.lateralSwitchWindow > 0) {
              switchedLateral = true;
            }
            r.lastLateralSign = currentLat;
            r.lateralSwitchWindow = 0.72;
          }

          let sharpTurn = false;
          if (hasInput && (Math.abs(r.lastMoveDirX) > 0.1 || Math.abs(r.lastMoveDirY) > 0.1)) {
            const dot = ix * r.lastMoveDirX + iy * r.lastMoveDirY;
            if (dot < 0.42) sharpTurn = true;
          }

          let primaryDef = null;
          let closestDef = null;
          if (!userDefNow) {
            primaryDef = state.defense[0] || null;
            if (state.fullCourt) {
              let bestDefD = 999;
              for (let d = 0; d < state.defense.length; d++) {
                const dd = dist2(me, state.defense[d]);
                if (dd < bestDefD) {
                  bestDefD = dd;
                  closestDef = state.defense[d];
                }
              }
            } else {
              closestDef = primaryDef;
            }
          }

          const blockCoPInTut3A =
            !state.fullCourt && state.scenario === "tutorial" && state.tutorial.step === 3 && state.tutorial.subPhase === "3a_constant";
          const shiftReleaseShift =
            !userDefNow && !blockCoPInTut3A && hasInput && keys.Shift && r.hesiReleaseWindow > 0 && r.offShiftElapsed >= 0.055;
          const canTriggerCoP = !userDefNow && !blockCoPInTut3A && hasInput && (r.copCooldown <= 0 || shiftReleaseShift);

          if (canTriggerCoP) {
            const walkToFast = keys.Shift && (r.slowMoveTime >= 0.24 || r.hesitationTimer > 0);
            const sharpCutOrVcut = keys.Shift && sharpTurn && (r.slowMoveTime >= 0.14 || r.sprintActiveTime >= 0.1 || r.hesiReleaseWindow > 0);
            const onBallCrossover =
              iHaveBall &&
              (switchedLateral ||
                (sharpTurn && keys.Shift) ||
                ((r.hesitationTimer > 0 || r.hesiReleaseWindow > 0) && currentLat !== 0 && keys.Shift));
            const offBallQuickCross = !iHaveBall && switchedLateral && keys.Shift;

            const shakeNearbyDefenders = (fVx, fVy, isCrossMove) => {
              let shookAny = false;
              if (primaryDef && dist2(me, primaryDef) < 5.6) {
                triggerDefenderOffBalance(primaryDef, fVx, fVy, isCrossMove, ix, iy);
                shookAny = true;
              }
              if (closestDef && closestDef !== primaryDef && dist2(me, closestDef) < 3.8) {
                triggerDefenderOffBalance(closestDef, fVx, fVy, isCrossMove, ix, iy);
                shookAny = true;
              }
              return shookAny;
            };

            if (onBallCrossover || offBallQuickCross) {
              const fakeVx = r.lastLateralSign !== 0 && switchedLateral ? -currentLat * perpX * 3.8 : Math.abs(me.vx) > 0.3 ? me.vx : r.sprintPeakVx;
              const fakeVy =
                r.lastLateralSign !== 0 && switchedLateral ? -currentLat * perpY * 3.8 : Math.abs(me.vy) > 0.3 ? me.vy : r.sprintPeakVy || -1.2;
              r.burstBoostTimer = 0.64;
              r.crossoverTimer = 0.72;
              r.crossoverDir = screenRight !== 0 ? screenRight : currentLat || 1;
              me.dribbleHand = iHaveBall ? (r.crossoverDir >= 0 ? 1 : -1) : -me.dribbleHand;
              r.copCooldown = 0.42;
              r.monotoneSprintTime = 0;
              r.slowMoveTime = 0;
              r.hesitationTimer = 0;
              r.sprintActiveTime = 0;
              r.hesiReleaseWindow = 0;
              r.offShiftElapsed = 0;
              r.copCount += 1;
              me.vx = lerp(me.vx, ix * 6.55, 0.55);
              me.vy = lerp(me.vy, iy * 6.55, 0.55);
              state.dribblePressure.timer = Math.max(0, state.dribblePressure.timer - 0.45);
              spawnDust(me.x, me.y, 6);
              SoundEngine.playSneakerSqueak(1.1);
              if (shakeNearbyDefenders(fakeVx, fakeVy, true)) {
                spawnSparkles(me.x, me.y, "#38bdf8", 8);
                if (state.scenario !== "tutorial") {
                  setCoachMessage("good", "⚡", "OOPS! NICE CROSS!", 1.4);
                }
              }
            } else if (shiftReleaseShift || walkToFast || sharpCutOrVcut) {
              const oldVx = Math.abs(me.vx) > 0.3 ? me.vx : Math.abs(r.sprintPeakVx) > 0.3 ? r.sprintPeakVx : r.lastMoveDirX * 2.6;
              const oldVy = Math.abs(me.vy) > 0.3 ? me.vy : Math.abs(r.sprintPeakVy) > 0.3 ? r.sprintPeakVy : r.lastMoveDirY * 2.6;
              r.burstBoostTimer = 0.64;
              r.copCooldown = 0.42;
              r.monotoneSprintTime = 0;
              r.slowMoveTime = 0;
              r.hesitationTimer = 0;
              r.sprintActiveTime = 0;
              r.hesiReleaseWindow = 0;
              r.offShiftElapsed = 0;
              r.copCount += 1;
              me.vx = lerp(me.vx, ix * 6.55, 0.55);
              me.vy = lerp(me.vy, iy * 6.55, 0.55);
              state.dribblePressure.timer = Math.max(0, state.dribblePressure.timer - 0.45);
              spawnDust(me.x, me.y, 6);
              SoundEngine.playSneakerSqueak(1.0);
              if (shakeNearbyDefenders(oldVx, oldVy, false)) {
                spawnSparkles(me.x, me.y, "#22c55e", 8);
                if (state.scenario !== "tutorial") {
                  setCoachMessage("good", "⚡", "OOPS! NICE PACE!", 1.4);
                }
              }
            }
          }

          if (!userDefNow && keys.Shift && hasInput && r.burstBoostTimer <= 0) {
            r.sprintActiveTime += inputDt;
            r.hesiReleaseWindow = 0;
            r.offShiftElapsed = 0;
          }

          let targetSpeed = 0;
          if (hasInput) {
            if (userDefNow) {
              targetSpeed = keys.Shift ? 5.65 : 3.75;
              r.monotoneSprintTime = 0;
            } else if (r.burstBoostTimer > 0) {
              targetSpeed = 6.55;
            } else if (keys.Shift) {
              // Constant Shift without Change of Pace: steady 4.75 m/s so defender locks on tightly!
              r.monotoneSprintTime += dt;
              targetSpeed = 4.75;
            } else {
              // Smooth isotropic 2.85 m/s in all 4 directions (walk / hesitation primes CoP burst!)
              targetSpeed = 2.85;
              r.monotoneSprintTime = 0;
            }
          } else {
            r.monotoneSprintTime = 0;
          }

          if (hasInput && !keys.Shift && targetSpeed <= 2.95) {
            r.slowMoveTime = Math.min(2.0, r.slowMoveTime + inputDt);
          } else if (!hasInput) {
            r.slowMoveTime = Math.max(0, r.slowMoveTime - inputDt * 0.5);
          } else if (r.burstBoostTimer <= 0 && keys.Shift) {
            r.slowMoveTime = 0;
          }

          const accel = r.burstBoostTimer > 0 ? 30.0 : hasInput ? 16.0 : 18.0;
          const desiredVx = ix * targetSpeed;
          const desiredVy = iy * targetSpeed;
          me.vx = lerp(me.vx, desiredVx, clamp(accel * dt, 0, 1));
          me.vy = lerp(me.vy, desiredVy, clamp(accel * dt, 0, 1));
          if (!userDefNow && keys.Shift && hasInput && r.burstBoostTimer <= 0) {
            r.sprintPeakVx = me.vx;
            r.sprintPeakVy = me.vy;
          }

          me.x = clamp(me.x + me.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
          me.y = clamp(me.y + me.vy * dt, 0.55, courtLen - 0.55);

          const curSpeed = hypot2(me.vx, me.vy);
          if (curSpeed > 0.4) {
            me.stridePhase += curSpeed * dt * 3.5;
            if (hasInput) {
              r.lastMoveDirX = ix;
              r.lastMoveDirY = iy;
            }
            if ((keys.Shift || r.burstBoostTimer > 0) && state.fx.dustEmitCooldown <= 0) {
              spawnDust(me.x - ix * 0.25, me.y - iy * 0.25, 2);
              state.fx.dustEmitCooldown = 0.11;
            }
          }
          me.gazeAngle = userDefNow ? Math.atan2(state.ball.y - me.y, state.ball.x - me.x) : Math.atan2(COURT.rimY - me.y, COURT.rimX - me.x);

          updatePlayerJumpAndPose(
            me,
            dt,
            keys.Shift || r.burstBoostTimer > 0,
            isHesitationStep || (!keys.Shift && r.hesiReleaseWindow > 0),
            r.crossoverTimer > 0
          );

          if (r.crossoverTimer > 0) {
            r.currentLabel = "💨 CROSS!";
            r.badgeClass = "pace-cross";
          } else if (r.burstBoostTimer > 0) {
            r.currentLabel = "🔥 PACE!";
            r.badgeClass = "pace-cop";
          } else if (!keys.Shift && (isHesitationStep || r.hesiReleaseWindow > 0 || (r.hesitationTimer > 0.3 && curSpeed < 2.2))) {
            r.currentLabel = "🛑 HESI!";
            r.badgeClass = "pace-hesi";
          } else if (keys.Shift && hasInput) {
            r.currentLabel = "⚡ FAST!";
            r.badgeClass = "pace-sprint";
          } else if (prevSpeed > 0.3 || hasInput) {
            r.currentLabel = userDefNow ? "🛡️ SLIDE" : "🚶 WALK";
            r.badgeClass = "pace-walk";
          } else {
            r.currentLabel = "👀 READY";
            r.badgeClass = "pace-walk";
          }
        }

        /* On-Ball Dribble Pressure & Strip Turnover Physics */
        function triggerUserStripped(stealerIdx) {
          const sIdx = stealerIdx >= 0 ? stealerIdx : 0;
          const stealer = state.defense[sIdx];
          const me = state.offense[0];

          state.dribblePressure.timer = 0;
          state.dribblePressure.ratio = 0;
          state.dribblePressure.doubleTeamed = false;
          state.dribblePressure.stealerIdx = sIdx;
          state.passAssist.active = false;

          stealer.passPoseTimer = 0.34;
          stealer.contestTimer = 0.42;
          stealer.gazeAngle = Math.atan2(me.y - stealer.y, me.x - stealer.x);

          me.offBalanceTimer = 0.48;
          me.reactionTimer = 0.28;
          const pushAng = Math.atan2(me.y - stealer.y, me.x - stealer.x);
          me.inertiaVx = Math.cos(pushAng) * 1.9;
          me.inertiaVy = Math.sin(pushAng) * 1.9;

          state.ball.inFlight = false;
          state.ball.loose = false;
          state.ball.flightType = "none";
          state.ball.holderTeam = "defense";
          state.ball.holderIdx = sIdx;
          state.ball.x = stealer.x;
          state.ball.y = stealer.y;
          state.ball.z = 1.15;
          state.ball.gatherTimer = 0;
          state.ball.trail = [];

          spawnSparkles(stealer.x, stealer.y, "#ef4444", 16);
          spawnDust(me.x, me.y, 5);
          SoundEngine.playStealOrBlock(false);

          if (state.fullCourt) {
            state.playPhase = "live";
            state.defDrill.timer = 0;
            state.defDrill.actionTimer = 0;
            state.defDrill.cutterIdx = -1;
            setCoachMessage("warn", "⚠️", "STOLEN! GET BACK!", 1.5);
          } else {
            if (state.scenario === "match") {
              state.matchScore.stops += 1;
            }
            state.playPhase = "celebrate";
            state.phaseTimer = 0.55;
            setCoachMessage("warn", "⚠️", "STOLEN! PASS SOONER!", 1.6);
          }
          syncAllDOM();
        }

        function updateDribblePressure(dt) {
          const userHasBall =
            (state.fullCourt || state.role === "offense") &&
            !state.ball.inFlight &&
            !state.ball.loose &&
            state.ball.holderTeam === "offense" &&
            state.ball.holderIdx === 0 &&
            state.playPhase === "live" &&
            state.scenario !== "tutorial";

          if (!userHasBall) {
            state.dribblePressure.timer = 0;
            state.dribblePressure.ratio = 0;
            state.dribblePressure.doubleTeamed = false;
            state.dribblePressure.stealerIdx = -1;
            return;
          }

          const me = state.offense[0];
          const diff = getDiffProfile();
          let closestDist = 99;
          let closestIdx = -1;
          let doubleCount = 0;

          for (let i = 0; i < state.defense.length; i++) {
            const def = state.defense[i];
            if (def.offBalanceTimer > 0 || def.reactionTimer > 0) continue;
            const d = dist2(me, def);
            if (d < 1.85) doubleCount++;
            if (d < closestDist) {
              closestDist = d;
              closestIdx = i;
            }
          }

          const effectiveReach = doubleCount >= 2 ? diff.cpuStealReach + 0.14 : diff.cpuStealReach;
          if (closestIdx !== -1 && closestDist <= effectiveReach && state.rhythm.burstBoostTimer <= 0.12) {
            const mult = doubleCount >= 2 ? 2.0 : 1.0;
            state.dribblePressure.timer += dt * mult;
            state.dribblePressure.doubleTeamed = doubleCount >= 2;
            state.dribblePressure.stealerIdx = closestIdx;
            state.dribblePressure.ratio = clamp(state.dribblePressure.timer / diff.stripProtectSec, 0, 1);

            if (state.dribblePressure.timer >= diff.stripProtectSec) {
              triggerUserStripped(closestIdx);
              return;
            }
            if (state.dribblePressure.ratio >= 0.35) {
              setCoachMessage("warn", "⚠️", doubleCount >= 2 ? "DOUBLE TEAM! PASS!" : "TIGHT! PRESS E!", 0.35);
            }
          } else {
            state.dribblePressure.timer = Math.max(0, state.dribblePressure.timer - dt * 2.4);
            state.dribblePressure.doubleTeamed = doubleCount >= 2;
            state.dribblePressure.stealerIdx = closestIdx;
            state.dribblePressure.ratio = clamp(state.dribblePressure.timer / diff.stripProtectSec, 0, 1);
          }
        }

        /* =====================================================================
         * 6. Tutorials (Offense LEARN & Defense LEARN D)
         * ===================================================================== */
        function computeDirKeysToward(fromX, fromY, toX, toY) {
          const dx = toX - fromX;
          const dy = toY - fromY;
          const activeYaw = getActiveInputYaw();
          const c = Math.cos(activeYaw);
          const s = Math.sin(activeYaw);
          const sRight = dx * c + dy * s;
          const sUp = dx * s - dy * c;
          const out = [];
          if (sUp > 0.4) out.push("W");
          else if (sUp < -0.4) out.push("S");
          if (sRight < -0.4) out.push("A");
          else if (sRight > 0.4) out.push("D");
          return out.length ? out : ["W"];
        }

        function updateTutorialLogic(dt) {
          if (state.scenario === "give_go") {
            if (!state.showHints || state.playPhase !== "live") {
              state.tutorial.highlightKeys = [];
              return;

            const me = state.offense[0];
            const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;

              state.tutorial.highlightKeys = ["E"];
            } else if (state.giveGoStage === 2 && !iHaveBall && !state.ball.inFlight) {
              const dirs = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
              if (state.rhythm.slowMoveTime < 0.15 && state.rhythm.copCount === 0) {
                state.tutorial.highlightKeys = dirs;
              } else if (state.rhythm.copCount === 0) {
                state.tutorial.highlightKeys = ["Shift"].concat(dirs);
              } else {
                state.tutorial.highlightKeys = dirs;

              state.tutorial.highlightKeys = ["Space"];
            } else {

        function updateDefenseTutorialStep(dt) {

                tut.nextStepAfterAdvance = 4;

        /* =====================================================================
         * 7. Offense AI, Defense Drills AI & Full 5v5 Match AI
         * ===================================================================== */
        function moveAgentToward(agent, tx, ty, maxSpeed, dt, allowOutBaseline, sharpLockdown) {
          const dx = tx - agent.x;
          const dy = ty - agent.y;
          const d = hypot2(dx, dy);
          let dvx = 0;
          let dvy = 0;
          const gain = sharpLockdown ? 8.4 : 4.4;
          if (d > 0.05) {
            const sp = Math.min(maxSpeed, d * gain);
            dvx = (dx / d) * sp;
            dvy = (dy / d) * sp;
          }
          const accelRate = sharpLockdown ? 18.5 : 10.5;
          agent.vx = lerp(agent.vx, dvx, clamp(accelRate * dt, 0, 1));
          agent.vy = lerp(agent.vy, dvy, clamp(accelRate * dt, 0, 1));
          const courtLen = getCourtLength();
          const minY = allowOutBaseline ? -0.35 : 0.55;
          const maxY = allowOutBaseline ? courtLen + 0.35 : courtLen - 0.55;
          agent.x = clamp(agent.x + agent.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
          agent.y = clamp(agent.y + agent.vy * dt, minY, maxY);
          const spNow = hypot2(agent.vx, agent.vy);
          if (spNow > 0.35) {
            agent.stridePhase += spNow * dt * 3.2;
          }
          updatePlayerJumpAndPose(agent, dt, spNow > 4.2, false, false);
        }

        function computeHelpTriangleSpot(man, ballX, ballY, side) {
          const distBallToMan = hypot2(ballX - man.x, ballY - man.y);
          const helpWeight = clamp(distBallToMan / 11.5, 0.22, 0.55);
          const midX = lerp(man.x, ballX, 0.34);
          const midY = lerp(man.y, ballY, 0.28);
          return {
            x: lerp(midX, COURT.rimX + side * 0.5, helpWeight),
            y: lerp(midY, COURT.rimY + 1.45, helpWeight),
          };
        }

        function updateFullCourtTargetSpot() {
          state.helpTriangle.show = false;
          state.targetSpot.isWarn = false;
          const me = state.offense[0];

          if (state.ball.loose) {
            state.targetSpot.active = true;
            state.targetSpot.x = state.ball.x;
            state.targetSpot.y = state.ball.y;
            state.targetSpot.radius = 1.25;
            state.targetSpot.label = "REBOUND!";
            state.targetSpot.stepLabel = "";
            return;
          }

          if (isUserOnDefenseNow()) {
            // Defend South Hoop (0, 26.425)!
            const bhIdx = state.ball.inFlight ? state.ball.targetIdx : state.ball.holderIdx;
            const bh = state.defense[clamp(bhIdx, 0, state.defense.length - 1)];
            const toSouthX = COURT.rimX - bh.x;
            const toSouthY = COURT.southRimY - bh.y;
            const dSouth = Math.max(0.01, hypot2(toSouthX, toSouthY));
            state.targetSpot.active = true;
            state.targetSpot.x = bh.x + (toSouthX / dSouth) * 1.18;
            state.targetSpot.y = clamp(bh.y + (toSouthY / dSouth) * 1.18, 1.2, COURT.fullLength - 1.0);
            state.targetSpot.radius = 1.25;
            state.targetSpot.label = me.y < bh.y - 1.2 ? "GET BACK!" : "GUARD!";
            state.targetSpot.stepLabel = "";
            return;
          }

          // Blue Offense: Attack North Hoop (0, 1.575)!
          const iHaveBall = !state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
          if (iHaveBall) {
            state.targetSpot.active = true;
            state.targetSpot.x = me.x >= 0 ? 0.85 : -0.85;
            state.targetSpot.y = 2.15;
            state.targetSpot.radius = 1.4;
            state.targetSpot.label = me.y > 14.0 ? "ATTACK!" : "SCORE!";
            state.targetSpot.stepLabel = "";
            return;
          }

          const candidates = [
            { x: -5.65, y: 6.1, label: "WING!" },
            { x: 5.65, y: 6.1, label: "WING!" },
            { x: -6.45, y: 2.25, label: "CORNER!" },
            { x: 6.45, y: 2.25, label: "CORNER!" },
            { x: me.x >= 0 ? 1.15 : -1.15, y: 2.25, label: "CUT!" },
          ];
          let best = candidates[0];
          let bestSc = -999;
          for (let i = 0; i < candidates.length; i++) {
            const c = candidates[i];
            let minMate = 99;
            for (let m = 1; m < state.offense.length; m++) {
              minMate = Math.min(minMate, hypot2(c.x - state.offense[m].x, c.y - state.offense[m].y));
            }
            const sc = minMate - hypot2(c.x - me.x, c.y - me.y) * 0.18;
            if (sc > bestSc) {
              bestSc = sc;
              best = c;
            }
          }
          state.targetSpot.active = true;
          state.targetSpot.x = best.x;
          state.targetSpot.y = best.y;
          state.targetSpot.radius = 1.45;
          state.targetSpot.label = state.ball.y > 14.5 ? "FAST BREAK!" : best.label;
          state.targetSpot.stepLabel = "";
        }

        function updateTargetSpot(dt) {
          if (state.fullCourt) {
            updateFullCourtTargetSpot();
            return;
          }
          state.helpTriangle.show = false;
          if (state.scenario === "tutorial" || state.scenario === "learn_d") {
            if (state.scenario === "learn_d" && state.tutorial.step >= 3) {
              const hs = computeHelpTriangleSpot(state.offense[0], state.ball.x, state.ball.y, -1);
              state.helpTriangle.idealX = hs.x;
              state.helpTriangle.idealY = hs.y;
              state.helpTriangle.show = true;
            }
            return;
          }

          state.targetSpot.isWarn = false;
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;
          const meOff = state.offense[0];

          if (state.role === "defense") {
            const myMan = state.offense[0];
            const manHasBall = !state.ball.inFlight && state.ball.holderIdx === 0;

            if (manHasBall || state.scenario === "def_onball") {
              const bh = state.offense[state.ball.holderIdx];
              const toRimX = COURT.rimX - bh.x;
              const toRimY = COURT.rimY - bh.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              state.targetSpot.active = true;
              state.targetSpot.x = bh.x + (toRimX / dRim) * 1.12;
              state.targetSpot.y = bh.y + (toRimY / dRim) * 1.12;
              state.targetSpot.radius = 1.15;
              state.targetSpot.label = "GUARD!";
              state.targetSpot.stepLabel = "";
              return;
            }

            if (state.scenario === "def_cut") {
              const toRimX = COURT.rimX - myMan.x;
              const toRimY = COURT.rimY - myMan.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              state.targetSpot.active = true;
              state.targetSpot.x = lerp(myMan.x + (toRimX / dRim) * 1.15, state.ball.x, 0.22);
              state.targetSpot.y = lerp(myMan.y + (toRimY / dRim) * 1.15, state.ball.y, 0.22);
              state.targetSpot.radius = 1.25;
              state.targetSpot.label = "BLOCK CUT!";
              state.targetSpot.stepLabel = "";
              return;
            }

            // Help Triangle for defense_help & off-ball 5v5 Match!
            const hs = computeHelpTriangleSpot(myMan, state.ball.x, state.ball.y, myMan.x < 0 ? -1 : 1);
            state.helpTriangle.idealX = hs.x;
            state.helpTriangle.idealY = hs.y;
            state.helpTriangle.show = true;
            state.targetSpot.active = true;
            state.targetSpot.x = hs.x;
            state.targetSpot.y = hs.y;
            state.targetSpot.radius = 1.4;
            state.targetSpot.label = "HELP!";
            state.targetSpot.stepLabel = "";
            return;
          }

          // Offense target spots
          if (state.scenario === "give_go") {
            if (!state.ball.inFlight && state.ball.holderIdx === 0 && state.giveGoStage === 1) {
              state.targetSpot.active = false;
              return;
            }
            if (state.giveGoStage === 2 && (state.ball.inFlight || state.ball.holderIdx !== 0)) {
              state.targetSpot.active = true;
              state.targetSpot.x = side * 1.05;
              state.targetSpot.y = 2.2;
              state.targetSpot.radius = 1.42;
              state.targetSpot.label = "CUT!";
              state.targetSpot.stepLabel = "2";
              return;
            }
            state.targetSpot.active = true;
            state.targetSpot.x = side * 0.85;
            state.targetSpot.y = 2.05;
            state.targetSpot.radius = 1.35;
            state.targetSpot.label = "SCORE!";
            state.targetSpot.stepLabel = "3";
            return;
          }

          if (!state.ball.inFlight && state.ball.holderIdx === 0) {
            state.targetSpot.active = true;
            state.targetSpot.x = side * 0.9;
            state.targetSpot.y = 2.15;
            state.targetSpot.radius = 1.35;
            state.targetSpot.label = "SCORE!";
            state.targetSpot.stepLabel = "";
            return;
          }

          if (state.scenario === "relocation") {
            if (spot.zone === "wing") {
              state.targetSpot.x = side * 6.5;
              state.targetSpot.y = 2.15;
            } else {
              state.targetSpot.x = side * 5.75;
              state.targetSpot.y = 6.35;
            }
            state.targetSpot.active = true;
            state.targetSpot.radius = 1.45;
            state.targetSpot.label = "OPEN!";
            state.targetSpot.stepLabel = "";
          } else if (state.scenario === "cut") {
            state.targetSpot.active = true;
            state.targetSpot.x = side * 1.25;
            state.targetSpot.y = 2.25;
            state.targetSpot.radius = 1.4;
            state.targetSpot.label = "CUT!";
            state.targetSpot.stepLabel = "";
          } else if (state.scenario === "vcut") {
            const stepInX = side * 3.85;
            const stepInY = spot.zone === "wing" ? 4.45 : 3.45;
            if (state.vcutStage === 1 && hypot2(meOff.x - stepInX, meOff.y - stepInY) < 1.35) {
              state.vcutStage = 2;
              setCoachMessage("good", "⚡", "NOW POP OUT! SHIFT!", 1.2);
            }
            if (state.vcutStage === 1) {
              state.targetSpot.x = stepInX;
              state.targetSpot.y = stepInY;
              state.targetSpot.radius = 1.25;
              state.targetSpot.label = "STEP IN";
              state.targetSpot.stepLabel = "1";
            } else {
              state.targetSpot.x = spot.zone === "wing" ? side * 5.85 : side * 6.45;
              state.targetSpot.y = spot.zone === "wing" ? 6.55 : 2.35;
              state.targetSpot.radius = 1.45;
              state.targetSpot.label = "POP OUT!";
              state.targetSpot.stepLabel = "2";
            }
            state.targetSpot.active = true;
          } else {
            // 5v5 Match on Offense: best open spot
            const candidates = [
              { x: side * 6.5, y: 2.15, label: "CORNER!" },
              { x: side * 5.7, y: 6.2, label: "WING!" },
              { x: side * 1.25, y: 2.25, label: "CUT!" },
              { x: 0.0, y: 8.65, label: "TOP!" },
            ];
            let best = candidates[0];
            let bestScore = -999;
            for (let i = 0; i < candidates.length; i++) {
              const c = candidates[i];
              let minMate = 99;
              for (let m = 1; m < state.offense.length; m++) {
                minMate = Math.min(minMate, hypot2(c.x - state.offense[m].x, c.y - state.offense[m].y));
              }
              const score = minMate - hypot2(c.x - meOff.x, c.y - meOff.y) * 0.22;
              if (score > bestScore) {
                bestScore = score;
                best = c;
              }
            }
            state.targetSpot.active = true;
            state.targetSpot.x = best.x;
            state.targetSpot.y = best.y;
            state.targetSpot.radius = 1.45;
            state.targetSpot.label = best.label;
            state.targetSpot.stepLabel = "";
          }
        }

        function startFullCourtInbound(team) {
          state.inbound.active = true;
          state.inbound.team = team;
          state.inbound.timer = 0.72;
          state.inbound.passerIdx = 1;
          state.inbound.receiverIdx = 0;
          state.playPhase = "live";
          state.passAssist.active = false;
          state.defDrill.timer = 0;
          state.defDrill.actionTimer = 0;
          state.defDrill.cutterIdx = -1;
          for (let i = 0; i < state.offense.length; i++) {
            state.offense[i].offBalanceTimer = 0;
            state.offense[i].reactionTimer = 0;
          }
          for (let i = 0; i < state.defense.length; i++) {
            state.defense[i].offBalanceTimer = 0;
            state.defense[i].reactionTimer = 0;
          }

          state.ball.inFlight = false;
          state.ball.loose = false;
          state.ball.flightType = "none";
          state.ball.gatherTimer = 0;
          state.ball.trail = [];
          state.ball.holderTeam = team;
          state.ball.holderIdx = 1;

          if (team === "defense") {
            const inb = state.defense[1];
            inb.x = 1.45;
            inb.y = -0.18;
            inb.vx = 0;
            inb.vy = 0;
            state.ball.x = inb.x;
            state.ball.y = inb.y;
            state.ball.z = 1.25;
          } else {
            const inb = state.offense[1];
            inb.x = -1.45;
            inb.y = COURT.fullLength + 0.18;
            inb.vx = 0;
            inb.vy = 0;
            state.ball.x = inb.x;
            state.ball.y = inb.y;
            state.ball.z = 1.25;
          }
        }

        /* =====================================================================
         * Read & React Off-Ball Motion Offense Engine:
         *   1) Rotating 3-Phase Basket Cut & Clear-Out (Setup V-Step -> Rim Slash -> Clear-Out)
         *   2) Perimeter Circle Rotation & Fill (Corner -> Wing -> Top -> Weak Side)
         *   3) Ball-Handler Drive Circle Drift + ★ YOU Spacing Swap (>= 3.6m)
         *   4) Continuous Weak-Side Wing-Corner Exchange & V-Cut Footwork
         *   5) 5.0+ m/s Full-Court Fast-Break Rim-Runner & Wide-Wing Sprints
         * ===================================================================== */
        const PERIMETER_ARC_SLOTS = [
          { x: -6.3, y: 2.35 }, // 0: Left Corner
          { x: -5.45, y: 6.15 }, // 1: Left Wing
          { x: 0.0, y: 8.55 }, // 2: Top Key
          { x: 5.45, y: 6.15 }, // 3: Right Wing
          { x: 6.3, y: 2.35 }, // 4: Right Corner
        ];

        function initMotionSlotsFromFormation() {
          const m = state.motion;
          const used = [false, false, false, false, false];
          const map = [2, 1, 3, 0, 4];
          for (let i = 0; i < state.offense.length; i++) {
            const p = state.offense[i];
            let bestS = 0;
            let bestD = 9999;
            for (let s = 0; s < PERIMETER_ARC_SLOTS.length; s++) {
              if (used[s]) continue;
              const d = hypot2(p.x - PERIMETER_ARC_SLOTS[s].x, Math.min(p.y, 9.5) - PERIMETER_ARC_SLOTS[s].y);
              if (d < bestD) {
                bestD = d;
                bestS = s;
              }
            }
            used[bestS] = true;
            map[i] = bestS;
          }
          m.slotForPlayer = map;
          m.cutterIdx = 2;
          m.cutPhase = "setup";
          m.cutTimer = 0;
          m.cutSide = 1;
          m.rotatedThisCut = false;
          m.completedCuts = 0;
          m.exchangeTimer = 0;
          m.exchangeFlip = 0;
          m.aiPassTimer = 0;
          m.redExchangeTimer = 0;
          m.redExchangeFlip = 0;
        }

        function pickNextOffBallCutter(prevIdx, excludedIdx) {
          let cand = prevIdx;
          for (let k = 0; k < 4; k++) {
            cand = (cand % 4) + 1;
            if (cand !== excludedIdx) return cand;
          }
          return 1;
        }

        function rotateOffBallSlotsOnCut(cutterIdx, excludedIdx) {
          const m = state.motion;
          const activeMates = [];
          for (let i = 1; i < state.offense.length; i++) {
            if (i !== excludedIdx) activeMates.push(i);
          }
          if (activeMates.length < 2) return;
          const firstSlot = m.slotForPlayer[activeMates[0]];
          for (let k = 0; k < activeMates.length - 1; k++) {
            m.slotForPlayer[activeMates[k]] = m.slotForPlayer[activeMates[k + 1]];
          }
          m.slotForPlayer[activeMates[activeMates.length - 1]] = firstSlot;
        }

        function updateActiveOffBallTeammates(dt, excludedIdx) {
          const m = state.motion;
          const me = state.offense[0];
          const iHaveBall = !state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
          const bh = !state.ball.inFlight && state.ball.holderTeam === "offense" ? state.offense[state.ball.holderIdx] : null;

          // 1) Ensure active cutter is a valid off-ball AI teammate (1..4)
          if (m.cutterIdx < 1 || m.cutterIdx > 4 || m.cutterIdx === excludedIdx) {
            m.cutterIdx = pickNextOffBallCutter(m.cutterIdx || 1, excludedIdx);
            m.cutPhase = "setup";
            m.cutTimer = 0;
            m.rotatedThisCut = false;
          }

          // 2) Spacing Swap: if ★ YOU moves near an AI teammate's perimeter slot, swap slots!
          if (me.y < 11.5) {
            for (let i = 1; i < state.offense.length; i++) {
              if (i === excludedIdx) continue;
              if (i === m.cutterIdx && m.cutPhase === "slash") continue;
              const sIdx = m.slotForPlayer[i];
              const sl = PERIMETER_ARC_SLOTS[sIdx];
              if (hypot2(me.x - sl.x, me.y - sl.y) < 3.45) {
                const myOldSlot = m.slotForPlayer[0];
                if (hypot2(me.x - PERIMETER_ARC_SLOTS[myOldSlot].x, me.y - PERIMETER_ARC_SLOTS[myOldSlot].y) >= 3.55) {
                  m.slotForPlayer[i] = myOldSlot;
                  m.slotForPlayer[0] = sIdx;
                }
              }
            }
          }

          // 3) Periodic Weak-Side Wing-Corner Exchange (every 2.15s)
          m.exchangeTimer += dt;
          if (m.exchangeTimer >= 2.15) {
            m.exchangeTimer = 0;
            m.exchangeFlip ^= 1;
            const ballX = bh ? bh.x : state.ball.x;
            const weakPair = ballX >= 0 ? [0, 1] : [3, 4];
            let pA = -1;
            let pB = -1;
            for (let i = 1; i < state.offense.length; i++) {
              if (i === excludedIdx || (i === m.cutterIdx && m.cutPhase === "slash")) continue;
              if (m.slotForPlayer[i] === weakPair[0]) pA = i;
              else if (m.slotForPlayer[i] === weakPair[1]) pB = i;
            }
            if (pA !== -1 && pB !== -1) {
              const tmp = m.slotForPlayer[pA];
              m.slotForPlayer[pA] = m.slotForPlayer[pB];
              m.slotForPlayer[pB] = tmp;
            }
          }

          // 4) Frontcourt 3-Phase Basket Cut & Clear-Out State Machine
          const inTransition = state.fullCourt && state.ball.y > 13.8;
          if (!inTransition) {
            m.cutTimer += dt;
            const cutter = state.offense[m.cutterIdx];
            const cSlot = PERIMETER_ARC_SLOTS[m.slotForPlayer[m.cutterIdx]];
            if (m.cutPhase === "setup") {
              m.cutSide = me.y < 5.0 && Math.abs(me.x) > 0.45 ? (me.x > 0 ? -1 : 1) : cSlot.x >= 0 ? 1 : -1;
              if (m.cutTimer >= 0.3) {
                m.cutPhase = "slash";
                m.cutTimer = 0;
                m.rotatedThisCut = false;
              }
            } else if (m.cutPhase === "slash") {
              if (m.cutTimer >= 0.16 && !m.rotatedThisCut) {
                rotateOffBallSlotsOnCut(m.cutterIdx, excludedIdx);
                m.rotatedThisCut = true;
              }
              const cutPassInAir = state.ball.inFlight && state.ball.wasCutPass && state.ball.targetIdx === m.cutterIdx;
              const cutX = m.cutSide * 1.22;
              const cutY = 2.08;
              if (!cutPassInAir && (hypot2(cutter.x - cutX, cutter.y - cutY) < 0.78 || m.cutTimer >= 0.98)) {
                if (cutter.y < 3.6) m.completedCuts += 1;
                m.cutPhase = "clear";
                m.cutTimer = 0;
              }
            } else {
              const clearSlot = PERIMETER_ARC_SLOTS[m.slotForPlayer[m.cutterIdx]];
              if (hypot2(cutter.x - clearSlot.x, cutter.y - clearSlot.y) < 0.95 || m.cutTimer >= 0.48) {
                m.cutterIdx = pickNextOffBallCutter(m.cutterIdx, excludedIdx);
                m.cutPhase = "setup";
                m.cutTimer = 0;
                m.rotatedThisCut = false;
              }
            }
          }
