          "L_ankle",
          "R_ankle",
          "L_toe",
          "R_toe",
          "ribbonKnot",
          "ribbonTipL",
          "ribbonTipR",
        ];

        const _textWidthCache = new Map();
        function measureTextCached(ctx, fontKey, text) {
          const key = fontKey + "|" + text;
          const hit = _textWidthCache.get(key);
          if (hit !== undefined) return hit;
          if (_textWidthCache.size >= 128) _textWidthCache.clear();
          const w = ctx.measureText(text).width;
          _textWidthCache.set(key, w);
          return w;
        }

        const _cam3DFrame = {
          valid: false,
          yaw: NaN,
          effZoom: NaN,
          fullCourt: null,
          preset: "",
          cosY: 1,
          sinY: 0,
          camDist: 12.6,
          sFar: 0.5,
          invSpanS: 1,
          floorTop: 52,
          floorSpan: 212,
          scaleX: 27.2,
          scaleZ: 23.936,
        };

        function _syncCam3DFrame() {
          const camYaw = state.cam.yaw;
          const effZoom = getEffectiveZoom();
          const fc = !!state.fullCourt;
          const preset = state.cam.preset;
          if (
            _cam3DFrame.valid &&
            _cam3DFrame.yaw === camYaw &&
            _cam3DFrame.effZoom === effZoom &&
            _cam3DFrame.fullCourt === fc &&
            _cam3DFrame.preset === preset
          ) {
            return;
          }
          const cosY = Math.cos(camYaw);
          const sinY = Math.sin(camYaw);
          const absSin = Math.abs(sinY);
          const refDist = 9.6;
          const baseScale = 27.2;

          _cam3DFrame.valid = true;
          _cam3DFrame.yaw = camYaw;
          _cam3DFrame.effZoom = effZoom;
          _cam3DFrame.fullCourt = fc;
          _cam3DFrame.preset = preset;
          _cam3DFrame.cosY = cosY;
          _cam3DFrame.sinY = sinY;

          if (!fc) {
            const camDist = 12.6 + 1.4 * absSin;
            const extentD = 6.2 + 0.4 * absSin;
            const sFar = refDist / (camDist + extentD);
            const sNear = refDist / Math.max(3.0, camDist - extentD);
            _cam3DFrame.camDist = camDist;
            _cam3DFrame.sFar = sFar;
            _cam3DFrame.invSpanS = 1 / (sNear - sFar);
            _cam3DFrame.floorTop = 52;
            _cam3DFrame.floorSpan = 212;
            _cam3DFrame.scaleX = baseScale;
            _cam3DFrame.scaleZ = baseScale * 0.88;
          } else {
            const absCos = Math.abs(cosY);
            const isFollow = preset === "follow";
            const camDist = isFollow ? 16.4 : 15.8 + 2.4 * absCos;
            const extentD = isFollow ? 9.6 : 6.8 * absSin + 10.6 * absCos;
            const sFar = refDist / (camDist + extentD);
            const sNear = refDist / Math.max(3.2, camDist - extentD);
            const zoomX = isFollow ? 1.12 : 1.14 - 0.08 * absCos;
            _cam3DFrame.camDist = camDist;
            _cam3DFrame.sFar = sFar;
            _cam3DFrame.invSpanS = 1 / (sNear - sFar);
            _cam3DFrame.floorTop = 54;
            _cam3DFrame.floorSpan = 208;
            _cam3DFrame.scaleX = baseScale * zoomX;
            _cam3DFrame.scaleZ = baseScale * zoomX * 0.88;
          }
        }

        function project3D(wx, wy, wz, out) {
          _syncCam3DFrame();
          const dx = wx - state.cam.focusX;
          const dy = wy - state.cam.focusY;
          const cosY = _cam3DFrame.cosY;
          const sinY = _cam3DFrame.sinY;

          // Rigid 2D camera basis: camRight = screen right, camDepth = nearer to camera (Painter's sort key)
          const camRight = dx * cosY + dy * sinY;
          const camDepth = -dx * sinY + dy * cosY;

          const effZoom = _cam3DFrame.effZoom;
          const distFromCam = Math.max(2.4, _cam3DFrame.camDist - camDepth);
          const sRaw = 9.6 / distFromCam;
          const s = sRaw * effZoom;
          const u = (sRaw - _cam3DFrame.sFar) * _cam3DFrame.invSpanS;

          const floorMidY = 158;
          const px = REF_W * 0.5 + camRight * _cam3DFrame.scaleX * s;
          const pyFloorBase = _cam3DFrame.floorTop + u * _cam3DFrame.floorSpan;
          const pyFloor = floorMidY + (pyFloorBase - floorMidY) * effZoom;
          const py = pyFloor - (wz || 0) * _cam3DFrame.scaleZ * s;
          if (out) {
            out.x = px;
            out.y = py;
            out.floorY = pyFloor;
            out.s = s;
            out.camDepth = camDepth;
            out.distFromCam = distFromCam;
            out.effZoom = effZoom;
            return out;
          }
          return { x: px, y: py, floorY: pyFloor, s, camDepth, distFromCam, effZoom };
        }

        const LABEL_Y_OFFSETS = [0, -26, 26, -52, 52, -78, 78, -104, 104, -130, 130];
        const LABEL_X_OFFSETS = [0, -32, 32, -64, 64, -96, 96];

        /* Collision-Free Floating Label Layout (0 AABB Overlaps Across Floating + Fixed HUD Boxes, Strictly In-Bounds) */
        function resolveLabelCollisions(rawLabels, canvasW, canvasH, measureFn, occupiedBoxes) {
          if (!rawLabels || rawLabels.length === 0) return [];
          const sorted = rawLabels.slice().sort((a, b) => (a.priority || 5) - (b.priority || 5));
          const placed = [];
          const fixedObs = Array.isArray(occupiedBoxes) ? occupiedBoxes : null;
          const pad = 5;
          const boxH = 22;
          const maxYBound = Math.max(6, canvasH - boxH - 6);
          const minYBound = Math.min(36, maxYBound);

          const hitsAny = (cx, cy, bw) => {
            if (fixedObs) {
              for (let k = 0; k < fixedObs.length; k++) {
                const b = fixedObs[k];
                if (cx < b.x + b.w + pad && cx + bw + pad > b.x && cy < b.y + b.h + pad && cy + boxH + pad > b.y) {
                  return true;
                }
              }
            }
            for (let p = 0; p < placed.length; p++) {
              const b = placed[p];
              if (cx < b.x + b.w + pad && cx + bw + pad > b.x && cy < b.y + b.h + pad && cy + boxH + pad > b.y) {
                return true;
              }
            }
            return false;
          };

          for (let i = 0; i < sorted.length; i++) {
            const item = sorted[i];
            const boxW = Math.max(24, Math.min(canvasW - 12, Math.ceil(measureFn(item.text)) + 16));
            const minXBound = 6;
            const maxXBound = Math.max(minXBound, canvasW - boxW - 6);
            const anchorX = item.anchorX;
            const anchorY = item.anchorY;
            const idealX = clamp(anchorX - boxW * 0.5, minXBound, maxXBound);
            const idealY = clamp(anchorY - boxH, minYBound, maxYBound);

            let chosenX = idealX;
            let chosenY = idealY;
            let found = false;

            for (let yo = 0; yo < LABEL_Y_OFFSETS.length && !found; yo++) {
              for (let xo = 0; xo < LABEL_X_OFFSETS.length && !found; xo++) {
                const candX = clamp(anchorX + LABEL_X_OFFSETS[xo] - boxW * 0.5, minXBound, maxXBound);
                const candY = clamp(anchorY + LABEL_Y_OFFSETS[yo] - boxH, minYBound, maxYBound);
                if (!hitsAny(candX, candY, boxW)) {
                  chosenX = candX;
                  chosenY = candY;
                  found = true;
                }
              }
            }

            // Fallback 2D grid scan strictly inside [minXBound..maxXBound] x [minYBound..maxYBound]
            if (!found) {
              let bestDist2 = Infinity;
              const stepY = 12;
              const stepX = Math.max(14, Math.min(28, Math.floor(boxW * 0.35)));
              for (let gy = minYBound; gy <= maxYBound; gy += stepY) {
                for (let gx = minXBound; gx <= maxXBound; gx += stepX) {
                  if (!hitsAny(gx, gy, boxW)) {
                    const d2 = (gx - idealX) * (gx - idealX) + (gy - idealY) * (gy - idealY);
                    if (d2 < bestDist2) {
                      bestDist2 = d2;
                      chosenX = gx;
                      chosenY = gy;
                      found = true;
                    }
                  }
                }
                if (maxXBound > minXBound && !hitsAny(maxXBound, gy, boxW)) {
                  const d2 = (maxXBound - idealX) * (maxXBound - idealX) + (gy - idealY) * (gy - idealY);
                  if (d2 < bestDist2) {
                    bestDist2 = d2;
                    chosenX = maxXBound;
                    chosenY = gy;
                    found = true;
                  }
                }
              }
              if (!found && maxYBound > minYBound) {
                for (let gx = minXBound; gx <= maxXBound; gx += stepX) {
                  if (!hitsAny(gx, maxYBound, boxW)) {
                    chosenX = gx;
                    chosenY = maxYBound;
                    found = true;
                    break;
                  }
                }
              }
            }

            chosenX = clamp(chosenX, minXBound, maxXBound);
            chosenY = clamp(chosenY, minYBound, maxYBound);

            placed.push({
              x: chosenX,
              y: chosenY,
              w: boxW,
              h: boxH,
              anchorX,
              anchorY,
              text: item.text,
              bg: item.bg,
              fg: item.fg,
              alpha: item.alpha !== undefined ? item.alpha : 1.0,
            });
          }
          return placed;
        }

        /* True 3D Multi-Angle Stacked Arena Hoop (hoopSign = +1 North Hoop, -1 South Hoop) */
        const _hoopRimCols = ["#0b1120", "#9a3412", "#ea580c", "#fb923c", "#fed7aa"];
        function drawStackedHoop3D(hoopSign, p2s, sxR, syR) {
          const isNorth = hoopSign >= 0;
          const baseY = isNorth ? 0.24 : COURT.fullLength - 0.24;
          const boomY0 = isNorth ? 0.28 : COURT.fullLength - 0.28;
          const boomY1 = isNorth ? 1.06 : COURT.fullLength - 1.06;
          const boardBackY = isNorth ? 1.06 : COURT.fullLength - 1.06;
          const boardFrontY = isNorth ? COURT.backboardY : COURT.southBackboardY;
          const rimY = isNorth ? COURT.rimY : COURT.southRimY;

          const padMainCol = isNorth ? "#1d4ed8" : "#b91c1c";
          const padTopCol = isNorth ? "#60a5fa" : "#f87171";
          const padSideCol = isNorth ? "#1e3a8a" : "#7f1d1d";

          const drawStanchionAndBoom = () => {
            for (let k = 0; k < 12; k++) {
              const wz = (k / 11) * 1.45;

              ctxA.lineWidth = lw || 1.8;
              ctxA.stroke();
            }
          };

          const drawBackboard3D = () => {
            const hw = COURT.backboardHalfW;
            const bTL = p2s(-hw, boardBackY, 3.98);
            const bTR = p2s(hw, boardBackY, 3.98);
            const bBR = p2s(hw, boardBackY, 2.9);
            const bBL = p2s(-hw, boardBackY, 2.9);

            const fTL = p2s(-hw, boardFrontY, 3.98);
            const fTR = p2s(hw, boardFrontY, 3.98);
            const fBR = p2s(hw, boardFrontY, 2.9);
            const fBL = p2s(-hw, boardFrontY, 2.9);

            const frontCloser = fTL.camDepth >= bTL.camDepth;
            if (frontCloser) {
              fillQuad(bTL, bTR, bBR, bBL, "#334155", "#0b1120", 1.8);
            }
            fillQuad(bTL, bTR, fTR, fTL, "#64748b", "#0b1120", 1.4);
            fillQuad(bBL, fBL, fTL, bTL, "#475569", "#0b1120", 1.4);
            fillQuad(bBR, fBR, fTR, bTR, "#475569", "#0b1120", 1.4);

            fillQuad(fTL, fTR, fBR, fBL, "rgba(226, 232, 240, 0.88)", "#0b1120", 2.8);
            fillQuad(fTL, fTR, fBR, fBL, null, "#ffffff", 1.8);

            const sqTL = p2s(-0.3, boardFrontY, 3.52);
            const sqTR = p2s(0.3, boardFrontY, 3.52);
            const sqBR = p2s(0.3, boardFrontY, 3.06);
            const sqBL = p2s(-0.3, boardFrontY, 3.06);
            fillQuad(sqTL, sqTR, sqBR, sqBL, null, isNorth ? "#ef4444" : "#f97316", 1.8);

            if (!frontCloser) {
              fillQuad(bTL, bTR, bBR, bBL, "rgba(51, 65, 85, 0.55)", "#0b1120", 2.0);
            }
          };

          const drawRimAndNet3D = () => {
            const swish = state.fx.netSwishTimer > 0 && state.fx.netSwishHoop === hoopSign ? state.fx.netSwishTimer : 0;
            const waveX = swish > 0 ? Math.sin(state.simTime * 30) * 0.08 * swish : 0;
            const liftZ = swish > 0 ? Math.abs(Math.sin(state.simTime * 22)) * 0.16 * swish : 0;
            const netBotZ = COURT.rimZ - (0.42 - liftZ);
            const midNetZ = lerp(COURT.rimZ, netBotZ, 0.52);

            ctxA.strokeStyle = "rgba(255, 255, 255, 0.92)";
            ctxA.lineWidth = 1.4;
            ctxA.beginPath();
            for (let i = 0; i < 8; i++) {
              const c = UNIT_CIRCLE_8.cos[i];
              const s = UNIT_CIRCLE_8.sin[i];
              const topP = p2s(c * 0.25, rimY + s * 0.25, COURT.rimZ);
              const botP = p2s(c * 0.15 + waveX, rimY + s * 0.15, netBotZ);
              ctxA.moveTo(topP.x, topP.y);
              ctxA.lineTo(botP.x, botP.y);
            }
            for (let i = 0; i <= 12; i++) {
              const mp = p2s(UNIT_CIRCLE_12.cos[i] * 0.19 + waveX * 0.5, rimY + UNIT_CIRCLE_12.sin[i] * 0.19, midNetZ);
              if (i === 0) ctxA.moveTo(mp.x, mp.y);
              else ctxA.lineTo(mp.x, mp.y);
            }
            ctxA.stroke();

            // Rim bracket
            const brk = p2s(0, boardFrontY + hoopSign * 0.06, COURT.rimZ);
            ctxA.fillStyle = "#c2410c";
            ctxA.fillRect(brk.x - 3.5 * sxR, brk.y - 2.5, 7 * sxR, 5);

            // 5-Layer Stacked 3D Orange Cylinder Rim (precomputed UNIT_CIRCLE_16)
            for (let s = 0; s < 5; s++) {
              const rz = COURT.rimZ + (s - 1) * 0.022;
              ctxA.strokeStyle = _hoopRimCols[s];
              ctxA.lineWidth = s === 0 ? 4.0 : 2.1;
              ctxA.beginPath();
              for (let i = 0; i <= 16; i++) {
                const rp = p2s(UNIT_CIRCLE_16.cos[i] * 0.26, rimY + UNIT_CIRCLE_16.sin[i] * 0.26, rz);
                if (i === 0) ctxA.moveTo(rp.x, rp.y);
                else ctxA.lineTo(rp.x, rp.y);
              }
              ctxA.stroke();
            }
          };

          const d0 = project3D(0, baseY, 1.0).camDepth;
          const d1 = project3D(0, boardFrontY, 3.4).camDepth;
          const d2 = project3D(0, rimY, COURT.rimZ).camDepth;
          const parts = [
            { depth: d0, fn: drawStanchionAndBoom },
            { depth: d1, fn: drawBackboard3D },
            { depth: d2, fn: drawRimAndNet3D },
          ];
          parts.sort((a, b) => a.depth - b.depth);
          parts[0].fn();
          parts[1].fn();
          parts[2].fn();
        }

        /* =====================================================================
         * 10B. Authentic 7-Year-Old Youth Athlete (~5.2 Heads Tall, H = 1.28m)
         *      60fps Continuous 15-Joint Biomechanical 3D Rig + Per-Limb Sort!
         * ===================================================================== */
        function solveTwoBoneIK3D(root, target, L1, L2, pole, out) {
          const dx = target.x - root.x;
          const dy = target.y - root.y;
          const dz = target.z - root.z;
          const rawDist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          const minReach = Math.abs(L1 - L2) + 0.008;
          const maxReach = L1 + L2 - 0.003;
          const d = clamp(rawDist, minReach, maxReach);
          const invR = rawDist > 1e-5 ? 1.0 / rawDist : 0;
          const ux = rawDist > 1e-5 ? dx * invR : 0;
          const uy = rawDist > 1e-5 ? dy * invR : 0;
          const uz = rawDist > 1e-5 ? dz * invR : -1;

          const cosA = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
          const along = L1 * cosA;
          const h = Math.sqrt(Math.max(0, L1 * L1 - along * along));

          // Gram-Schmidt orthogonalize pole hint against axis u
          const dotPU = pole.x * ux + pole.y * uy + pole.z * uz;
          let vx = pole.x - ux * dotPU;
          let vy = pole.y - uy * dotPU;
          let vz = pole.z - uz * dotPU;
          let vLen = Math.sqrt(vx * vx + vy * vy + vz * vz);
          if (vLen < 1e-5) {
            vx = 0;
            vy = 1;
            vz = 0;
            const d2 = vy * uy;
            vx -= ux * d2;
            vy -= uy * d2;
            vz -= uz * d2;
            vLen = Math.max(1e-5, Math.sqrt(vx * vx + vy * vy + vz * vz));
          }
          const invV = 1.0 / vLen;
          vx *= invV;
          vy *= invV;
          vz *= invV;

          const mx = root.x + ux * along + vx * h;
          const my = root.y + uy * along + vy * h;
          const mz = root.z + uz * along + vz * h;
          const ex = root.x + ux * d;
          const ey = root.y + uy * d;
          const ez = root.z + uz * d;

          if (out) {
            out.mid.x = mx;
            out.mid.y = my;
            out.mid.z = mz;
            out.end.x = ex;
            out.end.y = ey;
            out.end.z = ez;
            return out;
          }
          return {
            mid: { x: mx, y: my, z: mz },
            end: { x: ex, y: ey, z: ez },
          };
        }

        const _POLE_LEG_L = { x: -0.14, y: 1.0, z: 0.12 };
        const _POLE_LEG_R = { x: 0.14, y: 1.0, z: 0.12 };
        const _ikScratchLegL = { mid: { x: 0, y: 0, z: 0 }, end: { x: 0, y: 0, z: 0 } };
        const _ikScratchLegR = { mid: { x: 0, y: 0, z: 0 }, end: { x: 0, y: 0, z: 0 } };
        const _ikScratchArmL = { mid: { x: 0, y: 0, z: 0 }, end: { x: 0, y: 0, z: 0 } };
        const _ikScratchArmR = { mid: { x: 0, y: 0, z: 0 }, end: { x: 0, y: 0, z: 0 } };
        const _targAnkL = { x: 0, y: 0, z: 0 };
        const _targAnkR = { x: 0, y: 0, z: 0 };
        const _targHandL = { x: 0, y: 0, z: 0 };
        const _targHandR = { x: 0, y: 0, z: 0 };
        const _poleArmL = { x: 0, y: 0, z: 0 };
        const _poleArmR = { x: 0, y: 0, z: 0 };

        function _createRigPoolSlot() {
          const local = {};
          const world = {};
          const renderWorld = {};
          for (let i = 0; i < RIG_JOINT_KEYS.length; i++) {
            const k = RIG_JOINT_KEYS[i];
            local[k] = { x: 0, y: 0, z: 0 };
            world[k] = { x: 0, y: 0, z: 0 };
            renderWorld[k] = { x: 0, y: 0, z: 0 };

          return {
            local,
            world,
            renderWorld,

            headHeight: 0.245,
            headRatio: 0.19,
            hipZ: 0.6,
            legRatio: 0.47,
            headTopZ: 1.28,
            gooseneckR: false,

        /* Solve Continuous 60fps 15-Joint 3D Rig for a 7-Year-Old Kid (H = 1.280m, 5.22 Heads Tall!) */
        function solvePlayerRig3D(p, opts) {
          const o = opts || null;
          const slot = o && o.poolSlot !== undefined && _rigPool[o.poolSlot] ? _rigPool[o.poolSlot] : _createRigPoolSlot();
          const loc = slot.local;
          const world = slot.world;

          const isOff = o && o.isOffense !== undefined ? !!o.isOffense : p.team === "offense";
          const userDefNow = isUserOnDefenseNow();
          const isMe =
            o && o.isMe !== undefined
              ? !!o.isMe
              : p.name === "YOU" ||
                (isOff && (state.fullCourt || state.role === "offense") && p.id === 0) ||
                (!isOff && !state.fullCourt && state.role === "defense" && p.id === 0);
          const hasBallNow =
            o && o.hasBallNow !== undefined
              ? !!o.hasBallNow
              : !state.ball.inFlight &&

            o && o.isDefending !== undefined
              ? !!o.isDefending

          // Canonical 7-Year-Old Proportions (H = 1.280m, Wingspan ~ H = 1.27m, Head = 0.245m => 5.22 heads tall!)
          const L_THIGH = 0.272;
          const L_SHIN = 0.265;
          const ANKLE_BASE_Z = 0.065;
          const HIP_BASE_Z = 0.6;
          const L_UPPER_ARM = 0.236;
          const L_FORE_ARM = 0.232;

          const spd = hypot2(p.vx || 0, p.vy || 0);
          const ph = (p.stridePhase || 0) + ((o && o.extraPhase) || 0);
          const sinPh = Math.sin(ph);
          const cosPh = Math.cos(ph);
          const jumpZ = p.jumpZ || 0;
          const isAirborne = jumpZ > 0.025;
          const isShooting = isAirborne && p.shootFollowTimer > 0 && p.contestTimer <= 0;
          const isShootFollow = p.shootFollowTimer > 0 && p.contestTimer <= 0;
          const isCross = (isMe && state.rhythm.crossoverTimer > 0) || p.animState === "crossover";
          const crossDir = isMe && state.rhythm.crossoverDir ? state.rhythm.crossoverDir : 1;

          const runBlend = isAirborne ? 0 : clamp((spd - 0.18) / 3.4, 0, 1);
          const sprintBlend = isAirborne ? 0 : clamp((spd - 3.4) / 2.1, 0, 1);
          const idleBreath = (1.0 - runBlend) * Math.sin(t * 2.8 + p.id * 1.3) * 0.003;

          const isBoxOut = (p.boxOutTimer || 0) > 0 && !isAirborne && !isShooting;

          const fAngPose = p.facing !== undefined ? p.facing : p.gazeAngle || 0;
          const fCosPose = Math.cos(fAngPose);
          const fSinPose = Math.sin(fAngPose);
          const localPushY = (p.contactDirX || 0) * fCosPose + (p.contactDirY || 0) * fSinPose;
          const localPushX = (p.contactDirX || 0) * -fSinPose + (p.contactDirY || 0) * fCosPose;

          // 1. Pelvis Height, Crouch & Forward/Lateral Torso Tilt
          let hipDrop = 0;
          let fwdPitch = (0.09 + 0.23 * sprintBlend) * runBlend;
          let sideRoll = sinPh * 0.035 * runBlend;
          let bobZ = isAirborne ? 0 : (Math.abs(sinPh) - 0.42) * (0.032 + 0.03 * sprintBlend) * runBlend - 0.016 * sprintBlend + idleBreath;

          if (p.offBalanceTimer > 0) {

            fwdPitch = -0.19;

          } else if (isBoxOut) {
            hipDrop += 0.115;
            fwdPitch = 0.15;
            sideRoll = sinPh * 0.03 * runBlend;
          } else if (isWallUp && !isAirborne) {
            hipDrop += 0.075;
            fwdPitch = 0.04;
            sideRoll = sinPh * 0.02 * runBlend;
          } else if (p.stealLungeTimer > 0) {
            hipDrop += 0.125;
            fwdPitch = 0.3;
            sideRoll = 0.1;
          } else if (isDefendingNow && !isAirborne && spd < 4.35) {
            hipDrop += 0.105;
            fwdPitch = 0.18;
            sideRoll = sinPh * 0.05 * runBlend;
          } else if (hasBallNow && gatherT > 0 && !isAirborne) {
            hipDrop += 0.095;
            fwdPitch = 0.1;
          } else if (hasBallNow && !isAirborne) {
            hipDrop += isCross ? 0.095 : 0.055;
            fwdPitch = Math.max(fwdPitch, isCross ? 0.22 : 0.14);
            if (isCross) sideRoll = crossDir * 0.23;
          } else if (isCross && !isAirborne) {

            fwdPitch = 0.22;
            sideRoll = crossDir * 0.23;
          } else if ((p.crouch || 0) > 0.15 && !isAirborne) {
            hipDrop += 0.07 * p.crouch;
            fwdPitch += 0.12 * p.crouch;
          }

          if (cStrength > 0 && p.offBalanceTimer <= 0 && !isShooting) {
            hipDrop += 0.032 * cStrength;
            fwdPitch = clamp(fwdPitch + localPushY * 0.16 * cStrength, -0.25, 0.36);
            sideRoll = clamp(sideRoll + localPushX * 0.18 * cStrength, -0.3, 0.3);
          }

          if (isShooting) {
            fwdPitch = p.layupMode ? 0.1 : -0.04;
            sideRoll = p.layupMode ? -0.06 : 0;
            hipDrop = 0;
          }

          const pelvis = loc.pelvis;
          pelvis.x = 0;
          pelvis.y = 0;
          pelvis.z = clamp(HIP_BASE_Z - hipDrop + bobZ, 0.42, 0.64);

          const sinP = Math.sin(fwdPitch);
          const cosP = Math.cos(fwdPitch);

          const L_elbow = loc.L_elbow;

          // Transform local (+lx right, +ly forward, +lz up) -> World (wx, wy, wz) using static RIG_JOINT_KEYS (0 Object.keys alloc!)
          const fAng = p.facing !== undefined ? p.facing : p.gazeAngle;

          const sinF = Math.sin(fAng);
          const rx = -sinF;
          const ry = cosF;

          for (let k = 0; k < RIG_JOINT_KEYS.length; k++) {
            const key = RIG_JOINT_KEYS[k];
            const pt = loc[key];
            const ox = cosF * pt.y + rx * pt.x;
            const oy = sinF * pt.y + ry * pt.x;

            wPt.x = p.x + ox;
            wPt.y = p.y + oy;
            wPt.z = jumpZ + pt.z;
            const rwPt = renderWorld[key];
            rwPt.x = p.x + ox * visScale;
            rwPt.y = p.y + oy * visScale;
            rwPt.z = (jumpZ + pt.z) * visScale;
          }

          const soleZ = Math.min(0, L_toe.z - 0.022, R_toe.z - 0.022);
          const totalHeight = headTop.z - soleZ;
          const headHeight = headTop.z - neck.z;
          const hipZ = pelvis.z - soleZ;

          slot.totalHeight = totalHeight;
          slot.headHeight = headHeight;
          slot.headRatio = headHeight / Math.max(0.01, totalHeight);
          slot.hipZ = hipZ;
          slot.legRatio = hipZ / Math.max(0.01, totalHeight);
          slot.headTopZ = world.headTop.z;
          slot.gooseneckR = gooseneckR;
          slot.isDefendingNow = isDefendingNow;
          slot.facing = fAng;
          slot.cosF = cosF;
          slot.sinF = sinF;
          slot.visScale = visScale;
          return slot;
        }

        /* Volumetric Tapered Capsule Limb Helper (Crisp Outer Halo + #0f172a Outline + Shaded Base) */
        function drawTaperedCapsule2D(ctx, p0, p1, r0, r1, fillCol, hiCol, outlineCol, lw) {
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy);
          const strokeW = lw || 1.5;
          if (len < 0.4) {
            const rad = Math.max(1.2, (r0 + r1) * 0.5);
            ctx.beginPath();
            ctx.arc(p0.x, p0.y, rad, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
            ctx.lineWidth = strokeW + 1.4;
            ctx.stroke();
            ctx.fillStyle = fillCol;
            ctx.fill();
            ctx.strokeStyle = outlineCol || "#0f172a";
            ctx.lineWidth = strokeW;
            ctx.stroke();
            return;
          }
          const nx = -dy / len;
          const ny = dx / len;
          const ang = Math.atan2(dy, dx);

          ctx.beginPath();
          ctx.arc(p0.x, p0.y, r0, ang + Math.PI * 0.5, ang - Math.PI * 0.5, false);
          ctx.arc(p1.x, p1.y, r1, ang - Math.PI * 0.5, ang + Math.PI * 0.5, false);
          ctx.closePath();

          // Subtle high-contrast outer rim halo so overlapping limbs separate cleanly
          ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
          ctx.lineWidth = strokeW + 1.4;
          ctx.stroke();

          ctx.fillStyle = fillCol;
          ctx.fill();

          if (hiCol) {
            ctx.save();
            ctx.strokeStyle = hiCol;
            ctx.lineWidth = Math.max(1.0, Math.min(r0, r1) * 0.48);
            ctx.beginPath();
            ctx.moveTo(p0.x + nx * r0 * 0.36, p0.y + ny * r0 * 0.36);
            ctx.lineTo(p1.x + nx * r1 * 0.36, p1.y + ny * r1 * 0.36);
            ctx.stroke();
            ctx.restore();
          }

          ctx.strokeStyle = outlineCol || "#0f172a";
          ctx.lineWidth = strokeW;
          ctx.stroke();
        }

        const _ballScratchFloor = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, visible: true };
        const _ballScratchAir = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, visible: true };
        const _ballScratchTrail = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, visible: true };

        function drawBasketballVolumetric3D(ctx, p2s, sxR, syR, bx, by, bz, drawTrailAndShadow, fpsOpts) {
          const bFloor = p2s(bx, by, 0, _ballScratchFloor);
          const bAir = p2s(bx, by, bz, _ballScratchAir);
          if (fpsOpts && !bAir.visible) return;
          let rBall;
          if (fpsOpts && fpsOpts.fp) {
            const rawCamZ = fpsOpts.fp.worldToCam(bx, by, bz).z;
            if (fpsOpts.centerCamZ !== undefined) {
              // Synced with player's stabilized camera depth & capped below player head radius (BUG-R4 fix!)
              const refMidZ = fpsOpts.rawMidZ !== undefined ? fpsOpts.rawMidZ : fpsOpts.centerCamZ;
              const effBallZ = Math.max(0.88, fpsOpts.centerCamZ + (rawCamZ - refMidZ) * 0.35);
              const maxR = fpsOpts.maxBallR !== undefined ? fpsOpts.maxBallR : 28.0;
              rBall = clamp((fpsOpts.fp.focal / effBallZ) * 0.106, 3.2, Math.max(3.4, maxR));
            } else {
              const camZ = Math.max(0.42, rawCamZ);
              rBall = clamp((fpsOpts.fp.focal / camZ) * 0.118, 3.2, 32.0);
            }
          } else {
            const ballMPx = clamp(bFloor.s * (state.fullCourt ? 52.0 : 45.5), 18.0, 74.0) * Math.min(sxR, syR);
            rBall = clamp(ballMPx * 0.106, 4.6, 13.5);
          }
          const shadowShrink = clamp(1.0 - bz * 0.12, 0.4, 1.0);

          if (drawTrailAndShadow && state.ball.inFlight && state.ball.trail.length > 0) {
            const tLen = state.ball.trail.length;
            for (let t = 0; t < tLen; t++) {
              const tr = state.ball.trail[t];
              const tp = p2s(tr.x, tr.y, tr.z, _ballScratchTrail);
              if (fpsOpts && !tp.visible) continue;
              const tFrac = (t + 1) / (tLen + 1);
              const alpha = tFrac * 0.42;
              ctx.fillStyle = "rgba(251, 146, 60, " + alpha.toFixed(2) + ")";
              ctx.beginPath();
              ctx.arc(tp.x, tp.y, Math.max(2.2, rBall * 0.68 * tFrac), 0, Math.PI * 2);
              ctx.fill();
            }
          }

          if (drawTrailAndShadow && (!fpsOpts || bFloor.visible)) {
            ctx.fillStyle = "rgba(15, 23, 42, 0.42)";
            ctx.beginPath();
            ctx.ellipse(bFloor.x, bFloor.y, rBall * 1.02 * shadowShrink, rBall * 0.4 * shadowShrink, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          // Smooth Volumetric Basketball Sphere + Outer Contrast Halo + Spinning Seam Ribs!
          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.beginPath();
          ctx.arc(bAir.x, bAir.y, rBall, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.48)";
          ctx.lineWidth = 3.0;
          ctx.stroke();
          ctx.fillStyle = "#ea580c";
          ctx.fill();
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Warm upper-left 3D sphere highlight
          ctx.fillStyle = "#fb923c";
          ctx.beginPath();
          ctx.arc(bAir.x - rBall * 0.24, bAir.y - rBall * 0.24, rBall * 0.56, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fed7aa";
          ctx.beginPath();
          ctx.arc(bAir.x - rBall * 0.34, bAir.y - rBall * 0.34, rBall * 0.22, 0, Math.PI * 2);
          ctx.fill();

          // Rotating 3D Basketball Seams
          const sp = state.ball.spinPhase;
          ctx.strokeStyle = "#271206";
          ctx.lineWidth = Math.max(1.2, rBall * 0.14);
          ctx.beginPath();
          ctx.ellipse(bAir.x, bAir.y, rBall * 0.92, Math.max(1.2, Math.abs(Math.sin(sp)) * rBall * 0.88), 0.25, 0, Math.PI * 2);
          ctx.moveTo(bAir.x - rBall * 0.92, bAir.y);
          ctx.lineTo(bAir.x + rBall * 0.92, bAir.y);
          ctx.stroke();

          // Re-stroke crisp outer silhouette
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(bAir.x, bAir.y, rBall, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        /* Deterministic Helper to Measure Exact Projected Head-to-Ankle Screen Height (px) */
        function measurePlayerScreenHeight(p, opts) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const W = Math.max(1, (canvasA.width || 640) / dpr);
          const H = Math.max(1, (canvasA.height || 480) / dpr);
          const syR = H / REF_H;
          const sxR = W / REF_W;
          const visScale = state.fullCourt ? 1.96 : 1.72;
          const rig = solvePlayerRig3D(p, Object.assign({ visScale, poolSlot: 12 }, opts || {}));
          const rw = rig.renderWorld;
          const pTop = project3D(rw.headTop.x, rw.headTop.y, rw.headTop.z);
          const pAnkL = project3D(rw.L_ankle.x, rw.L_ankle.y, rw.L_ankle.z);
          const pAnkR = project3D(rw.R_ankle.x, rw.R_ankle.y, rw.R_ankle.z);
          const ankY = Math.max(pAnkL.y, pAnkR.y) * syR;
          const topY = pTop.y * syR;
          const pFloorS = project3D(p.x, p.y, 0).s;
          const mPx = clamp(pFloorS * (state.fullCourt ? 52.0 : 45.5), 18.0, 86.0) * Math.min(sxR, syR);
          const headRx = Math.max(4.4, mPx * 0.112);
          const ballMPx = clamp(pFloorS * (state.fullCourt ? 52.0 : 45.5), 18.0, 74.0) * Math.min(sxR, syR);
          const rBall = clamp(ballMPx * 0.106, 4.6, 13.5);
          return {
            pixelHeight: ankY - topY,
            refHeight: Math.max(pAnkL.y, pAnkR.y) - pTop.y,
            mPx,
            headRx,
            rBall,
            headRatio: rig.headRatio,
            visScale,
          };
        }

        // Pre-allocated joint projection scratch table + limb sort buffers (0 allocations per player!)
        const _projJoints = {};
        for (let i = 0; i < RIG_JOINT_KEYS.length; i++) {
          _projJoints[RIG_JOINT_KEYS[i]] = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, camZ: 1, visible: true };
        }
        const _floorProjScratch = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, camZ: 1, visible: true };
        const _ballProjScratch = { x: 0, y: 0, floorY: 0, s: 1, camDepth: 0, camZ: 1, visible: true };
        const _sockMidScratch = { x: 0, y: 0 };
        const _shortHemScratch = { x: 0, y: 0 };
        const _limbOrderIds = [0, 1, 2, 3, 4, 5, 6];
        const _limbDepths = [0, 0, 0, 0, 0, 0, 0];
        const _heldBallFpsOpts = { fp: null, centerCamZ: 1.0, rawMidZ: 1.0, maxBallR: 20.0 };

        /* Render 7-Year-Old Articulated Player with Per-Limb 3D Depth Sorting (Zero putImageData, Zero Per-Joint Alloc!) */
        function drawArticulatedPlayer3D(ctx, item, p2s, sxR, syR, fpsOpts) {
          const p = item.p;
          const isOff = item.isOffense;
          const isMe = item.isMe;
          const hasBallNow = item.hasBallNow;

          const visScale = fpsOpts ? fpsOpts.visScale || 1.0 : state.fullCourt ? 1.96 : 1.72;
          const rig = solvePlayerRig3D(p, {
            isOffense: isOff,
            isMe,
            hasBallNow,
            visScale,
            poolSlot: item.poolSlot !== undefined ? item.poolSlot : 11,
          });
          const rw = rig.renderWorld;
          const floorProj = p2s(p.x, p.y, 0, _floorProjScratch);

          const S = _projJoints;
          for (let i = 0; i < RIG_JOINT_KEYS.length; i++) {
            const k = RIG_JOINT_KEYS[i];
            const rwk = rw[k];
            p2s(rwk.x, rwk.y, rwk.z, S[k]);
          }

          let mPx;
          if (fpsOpts && fpsOpts.fp) {
            const ankleMidY = (S.L_ankle.y + S.R_ankle.y) * 0.5;
            const skelSpanPx = Math.max(12.0, Math.abs(ankleMidY - S.headTop.y));
            const neckCrownPx = Math.max(2.4, Math.abs(S.neck.y - S.headTop.y));
            const fpsMPx = 0.55 * (skelSpanPx / 1.28) + 0.45 * (neckCrownPx / 0.252);
            const maxFpsMPx = 340.0 * Math.max(1.0, Math.min(sxR, syR));
            mPx = clamp(fpsMPx, 14.0, maxFpsMPx);
          } else {
            mPx = clamp(floorProj.s * (state.fullCourt ? 52.0 : 45.5), 18.0, 86.0) * Math.min(sxR, syR);
          }
          const headRxOut = Math.max(4.4, mPx * 0.112);
          const headRyOut = Math.max(5.2, mPx * 0.132);

          const inkCol = isMe && state.rhythm.burstBoostTimer > 0 ? "#facc15" : "#0f172a";
          const inkW = isMe && state.rhythm.burstBoostTimer > 0 ? 2.3 : 1.7;

          // Pure Team Palettes (Blue Team ONLY uses Blue/Navy/Sky/Gold/White; Red Team uses Red/Crimson!)
          const jerseyMain = isOff ? "#2563eb" : "#dc2626";
          const jerseyShade = isOff ? "#1d4ed8" : "#991b1b";
          const jerseyHi = isOff ? "#60a5fa" : "#f87171";
          const shortsMain = isOff ? "#1e40af" : "#b91c1c";
          const shortsShade = isOff ? "#1e3a8a" : "#7f1d1d";
          const trimCol = isMe ? "#facc15" : "#ffffff";
          const shoeCol = isOff ? "#2563eb" : "#dc2626";
          const skinMain = p.skinMid || "#e2a872";
          const skinHi = p.skinLight || "#f6c89a";
          const skinDark = p.skinDark || "#b87b45";
          const hairCol = p.hairColor || "#18181b";

          const effCamYaw = fpsOpts ? fpsOpts.camYawEquiv : state.cam.yaw;
          const fAng = rig.facing;
          const screenFAng = fAng - effCamYaw;
          const cosCam = fpsOpts ? fpsOpts.cosCamEquiv : _cam3DFrame.cosY;
          const sinCam = fpsOpts ? fpsOpts.sinCamEquiv : _cam3DFrame.sinY;
          const cCam = cosCam !== undefined ? cosCam : Math.cos(effCamYaw);
          const sCam = sinCam !== undefined ? sinCam : Math.sin(effCamYaw);
          const frontDot = -rig.cosF * sCam + rig.sinF * cCam;
          const sideDot = rig.cosF * cCam + rig.sinF * sCam;

          ctx.save();
          ctx.imageSmoothingEnabled = true;

          // 1. Ball-Handler Double Spotlight Ring + ★ YOU Golden Floor Ring + Contact Shadow
          const shadowScale = clamp(1.0 - (p.jumpZ || 0) * 0.18, 0.52, 1.0);
          if (hasBallNow) {
            const bPulse = 1 + Math.sin(state.simTime * 8.5) * 0.06;
            ctx.fillStyle = "rgba(249, 115, 22, 0.24)";
            ctx.beginPath();
            ctx.ellipse(floorProj.x, floorProj.floorY, mPx * 0.54 * bPulse, mPx * 0.22 * bPulse, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#fb923c";
            ctx.lineWidth = 3.0;
            ctx.stroke();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.ellipse(floorProj.x, floorProj.floorY, mPx * 0.42 * bPulse, mPx * 0.17 * bPulse, 0, 0, Math.PI * 2);
            ctx.stroke();
          }
          if (isMe) {
            ctx.strokeStyle = "#facc15";
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.ellipse(floorProj.x, floorProj.floorY, mPx * 0.48, mPx * 0.2, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "#fef08a";
            ctx.beginPath();
            ctx.arc(
              floorProj.x + Math.cos(screenFAng) * mPx * 0.52,
              floorProj.floorY + Math.sin(screenFAng) * mPx * 0.22,
              Math.max(2.8, mPx * 0.085),
              0,
              Math.PI * 2
            );
            ctx.fill();
          }

          ctx.fillStyle = "rgba(15, 23, 42, 0.44)";
          ctx.beginPath();
          ctx.ellipse(floorProj.x, floorProj.floorY, mPx * 0.34 * shadowScale, mPx * 0.13 * shadowScale, 0, 0, Math.PI * 2);
          ctx.fill();

          if (isMe && state.rhythm.crossoverTimer > 0.22) {
            const gShift = -state.rhythm.crossoverDir * mPx * 0.38;
            ctx.fillStyle = "rgba(56, 189, 248, 0.24)";
            ctx.beginPath();
            ctx.ellipse(S.chest.x + gShift, (S.chest.y + S.pelvis.y) * 0.5, mPx * 0.18, mPx * 0.34, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          const drawLeg = (isRight) => {
            const hip = isRight ? S.R_hip : S.L_hip;
            const knee = isRight ? S.R_knee : S.L_knee;
            const ankle = isRight ? S.R_ankle : S.L_ankle;
            const toe = isRight ? S.R_toe : S.L_toe;
            _sockMidScratch.x = lerp(knee.x, ankle.x, 0.52);
            _sockMidScratch.y = lerp(knee.y, ankle.y, 0.52);
            _shortHemScratch.x = lerp(hip.x, knee.x, 0.62);
            _shortHemScratch.y = lerp(hip.y, knee.y, 0.62);

            drawTaperedCapsule2D(ctx, hip, knee, mPx * 0.082, mPx * 0.064, skinMain, skinHi, inkCol, inkW);
            drawTaperedCapsule2D(ctx, hip, _shortHemScratch, mPx * 0.118, mPx * 0.106, shortsMain, shortsShade, inkCol, inkW);
            const outSign = hip.x >= S.pelvis.x ? 1 : -1;
            ctx.strokeStyle = trimCol;
            ctx.lineWidth = Math.max(1.2, mPx * 0.042);
            ctx.beginPath();
            ctx.moveTo(hip.x + outSign * mPx * 0.06, hip.y);
            ctx.lineTo(_shortHemScratch.x + outSign * mPx * 0.06, _shortHemScratch.y);
            ctx.stroke();

            drawTaperedCapsule2D(ctx, knee, _sockMidScratch, mPx * 0.062, mPx * 0.052, skinMain, skinHi, inkCol, inkW);
            drawTaperedCapsule2D(ctx, _sockMidScratch, ankle, mPx * 0.055, mPx * 0.048, "#f8fafc", jerseyHi, inkCol, inkW);

            drawTaperedCapsule2D(ctx, ankle, toe, mPx * 0.064, mPx * 0.056, shoeCol, jerseyHi, inkCol, inkW);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = Math.max(1.3, mPx * 0.048);
            ctx.beginPath();
            ctx.moveTo(ankle.x, ankle.y + mPx * 0.032);
            ctx.lineTo(toe.x, toe.y + mPx * 0.028);
            ctx.stroke();
          };

          const drawArm = (isRight) => {
            const sh = isRight ? S.R_shoulder : S.L_shoulder;
            const el = isRight ? S.R_elbow : S.L_elbow;
            const hd = isRight ? S.R_hand : S.L_hand;

            drawTaperedCapsule2D(ctx, sh, el, mPx * 0.058, mPx * 0.048, skinMain, skinHi, inkCol, inkW);
            drawTaperedCapsule2D(ctx, el, hd, mPx * 0.048, mPx * 0.04, skinMain, skinHi, inkCol, inkW);

            ctx.strokeStyle = trimCol;
            ctx.lineWidth = Math.max(1.6, mPx * 0.055);
            ctx.beginPath();
            ctx.moveTo(lerp(el.x, hd.x, 0.78), lerp(el.y, hd.y, 0.78));
            ctx.lineTo(lerp(el.x, hd.x, 0.88), lerp(el.y, hd.y, 0.88));
            ctx.stroke();

            const handR = Math.max(2.1, mPx * 0.05);
            ctx.fillStyle = skinHi;
            ctx.strokeStyle = inkCol;
            ctx.lineWidth = inkW * 0.9;
            ctx.beginPath();
            ctx.arc(hd.x, hd.y, handR, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            if (isRight && rig.gooseneckR) {
              ctx.strokeStyle = skinMain;
              ctx.lineWidth = Math.max(1.5, mPx * 0.038);
              ctx.beginPath();
              ctx.moveTo(hd.x, hd.y);
              ctx.lineTo(hd.x + sideDot * mPx * 0.06, hd.y + mPx * 0.065);
              ctx.stroke();
            }
          };

          const drawTorsoAndShorts = () => {
            drawTaperedCapsule2D(ctx, S.L_hip, S.R_hip, mPx * 0.105, mPx * 0.105, shortsMain, shortsShade, inkCol, inkW);

            const leftIsL = S.L_shoulder.x <= S.R_shoulder.x;
            let shLeftX = leftIsL ? S.L_shoulder.x : S.R_shoulder.x;
            let shLeftY = leftIsL ? S.L_shoulder.y : S.R_shoulder.y;
            let shRightX = leftIsL ? S.R_shoulder.x : S.L_shoulder.x;
            let shRightY = leftIsL ? S.R_shoulder.y : S.L_shoulder.y;

            const minTorsoHalfW = mPx * 0.135;
            if (shRightX - shLeftX < minTorsoHalfW * 2) {
              const midShY = (shLeftY + shRightY) * 0.5;
              shLeftX = S.shoulderCenter.x - minTorsoHalfW;
              shRightX = S.shoulderCenter.x + minTorsoHalfW;
              shLeftY = midShY;
              shRightY = midShY;
            }

            const spanPx = shRightX - shLeftX;
            const hipHalfPx = Math.max(mPx * 0.115, spanPx * 0.38);
            const lWaistX = S.pelvis.x - hipHalfPx;
            const rWaistX = S.pelvis.x + hipHalfPx;
            const waistY = S.pelvis.y + mPx * 0.02;

            ctx.beginPath();
            ctx.moveTo(shLeftX, shLeftY);
            ctx.lineTo(shRightX, shRightY);
            ctx.lineTo(rWaistX, waistY);
            ctx.lineTo(lWaistX, waistY);
            ctx.closePath();
            ctx.fillStyle = jerseyMain;
            ctx.fill();

            ctx.fillStyle = jerseyShade;
            ctx.beginPath();
            ctx.moveTo(lerp(shLeftX, shRightX, 0.52), lerp(shLeftY, shRightY, 0.52));
            ctx.lineTo(shRightX, shRightY);
            ctx.lineTo(rWaistX, waistY);
            ctx.lineTo(lerp(lWaistX, rWaistX, 0.52), waistY);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = trimCol;
            ctx.lineWidth = Math.max(1.4, mPx * 0.048);
            ctx.beginPath();
            ctx.moveTo(lerp(shLeftX, shRightX, 0.28), lerp(shLeftY, shRightY, 0.28) + mPx * 0.01);
            ctx.lineTo(lerp(shLeftX, shRightX, 0.5), lerp(shLeftY, shRightY, 0.5) + (frontDot > 0 ? mPx * 0.075 : mPx * 0.035));
            ctx.lineTo(lerp(shLeftX, shRightX, 0.72), lerp(shLeftY, shRightY, 0.72) + mPx * 0.01);
            ctx.moveTo(lWaistX, waistY);
            ctx.lineTo(rWaistX, waistY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(shLeftX, shLeftY);
            ctx.lineTo(shRightX, shRightY);
            ctx.lineTo(rWaistX, waistY);
            ctx.lineTo(lWaistX, waistY);
            ctx.closePath();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.32)";
            ctx.lineWidth = inkW + 1.6;
            ctx.stroke();
            ctx.strokeStyle = inkCol;
            ctx.lineWidth = inkW;
            ctx.stroke();

            const visFace = Math.abs(frontDot);
            if (visFace > 0.2 && mPx >= 18) {
              const numCx = (S.shoulderCenter.x + S.pelvis.x) * 0.5;
              const numCy = lerp(S.shoulderCenter.y, waistY, 0.57);
              const numStr = String(p.number);
              ctx.save();
              ctx.translate(numCx, numCy);
              ctx.scale(clamp(visFace, 0.45, 1.0), 1.0);
              ctx.font = "900 " + Math.max(10, Math.round(mPx * 0.32)) + 'px "SF Pro Rounded", sans-serif';
              ctx.textAlign = "center";
              ctx.strokeStyle = "#0f172a";
              ctx.lineWidth = 2.8;
              ctx.strokeText(numStr, 0, mPx * 0.085);
              ctx.fillStyle = isMe ? "#fef08a" : "#ffffff";
              ctx.fillText(numStr, 0, mPx * 0.085);
              ctx.restore();
            }
          };

          const drawHeadAndHair = () => {
            const drawRibbonTails = () => {
              if (!isMe) return;
              ctx.save();
              ctx.lineCap = "round";
              ctx.strokeStyle = "#0f172a";
              ctx.lineWidth = Math.max(2.6, mPx * 0.095);
              ctx.beginPath();
              ctx.moveTo(S.ribbonKnot.x, S.ribbonKnot.y);
              ctx.lineTo(S.ribbonTipL.x, S.ribbonTipL.y);
              ctx.moveTo(S.ribbonKnot.x, S.ribbonKnot.y);
              ctx.lineTo(S.ribbonTipR.x, S.ribbonTipR.y);
              ctx.stroke();

              ctx.strokeStyle = "#facc15";
              ctx.lineWidth = Math.max(1.5, mPx * 0.055);
              ctx.beginPath();
              ctx.moveTo(S.ribbonKnot.x, S.ribbonKnot.y);
              ctx.lineTo(S.ribbonTipL.x, S.ribbonTipL.y);
              ctx.stroke();
              ctx.strokeStyle = "#eab308";
              ctx.beginPath();
              ctx.moveTo(S.ribbonKnot.x, S.ribbonKnot.y);
              ctx.lineTo(S.ribbonTipR.x, S.ribbonTipR.y);
              ctx.stroke();
              ctx.restore();
            };

            if (frontDot > 0) drawRibbonTails();

            drawTaperedCapsule2D(ctx, S.shoulderCenter, S.neck, mPx * 0.052, mPx * 0.048, skinDark, null, inkCol, inkW * 0.85);

            const hx = S.head.x;
            const hy = S.head.y;

            if (Math.abs(frontDot) > 0.3) {
              const earOff = headRxOut * 0.94;
              const earR = headRxOut * 0.24;
              const earY = hy + headRyOut * 0.06;
              ctx.fillStyle = skinDark;
              ctx.strokeStyle = inkCol;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.arc(hx - earOff, earY, earR, 0, Math.PI * 2);
              ctx.moveTo(hx + earOff + earR, earY);
              ctx.arc(hx + earOff, earY, earR, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            }

            ctx.beginPath();
            ctx.ellipse(hx, hy, headRxOut, headRyOut, 0, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.30)";
            ctx.lineWidth = inkW + 1.5;
            ctx.stroke();
            ctx.fillStyle = skinMain;
            ctx.fill();
            ctx.strokeStyle = inkCol;
            ctx.lineWidth = inkW;
            ctx.stroke();

            ctx.fillStyle = skinHi;
            ctx.beginPath();
            ctx.ellipse(hx - headRxOut * 0.22, hy - headRyOut * 0.18, headRxOut * 0.45, headRyOut * 0.42, 0, 0, Math.PI * 2);
            ctx.fill();

            if (frontDot > -0.08) {
              const faceShiftX = sideDot * headRxOut * 0.46;
              const eyeSpan = headRxOut * 0.36 * clamp(frontDot + 0.35, 0.22, 1.0);
              const eyeY = hy + headRyOut * 0.06;
              const eyeR = Math.max(1.1, headRxOut * 0.15);

              ctx.fillStyle = "#0f172a";
              ctx.beginPath();
              ctx.arc(hx + faceShiftX - eyeSpan, eyeY, eyeR, 0, Math.PI * 2);
              if (frontDot > 0.18) {
                ctx.moveTo(hx + faceShiftX + eyeSpan + eyeR, eyeY);
                ctx.arc(hx + faceShiftX + eyeSpan, eyeY, eyeR, 0, Math.PI * 2);
              }
              ctx.fill();

              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(hx + faceShiftX - eyeSpan - eyeR * 0.25, eyeY - eyeR * 0.28, eyeR * 0.38, 0, Math.PI * 2);
              ctx.fill();

              ctx.strokeStyle = hairCol;
              ctx.lineWidth = Math.max(1.1, headRxOut * 0.13);
              ctx.beginPath();
              ctx.moveTo(hx + faceShiftX - eyeSpan - eyeR, eyeY - eyeR * 1.45);
              ctx.lineTo(hx + faceShiftX - eyeSpan + eyeR, eyeY - eyeR * 1.25);
              if (frontDot > 0.18) {
                ctx.moveTo(hx + faceShiftX + eyeSpan - eyeR, eyeY - eyeR * 1.25);
                ctx.lineTo(hx + faceShiftX + eyeSpan + eyeR, eyeY - eyeR * 1.45);
              }
              ctx.stroke();
            }

            ctx.fillStyle = hairCol;
            ctx.strokeStyle = inkCol;
            ctx.lineWidth = inkW * 0.9;
            ctx.beginPath();
            if (frontDot <= 0.05) {
              ctx.ellipse(
                hx - sideDot * headRxOut * 0.08,
                hy - headRyOut * 0.14,
                headRxOut * 1.05,
                headRyOut * 0.88,
                0,
                Math.PI * 0.88,
                Math.PI * 2.12
              );
            } else {
              ctx.ellipse(hx - sideDot * headRxOut * 0.1, hy - headRyOut * 0.34, headRxOut * 1.04, headRyOut * 0.68, 0, Math.PI, Math.PI * 2);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            if (p.hairStyle === 1 || isMe) {
              ctx.fillStyle = hairCol;
              ctx.beginPath();
              ctx.arc(hx, hy - headRyOut * 0.92, headRxOut * 0.38, 0, Math.PI * 2);
              ctx.fill();
            }

            if (isMe) {
              ctx.fillStyle = "#facc15";
              ctx.strokeStyle = "#0f172a";
              ctx.lineWidth = 1.3;
              ctx.beginPath();
              ctx.roundRect(hx - headRxOut * 1.04, hy - headRyOut * 0.44, headRxOut * 2.08, Math.max(2.8, headRyOut * 0.26), 3);
              ctx.fill();
              ctx.stroke();
            }

            if (frontDot <= 0) drawRibbonTails();
          };

          // Zero-allocation insertion sort across 6..7 limb IDs
          let limbCount = 6;
          _limbOrderIds[0] = 0;
          _limbDepths[0] = (S.L_knee.camDepth + S.L_ankle.camDepth) * 0.5;
          _limbOrderIds[1] = 1;
          _limbDepths[1] = (S.R_knee.camDepth + S.R_ankle.camDepth) * 0.5;
          _limbOrderIds[2] = 2;
          _limbDepths[2] = (S.pelvis.camDepth + S.chest.camDepth) * 0.5;
          _limbOrderIds[3] = 3;
          _limbDepths[3] = (S.L_elbow.camDepth + S.L_hand.camDepth) * 0.5;
          _limbOrderIds[4] = 4;
          _limbDepths[4] = (S.R_elbow.camDepth + S.R_hand.camDepth) * 0.5;
          _limbOrderIds[5] = 5;
          _limbDepths[5] = S.head.camDepth + 0.04;

          let handBallX = 0,
            handBallY = 0,
            handBallZ = 0;
          if (hasBallNow && !state.ball.inFlight && !state.ball.loose) {
            const dHand = (p.dribbleHand || 1) >= 0 ? 1 : -1;
            if (state.ball.gatherTimer > 0) {
              handBallX = (rw.L_hand.x + rw.R_hand.x) * 0.5;
              handBallY = (rw.L_hand.y + rw.R_hand.y) * 0.5;
              handBallZ = (rw.L_hand.z + rw.R_hand.z) * 0.5 - 0.04 * visScale;
            } else {
              const hRef = dHand > 0 ? rw.R_hand : rw.L_hand;
              handBallX = hRef.x;
              handBallY = hRef.y;
              handBallZ = clamp(state.ball.z * visScale, 0.16, Math.max(0.22, hRef.z - 0.11 * visScale));
            }
            _limbOrderIds[6] = 6;
            _limbDepths[6] = p2s(handBallX, handBallY, handBallZ, _ballProjScratch).camDepth;
            limbCount = 7;
          }

          for (let i = 1; i < limbCount; i++) {
            const curId = _limbOrderIds[i];
            const curD = _limbDepths[curId];
            let j = i - 1;
            while (j >= 0 && _limbDepths[_limbOrderIds[j]] > curD) {
              _limbOrderIds[j + 1] = _limbOrderIds[j];
              j--;
            }
            _limbOrderIds[j + 1] = curId;
          }

          for (let i = 0; i < limbCount; i++) {
            const lid = _limbOrderIds[i];
            if (lid === 0) drawLeg(false);
            else if (lid === 1) drawLeg(true);
            else if (lid === 2) drawTorsoAndShorts();
            else if (lid === 3) drawArm(false);
            else if (lid === 4) drawArm(true);
            else if (lid === 5) drawHeadAndHair();
            else {
              let ballOpts = fpsOpts;
              if (fpsOpts && fpsOpts.fp) {
                _heldBallFpsOpts.fp = fpsOpts.fp;
                _heldBallFpsOpts.centerCamZ = fpsOpts.centerCamZ !== undefined ? fpsOpts.centerCamZ : 1.0;
                _heldBallFpsOpts.rawMidZ = fpsOpts.rawMidZ !== undefined ? fpsOpts.rawMidZ : _heldBallFpsOpts.centerCamZ;
                _heldBallFpsOpts.maxBallR = headRxOut * 0.9;
                ballOpts = _heldBallFpsOpts;
              }
              drawBasketballVolumetric3D(ctx, p2s, sxR, syR, handBallX, handBallY, handBallZ, true, ballOpts);
            }
          }

          // Overhead Ball-Handler Pointer (🏀▾) on Non-YOU Ball-Handlers
          let extraTopOffset = 0;
          if (hasBallNow && !isMe) {
            const bob = Math.sin(state.simTime * 9.0) * 2.2;
            const ptrX = S.head.x;
            const tipY = S.headTop.y - Math.max(5, mPx * 0.1) + bob;
            ctx.fillStyle = "#fb923c";
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(ptrX, tipY);
            ctx.lineTo(ptrX - 5.5, tipY - 7.5);
            ctx.lineTo(ptrX + 5.5, tipY - 7.5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(ptrX, tipY - 13.5, 5.2, 0, Math.PI * 2);
            ctx.fillStyle = "#f97316";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.4;
            ctx.stroke();
            extraTopOffset = 20;
          }

          ctx.restore();
          const ankleScreenY = Math.max(S.L_ankle.y, S.R_ankle.y);
          const headHeightPx = headRyOut * 2.0;
          const totalHeightPx = Math.max(1.0, ankleScreenY - S.headTop.y);
          return {
            projX: floorProj.x,
            headTopScreenY: S.headTop.y - Math.max(6, mPx * 0.14) - extraTopOffset,
            eyeScreenY: S.head.y,
            ankleScreenY,
            pixelHeight: totalHeightPx,
            mPx,
            headRx: headRxOut,
            headRy: headRyOut,
            headHeightPx,
            headToBodyRatio: headHeightPx / totalHeightPx,
            neckVisiblePx: Math.max(0, S.shoulderCenter.y - (S.head.y + headRyOut)),
          };
        }

        /* =====================================================================
         * 10b. Kid Eye-Level First-Person (👀 FPS) 3D Pinhole Engine & Viewmodel
         * ===================================================================== */
        function createFirstPersonProjector(W, H) {
          const wSafe = Math.max(1, W || REF_W);
          const hSafe = Math.max(1, H || REF_H);
          const Z_NEAR = 0.2;
          const eyeX = Number.isFinite(state.cam.fpsEyeX) ? state.cam.fpsEyeX : 0.0;
          const eyeY = Number.isFinite(state.cam.fpsEyeY) ? state.cam.fpsEyeY : 8.0;
          const eyeZ = Number.isFinite(state.cam.fpsEyeZ) ? state.cam.fpsEyeZ : 1.16;
          const yaw = Number.isFinite(state.cam.fpsYaw) ? state.cam.fpsYaw : -Math.PI * 0.5;
          const pitch = Number.isFinite(state.cam.fpsPitch) ? state.cam.fpsPitch : 0.0;
          const roll = Number.isFinite(state.cam.fpsRoll) ? state.cam.fpsRoll : 0.0;

          const cosY = Math.cos(yaw);
          const sinY = Math.sin(yaw);
          const cosP = Math.cos(pitch);
          const sinP = Math.sin(pitch);
          const cosR = Math.cos(roll);
          const sinR = Math.sin(roll);
          const zoomClamp = clamp(state.cam.userZoom || 1.0, 0.8, 1.4);
          // Hor+ FOV: guarantees >= 32.5 deg vertical half-FOV (~65 deg vertical) & >= 43 deg horizontal half-FOV
          const focal = Math.min((wSafe * 0.5) / TAN_43_DEG, (hSafe * 0.5) / TAN_32_5_DEG) * zoomClamp;
          const cx = wSafe * 0.5;
          const cy = hSafe * 0.5;
          const tanHalfHFov = (wSafe * 0.5) / Math.max(1, focal);
          const tanHalfVFov = (hSafe * 0.5) / Math.max(1, focal);

          const _cAirScratch = { x: 0, y: 0, z: 1 };
          const _cFloorScratch = { x: 0, y: 0, z: 1 };
          const _segClipA = { x: 0, y: 0, z: 1 };
          const _segClipB = { x: 0, y: 0, z: 1 };

          function worldToCam(wx, wy, wz, out) {
            const dx = wx - eyeX;
            const dy = wy - eyeY;
            const dz = wz - eyeZ;
            const xH = -dx * sinY + dy * cosY;
            const zH = dx * cosY + dy * sinY;
            const yP = dz * cosP - zH * sinP;
            const zP = zH * cosP + dz * sinP;
            const cxOut = xH * cosR - yP * sinR;
            const cyOut = xH * sinR + yP * cosR;
            if (out) {
              out.x = cxOut;
              out.y = cyOut;
              out.z = zP;
              return out;
            }
            return { x: cxOut, y: cyOut, z: zP };
          }

          function camToScreen(c, out) {
            const zSafe = Math.max(Z_NEAR, c.z);
            const invZ = focal / zSafe;
            const sx = clamp(cx + c.x * invZ, -32000, 32000);
            const sy = clamp(cy - c.y * invZ, -32000, 32000);
            if (out) {
              out.x = sx;
              out.y = sy;
              out.z = c.z;
              out.scale = invZ;
              return out;
            }
            return { x: sx, y: sy, z: c.z, scale: invZ };
          }

          function projectWorld(wx, wy, wz, out) {
            const cAir = worldToCam(wx, wy, wz, _cAirScratch);
            const cFloor = worldToCam(wx, wy, 0, _cFloorScratch);
            const zAirSafe = Math.max(0.26, cAir.z);
            const zFloorSafe = Math.max(0.26, cFloor.z);
            const sx = clamp(cx + (cAir.x / zAirSafe) * focal, -32000, 32000);
            const sy = clamp(cy - (cAir.y / zAirSafe) * focal, -32000, 32000);
            const sFloorY = clamp(cy - (cFloor.y / zFloorSafe) * focal, -32000, 32000);
            const sVal = clamp(1.0 / Math.max(0.35, cAir.z), 0.08, 3.2);
            const vis = cAir.z >= Z_NEAR;
            if (out) {
              out.x = sx;
              out.y = sy;
              out.floorY = sFloorY;
              out.s = sVal;
              out.camDepth = -cAir.z;
              out.camZ = cAir.z;
              out.visible = vis;
              return out;
            }
            return {
              x: sx,
              y: sy,
              floorY: sFloorY,
              s: sVal,
              camDepth: -cAir.z,
              camZ: cAir.z,
              visible: vis,
            };
          }

          // Floor-Ray-Locked & Near-Depth-Stabilized Player Projector (0.00px foot-to-floor separation + 5.2-head close-up stability!)
          function makePlayerProjector(px, py) {
            const cMid = worldToCam(px, py, 0.65);
            const cAnchor = worldToCam(px, py, 0);
            const effCamZ = Math.max(0.98, cMid.z);
            const zAnchorSafe = Math.max(0.26, cAnchor.z);
            const anchorScreenX = clamp(cx + (cAnchor.x / zAnchorSafe) * focal, -32000, 32000);
            const anchorScreenY = clamp(cy - (cAnchor.y / zAnchorSafe) * focal, -32000, 32000);

            return {
              effCamZ,
              rawMidZ: cMid.z,
              p2s: (wx, wy, wz, out) => {
                const cAir = worldToCam(wx, wy, wz, _cAirScratch);
                const cFloor = worldToCam(wx, wy, 0, _cFloorScratch);
                const zAir = Math.max(0.88, effCamZ + (cAir.z - cMid.z) * 0.35);
                const zFloor = Math.max(0.88, effCamZ + (cFloor.z - cMid.z) * 0.35);
                const invAir = focal / zAir;
                const invFloor = focal / zFloor;
                const sx = clamp(anchorScreenX + (cAir.x - cAnchor.x) * invAir, -32000, 32000);
                const sy = clamp(anchorScreenY - (cAir.y - cAnchor.y) * invAir, -32000, 32000);
                const sFloorY = clamp(anchorScreenY - (cFloor.y - cAnchor.y) * invFloor, -32000, 32000);
                const sVal = clamp(1.0 / zAir, 0.08, 1.25);
                const vis = cAir.z >= Z_NEAR || cAnchor.z >= Z_NEAR;
                if (out) {
                  out.x = sx;
                  out.y = sy;
                  out.floorY = sFloorY;
                  out.s = sVal;
                  out.camDepth = -cAir.z;
                  out.camZ = zAir;
                  out.visible = vis;
                  return out;
                }
                return {
                  x: sx,
                  y: sy,
                  floorY: sFloorY,
                  s: sVal,
                  camDepth: -cAir.z,
                  camZ: zAir,
                  visible: vis,
                };
              },
            };
          }

          function clipSegmentNear3D(c0, c1, outPair) {
            if (c0.z < Z_NEAR && c1.z < Z_NEAR) return null;
            let ax = c0.x,
              ay = c0.y,
              az = c0.z;
            let bx = c1.x,
              by = c1.y,
              bz = c1.z;
            const denom = bz - az;
            if (az < Z_NEAR && Math.abs(denom) > 1e-6) {
              const t = (Z_NEAR - az) / denom;
              ax = ax + (bx - ax) * t;
              ay = ay + (by - ay) * t;
              az = Z_NEAR;
            } else if (bz < Z_NEAR && Math.abs(denom) > 1e-6) {
              const t = (Z_NEAR - az) / denom;
              bx = ax + (bx - ax) * t;
              by = ay + (by - ay) * t;
              bz = Z_NEAR;
            }
            _segClipA.x = ax;
            _segClipA.y = ay;
            _segClipA.z = az;
            _segClipB.x = bx;
            _segClipB.y = by;
            _segClipB.z = bz;
            if (outPair) {
              camToScreen(_segClipA, outPair[0]);
              camToScreen(_segClipB, outPair[1]);
              return outPair;
            }
            return [camToScreen(_segClipA), camToScreen(_segClipB)];
          }

          function clipPolygonNear3D(camPts) {
            const n = camPts ? camPts.length : 0;
            if (n < 3) return null;
            const out = [];
            for (let i = 0; i < n; i++) {
              const cur = camPts[i];
              const prev = camPts[(i + n - 1) % n];
              const curIn = cur.z >= Z_NEAR;
              const prevIn = prev.z >= Z_NEAR;
              if (curIn !== prevIn) {
                const dzSeg = cur.z - prev.z;
                if (Math.abs(dzSeg) > 1e-6) {
                  const t = (Z_NEAR - prev.z) / dzSeg;
                  out.push({
                    x: prev.x + (cur.x - prev.x) * t,
                    y: prev.y + (cur.y - prev.y) * t,
                    z: Z_NEAR,
                  });
                }
              }
              if (curIn) out.push(cur);
            }
            if (out.length < 3) return null;
            const scr = new Array(out.length);
            for (let i = 0; i < out.length; i++) {
              scr[i] = camToScreen(out[i]);
            }
            return scr;
          }

          const horizonScreenY = clamp(cy + Math.tan(clamp(pitch, -1.25, 1.25)) * focal, -hSafe * 0.8, hSafe * 1.4);

          return {
            W: wSafe,
            H: hSafe,
            Z_NEAR,
            eyeX,
            eyeY,
            eyeZ,
            yaw,
            pitch,
            roll,
            cosY,
            sinY,
            focal,
            tanHalfHFov,
            tanHalfVFov,
            cx,
            cy,
            horizonScreenY,
            worldToCam,
            camToScreen,
            projectWorld,
            makePlayerProjector,
            clipSegmentNear3D,
            clipPolygonNear3D,
          };
        }

        const _fpHoopC0 = { x: 0, y: 0, z: 1 };
        const _fpHoopC1 = { x: 0, y: 0, z: 1 };
        const _fpHoopSeg = [
          { x: 0, y: 0, z: 1, scale: 1 },
          { x: 0, y: 0, z: 1, scale: 1 },
        ];
        const _fpQuadCam = [
          { x: 0, y: 0, z: 1 },
          { x: 0, y: 0, z: 1 },
          { x: 0, y: 0, z: 1 },
          { x: 0, y: 0, z: 1 },
        ];

        function drawFirstPersonHoop3D(ctx, hoopSign, fp) {
          const isNorth = hoopSign >= 0;
          const baseY = isNorth ? 0.24 : COURT.fullLength - 0.24;
          const boomY0 = isNorth ? 0.28 : COURT.fullLength - 0.28;
          const boomY1 = isNorth ? 1.06 : COURT.fullLength - 1.06;
          const boardFrontY = isNorth ? COURT.backboardY : COURT.southBackboardY;
          const rimY = isNorth ? COURT.rimY : COURT.southRimY;
          const padCol = isNorth ? "#1d4ed8" : "#b91c1c";
          const hw = COURT.backboardHalfW;

          const addClippedSegToPath = (x0, y0, z0, x1, y1, z1) => {
            const seg = fp.clipSegmentNear3D(fp.worldToCam(x0, y0, z0, _fpHoopC0), fp.worldToCam(x1, y1, z1, _fpHoopC1), _fpHoopSeg);
            if (!seg) return false;
            ctx.moveTo(seg[0].x, seg[0].y);
            ctx.lineTo(seg[1].x, seg[1].y);
            return true;
          };

          const strokeSingleSeg3D = (x0, y0, z0, x1, y1, z1, col, lw) => {
            ctx.strokeStyle = col;
            ctx.lineWidth = lw;
            ctx.beginPath();
            if (addClippedSegToPath(x0, y0, z0, x1, y1, z1)) ctx.stroke();
          };

          const drawWorldQuad4 = (x0, y0, z0, x1, y1, z1, x2, y2, z2, x3, y3, z3, fill, stroke, lw) => {
            fp.worldToCam(x0, y0, z0, _fpQuadCam[0]);
            fp.worldToCam(x1, y1, z1, _fpQuadCam[1]);
            fp.worldToCam(x2, y2, z2, _fpQuadCam[2]);
            fp.worldToCam(x3, y3, z3, _fpQuadCam[3]);
            const poly = fp.clipPolygonNear3D(_fpQuadCam);
            if (!poly) return;
            ctx.beginPath();
            for (let i = 0; i < poly.length; i++) {
              if (i === 0) ctx.moveTo(poly[i].x, poly[i].y);
              else ctx.lineTo(poly[i].x, poly[i].y);
            }
            ctx.closePath();
            if (fill) {
              ctx.fillStyle = fill;
              ctx.fill();
            }
            if (stroke) {
              ctx.strokeStyle = stroke;
              ctx.lineWidth = lw || 2.0;
              ctx.stroke();
            }
          };

          ctx.save();
          ctx.lineCap = "round";

          // 1. Padded Stanchion Post & Support Boom
          const postCam = fp.worldToCam(0, baseY, 1.0, _fpHoopC0);
          const postLw = clamp((fp.focal / Math.max(0.8, postCam.z)) * 0.24, 3.0, 26.0);
          strokeSingleSeg3D(0, baseY, 0.0, 0, baseY, 1.55, "#0b1120", postLw + 2.5);
          strokeSingleSeg3D(0, baseY, 0.0, 0, baseY, 1.55, padCol, postLw);
          const boomLw = clamp((fp.focal / Math.max(0.8, postCam.z)) * 0.11, 2.2, 14.0);
          strokeSingleSeg3D(0, boomY0, 1.45, 0, boomY1, 3.22, "#0b1120", boomLw + 2.0);
          strokeSingleSeg3D(0, boomY0, 1.45, 0, boomY1, 3.22, "#94a3b8", boomLw);

          // 2. Tempered Glass Backboard + Red Shooter's Square
          drawWorldQuad4(
            -hw,
            boardFrontY,
            3.98,
            hw,
            boardFrontY,
            3.98,
            hw,
            boardFrontY,
            2.9,
            -hw,
            boardFrontY,
            2.9,
            "rgba(226, 232, 240, 0.84)",
            "#ffffff",
            2.6
          );
          drawWorldQuad4(
            -0.3,
            boardFrontY,
            3.52,
            0.3,
            boardFrontY,
            3.52,
            0.3,
            boardFrontY,
            3.06,
            -0.3,
            boardFrontY,
            3.06,
            null,
            isNorth ? "#ef4444" : "#f97316",
            2.2
          );

          // 3. Orange Rim Bracket, Batched Swaying Nylon Net & Batched 20-Seg Steel Rim!
          const rimCam = fp.worldToCam(0, rimY, COURT.rimZ, _fpHoopC0);
          const rimLw = clamp((fp.focal / Math.max(0.5, rimCam.z)) * 0.032, 2.2, 7.5);
          strokeSingleSeg3D(0, boardFrontY, COURT.rimZ, 0, rimY - (isNorth ? 0.22 : -0.22), COURT.rimZ, "#c2410c", rimLw + 1.5);

          const swish = state.fx.netSwishTimer > 0 && state.fx.netSwishHoop === hoopSign ? state.fx.netSwishTimer : 0;
          const swishWave = swish > 0 ? Math.sin(state.simTime * 30.0) * 0.07 * swish : 0;
          const botR = COURT.rimRadius * (0.64 + swish * 0.14);
          ctx.strokeStyle = "rgba(248, 250, 252, 0.88)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const i2 = i * 2;
            const topX = UNIT_CIRCLE_20.cos[i2] * COURT.rimRadius;
            const topY = rimY + UNIT_CIRCLE_20.sin[i2] * COURT.rimRadius;
            const botX = UNIT_CIRCLE_20.cos[i2 + 1] * botR + swishWave;
            const botY = rimY + UNIT_CIRCLE_20.sin[i2 + 1] * botR;
            addClippedSegToPath(topX, topY, COURT.rimZ, botX, botY, COURT.rimZ - 0.43);
          }
          ctx.stroke();

          const midR = COURT.rimRadius * 0.78;
          ctx.strokeStyle = "rgba(226, 232, 240, 0.78)";
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            addClippedSegToPath(
              UNIT_CIRCLE_10.cos[i] * midR + swishWave * 0.5,
              rimY + UNIT_CIRCLE_10.sin[i] * midR,
              COURT.rimZ - 0.22,
              UNIT_CIRCLE_10.cos[i + 1] * midR + swishWave * 0.5,
              rimY + UNIT_CIRCLE_10.sin[i + 1] * midR,
              COURT.rimZ - 0.22
            );
          }
          ctx.stroke();

          ctx.strokeStyle = "#ea580c";
          ctx.lineWidth = rimLw;
          ctx.beginPath();
          for (let i = 0; i < 20; i++) {
            addClippedSegToPath(
              UNIT_CIRCLE_20.cos[i] * COURT.rimRadius,
              rimY + UNIT_CIRCLE_20.sin[i] * COURT.rimRadius,
              COURT.rimZ,
              UNIT_CIRCLE_20.cos[i + 1] * COURT.rimRadius,
              rimY + UNIT_CIRCLE_20.sin[i + 1] * COURT.rimRadius,
              COURT.rimZ
            );
          }
          ctx.stroke();
          ctx.restore();
        }

        const _VM_FINGER_ANGLES = [-0.42, -0.15, 0.1, 0.34];
        const _VM_THUMB_COS = Math.cos(0.92);
        const _VM_THUMB_SIN = Math.sin(0.92);

        /* Expressive First-Person Kid Hands, Forearms, Sweatbands & Spinning 3D Basketball Viewmodel */
        function drawFirstPersonViewmodel(ctx, W, H) {
          const me = getControlledPlayer();
          if (!me) return;

          const userDefNow = isUserOnDefenseNow();
          const iHaveBall =
            !userDefNow && !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
          const skinMain = me.skinMid || "#f1ba80";
          const skinHi = me.skinLight || "#fbd3a7";
          const trimCol = "#facc15";
          const jerseyBand = !state.fullCourt && state.role === "defense" ? "#dc2626" : "#2563eb";
          const spd = hypot2(me.vx || 0, me.vy || 0);
          const ph = me.stridePhase || 0;
          const swayX = Math.cos(ph) * clamp(spd * 1.4, 0, 7.5);
          const swayY = Math.abs(Math.sin(ph)) * clamp(spd * 1.2, 0, 6.5) + Math.sin(state.simTime * 3.0) * 1.6;
          const unit = Math.min(W, H);
          const hasNativeQuad = typeof ctx.quadraticCurveTo === "function";

          const quadTo = (ax, ay, qx, qy, bx, by) => {
            if (hasNativeQuad) {
              ctx.quadraticCurveTo(qx, qy, bx, by);
            } else {
              for (let s = 1; s <= 6; s++) {
                const t = s / 6;
                const omt = 1 - t;
                ctx.lineTo(omt * omt * ax + 2 * omt * t * qx + t * t * bx, omt * omt * ay + 2 * omt * t * qy + t * t * by);
              }
            }
          };

          // Tactile Screen Edge Vignette: Gold Box-Out Seal Priority -> Sky Wall-Up -> Orange Body Contact!
          const cStrength = clamp((me.contactTimer || 0) / 0.26, 0, 1);
          if ((me.boxOutTimer || 0) > 0) {
            ctx.save();
            ctx.strokeStyle = "rgba(250, 204, 21, 0.46)";
            ctx.lineWidth = 7.5;
            ctx.strokeRect(2, 2, W - 4, H - 4);
            ctx.restore();
          } else if ((me.wallUpTimer || 0) > 0) {
            ctx.save();
            ctx.strokeStyle = "rgba(56, 189, 248, 0.42)";
            ctx.lineWidth = 6.5;
            ctx.strokeRect(2, 2, W - 4, H - 4);
            ctx.restore();
          } else if (cStrength > 0.05) {
            ctx.save();
            ctx.strokeStyle = "rgba(251, 146, 60, " + (0.42 * cStrength).toFixed(2) + ")";
            ctx.lineWidth = 10 * cStrength + 3;
            ctx.strokeRect(2, 2, W - 4, H - 4);
            ctx.restore();
          }

          const drawVMForearmAndHand = (rootX, rootY, elbowX, elbowY, handX, handY, sideSign, handMode) => {
            const rUpper = clamp(unit * 0.047, 15, 27);
            const rWrist = clamp(unit * 0.035, 11, 20);
            const wristX = lerp(elbowX, handX, 0.88);
            const wristY = lerp(elbowY, handY, 0.88);

            const dx0 = elbowX - rootX;
            const dy0 = elbowY - rootY;
            const inv0 = 1.0 / Math.max(1.0, Math.hypot(dx0, dy0));
            const n0x = -dy0 * inv0;
            const n0y = dx0 * inv0;

            const dxM = wristX - rootX;
            const dyM = wristY - rootY;
            const invM = 1.0 / Math.max(1.0, Math.hypot(dxM, dyM));
            const nMx = -dyM * invM;
            const nMy = dxM * invM;

            const dx1 = handX - elbowX;
            const dy1 = handY - elbowY;
            const inv1 = 1.0 / Math.max(1.0, Math.hypot(dx1, dy1));
            const n1x = -dy1 * inv1;
            const n1y = dx1 * inv1;
            const ang = Math.atan2(dy1, dx1);

            // 1) Articulated Cartoon Palm + 5 Warm Fanned Fingers
            ctx.save();
            ctx.translate(handX, handY);
            ctx.rotate(ang);

            const palmR = rWrist * 1.12;
            const fingerScale = handMode === "gooseneck" ? 0.84 : 1.0;
            const fingerPitch = handMode === "gooseneck" ? 0.52 : handMode === "dribble" ? 0.2 : 0.0;
            const drawSoftFinger = (x0, y0, x1, y1, rBase, rTip) => {
              const fdx = x1 - x0;
              const fdy = y1 - y0;
              const invF = 1.0 / Math.max(0.8, Math.hypot(fdx, fdy));
              const fnx = -fdy * invF;
              const fny = fdx * invF;
              const fang = Math.atan2(fdy, fdx);
              ctx.beginPath();
              ctx.arc(x0, y0, rBase, fang + Math.PI * 0.5, fang - Math.PI * 0.5, false);
              ctx.arc(x1, y1, rTip, fang - Math.PI * 0.5, fang + Math.PI * 0.5, false);
              ctx.closePath();
              ctx.fillStyle = skinMain;
              ctx.fill();
              ctx.strokeStyle = "#1e293b";
              ctx.lineWidth = 1.45;
              ctx.stroke();

              ctx.strokeStyle = "rgba(255, 243, 226, 0.55)";
              ctx.lineWidth = Math.max(1.1, rTip * 0.55);
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(x0 + fnx * rBase * 0.2, y0 + fny * rBase * 0.2);
              ctx.lineTo(x1 + fnx * rTip * 0.2, y1 + fny * rTip * 0.2);
              ctx.stroke();
            };

            for (let f = 0; f < 4; f++) {
              const baseA = _VM_FINGER_ANGLES[f];
              const fa = baseA + fingerPitch * 0.35;
              const fLen = palmR * (f === 1 || f === 2 ? 1.46 : 1.3) * fingerScale;
              const fx = Math.cos(fa) * fLen;
              const fy = Math.sin(fa) * fLen + (handMode === "gooseneck" ? palmR * 0.42 : 0);
              drawSoftFinger(palmR * 0.24, baseA * palmR * 0.52, fx, fy, palmR * 0.27, palmR * 0.2);
            }
            drawSoftFinger(
              0,
              -sideSign * palmR * 0.42,
              _VM_THUMB_COS * palmR * 1.12,
              -sideSign * _VM_THUMB_SIN * palmR * 1.12,
              palmR * 0.29,
              palmR * 0.21
            );

            ctx.beginPath();
            ctx.ellipse(0, 0, palmR * 1.04, palmR * 0.9, 0, 0, Math.PI * 2);
            ctx.fillStyle = handMode === "pass" ? skinHi : skinMain;
            ctx.fill();
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 1.9;
            ctx.stroke();

            ctx.fillStyle = "rgba(255, 243, 226, 0.52)";
            ctx.beginPath();
            ctx.ellipse(palmR * 0.14, -sideSign * palmR * 0.16, palmR * 0.48, palmR * 0.34, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 2) Continuous Single-Silhouette Forearm via Native quadraticCurveTo!
            const rRoot = rUpper * 1.1;
            const rMid = rUpper * 0.96;
            const l0x = rootX + n0x * rRoot,
              l0y = rootY + n0y * rRoot;
            const lMx = elbowX + nMx * rMid,
              lMy = elbowY + nMy * rMid;
            const l1x = wristX + n1x * rWrist,
              l1y = wristY + n1y * rWrist;
            const r1x = wristX - n1x * rWrist,
              r1y = wristY - n1y * rWrist;
            const rMx = elbowX - nMx * rMid,
              rMy = elbowY - nMy * rMid;
            const r0x = rootX - n0x * rRoot,
              r0y = rootY - n0y * rRoot;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(l0x, l0y);
            quadTo(l0x, l0y, lMx, lMy, l1x, l1y);
            ctx.lineTo(r1x, r1y);
            quadTo(r1x, r1y, rMx, rMy, r0x, r0y);
            ctx.closePath();

            ctx.strokeStyle = "rgba(255, 255, 255, 0.26)";
            ctx.lineWidth = 3.6;
            ctx.stroke();
            ctx.fillStyle = skinMain;
            ctx.fill();
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2.1;
            ctx.stroke();

            const litSign = nMx * -sideSign >= 0 ? 1 : -1;
            const h0x = lerp(rootX, elbowX, 0.12) + n0x * litSign * rRoot * 0.3;
            const h0y = lerp(rootY, elbowY, 0.12) + n0y * litSign * rRoot * 0.3;
            const hMx = elbowX + nMx * litSign * rMid * 0.3;
            const hMy = elbowY + nMy * litSign * rMid * 0.3;
            const h1x = lerp(elbowX, wristX, 0.8) + n1x * litSign * rWrist * 0.28;
            const h1y = lerp(elbowY, wristY, 0.8) + n1y * litSign * rWrist * 0.28;
            ctx.strokeStyle = "rgba(255, 242, 224, 0.56)";
            ctx.lineWidth = Math.max(3.0, rWrist * 0.52);
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(h0x, h0y);
