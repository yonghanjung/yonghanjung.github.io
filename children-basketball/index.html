        /* Instant Defender / Loose-Ball Rebounder Switch (E Key): swaps slot 0 with nearest ally cleanly */
        function switchDefenderToBall() {
          if (state.inbound.active || state.playPhase === "match_over") return false;
          if (!state.fullCourt && state.appMode === "practice") return false;
          const isLoose = state.ball.loose;
          const dropSpot = isLoose ? computeLooseBallDropSpot(_scratchDrop) : null;
          if (state.fullCourt) {
            if (!isLoose && !isUserOnDefenseNow()) return false;
            const refX = isLoose ? dropSpot.x : state.ball.x;
            const refY = isLoose ? dropSpot.y : state.ball.y;
            let bestIdx = -1;
            let bestDist = 999;
            for (let i = 1; i < state.offense.length; i++) {
              const d = hypot2(state.offense[i].x - refX, state.offense[i].y - refY);
              if (d < bestDist) {
                bestDist = d;
                bestIdx = i;
              }
            }
            const dMe = hypot2(state.offense[0].x - refX, state.offense[0].y - refY);
            if (!isLoose && dMe < bestDist - 0.5) {
              // Already closest to ball: switch to Blue helper closest to South Hoop!
              let rimBest = 1;
              let rimDist = 999;
              for (let i = 1; i < state.offense.length; i++) {
                const dr = hypot2(state.offense[i].x - COURT.rimX, state.offense[i].y - COURT.southRimY);
                if (dr < rimDist) {
                  rimDist = dr;
                  rimBest = i;
                }
              }
              bestIdx = rimBest;
            } else if (isLoose && dMe <= bestDist + 0.25) {
              return false;
            }
            if (bestIdx <= 0 || bestIdx >= state.offense.length) return false;

            const tmpBlue = state.offense[0];
            tmpBlue.offBalanceTimer = 0;
            tmpBlue.reactionTimer = 0;
            state.offense[0] = state.offense[bestIdx];
            state.offense[bestIdx] = tmpBlue;
            state.offense[0].id = 0;
            state.offense[0].name = "YOU";
            state.offense[0].number = 7;
            state.offense[bestIdx].id = bestIdx;
            state.offense[bestIdx].name = "M" + bestIdx;
            state.offense[bestIdx].number = bestIdx;

            const tmpRed = state.defense[0];
            state.defense[0] = state.defense[bestIdx];
            state.defense[bestIdx] = tmpRed;
            state.defense[0].id = 0;
            state.defense[bestIdx].id = bestIdx;
            if (state.ball.holderTeam === "defense") {
              if (state.ball.holderIdx === 0) state.ball.holderIdx = bestIdx;
              else if (state.ball.holderIdx === bestIdx) state.ball.holderIdx = 0;
            }
            if (state.ball.inFlight && state.ball.passTeam === "defense") {
              if (state.ball.targetIdx === 0) state.ball.targetIdx = bestIdx;
              else if (state.ball.targetIdx === bestIdx) state.ball.targetIdx = 0;
            }
            if (state.defDrill.cutterIdx === 0) state.defDrill.cutterIdx = bestIdx;
            else if (state.defDrill.cutterIdx === bestIdx) state.defDrill.cutterIdx = 0;
            if (state.motion && state.motion.slotForPlayer) {
              const s0 = state.motion.slotForPlayer[0];
              state.motion.slotForPlayer[0] = state.motion.slotForPlayer[bestIdx];
              state.motion.slotForPlayer[bestIdx] = s0;
              if (state.motion.cutterIdx === 0) state.motion.cutterIdx = bestIdx;
              else if (state.motion.cutterIdx === bestIdx) state.motion.cutterIdx = 0;
            }

            spawnSparkles(state.offense[0].x, state.offense[0].y, "#facc15", 6);
            setCoachMessage("good", "🔄", "SWITCHED!", 0.8);
            return true;
          }

          if (state.role !== "defense") {
            if (isLoose && state.scenario === "match" && typeof _switchHalfCourtOffenseLooseBallRebounder === "function") {
              return _switchHalfCourtOffenseLooseBallRebounder();
            }
            return false;
          }
          let targetIdx = -1;
          if (isLoose) {
            let bestIdx = -1;
            let bestDist = 999;
            for (let i = 1; i < state.defense.length; i++) {
              const d = hypot2(state.defense[i].x - dropSpot.x, state.defense[i].y - dropSpot.y);
              if (d < bestDist) {
                bestDist = d;
                bestIdx = i;
              }
            }
            const dMe = hypot2(state.defense[0].x - dropSpot.x, state.defense[0].y - dropSpot.y);
            if (dMe <= bestDist + 0.25) return false;
            targetIdx = bestIdx;
          } else {
            const refX = state.ball.inFlight ? state.ball.toX : state.ball.x;
            const refY = state.ball.inFlight ? state.ball.toY : state.ball.y;
            let nearestIdx = 1;
            let nearestDist = 999;
            for (let i = 1; i < state.defense.length; i++) {
              const d = hypot2(state.defense[i].x - refX, state.defense[i].y - refY);
              if (d < nearestDist) {
                nearestDist = d;
                nearestIdx = i;
              }
            }
            const dMeBall = hypot2(state.defense[0].x - refX, state.defense[0].y - refY);
            if (dMeBall < nearestDist - 0.45) {
              // Already closest defender to the ball: switch to helper closest to rim!
              let bestIdx = 1;
              let bestRimDist = 99;
              for (let i = 1; i < state.defense.length; i++) {
                const d = hypot2(state.defense[i].x - COURT.rimX, state.defense[i].y - COURT.rimY);
                if (d < bestRimDist) {
                  bestRimDist = d;
                  bestIdx = i;
                }
              }
              targetIdx = bestIdx;
            } else {
              targetIdx = nearestIdx;
            }
          }
          if (targetIdx <= 0 || targetIdx >= state.defense.length) return false;

          const tmpDef = state.defense[0];
          tmpDef.offBalanceTimer = 0;
          tmpDef.reactionTimer = 0;
          state.defense[0] = state.defense[targetIdx];
          state.defense[targetIdx] = tmpDef;
          state.defense[0].id = 0;
          state.defense[0].name = "YOU";
          state.defense[0].number = 7;
          state.defense[targetIdx].id = targetIdx;
          state.defense[targetIdx].name = "D" + (targetIdx + 1);
          state.defense[targetIdx].number = targetIdx + 1;

          const tmpOff = state.offense[0];
          state.offense[0] = state.offense[targetIdx];
          state.offense[targetIdx] = tmpOff;
          state.offense[0].id = 0;
          state.offense[targetIdx].id = targetIdx;

          if (state.ball.holderIdx === 0) state.ball.holderIdx = targetIdx;
          else if (state.ball.holderIdx === targetIdx) state.ball.holderIdx = 0;

          if (state.ball.targetIdx === 0) state.ball.targetIdx = targetIdx;
          else if (state.ball.targetIdx === targetIdx) state.ball.targetIdx = 0;

          if (state.defDrill.cutterIdx === 0) state.defDrill.cutterIdx = targetIdx;
          else if (state.defDrill.cutterIdx === targetIdx) state.defDrill.cutterIdx = 0;

          spawnSparkles(state.defense[0].x, state.defense[0].y, "#facc15", 6);
          setCoachMessage("good", "🔄", "SWITCHED!", 0.8);
          return true;
        }

        /* =====================================================================
         * 5. Physics, Change of Pace Engine & User Movement
         * ===================================================================== */
        const _activePool = Array.from({ length: 10 }, () => ({
          p: null,
          isOff: false,
          idx: 0,
          isMe: false,
          invW: 1.0,
        }));
        const _scratchDrop = { x: 0, y: 0, floorX: 0, floorY: 0, tFloor: 0 };
        const _dustPool = [];
        const _sparklePool = [];
        const _popupPool = [];
        const _trailPool = [];

        function spawnDust(wx, wy, count) {
          const dusts = state.fx.dusts;
          for (let i = 0; i < count; i++) {
            if (dusts.length >= 36) break;
            const item = _dustPool.length > 0 ? _dustPool.pop() : {};
            item.x = wx + (Math.random() - 0.5) * 0.35;
            item.y = wy + (Math.random() - 0.5) * 0.22;
            item.z = 0.05 + Math.random() * 0.12;
            item.vx = (Math.random() - 0.5) * 0.8;
            item.vy = (Math.random() - 0.5) * 0.5;
            item.vz = 0.45 + Math.random() * 0.55;
            item.life = 0.42;
            item.maxLife = 0.42;
            dusts.push(item);
          }
        }

        function triggerDefenderOffBalance(defender, oldPlayerVx, oldPlayerVy, isCrossover, burstDirX, burstDirY) {
          const diff = getDiffProfile();
          const baseOffBal =
            state.difficulty === "easy"
              ? isCrossover
                ? 1.32
                : 1.25
              : state.difficulty === "medium"
                ? isCrossover
                  ? 1.02
                  : 0.95
                : isCrossover
                  ? 0.78
                  : 0.72;
          defender.reactionTimer = Math.max(diff.defReactDelay, state.difficulty === "easy" ? 0.38 : state.difficulty === "medium" ? 0.3 : 0.22);
          defender.offBalanceTimer = baseOffBal;

          const me = getControlledPlayer();
          const bx = burstDirX !== undefined ? burstDirX : 0;
          const by = burstDirY !== undefined ? burstDirY : -1;
          const bLen = Math.max(0.01, Math.sqrt(bx * bx + by * by));
          const ux = bx / bLen;
          const uy = by / bLen;
          const px = -uy;
          const py = ux;

          const slideScale = isCrossover ? 1.28 : 1.05;
          let candVx = (Math.abs(defender.vx) > 0.4 ? defender.vx : oldPlayerVx) * slideScale;
          let candVy = (Math.abs(defender.vy) > 0.4 ? defender.vy : oldPlayerVy) * slideScale;

          // If defender's momentum was aligned with user's new burst (e.g. In-and-Out Shift-Release-Shift!),
          // defender bites flat-footed on the hesitation check & stumbles off the driving lane!
          const alongBurst = candVx * ux + candVy * uy;
          if (alongBurst > 0.25 || candVx * candVx + candVy * candVy < 0.64) {
            const relLat = me ? (defender.x - me.x) * px + (defender.y - me.y) * py : 0.2;
            const latSign = relLat >= 0 ? 1 : -1;
            candVx = px * latSign * 2.55 - ux * 1.05;
            candVy = py * latSign * 2.55 - uy * 1.05;
          } else {
            candVx -= ux * 0.65;
            candVy -= uy * 0.65;
          }

          defender.inertiaVx = clamp(candVx, -4.6, 4.6);
          defender.inertiaVy = clamp(candVy, -4.6, 4.6);
          defender.paceAdapt = 0;
          spawnDust(defender.x, defender.y, 6);
          spawnSparkles(defender.x, defender.y, "#fb923c", 8);
        }

        function isOpponentTeamSide(isOffenseSide) {
          if (state.fullCourt) return !isOffenseSide;
          return state.role === "defense" ? !!isOffenseSide : !isOffenseSide;
        }

        function _tickRosterTimers(arr, offBalStep, dt) {
          for (let i = 0; i < arr.length; i++) {
            const p = arr[i];
            if (!p) continue;
            if (p.offBalanceTimer > 0) p.offBalanceTimer = Math.max(0, p.offBalanceTimer - offBalStep);
            if (p.reactionTimer > 0) p.reactionTimer = Math.max(0, p.reactionTimer - offBalStep);
            if (p.stealLungeTimer > 0) p.stealLungeTimer = Math.max(0, p.stealLungeTimer - offBalStep);
            if (p.contactTimer > 0) p.contactTimer = Math.max(0, p.contactTimer - dt);
            if (p.wallUpTimer > 0) p.wallUpTimer = Math.max(0, p.wallUpTimer - dt);
            if (p.boxOutTimer > 0) p.boxOutTimer = Math.max(0, p.boxOutTimer - dt);
            if (p.reboundAttemptTimer > 0) p.reboundAttemptTimer = Math.max(0, p.reboundAttemptTimer - dt);
            if (p.reboundReachTimer > 0) p.reboundReachTimer = Math.max(0, p.reboundReachTimer - dt);
            if (p.selfShotRebCooldown > 0) p.selfShotRebCooldown = Math.max(0, p.selfShotRebCooldown - dt);
          }
        }

        function tickAllPlayerTimers(dt) {
          if (dt <= 0) return;
          const realStep = state.speedScale > 0.01 ? dt / state.speedScale : dt;
          const userStep = Math.max(dt, realStep);
          const offIsOpp = isOpponentTeamSide(true);
          const defIsOpp = isOpponentTeamSide(false);
          _tickRosterTimers(state.offense, offIsOpp ? dt : userStep, dt);
          _tickRosterTimers(state.defense, defIsOpp ? dt : userStep, dt);
        }

        function getPlayerPhysicalWeight(p, isOffSide, isMe) {
          if (!p) return 1.0;
          if ((p.offBalanceTimer || 0) > 0) return 0.35;
          if ((p.boxOutTimer || 0) > 0) return isMe ? 2.05 : 1.85;
          const userDefNow = isUserOnDefenseNow();
          const isDefending = !state.fullCourt ? !isOffSide : userDefNow ? !!isOffSide : !isOffSide;
          const vx = p.vx || 0;
          const vy = p.vy || 0;
          if (isDefending && vx * vx + vy * vy < 16.0) return 1.48;
          if (isMe && !isDefending && state.rhythm.burstBoostTimer > 0) return 1.42;
          return 1.0;
        }

        /* 10-Player Capsule Collision, On-Ball Body-Up / Hip-Ride & Rebound Box-Out Solver */
        function resolvePlayerCollisionsAndJostling(dt) {
          if (dt <= 0) return;
          const courtLen = getCourtLength();
          const minX = -COURT.halfW + 0.45;
          const maxX = COURT.halfW - 0.45;
          const minY = 0.55;
          const maxY = courtLen - 0.55;

          const me = getControlledPlayer();
          const myIsOff = state.fullCourt ? true : state.role === "offense";
          const reboundActive = state.ball.loose || (state.ball.inFlight && state.ball.flightType === "shot");

          // 1) Rebound Box-Out Seal & Lateral Swim-Move Counter (Nearest-Opponent Matching!)
          if (reboundActive) {
            let rebX = state.ball.x;
            let rebY = state.ball.y;
            if (state.ball.loose) {
              const ds = computeLooseBallDropSpot(_scratchDrop);
              rebX = ds.x;
              rebY = ds.y;
            } else {
              const rm = getTeamTargetRim(state.ball.shooterTeam || "offense");
              rebX = rm.x;
              rebY = rm.y + rm.sign * 1.15;
            }

            if (me && (me.offBalanceTimer || 0) <= 0) {
              const dxMeR = me.x - rebX;
              const dyMeR = me.y - rebY;
              const dMeRebSq = dxMeR * dxMeR + dyMeR * dyMeR;
              if (dMeRebSq <= 31.36) {
                const dMeReb = Math.sqrt(dMeRebSq);
                const oppArr = myIsOff ? state.defense : state.offense;
                for (let i = 0; i < oppArr.length; i++) {
                  const opp = oppArr[i];
                  if (!opp || (opp.offBalanceTimer || 0) > 0) continue;
                  const dxMO = me.x - opp.x;
                  const dyMO = me.y - opp.y;
                  const dMeOppSq = dxMO * dxMO + dyMO * dyMO;
                  if (dMeOppSq >= 1.2544) continue;
                  const dOppReb = Math.sqrt((opp.x - rebX) * (opp.x - rebX) + (opp.y - rebY) * (opp.y - rebY));
                  if (dMeReb < dOppReb - 0.06) {
                    const dMeOpp = Math.sqrt(dMeOppSq);
                    me.boxOutTimer = Math.max(me.boxOutTimer || 0, 0.3);
                    const invOpp = 1.0 / Math.max(0.05, dOppReb);
                    const inX = (rebX - opp.x) * invOpp;
                    const inY = (rebY - opp.y) * invOpp;
                    const vIn = opp.vx * inX + opp.vy * inY;
                    if (vIn > 0) {
                      opp.vx -= inX * vIn * 0.84;
                      opp.vy -= inY * vIn * 0.84;
                    }
                    if (dMeOpp < 0.92) {
                      const pushBack = (0.92 - dMeOpp) * 0.65;
                      opp.x = clamp(opp.x - inX * pushBack, minX, maxX);
                      opp.y = clamp(opp.y - inY * pushBack, minY, maxY);
                    }
                    me.contactTimer = Math.max(me.contactTimer || 0, 0.22);
                    me.contactDirX = inX;
                    me.contactDirY = inY;
                    opp.contactTimer = Math.max(opp.contactTimer || 0, 0.22);
                    opp.contactDirX = -inX;
                    opp.contactDirY = -inY;
                    if (vIn > 0.35 || dMeOpp < 0.88) {
                      SoundEngine.playBodyBump(0.68);
                    }
                    if (state.simTime - state.lastBoxOutCalloutSim > 1.25) {
                      state.lastBoxOutCalloutSim = state.simTime;
                      setCoachMessage("good", "💪", "BOX OUT!", 0.95);
                    }
                  }
                }
              }
            }

            // AI Defenders Inside Box-Out Seal on Nearest Crashing Rebounder + Swim-Move Escape
            const shotTeam = state.ball.shooterTeam || "offense";
            const defGroup = shotTeam === "offense" ? state.defense : state.offense;
            const offGroup = shotTeam === "offense" ? state.offense : state.defense;
            const isEasyMode = state.difficulty === "easy";
            for (let i = 0; i < defGroup.length; i++) {
              const dP = defGroup[i];
              if (!dP || dP === me || (dP.offBalanceTimer || 0) > 0) continue;
              const dDefRSq = (dP.x - rebX) * (dP.x - rebX) + (dP.y - rebY) * (dP.y - rebY);
              if (dDefRSq > 25.0) continue;

              let nearOpp = null;
              let nearDistSq = 1.2544; // 1.12m^2
              for (let j = 0; j < offGroup.length; j++) {
                const cand = offGroup[j];
                if (!cand || (cand.offBalanceTimer || 0) > 0) continue;
                const dxDO = dP.x - cand.x;
                const dyDO = dP.y - cand.y;
                const dSq = dxDO * dxDO + dyDO * dyDO;
                if (dSq < nearDistSq) {
                  nearDistSq = dSq;
                  nearOpp = cand;
                }
              }
              if (!nearOpp) continue;

              const dDefR = Math.sqrt(dDefRSq);
              const dOffR = Math.sqrt((nearOpp.x - rebX) * (nearOpp.x - rebX) + (nearOpp.y - rebY) * (nearOpp.y - rebY));
              if (dDefR < dOffR - 0.08) {
                dP.boxOutTimer = Math.max(dP.boxOutTimer || 0, 0.26);
                const invO = 1.0 / Math.max(0.05, dOffR);
                const inX = (rebX - nearOpp.x) * invO;
                const inY = (rebY - nearOpp.y) * invO;
                const perpX = -inY;
                const perpY = inX;
                const vIn = nearOpp.vx * inX + nearOpp.vy * inY;
                const vTang = Math.abs(nearOpp.vx * perpX + nearOpp.vy * perpY);
                const vDefTang = Math.abs(dP.vx * perpX + dP.vy * perpY);
                const oppIsUser = nearOpp === me;
                const swimTriggered =
                  (vTang > 1.85 && vDefTang < 1.15) || (oppIsUser && (state.rhythm.crossoverTimer > 0 || state.rhythm.burstBoostTimer > 0));

                if (swimTriggered) {
                  dP.boxOutTimer = 0;
                  if (vIn > 0) {
                    nearOpp.vx -= inX * vIn * 0.22;
                    nearOpp.vy -= inY * vIn * 0.22;
                  }
                } else if (vIn > 0) {
                  const sealDamp = oppIsUser && isEasyMode ? 0.38 : 0.74;
                  nearOpp.vx -= inX * vIn * sealDamp;
                  nearOpp.vy -= inY * vIn * sealDamp;
                }
              }
            }
          }

          // 2) Active Court Roster into Static Zero-Alloc Pool (Exclude Out-of-Bounds Inbound Passer)
          let activeCount = 0;
          for (let i = 0; i < state.offense.length; i++) {
            if (state.inbound.active && state.inbound.team === "offense" && state.inbound.passerIdx === i) continue;
            const p = state.offense[i];
            if (!p) continue;
            const slot = _activePool[activeCount++];
            slot.p = p;
            slot.isOff = true;
            slot.idx = i;
            slot.isMe = p === me;
            slot.invW = 1.0 / getPlayerPhysicalWeight(p, true, slot.isMe);
          }
          for (let i = 0; i < state.defense.length; i++) {
            if (state.inbound.active && state.inbound.team === "defense" && state.inbound.passerIdx === i) continue;
            const p = state.defense[i];
            if (!p) continue;
            const slot = _activePool[activeCount++];
            slot.p = p;
            slot.isOff = false;
            slot.idx = i;
            slot.isMe = p === me;
            slot.invW = 1.0 / getPlayerPhysicalWeight(p, false, slot.isMe);
          }

          // 3) On-Ball Drive Chest Wall-Up (LGP 2-Axis) vs Frame-Independent Hip-Ride Slide!
          if (!state.ball.inFlight && !state.ball.loose && !state.inbound.active && state.playPhase === "live") {
            const bhIsOff = state.ball.holderTeam === "offense";
            const bhArr = bhIsOff ? state.offense : state.defense;
            const defArr = bhIsOff ? state.defense : state.offense;
            const bh = bhArr[state.ball.holderIdx];
            if (bh) {
              const bhSpdSq = bh.vx * bh.vx + bh.vy * bh.vy;
              if (bhSpdSq > 0.2025) {
                const bhSpd = Math.sqrt(bhSpdSq);
                const tRim = getTeamTargetRim(state.ball.holderTeam);
                const rx = tRim.x - bh.x;
                const ry = tRim.y - bh.y;
                const rLen = Math.max(0.05, Math.sqrt(rx * rx + ry * ry));
                const urx = rx / rLen;
                const ury = ry / rLen;

                for (let i = 0; i < defArr.length; i++) {
                  const def = defArr[i];
                  if (!def || (def.offBalanceTimer || 0) > 0) continue;
                  const dx = def.x - bh.x;
                  const dy = def.y - bh.y;
                  const dSq = dx * dx + dy * dy;
                  if (dSq > 1e-6 && dSq < 0.81) {
                    // d < 0.90m contact zone!
                    const d = Math.sqrt(dSq);
                    const nx = dx / d;
                    const ny = dy / d;
                    const vn = bh.vx * nx + bh.vy * ny;
                    const headOnDot = vn / bhSpd;
                    const lgpDot = nx * urx + ny * ury;
                    const bhIsUser = bh === me;
                    const defIsUser = def === me;
                    const bhHasBurst = bhIsUser && state.rhythm.burstBoostTimer > 0;

                    if (headOnDot > 0.65 && lgpDot > 0.72 && (!bhHasBurst || headOnDot > 0.84)) {
                      // Legal Guarding Position Chest Wall-Up!
                      const wallDamp = bhHasBurst ? 0.68 : 0.8;
                      if (vn > 0) {
                        bh.vx -= nx * vn * wallDamp;
                        bh.vy -= ny * vn * wallDamp;
                        const pushStep = Math.min(0.048, vn * dt * 0.34);
                        bh.x = clamp(bh.x - nx * pushStep, minX, maxX);
                        bh.y = clamp(bh.y - ny * pushStep, minY, maxY);
                      }
                      if (bhHasBurst) {
                        state.rhythm.burstBoostTimer = Math.max(0, state.rhythm.burstBoostTimer - 2.0 * dt);
                      }
                      bh.contactTimer = Math.max(bh.contactTimer || 0, 0.28);
                      bh.contactDirX = -nx;
                      bh.contactDirY = -ny;
                      def.contactTimer = Math.max(def.contactTimer || 0, 0.28);
                      def.wallUpTimer = Math.max(def.wallUpTimer || 0, 0.34);
                      def.contactDirX = nx;
                      def.contactDirY = ny;
                      if (SoundEngine.playBodyBump(clamp(vn * 0.28, 0.55, 1.15))) {
                        spawnDust((bh.x + def.x) * 0.5, (bh.y + def.y) * 0.5, 4);
                      }
                      if (defIsUser && state.simTime - state.lastWallUpCalloutSim > 1.15) {
                        state.lastWallUpCalloutSim = state.simTime;
                        setCoachMessage("good", "🧱", "WALL UP!", 0.95);
                      } else if (bhIsUser && state.scenario !== "tutorial") {
                        const pressRate = state.difficulty === "easy" ? 0.18 : 0.45;
                        state.dribblePressure.timer = Math.min(1.65, state.dribblePressure.timer + dt * pressRate);
                        if (state.simTime - state.lastWallUpCalloutSim > 1.45) {
                          state.lastWallUpCalloutSim = state.simTime;
                          setCoachMessage("warn", "🧱", "CHANGE PACE! ANGLE!", 0.9);
                        }
                      }
                    } else if ((headOnDot > 0.12 || lgpDot > 0.35) && vn > -0.15) {
                      // Angled Shoulder / Hip-Ride Slide (Frame-Rate-Independent dt & Tangential Speed Preserved!)
                      const dDefRim = Math.sqrt((tRim.x - def.x) * (tRim.x - def.x) + (tRim.y - def.y) * (tRim.y - def.y));
                      const lev = clamp((dDefRim - rLen + (bhHasBurst ? 0.35 : 0)) / 0.75, -1, 1);
                      if (vn > 0) {
                        const nDamp = lev > 0 ? 0.36 : 0.48;
                        bh.vx -= nx * vn * nDamp;
                        bh.vy -= ny * vn * nDamp;
                      }
                      const tx = -ny;
                      const ty = nx;
                      const tangKeep = Math.exp(-1.45 * (1.0 - 0.45 * Math.max(0, lev)) * dt);
                      const vBhN = bh.vx * nx + bh.vy * ny;
                      const vBhT = (bh.vx * tx + bh.vy * ty) * tangKeep;
                      bh.vx = nx * vBhN + tx * vBhT;
                      bh.vy = ny * vBhN + ty * vBhT;

                      const slideDisp = (1.35 + 0.65 * Math.max(0, lev)) * dt;
                      def.x = clamp(def.x + nx * slideDisp, minX, maxX);
                      def.y = clamp(def.y + ny * slideDisp, minY, maxY);

                      const vDefT = def.vx * tx + def.vy * ty;
                      const nextDefT = lerp(vDefT, vBhT * 0.82, clamp(9.5 * dt, 0, 1));
                      def.vx += tx * (nextDefT - vDefT);
                      def.vy += ty * (nextDefT - vDefT);

                      bh.contactTimer = Math.max(bh.contactTimer || 0, 0.22);
                      bh.contactDirX = -nx;
                      bh.contactDirY = -ny;
                      def.contactTimer = Math.max(def.contactTimer || 0, 0.22);
                      def.contactDirX = nx;
                      def.contactDirY = ny;
                      if (defIsUser && headOnDot > 0.35 && lgpDot > 0.55) {
                        def.wallUpTimer = Math.max(def.wallUpTimer || 0, 0.24);
                        if (state.simTime - state.lastWallUpCalloutSim > 1.35) {
                          state.lastWallUpCalloutSim = state.simTime;
                          setCoachMessage("good", "🧱", "WALL UP!", 0.85);
                        }
                      }
                      if (bhSpd > 2.85) {
                        SoundEngine.playBodyBump(0.52);
                      }
                    }
                  }
                }
              }
            }
          }

          // 4) 3-Iteration Pairwise Capsule Separation (distSq Early-Out: 96%+ Sqrt Eliminated!)
          for (let iter = 0; iter < 3; iter++) {
            for (let i = 0; i < activeCount; i++) {
              const A = _activePool[i];
              const pA = A.p;
              for (let j = i + 1; j < activeCount; j++) {
                const B = _activePool[j];
                const pB = B.p;
                const dx = pB.x - pA.x;
                const dy = pB.y - pA.y;
                const dSq = dx * dx + dy * dy;
                const eitherOffBal = (pA.offBalanceTimer || 0) > 0 || (pB.offBalanceTimer || 0) > 0;
                const minDistSq = eitherOffBal ? 0.2304 : 0.5184;
                if (dSq < minDistSq) {
                  const minDist = eitherOffBal ? 0.48 : 0.72;
                  let d = 0.0;
                  let nx = 1.0;
                  let ny = 0.0;
                  if (dSq > 1e-8) {
                    d = Math.sqrt(dSq);
                    nx = dx / d;
                    ny = dy / d;
                  } else {
                    const fallbackAng = i * 1.7 + j * 2.3;
                    nx = Math.cos(fallbackAng);
                    ny = Math.sin(fallbackAng);
                  }
                  const pen = minDist - d;
                  const invSum = A.invW + B.invW;
                  const shareA = A.invW / invSum;
                  const shareB = B.invW / invSum;

                  pA.x = clamp(pA.x - nx * pen * shareA, minX, maxX);
                  pA.y = clamp(pA.y - ny * pen * shareA, minY, maxY);
                  pB.x = clamp(pB.x + nx * pen * shareB, minX, maxX);
                  pB.y = clamp(pB.y + ny * pen * shareB, minY, maxY);

                  if (iter === 0 && !eitherOffBal && pen > 0.012) {
                    const relVn = (pA.vx - pB.vx) * nx + (pA.vy - pB.vy) * ny;
                    if (relVn > 0.32) {
                      pA.vx -= nx * relVn * shareA * 0.72;
                      pA.vy -= ny * relVn * shareA * 0.72;
                      pB.vx += nx * relVn * shareB * 0.72;
                      pB.vy += ny * relVn * shareB * 0.72;
                      pA.contactTimer = Math.max(pA.contactTimer || 0, 0.24);
                      pA.contactDirX = -nx;
                      pA.contactDirY = -ny;
                      pB.contactTimer = Math.max(pB.contactTimer || 0, 0.24);
                      pB.contactDirX = nx;
                      pB.contactDirY = ny;
                      if (relVn > 1.15) {
                        if (SoundEngine.playBodyBump(clamp(relVn * 0.25, 0.48, 1.1))) {
                          spawnDust((pA.x + pB.x) * 0.5, (pA.y + pB.y) * 0.5, 3);
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }

        function updatePlayerJumpAndPose(p, dt, isSprint, isHesi, isCross) {
          if (p.shootFollowTimer > 0) p.shootFollowTimer = Math.max(0, p.shootFollowTimer - dt);
          if (p.contestTimer > 0) p.contestTimer = Math.max(0, p.contestTimer - dt);
          if (p.passPoseTimer > 0) p.passPoseTimer = Math.max(0, p.passPoseTimer - dt);

          if (p.jumpZ > 0 || p.jumpVz > 0) {
            p.jumpZ += p.jumpVz * dt;
            p.jumpVz -= 11.5 * dt;
            if (p.jumpZ <= 0) {
              p.jumpZ = 0;
              p.jumpVz = 0;
            }
          }
          if (p.jumpZ <= 0.01 && p.shootFollowTimer <= 0) {
            p.layupMode = false;
          }

          const spdSq = p.vx * p.vx + p.vy * p.vy;
          if (p.jumpZ > 0.04) p.animState = "jump";
          else if (p.offBalanceTimer > 0) p.animState = "offbalance";
          else if (p.passPoseTimer > 0) p.animState = "pass";
          else if (isCross) p.animState = "crossover";
          else if (isHesi) p.animState = "hesitate";
          else if (isSprint && spdSq > 12.96) p.animState = "sprint";
          else if (spdSq > 0.1225) p.animState = "walk";
          else p.animState = "idle";
        }

        function updateAllPlayerFacings(dt) {
          const userDefNow = isUserOnDefenseNow();
          const reboundLive = state.ball.loose || (state.ball.inFlight && state.ball.flightType === "shot");
          const blendOff = dt <= 0 ? 1 : clamp(15.0 * dt, 0, 1);
          for (let i = 0; i < state.offense.length; i++) {
            const p = state.offense[i];
            const isMe = (state.fullCourt || state.role === "offense") && i === 0;
            const hasBall = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === i;
            const spdSq = p.vx * p.vx + p.vy * p.vy;
            let desired = p.gazeAngle;

            if (p.offBalanceTimer > 0) {
              const baseAng = Math.atan2(p.inertiaVy || 0.6, p.inertiaVx || 1.0);
              desired = wrapAngle(baseAng + 1.45 + Math.sin(state.simTime * 16 + i) * 0.4);
            } else if (p.passPoseTimer > 0) {
              desired = p.gazeAngle;
            } else if (p.shootFollowTimer > 0 || (hasBall && state.ball.gatherTimer > 0)) {
              desired = Math.atan2(COURT.rimY - p.y, COURT.rimX - p.x);
            } else if (reboundLive && (p.boxOutTimer || 0) > 0) {
              desired = Math.atan2(state.ball.y - p.y, state.ball.x - p.x);
            } else if (isMe && hasBall && state.rhythm.hesitationTimer > 0 && !keys.Shift && spdSq > 0.09) {
              // Retreat step-back hesitation keeps eyes & chest squared to rim!
              const rimAng = Math.atan2(COURT.rimY - p.y, COURT.rimX - p.x);
              desired = lerpAngle(rimAng, Math.atan2(p.vy, p.vx), 0.22);
            } else if (isMe && spdSq > 0.2025) {
              desired = Math.atan2(p.vy, p.vx);
            } else if (state.fullCourt && userDefNow) {
              desired = spdSq > 17.64 ? Math.atan2(p.vy, p.vx) : Math.atan2(state.ball.y - p.y, state.ball.x - p.x);
            } else if (spdSq > 0.2025) {
              desired = Math.atan2(p.vy, p.vx);
            } else if (hasBall) {
              if (state.passAssist.active && state.passAssist.mode === "triple_threat" && i === state.passAssist.partnerIdx) {
                desired = Math.atan2(state.offense[0].y - p.y, state.offense[0].x - p.x);
              } else {
                desired = Math.atan2(COURT.rimY - p.y, COURT.rimX - p.x);
              }
            } else {
              desired = Math.atan2(state.ball.y - p.y, state.ball.x - p.x);
            }
            p.facing = dt <= 0 ? desired : lerpAngle(p.facing, desired, blendOff);
          }

          const blendDef = dt <= 0 ? 1 : clamp(14.0 * dt, 0, 1);
          for (let i = 0; i < state.defense.length; i++) {

            const hasBall = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "defense" && state.ball.holderIdx === i;

        function updateUserPlayer(dt) {
          const me = getControlledPlayer();
          const r = state.rhythm;
          const courtLen = getCourtLength();
          const userDefNow = isUserOnDefenseNow();
          const isEasy = state.difficulty === "easy";

          if (state.stealCooldown > 0) state.stealCooldown = Math.max(0, state.stealCooldown - dt);
          if (r.copCooldown > 0) r.copCooldown = Math.max(0, r.copCooldown - dt);
          if (r.burstBoostTimer > 0) r.burstBoostTimer = Math.max(0, r.burstBoostTimer - dt);
          if (r.crossoverTimer > 0) r.crossoverTimer = Math.max(0, r.crossoverTimer - dt);
          if (r.hesitationTimer > 0) r.hesitationTimer = Math.max(0, r.hesitationTimer - dt);
          if (r.lateralSwitchWindow > 0) r.lateralSwitchWindow = Math.max(0, r.lateralSwitchWindow - dt);
          if (state.fx.dustEmitCooldown > 0) state.fx.dustEmitCooldown = Math.max(0, state.fx.dustEmitCooldown - dt);

          if (me.reactionTimer > 0) {
            me.x = clamp(me.x + me.inertiaVx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
            me.y = clamp(me.y + me.inertiaVy * dt, 0.55, courtLen - 0.55);
            updatePlayerJumpAndPose(me, dt, false, false, false);
            return;
          }

          const screenRight = (keys.D ? 1 : 0) - (keys.A ? 1 : 0);
          const screenUp = (keys.W ? 1 : 0) - (keys.S ? 1 : 0);
          const hasInput = screenRight !== 0 || screenUp !== 0;

          let ix = 0;
          let iy = 0;
          if (hasInput) {
            worldDirFromScreenInput(screenRight, screenUp, getActiveInputYaw(), _scratchDir);
            const len = Math.max(0.001, Math.sqrt(_scratchDir.x * _scratchDir.x + _scratchDir.y * _scratchDir.y));
            ix = _scratchDir.x / len;
            iy = _scratchDir.y / len;
          }

          const prevSpeedSq = me.vx * me.vx + me.vy * me.vy;
          const inputDt = state.speedScale > 0.01 ? dt / state.speedScale : dt;
          const iHaveBall =
            !userDefNow && !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;

          const toRimX = COURT.rimX - me.x;
          const toRimY = COURT.rimY - me.y;
          const toRimLen = Math.max(0.01, Math.sqrt(toRimX * toRimX + toRimY * toRimY));
          const retreatDot = hasInput ? (ix * toRimX + iy * toRimY) / toRimLen : 0;

          // Track Shift -> Release/Pause -> Shift Cadence Window + CoP Chain Tail!
          const minSprintForHesi = isEasy ? 0.065 : 0.095;
          if (!userDefNow && !keys.Shift) {
            if (r.sprintActiveTime >= minSprintForHesi || (r.burstBoostTimer > 0 && r.burstBoostTimer <= 0.28 && r.hesiReleaseWindow <= 0)) {

            }
          } else if (userDefNow) {
            r.sprintActiveTime = 0;
            r.hesiReleaseWindow = 0;
            r.offShiftElapsed = 0;
          }

          let primaryDef = null;
          let closestDef = null;
          let bestDefDSq = 9999;
          if (!userDefNow) {
            primaryDef = state.defense[0] || null;
            if (state.fullCourt) {
              for (let d = 0; d < state.defense.length; d++) {
                const def = state.defense[d];
                const dx = me.x - def.x;
                const dy = me.y - def.y;
                const dSq = dx * dx + dy * dy;
                if (dSq < bestDefDSq) {
                  bestDefDSq = dSq;
                  closestDef = def;

              }
            } else {
              closestDef = primaryDef;
              if (primaryDef) {

                const dy = me.y - primaryDef.y;

          }

          const isHesitationStep = !userDefNow && hasInput && !keys.Shift && retreatDot < -0.55 && me.y < 12.8;
          if (isHesitationStep) {

            if (
              iHaveBall &&
              prevSpeedSq > 10.24 &&

              closestDef &&
              bestDefDSq < 3.24 &&

            ) {
              closestDef.reactionTimer = Math.max(closestDef.reactionTimer || 0, 0.24);
              closestDef.inertiaVx = me.vx * 0.45;

            }

          const perpX = -toRimY / toRimLen;

          const latProj = hasInput ? ix * perpX + iy * perpY : 0;
          const currentLat = Math.abs(latProj) > 0.42 ? (latProj > 0 ? 1 : -1) : 0;
          let switchedLateral = false;

          const minOffShift = isEasy ? 0.035 : 0.055;

          const canTriggerCoP = !userDefNow && !blockCoPInTut3A && hasInput && (r.copCooldown <= 0 || shiftReleaseShift || chainReady);

            const onBallCrossover =

            const offBallQuickCross = !iHaveBall && switchedLateral && keys.Shift;

              const fakeVy =
                r.lastLateralSign !== 0 && switchedLateral ? -currentLat * perpY * 3.8 : Math.abs(me.vy) > 0.3 ? me.vy : r.sprintPeakVy || -1.2;
              const handDir = currentLat !== 0 ? currentLat : -(me.dribbleHand || 1);
              r.burstBoostTimer = 0.64;

              r.copCooldown = 0.38;

              r.hesitationTimer = 0;

              const vAlong = Math.max(0, me.vx * ix + me.vy * iy);

              spawnDust(me.x, me.y, 6);

              if (primaryDef && (me.x - primaryDef.x) * (me.x - primaryDef.x) + (me.y - primaryDef.y) * (me.y - primaryDef.y) < 31.36) {

              if (shookAny) {

            } else if (shiftReleaseShift || walkToFast || sharpCutOrVcut) {
              const oldVx = Math.abs(me.vx) > 0.3 ? me.vx : Math.abs(r.sprintPeakVx) > 0.3 ? r.sprintPeakVx : r.lastMoveDirX * 2.6;
              const oldVy = Math.abs(me.vy) > 0.3 ? me.vy : Math.abs(r.sprintPeakVy) > 0.3 ? r.sprintPeakVy : r.lastMoveDirY * 2.6;
              r.burstBoostTimer = 0.64;

            } else if (r.burstBoostTimer > 0) {
              // 2-Stage First-Step Burst Curve: 6.80 m/s peak smoothly tapering to 5.05 m/s!
              targetSpeed = 5.05 + 1.75 * Math.pow(clamp(r.burstBoostTimer / 0.64, 0, 1), 0.65);
            } else if (keys.Shift) {

            dt,

        /* On-Ball Dribble Pressure & Strip Turnover Physics */
        function triggerUserStripped(stealerIdx) {
          const sIdx = stealerIdx >= 0 ? stealerIdx : 0;
          const stealer = state.defense[sIdx];
          const me = state.offense[0];

          state.dribblePressure.timer = 0;
          state.dribblePressure.ratio = 0;
          state.dribblePressure.doubleTeamed = false;
          state.dribblePressure.stealerIdx = sIdx;
          state.passAssist.active = false;

          stealer.passPoseTimer = 0.34;
          stealer.contestTimer = 0.42;
          stealer.gazeAngle = Math.atan2(me.y - stealer.y, me.x - stealer.x);

          me.offBalanceTimer = 0.48;
          me.reactionTimer = 0.28;
          const pushAng = Math.atan2(me.y - stealer.y, me.x - stealer.x);
          me.inertiaVx = Math.cos(pushAng) * 1.9;
          me.inertiaVy = Math.sin(pushAng) * 1.9;

          state.ball.inFlight = false;
          state.ball.loose = false;
          state.ball.postMakeDrop = false;
          state.ball.flightType = "none";
          state.ball.holderTeam = "defense";
          state.ball.holderIdx = sIdx;
          state.ball.x = stealer.x;
          state.ball.y = stealer.y;
          state.ball.z = 1.15;
          state.ball.gatherTimer = 0;
          while (state.ball.trail.length > 0) _trailPool.push(state.ball.trail.pop());

          spawnSparkles(stealer.x, stealer.y, "#ef4444", 16);
          spawnDust(me.x, me.y, 5);
          SoundEngine.playStealOrBlock(false);

          if (state.fullCourt) {
            state.playPhase = "live";
            state.defDrill.timer = 0;
            state.defDrill.actionTimer = 0;
            state.defDrill.cutterIdx = -1;
            setCoachMessage("warn", "⚠️", "STOLEN! GET BACK!", 1.5);
          } else {
            if (state.scenario === "match") {
              state.matchScore.stops += 1;
            }
            state.playPhase = "celebrate";
            state.phaseTimer = 0.55;
            setCoachMessage("warn", "⚠️", "STOLEN! PASS SOONER!", 1.6);
          }
          syncAllDOM();
        }

        function updateDribblePressure(dt) {
          const userHasBall =
            (state.fullCourt || state.role === "offense") &&
            !state.ball.inFlight &&
            !state.ball.loose &&
            !state.inbound.active &&
            state.ball.holderTeam === "offense" &&
            state.ball.holderIdx === 0 &&
            state.playPhase === "live" &&
            state.scenario !== "tutorial";

          if (!userHasBall) {
            state.dribblePressure.timer = 0;
            state.dribblePressure.ratio = 0;
            state.dribblePressure.doubleTeamed = false;
            state.dribblePressure.stealerIdx = -1;
            return;
          }

          const me = state.offense[0];
          // Initial boot / backcourt spawn grace so player can orient without instant strip!
          if (state.fullCourt && me.y > 13.5 && state.simTime < 1.6) {
            state.dribblePressure.timer = 0;
            state.dribblePressure.ratio = 0;
            return;
          }

          const diff = getDiffProfile();
          const rx = COURT.rimX - me.x;
          const ry = COURT.rimY - me.y;
          const rLen = Math.max(0.05, Math.sqrt(rx * rx + ry * ry));
          const urx = rx / rLen;
          const ury = ry / rLen;

          let closestDist = 99;
          let closestIdx = -1;
          let doubleCount = 0;

          for (let i = 0; i < state.defense.length; i++) {
            const def = state.defense[i];
            if (def.offBalanceTimer > 0 || def.reactionTimer > 0) continue;
            const dx = def.x - me.x;
            const dy = def.y - me.y;
            const dSq = dx * dx + dy * dy;
            if (dSq >= 3.4225) continue; // > 1.85m
            const d = Math.sqrt(dSq);
            const frontCos = d > 1e-4 ? (dx * urx + dy * ury) / d : 1.0;
            if (d < 1.8 && frontCos > -0.1) doubleCount++;
            // Only defenders in front hemisphere can strip the dribble (blocks rear-pursuit auto-steal!)
            if (frontCos > 0.2 && d < closestDist) {
              closestDist = d;
              closestIdx = i;
            }
          }

          const isEasy = state.difficulty === "easy";
          const effectiveReach = doubleCount >= 2 ? diff.cpuStealReach + (isEasy ? 0.06 : 0.12) : diff.cpuStealReach;
          if (closestIdx !== -1 && closestDist <= effectiveReach && state.rhythm.burstBoostTimer <= 0.12) {
            const mult = doubleCount >= 2 ? (isEasy ? 1.25 : 1.85) : 1.0;
            state.dribblePressure.timer += dt * mult;
            state.dribblePressure.doubleTeamed = doubleCount >= 2;
            state.dribblePressure.stealerIdx = closestIdx;
            state.dribblePressure.ratio = clamp(state.dribblePressure.timer / diff.stripProtectSec, 0, 1);

            if (state.dribblePressure.timer >= diff.stripProtectSec) {
              triggerUserStripped(closestIdx);
              return;
            }
            if (state.dribblePressure.ratio >= 0.35) {
              setCoachMessage("warn", "⚠️", doubleCount >= 2 ? "DOUBLE TEAM! PASS!" : "TIGHT! PRESS E!", 0.35);
            }
          } else {
            state.dribblePressure.timer = Math.max(0, state.dribblePressure.timer - dt * 2.4);
            state.dribblePressure.doubleTeamed = doubleCount >= 2;
            state.dribblePressure.stealerIdx = closestIdx;
            state.dribblePressure.ratio = clamp(state.dribblePressure.timer / diff.stripProtectSec, 0, 1);
          }
        }

        /* =====================================================================
         * 6. Tutorials (Offense LEARN & Defense LEARN D)
         * ===================================================================== */
        const TUT_EMPTY_KEYS = [];
        const TUT_KEY_E = ["E"];
        const TUT_KEY_SPACE = ["Space"];
        const TUT_KEY_A = ["A"];
        const TUT_KEY_D = ["D"];
        const TUT_KEY_A_SHIFT = ["A", "Shift"];
        const TUT_KEY_D_SHIFT = ["D", "Shift"];
        const DIR_COMBO_TABLE = {
          W: ["W"],
          S: ["S"],
          A: ["A"],
          D: ["D"],
          WA: ["W", "A"],
          WD: ["W", "D"],
          SA: ["S", "A"],
          SD: ["S", "D"],
        };
        const SHIFT_DIR_COMBO_TABLE = {
          W: ["Shift", "W"],
          S: ["Shift", "S"],
          A: ["Shift", "A"],
          D: ["Shift", "D"],
          WA: ["Shift", "W", "A"],
          WD: ["Shift", "W", "D"],
          SA: ["Shift", "S", "A"],
          SD: ["Shift", "S", "D"],
        };

        function _resolveDirComboCode(fromX, fromY, toX, toY) {
          const dx = toX - fromX;
          const dy = toY - fromY;
          const activeYaw = getActiveInputYaw();
          const c = Math.cos(activeYaw);
          const s = Math.sin(activeYaw);
          const sRight = dx * c + dy * s;
          const sUp = dx * s - dy * c;
          const vKey = sUp > 0.4 ? "W" : sUp < -0.4 ? "S" : "";
          const hKey = sRight < -0.4 ? "A" : sRight > 0.4 ? "D" : "";
          const code = vKey + hKey;
          return code || "W";
        }

        function computeDirKeysToward(fromX, fromY, toX, toY) {
          return DIR_COMBO_TABLE[_resolveDirComboCode(fromX, fromY, toX, toY)];
        }

        function computeShiftDirKeysToward(fromX, fromY, toX, toY) {
          return SHIFT_DIR_COMBO_TABLE[_resolveDirComboCode(fromX, fromY, toX, toY)];
        }

        function _clearHighlightKeys() {
          if (state.tutorial.highlightKeys.length > 0) {
            state.tutorial.highlightKeys = TUT_EMPTY_KEYS;
          }
        }

        function updateTutorialLogic(dt) {
          if (state.scenario === "give_go") {
            if (!state.showHints || state.playPhase !== "live") {
              _clearHighlightKeys();
              return;
            }
            const me = state.offense[0];
            const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;
            if (state.giveGoStage === 1 && iHaveBall) {
              state.tutorial.highlightKeys = TUT_KEY_E;
            } else if (state.giveGoStage === 2 && !iHaveBall && !state.ball.inFlight) {
              if (state.rhythm.slowMoveTime < 0.15 && state.rhythm.copCount === 0) {
                state.tutorial.highlightKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
              } else if (state.rhythm.copCount === 0) {
                state.tutorial.highlightKeys = computeShiftDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
              } else {
                state.tutorial.highlightKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
              }
            } else if (iHaveBall && state.giveGoStage >= 2) {
              state.tutorial.highlightKeys = TUT_KEY_SPACE;
            } else {
              _clearHighlightKeys();
            }
            return;
          }

          if (state.scenario !== "tutorial" && state.scenario !== "learn_d") {
            _clearHighlightKeys();
            return;
          }

          const tut = state.tutorial;
          if (tut.advanceTimer > 0) {
            _clearHighlightKeys();
            tut.advanceTimer -= dt;
            if (tut.advanceTimer <= 0 && tut.nextStepAfterAdvance > 0) {
              setTutorialStep(tut.nextStepAfterAdvance);
            }
            return;
          }

          if (state.scenario === "learn_d") {
            updateDefenseTutorialStep(dt);
            return;
          }

          // Offense 4-Step Tutorial
          const me = state.offense[0];
          const pg = state.offense[1];
          const myDef = state.defense[0];
          const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;

          if (tut.step === 1) {
            state.targetSpot.active = true;
            state.targetSpot.x = pg.x - 0.7;
            state.targetSpot.y = pg.y;
            state.targetSpot.radius = 1.3;
            state.targetSpot.label = "GO HERE!";
            state.targetSpot.stepLabel = "1";
            state.targetSpot.isWarn = true;

            if (state.lane.crowdedTeammateIdx !== -1) {
              tut.timer += dt;
              _clearHighlightKeys();
              if (tut.timer >= 0.42) {
                tut.completedSteps[1] = true;
                tut.subPhase = "step1_done";
                tut.advanceTimer = 1.35;
                tut.nextStepAfterAdvance = 2;
                spawnSparkles(me.x, me.y, "#f59e0b", 10);
                setCoachMessage("celebrate", "💡", "TOO CROWDED! NOW SPREAD!", 1.8);
                syncAllDOM();
              }
            } else {
              tut.highlightKeys = computeDirKeysToward(me.x, me.y, pg.x - 0.5, pg.y);
            }
          } else if (tut.step === 2) {
            state.targetSpot.isWarn = false;
            if (!iHaveBall && !state.ball.inFlight) {
              state.targetSpot.active = true;
              state.targetSpot.x = -5.85;
              state.targetSpot.y = 5.65;
              state.targetSpot.radius = 1.55;
              state.targetSpot.label = "OPEN SPOT!";
              state.targetSpot.stepLabel = "2";
              const dSpot = hypot2(me.x - state.targetSpot.x, me.y - state.targetSpot.y);
              if (dSpot > 0.9) {
                tut.highlightKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
              } else {
                _clearHighlightKeys();
              }
            } else if (iHaveBall && state.playPhase === "live") {
              state.targetSpot.active = false;
              tut.subPhase = "shoot_open";
              tut.highlightKeys = TUT_KEY_SPACE;
              setCoachMessage("good", "🏀", "WIDE OPEN! SHOOT!", 0.4);
            } else {
              _clearHighlightKeys();
            }
          } else if (tut.step === 3) {
            state.targetSpot.isWarn = false;
            if (tut.subPhase === "3a_constant") {
              state.targetSpot.active = true;
              state.targetSpot.x = -2.0;
              state.targetSpot.y = 2.5;
              state.targetSpot.radius = 1.35;
              state.targetSpot.label = "HOLD SHIFT+W";
              state.targetSpot.stepLabel = "3A";
              tut.highlightKeys = computeShiftDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);

              const movingAny = keys.W || keys.A || keys.S || keys.D;
              if (keys.Shift && movingAny) {
                tut.sprintHoldTimer += dt;
                if (tut.sprintHoldTimer >= 0.75) {
                  tut.subPhase = "3a_resetting";
                  tut.timer = 0;
                  _clearHighlightKeys();
                  setCoachMessage("warn", "😮", "DEFENDER STUCK ON YOU!", 1.3);
                }
              }
            } else if (tut.subPhase === "3a_resetting") {
              _clearHighlightKeys();
              tut.timer += dt;
              if (tut.timer >= 1.0) {
                setupOffenseTutorialStep(3, "3b_walk");
                syncAllDOM();
              }
            } else if (tut.subPhase === "3b_walk") {
              state.targetSpot.active = true;
              state.targetSpot.x = -4.2;
              state.targetSpot.y = 5.0;
              state.targetSpot.radius = 1.3;
              state.targetSpot.label = "WALK SLOW";
              state.targetSpot.stepLabel = "WALK";
              tut.highlightKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);

              const movingSlow = (keys.W || keys.A || keys.S || keys.D) && !keys.Shift;
              if (movingSlow) {
                tut.walkHoldTimer += dt;
                if (tut.walkHoldTimer >= 0.35) {
                  tut.subPhase = "3b_burst";
                  setCoachMessage("good", "⚡", "GO NOW! SHIFT!", 0);
                }
              }
            } else if (tut.subPhase === "3b_burst") {
              if (!iHaveBall && !state.ball.inFlight) {
                state.targetSpot.active = true;
                state.targetSpot.x = -1.5;
                state.targetSpot.y = 2.35;
                state.targetSpot.radius = 1.5;
                state.targetSpot.label = "CUT FAST!";
                state.targetSpot.stepLabel = "GO!";
                if (state.rhythm.burstBoostTimer > 0 || myDef.offBalanceTimer > 0) {
                  tut.copSucceeded = true;
                }
                tut.highlightKeys = tut.copSucceeded
                  ? computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y)
                  : computeShiftDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
              } else if (iHaveBall && state.playPhase === "live") {
                state.targetSpot.active = false;
                tut.highlightKeys = TUT_KEY_SPACE;
                setCoachMessage("good", "🔥", "OPEN LAYUP! SPACE!", 0.4);
              }
            }
          } else if (tut.step === 4) {
            state.targetSpot.isWarn = false;
            if (tut.subPhase === "graduated") {
              state.targetSpot.active = false;
              _clearHighlightKeys();
              return;
            }
            if (!iHaveBall && !state.ball.inFlight && tut.subPhase === "get_ball") {
              state.targetSpot.active = true;
              state.targetSpot.x = -5.5;
              state.targetSpot.y = 4.75;
              state.targetSpot.radius = 1.55;
              state.targetSpot.label = "CATCH HERE!";
              state.targetSpot.stepLabel = "4";
              tut.highlightKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
            } else if (iHaveBall && state.playPhase === "live") {
              state.targetSpot.active = true;
              state.targetSpot.x = -1.2;
              state.targetSpot.y = 2.25;
              state.targetSpot.radius = 1.45;
              state.targetSpot.label = "FINISH!";
              state.targetSpot.stepLabel = "🏀";

              if (state.rhythm.crossoverTimer > 0 || myDef.offBalanceTimer > 0) {
                tut.crossoverDone = true;
              }
              if (!tut.crossoverDone) {
                tut.subPhase = "do_crossover";
                if (tut.movedSide === 0) {
                  tut.highlightKeys = TUT_KEY_A;
                  setCoachMessage("normal", "💨", "FAKE LEFT (A)!", 0.3);
                  if (keys.A && !keys.D) {
                    tut.sideHoldTimer += dt;
                    if (tut.sideHoldTimer >= 0.1) tut.movedSide = -1;
                  } else if (keys.D && !keys.A) {
                    tut.sideHoldTimer += dt;
                    if (tut.sideHoldTimer >= 0.1) tut.movedSide = 1;
                  }
                } else {
                  const oppKey = tut.movedSide < 0 ? "D" : "A";
                  tut.highlightKeys = tut.movedSide < 0 ? TUT_KEY_D_SHIFT : TUT_KEY_A_SHIFT;
                  setCoachMessage("good", "⚡", "CROSS " + oppKey + " + SHIFT!", 0.3);
                }
              } else {
                tut.subPhase = "shoot_finish";
                tut.highlightKeys = TUT_KEY_SPACE;
                setCoachMessage("good", "🔥", "SHOOT NOW! SPACE!", 0.4);
              }
            }
          }
        }

        function updateDefenseTutorialStep(dt) {
          const tut = state.tutorial;
          const me = state.defense[0];
          const man = state.offense[0];

          if (tut.step === 1) {
            // Step 1: Slide laterally to stay between dribbler and hoop
            const toRimX = COURT.rimX - man.x;
            const toRimY = COURT.rimY - man.y;
            const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
            const spotX = man.x + (toRimX / dRim) * 1.15;
            const spotY = man.y + (toRimY / dRim) * 1.15;

            state.targetSpot.active = true;
            state.targetSpot.x = spotX;
            state.targetSpot.y = spotY;
            state.targetSpot.radius = 1.25;
            state.targetSpot.label = "STAY IN FRONT!";
            state.targetSpot.stepLabel = "1";
            state.targetSpot.isWarn = false;

            const dFront = hypot2(me.x - spotX, me.y - spotY);
            if (dFront < 1.45) {
              tut.timer += dt;
              if (dFront > 0.32) {
                tut.highlightKeys = computeDirKeysToward(me.x, me.y, spotX, spotY);
              } else {
                _clearHighlightKeys();
              }
              if (tut.timer >= 0.85) {
                tut.completedSteps[1] = true;
                tut.advanceTimer = 1.25;
                tut.nextStepAfterAdvance = 2;
                spawnSparkles(me.x, me.y, "#22c55e", 10);
                setCoachMessage("celebrate", "🛡️", "GREAT SLIDE!", 1.5);
                syncAllDOM();
              }
            } else {
              tut.highlightKeys = computeDirKeysToward(me.x, me.y, spotX, spotY);
            }
          } else if (tut.step === 2) {
            // Step 2: Hands up contest when shooter gathers!
            state.targetSpot.active = true;
            state.targetSpot.x = 0.0;
            state.targetSpot.y = 5.55;
            state.targetSpot.radius = 1.2;
            state.targetSpot.label = "GUARD!";
            state.targetSpot.stepLabel = "2";

            if (state.playPhase === "live" && !state.ball.inFlight) {
              tut.timer += dt;
              if (tut.timer > 0.35) {
                state.ball.gatherTimer = 0.9;
                tut.highlightKeys = TUT_KEY_SPACE;
                setCoachMessage("warn", "🖐️", "HANDS UP! SPACE!", 0.2);
                if (me.contestTimer > 0 && dist2(me, man) < 2.35) {
                  state.ball.contestedByUser = true;
                  _clearHighlightKeys();
                  startShot("offense", 0, false);
                } else if (tut.timer > 2.2) {
                  // Shooter releases uncontested -> resets gently so kid can try again!
                  startShot("offense", 0, true);
                }
              }
            } else {
              _clearHighlightKeys();
            }
          } else if (tut.step === 3) {
            // Step 3: Move into the green Help Triangle spot!
            state.helpTriangle.show = true;
            state.targetSpot.active = true;
            state.targetSpot.x = state.helpTriangle.idealX;
            state.targetSpot.y = state.helpTriangle.idealY;
            state.targetSpot.radius = 1.45;
            state.targetSpot.label = "HELP SPOT!";
            state.targetSpot.stepLabel = "3";

            const dHelp = hypot2(me.x - state.targetSpot.x, me.y - state.targetSpot.y);
            if (dHelp < 1.5) {
              tut.timer += dt;
              _clearHighlightKeys();
              if (tut.timer >= 0.75) {
                tut.completedSteps[3] = true;
                tut.advanceTimer = 1.25;
                tut.nextStepAfterAdvance = 4;
                spawnSparkles(me.x, me.y, "#22c55e", 10);
                setCoachMessage("celebrate", "🔺", "PERFECT HELP!", 1.5);
                syncAllDOM();
              }
            } else {
              tut.highlightKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
            }
          } else if (tut.step === 4) {
            if (tut.subPhase === "graduated") {
              state.targetSpot.active = false;
              _clearHighlightKeys();
              return;
            }
            state.helpTriangle.show = true;
            if (tut.subPhase === "wait_kickout") {
              tut.timer += dt;
              state.targetSpot.active = true;
              state.targetSpot.x = state.helpTriangle.idealX;
              state.targetSpot.y = state.helpTriangle.idealY;
              state.targetSpot.radius = 1.4;
              state.targetSpot.label = "WAIT...";
              state.targetSpot.stepLabel = "4";
              _clearHighlightKeys();
              if (tut.timer >= 0.55 && !state.ball.inFlight) {
                tut.subPhase = "closeout_now";
                startPass(1, 0);
                setCoachMessage("warn", "🏃", "CLOSEOUT! RUN + SPACE!", 0.4);
              }
            } else if (tut.subPhase === "closeout_now") {
              state.targetSpot.active = true;
              state.targetSpot.x = man.x + 0.6;
              state.targetSpot.y = man.y - 0.5;
              state.targetSpot.radius = 1.4;
              state.targetSpot.label = "CONTEST!";
              state.targetSpot.stepLabel = "🖐️";

              if (state.ball.inFlight && state.ball.flightType === "shot") {
                _clearHighlightKeys();
              } else {
                const dMan = dist2(me, man);
                if (dMan > 2.05) {
                  tut.highlightKeys = computeShiftDirKeysToward(me.x, me.y, man.x, man.y);
                } else {
                  tut.highlightKeys = TUT_KEY_SPACE;
                  setCoachMessage("good", "🖐️", "HANDS UP! SPACE!", 0.2);
                }
              }
            }
          }
        }

        /* =====================================================================
         * 7. Offense AI, Defense Drills AI & Full 5v5 Match AI
         * ===================================================================== */
        function moveAgentToward(agent, tx, ty, maxSpeed, dt, allowOutBaseline, sharpLockdown) {
          const dx = tx - agent.x;
          const dy = ty - agent.y;
          const d = hypot2(dx, dy);
          let dvx = 0;
          let dvy = 0;
          const gain = sharpLockdown ? 8.4 : 4.4;
          if (d > 0.05) {
            const sp = Math.min(maxSpeed, d * gain);
            dvx = (dx / d) * sp;
            dvy = (dy / d) * sp;
          }
          const accelRate = sharpLockdown ? 18.5 : 10.5;
          agent.vx = lerp(agent.vx, dvx, clamp(accelRate * dt, 0, 1));
          agent.vy = lerp(agent.vy, dvy, clamp(accelRate * dt, 0, 1));
          const courtLen = getCourtLength();
          const minY = allowOutBaseline ? -0.35 : 0.55;
          const maxY = allowOutBaseline ? courtLen + 0.35 : courtLen - 0.55;
          agent.x = clamp(agent.x + agent.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
          agent.y = clamp(agent.y + agent.vy * dt, minY, maxY);
          const spNow = hypot2(agent.vx, agent.vy);
          if (spNow > 0.35) {
            agent.stridePhase += spNow * dt * 3.2;
          }
          updatePlayerJumpAndPose(agent, dt, spNow > 4.2, false, false);
        }

        function computeHelpTriangleSpot(man, ballX, ballY, side) {
          const distBallToMan = hypot2(ballX - man.x, ballY - man.y);
          const helpWeight = clamp(distBallToMan / 11.5, 0.22, 0.55);
          const midX = lerp(man.x, ballX, 0.34);
          const midY = lerp(man.y, ballY, 0.28);
          return {
            x: lerp(midX, COURT.rimX + side * 0.5, helpWeight),
            y: lerp(midY, COURT.rimY + 1.45, helpWeight),
          };
        }

        const FC_OFF_CANDIDATES_POS = [
          { x: -5.65, y: 6.1, label: "WING!" },
          { x: 5.65, y: 6.1, label: "WING!" },
          { x: -6.45, y: 2.25, label: "CORNER!" },
          { x: 6.45, y: 2.25, label: "CORNER!" },
          { x: 1.15, y: 2.25, label: "CUT!" },
        ];
        const FC_OFF_CANDIDATES_NEG = [
          { x: -5.65, y: 6.1, label: "WING!" },
          { x: 5.65, y: 6.1, label: "WING!" },
          { x: -6.45, y: 2.25, label: "CORNER!" },
          { x: 6.45, y: 2.25, label: "CORNER!" },
          { x: -1.15, y: 2.25, label: "CUT!" },
        ];
        const HC_OFF_CANDIDATES_POS = [
          { x: 6.5, y: 2.15, label: "CORNER!" },
          { x: 5.7, y: 6.2, label: "WING!" },
          { x: 1.25, y: 2.25, label: "CUT!" },
          { x: 0.0, y: 8.65, label: "TOP!" },
        ];
        const HC_OFF_CANDIDATES_NEG = [
          { x: -6.5, y: 2.15, label: "CORNER!" },
          { x: -5.7, y: 6.2, label: "WING!" },
          { x: -1.25, y: 2.25, label: "CUT!" },
          { x: 0.0, y: 8.65, label: "TOP!" },
        ];

        function updateFullCourtTargetSpot() {
          state.helpTriangle.show = false;
          state.targetSpot.isWarn = false;
          const me = state.offense[0];

          if (state.ball.loose) {
            const drop = computeLooseBallDropSpot(_scratchDrop);
            state.targetSpot.active = true;
            state.targetSpot.x = drop.x;
            state.targetSpot.y = drop.y;
            state.targetSpot.radius = 1.2;
            state.targetSpot.label = "REBOUND!";
            state.targetSpot.stepLabel = "";
            return;
          }

          if (isUserOnDefenseNow()) {
            // Defend South Hoop (0, 26.425)!
            const bhIdx = state.ball.inFlight ? state.ball.targetIdx : state.ball.holderIdx;
            const bh = state.defense[clamp(bhIdx, 0, state.defense.length - 1)];
            const toSouthX = COURT.rimX - bh.x;
            const toSouthY = COURT.southRimY - bh.y;
            const dSouth = Math.max(0.01, hypot2(toSouthX, toSouthY));
            state.targetSpot.active = true;
            state.targetSpot.x = bh.x + (toSouthX / dSouth) * 1.18;
            state.targetSpot.y = clamp(bh.y + (toSouthY / dSouth) * 1.18, 1.2, COURT.fullLength - 1.0);
            state.targetSpot.radius = 1.25;
            state.targetSpot.label = me.y < bh.y - 1.2 ? "GET BACK!" : "GUARD!";
            state.targetSpot.stepLabel = "";
            return;
          }

          // Blue Offense: Attack North Hoop (0, 1.575)!
          const iHaveBall = !state.ball.inFlight && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
          if (iHaveBall) {
            state.targetSpot.active = true;
            state.targetSpot.x = me.x >= 0 ? 0.85 : -0.85;
            state.targetSpot.y = 2.15;
            state.targetSpot.radius = 1.4;
            state.targetSpot.label = me.y > 14.0 ? "ATTACK!" : "SCORE!";
            state.targetSpot.stepLabel = "";
            return;
          }

          const candidates = me.x >= 0 ? FC_OFF_CANDIDATES_POS : FC_OFF_CANDIDATES_NEG;
          let best = candidates[0];
          let bestSc = -999;
          for (let i = 0; i < candidates.length; i++) {
            const c = candidates[i];
            let minMateSq = 9999;
            for (let m = 1; m < state.offense.length; m++) {
              const dx = c.x - state.offense[m].x;
              const dy = c.y - state.offense[m].y;
              const dSq = dx * dx + dy * dy;
              if (dSq < minMateSq) minMateSq = dSq;
            }
            const sc = Math.sqrt(minMateSq) - hypot2(c.x - me.x, c.y - me.y) * 0.18;
            if (sc > bestSc) {
              bestSc = sc;
              best = c;
            }
          }
          state.targetSpot.active = true;
          state.targetSpot.x = best.x;
          state.targetSpot.y = best.y;
          state.targetSpot.radius = 1.45;
          state.targetSpot.label = state.ball.y > 14.5 ? "FAST BREAK!" : best.label;
          state.targetSpot.stepLabel = "";
        }

        function updateTargetSpot(dt) {
          if (state.fullCourt) {
            updateFullCourtTargetSpot();
            return;
          }
          state.helpTriangle.show = false;
          if (state.scenario === "tutorial" || state.scenario === "learn_d") {
            if (state.scenario === "learn_d" && state.tutorial.step >= 3) {
              const hs = computeHelpTriangleSpot(state.offense[0], state.ball.x, state.ball.y, -1);
              state.helpTriangle.idealX = hs.x;
              state.helpTriangle.idealY = hs.y;
              state.helpTriangle.show = true;
            }
            return;
          }

          state.targetSpot.isWarn = false;
          if (state.ball.loose) {
            const drop = computeLooseBallDropSpot(_scratchDrop);
            state.targetSpot.active = true;
            state.targetSpot.x = drop.x;
            state.targetSpot.y = drop.y;
            state.targetSpot.radius = 1.2;
            state.targetSpot.label = "REBOUND!";
            state.targetSpot.stepLabel = "";
            return;
          }
          const spot = START_SPOTS[state.startSpot];
          const side = spot.side;
          const meOff = state.offense[0];

          if (state.role === "defense") {
            const myMan = state.offense[0];
            const manHasBall = !state.ball.inFlight && state.ball.holderIdx === 0;

            if (manHasBall || state.scenario === "def_onball") {
              const bh = state.offense[state.ball.holderIdx];
              const toRimX = COURT.rimX - bh.x;
              const toRimY = COURT.rimY - bh.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              state.targetSpot.active = true;
              state.targetSpot.x = bh.x + (toRimX / dRim) * 1.12;
              state.targetSpot.y = bh.y + (toRimY / dRim) * 1.12;
              state.targetSpot.radius = 1.15;
              state.targetSpot.label = "GUARD!";
              state.targetSpot.stepLabel = "";
              return;
            }

            if (state.scenario === "def_cut") {
              const toRimX = COURT.rimX - myMan.x;
              const toRimY = COURT.rimY - myMan.y;
              const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
              state.targetSpot.active = true;
              state.targetSpot.x = lerp(myMan.x + (toRimX / dRim) * 1.15, state.ball.x, 0.22);
              state.targetSpot.y = lerp(myMan.y + (toRimY / dRim) * 1.15, state.ball.y, 0.22);
              state.targetSpot.radius = 1.25;
              state.targetSpot.label = "BLOCK CUT!";
              state.targetSpot.stepLabel = "";
              return;
            }

            // Help Triangle for defense_help & off-ball 5v5 Match!
            const hs = computeHelpTriangleSpot(myMan, state.ball.x, state.ball.y, myMan.x < 0 ? -1 : 1);
            state.helpTriangle.idealX = hs.x;
            state.helpTriangle.idealY = hs.y;
            state.helpTriangle.show = true;
            state.targetSpot.active = true;
            state.targetSpot.x = hs.x;
            state.targetSpot.y = hs.y;
            state.targetSpot.radius = 1.4;
            state.targetSpot.label = "HELP!";
            state.targetSpot.stepLabel = "";
            return;
          }

          // Offense target spots
          if (state.scenario === "give_go") {
            if (!state.ball.inFlight && state.ball.holderIdx === 0 && state.giveGoStage === 1) {
              state.targetSpot.active = false;
              return;
            }
            if (state.giveGoStage === 2 && (state.ball.inFlight || state.ball.holderIdx !== 0)) {
              state.targetSpot.active = true;
              state.targetSpot.x = side * 1.05;
              state.targetSpot.y = 2.2;
              state.targetSpot.radius = 1.42;
              state.targetSpot.label = "CUT!";
              state.targetSpot.stepLabel = "2";
              return;
            }
            state.targetSpot.active = true;
            state.targetSpot.x = side * 0.85;
            state.targetSpot.y = 2.05;
            state.targetSpot.radius = 1.35;
            state.targetSpot.label = "SCORE!";
            state.targetSpot.stepLabel = "3";
            return;
          }

          if (!state.ball.inFlight && state.ball.holderIdx === 0) {
            state.targetSpot.active = true;
            state.targetSpot.x = side * 0.9;
            state.targetSpot.y = 2.15;
            state.targetSpot.radius = 1.35;
            state.targetSpot.label = "SCORE!";
            state.targetSpot.stepLabel = "";
            return;
          }

          if (state.scenario === "relocation") {
            if (spot.zone === "wing") {
              state.targetSpot.x = side * 6.5;
              state.targetSpot.y = 2.15;
            } else {
              state.targetSpot.x = side * 5.75;
              state.targetSpot.y = 6.35;
            }
            state.targetSpot.active = true;
            state.targetSpot.radius = 1.45;
            state.targetSpot.label = "OPEN!";
            state.targetSpot.stepLabel = "";
          } else if (state.scenario === "cut") {
            state.targetSpot.active = true;
            state.targetSpot.x = side * 1.25;
            state.targetSpot.y = 2.25;
            state.targetSpot.radius = 1.4;
            state.targetSpot.label = "CUT!";
            state.targetSpot.stepLabel = "";
          } else if (state.scenario === "vcut") {
            const stepInX = side * 3.85;
            const stepInY = spot.zone === "wing" ? 4.45 : 3.45;
            if (state.vcutStage === 1 && hypot2(meOff.x - stepInX, meOff.y - stepInY) < 1.35) {
              state.vcutStage = 2;
              setCoachMessage("good", "⚡", "NOW POP OUT! SHIFT!", 1.2);
            }
            if (state.vcutStage === 1) {
              state.targetSpot.x = stepInX;
              state.targetSpot.y = stepInY;
              state.targetSpot.radius = 1.25;
              state.targetSpot.label = "STEP IN";
              state.targetSpot.stepLabel = "1";
            } else {
              state.targetSpot.x = spot.zone === "wing" ? side * 5.85 : side * 6.45;
              state.targetSpot.y = spot.zone === "wing" ? 6.55 : 2.35;
              state.targetSpot.radius = 1.45;
              state.targetSpot.label = "POP OUT!";
              state.targetSpot.stepLabel = "2";
            }
            state.targetSpot.active = true;
          } else {
            // 5v5 Match on Offense: best open spot
            const candidates = side >= 0 ? HC_OFF_CANDIDATES_POS : HC_OFF_CANDIDATES_NEG;
            let best = candidates[0];
            let bestScore = -999;
            for (let i = 0; i < candidates.length; i++) {
              const c = candidates[i];
              let minMateSq = 9999;
              for (let m = 1; m < state.offense.length; m++) {
                const dx = c.x - state.offense[m].x;
                const dy = c.y - state.offense[m].y;
                const dSq = dx * dx + dy * dy;
                if (dSq < minMateSq) minMateSq = dSq;
              }
              const score = Math.sqrt(minMateSq) - hypot2(c.x - meOff.x, c.y - meOff.y) * 0.22;
              if (score > bestScore) {
                bestScore = score;
                best = c;
              }
            }
            state.targetSpot.active = true;
            state.targetSpot.x = best.x;
            state.targetSpot.y = best.y;
            state.targetSpot.radius = 1.45;
            state.targetSpot.label = best.label;
            state.targetSpot.stepLabel = "";
          }
        }

        function startFullCourtInbound(team) {
          state.inbound.active = true;
          state.inbound.team = team;
          state.inbound.timer = 0.72;
          state.inbound.passerIdx = 1;
          state.inbound.receiverIdx = 0;
          state.playPhase = "live";
          state.passAssist.active = false;
          state.defDrill.timer = 0;
          state.defDrill.actionTimer = 0;
          state.defDrill.cutterIdx = -1;
          for (let i = 0; i < state.offense.length; i++) {
            state.offense[i].offBalanceTimer = 0;
            state.offense[i].reactionTimer = 0;
          }
          for (let i = 0; i < state.defense.length; i++) {
            state.defense[i].offBalanceTimer = 0;
            state.defense[i].reactionTimer = 0;
          }

          state.ball.inFlight = false;
          state.ball.loose = false;
          state.ball.postMakeDrop = false;
          state.ball.isInbound = false;
          state.ball.flightType = "none";
          state.ball.gatherTimer = 0;
          if (typeof _recycleBallTrail === "function") _recycleBallTrail();
          else state.ball.trail.length = 0;
          state.ball.holderTeam = team;
          state.ball.holderIdx = 1;

          if (team === "defense") {
            const inb = state.defense[1];
            inb.x = 1.45;
            inb.y = -0.18;
            inb.vx = 0;
            inb.vy = 0;
            state.ball.x = inb.x;
            state.ball.y = inb.y;
            state.ball.z = 1.25;
          } else {
            const inb = state.offense[1];
            inb.x = -1.45;
            inb.y = COURT.fullLength + 0.18;
            inb.vx = 0;
            inb.vy = 0;
            state.ball.x = inb.x;
            state.ball.y = inb.y;
            state.ball.z = 1.25;
          }
        }

        /* =====================================================================
         * Read & React Off-Ball Motion Offense Engine:
         *   1) Rotating 3-Phase Basket Cut & Clear-Out (Setup V-Step -> Rim Slash -> Clear-Out)
         *   2) Adjacent Arc-Ordered Perimeter Rotation & Fill (Zero Diagonal Paint Crossing!)
         *   3) Ball-Handler Drive Circle Drift + ★ YOU Spacing Swap (>= 3.6m)
         *   4) Continuous Weak-Side Wing-Corner Exchange & V-Cut Footwork
         *   5) Wide 5-Lane Full-Court Fast-Break Waypoints (Corner Stagger + Opposite Trailer)
         * ===================================================================== */
        const PERIMETER_ARC_SLOTS = [
          { x: -6.3, y: 2.35 }, // 0: Left Corner
          { x: -5.45, y: 6.15 }, // 1: Left Wing
          { x: 0.0, y: 8.55 }, // 2: Top Key
          { x: 5.45, y: 6.15 }, // 3: Right Wing
          { x: 6.3, y: 2.35 }, // 4: Right Corner
        ].map((sl) => {
          const ang = Math.atan2(4.8 - sl.y, -sl.x);
          const c = Math.cos(ang);
          const s = Math.sin(ang);
          return { x: sl.x, y: sl.y, cosC: c, sinC: s, tangX: -s, tangY: c };
        });
        const _arcOrderMates = [0, 0, 0, 0];
        const _arcOrderSlots = [0, 0, 0, 0];

        function initMotionSlotsFromFormation() {
          const m = state.motion;
          const used = [false, false, false, false, false];
