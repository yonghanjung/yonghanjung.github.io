          if (state.paused) drawPauseOverlayPill(ctxB, W);
        }

        function renderTopDownB() {
          if (state.viewMode === "a") return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const W = canvasB.width / dpr;
          const H = canvasB.height / dpr;
          if (W <= 0 || H <= 0) return;

          ctxB.save();
          ctxB.scale(dpr, dpr);

          ctxB.fillStyle = "#0f172a";
          ctxB.fillRect(0, 0, W, H);

          if (state.fullCourt) {
            renderFullCourtTopDownB(W, H);
            ctxB.restore();
            return;
          }

          const pad = 18;
          const scale = Math.min((W - pad * 2) / COURT.width, (H - pad * 2) / COURT.length);
          const courtPxW = COURT.width * scale;
          const courtPxH = COURT.length * scale;
          const originX = (W - courtPxW) * 0.5 + courtPxW * 0.5;
          const originY = (H - courtPxH) * 0.5;

          const toSX = (wx) => originX + wx * scale;
          const toSY = (wy) => originY + wy * scale;

          // Royal Blue Court Apron
          ctxB.fillStyle = "#1e3a8a";
          ctxB.fillRect(toSX(-COURT.halfW) - 8, toSY(0) - 8, courtPxW + 16, courtPxH + 16);

          // Maple Hardwood Planks
          ctxB.fillStyle = "#eec68a";
          ctxB.fillRect(toSX(-COURT.halfW), toSY(0), courtPxW, courtPxH);

          for (let xm = -7; xm <= 6; xm += 1) {
            ctxB.fillStyle = xm % 2 === 0 ? "rgba(180, 118, 48, 0.12)" : "rgba(255, 245, 225, 0.14)";
            ctxB.fillRect(toSX(xm), toSY(0), scale, courtPxH);
          }

          // Inside 3-pt warm highlight & Two-Tone Paint
          const startAng = Math.atan2(COURT.threeBreakY - COURT.rimY, COURT.threeCornerX);
          const endAng = Math.PI - startAng;
          ctxB.fillStyle = "rgba(255, 250, 235, 0.20)";
          ctxB.beginPath();
          ctxB.moveTo(toSX(-COURT.threeCornerX), toSY(0));
          ctxB.lineTo(toSX(-COURT.threeCornerX), toSY(COURT.threeBreakY));
          ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), COURT.threeRadius * scale, endAng, startAng, true);
          ctxB.lineTo(toSX(COURT.threeCornerX), toSY(0));
          ctxB.closePath();
          ctxB.fill();

          ctxB.fillStyle = "#1d4ed8";
          ctxB.fillRect(toSX(-COURT.paintHalfW), toSY(0), COURT.paintHalfW * 2 * scale, COURT.paintLen * scale);
          ctxB.fillStyle = "rgba(234, 88, 12, 0.25)";
          ctxB.fillRect(toSX(-COURT.paintHalfW + 0.35), toSY(0), (COURT.paintHalfW * 2 - 0.7) * scale, COURT.paintLen * scale);

          // Crisp Court Lines
          ctxB.strokeStyle = "#ffffff";
          ctxB.lineWidth = 2.2;
          ctxB.strokeRect(toSX(-COURT.halfW), toSY(0), courtPxW, courtPxH);
          ctxB.strokeRect(toSX(-COURT.paintHalfW), toSY(0), COURT.paintHalfW * 2 * scale, COURT.paintLen * scale);

          ctxB.beginPath();
          ctxB.arc(toSX(0), toSY(COURT.paintLen), COURT.ftRadius * scale, 0, Math.PI * 2);
          ctxB.stroke();

          ctxB.beginPath();
          ctxB.arc(toSX(0), toSY(COURT.rimY), COURT.noChargeRadius * scale, 0, Math.PI);
          ctxB.stroke();

          ctxB.beginPath();
          ctxB.arc(toSX(0), toSY(COURT.length), 1.8 * scale, Math.PI, Math.PI * 2);
          ctxB.stroke();

          ctxB.beginPath();
          ctxB.moveTo(toSX(-COURT.threeCornerX), toSY(0));
          ctxB.lineTo(toSX(-COURT.threeCornerX), toSY(COURT.threeBreakY));
          ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), COURT.threeRadius * scale, endAng, startAng, true);
          ctxB.lineTo(toSX(COURT.threeCornerX), toSY(0));
          ctxB.stroke();

          // Backboard & Rim
          ctxB.strokeStyle = "#0f172a";
          ctxB.lineWidth = 3.5;
          ctxB.beginPath();
          ctxB.moveTo(toSX(-COURT.backboardHalfW), toSY(COURT.backboardY));
          ctxB.lineTo(toSX(COURT.backboardHalfW), toSY(COURT.backboardY));
          ctxB.stroke();

          ctxB.strokeStyle = "#ea580c";
          ctxB.lineWidth = 2.8;
          ctxB.beginPath();
          ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), (COURT.rimRadius + state.fx.netSwishTimer * 0.12) * scale, 0, Math.PI * 2);
          ctxB.stroke();

          // Help Triangle Gem Overlay
          if (state.role === "defense" && state.helpTriangle.show) {
            const meDef = state.defense[0];
            const myMan = state.offense[0];
            ctxB.save();
            ctxB.fillStyle = "rgba(16, 185, 129, 0.24)";
            ctxB.strokeStyle = "#10b981";
            ctxB.lineWidth = 2.4;
            ctxB.setLineDash([6, 4]);
            ctxB.beginPath();
            ctxB.moveTo(toSX(state.ball.x), toSY(state.ball.y));
            ctxB.lineTo(toSX(myMan.x), toSY(myMan.y));
            ctxB.lineTo(toSX(meDef.x), toSY(meDef.y));
            ctxB.closePath();
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();
          }

          // Target Spot Circle
          const isTutMode = state.scenario === "tutorial" || state.scenario === "learn_d";
          if ((state.showHints || isTutMode) && state.targetSpot.active) {
            const pulse = 1 + Math.sin(state.simTime * 5.2) * 0.07;
            const rx = toSX(state.targetSpot.x);
            const ry = toSY(state.targetSpot.y);
            const rr = state.targetSpot.radius * scale * pulse;
            const isWarnSpot = state.targetSpot.isWarn;

            ctxB.save();
            ctxB.fillStyle = isWarnSpot ? "rgba(245, 158, 11, 0.28)" : "rgba(34, 197, 94, 0.28)";
            ctxB.strokeStyle = isWarnSpot ? "#f59e0b" : "#16a34a";
            ctxB.lineWidth = 2.8;
            ctxB.setLineDash([7, 5]);
            ctxB.beginPath();
            ctxB.arc(rx, ry, rr, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.setLineDash([]);

            ctxB.fillStyle = "#0f172a";
            ctxB.font = "900 11.5px sans-serif";
            ctxB.textAlign = "center";
            ctxB.fillText(state.targetSpot.label, rx, ry + 4);
            ctxB.restore();
          }

          // On-Ball Direct Pass Target Ring & Sky-Blue Guide (E Key)
          if (state.role === "offense" && !state.ball.inFlight && state.ball.holderIdx === 0 && state.passTarget.idx > 0) {
            const me = state.offense[0];
            const targetMate = state.offense[state.passTarget.idx];
            const mx = toSX(me.x);
            const my = toSY(me.y);
            const tx = toSX(targetMate.x);
            const ty = toSY(targetMate.y);
            const pulse = 1 + Math.sin(state.simTime * 6.5) * 0.09;
            const ringR = 0.92 * scale * pulse;

            ctxB.save();
            ctxB.strokeStyle = state.passTarget.laneOpen ? "rgba(56, 189, 248, 0.85)" : "rgba(251, 146, 60, 0.85)";
            ctxB.lineWidth = 2.4;
            ctxB.setLineDash([6, 5]);
            ctxB.beginPath();
            ctxB.moveTo(mx, my);
            ctxB.lineTo(tx, ty);
            ctxB.stroke();
            ctxB.setLineDash([]);

            ctxB.fillStyle = state.passTarget.laneOpen ? "rgba(56, 189, 248, 0.24)" : "rgba(251, 146, 60, 0.22)";
            ctxB.strokeStyle = state.passTarget.laneOpen ? "#38bdf8" : "#fb923c";
            ctxB.lineWidth = 2.6;
            ctxB.beginPath();
            ctxB.arc(tx, ty, ringR, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();

            ctxB.fillStyle = "#0f172a";
            ctxB.strokeStyle = "#38bdf8";
            ctxB.lineWidth = 1.6;
            ctxB.beginPath();
            ctxB.roundRect(tx - 21, ty + ringR + 2, 42, 17, 6);
            ctxB.fill();
            ctxB.stroke();
            ctxB.fillStyle = "#7dd3fc";
            ctxB.font = "900 10.5px sans-serif";
            ctxB.textAlign = "center";
            ctxB.fillText("🎯 E", tx, ty + ringR + 14);
            ctxB.restore();
          }

          // Amber Dribble Strip Warning Ring in Half-Court
          if (state.dribblePressure.ratio >= 0.48 && state.role === "offense") {
            const me = state.offense[0];
            ctxB.save();
            ctxB.fillStyle = "rgba(245, 158, 11, 0.26)";
            ctxB.strokeStyle = "#f59e0b";
            ctxB.lineWidth = 2.8;
            ctxB.beginPath();
            ctxB.arc(toSX(me.x), toSY(me.y), (0.92 + Math.sin(state.simTime * 18) * 0.1) * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();
          }

          // Crowding Warning Ring
          if (state.role === "offense" && state.lane.crowdedTeammateIdx !== -1) {
            const mate = state.offense[state.lane.crowdedTeammateIdx];
            ctxB.save();
            ctxB.fillStyle = "rgba(249, 115, 22, 0.24)";
            ctxB.strokeStyle = "#ea580c";
            ctxB.lineWidth = 2.6;
            ctxB.setLineDash([5, 4]);
            ctxB.beginPath();
            ctxB.arc(toSX(mate.x), toSY(mate.y), COURT.crowdingDist * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();
          }

          // Defender Vision Cones (±38 deg, synced with 3D facing!)
          const coneHalfAng = (38 * Math.PI) / 180;
          for (let i = 0; i < state.defense.length; i++) {
            const d = state.defense[i];
            if (state.role === "defense" && i === 0) continue;
            const sx = toSX(d.x);
            const sy = toSY(d.y);
            const coneR = (d.ballWatchFactor > 0.55 ? 3.1 : 2.3) * scale;
            const dirAng = d.facing !== undefined ? d.facing : d.gazeAngle;

            ctxB.save();
            ctxB.fillStyle = d.ballWatchFactor > 0.55 ? "rgba(250, 204, 21, 0.30)" : "rgba(239, 68, 68, 0.15)";
            ctxB.beginPath();
            ctxB.moveTo(sx, sy);
            ctxB.arc(sx, sy, coneR, dirAng - coneHalfAng, dirAng + coneHalfAng);
            ctxB.closePath();
            ctxB.fill();
            ctxB.restore();
          }

          // Flowing Neon Green Passing Lane or Red Blocked X
          if (state.role === "offense" && !state.ball.inFlight && state.ball.holderIdx !== 0) {
            const passer = state.offense[state.ball.holderIdx];
            const me = state.offense[0];
            const x1 = toSX(passer.x);
            const y1 = toSY(passer.y);
            const x2 = toSX(me.x);
            const y2 = toSY(me.y);

            ctxB.save();
            if (state.lane.open) {
              ctxB.strokeStyle = "rgba(34, 197, 94, 0.36)";
              ctxB.lineWidth = 9;
              ctxB.beginPath();
              ctxB.moveTo(x1, y1);
              ctxB.lineTo(x2, y2);
              ctxB.stroke();

              ctxB.strokeStyle = "#16a34a";
              ctxB.lineWidth = 3.5;
              ctxB.beginPath();
              ctxB.moveTo(x1, y1);
              ctxB.lineTo(x2, y2);
              ctxB.stroke();

              const ang = Math.atan2(y2 - y1, x2 - x1);
              const flowOffset = (state.simTime * 2.1) % 1;
              ctxB.strokeStyle = "#dcfce7";
              ctxB.lineWidth = 2.6;
              for (let k = 0; k < 4; k++) {
                const f = ((k + flowOffset) / 4) * 0.84 + 0.08;
                ctxB.save();
                ctxB.translate(lerp(x1, x2, f), lerp(y1, y2, f));
                ctxB.rotate(ang);
                ctxB.beginPath();
                ctxB.moveTo(-5, -5);
                ctxB.lineTo(3, 0);
                ctxB.lineTo(-5, 5);
                ctxB.stroke();
                ctxB.restore();
              }
            } else {
              ctxB.strokeStyle = "rgba(220, 38, 38, 0.78)";
              ctxB.lineWidth = 2.5;
              ctxB.setLineDash([7, 6]);
              ctxB.beginPath();
              ctxB.moveTo(x1, y1);
              ctxB.lineTo(x2, y2);
              ctxB.stroke();
              ctxB.setLineDash([]);

              if (state.lane.blockerIdx !== -1) {
                const bx = toSX(state.lane.blockX);
                const by = toSY(state.lane.blockY);
                ctxB.fillStyle = "#dc2626";
                ctxB.beginPath();
                ctxB.arc(bx, by, 8.5, 0, Math.PI * 2);
                ctxB.fill();
                ctxB.strokeStyle = "#ffffff";
                ctxB.lineWidth = 2.2;
                ctxB.beginPath();
                ctxB.moveTo(bx - 3.5, by - 3.5);
                ctxB.lineTo(bx + 3.5, by + 3.5);
                ctxB.moveTo(bx + 3.5, by - 3.5);
                ctxB.lineTo(bx - 3.5, by + 3.5);
                ctxB.stroke();
              }
            }
            ctxB.restore();
          }

          // Defensive Matchup Tether + Assigned Man Target Ring (Half-Court Defense)
          if (state.role === "defense") {
            const meDef = state.defense[0];
            const myMan = getUserAssignedOffenseMan();
            if (meDef && myMan) {
              const mx = toSX(meDef.x);
              const my = toSY(meDef.y);
              const ox = toSX(myMan.x);
              const oy = toSY(myMan.y);
              ctxB.save();
              ctxB.strokeStyle = "rgba(56, 189, 248, 0.90)";
              ctxB.lineWidth = 2.5;
              ctxB.setLineDash([6, 4]);
              ctxB.beginPath();
              ctxB.moveTo(mx, my);
              ctxB.lineTo(ox, oy);
              ctxB.stroke();
              ctxB.setLineDash([]);
              ctxB.fillStyle = "rgba(56, 189, 248, 0.22)";
              ctxB.strokeStyle = "#38bdf8";
              ctxB.lineWidth = 2.6;
              ctxB.beginPath();
              ctxB.arc(ox, oy, Math.max(14, 0.72 * scale), 0, Math.PI * 2);
              ctxB.fill();
              ctxB.stroke();
              ctxB.restore();
            }
          }

          // In-Flight Pass / Shot Trajectory Guide on Half-Court Board
          if (state.ball.inFlight) {
            const fx = toSX(state.ball.fromX);
            const fy = toSY(state.ball.fromY);
            const tx = toSX(state.ball.toX);
            const ty = toSY(state.ball.toY);
            const isShot = state.ball.flightType === "shot";
            ctxB.save();
            ctxB.strokeStyle = isShot ? "rgba(250, 204, 21, 0.88)" : "rgba(56, 189, 248, 0.88)";
            ctxB.lineWidth = 2.4;
            ctxB.setLineDash([5, 4]);
            ctxB.beginPath();
            ctxB.moveTo(fx, fy);
            ctxB.lineTo(tx, ty);
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.strokeStyle = isShot ? "#facc15" : "#38bdf8";
            ctxB.lineWidth = 2.4;
            ctxB.beginPath();
            ctxB.arc(tx, ty, (0.58 + Math.sin(state.simTime * 9.0) * 0.08) * scale, 0, Math.PI * 2);
            ctxB.stroke();
            ctxB.restore();
          }

          // Glossy Player Tokens + 360 Facing Indicator
          function drawToken(p, isOff, isMe, hasBallNow) {
            const sx = toSX(p.x);
            const sy = toSY(p.y);
            const rPx = Math.max(10.5, 0.5 * scale);
            const fAng = p.facing !== undefined ? p.facing : p.gazeAngle;

            // Drop shadow
            ctxB.fillStyle = "rgba(15, 23, 42, 0.35)";
            ctxB.beginPath();
            ctxB.arc(sx, sy + 2.5, rPx, 0, Math.PI * 2);
            ctxB.fill();

            if (hasBallNow) {
              const bPulse = 1 + Math.sin(state.simTime * 8.5) * 0.08;
              ctxB.save();
              ctxB.strokeStyle = "#fb923c";
              ctxB.lineWidth = 3.5;
              ctxB.beginPath();
              ctxB.arc(sx, sy, (rPx + 6.5) * bPulse, 0, Math.PI * 2);
              ctxB.stroke();
              ctxB.strokeStyle = "#ffffff";
              ctxB.lineWidth = 1.8;
              ctxB.beginPath();
              ctxB.arc(sx, sy, rPx + 3.2, 0, Math.PI * 2);
              ctxB.stroke();
              ctxB.restore();
            }

            if (isMe) {
              ctxB.strokeStyle = "#facc15";
              ctxB.lineWidth = 4.5;
              ctxB.beginPath();
              ctxB.arc(sx, sy, rPx + 4.5, 0, Math.PI * 2);
              ctxB.stroke();
            }

            // Directional facing nose chevron on rim of token
            ctxB.fillStyle = isMe ? "#facc15" : "#ffffff";
            ctxB.beginPath();
            ctxB.moveTo(sx + Math.cos(fAng) * (rPx + 4.2), sy + Math.sin(fAng) * (rPx + 4.2));
            ctxB.lineTo(sx + Math.cos(fAng - 0.45) * (rPx - 1), sy + Math.sin(fAng - 0.45) * (rPx - 1));
            ctxB.lineTo(sx + Math.cos(fAng + 0.45) * (rPx - 1), sy + Math.sin(fAng + 0.45) * (rPx - 1));
            ctxB.closePath();
            ctxB.fill();

            const isOppToken = isOpponentTeamSide(isOff);
            ctxB.fillStyle = isOff
              ? p.offBalanceTimer > 0 && isOppToken
                ? "#f97316"
                : "#2563eb"
              : p.offBalanceTimer > 0 && isOppToken
                ? "#f97316"
                : "#dc2626";
            ctxB.strokeStyle = "#ffffff";
            ctxB.lineWidth = 2.2;
            ctxB.beginPath();
            ctxB.arc(sx, sy, rPx, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();

            // Glossy top highlight arc
            ctxB.fillStyle = "rgba(255, 255, 255, 0.25)";
            ctxB.beginPath();
            ctxB.arc(sx, sy - rPx * 0.25, rPx * 0.65, 0, Math.PI * 2);
            ctxB.fill();

            ctxB.fillStyle = isMe ? "#fef08a" : "#ffffff";
            ctxB.font = "900 11.5px sans-serif";
            ctxB.textAlign = "center";
            ctxB.fillText(isMe ? "★" : String(p.number), sx, sy + 4);

            if (p.offBalanceTimer > 0 && isOppToken) {
              ctxB.font = "900 13px sans-serif";
              ctxB.fillText("⚡", sx, sy - rPx - 4);
            } else if (!isOff && p.ballWatchFactor > 0.55) {
              ctxB.font = "900 12px sans-serif";
              ctxB.fillText("👀", sx, sy - rPx - 4);
            }
          }

          for (let i = 0; i < state.defense.length; i++) {
            const hb = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "defense" && state.ball.holderIdx === i;
            drawToken(state.defense[i], false, state.role === "defense" && i === 0, hb);
          }
          for (let i = 0; i < state.offense.length; i++) {
            const hb = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === i;
            drawToken(state.offense[i], true, state.role === "offense" && i === 0, hb);
          }

          // Basketball Token + Pre-shot Gather Warning Halo
          const bx = toSX(state.ball.x);
          const by = toSY(state.ball.y);
          if (state.ball.gatherTimer > 0) {
            ctxB.strokeStyle = "#facc15";
            ctxB.lineWidth = 3;
            ctxB.beginPath();
            ctxB.arc(bx, by, 13 + Math.sin(state.simTime * 22) * 2, 0, Math.PI * 2);
            ctxB.stroke();
          }
          const ballR = Math.max(6.8, (0.29 + Math.min(0.18, state.ball.z * 0.04)) * scale);
          ctxB.fillStyle = "#f97316";
          ctxB.strokeStyle = "#7c2d12";
          ctxB.lineWidth = 2;
          ctxB.beginPath();
          ctxB.arc(bx, by, ballR, 0, Math.PI * 2);
          ctxB.fill();
          ctxB.stroke();

          // In 📋 BOARD sole view (or board-focused input), show orthogonal WASD cross instead of 3D camera compass
          if (state.viewMode === "b" || isBoardInputActive()) {
            drawBoardCardinalBadge(ctxB, W, H);
          } else {
            drawCameraBadgeOnBoard(ctxB, W, H, state.cam.yaw - Math.PI * 0.5);
          }

          if (state.paused) drawPauseOverlayPill(ctxB, W);
          ctxB.restore();
        }

        /* =====================================================================
         * 10. View A True 360-Degree Sprite Stacking Voxel Slice Engine:
         *     - 20x20x28 Voxel Volume (28 Slices, Standing 26 >= 24 Layers)
         *     - 0.5 Half-Slice Interpolation Stamping + Directional Voxel Shading
         *     - 24 Rotation Angles (15 deg steps) Pre-Baked / Cached Atlas (60fps)
         *     - 3D Stacked Basketball & 3D Stacked Hoop / Stanchion / Rim
         * ===================================================================== */
        const REF_W = 420;
        const REF_H = 270;

        const STACK_W = 56;
        const STACK_H = 72;
        const SPR_W = STACK_W;
        const SPR_H = STACK_H;
        const STACK_LAYERS = 28;
        const STACK_ANGLES = 24;
        const VOX_GX = 20;
        const VOX_GY = 20;
        const VOX_GZ = STACK_LAYERS;

        const BALL_STACK_W = 28;
        const BALL_STACK_H = 28;
        const BALL_STACK_LAYERS = 12;
        const BALL_SPIN_FRAMES = 8;

        // Immutable Per-Tile Scanline fillRect Offscreen Canvases (Zero ImageData / Zero GPU BGRA Swap!)
        const workVolColor = new Uint32Array(VOX_GX * VOX_GY * VOX_GZ);
        const workVolFlag = new Uint8Array(VOX_GX * VOX_GY * VOX_GZ);
        const workPixBuf = new Int32Array(STACK_W * STACK_H);
        const workOutBuf = new Int32Array(STACK_W * STACK_H);
        const workZBuf = new Float32Array(STACK_W * STACK_H);

        const voxelModelCache = new Map();
        const stackFrameCache = new Map();
        const ballFrameCanvases = [];
        const ballFramePixels = [];
        let initialBakeMs = 0;

        function rgb24ToHex(rgb24) {
          return "#" + (rgb24 & 0xffffff).toString(16).padStart(6, "0");
        }

        function paintRgb24ToImmutableCanvas(rgbBuf, w, h) {
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          const ctx = c.getContext("2d");
          const spans = [];
          let lastHex = "";
          for (let y = 0; y < h; y++) {
            const rowOff = y * w;
            let x = 0;
            while (x < w) {
              const col = rgbBuf[rowOff + x];
              if (col < 0) {
                x++;
                continue;
              }
              let end = x + 1;
              while (end < w && rgbBuf[rowOff + end] === col) {
                end++;
              }
              const hex = rgb24ToHex(col);
              const len = end - x;
              spans.push({ x, y, len, rgb24: col, hex });
              if (ctx) {
                if (hex !== lastHex) {
                  ctx.fillStyle = hex;
                  lastHex = hex;
                }
                ctx.fillRect(x, y, len, 1);
              }
              x = end;
            }
          }
          return { canvas: c, spans };
        }

        function project3D(wx, wy, wz) {
          const camYaw = state.cam.yaw;
          const cosY = Math.cos(camYaw);
          const sinY = Math.sin(camYaw);
          const dx = wx - state.cam.focusX;
          const dy = wy - state.cam.focusY;

          // Rigid 2D camera basis: camRight = screen right, camDepth = nearer to camera (Painter's sort key)
          const camRight = dx * cosY + dy * sinY;
          const camDepth = -dx * sinY + dy * cosY;

          const refDist = 9.6;
          const baseScale = 27.2;
          const effZoom = getEffectiveZoom();

          if (!state.fullCourt) {
            const absSin = Math.abs(sinY);
            const camDist = 12.6 + 1.4 * absSin;
            const extentD = 6.2 + 0.4 * absSin;
            const distFromCam = Math.max(2.4, camDist - camDepth);
            const sRaw = refDist / distFromCam;
            const s = sRaw * effZoom;
            const sFar = refDist / (camDist + extentD);
            const sNear = refDist / Math.max(3.0, camDist - extentD);
            const u = (sRaw - sFar) / (sNear - sFar);

            const floorTop = 52;
            const floorBot = 264;
            const floorMidY = 158;
            const px = REF_W * 0.5 + camRight * baseScale * s;
            const pyFloorBase = floorTop + u * (floorBot - floorTop);
            const pyFloor = floorMidY + (pyFloorBase - floorMidY) * effZoom;
            const py = pyFloor - (wz || 0) * baseScale * s * 0.88;
            return { x: px, y: py, floorY: pyFloor, s, camDepth, distFromCam, effZoom };
          }

          // Full-Court (28m x 15m) Closer NBA Broadcast Perspective (~17-20m Active Window)
          const absSin = Math.abs(sinY);
          const absCos = Math.abs(cosY);
          const isFollow = state.cam.preset === "follow";
          const camDist = isFollow ? 16.4 : 15.8 + 2.4 * absCos;
          const extentD = isFollow ? 9.6 : 6.8 * absSin + 10.6 * absCos;
          const distFromCam = Math.max(2.4, camDist - camDepth);
          const sRaw = refDist / distFromCam;
          const s = sRaw * effZoom;
          const sFar = refDist / (camDist + extentD);
          const sNear = refDist / Math.max(3.2, camDist - extentD);
          const u = (sRaw - sFar) / (sNear - sFar);

          const floorTop = 54;
          const floorBot = 262;
          const floorMidY = 158;
          const zoomX = isFollow ? 1.12 : 1.14 - 0.08 * absCos;
          const px = REF_W * 0.5 + camRight * baseScale * zoomX * s;
          const pyFloorBase = floorTop + u * (floorBot - floorTop);
          const pyFloor = floorMidY + (pyFloorBase - floorMidY) * effZoom;
          const py = pyFloor - (wz || 0) * baseScale * zoomX * s * 0.88;
          return { x: px, y: py, floorY: pyFloor, s, camDepth, distFromCam, effZoom };
        }

        function hexToRgb24(hex) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return (r << 16) | (g << 8) | b;
        }

        function shadeRgb24(rgb24, mult) {
          const r = clamp(Math.round(((rgb24 >> 16) & 255) * mult), 0, 255);
          const g = clamp(Math.round(((rgb24 >> 8) & 255) * mult), 0, 255);
          const b = clamp(Math.round((rgb24 & 255) * mult), 0, 255);
          return (r << 16) | (g << 8) | b;
        }

        function voxIdx(ix, iy, vz) {
          return (vz * VOX_GY + iy) * VOX_GX + ix;
        }

        function setVox(lx, ly, vz, rgb24, flag) {
          const ix = Math.round(lx) + 10;
          const iy = Math.round(ly) + 10;
          const iz = Math.round(vz);
          if (ix < 0 || ix >= VOX_GX || iy < 0 || iy >= VOX_GY || iz < 0 || iz >= VOX_GZ) return;
          const idx = voxIdx(ix, iy, iz);
          workVolColor[idx] = rgb24;
          workVolFlag[idx] = flag || 1;
        }

        function setVoxSegment(x0, y0, z0, x1, y1, z1, rad, rgb24, flag) {
          const steps = Math.max(2, Math.ceil(Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0) + (z1 - z0) * (z1 - z0)) * 2.2));
          for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            const cx = lerp(x0, x1, t);
            const cy = lerp(y0, y1, t);
            const cz = lerp(z0, z1, t);
            if (rad <= 0.6) {
              setVox(cx, cy, cz, rgb24, flag);
              setVox(cx, cy + 0.5, cz, rgb24, flag);
            } else {
              for (let dx = -1; dx <= 0; dx++) {
                for (let dy = -1; dy <= 0; dy++) {
                  setVox(cx + dx + 0.5, cy + dy + 0.5, cz, rgb24, flag);
                }
              }
            }
          }
        }

        function selectPlayerPoseName(p, hasBallNow) {
          if (p.contestTimer > 0) return "contest";
          if (p.jumpZ > 0.04 || p.shootFollowTimer > 0) return "jump";
          if (p.offBalanceTimer > 0) return "stumble";
          if (p.passPoseTimer > 0) return "pass";
          if (hasBallNow) {
            return Math.sin(state.simTime * 8.8) >= 0 ? "dribbleA" : "dribbleB";
          }
          if (p.animState === "sprint" || p.animState === "crossover") {
            return Math.sin(p.stridePhase) >= 0 ? "sprintA" : "sprintB";
          }
          if (p.animState === "walk" || p.animState === "hesitate") {
            return Math.sin(p.stridePhase) >= 0 ? "walkA" : "walkB";
          }
          return "idle";
        }

        function getPlayerVisualSpec(p, isOffense, isMe) {
          const isStumbleDef = !isOffense && p.offBalanceTimer > 0;
          const jerseyHex = isStumbleDef ? "#ea580c" : isOffense ? "#2563eb" : "#dc2626";
          const shortsHex = isStumbleDef ? "#c2410c" : isOffense ? "#1d4ed8" : "#b91c1c";
          const trimHex = isMe ? "#facc15" : "#f8fafc";
          const shoeHex = isMe ? "#facc15" : jerseyHex;
          const skinHex = p.skinMid || "#e2a872";
          const skinLightHex = p.skinLight || "#f6c89a";
          const skinDarkHex = p.skinDark || "#b87b45";
          const hairHex = p.hairColor || "#18181b";
          const hairStyle = p.hairStyle || 0;
          const numStr = String(p.number || 7);
          const key = [isOffense ? "O" : "D", isMe ? "M" : "A", isStumbleDef ? "S" : "N", numStr, skinHex, hairHex, hairStyle].join("_");
          return {
            key,
            isOffense,
            isMe,
            number: numStr,
            jerseyRGB: hexToRgb24(jerseyHex),
            shortsRGB: hexToRgb24(shortsHex),
            trimRGB: hexToRgb24(trimHex),
            shoeRGB: hexToRgb24(shoeHex),
            skinRGB: hexToRgb24(skinHex),
            skinLightRGB: hexToRgb24(skinLightHex),
            skinDarkRGB: hexToRgb24(skinDarkHex),
            hairRGB: hexToRgb24(hairHex),
            hairStyle,
          };
        }

        function vzCheckSkip(lx, ly) {
          return Math.abs(lx) === 3 && Math.abs(ly) === 2;
        }

        /* Build 20x20x28 3D Voxel Character & Extract Surface Voxels + 3D Normals */
        function getOrBuildVoxelSurfaceModel(spec, pose) {
          const modelKey = spec.key + "|" + pose;
          let cached = voxelModelCache.get(modelKey);
          if (cached) return cached;

          workVolColor.fill(0);
          workVolFlag.fill(0);

          const cWhite = hexToRgb24("#f8fafc");
          const cGold = hexToRgb24("#facc15");
          const cGoldDark = hexToRgb24("#ca8a04");
          const cEyeDark = hexToRgb24("#0f172a");

          const stride = pose === "walkA" ? 2.0 : pose === "walkB" ? -2.0 : pose === "sprintA" ? 3.4 : pose === "sprintB" ? -3.4 : 0;
          const liftL = pose === "jump" || pose === "contest" ? 1 : stride < -1.2 ? 1 : 0;
          const liftR = pose === "jump" || pose === "contest" ? 1 : stride > 1.2 ? 1 : 0;
          const fwdLean = pose === "sprintA" || pose === "sprintB" || pose === "pass" ? 1 : 0;
          const stumbleX = pose === "stumble" ? 2 : 0;
          const wideStance = !spec.isOffense && (pose === "idle" || pose === "walkA" || pose === "walkB" || pose === "stumble") ? 1 : 0;

          // 1. vz = 0..2: High-Top Sneakers (White Outsole + Team/Gold Upper + Front White Toe-Cap!)
          const feet = [
            { fx: -3 - wideStance, fy: Math.round(stride), lift: liftL, hipX: -3 },
            { fx: 3 + wideStance, fy: Math.round(-stride), lift: liftR, hipX: 3 },
          ];
          for (let f = 0; f < 2; f++) {
            const ft = feet[f];
            for (let dx = -1; dx <= 1; dx++) {
              for (let dy = -2; dy <= 3; dy++) {
                setVox(ft.fx + dx, ft.fy + dy, 0 + ft.lift, cWhite, 2);
                const isToeCap = dy >= 2;
                setVox(ft.fx + dx, ft.fy + dy, 1 + ft.lift, isToeCap ? cWhite : spec.shoeRGB, isToeCap ? 2 : 1);
                if (dy <= 1) {
                  setVox(ft.fx + dx, ft.fy + dy, 2 + ft.lift, dy === 1 && dx === 0 ? cWhite : spec.shoeRGB, dy === 1 && dx === 0 ? 2 : 1);
                }
              }
            }

            // 2. vz = 3..8: Crew Socks (3..4) & Athletic Calves/Thighs (5..8)
            for (let vz = 3 + ft.lift; vz <= 8; vz++) {
              const t = (vz - 3) / 5;
              const lxC = lerp(ft.fx, ft.hipX + stumbleX * 0.3, t);
              const lyC = lerp(ft.fy, fwdLean * 0.4, t);
              const isSock = vz <= 4 + ft.lift;
              const col = isSock ? cWhite : spec.skinRGB;
              const flg = isSock ? 2 : 1;
              for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                  if (Math.abs(dx) === 1 && Math.abs(dy) === 1) continue;
                  setVox(lxC + dx, lyC + dy, vz, col, flg);
                }
              }
            }
          }

          // 3. vz = 9..12: Basketball Shorts + Crisp Side Vertical Trim Stripes (+lx / -lx)
          for (let vz = 9; vz <= 12; vz++) {
            const sxShift = Math.round(stumbleX * 0.4);
            for (let lx = -5; lx <= 5; lx++) {
              if (vz === 9 && lx === 0) continue;
              for (let ly = -3; ly <= 3; ly++) {
                if (Math.abs(lx) === 5 && Math.abs(ly) >= 2) continue;
                const isSideStripe = Math.abs(lx) === 5 && Math.abs(ly) <= 1;
                setVox(lx + sxShift, ly, vz, isSideStripe ? spec.trimRGB : spec.shortsRGB, isSideStripe ? 2 : 1);
              }
            }
          }

          // 4. vz = 13..18: Rectangular-Oval Torso (Width 11 x Depth 7) + Front & Back Pixel Jersey Numbers!
          for (let vz = 13; vz <= 18; vz++) {
            const tyShift = Math.round(fwdLean * (vz - 12) * 0.25);
            const txShift = Math.round(stumbleX * (vz - 11) * 0.28);
            for (let lx = -5; lx <= 5; lx++) {
              for (let ly = -3; ly <= 3; ly++) {
                if (Math.abs(lx) === 5 && Math.abs(ly) === 3) continue;
                let col = spec.jerseyRGB;
                let flg = 1;
                if (vz === 18) {
                  if ((Math.abs(lx) <= 2 && Math.abs(ly) === 3) || Math.abs(lx) === 4) {
                    col = spec.trimRGB;
                    flg = 2;
                  }
                }
                setVox(lx + txShift, ly + tyShift, vz, col, flg);
              }
            }
          }

          // Stamp 3x5 Jersey Digit on BOTH Chest (+ly) and Back (-ly)
          const digitRows = VOXEL_DIGITS_3X5[spec.number] || VOXEL_DIGITS_3X5["7"];
          for (let r = 0; r < 5; r++) {
            const vz = 17 - r;
            const tyShift = Math.round(fwdLean * (vz - 12) * 0.25);
            const txShift = Math.round(stumbleX * (vz - 11) * 0.28);
            for (let c = 0; c < 3; c++) {
              if (digitRows[r][c] === "1") {
                // Back (-ly): reads left-to-right when viewed from behind (yaw = 180 deg)
                setVox(c - 1 + txShift, -3 + tyShift, vz, spec.trimRGB, 2);
                // Chest (+ly): reads left-to-right when viewed from front (yaw = 0 deg)
                setVox(1 - c + txShift, 3 + tyShift, vz, spec.trimRGB, 2);
              }
            }
          }

          // 5. Articulated 3D Arms & Hands (Extending in lx, ly, and up to vz = 27!)
          const shShiftX = Math.round(stumbleX * 1.4);
          const shShiftY = fwdLean;
          const lShX = -6 + shShiftX;
          const rShX = 6 + shShiftX;
          const shZ = 17;

          if (pose === "contest") {
            setVoxSegment(lShX, shShiftY, shZ, lShX - 0.5, shShiftY + 1, 27, 0.8, spec.skinLightRGB, 1);
            setVoxSegment(rShX, shShiftY, shZ, rShX + 0.5, shShiftY + 1, 27, 0.8, spec.skinLightRGB, 1);
          } else if (pose === "jump") {
            setVoxSegment(lShX, shShiftY, shZ, lShX + 0.5, shShiftY + 2.5, 21, 0.8, spec.skinRGB, 1);
            setVoxSegment(rShX, shShiftY, shZ, rShX - 0.5, shShiftY + 2.0, 26, 0.8, spec.skinLightRGB, 1);
            setVox(rShX - 0.5, shShiftY + 3, 26, spec.skinLightRGB, 1);
          } else if (pose === "pass") {
            setVoxSegment(lShX, shShiftY, shZ, -3.5, shShiftY + 6, 16, 0.8, spec.skinLightRGB, 1);
            setVoxSegment(rShX, shShiftY, shZ, 3.5, shShiftY + 6, 16, 0.8, spec.skinLightRGB, 1);
          } else if (pose === "dribbleA" || pose === "dribbleB") {
            const handZ = pose === "dribbleA" ? 14 : 11;
            setVoxSegment(lShX, shShiftY, shZ, -7.5, shShiftY + 3, 14, 0.8, spec.skinRGB, 1);
            setVoxSegment(rShX, shShiftY, shZ, 6.2, shShiftY + 5, handZ, 0.8, spec.skinLightRGB, 1);
          } else if (pose === "stumble") {
            setVoxSegment(lShX, shShiftY, shZ, -9, -3, 21, 0.8, spec.skinRGB, 1);
            setVoxSegment(rShX, shShiftY, shZ, 9, 3, 19, 0.8, spec.skinLightRGB, 1);
          } else if (!spec.isOffense && (pose === "idle" || pose === "walkA" || pose === "walkB")) {
            setVoxSegment(lShX, shShiftY, shZ, -8.5, 2, 15, 0.8, spec.skinRGB, 1);
            setVoxSegment(rShX, shShiftY, shZ, 8.5, 2, 15, 0.8, spec.skinLightRGB, 1);
          } else {
            const swing = stride * 1.15;
            setVoxSegment(lShX, shShiftY, shZ, -6.5, shShiftY - swing, 12, 0.8, spec.skinRGB, 1);
            setVoxSegment(rShX, shShiftY, shZ, 6.5, shShiftY + swing, 12, 0.8, spec.skinLightRGB, 1);
          }

          // 6. vz = 19..25: Neck, 3D Head, Front Eyes + Protruding Nose, Hair & 360 Golden Headband!
          const headShiftX = Math.round(stumbleX * 1.6);
          const headShiftY = fwdLean;

          // Neck (vz = 19)
          for (let lx = -1; lx <= 1; lx++) {
            for (let ly = -1; ly <= 1; ly++) {
              setVox(lx + headShiftX, ly + headShiftY, 19, spec.skinDarkRGB, 1);
            }
          }

          // Rounded 9x7 Head (vz = 20..24) + Ears
          for (let vz = 20; vz <= 24; vz++) {
            for (let lx = -4; lx <= 4; lx++) {
              for (let ly = -3; ly <= 3; ly++) {
                if (Math.abs(lx) === 4 && Math.abs(ly) === 3) continue;
                const isBackHair = (ly === -3 && vz >= 20) || (Math.abs(lx) === 4 && ly <= -1 && vz >= 22) || vz === 24;
                setVox(lx + headShiftX, ly + headShiftY, vz, isBackHair ? spec.hairRGB : spec.skinRGB, 1);
              }
            }
          }
          // 3D Ears (vz = 21..22)
          setVox(-5 + headShiftX, headShiftY, 21, spec.skinDarkRGB, 1);
          setVox(-5 + headShiftX, headShiftY, 22, spec.skinRGB, 1);
          setVox(5 + headShiftX, headShiftY, 21, spec.skinDarkRGB, 1);
          setVox(5 + headShiftX, headShiftY, 22, spec.skinRGB, 1);

          // Front Eyes (ly = +3, vz = 21..22) & 3D Protruding Nose Highlight (ly = +4, vz = 21)
          for (let ez = 21; ez <= 22; ez++) {
            setVox(-3 + headShiftX, 3 + headShiftY, ez, cWhite, 2);
            setVox(-2 + headShiftX, 3 + headShiftY, ez, cEyeDark, 2);
            setVox(2 + headShiftX, 3 + headShiftY, ez, cEyeDark, 2);
            setVox(3 + headShiftX, 3 + headShiftY, ez, cWhite, 2);
          }
          setVox(headShiftX, 4 + headShiftY, 21, spec.skinLightRGB, 1);

          // 3D Hair Crown (vz = 25, 26th standing slice!)
          for (let lx = -3; lx <= 3; lx++) {
            for (let ly = -2; ly <= 2; ly++) {
              if (spec.hairStyle === 0 && (lx + ly) % 2 !== 0 && vzCheckSkip(lx, ly)) continue;
              setVox(lx + headShiftX, ly + headShiftY, 25, spec.hairRGB, 1);
            }
          }
          if (spec.hairStyle === 1) {
            for (let lx = -4; lx <= 4; lx++) {
              for (let ly = -3; ly <= 3; ly++) {
                if (Math.abs(lx) === 4 && Math.abs(ly) === 3) continue;
                setVox(lx + headShiftX, ly + headShiftY, 25, spec.hairRGB, 1);
              }
            }
          }

          // ★ YOU Exclusive 360-Degree Golden Headband (vz = 23) + Back Knot & Ribbon Tails (-ly)
          if (spec.isMe) {
            for (let lx = -4; lx <= 4; lx++) {
              for (let ly = -3; ly <= 3; ly++) {
                if (Math.abs(lx) === 4 && Math.abs(ly) === 3) continue;
                const onPerimeter = Math.abs(lx) === 4 || Math.abs(ly) === 3 || (Math.abs(lx) === 3 && Math.abs(ly) === 2);
                if (onPerimeter) {
                  setVox(lx + headShiftX, ly + headShiftY, 23, cGold, 2);
                }
              }
            }
            // Back Knot & Twin Trailing Ribbon Tails (-ly = -4..-6)
            setVox(headShiftX, -4 + headShiftY, 23, cGold, 2);
            setVox(-1 + headShiftX, -4 + headShiftY, 22, cGoldDark, 2);
            setVox(1 + headShiftX, -4 + headShiftY, 22, cGoldDark, 2);
            setVox(-1 + headShiftX, -5 + headShiftY, 22, cGold, 2);
            setVox(-2 + headShiftX, -6 + headShiftY, 21, cGoldDark, 2);
            setVox(1 + headShiftX, -5 + headShiftY, 21, cGold, 2);
            setVox(2 + headShiftX, -6 + headShiftY, 20, cGoldDark, 2);
          }

          // Extract Exterior Surface Voxels + 3D Outward Normals (culls interior for ultra-fast baking!)
          const surface = [];
          let minVz = 99;
          let maxVz = 0;
          const isEmpty = (ix, iy, iz) => {
            if (ix < 0 || ix >= VOX_GX || iy < 0 || iy >= VOX_GY || iz < 0 || iz >= VOX_GZ) return true;
            return workVolColor[voxIdx(ix, iy, iz)] === 0;
          };

          for (let iz = 0; iz < VOX_GZ; iz++) {
            for (let iy = 0; iy < VOX_GY; iy++) {
              for (let ix = 0; ix < VOX_GX; ix++) {
                const idx = voxIdx(ix, iy, iz);
                const rgb = workVolColor[idx];
                if (rgb === 0) continue;

                const eXp = isEmpty(ix + 1, iy, iz);
                const eXn = isEmpty(ix - 1, iy, iz);
                const eYp = isEmpty(ix, iy + 1, iz);
                const eYn = isEmpty(ix, iy - 1, iz);
                const eZp = isEmpty(ix, iy, iz + 1);
                const eZn = isEmpty(ix, iy, iz - 1);
                if (!eXp && !eXn && !eYp && !eYn && !eZp && !eZn) continue;

                let nx = (eXp ? 1 : 0) - (eXn ? 1 : 0);
                let ny = (eYp ? 1 : 0) - (eYn ? 1 : 0);
                let nz = (eZp ? 1 : 0) - (eZn ? 0.35 : 0);
                const nLen = Math.sqrt(nx * nx + ny * ny + nz * nz);
                if (nLen > 1e-4) {
                  nx /= nLen;
                  ny /= nLen;
                  nz /= nLen;
                } else {
                  nz = 1;
                }

                if (iz < minVz) minVz = iz;
                if (iz > maxVz) maxVz = iz;
                surface.push({
                  lx: ix - 10,
                  ly: iy - 10,
                  vz: iz,
                  rgb,
                  flag: workVolFlag[idx],
                  nx,
                  ny,
                  nz,
                });
              }
            }
          }

          cached = { surface, minVz, maxVz, sliceCount: maxVz - minVz + 1 };
          voxelModelCache.set(modelKey, cached);
          return cached;
        }

        /* Bake One 56x72 Stacked Frame to Pure 24-Bit RGB (-1 = Transparent, 0..0xffffff = RGB24) */
        function bakeModelAngleToRgb24(model, angleIdx, outlineMode) {
          const aIdx = ((angleIdx % STACK_ANGLES) + STACK_ANGLES) % STACK_ANGLES;
          const yaw = (aIdx / STACK_ANGLES) * Math.PI * 2;
          const cosY = Math.cos(yaw);
          const sinY = Math.sin(yaw);

          workPixBuf.fill(-1);
          workZBuf.fill(-1e9);

          const voxels = model.surface;
          for (let i = 0; i < voxels.length; i++) {
            const v = voxels[i];
            const sxLocal = -v.lx * cosY + v.ly * sinY;
            const syLocal = v.lx * sinY + v.ly * cosY;

            const rnx = -v.nx * cosY + v.ny * sinY;
            const rny = v.nx * sinY + v.ny * cosY;
            const ndotl = rnx * -0.46 + rny * 0.6 + v.nz * 0.65;
            const spotLift = (v.vz / 26) * 0.08 - 0.03;

            let mult = 1.0;
            if (v.flag === 1) {
              mult = (ndotl > 0.26 ? 1.18 : ndotl < -0.15 ? 0.8 : 1.0) + spotLift;
            } else {
              mult = ndotl > 0.25 ? 1.07 : ndotl < -0.2 ? 0.88 : 1.0;
            }
            const rgb24 = shadeRgb24(v.rgb, mult);

            const pxC = Math.round(28 + sxLocal * 2.0);

            // Sub-slice doubling: stamp at vz and vz + 0.5 for watertight 3D stack steps!
            for (let sub = 0; sub < 2; sub++) {
              const zEff = v.vz + sub * 0.5;
              const pyC = Math.round(62 + syLocal * 1.22 - zEff * 1.54);
              const score = zEff * 64 + syLocal;

              for (let dy = 0; dy <= 1; dy++) {
                const py = pyC + dy;
                if (py < 1 || py >= STACK_H - 1) continue;
                const row = py * STACK_W;
                for (let dx = -1; dx <= 1; dx++) {
                  const px = pxC + dx;
                  if (px < 1 || px >= STACK_W - 1) continue;
                  const pIdx = row + px;
                  if (score >= workZBuf[pIdx]) {
                    workZBuf[pIdx] = score;
                    workPixBuf[pIdx] = rgb24;
                  }
                }
              }
            }
          }

          // Crisp 1px Arcade Silhouette Outline (#0b1120 or #facc15 Burst Glow)
          const outlineRgb24 = outlineMode === 1 ? hexToRgb24("#facc15") : hexToRgb24("#0b1120");
          workOutBuf.set(workPixBuf);
          for (let y = 1; y < STACK_H - 1; y++) {
            const row = y * STACK_W;
            for (let x = 1; x < STACK_W - 1; x++) {
              if (workPixBuf[row + x] < 0) {
                if (
                  workPixBuf[row + x - 1] >= 0 ||
                  workPixBuf[row + x + 1] >= 0 ||
                  workPixBuf[row - STACK_W + x] >= 0 ||
                  workPixBuf[row + STACK_W + x] >= 0
                ) {
                  workOutBuf[row + x] = outlineRgb24;
                }
              }
            }
          }

          return new Int32Array(workOutBuf);
        }

        function getOrBakePlayerStackTile(p, isOffense, isMe, hasBallNow) {
          const spec = getPlayerVisualSpec(p, isOffense, isMe);
          const pose = selectPlayerPoseName(p, hasBallNow);
          const outlineMode = isMe && state.rhythm.burstBoostTimer > 0 ? 1 : 0;
          const angleIdx = facingToStackAngleIdx(p.facing !== undefined ? p.facing : p.gazeAngle);

          const rowKey = spec.key + "|" + pose + "|" + outlineMode;
          const frameKey = rowKey + "|" + angleIdx;
          let tile = stackFrameCache.get(frameKey);
          if (tile) return tile;

          const model = getOrBuildVoxelSurfaceModel(spec, pose);
          const pixels = bakeModelAngleToRgb24(model, angleIdx, outlineMode);
          const painted = paintRgb24ToImmutableCanvas(pixels, STACK_W, STACK_H);

          tile = {
            canvas: painted.canvas,
            spans: painted.spans,
            rowKey,
            frameKey,
            sx: 0,
            sy: 0,
            angleIdx,
            pose,
            sliceCount: model.sliceCount,
            pixels,
          };
          stackFrameCache.set(frameKey, tile);
          return tile;
        }

        /* Deterministic Verification Helper: Bake/Fetch Raw Int32Array RGB24 Pixels at Any Angle */
        function bakePlayerStackPixels(playerObj, poseName, angleIdx, outlineMode) {
          const p = playerObj || state.offense[0];
          const isOff = p.team !== "defense";
          const isMe = p.name === "YOU";
          const spec = getPlayerVisualSpec(p, isOff, isMe);
          const model = getOrBuildVoxelSurfaceModel(spec, poseName || "idle");
          const pixels = bakeModelAngleToRgb24(model, angleIdx || 0, outlineMode ? 1 : 0);
          return {
            width: STACK_W,
            height: STACK_H,
            sliceCount: model.sliceCount,
            angleIdx: (((angleIdx || 0) % STACK_ANGLES) + STACK_ANGLES) % STACK_ANGLES,
            pixels,
          };
        }

        /* Pre-Bake 3D Sprite-Stacked Basketball (12 Voxel Layers x 8 Immutable 28x28 Spin Canvases) */
        function initBallSpriteStack() {
          const cOrange = hexToRgb24("#ea580c");
          const cSeam = hexToRgb24("#271206");
          const outlineRgb24 = hexToRgb24("#0b1120");
          const pBuf = new Int32Array(BALL_STACK_W * BALL_STACK_H);
          const oBuf = new Int32Array(BALL_STACK_W * BALL_STACK_H);
          const zBuf = new Float32Array(BALL_STACK_W * BALL_STACK_H);

          for (let f = 0; f < BALL_SPIN_FRAMES; f++) {
            const spinYaw = (f / BALL_SPIN_FRAMES) * Math.PI * 2;
            const cosS = Math.cos(spinYaw);
            const sinS = Math.sin(spinYaw);
            pBuf.fill(-1);
            zBuf.fill(-1e9);

            for (let vz = 0; vz < BALL_STACK_LAYERS; vz++) {
              const dz = (vz - 5.5) / 5.5;
              for (let ly = -5; ly <= 5; ly++) {
                for (let lx = -5; lx <= 5; lx++) {
                  const rSq = (lx * lx + ly * ly) / 25 + dz * dz;
                  if (rSq > 1.02 || rSq < 0.42) continue;

                  const rx = -lx * cosS + ly * sinS;
                  const ry = lx * sinS + ly * cosS;
                  const isSeam = Math.abs(lx) < 0.75 || Math.abs(ly) < 0.75 || Math.abs(dz) < 0.14;

                  const nLen = Math.max(0.01, Math.sqrt(rx * rx + ry * ry + dz * 5 * (dz * 5)));
                  const ndotl = (rx * -0.45 + ry * 0.6 + dz * 5 * 0.66) / nLen;
                  const mult = isSeam ? 1.0 : ndotl > 0.35 ? 1.32 : ndotl < -0.15 ? 0.74 : 1.02;
                  const rgb24 = shadeRgb24(isSeam ? cSeam : cOrange, mult);

                  const pxC = Math.round(14 + rx * 1.55);
                  for (let sub = 0; sub < 2; sub++) {
                    const zEff = vz + sub * 0.5;
                    const pyC = Math.round(20 + ry * 0.95 - zEff * 1.05);
                    const sc = zEff * 32 + ry;
                    for (let dy = 0; dy <= 1; dy++) {
                      const py = pyC + dy;
                      if (py < 1 || py >= BALL_STACK_H - 1) continue;
                      for (let dx = 0; dx <= 1; dx++) {
                        const px = pxC + dx;
                        if (px < 1 || px >= BALL_STACK_W - 1) continue;
                        const idx = py * BALL_STACK_W + px;
                        if (sc >= zBuf[idx]) {
                          zBuf[idx] = sc;
                          pBuf[idx] = rgb24;
                        }
                      }
                    }
                  }
                }
              }
            }

            oBuf.set(pBuf);
            for (let y = 1; y < BALL_STACK_H - 1; y++) {
              const row = y * BALL_STACK_W;
              for (let x = 1; x < BALL_STACK_W - 1; x++) {
                if (pBuf[row + x] < 0) {
                  if (pBuf[row + x - 1] >= 0 || pBuf[row + x + 1] >= 0 || pBuf[row - BALL_STACK_W + x] >= 0 || pBuf[row + BALL_STACK_W + x] >= 0) {
                    oBuf[row + x] = outlineRgb24;
                  }
                }
              }
            }

            const copyPixels = new Int32Array(oBuf);
            const paintedBall = paintRgb24ToImmutableCanvas(copyPixels, BALL_STACK_W, BALL_STACK_H);
            ballFramePixels.push(copyPixels);
            ballFrameCanvases.push(paintedBall.canvas);
          }
        }

        /* Pre-Bake Initial 24-Angle Turntable for ★ YOU + 3D Ball on Load (< 25ms) */
        function initSpriteStackEngine() {
          const t0 = performance.now();
          initBallSpriteStack();
          const heroDummy = makePlayer(0, "YOU", 7, 0, 6, "offense");
          for (let a = 0; a < STACK_ANGLES; a++) {
            heroDummy.facing = Math.PI * 0.5 - (a / STACK_ANGLES) * Math.PI * 2;
            getOrBakePlayerStackTile(heroDummy, true, true, false);
          }
          initialBakeMs = performance.now() - t0;
        }

        /* Collision-Free Floating Label Layout (0 AABB Overlaps Guaranteed) */
        function resolveLabelCollisions(rawLabels, canvasW, canvasH, measureFn) {
          const sorted = rawLabels.slice().sort((a, b) => (a.priority || 5) - (b.priority || 5));
          const placed = [];
          const pad = 5;
          const boxH = 22;
          const yOffsets = [0, -26, 26, -52, 52, -78, 78, -104, 104];
          const xOffsets = [0, -32, 32, -64, 64];

          for (let i = 0; i < sorted.length; i++) {
            const item = sorted[i];
            const boxW = Math.min(canvasW - 16, Math.ceil(measureFn(item.text)) + 16);
            const anchorX = item.anchorX;
            const anchorY = item.anchorY;

            let chosenX = clamp(anchorX - boxW * 0.5, 6, Math.max(6, canvasW - boxW - 6));
            let chosenY = clamp(anchorY - boxH, 36, Math.max(36, canvasH - boxH - 6));
            let found = false;

            for (let yo = 0; yo < yOffsets.length && !found; yo++) {
              for (let xo = 0; xo < xOffsets.length && !found; xo++) {
                const candX = clamp(anchorX + xOffsets[xo] - boxW * 0.5, 6, Math.max(6, canvasW - boxW - 6));
                const candY = clamp(anchorY + yOffsets[yo] - boxH, 36, Math.max(36, canvasH - boxH - 6));
                let hit = false;
                for (let p = 0; p < placed.length; p++) {
                  const b = placed[p];
                  if (candX < b.x + b.w + pad && candX + boxW + pad > b.x && candY < b.y + b.h + pad && candY + boxH + pad > b.y) {
                    hit = true;
                    break;
                  }
                }
                if (!hit) {
                  chosenX = candX;
                  chosenY = candY;
                  found = true;
                }
              }
            }

            if (!found && placed.length > 0) {
              let lowestBottom = 36;
              for (let p = 0; p < placed.length; p++) {
                lowestBottom = Math.max(lowestBottom, placed[p].y + placed[p].h + pad);
              }
              chosenY = lowestBottom;
            }

            placed.push({
              x: chosenX,
              y: chosenY,
              w: boxW,
              h: boxH,
              anchorX,
              anchorY,
              text: item.text,
              bg: item.bg,
              fg: item.fg,
            });
          }
          return placed;
        }

        /* True 3D Multi-Angle Stacked Arena Hoop (hoopSign = +1 North Hoop, -1 South Hoop) */
        function drawStackedHoop3D(hoopSign, p2s, sxR, syR) {
          const isNorth = hoopSign >= 0;
          const baseY = isNorth ? 0.24 : COURT.fullLength - 0.24;
          const boomY0 = isNorth ? 0.28 : COURT.fullLength - 0.28;
          const boomY1 = isNorth ? 1.06 : COURT.fullLength - 1.06;
          const boardBackY = isNorth ? 1.06 : COURT.fullLength - 1.06;
          const boardFrontY = isNorth ? COURT.backboardY : COURT.southBackboardY;
          const rimY = isNorth ? COURT.rimY : COURT.southRimY;

          const padMainCol = isNorth ? "#1d4ed8" : "#b91c1c";
          const padTopCol = isNorth ? "#60a5fa" : "#f87171";
          const padSideCol = isNorth ? "#1e3a8a" : "#7f1d1d";

          const drawStanchionAndBoom = () => {
            for (let k = 0; k < 12; k++) {
              const wz = (k / 11) * 1.45;
              const pt = p2s(0, baseY, wz);
              const scaleM = clamp(pt.s * 1.45, 0.55, 1.35);
              const pw = (15.5 - k * 0.24) * scaleM * sxR;
              const ph = 5.0 * scaleM * syR;
              ctxA.fillStyle = "#0b1120";
              ctxA.fillRect(pt.x - pw * 0.5 - 1, pt.y - ph * 0.5 - 1, pw + 2, ph + 2);
              ctxA.fillStyle = k === 11 ? padTopCol : padMainCol;
              ctxA.fillRect(pt.x - pw * 0.5, pt.y - ph * 0.5, pw * 0.65, ph);
              ctxA.fillStyle = k === 11 ? padMainCol : padSideCol;
              ctxA.fillRect(pt.x + pw * 0.15, pt.y - ph * 0.5, pw * 0.35, ph);
            }

            for (let k = 0; k <= 14; k++) {
              const t = k / 14;
              const pt = p2s(0, lerp(boomY0, boomY1, t), lerp(1.4, 3.18, t));
              const scaleM = clamp(pt.s * 1.45, 0.55, 1.35);
              const bw = 6.2 * scaleM * sxR;
              ctxA.fillStyle = "#0b1120";
              ctxA.fillRect(pt.x - bw * 0.5 - 1, pt.y - 3, bw + 2, 6);
              ctxA.fillStyle = "#94a3b8";
              ctxA.fillRect(pt.x - bw * 0.5, pt.y - 2, bw * 0.55, 4);
              ctxA.fillStyle = "#475569";
              ctxA.fillRect(pt.x + bw * 0.05, pt.y - 2, bw * 0.45, 4);
            }
          };

          const fillQuad = (p0, p1, p2, p3, fill, stroke, lw) => {
            ctxA.beginPath();
            ctxA.moveTo(p0.x, p0.y);
            ctxA.lineTo(p1.x, p1.y);
            ctxA.lineTo(p2.x, p2.y);
            ctxA.lineTo(p3.x, p3.y);
            ctxA.closePath();
            if (fill) {
              ctxA.fillStyle = fill;
              ctxA.fill();
            }
            if (stroke) {
              ctxA.strokeStyle = stroke;
              ctxA.lineWidth = lw || 1.8;
              ctxA.stroke();
            }
          };

          const drawBackboard3D = () => {
            const hw = COURT.backboardHalfW;
            const bTL = p2s(-hw, boardBackY, 3.98);
            const bTR = p2s(hw, boardBackY, 3.98);
            const bBR = p2s(hw, boardBackY, 2.9);
            const bBL = p2s(-hw, boardBackY, 2.9);

            const fTL = p2s(-hw, boardFrontY, 3.98);
            const fTR = p2s(hw, boardFrontY, 3.98);
            const fBR = p2s(hw, boardFrontY, 2.9);
            const fBL = p2s(-hw, boardFrontY, 2.9);

            const frontCloser = fTL.camDepth >= bTL.camDepth;
            if (frontCloser) {
              fillQuad(bTL, bTR, bBR, bBL, "#334155", "#0b1120", 1.8);
            }
            // Extruded 3D side bevels
            fillQuad(bTL, bTR, fTR, fTL, "#64748b", "#0b1120", 1.4);
            fillQuad(bBL, fBL, fTL, bTL, "#475569", "#0b1120", 1.4);
            fillQuad(bBR, fBR, fTR, bTR, "#475569", "#0b1120", 1.4);

            // Tempered glass face + red shooter's square
            fillQuad(fTL, fTR, fBR, fBL, "rgba(226, 232, 240, 0.88)", "#0b1120", 2.8);
            fillQuad(fTL, fTR, fBR, fBL, null, "#ffffff", 1.8);

            const sqTL = p2s(-0.3, boardFrontY, 3.52);
            const sqTR = p2s(0.3, boardFrontY, 3.52);
            const sqBR = p2s(0.3, boardFrontY, 3.06);
            const sqBL = p2s(-0.3, boardFrontY, 3.06);
            fillQuad(sqTL, sqTR, sqBR, sqBL, null, isNorth ? "#ef4444" : "#f97316", 1.8);

            if (!frontCloser) {
              fillQuad(bTL, bTR, bBR, bBL, "rgba(51, 65, 85, 0.55)", "#0b1120", 2.0);
            }
          };

          const drawRimAndNet3D = () => {
            const swish = state.fx.netSwishTimer > 0 && state.fx.netSwishHoop === hoopSign ? state.fx.netSwishTimer : 0;
            const waveX = swish > 0 ? Math.sin(state.simTime * 30) * 0.08 * swish : 0;
            const liftZ = swish > 0 ? Math.abs(Math.sin(state.simTime * 22)) * 0.16 * swish : 0;
            const netBotZ = COURT.rimZ - (0.42 - liftZ);

            // Rippling 3D White Net Strands
            ctxA.strokeStyle = "rgba(255, 255, 255, 0.92)";
            ctxA.lineWidth = 1.4;
            const netSegs = 8;
            for (let i = 0; i < netSegs; i++) {
              const ang = (i / netSegs) * Math.PI * 2;
              const topP = p2s(Math.cos(ang) * 0.25, rimY + Math.sin(ang) * 0.25, COURT.rimZ);
              const botP = p2s(Math.cos(ang) * 0.15 + waveX, rimY + Math.sin(ang) * 0.15, netBotZ);
              ctxA.beginPath();
              ctxA.moveTo(topP.x, topP.y);
              ctxA.lineTo(botP.x, botP.y);
              ctxA.stroke();
            }

            // Mid-net ring
            ctxA.beginPath();
            for (let i = 0; i <= 12; i++) {
              const ang = (i / 12) * Math.PI * 2;
              const mp = p2s(Math.cos(ang) * 0.19 + waveX * 0.5, rimY + Math.sin(ang) * 0.19, lerp(COURT.rimZ, netBotZ, 0.52));
              if (i === 0) ctxA.moveTo(mp.x, mp.y);
              else ctxA.lineTo(mp.x, mp.y);
            }
            ctxA.stroke();

            // Rim bracket
            const brk = p2s(0, boardFrontY + hoopSign * 0.06, COURT.rimZ);
            ctxA.fillStyle = "#c2410c";
            ctxA.fillRect(brk.x - 3.5 * sxR, brk.y - 2.5, 7 * sxR, 5);

            // 5-Layer Stacked 3D Orange Cylinder Rim
            const rimCols = ["#0b1120", "#9a3412", "#ea580c", "#fb923c", "#fed7aa"];
            for (let s = 0; s < 5; s++) {
              const rz = COURT.rimZ + (s - 1) * 0.022;

              ctxA.lineWidth = s === 0 ? 4.0 : 2.1;
              ctxA.beginPath();
              for (let i = 0; i <= 16; i++) {

          const parts = [
            { depth: project3D(0, baseY, 1.0).camDepth, fn: drawStanchionAndBoom },
            { depth: project3D(0, boardFrontY, 3.4).camDepth, fn: drawBackboard3D },
            { depth: project3D(0, rimY, COURT.rimZ).camDepth, fn: drawRimAndNet3D },

        /* =====================================================================
         * 10B. Authentic 7-Year-Old Youth Athlete (~5.2 Heads Tall, H = 1.28m)
         *      60fps Continuous 15-Joint Biomechanical 3D Rig + Per-Limb Sort!
         * ===================================================================== */
        function solveTwoBoneIK3D(root, target, L1, L2, pole) {
          const dx = target.x - root.x;
          const dy = target.y - root.y;
          const dz = target.z - root.z;
          const rawDist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          const minReach = Math.abs(L1 - L2) + 0.008;
          const maxReach = L1 + L2 - 0.003;
          const d = clamp(rawDist, minReach, maxReach);
          const invR = rawDist > 1e-5 ? 1.0 / rawDist : 0;
          const ux = rawDist > 1e-5 ? dx * invR : 0;
          const uy = rawDist > 1e-5 ? dy * invR : 0;
          const uz = rawDist > 1e-5 ? dz * invR : -1;

          const cosA = clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1);
          const along = L1 * cosA;
          const h = Math.sqrt(Math.max(0, L1 * L1 - along * along));

          // Gram-Schmidt orthogonalize pole hint against axis u
          const dotPU = pole.x * ux + pole.y * uy + pole.z * uz;
          let vx = pole.x - ux * dotPU;
          let vy = pole.y - uy * dotPU;
          let vz = pole.z - uz * dotPU;
          let vLen = Math.sqrt(vx * vx + vy * vy + vz * vz);
          if (vLen < 1e-5) {
            vx = 0;
            vy = 1;
            vz = 0;
            const d2 = vy * uy;
            vx -= ux * d2;
            vy -= uy * d2;
            vz -= uz * d2;
            vLen = Math.max(1e-5, Math.sqrt(vx * vx + vy * vy + vz * vz));
          }
          vx /= vLen;
          vy /= vLen;
          vz /= vLen;

          return {
            mid: {
              x: root.x + ux * along + vx * h,
              y: root.y + uy * along + vy * h,
              z: root.z + uz * along + vz * h,
            },
            end: {
              x: root.x + ux * d,
              y: root.y + uy * d,
              z: root.z + uz * d,
            },
          };
        }

        /* Solve Continuous 60fps 15-Joint 3D Rig for a 7-Year-Old Kid (H = 1.280m, 5.22 Heads Tall!) */
        function solvePlayerRig3D(p, opts) {
          const o = opts || {};
          const isOff = o.isOffense !== undefined ? !!o.isOffense : p.team === "offense";
          const userDefNow = isUserOnDefenseNow();
          const isMe =
            o.isMe !== undefined
              ? !!o.isMe
              : p.name === "YOU" ||
                (isOff && (state.fullCourt || state.role === "offense") && p.id === 0) ||
                (!isOff && !state.fullCourt && state.role === "defense" && p.id === 0);
          const hasBallNow =
            o.hasBallNow !== undefined
              ? !!o.hasBallNow
              : !state.ball.inFlight &&
                !state.ball.loose &&
                ((isOff && state.ball.holderTeam === "offense") || (!isOff && state.ball.holderTeam === "defense")) &&
                state.ball.holderIdx === p.id;
          const t = o.simTime !== undefined ? o.simTime : state.simTime;
          const ballZ = o.ballZ !== undefined ? o.ballZ : state.ball.z;

          } else if (hasBallNow && !isAirborne) {

            fwdPitch = Math.max(fwdPitch, isCross ? 0.22 : 0.14);
            if (isCross) sideRoll = crossDir * 0.23;

            y: pelvis.y + sinP * upDist,

          const chest = spinePoint(0.285);
          const shoulderCenter = spinePoint(0.365);
          const neck = spinePoint(0.435);

          const shHalf = 0.165;
          const hipHalf = 0.094;
          const overheadLiftL = p.contestTimer > 0 || (isShootFollow && !p.layupMode) ? 0.055 : 0;
          const overheadLiftR = p.contestTimer > 0 || isShootFollow ? 0.065 : 0;
          const L_shoulder = {
            x: shoulderCenter.x - shHalf,
            y: shoulderCenter.y - sideRoll * 0.04,
            z: shoulderCenter.z - sinR * shHalf * 0.55 + overheadLiftL,
          };
          const R_shoulder = {
            x: shoulderCenter.x + shHalf,
            y: shoulderCenter.y + sideRoll * 0.04,
            z: shoulderCenter.z + sinR * shHalf * 0.55 + overheadLiftR,
          };
          const L_hip = { x: pelvis.x - hipHalf, y: pelvis.y, z: pelvis.z };
          const R_hip = { x: pelvis.x + hipHalf, y: pelvis.y, z: pelvis.z };

          // 2. Two-Joint Legs (Hip -> Knee -> Ankle -> Sneaker Toe)
          let targAnkL, targAnkR;
          if (isAirborne) {
            if (p.layupMode && p.contestTimer <= 0) {

              targAnkL = { x: -0.105, y: -0.1, z: 0.075 };

            } else if (p.contestTimer > 0) {
              targAnkL = { x: -0.135, y: 0.03, z: 0.085 };
              targAnkR = { x: 0.135, y: 0.03, z: 0.085 };
            } else {
              // Balanced Jumpshot Airborne Alignment (slight sweep forward)

              targAnkR = { x: 0.092, y: 0.08, z: 0.082 };
            }
          } else if (p.stealLungeTimer > 0) {
            targAnkL = { x: -0.145, y: -0.17, z: ANKLE_BASE_Z };
            targAnkR = { x: 0.165, y: 0.25, z: ANKLE_BASE_Z + 0.01 };
          } else if (p.offBalanceTimer > 0) {

            targAnkL = { x: -0.185 + wob, y: -0.12, z: ANKLE_BASE_Z + 0.02 };

          } else if (isDefendingNow && spd < 4.35) {

            const shuf = Math.sin(ph) * 0.075 * runBlend;
            const liftShufL = Math.max(0, Math.cos(ph)) * 0.045 * runBlend;

            targAnkL = { x: -0.178 - Math.max(0, shuf), y: -0.02 + shuf * 0.3, z: ANKLE_BASE_Z + liftShufL };
            targAnkR = { x: 0.178 + Math.max(0, -shuf), y: 0.02 - shuf * 0.3, z: ANKLE_BASE_Z + liftShufR };

            targHandL = { x: -0.32, y: 0.17, z: chest.z + 0.11 + sway };

              x: 0.185 - 0.03 * sprintBlend,
              y: 0.03 + swR * swingAmp,

            const isSlashingCutter =

            if (isSlashingCutter) {

          const ribbonKnot = { x: head.x, y: head.y - 0.098, z: head.z + 0.028 };
          const ribbonTipL = { x: ribbonKnot.x - 0.042 + flutterA, y: ribbonKnot.y - 0.095 - trailDrag, z: ribbonKnot.z - dropTail };
          const ribbonTipR = { x: ribbonKnot.x + 0.042 + flutterB, y: ribbonKnot.y - 0.088 - trailDrag * 0.9, z: ribbonKnot.z - dropTail - 0.015 };

            pelvis,
            waist,
            chest,
            shoulderCenter,
            neck,
            head,
            headTop,
            L_shoulder,
            R_shoulder,
            L_elbow,
            R_elbow,
            L_hand,
            R_hand,
            L_hip,
            R_hip,
            L_knee,
            R_knee,
            L_ankle,
            R_ankle,
            L_toe,
            R_toe,

          const keysList = Object.keys(local);

            const pt = local[key];
            world[key] = {
              x: p.x + cosF * pt.y + rx * pt.x,
              y: p.y + sinF * pt.y + ry * pt.x,
              z: jumpZ + pt.z,
            };
            renderWorld[key] = {
              x: p.x + (cosF * pt.y + rx * pt.x) * visScale,
              y: p.y + (sinF * pt.y + ry * pt.x) * visScale,
              z: (jumpZ + pt.z) * visScale,
            };
          }

          const soleZ = Math.min(0, L_toe.z - 0.022, R_toe.z - 0.022);
          const totalHeight = headTop.z - soleZ;
          const headHeight = headTop.z - neck.z;
          const hipZ = pelvis.z - soleZ;

          return {
            local,
            world,
            renderWorld,
            totalHeight,
            headHeight,
            headRatio: headHeight / Math.max(0.01, totalHeight),
            hipZ,
            legRatio: hipZ / Math.max(0.01, totalHeight),
            headTopZ: world.headTop.z,
            gooseneckR,
            isDefendingNow,
            facing: fAng,
            cosF,
            sinF,
            visScale,
          };
        }

        /* Volumetric Tapered Capsule Limb Helper (Crisp Outer Halo + #0f172a Outline + Shaded Base) */
        function drawTaperedCapsule2D(ctx, p0, p1, r0, r1, fillCol, hiCol, outlineCol, lw) {
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.hypot(dx, dy);
          const strokeW = lw || 1.5;
          if (len < 0.4) {
            const rad = Math.max(1.2, (r0 + r1) * 0.5);
            ctx.beginPath();
            ctx.arc(p0.x, p0.y, rad, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
            ctx.lineWidth = strokeW + 1.4;
            ctx.stroke();
            ctx.fillStyle = fillCol;
            ctx.fill();
            ctx.strokeStyle = outlineCol || "#0f172a";
            ctx.lineWidth = strokeW;
            ctx.stroke();
            return;
          }
          const nx = -dy / len;
          const ny = dx / len;
          const ang = Math.atan2(dy, dx);

          ctx.beginPath();
          ctx.arc(p0.x, p0.y, r0, ang + Math.PI * 0.5, ang - Math.PI * 0.5, false);
          ctx.arc(p1.x, p1.y, r1, ang - Math.PI * 0.5, ang + Math.PI * 0.5, false);
          ctx.closePath();

          // Subtle high-contrast outer rim halo so overlapping limbs separate cleanly
          ctx.strokeStyle = "rgba(255, 255, 255, 0.28)";
          ctx.lineWidth = strokeW + 1.4;
          ctx.stroke();

          ctx.fillStyle = fillCol;
          ctx.fill();

          if (hiCol) {
            ctx.save();
            ctx.strokeStyle = hiCol;
            ctx.lineWidth = Math.max(1.0, Math.min(r0, r1) * 0.48);
            ctx.beginPath();
            ctx.moveTo(p0.x + nx * r0 * 0.36, p0.y + ny * r0 * 0.36);
            ctx.lineTo(p1.x + nx * r1 * 0.36, p1.y + ny * r1 * 0.36);
            ctx.stroke();
            ctx.restore();
          }

          ctx.strokeStyle = outlineCol || "#0f172a";
          ctx.lineWidth = strokeW;
          ctx.stroke();
        }

        function drawBasketballVolumetric3D(ctx, p2s, sxR, syR, bx, by, bz, drawTrailAndShadow) {
          const bFloor = p2s(bx, by, 0);
          const bAir = p2s(bx, by, bz);
          const ballMPx = clamp(bFloor.s * (state.fullCourt ? 52.0 : 45.5), 18.0, 74.0) * Math.min(sxR, syR);
          const rBall = clamp(ballMPx * 0.106, 4.6, 13.5);
          const shadowShrink = clamp(1.0 - bz * 0.12, 0.4, 1.0);

          if (drawTrailAndShadow && state.ball.inFlight && state.ball.trail.length > 0) {
            for (let t = 0; t < state.ball.trail.length; t++) {
              const tr = state.ball.trail[t];
              const tp = p2s(tr.x, tr.y, tr.z);
              const tFrac = (t + 1) / (state.ball.trail.length + 1);
              const alpha = tFrac * 0.42;
              ctx.fillStyle = "rgba(251, 146, 60, " + alpha.toFixed(2) + ")";
              ctx.beginPath();
              ctx.arc(tp.x, tp.y, Math.max(2.2, rBall * 0.68 * tFrac), 0, Math.PI * 2);
              ctx.fill();
            }
          }

          if (drawTrailAndShadow) {
            ctx.fillStyle = "rgba(15, 23, 42, 0.42)";
            ctx.beginPath();
            ctx.ellipse(bFloor.x, bFloor.y, rBall * 1.02 * shadowShrink, rBall * 0.4 * shadowShrink, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          // Smooth Volumetric Basketball Sphere + Outer Contrast Halo + Spinning Seam Ribs!
          ctx.save();
          ctx.imageSmoothingEnabled = true;
          ctx.beginPath();
          ctx.arc(bAir.x, bAir.y, rBall, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.48)";
          ctx.lineWidth = 3.0;
          ctx.stroke();
          ctx.fillStyle = "#ea580c";
          ctx.fill();
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Warm upper-left 3D sphere highlight + lower-right shade crescent
          ctx.fillStyle = "#fb923c";
          ctx.beginPath();
          ctx.arc(bAir.x - rBall * 0.24, bAir.y - rBall * 0.24, rBall * 0.56, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fed7aa";
          ctx.beginPath();
          ctx.arc(bAir.x - rBall * 0.34, bAir.y - rBall * 0.34, rBall * 0.22, 0, Math.PI * 2);
          ctx.fill();

          // Rotating 3D Basketball Seams
          const sp = state.ball.spinPhase;
          ctx.strokeStyle = "#271206";
          ctx.lineWidth = Math.max(1.2, rBall * 0.14);
          ctx.beginPath();
          ctx.ellipse(bAir.x, bAir.y, rBall * 0.92, Math.max(1.2, Math.abs(Math.sin(sp)) * rBall * 0.88), 0.25, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(bAir.x - rBall * 0.92, bAir.y);
          ctx.lineTo(bAir.x + rBall * 0.92, bAir.y);
          ctx.stroke();

          // Re-stroke crisp outer silhouette
          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(bAir.x, bAir.y, rBall, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        /* Deterministic Helper to Measure Exact Projected Head-to-Ankle Screen Height (px) */
        function measurePlayerScreenHeight(p, opts) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const W = Math.max(1, (canvasA.width || 640) / dpr);
          const H = Math.max(1, (canvasA.height || 480) / dpr);
          const syR = H / REF_H;
          const sxR = W / REF_W;
          const visScale = state.fullCourt ? 1.96 : 1.72;
          const rig = solvePlayerRig3D(p, Object.assign({ visScale }, opts || {}));
          const rw = rig.renderWorld;
          const pTop = project3D(rw.headTop.x, rw.headTop.y, rw.headTop.z);
          const pAnkL = project3D(rw.L_ankle.x, rw.L_ankle.y, rw.L_ankle.z);
          const pAnkR = project3D(rw.R_ankle.x, rw.R_ankle.y, rw.R_ankle.z);
          const ankY = Math.max(pAnkL.y, pAnkR.y) * syR;
          const topY = pTop.y * syR;
          const pFloorS = project3D(p.x, p.y, 0).s;
          const mPx = clamp(pFloorS * (state.fullCourt ? 52.0 : 45.5), 18.0, 86.0) * Math.min(sxR, syR);
          const headRx = Math.max(4.4, mPx * 0.112);
          const ballMPx = clamp(pFloorS * (state.fullCourt ? 52.0 : 45.5), 18.0, 74.0) * Math.min(sxR, syR);
          const rBall = clamp(ballMPx * 0.106, 4.6, 13.5);
          return {
            pixelHeight: ankY - topY,
            refHeight: Math.max(pAnkL.y, pAnkR.y) - pTop.y,
            mPx,
            headRx,
            rBall,
            headRatio: rig.headRatio,
            visScale,
          };
        }

        /* Render 7-Year-Old Articulated Player with Per-Limb 3D Depth Sorting (Zero putImageData!) */
        function drawArticulatedPlayer3D(ctx, item, p2s, sxR, syR) {
          const p = item.p;
          const isOff = item.isOffense;
          const isMe = item.isMe;
          const hasBallNow = item.hasBallNow;

          const visScale = state.fullCourt ? 1.96 : 1.72;
          const rig = solvePlayerRig3D(p, { isOffense: isOff, isMe, hasBallNow, visScale });
          const rw = rig.renderWorld;
          const floorProj = p2s(p.x, p.y, 0);
          const mPx = clamp(floorProj.s * (state.fullCourt ? 52.0 : 45.5), 18.0, 86.0) * Math.min(sxR, syR);
          const inkCol = isMe && state.rhythm.burstBoostTimer > 0 ? "#facc15" : "#0f172a";
          const inkW = isMe && state.rhythm.burstBoostTimer > 0 ? 2.3 : 1.7;

          // Pure Team Palettes (Blue Team ONLY uses Blue/Navy/Sky/Gold/White; Red Team uses Red/Crimson!)
          const jerseyMain = isOff ? "#2563eb" : "#dc2626";
          const jerseyShade = isOff ? "#1d4ed8" : "#991b1b";
          const jerseyHi = isOff ? "#60a5fa" : "#f87171";
          const shortsMain = isOff ? "#1e40af" : "#b91c1c";
          const shortsShade = isOff ? "#1e3a8a" : "#7f1d1d";
          const trimCol = isMe ? "#facc15" : "#ffffff";
          const shoeCol = isOff ? "#2563eb" : "#dc2626";
          const skinMain = p.skinMid || "#e2a872";
          const skinHi = p.skinLight || "#f6c89a";
          const skinDark = p.skinDark || "#b87b45";
          const hairCol = p.hairColor || "#18181b";

          // Project all 3D joints to 2D screen + camDepth
          const S = {};
          const rKeys = Object.keys(rw);
          for (let i = 0; i < rKeys.length; i++) {
            const k = rKeys[i];
            S[k] = p2s(rw[k].x, rw[k].y, rw[k].z);
          }

          const fAng = rig.facing;
          const screenFAng = fAng - state.cam.yaw;
          const cosCam = Math.cos(state.cam.yaw);
          const sinCam = Math.sin(state.cam.yaw);
          // Camera looks from (-sinCam, +cosCam): frontDot > 0 means player's front chest/face faces camera!
          const frontDot = -rig.cosF * sinCam + rig.sinF * cosCam;
          const sideDot = rig.cosF * cosCam + rig.sinF * sinCam;

          ctx.save();
          ctx.imageSmoothingEnabled = true;

          // 1. Ball-Handler Double Spotlight Ring + ★ YOU Golden Floor Ring + Contact Shadow
          const shadowScale = clamp(1.0 - (p.jumpZ || 0) * 0.18, 0.52, 1.0);
          if (hasBallNow) {
            const bPulse = 1 + Math.sin(state.simTime * 8.5) * 0.06;
            ctx.save();
            ctx.fillStyle = "rgba(249, 115, 22, 0.24)";
            ctx.beginPath();
            ctx.ellipse(floorProj.x, floorProj.floorY, mPx * 0.54 * bPulse, mPx * 0.22 * bPulse, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#fb923c";
            ctx.lineWidth = 3.0;
            ctx.stroke();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.ellipse(floorProj.x, floorProj.floorY, mPx * 0.42 * bPulse, mPx * 0.17 * bPulse, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
          if (isMe) {
            ctx.save();
            ctx.strokeStyle = "#facc15";
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.ellipse(floorProj.x, floorProj.floorY, mPx * 0.48, mPx * 0.2, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "#fef08a";
            ctx.beginPath();
            ctx.arc(
              floorProj.x + Math.cos(screenFAng) * mPx * 0.52,
              floorProj.floorY + Math.sin(screenFAng) * mPx * 0.22,
              Math.max(2.8, mPx * 0.085),
              0,
              Math.PI * 2
            );
            ctx.fill();
            ctx.restore();
          }

          ctx.fillStyle = "rgba(15, 23, 42, 0.44)";
          ctx.beginPath();
          ctx.ellipse(floorProj.x, floorProj.floorY, mPx * 0.34 * shadowScale, mPx * 0.13 * shadowScale, 0, 0, Math.PI * 2);
          ctx.fill();

          // Speed / Crossover Motion Afterimage Ghost
          if (isMe && state.rhythm.crossoverTimer > 0.22) {
            const gShift = -state.rhythm.crossoverDir * mPx * 0.38;
            ctx.fillStyle = "rgba(56, 189, 248, 0.24)";
            ctx.beginPath();
            ctx.ellipse(S.chest.x + gShift, (S.chest.y + S.pelvis.y) * 0.5, mPx * 0.18, mPx * 0.34, 0, 0, Math.PI * 2);
            ctx.fill();
          }

          // Helper: Draw One 2-Joint Leg (Thigh + Athletic Shorts Cuff + Calf + Crew Sock + 2-Tone Sneaker)
          const makeLegDrawer = (isRight) => {
            const hip = isRight ? S.R_hip : S.L_hip;
            const knee = isRight ? S.R_knee : S.L_knee;
            const ankle = isRight ? S.R_ankle : S.L_ankle;
            const toe = isRight ? S.R_toe : S.L_toe;
            const sockMid = { x: lerp(knee.x, ankle.x, 0.52), y: lerp(knee.y, ankle.y, 0.52) };
            const shortHem = { x: lerp(hip.x, knee.x, 0.62), y: lerp(hip.y, knee.y, 0.62) };

            return () => {
              // Bare lower thigh + knee cap
