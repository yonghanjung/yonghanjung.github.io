<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex" />
  <title>HOOP KID - Spacing &amp; Defense Arcade Coach</title>
  <style>
    :root {
      --bg-arena: #0b1120;
      --bg-card: #151f32;
      --bg-strip: #1e293b;
      --bg-pill: #0f172a;
      --border-card: #2d3d59;
      --ink-bright: #f8fafc;
      --ink-muted: #94a3b8;
      --blue-main: #2563eb;
      --blue-glow: #3b82f6;
      --red-main: #dc2626;
      --red-glow: #ef4444;
      --green-main: #16a34a;
      --green-bright: #22c55e;
      --gold-main: #eab308;
      --gold-bright: #facc15;
      --orange-main: #ea580c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 10px 14px 16px;
      font-family: "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #172554 0%, var(--bg-arena) 68%);
      color: var(--ink-bright);
      min-height: 100vh;
      user-select: none;
    }

    .app-shell {
      max-width: 1480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Top Arena Bar */
    .top-header {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fb923c, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      box-shadow: 0 3px 10px rgba(234, 88, 12, 0.45);
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.16);
      color: var(--gold-bright);
      border: 1px solid rgba(250, 204, 21, 0.4);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .btn-group {
      display: inline-flex;
      background: var(--bg-pill);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid #26354d;
      gap: 3px;
      align-items: center;
    }

    button {
      font-family: inherit;
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 9px;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.14s ease, color 0.14s ease;
      white-space: nowrap;
    }

    button:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    button:active {
      transform: scale(0.96);
    }

    button.active {
      background: #334155;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    button.active-blue {
      background: linear-gradient(180deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.45);
    }

    button.active-red {
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.45);
    }

    button.action-pill {
      background: var(--bg-strip);
      color: #e2e8f0;
      border: 1.5px solid #334155;
      border-bottom-width: 3px;
      padding: 6px 11px;
      border-radius: 10px;
    }

    button.action-pill.active {
      background: rgba(22, 163, 74, 0.25);
      border-color: #22c55e;
      color: #86efac;
    }

    button.action-pill.paused {
      background: rgba(234, 179, 8, 0.25);
      border-color: var(--gold-bright);
      color: #fef08a;
    }

    /* Mode Cards & Match Controls Strip */
    .control-strip {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 16px;
      padding: 7px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .scenario-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .scenario-btn {
      background: var(--bg-strip);
      color: #cbd5e1;
      border: 2px solid #334155;
      border-bottom-width: 3px;
      border-radius: 11px;
      padding: 7px 13px;
      font-size: 13.5px;
      font-weight: 900;
      letter-spacing: 0.01em;
    }

    .scenario-btn.learn-card {
      border-color: #ca8a04;
      color: #fde047;
    }

    .scenario-btn.learn-card.active {
      background: linear-gradient(180deg, #eab308, #ca8a04);
      border-color: #fef08a;
      color: #0f172a;
      box-shadow: 0 3px 12px rgba(234, 179, 8, 0.4);
    }

    .scenario-btn.match-card {
      border-color: #0ea5e9;
      color: #7dd3fc;
    }

    .scenario-btn.match-card.active {
      background: linear-gradient(180deg, #0284c7, #0369a1);
      border-color: #7dd3fc;
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(14, 165, 233, 0.45);
    }

    .scenario-btn.active {
      background: linear-gradient(180deg, #f97316, #c2410c);
      border-color: #fdba74;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(249, 115, 22, 0.35);
    }

    .scenario-btn.def-drill.active {
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      border-color: #fca5a5;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(239, 68, 68, 0.38);
    }

    .right-sub-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .match-hud {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .match-hud.visible {
      display: inline-flex;
    }

    .score-pill {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 13.5px;
      font-weight: 900;
      color: #f8fafc;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .score-pill .s-you { color: #60a5fa; }
    .score-pill .s-cpu { color: #f87171; }
    .score-pill .s-stop { color: #4ade80; }

    /* Interactive 4-Step Tutorial Strip */
    .tutorial-strip {
      background: #172554;
      border: 2px solid #3b82f6;
      border-radius: 14px;
      padding: 6px 12px;
      display: none;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tutorial-strip.visible {
      display: flex;
    }

    .tut-steps-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .tut-step-pill {
      background: #0f172a;
      border: 2px solid #334155;
      color: #94a3b8;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 900;
    }

    .tut-step-pill.done {
      background: rgba(22, 163, 74, 0.25);
      border-color: #22c55e;
      color: #86efac;
    }

    .tut-step-pill.current {
      background: #facc15;
      border-color: #fef08a;
      color: #0f172a;
    }

    .tut-nav-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tut-nav-btn {
      background: #1e293b;
      border: 1.5px solid #475569;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .tut-grad-btn {
      background: #22c55e;
      color: #052e16;
      border-radius: 9px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 900;
    }

    /* Ultra-Clean Single-Line Kid Callout Banner */
    .coach-banner {
      background: linear-gradient(90deg, #1e293b 0%, #0f172a 100%);
      border: 2.5px solid #475569;
      border-radius: 16px;
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .coach-banner.tone-good {
      background: linear-gradient(90deg, #052e16 0%, #14532d 100%);
      border-color: #22c55e;
    }

    .coach-banner.tone-warn {
      background: linear-gradient(90deg, #431407 0%, #7c2d12 100%);
      border-color: #fb923c;
    }

    .coach-banner.tone-celebrate {
      background: linear-gradient(90deg, #172554 0%, #1e40af 100%);
      border-color: #facc15;
    }

    .coach-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .coach-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      flex-shrink: 0;
    }

    .coach-main-msg {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .status-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .live-badge {
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 900;
      background: #0f172a;
      border: 2px solid #475569;
      color: #e2e8f0;
    }

    .live-badge.pace-walk { border-color: #64748b; color: #cbd5e1; }
    .live-badge.pace-hesi { background: #422006; border-color: #facc15; color: #fef08a; }
    .live-badge.pace-sprint { background: #431407; border-color: #fb923c; color: #fed7aa; }
    .live-badge.pace-cop { background: #052e16; border-color: #4ade80; color: #bbf7d0; transform: scale(1.05); }
    .live-badge.pace-cross { background: #172554; border-color: #38bdf8; color: #bae6fd; transform: scale(1.05); }

    .live-badge.space-good { background: #052e16; border-color: #22c55e; color: #86efac; }
    .live-badge.space-warn { background: #431407; border-color: #f97316; color: #fdba74; }
    .live-badge.space-block { background: #450a0a; border-color: #ef4444; color: #fca5a5; }
    .live-badge.space-ball { background: #172554; border-color: #60a5fa; color: #bfdbfe; }

    /* Dual / Single Court Stage */
    .court-stage {
      display: grid;
      grid-template-columns: 1.22fr 1fr;
      gap: 12px;
      min-height: 460px;
    }

    .court-stage.mode-a-only,
    .court-stage.mode-b-only {
      grid-template-columns: 1fr;
    }

    .court-stage.mode-a-only .panel-b { display: none; }
    .court-stage.mode-b-only .panel-a { display: none; }

    .view-card {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 18px;
      padding: 8px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
    }

    .view-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .view-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 900;
      color: #e2e8f0;
    }

    .view-pill {
      font-size: 11px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.2);
      color: #fdba74;
      border: 1px solid rgba(249, 115, 22, 0.45);
    }

    .view-pill.pill-b {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.45);
    }

    .view-legend {
      display: flex;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-muted);
    }

    .canvas-holder {
      position: relative;
      width: 100%;
      height: 448px;
      border-radius: 13px;
      overflow: hidden;
      background: #090d16;
      border: 2px solid #334155;
    }

    .court-stage.mode-a-only .canvas-holder,
    .court-stage.mode-b-only .canvas-holder {
      height: 540px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bottom Arcade Keycap Deck (Pure Visual, Zero Long Text) */
    .bottom-bar {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 16px;
      padding: 9px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .keycap-deck {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .wasd-cluster {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 46px);
      gap: 5px;
    }

    .extra-keys-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .keycap-btn {
      position: relative;
      background: #1e293b;
      border: 2px solid #475569;
      border-bottom-width: 4px;
      border-radius: 11px;
      color: #f8fafc;
      font-weight: 900;
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      touch-action: none;
    }

    .keycap-btn .k-main {
      font-size: 14.5px;
      font-weight: 900;
    }

    .keycap-btn .k-sub {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
    }

    .keycap-btn.wide-shift { min-width: 98px; height: 50px; }
    .keycap-btn.wide-space { min-width: 132px; height: 50px; border-color: #3b82f6; }
    .keycap-btn.wide-call { min-width: 96px; height: 50px; }

    @keyframes keyPulseGlow {
      0%, 100% {
        box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.55), 0 4px 14px rgba(234, 179, 8, 0.45);
        transform: translateY(-2px) scale(1.05);
      }
      50% {
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.7), 0 6px 18px rgba(34, 197, 94, 0.5);
        transform: translateY(-4px) scale(1.09);
      }
    }

    .keycap-btn.key-glow {
      background: linear-gradient(180deg, #fef08a 0%, #facc15 100%);
      border-color: #ca8a04;
      color: #0f172a;
      animation: keyPulseGlow 0.9s infinite ease-in-out;
      z-index: 2;
    }

    .keycap-btn.key-glow .k-sub {
      color: #713f12;
    }

    .keycap-btn.key-glow::after {
      content: "PRESS!";
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: #052e16;
      font-size: 9.5px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 999px;
      pointer-events: none;
    }

    .keycap-btn.pressed {
      background: var(--orange-main) !important;
      border-color: #fdba74 !important;
      border-bottom-width: 2px;
      color: #ffffff !important;
      transform: translateY(2px) scale(0.96) !important;
      animation: none !important;
    }

    .keycap-btn.pressed .k-sub {
      color: #ffedd5 !important;
    }

    @media (max-width: 980px) {
      .court-stage { grid-template-columns: 1fr; }
      .canvas-holder { height: 380px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-header">
      <div class="brand-group">
        <div class="brand-icon" aria-hidden="true">🏀</div>
        <div class="brand-title">
          <h1>HOOP KID</h1>
          <span class="brand-tag">SPACE &amp; D</span>
        </div>
      </div>

      <div class="toolbar-row">
        <div class="btn-group" role="group" aria-label="Role">
          <button type="button" id="btnRoleOffense" class="active-blue" data-role="offense">🏀 OFFENSE</button>
          <button type="button" id="btnRoleDefense" data-role="defense">🛡️ DEFENSE</button>
        </div>

        <div class="btn-group" role="group" aria-label="View">
          <button type="button" class="view-mode-btn active" data-view="both">📺 SPLIT</button>
          <button type="button" class="view-mode-btn" data-view="a">🕹️ 3D PIXEL</button>
          <button type="button" class="view-mode-btn" data-view="b">📋 BOARD</button>
        </div>

        <div class="btn-group" role="group" aria-label="Speed">
          <button type="button" class="speed-btn active" data-speed="0.7">🐢 SLOW</button>
          <button type="button" class="speed-btn" data-speed="1.0">⚡ NORMAL</button>
        </div>

        <button type="button" id="btnHintToggle" class="action-pill active">💡 HINTS</button>
        <button type="button" id="btnPause" class="action-pill">⏸ PAUSE</button>
        <button type="button" id="btnReset" class="action-pill">🔄 RESET</button>
      </div>
    </header>

    <!-- Mode Cards & Match Score/Flow Strip -->
    <section class="control-strip" aria-label="Drills and Match Modes">
      <div class="scenario-cards" id="scenarioCards">
        <!-- Offense 5 Cards -->
        <button type="button" class="scenario-btn learn-card" data-side="offense" data-scenario="tutorial">🎓 LEARN</button>
        <button type="button" class="scenario-btn active" data-side="offense" data-scenario="relocation">1. SPREAD</button>
        <button type="button" class="scenario-btn" data-side="offense" data-scenario="cut">2. CUT</button>
        <button type="button" class="scenario-btn" data-side="offense" data-scenario="vcut">3. V-CUT</button>
        <button type="button" class="scenario-btn match-card" data-side="offense" data-scenario="match">🏆 5v5 MATCH</button>

        <!-- Defense 5 Cards -->
        <button type="button" class="scenario-btn learn-card" data-side="defense" data-scenario="learn_d" style="display:none;">🎓 LEARN D</button>
        <button type="button" class="scenario-btn def-drill" data-side="defense" data-scenario="def_onball" style="display:none;">1. ON-BALL</button>
        <button type="button" class="scenario-btn def-drill" data-side="defense" data-scenario="defense_help" style="display:none;">2. HELP &amp; OUT</button>
        <button type="button" class="scenario-btn def-drill" data-side="defense" data-scenario="def_cut" style="display:none;">3. STOP CUT</button>
        <button type="button" class="scenario-btn match-card" data-side="defense" data-scenario="match" style="display:none;">🏆 5v5 MATCH</button>
      </div>

      <div class="right-sub-controls">
        <!-- Match Possession Toggle & Friendly Bucket/Stop Counter -->
        <div class="match-hud" id="matchHud">
          <div class="btn-group" role="group" aria-label="Match Flow">
            <button type="button" id="btnFlowTwoWay" class="active">🔄 2-WAY</button>
            <button type="button" id="btnFlowStay">🛡️ STAY D</button>
          </div>
          <div class="score-pill">
            <span class="s-you" id="scoreYou">⭐ YOU 0</span>
            <span>·</span>
            <span class="s-cpu" id="scoreCpu">CPU 0</span>
            <span>·</span>
            <span class="s-stop" id="scoreStops">🛑 0</span>
          </div>
        </div>

        <!-- Start Spot Selector (for Drills) -->
        <div class="btn-group" id="startSpotGroup" role="group" aria-label="Start Spot">
          <button type="button" class="spot-btn active" data-spot="left_wing">L-WING</button>
          <button type="button" class="spot-btn" data-spot="right_wing">R-WING</button>
          <button type="button" class="spot-btn" data-spot="left_corner">L-CORNER</button>
          <button type="button" class="spot-btn" data-spot="right_corner">R-CORNER</button>
        </div>
      </div>
    </section>

    <!-- 4-Step Tutorial Progress Strip (Offense LEARN & Defense LEARN D) -->
    <section class="tutorial-strip" id="tutorialStrip" aria-label="Tutorial Steps">
      <div class="tut-steps-row">
        <button type="button" class="tut-step-pill current" id="tutPill1" data-tut-step="1">1. CROWD</button>
        <button type="button" class="tut-step-pill" id="tutPill2" data-tut-step="2">2. SPREAD</button>
        <button type="button" class="tut-step-pill" id="tutPill3" data-tut-step="3">3. PACE</button>
        <button type="button" class="tut-step-pill" id="tutPill4" data-tut-step="4">4. CROSS</button>
      </div>
      <div class="tut-nav-group">
        <button type="button" class="tut-nav-btn" id="btnTutPrev">◀ PREV</button>

  <script>
    (function () {
      'use strict';

      /* =====================================================================
       * 1. Court Geometry Constants (15m x 14m Half-Court) & 5x7 Pixel Digits
       * ===================================================================== */
      const COURT = {
        width: 15.0,
        halfW: 7.5,
        length: 14.0,
        rimX: 0.0,
        rimY: 1.575,
        rimZ: 3.05,
        rimRadius: 0.24,
        noChargeRadius: 1.25,
        backboardY: 1.20,
        backboardHalfW: 0.92,
        paintHalfW: 2.45,
        paintLen: 5.80,
        ftRadius: 1.80,
        threeRadius: 6.75,
        threeCornerX: 6.60,
        threeBreakY: 1.575 + Math.sqrt(6.75 * 6.75 - 6.60 * 6.60),
        crowdingDist: 3.20,
        autoPassThreshold: 0.40
      };

      const PIXEL_DIGITS_5X7 = {
        '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
        '2': ['01110', '10001', '00001', '00110', '01000', '10000', '11111'],
        '3': ['11110', '00001', '00001', '01110', '00001', '00001', '11110'],
        '4': ['10010', '10010', '10010', '11111', '00010', '00010', '00010'],
        '5': ['11111', '10000', '11110', '00001', '00001', '10001', '01110'],
        '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000']
      };

      const START_SPOTS = {
        left_wing: { x: -5.65, y: 6.15, side: -1, zone: 'wing' },
        right_wing: { x: 5.65, y: 6.15, side: 1, zone: 'wing' },
        left_corner: { x: -6.55, y: 2.15, side: -1, zone: 'corner' },
        right_corner: { x: 6.55, y: 2.15, side: 1, zone: 'corner' }
      };

      const SCENARIO_META = {
        tutorial: { role: 'offense', startEmoji: '🎓', startMsg: 'GO TO #1!' },
        relocation: { role: 'offense', startEmoji: '🟢', startMsg: 'SPREAD TO GREEN!' },
        cut: { role: 'offense', startEmoji: '⚡', startMsg: 'WALK... THEN CUT!' },
        vcut: { role: 'offense', startEmoji: '🔥', startMsg: 'STEP IN, POP OUT!' },
        learn_d: { role: 'defense', startEmoji: '🛡️', startMsg: 'STAY IN FRONT!' },
        def_onball: { role: 'defense', startEmoji: '🛡️', startMsg: 'GUARD THE BALL!' },
        defense_help: { role: 'defense', startEmoji: '🔺', startMsg: 'GO TO HELP SPOT!' },
        def_cut: { role: 'defense', startEmoji: '🛑', startMsg: 'BLOCK THE CUT!' },
        match: { role: 'any', startEmoji: '🏆', startMsg: '5v5 GAME ON!' }
      };

      /* =====================================================================
       * 2. Math & Geometry Helpers
       * ===================================================================== */
      function clamp(v, lo, hi) {
        return v < lo ? lo : (v > hi ? hi : v);
      }

      function hypot2(dx, dy) {
        return Math.sqrt(dx * dx + dy * dy);
      }

      function dist2(a, b) {
        return hypot2(a.x - b.x, a.y - b.y);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function pointToSegmentInfo(px, py, ax, ay, bx, by) {
        const vx = bx - ax;
        const vy = by - ay;
        const lenSq = vx * vx + vy * vy;
        if (lenSq < 1e-6) {
          return { dist: hypot2(px - ax, py - ay), projT: 0, cx: ax, cy: ay };
        }
        const t = clamp(((px - ax) * vx + (py - ay) * vy) / lenSq, 0, 1);
        const cx = ax + vx * t;
        const cy = ay + vy * t;
        return { dist: hypot2(px - cx, py - cy), projT: t, cx, cy };
      }

      /* =====================================================================
       * 3. Application State
       * ===================================================================== */
      const keys = {
        W: false,
        A: false,
        S: false,
        D: false,
        Shift: false,
        SpaceFlash: 0,
        CallFlash: 0
      };

      const state = {
        role: 'offense',              // 'offense' | 'defense'
        scenario: 'relocation',       // 5 offense + 5 defense scenarios
        lastOffenseScenario: 'relocation',
        lastDefenseScenario: 'def_onball',
        matchFlow: 'two_way',         // 'two_way' | 'stay'
        matchOriginRole: 'defense',
        matchScore: { you: 0, cpu: 0, stops: 0 },

        viewMode: 'both',             // 'both' | 'a' | 'b'
        speedScale: 0.7,              // 0.7 | 1.0
        showHints: true,
        paused: false,
        startSpot: 'left_wing',

        simTime: 0,
        playPhase: 'live',            // 'live' | 'pass_flight' | 'shot_flight' | 'celebrate'
        phaseTimer: 0,
        vcutStage: 1,

        offense: [],
        defense: [],

        ball: {
          holderTeam: 'offense',
          holderIdx: 1,
          inFlight: false,
          flightType: 'none',
          fromX: 0, fromY: 0, fromZ: 1.2,
          toX: 0, toY: 0, toZ: 1.2,
          targetIdx: 0,
          t: 0,
          duration: 0.35,
          x: 0, y: 8.5, z: 1.1,
          spinPhase: 0,
          trail: [],
          shotMake: true,
          shooterTeam: 'offense',
          contestedByUser: false,
          gatherTimer: 0              // Pre-shot gather cue so kid sees shot coming!
        },

        lane: {
          open: false,
          openTimer: 0,
          blockerIdx: -1,
          blockX: 0,
          blockY: 0,
          crowdedTeammateIdx: -1,
          minTeammateDist: 99,
          mySeparation: 0
        },

        targetSpot: {
          active: true,
          x: -6.55,
          y: 2.15,
          radius: 1.35,
          label: 'GO!',
          stepLabel: '',
          isWarn: false
        },

        helpTriangle: {
          show: false,
          idealX: -2.8,
          idealY: 4.5,
          distToIdeal: 0,
          goodHoldTimer: 0,
          mistakeTimer: 0,
          mistakeType: 'none',
          passTriggered: false
        },

        defDrill: {
          phase: 'probe',
          timer: 0,
          driveSide: 1,
          fakeDone: false,
          cutStage: 0,
          passTimer: 0,
          cutterIdx: -1,
          actionTimer: 0
        },

        rhythm: {
          currentLabel: '👀 READY',
          badgeClass: 'pace-walk',
          slowMoveTime: 0,
          hesitationTimer: 0,
          monotoneSprintTime: 0,
          burstBoostTimer: 0,
          crossoverTimer: 0,
          crossoverDir: 0,
          copCooldown: 0,
          lastMoveDirX: 0,
          lastMoveDirY: 0,
          lastLateralSign: 0,
          lateralSwitchWindow: 0,
          copCount: 0
        },

        tutorial: {
          step: 1,
          subPhase: 'active',
          timer: 0,
          advanceTimer: 0,
          nextStepAfterAdvance: 0,
          walkHoldTimer: 0,
          sprintHoldTimer: 0,
          copSucceeded: false,
          movedSide: 0,
          sideHoldTimer: 0,
          crossoverDone: false,
          completedSteps: { 1: false, 2: false, 3: false, 4: false },
          highlightKeys: []
        },

        coach: {
          tone: 'normal',
          emoji: '🏀',
          main: 'GO TO GREEN!',
          lockTimer: 0
        },

        fx: {
          netSwishTimer: 0,
          crowdCheerTimer: 0,
          sparkles: [],
          dusts: [],
          camX: -2.0,
          dustEmitCooldown: 0
        },

        lastResolvedLabelsA: []
      };

      function setCoachMessage(tone, emoji, main, lockSec) {
        if (state.coach.lockTimer > 0 && !lockSec && tone !== 'celebrate') {
          return;
        }
        state.coach.tone = tone;
        state.coach.emoji = emoji;
        state.coach.main = main;
        if (lockSec && lockSec > 0) {
          state.coach.lockTimer = lockSec;
        }
        syncCoachDOM();
      }

      /* =====================================================================
       * 4. Player Builder & Scenario / Tutorial / Match Initialization
       * ===================================================================== */
      function makePlayer(id, name, number, x, y, team) {
        const hairPalette = ['#18181b', '#451a03', '#78350f', '#0f172a', '#7c2d12'];
        const skinPalette = [
          { light: '#fbd3a7', mid: '#f1ba80', dark: '#c98a4b' },
          { light: '#eab688', mid: '#d49966', dark: '#a66d3f' },
          { light: '#f6c89a', mid: '#e2a872', dark: '#b87b45' },
          { light: '#c68b59', mid: '#a46b3d', dark: '#784925' },
          { light: '#f4c493', mid: '#dda26b', dark: '#b37640' }
        ];
        const skin = skinPalette[(id + (team === 'defense' ? 2 : 0)) % skinPalette.length];
        return {
          id,
          name,
          number,
          team,
          x,
          y,
          vx: 0,
          vy: 0,
          homeX: x,
          homeY: y,
          gazeAngle: Math.PI * 0.5,
          ballWatchFactor: 0.25,
          reactionTimer: 0,
          offBalanceTimer: 0,
          inertiaVx: 0,
          inertiaVy: 0,
          paceAdapt: 0,
          contestTimer: 0,
          shootFollowTimer: 0,
          jumpZ: 0,
          jumpVz: 0,
          stridePhase: id * 1.15,
          crouch: 0,
          animState: 'idle',
          hairStyle: id % 4,
          hairColor: hairPalette[id % hairPalette.length],
          skinLight: skin.light,
          skinMid: skin.mid,
          skinDark: skin.dark
        };
      }

      function triggerJump(player, upVel) {
        if (player.jumpZ <= 0.02) {
          player.jumpVz = upVel || 3.8;
        }
      }

      function setupOffenseTutorialStep(stepNum, subMode) {
        const tut = state.tutorial;
        tut.step = stepNum;
        tut.timer = 0;
        tut.advanceTimer = 0;
        tut.nextStepAfterAdvance = 0;
        tut.walkHoldTimer = 0;
        tut.sprintHoldTimer = 0;
        tut.copSucceeded = false;
        tut.movedSide = 0;
        tut.sideHoldTimer = 0;
        tut.crossoverDone = false;
        tut.highlightKeys = [];

        let mePos = { x: -5.2, y: 6.2 };
        let pgPos = { x: -1.3, y: 6.2 };

        if (stepNum === 1) {
          tut.subPhase = 'go_crowd';
          mePos = { x: -5.2, y: 6.2 };
          pgPos = { x: -1.3, y: 6.2 };
        } else if (stepNum === 2) {
          tut.subPhase = 'spread_out';
          mePos = { x: -2.1, y: 6.2 };
          pgPos = { x: -0.9, y: 7.4 };
        } else if (stepNum === 3) {
          tut.subPhase = subMode || '3a_constant';
          mePos = { x: -5.3, y: 7.1 };
          pgPos = { x: -1.6, y: 8.4 };
        } else {
          tut.subPhase = 'get_ball';
          mePos = { x: -5.5, y: 6.4 };
          pgPos = { x: -1.4, y: 8.2 };
        }

        state.offense = [
          makePlayer(0, 'YOU', 7, mePos.x, mePos.y, 'offense'),
          makePlayer(1, 'PG', 1, pgPos.x, pgPos.y, 'offense'),
          makePlayer(2, 'PF', 2, 2.4, 8.8, 'offense'),
          makePlayer(3, 'SF', 3, 5.65, 6.15, 'offense'),
          makePlayer(4, 'SG', 4, 6.55, 2.15, 'offense')
        ];

        state.defense = state.offense.map((off, idx) => {
          const toRimX = COURT.rimX - off.x;
          const toRimY = COURT.rimY - off.y;
          const len = Math.max(0.01, hypot2(toRimX, toRimY));
          let dx = off.x + (toRimX / len) * 1.15;
          let dy = off.y + (toRimY / len) * 1.15;
          if (idx === 0 && stepNum === 3) {
            dx = off.x + 0.55;
            dy = off.y - 0.55;
          }
          return makePlayer(idx, 'D' + (idx + 1), idx + 1, dx, dy, 'defense');
        });

        state.ball.holderTeam = 'offense';
        state.ball.holderIdx = 1;
        state.ball.inFlight = false;
        state.ball.flightType = 'none';
        state.ball.x = pgPos.x;
        state.ball.y = pgPos.y;
        state.ball.z = 1.1;
        state.ball.gatherTimer = 0;
        state.ball.trail = [];
        state.playPhase = 'live';
        state.phaseTimer = 0;
        state.coach.lockTimer = 0;

        if (stepNum === 1) setCoachMessage('normal', '🎓', 'GO NEAR #1!', 0);
        else if (stepNum === 2) setCoachMessage('normal', '🟢', 'SPREAD TO GREEN!', 0);
        else if (stepNum === 3 && tut.subPhase === '3a_constant') setCoachMessage('normal', '⚡', 'HOLD SHIFT + W!', 0);
        else if (stepNum === 3) setCoachMessage('good', '🐢', 'WALK SLOW (W)!', 0);
        else setCoachMessage('normal', '🟢', 'GET THE PASS!', 0);
      }

      function setupDefenseTutorialStep(stepNum) {
        const tut = state.tutorial;
        tut.step = stepNum;
        tut.timer = 0;
        tut.advanceTimer = 0;
        tut.nextStepAfterAdvance = 0;
        tut.walkHoldTimer = 0;
        tut.sprintHoldTimer = 0;
        tut.copSucceeded = false;
        tut.movedSide = 0;
        tut.sideHoldTimer = 0;
        tut.crossoverDone = false;
        tut.highlightKeys = [];

        if (stepNum === 1) {
          // Step 1: Slide A/D in front of dribbler
          tut.subPhase = 'slide';
          state.offense = [
            makePlayer(0, 'O1', 1, 0.0, 8.1, 'offense'),
            makePlayer(1, 'O2', 2, -5.65, 6.15, 'offense'),
            makePlayer(2, 'O3', 3, 5.65, 6.15, 'offense'),
            makePlayer(3, 'O4', 4, -6.55, 2.15, 'offense'),
            makePlayer(4, 'O5', 5, 6.55, 2.15, 'offense')
          ];
          state.ball.holderIdx = 0;
        } else if (stepNum === 2) {
          // Step 2: Press SPACE when shooter rises up!
          tut.subPhase = 'wait_gather';
          state.offense = [
            makePlayer(0, 'O1', 1, 0.0, 6.8, 'offense'),
            makePlayer(1, 'O2', 2, -5.65, 6.15, 'offense'),
            makePlayer(2, 'O3', 3, 5.65, 6.15, 'offense'),
            makePlayer(3, 'O4', 4, -6.55, 2.15, 'offense'),
            makePlayer(4, 'O5', 5, 6.55, 2.15, 'offense')
          ];
          state.ball.holderIdx = 0;
        } else {
          // Step 3 (Help Triangle) & Step 4 (Closeout)
          tut.subPhase = stepNum === 3 ? 'go_help' : 'wait_kickout';
          const ballStartX = stepNum === 4 ? 0.6 : 4.8;
          const ballStartY = stepNum === 4 ? 8.3 : 6.8;
          state.offense = [
            makePlayer(0, 'MAN', 2, -5.65, 6.0, 'offense'),
            makePlayer(1, 'BALL', 1, ballStartX, ballStartY, 'offense'),
            makePlayer(2, 'O3', 3, 4.8, 6.8, 'offense'),
            makePlayer(3, 'O4', 4, -6.55, 2.15, 'offense'),
            makePlayer(4, 'O5', 5, 6.55, 2.15, 'offense')
          ];
          state.ball.holderIdx = 1;
        }

        state.defense = state.offense.map((off, idx) => {
          const toRimX = COURT.rimX - off.x;
          const toRimY = COURT.rimY - off.y;
          const len = Math.max(0.01, hypot2(toRimX, toRimY));
          let dx = off.x + (toRimX / len) * 1.15;
          let dy = off.y + (toRimY / len) * 1.15;
          if (idx === 0 && stepNum === 1) {
            dx = 0.0;
            dy = 6.85;
          } else if (idx === 0 && stepNum === 2) {
            dx = 0.0;
            dy = 5.55;
          } else if (idx === 0 && stepNum === 3) {
            dx = -4.9;
            dy = 5.6;
          } else if (idx === 0 && stepNum === 4) {
            dx = -1.8;
            dy = 4.1;
          }
          return makePlayer(idx, idx === 0 ? 'YOU' : 'D' + (idx + 1), idx === 0 ? 7 : idx + 1, dx, dy, 'defense');
        });

        const holder = state.offense[state.ball.holderIdx];
        state.ball.holderTeam = 'offense';
        state.ball.inFlight = false;
        state.ball.flightType = 'none';
        state.ball.x = holder.x;
        state.ball.y = holder.y;
        state.ball.z = 1.1;
        state.ball.gatherTimer = 0;
        state.ball.contestedByUser = false;
        state.ball.trail = [];
        state.playPhase = 'live';
        state.phaseTimer = 0;
        state.coach.lockTimer = 0;

        if (stepNum === 1) setCoachMessage('normal', '🛡️', 'SLIDE IN FRONT!', 0);
        else if (stepNum === 2) setCoachMessage('normal', '🖐️', 'WAIT... HANDS UP!', 0);
        else if (stepNum === 3) setCoachMessage('normal', '🔺', 'GO TO HELP SPOT!', 0);
        else setCoachMessage('normal', '🏃', 'READY TO CLOSEOUT!', 0);
      }

      function buildFormation() {
        if (state.scenario === 'tutorial') {
          setupOffenseTutorialStep(state.tutorial.step);
          return;
        }
        if (state.scenario === 'learn_d') {
          setupDefenseTutorialStep(state.tutorial.step);
          return;
        }

        const spot = START_SPOTS[state.startSpot];
        const side = spot.side;

        // Special 1v1 On-Ball Defense formation: matchup #0 is the top ball-handler!
        if (state.scenario === 'def_onball') {
          state.offense = [
            makePlayer(0, 'BALL', 1, 0.0, 8.35, 'offense'),
            makePlayer(1, 'O2', 2, -5.75, 6.15, 'offense'),
            makePlayer(2, 'O3', 3, 5.75, 6.15, 'offense'),
            makePlayer(3, 'O4', 4, -6.55, 2.15, 'offense'),
            makePlayer(4, 'O5', 5, 6.55, 2.15, 'offense')
          ];
          state.defense = state.offense.map((off, idx) => {
            const toRimX = COURT.rimX - off.x;
            const toRimY = COURT.rimY - off.y;
            const len = Math.max(0.01, hypot2(toRimX, toRimY));
            const dx = idx === 0 ? 0.0 : off.x + (toRimX / len) * 1.2;
            const dy = idx === 0 ? 6.95 : off.y + (toRimY / len) * 1.2;
            return makePlayer(idx, idx === 0 ? 'YOU' : 'D' + (idx + 1), idx === 0 ? 7 : idx + 1, dx, dy, 'defense');
          });
          return;
        }

        const slots = {
          top: { x: 0.0, y: 8.85 },
          sameWing: { x: side * 5.65, y: 6.15 },
          sameCorner: { x: side * 6.55, y: 2.15 },
          oppWing: { x: -side * 5.65, y: 6.15 },
          oppCorner: { x: -side * 6.55, y: 2.15 }
        };

        const meStart = { x: spot.x, y: spot.y };
        const mateSlot1 = { x: slots.top.x, y: slots.top.y };
        const mateSlot2 = spot.zone === 'wing'
          ? { x: slots.sameCorner.x, y: slots.sameCorner.y }
          : { x: slots.sameWing.x, y: slots.sameWing.y };
        const mateSlot3 = { x: slots.oppWing.x, y: slots.oppWing.y };
        const mateSlot4 = { x: slots.oppCorner.x, y: slots.oppCorner.y };

        if (state.scenario === 'relocation') {
          mateSlot2.x = -side * 2.8;
          mateSlot2.y = 2.05;
        } else if (state.scenario === 'cut' || state.scenario === 'def_cut') {
          mateSlot1.x = side * 2.1;
          mateSlot1.y = 8.35;
          mateSlot2.x = -side * 1.9;
          mateSlot2.y = 8.85;
        } else if (state.scenario === 'vcut') {
          mateSlot1.x = side * 1.5;
          mateSlot1.y = 8.55;
          mateSlot2.x = -side * 2.1;
          mateSlot2.y = 8.85;
        }

        state.offense = [
          makePlayer(0, state.role === 'offense' ? 'YOU' : 'MAN', state.role === 'offense' ? 7 : 2, meStart.x, meStart.y, 'offense'),
          makePlayer(1, 'PG', 1, mateSlot1.x, mateSlot1.y, 'offense'),
          makePlayer(2, 'PF', 3, mateSlot2.x, mateSlot2.y, 'offense'),
          makePlayer(3, 'SF', 4, mateSlot3.x, mateSlot3.y, 'offense'),
          makePlayer(4, 'SG', 5, mateSlot4.x, mateSlot4.y, 'offense')
        ];

        state.defense = state.offense.map((off, idx) => {
          const toRimX = COURT.rimX - off.x;
          const toRimY = COURT.rimY - off.y;
          const len = Math.max(0.01, hypot2(toRimX, toRimY));
          const cushion = idx === 0 ? 1.05 : 1.25;
          let dx = off.x + (toRimX / len) * cushion;
          let dy = off.y + (toRimY / len) * cushion;

          if (idx === 0 && state.scenario === 'vcut') {
            const ballRef = state.offense[1];
            dx = lerp(off.x, ballRef.x, 0.22);
            dy = lerp(off.y, ballRef.y, 0.22);
          } else if (idx === 0 && state.scenario === 'cut') {
            dx = off.x + (-side * 0.45);
            dy = off.y + 0.55;
          } else if (idx === 0 && state.scenario === 'defense_help') {
            dx = lerp(off.x, 0, 0.35);
            dy = lerp(off.y, COURT.rimY + 1.5, 0.35);
          } else if (idx === 0 && state.scenario === 'def_cut') {
            dx = off.x + (-side * 0.35);
            dy = off.y + 0.35;
          }

          return makePlayer(
            idx,
            idx === 0 && state.role === 'defense' ? 'YOU' : 'D' + (idx + 1),
            idx === 0 && state.role === 'defense' ? 7 : idx + 1,
            dx,
            dy,
            'defense'
          );
        });
      }

      function resetScenario() {
        state.simTime = 0;
        state.playPhase = 'live';
        state.phaseTimer = 0;
        state.vcutStage = 1;

        state.defDrill.phase = 'probe';
        state.defDrill.timer = 0;
        state.defDrill.driveSide = (Math.random() < 0.5 ? -1 : 1);
        state.defDrill.fakeDone = false;
        state.defDrill.cutStage = 0;
        state.defDrill.passTimer = 0;
        state.defDrill.cutterIdx = -1;
        state.defDrill.actionTimer = 0;

        if (state.scenario === 'tutorial') {
          setupOffenseTutorialStep(state.tutorial.step);
        } else if (state.scenario === 'learn_d') {
          setupDefenseTutorialStep(state.tutorial.step);
        } else {
          state.tutorial.highlightKeys = [];
          buildFormation();
          const initHolder = state.scenario === 'def_onball' ? 0 : 1;
          const holder = state.offense[initHolder];
          state.ball.holderTeam = 'offense';
          state.ball.holderIdx = initHolder;
          state.ball.inFlight = false;
          state.ball.flightType = 'none';
          state.ball.x = holder.x;
          state.ball.y = holder.y;
          state.ball.z = 1.1;
          state.ball.gatherTimer = 0;
          state.ball.trail = [];
          state.ball.contestedByUser = false;

          state.coach.lockTimer = 0;
          const meta = SCENARIO_META[state.scenario];
          if (state.scenario === 'match') {
            setCoachMessage(
              'normal',
              state.role === 'offense' ? '🏀' : '🛡️',
              state.role === 'offense' ? 'YOUR BALL! SCORE!' : 'DEFEND! STOP THEM!',
              0
            );
          } else {
            setCoachMessage('normal', meta.startEmoji, meta.startMsg, 0);
          }
        }

        state.lane.open = false;
        state.lane.openTimer = 0;
        state.lane.blockerIdx = -1;
        state.lane.crowdedTeammateIdx = -1;

        state.helpTriangle.goodHoldTimer = 0;
        state.helpTriangle.mistakeTimer = 0;
        state.helpTriangle.mistakeType = 'none';
        state.helpTriangle.passTriggered = false;

        state.rhythm.currentLabel = '👀 READY';
        state.rhythm.badgeClass = 'pace-walk';
        state.rhythm.slowMoveTime = 0;
        state.rhythm.hesitationTimer = 0;
        state.rhythm.monotoneSprintTime = 0;
        state.rhythm.burstBoostTimer = 0;
        state.rhythm.crossoverTimer = 0;
        state.rhythm.copCooldown = 0;
        state.rhythm.lastMoveDirX = 0;
        state.rhythm.lastMoveDirY = 0;
        state.rhythm.lastLateralSign = 0;
        state.rhythm.lateralSwitchWindow = 0;

        const me = getControlledPlayer();
        state.fx.camX = clamp(me.x * 0.42, -3.1, 3.1);
        state.fx.sparkles = [];
        state.fx.dusts = [];

        updateTargetSpot(0);
        evaluateSpacingAndLane(0);
        updateTutorialLogic(0);
        syncAllDOM();
      }

      function setTutorialStep(stepNum) {
        const clamped = clamp(Math.round(stepNum), 1, 4);
        state.tutorial.step = clamped;
        if (state.role === 'defense') {
          state.scenario = 'learn_d';
          setupDefenseTutorialStep(clamped);
        } else {
          state.scenario = 'tutorial';
          setupOffenseTutorialStep(clamped);
        }
        const me = getControlledPlayer();
        state.fx.camX = clamp(me.x * 0.42, -3.1, 3.1);
        updateTargetSpot(0);
        evaluateSpacingAndLane(0);
        updateTutorialLogic(0);
        syncAllDOM();
      }

      function getControlledPlayer() {
        return state.role === 'offense' ? state.offense[0] : state.defense[0];
      }

      /* Instant Defender Switch (E Key on Defense): swaps slot 0 with target defender cleanly */
      function switchDefenderToBall() {
        if (state.role !== 'defense') return false;
        let targetIdx = state.ball.inFlight ? state.ball.targetIdx : state.ball.holderIdx;
        if (targetIdx === 0) {
          // Already on ball-handler: switch to defender guarding player closest to rim!
          let bestIdx = 1;
          let bestRimDist = 99;
          for (let i = 1; i < state.offense.length; i++) {
            const d = hypot2(state.offense[i].x - COURT.rimX, state.offense[i].y - COURT.rimY);
            if (d < bestRimDist) {
              bestRimDist = d;
              bestIdx = i;
            }
          }
          targetIdx = bestIdx;
        }
        if (targetIdx <= 0 || targetIdx >= state.defense.length) return false;

        const tmpDef = state.defense[0];
        state.defense[0] = state.defense[targetIdx];
        state.defense[targetIdx] = tmpDef;
        state.defense[0].id = 0;
        state.defense[0].name = 'YOU';
        state.defense[targetIdx].id = targetIdx;
        state.defense[targetIdx].name = 'D' + (targetIdx + 1);

        const tmpOff = state.offense[0];
        state.offense[0] = state.offense[targetIdx];
        state.offense[targetIdx] = tmpOff;
        state.offense[0].id = 0;
        state.offense[targetIdx].id = targetIdx;

        if (state.ball.holderIdx === 0) state.ball.holderIdx = targetIdx;
        else if (state.ball.holderIdx === targetIdx) state.ball.holderIdx = 0;

        if (state.ball.targetIdx === 0) state.ball.targetIdx = targetIdx;
        else if (state.ball.targetIdx === targetIdx) state.ball.targetIdx = 0;

        if (state.defDrill.cutterIdx === 0) state.defDrill.cutterIdx = targetIdx;
        else if (state.defDrill.cutterIdx === targetIdx) state.defDrill.cutterIdx = 0;

        spawnSparkles(state.defense[0].x, state.defense[0].y, '#facc15', 6);
        setCoachMessage('good', '🔄', 'SWITCHED!', 0.8);
        return true;
      }

      /* =====================================================================
       * 5. Physics, Change of Pace Engine & User Movement
       * ===================================================================== */
      function spawnDust(wx, wy, count) {
        for (let i = 0; i < count; i++) {
          state.fx.dusts.push({
            x: wx + (Math.random() - 0.5) * 0.35,
            y: wy + (Math.random() - 0.5) * 0.22,
            z: 0.05 + Math.random() * 0.12,
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.5,
            vz: 0.45 + Math.random() * 0.55,
            life: 0.42,
            maxLife: 0.42
          });
        }
      }

      function triggerDefenderOffBalance(defender, oldPlayerVx, oldPlayerVy, isCrossover) {
        defender.reactionTimer = 0.26;
        defender.offBalanceTimer = isCrossover ? 1.05 : 0.85;
        const slideScale = isCrossover ? 1.28 : 0.96;
        const baseVx = Math.abs(defender.vx) > 0.4 ? defender.vx : oldPlayerVx;
        const baseVy = Math.abs(defender.vy) > 0.4 ? defender.vy : oldPlayerVy;
        defender.inertiaVx = clamp(baseVx * slideScale, -4.6, 4.6);
        defender.inertiaVy = clamp(baseVy * slideScale, -4.6, 4.6);
        defender.paceAdapt = 0;
        spawnDust(defender.x, defender.y, 5);
      }

      function updatePlayerJumpAndPose(p, dt, isSprint, isHesi, isCross) {
        if (p.shootFollowTimer > 0) p.shootFollowTimer = Math.max(0, p.shootFollowTimer - dt);
        if (p.contestTimer > 0) p.contestTimer = Math.max(0, p.contestTimer - dt);

        if (p.jumpZ > 0 || p.jumpVz > 0) {
          p.jumpZ += p.jumpVz * dt;
          p.jumpVz -= 11.5 * dt;
          if (p.jumpZ <= 0) {
            p.jumpZ = 0;
            p.jumpVz = 0;
          }
        }

        const spd = hypot2(p.vx, p.vy);
        if (p.jumpZ > 0.04) p.animState = 'jump';
        else if (p.offBalanceTimer > 0) p.animState = 'offbalance';
        else if (isCross) p.animState = 'crossover';
        else if (isHesi) p.animState = 'hesitate';
        else if (isSprint && spd > 3.6) p.animState = 'sprint';
        else if (spd > 0.35) p.animState = 'walk';
        else p.animState = 'idle';
      }

      function updateUserPlayer(dt) {
        const me = getControlledPlayer();
        const r = state.rhythm;

        if (r.copCooldown > 0) r.copCooldown = Math.max(0, r.copCooldown - dt);
        if (r.burstBoostTimer > 0) r.burstBoostTimer = Math.max(0, r.burstBoostTimer - dt);
        if (r.crossoverTimer > 0) r.crossoverTimer = Math.max(0, r.crossoverTimer - dt);
        if (r.hesitationTimer > 0) r.hesitationTimer = Math.max(0, r.hesitationTimer - dt);
        if (r.lateralSwitchWindow > 0) r.lateralSwitchWindow = Math.max(0, r.lateralSwitchWindow - dt);
        if (state.fx.dustEmitCooldown > 0) state.fx.dustEmitCooldown = Math.max(0, state.fx.dustEmitCooldown - dt);
        if (me.offBalanceTimer > 0) me.offBalanceTimer = Math.max(0, me.offBalanceTimer - dt);

        if (me.reactionTimer > 0) {
          me.reactionTimer = Math.max(0, me.reactionTimer - dt);
          me.x = clamp(me.x + me.inertiaVx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
          me.y = clamp(me.y + me.inertiaVy * dt, 0.55, COURT.length - 0.55);
          updatePlayerJumpAndPose(me, dt, false, false, false);
          return;
        }

        let ix = (keys.D ? 1 : 0) - (keys.A ? 1 : 0);
        let iy = (keys.S ? 1 : 0) - (keys.W ? 1 : 0);
        const hasInput = ix !== 0 || iy !== 0;

        if (hasInput) {
          const len = hypot2(ix, iy);
          ix /= len;
          iy /= len;
        }

        const prevSpeed = hypot2(me.vx, me.vy);
        const iHaveBall = state.role === 'offense' && !state.ball.inFlight && state.ball.holderIdx === 0;

        const isHesitationStep = keys.S && !keys.W && !keys.Shift;
        if (isHesitationStep) {
          r.hesitationTimer = 0.85;
          r.slowMoveTime = Math.max(r.slowMoveTime, 0.25);
          me.crouch = 1;
        } else {
          me.crouch = Math.max(0, me.crouch - dt * 5);
        }

        const currentLat = (keys.D ? 1 : 0) - (keys.A ? 1 : 0);
        let switchedLateral = false;
        if (currentLat !== 0) {
          if (r.lastLateralSign !== 0 && currentLat !== r.lastLateralSign && r.lateralSwitchWindow > 0) {
            switchedLateral = true;
          }
          r.lastLateralSign = currentLat;
          r.lateralSwitchWindow = 0.72;
        }

        let sharpTurn = false;
        if (hasInput && (Math.abs(r.lastMoveDirX) > 0.1 || Math.abs(r.lastMoveDirY) > 0.1)) {
          const dot = ix * r.lastMoveDirX + iy * r.lastMoveDirY;
          if (dot < 0.42) sharpTurn = true;
        }

        const matchDef = state.role === 'offense' ? state.defense[0] : null;
        const blockCoPInTut3A = state.scenario === 'tutorial' && state.tutorial.step === 3 && state.tutorial.subPhase === '3a_constant';
        const canTriggerCoP = state.role === 'offense' && !blockCoPInTut3A && r.copCooldown <= 0 && hasInput;

        if (canTriggerCoP) {
          const slowToFast = keys.Shift && (r.slowMoveTime >= 0.15 || r.hesitationTimer > 0);
          const sharpCutOrVcut = keys.Shift && sharpTurn;
          const onBallCrossover = iHaveBall && (switchedLateral || (sharpTurn && keys.Shift) || (r.hesitationTimer > 0 && currentLat !== 0));
          const offBallQuickCross = !iHaveBall && switchedLateral && keys.Shift;

          if (onBallCrossover || offBallQuickCross) {
            const fakeVx = r.lastLateralSign !== 0 && switchedLateral ? -currentLat * 3.8 : me.vx;
            const fakeVy = Math.abs(me.vy) > 0.5 ? me.vy : -1.2;
            r.burstBoostTimer = 0.54;
            r.crossoverTimer = 0.72;
            r.crossoverDir = currentLat || (ix >= 0 ? 1 : -1);
            r.copCooldown = 0.70;
            r.monotoneSprintTime = 0;
            r.slowMoveTime = 0;
            r.hesitationTimer = 0;
            r.copCount += 1;
            spawnDust(me.x, me.y, 6);
            if (matchDef && dist2(me, matchDef) < 3.9) {
              triggerDefenderOffBalance(matchDef, fakeVx, fakeVy, true);
              spawnSparkles(me.x, me.y, '#38bdf8', 7);
              if (iHaveBall && state.scenario !== 'tutorial') {
                setCoachMessage('good', '💨', 'NICE CROSSOVER!', 1.4);
              }
            }
          } else if (slowToFast || sharpCutOrVcut) {
            const oldVx = Math.abs(me.vx) > 0.3 ? me.vx : r.lastMoveDirX * 2.4;
            const oldVy = Math.abs(me.vy) > 0.3 ? me.vy : r.lastMoveDirY * 2.4;
            r.burstBoostTimer = 0.52;
            r.copCooldown = 0.75;
            r.monotoneSprintTime = 0;
            r.slowMoveTime = 0;
            r.hesitationTimer = 0;
            r.copCount += 1;
            spawnDust(me.x, me.y, 5);
            if (matchDef && dist2(me, matchDef) < 4.6) {
              triggerDefenderOffBalance(matchDef, oldVx, oldVy, false);
              spawnSparkles(me.x, me.y, '#22c55e', 6);
              if (!iHaveBall && state.scenario !== 'tutorial') {
                setCoachMessage('good', '🔥', 'GREAT PACE!', 1.3);
              }
            }
          }
        }

        let targetSpeed = 0;
        if (hasInput) {
          if (state.role === 'defense') {
            targetSpeed = keys.Shift ? 5.55 : 3.65;
            r.monotoneSprintTime = 0;
          } else if (r.burstBoostTimer > 0) {
            targetSpeed = 6.30;
          } else if (keys.Shift) {
            r.monotoneSprintTime += dt;
            targetSpeed = r.monotoneSprintTime > 0.45 ? 4.65 : 5.10;
          } else if (isHesitationStep) {
            targetSpeed = 1.85;
            r.monotoneSprintTime = 0;
          } else {
            targetSpeed = 2.65;
            r.monotoneSprintTime = 0;
          }
        } else {
          r.monotoneSprintTime = 0;
        }

        if (hasInput && !keys.Shift && targetSpeed <= 2.85) {
          r.slowMoveTime = Math.min(2.0, r.slowMoveTime + dt);
        } else if (!hasInput) {
          r.slowMoveTime = Math.max(0, r.slowMoveTime - dt * 0.6);
        } else if (r.burstBoostTimer <= 0 && keys.Shift) {
          r.slowMoveTime = Math.max(0, r.slowMoveTime - dt * 3.0);
        }

        const accel = r.burstBoostTimer > 0 ? 26.0 : (hasInput ? 16.0 : 18.0);
        const desiredVx = ix * targetSpeed;
        const desiredVy = iy * targetSpeed;
        me.vx = lerp(me.vx, desiredVx, clamp(accel * dt, 0, 1));
        me.vy = lerp(me.vy, desiredVy, clamp(accel * dt, 0, 1));

        me.x = clamp(me.x + me.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
        me.y = clamp(me.y + me.vy * dt, 0.55, COURT.length - 0.55);

        const curSpeed = hypot2(me.vx, me.vy);
        if (curSpeed > 0.4) {
          me.stridePhase += curSpeed * dt * 3.5;
          if (hasInput && !isHesitationStep) {
            r.lastMoveDirX = ix;
            r.lastMoveDirY = iy;
          }
          if ((keys.Shift || r.burstBoostTimer > 0) && state.fx.dustEmitCooldown <= 0) {
            spawnDust(me.x - ix * 0.25, me.y - iy * 0.25, 2);
            state.fx.dustEmitCooldown = 0.11;
          }
        }
        me.gazeAngle = state.role === 'defense'
          ? Math.atan2(state.ball.y - me.y, state.ball.x - me.x)
          : Math.atan2(COURT.rimY - me.y, COURT.rimX - me.x);

        updatePlayerJumpAndPose(me, dt, keys.Shift || r.burstBoostTimer > 0, isHesitationStep, r.crossoverTimer > 0);

        if (r.crossoverTimer > 0) {
          r.currentLabel = '💨 CROSS!';
          r.badgeClass = 'pace-cross';
        } else if (r.burstBoostTimer > 0) {
          r.currentLabel = '🔥 PACE!';
          r.badgeClass = 'pace-cop';
        } else if (isHesitationStep || (r.hesitationTimer > 0.3 && curSpeed < 2.2)) {
          r.currentLabel = '🛑 HESI!';
          r.badgeClass = 'pace-hesi';
        } else if (keys.Shift && hasInput) {
          r.currentLabel = '⚡ FAST!';
          r.badgeClass = 'pace-sprint';
        } else if (prevSpeed > 0.3 || hasInput) {
          r.currentLabel = state.role === 'defense' ? '🛡️ SLIDE' : '🚶 WALK';
          r.badgeClass = 'pace-walk';
        } else {
          r.currentLabel = '👀 READY';
          r.badgeClass = 'pace-walk';
        }
      }

      /* =====================================================================
       * 6. Tutorials (Offense LEARN & Defense LEARN D)
       * ===================================================================== */
      function computeDirKeysToward(fromX, fromY, toX, toY) {
        const out = [];
        if (toY < fromY - 0.40) out.push('W');
        else if (toY > fromY + 0.40) out.push('S');
        if (toX < fromX - 0.40) out.push('A');
        else if (toX > fromX + 0.40) out.push('D');
        return out.length ? out : ['W'];
      }

      function updateTutorialLogic(dt) {
        if (state.scenario !== 'tutorial' && state.scenario !== 'learn_d') {
          state.tutorial.highlightKeys = [];
          return;
        }

        const tut = state.tutorial;
        if (tut.advanceTimer > 0) {
          tut.highlightKeys = [];
          tut.advanceTimer -= dt;
          if (tut.advanceTimer <= 0 && tut.nextStepAfterAdvance > 0) {
            setTutorialStep(tut.nextStepAfterAdvance);
          }
          return;
        }

        if (state.scenario === 'learn_d') {
          updateDefenseTutorialStep(dt);
          return;
        }

        // Offense 4-Step Tutorial
        const me = state.offense[0];
        const pg = state.offense[1];
        const myDef = state.defense[0];
        const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;

        if (tut.step === 1) {
          state.targetSpot.active = true;
          state.targetSpot.x = pg.x - 0.7;
          state.targetSpot.y = pg.y;
          state.targetSpot.radius = 1.3;
          state.targetSpot.label = 'GO HERE!';
          state.targetSpot.stepLabel = '1';
          state.targetSpot.isWarn = true;

          if (state.lane.crowdedTeammateIdx !== -1) {
            tut.timer += dt;
            tut.highlightKeys = [];
            if (tut.timer >= 0.42) {
              tut.completedSteps[1] = true;
              tut.subPhase = 'step1_done';
              tut.advanceTimer = 1.35;
              tut.nextStepAfterAdvance = 2;
              spawnSparkles(me.x, me.y, '#f59e0b', 10);
              setCoachMessage('celebrate', '💡', 'TOO CROWDED! NOW SPREAD!', 1.8);
              syncAllDOM();
            }
          } else {
            tut.highlightKeys = computeDirKeysToward(me.x, me.y, pg.x - 0.5, pg.y);
          }
        } else if (tut.step === 2) {
          state.targetSpot.isWarn = false;
          if (!iHaveBall && !state.ball.inFlight) {
            state.targetSpot.active = true;
            state.targetSpot.x = -5.85;
            state.targetSpot.y = 5.65;
            state.targetSpot.radius = 1.55;
            state.targetSpot.label = 'OPEN SPOT!';
            state.targetSpot.stepLabel = '2';
            const dSpot = hypot2(me.x - state.targetSpot.x, me.y - state.targetSpot.y);
            tut.highlightKeys = dSpot > 0.9 ? computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y) : [];
          } else if (iHaveBall && state.playPhase === 'live') {
            state.targetSpot.active = false;
            tut.subPhase = 'shoot_open';
            tut.highlightKeys = ['Space'];
            setCoachMessage('good', '🏀', 'WIDE OPEN! SHOOT!', 0.4);
          } else {
            tut.highlightKeys = [];
          }
        } else if (tut.step === 3) {
          state.targetSpot.isWarn = false;
          if (tut.subPhase === '3a_constant') {
            state.targetSpot.active = true;
            state.targetSpot.x = -2.0;
            state.targetSpot.y = 2.5;
            state.targetSpot.radius = 1.35;
            state.targetSpot.label = 'HOLD SHIFT+W';
            state.targetSpot.stepLabel = '3A';
            tut.highlightKeys = ['Shift', 'W'];

            const movingAny = keys.W || keys.A || keys.S || keys.D;
            if (keys.Shift && movingAny) {
              tut.sprintHoldTimer += dt;
              if (tut.sprintHoldTimer >= 0.75) {
                tut.subPhase = '3a_resetting';
                tut.timer = 0;
                tut.highlightKeys = [];
                setCoachMessage('warn', '😮', 'DEFENDER STUCK ON YOU!', 1.3);
              }
            }
          } else if (tut.subPhase === '3a_resetting') {
            tut.highlightKeys = [];
            tut.timer += dt;
            if (tut.timer >= 1.0) {
              setupOffenseTutorialStep(3, '3b_walk');
              syncAllDOM();
            }
          } else if (tut.subPhase === '3b_walk') {
            state.targetSpot.active = true;
            state.targetSpot.x = -4.2;
            state.targetSpot.y = 5.0;
            state.targetSpot.radius = 1.3;
            state.targetSpot.label = 'WALK SLOW';
            state.targetSpot.stepLabel = 'WALK';
            tut.highlightKeys = ['W'];

            const movingSlow = (keys.W || keys.A || keys.S || keys.D) && !keys.Shift;
            if (movingSlow) {
              tut.walkHoldTimer += dt;
              if (tut.walkHoldTimer >= 0.35) {
                tut.subPhase = '3b_burst';
                setCoachMessage('good', '⚡', 'GO NOW! SHIFT!', 0);
              }
            }
          } else if (tut.subPhase === '3b_burst') {
            if (!iHaveBall && !state.ball.inFlight) {
              state.targetSpot.active = true;
              state.targetSpot.x = -1.5;
              state.targetSpot.y = 2.35;
              state.targetSpot.radius = 1.5;
              state.targetSpot.label = 'CUT FAST!';
              state.targetSpot.stepLabel = 'GO!';
              if (state.rhythm.burstBoostTimer > 0 || myDef.offBalanceTimer > 0) {
                tut.copSucceeded = true;
              }
              const dirKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
              tut.highlightKeys = tut.copSucceeded ? dirKeys : ['Shift'].concat(dirKeys);
            } else if (iHaveBall && state.playPhase === 'live') {
              state.targetSpot.active = false;
              tut.highlightKeys = ['Space'];
              setCoachMessage('good', '🔥', 'OPEN LAYUP! SPACE!', 0.4);
            }
          }
        } else if (tut.step === 4) {
          state.targetSpot.isWarn = false;
          if (tut.subPhase === 'graduated') {
            state.targetSpot.active = false;
            tut.highlightKeys = [];
            return;
          }
          if (!iHaveBall && !state.ball.inFlight && tut.subPhase === 'get_ball') {
            state.targetSpot.active = true;
            state.targetSpot.x = -5.5;
            state.targetSpot.y = 4.75;
            state.targetSpot.radius = 1.55;
            state.targetSpot.label = 'CATCH HERE!';
            state.targetSpot.stepLabel = '4';
            tut.highlightKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
          } else if (iHaveBall && state.playPhase === 'live') {
            state.targetSpot.active = true;
            state.targetSpot.x = -1.2;
            state.targetSpot.y = 2.25;
            state.targetSpot.radius = 1.45;
            state.targetSpot.label = 'FINISH!';
            state.targetSpot.stepLabel = '🏀';

            if (state.rhythm.crossoverTimer > 0 || myDef.offBalanceTimer > 0) {
              tut.crossoverDone = true;
            }
            if (!tut.crossoverDone) {
              tut.subPhase = 'do_crossover';
              if (tut.movedSide === 0) {
                tut.highlightKeys = ['A'];
                setCoachMessage('normal', '💨', 'FAKE LEFT (A)!', 0.3);
                if (keys.A && !keys.D) {
                  tut.sideHoldTimer += dt;
                  if (tut.sideHoldTimer >= 0.10) tut.movedSide = -1;
                } else if (keys.D && !keys.A) {
                  tut.sideHoldTimer += dt;
                  if (tut.sideHoldTimer >= 0.10) tut.movedSide = 1;
                }
              } else {
                const oppKey = tut.movedSide < 0 ? 'D' : 'A';
                tut.highlightKeys = [oppKey, 'Shift'];
                setCoachMessage('good', '⚡', 'CROSS ' + oppKey + ' + SHIFT!', 0.3);
              }
            } else {
              tut.subPhase = 'shoot_finish';
              tut.highlightKeys = ['Space'];
              setCoachMessage('good', '🔥', 'SHOOT NOW! SPACE!', 0.4);
            }
          }
        }
      }

      function updateDefenseTutorialStep(dt) {
        const tut = state.tutorial;
        const me = state.defense[0];
        const man = state.offense[0];

        if (tut.step === 1) {
          // Step 1: Slide laterally to stay between dribbler and hoop
          const toRimX = COURT.rimX - man.x;
          const toRimY = COURT.rimY - man.y;
          const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
          const spotX = man.x + (toRimX / dRim) * 1.15;
          const spotY = man.y + (toRimY / dRim) * 1.15;

          state.targetSpot.active = true;
          state.targetSpot.x = spotX;
          state.targetSpot.y = spotY;
          state.targetSpot.radius = 1.25;
          state.targetSpot.label = 'STAY IN FRONT!';
          state.targetSpot.stepLabel = '1';
          state.targetSpot.isWarn = false;

          const dFront = hypot2(me.x - spotX, me.y - spotY);
          if (dFront < 1.45) {
            tut.timer += dt;
            tut.highlightKeys = Math.abs(spotX - me.x) > 0.3 ? (spotX < me.x ? ['A'] : ['D']) : [];
            if (tut.timer >= 0.85) {
              tut.completedSteps[1] = true;
              tut.advanceTimer = 1.25;
              tut.nextStepAfterAdvance = 2;
              spawnSparkles(me.x, me.y, '#22c55e', 10);
              setCoachMessage('celebrate', '🛡️', 'GREAT SLIDE!', 1.5);
              syncAllDOM();
            }
          } else {
            tut.highlightKeys = computeDirKeysToward(me.x, me.y, spotX, spotY);
          }
        } else if (tut.step === 2) {
          // Step 2: Hands up contest when shooter gathers!
          state.targetSpot.active = true;
          state.targetSpot.x = 0.0;
          state.targetSpot.y = 5.55;
          state.targetSpot.radius = 1.2;
          state.targetSpot.label = 'GUARD!';
          state.targetSpot.stepLabel = '2';

          if (state.playPhase === 'live') {
            tut.timer += dt;
            if (tut.timer > 0.35) {
              state.ball.gatherTimer = 0.9;
              tut.highlightKeys = ['Space'];
              setCoachMessage('warn', '🖐️', 'HANDS UP! SPACE!', 0.2);
              if (me.contestTimer > 0 && dist2(me, man) < 2.35) {
                state.ball.contestedByUser = true;
                tut.highlightKeys = [];
                startShot('offense', 0, false);
              } else if (tut.timer > 2.2) {
                // Shooter releases uncontested -> resets gently so kid can try again!
                startShot('offense', 0, true);
              }
            }
          }
        } else if (tut.step === 3) {
          // Step 3: Move into the green Help Triangle spot!
          state.helpTriangle.show = true;
          state.targetSpot.active = true;
          state.targetSpot.x = state.helpTriangle.idealX;
          state.targetSpot.y = state.helpTriangle.idealY;
          state.targetSpot.radius = 1.45;
          state.targetSpot.label = 'HELP SPOT!';
          state.targetSpot.stepLabel = '3';

          const dHelp = hypot2(me.x - state.targetSpot.x, me.y - state.targetSpot.y);
          if (dHelp < 1.5) {
            tut.timer += dt;
            tut.highlightKeys = [];
            if (tut.timer >= 0.75) {
              tut.completedSteps[3] = true;
              tut.advanceTimer = 1.25;
              tut.nextStepAfterAdvance = 4;
              spawnSparkles(me.x, me.y, '#22c55e', 10);
              setCoachMessage('celebrate', '🔺', 'PERFECT HELP!', 1.5);
              syncAllDOM();
            }
          } else {
            tut.highlightKeys = computeDirKeysToward(me.x, me.y, state.targetSpot.x, state.targetSpot.y);
          }
        } else if (tut.step === 4) {
          if (tut.subPhase === 'graduated') {
            state.targetSpot.active = false;
            tut.highlightKeys = [];
            return;
          }
          state.helpTriangle.show = true;
          if (tut.subPhase === 'wait_kickout') {
            tut.timer += dt;
            state.targetSpot.active = true;
            state.targetSpot.x = state.helpTriangle.idealX;
            state.targetSpot.y = state.helpTriangle.idealY;
            state.targetSpot.radius = 1.4;
            state.targetSpot.label = 'WAIT...';
            state.targetSpot.stepLabel = '4';
            if (tut.timer >= 0.55 && !state.ball.inFlight) {
              tut.subPhase = 'closeout_now';
              startPass(1, 0);
              setCoachMessage('warn', '🏃', 'CLOSEOUT! RUN + SPACE!', 0.4);
            }
          } else if (tut.subPhase === 'closeout_now') {
            state.targetSpot.active = true;
            state.targetSpot.x = man.x + 0.6;
            state.targetSpot.y = man.y - 0.5;
            state.targetSpot.radius = 1.4;
            state.targetSpot.label = 'CONTEST!';
            state.targetSpot.stepLabel = '🖐️';

            const dMan = dist2(me, man);
            if (dMan > 2.05) {
              tut.highlightKeys = ['Shift'].concat(computeDirKeysToward(me.x, me.y, man.x, man.y));
            } else {
              tut.highlightKeys = ['Space'];
              setCoachMessage('good', '🖐️', 'HANDS UP! SPACE!', 0.2);
            }
          }
        }
      }

      /* =====================================================================
       * 7. Offense AI, Defense Drills AI & Full 5v5 Match AI
       * ===================================================================== */
      function moveAgentToward(agent, tx, ty, maxSpeed, dt) {
        const dx = tx - agent.x;
        const dy = ty - agent.y;
        const d = hypot2(dx, dy);
        let dvx = 0;
        let dvy = 0;
        if (d > 0.06) {
          const sp = Math.min(maxSpeed, d * 4.4);
          dvx = (dx / d) * sp;
          dvy = (dy / d) * sp;
        }
        agent.vx = lerp(agent.vx, dvx, clamp(10.5 * dt, 0, 1));
        agent.vy = lerp(agent.vy, dvy, clamp(10.5 * dt, 0, 1));
        agent.x = clamp(agent.x + agent.vx * dt, -COURT.halfW + 0.45, COURT.halfW - 0.45);
        agent.y = clamp(agent.y + agent.vy * dt, 0.55, COURT.length - 0.55);
        const spNow = hypot2(agent.vx, agent.vy);
        if (spNow > 0.35) {
          agent.stridePhase += spNow * dt * 3.2;
        }
        updatePlayerJumpAndPose(agent, dt, spNow > 4.2, false, false);
      }

      function computeHelpTriangleSpot(man, ballX, ballY, side) {
        const distBallToMan = hypot2(ballX - man.x, ballY - man.y);
        const helpWeight = clamp(distBallToMan / 11.5, 0.22, 0.55);
        const midX = lerp(man.x, ballX, 0.34);
        const midY = lerp(man.y, ballY, 0.28);
        return {
          x: lerp(midX, COURT.rimX + side * 0.5, helpWeight),
          y: lerp(midY, COURT.rimY + 1.45, helpWeight)
        };
      }

      function updateTargetSpot(dt) {
        state.helpTriangle.show = false;
        if (state.scenario === 'tutorial' || state.scenario === 'learn_d') {
          if (state.scenario === 'learn_d' && state.tutorial.step >= 3) {
            const hs = computeHelpTriangleSpot(state.offense[0], state.ball.x, state.ball.y, -1);
            state.helpTriangle.idealX = hs.x;
            state.helpTriangle.idealY = hs.y;
            state.helpTriangle.show = true;
          }
          return;
        }

        state.targetSpot.isWarn = false;
        const spot = START_SPOTS[state.startSpot];
        const side = spot.side;
        const meOff = state.offense[0];

        if (state.role === 'defense') {
          const myMan = state.offense[0];
          const manHasBall = !state.ball.inFlight && state.ball.holderIdx === 0;

          if (manHasBall || state.scenario === 'def_onball') {
            const bh = state.offense[state.ball.holderIdx];
            const toRimX = COURT.rimX - bh.x;
            const toRimY = COURT.rimY - bh.y;
            const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
            state.targetSpot.active = true;
            state.targetSpot.x = bh.x + (toRimX / dRim) * 1.12;
            state.targetSpot.y = bh.y + (toRimY / dRim) * 1.12;
            state.targetSpot.radius = 1.15;
            state.targetSpot.label = 'GUARD!';
            state.targetSpot.stepLabel = '';
            return;
          }

          if (state.scenario === 'def_cut') {
            const toRimX = COURT.rimX - myMan.x;
            const toRimY = COURT.rimY - myMan.y;
            const dRim = Math.max(0.01, hypot2(toRimX, toRimY));
            state.targetSpot.active = true;
            state.targetSpot.x = lerp(myMan.x + (toRimX / dRim) * 1.15, state.ball.x, 0.22);
            state.targetSpot.y = lerp(myMan.y + (toRimY / dRim) * 1.15, state.ball.y, 0.22);
            state.targetSpot.radius = 1.25;
            state.targetSpot.label = 'BLOCK CUT!';
            state.targetSpot.stepLabel = '';
            return;
          }

          // Help Triangle for defense_help & off-ball 5v5 Match!
          const hs = computeHelpTriangleSpot(myMan, state.ball.x, state.ball.y, myMan.x < 0 ? -1 : 1);
          state.helpTriangle.idealX = hs.x;
          state.helpTriangle.idealY = hs.y;
          state.helpTriangle.show = true;
          state.targetSpot.active = true;
          state.targetSpot.x = hs.x;
          state.targetSpot.y = hs.y;
          state.targetSpot.radius = 1.40;
          state.targetSpot.label = 'HELP!';
          state.targetSpot.stepLabel = '';
          return;
        }

        // Offense target spots
        if (!state.ball.inFlight && state.ball.holderIdx === 0) {
          state.targetSpot.active = true;
          state.targetSpot.x = side * 0.9;
          state.targetSpot.y = 2.15;
          state.targetSpot.radius = 1.35;
          state.targetSpot.label = 'SCORE!';
          state.targetSpot.stepLabel = '';
          return;
        }

        if (state.scenario === 'relocation') {
          if (spot.zone === 'wing') {
            state.targetSpot.x = side * 6.50;
            state.targetSpot.y = 2.15;
          } else {
            state.targetSpot.x = side * 5.75;
            state.targetSpot.y = 6.35;
          }
          state.targetSpot.active = true;
          state.targetSpot.radius = 1.45;
          state.targetSpot.label = 'OPEN!';
          state.targetSpot.stepLabel = '';
        } else if (state.scenario === 'cut') {
          state.targetSpot.active = true;
          state.targetSpot.x = side * 1.25;
          state.targetSpot.y = 2.25;
          state.targetSpot.radius = 1.40;
          state.targetSpot.label = 'CUT!';
          state.targetSpot.stepLabel = '';
        } else if (state.scenario === 'vcut') {
          const stepInX = side * 3.85;
          const stepInY = spot.zone === 'wing' ? 4.45 : 3.45;
          if (state.vcutStage === 1 && hypot2(meOff.x - stepInX, meOff.y - stepInY) < 1.35) {
            state.vcutStage = 2;
            setCoachMessage('good', '⚡', 'NOW POP OUT! SHIFT!', 1.2);
          }
          if (state.vcutStage === 1) {
            state.targetSpot.x = stepInX;
            state.targetSpot.y = stepInY;
            state.targetSpot.radius = 1.25;
            state.targetSpot.label = 'STEP IN';
            state.targetSpot.stepLabel = '1';
          } else {
            state.targetSpot.x = spot.zone === 'wing' ? side * 5.85 : side * 6.45;
            state.targetSpot.y = spot.zone === 'wing' ? 6.55 : 2.35;
            state.targetSpot.radius = 1.45;
            state.targetSpot.label = 'POP OUT!';
            state.targetSpot.stepLabel = '2';
          }
          state.targetSpot.active = true;
        } else {
          // 5v5 Match on Offense: best open spot
          const candidates = [
            { x: side * 6.50, y: 2.15, label: 'CORNER!' },
            { x: side * 5.70, y: 6.20, label: 'WING!' },
            { x: side * 1.25, y: 2.25, label: 'CUT!' },
            { x: 0.0, y: 8.65, label: 'TOP!' }
          ];
          let best = candidates[0];
          let bestScore = -999;
          for (let i = 0; i < candidates.length; i++) {
            const c = candidates[i];
            let minMate = 99;
            for (let m = 1; m < state.offense.length; m++) {
              minMate = Math.min(minMate, hypot2(c.x - state.offense[m].x, c.y - state.offense[m].y));
            }
            const score = minMate - hypot2(c.x - meOff.x, c.y - meOff.y) * 0.22;
            if (score > bestScore) {
              bestScore = score;
              best = c;
            }
          }
          state.targetSpot.active = true;
          state.targetSpot.x = best.x;
          state.targetSpot.y = best.y;
          state.targetSpot.radius = 1.45;
          state.targetSpot.label = best.label;
          state.targetSpot.stepLabel = '';
        }
      }

      function updateOffenseAI(dt) {
        const spot = START_SPOTS[state.startSpot];
        const side = spot.side;
        const pg = state.offense[1];

        // 1) Tutorials
        if (state.scenario === 'tutorial') {
          const tut = state.tutorial;
          const iHaveBall = !state.ball.inFlight && state.ball.holderIdx === 0;
          if (!iHaveBall) {
            if (tut.step === 1) {
              moveAgentToward(pg, -1.3, 6.2 + Math.sin(state.simTime * 2) * 0.2, 2.2, dt);
            } else if (tut.step === 2) {
              const driveDepth = clamp(state.simTime / 0.6, 0, 1);
              moveAgentToward(pg, lerp(-0.9, -1.2, driveDepth), lerp(7.4, 3.7, driveDepth), 3.6, dt);
            } else {
              moveAgentToward(pg, pg.homeX + Math.sin(state.simTime * 1.6) * 0.4, pg.homeY, 2.4, dt);
            }
            pg.gazeAngle = Math.atan2(state.offense[0].y - pg.y, state.offense[0].x - pg.x);
          }
          for (let i = (iHaveBall ? 1 : 2); i < state.offense.length; i++) {
            moveAgentToward(state.offense[i], state.offense[i].homeX, state.offense[i].homeY, 2.5, dt);
            state.offense[i].gazeAngle = Math.atan2(state.ball.y - state.offense[i].y, state.ball.x - state.offense[i].x);
          }
          return;
        }

        if (state.scenario === 'learn_d') {
          const tut = state.tutorial;
          if (tut.step === 1) {
            const swingX = Math.sin(state.simTime * 2.1) * 2.35;
            moveAgentToward(state.offense[0], swingX, 8.0, 3.4, dt);
            state.offense[0].gazeAngle = Math.atan2(COURT.rimY - state.offense[0].y, COURT.rimX - state.offense[0].x);
          } else if (tut.step === 2) {
            moveAgentToward(state.offense[0], 0.0, 6.8, 2.0, dt);
            state.offense[0].gazeAngle = Math.atan2(COURT.rimY - state.offense[0].y, COURT.rimX - state.offense[0].x);
          } else if (tut.step === 3) {
            moveAgentToward(state.offense[1], 4.6 + Math.sin(state.simTime * 2) * 0.5, 6.6, 2.6, dt);
            moveAgentToward(state.offense[0], -5.65, 6.0, 2.2, dt);
          } else if (tut.step === 4) {
            if (!state.ball.inFlight && state.ball.holderIdx === 1) {
