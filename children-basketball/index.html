                  if (state.scenario === "match" && checkAndHandleMatchWin(COURT.rimX, COURT.rimY)) {
                    // Handled victory banner & fireworks
                  } else if (wasAssist) {
                    spawnSparkles(COURT.rimX, COURT.rimY, "#38bdf8", 20);
                    setCoachMessage("celebrate", "🏀", "ASSIST! +" + pts + "!", 2.0);
                  } else if (state.scenario === "give_go" && state.giveGoStage >= 2) {
                    spawnSparkles(COURT.rimX, COURT.rimY, "#facc15", 22);
                    setCoachMessage("celebrate", "🏀", "GIVE & GO!!", 2.0);
                  } else {
                    spawnSparkles(COURT.rimX, COURT.rimY, "#facc15", 18);
                    const swishMsg = pts === 3 ? "SPLASH!! +3!" : "SWISH!! +" + pts + "!";
                    setCoachMessage("celebrate", "🏀", swishMsg, 2.0);
                  }
                } else {
                  state.fx.netSwishTimer = 0.85;
                  state.fx.netSwishHoop = 1;
                  if (state.scenario === "match") {
                    recordMatchBasket("cpu", pts, COURT.rimX, COURT.rimY, false);
                  }
                  if (state.scenario === "match" && checkAndHandleMatchWin(COURT.rimX, COURT.rimY)) {
                    // Handled CPU win banner
                  } else {
                    const hint =
                      state.helpTriangle.mistakeType === "ball_watch"
                        ? "WATCH YOUR MAN!"
                        : state.helpTriangle.mistakeType === "no_help"
                          ? "HELP INSIDE!"
                          : "HANDS UP FASTER!";
                    setCoachMessage("warn", "🏀", hint, 2.0);
                  }
                }
                syncAllDOM();
              }
            }
          }

          if (state.playPhase === "celebrate") {
            state.phaseTimer += dt;
            if (state.phaseTimer >= 1.85) {
              state.ball.postMakeDrop = false;
              if (state.appMode === "game" && state.scenario === "match") {
                if (state.matchFlow === "two_way") {
                  state.role = state.role === "offense" ? "defense" : "offense";
                } else if (state.matchFlow === "offense_only") {
                  state.role = "offense";
                } else if (state.matchFlow === "defense_only") {
                  state.role = "defense";
                }
              }
              resetScenario();
            }
          }
        }

        function spawnScorePopup(wx, wy, text, color) {
          const pops = state.fx.scorePopups;
          if (pops.length >= 16) return;
          const item = _popupPool.length > 0 ? _popupPool.pop() : {};
          item.x = wx;
          item.y = wy;
          item.z = COURT.rimZ + 0.55;
          item.vz = 1.55;
          item.life = 1.25;
          item.maxLife = 1.25;
          item.text = text;
          item.color = color;
          pops.push(item);
        }

        function recordMatchBasket(side, pts, rimX, rimY, wasAssist) {
          if (side === "you") {
            state.matchScore.you += pts;
            state.matchScore.youPopTimer = 0.48;
            spawnScorePopup(rimX, rimY, "+" + pts + "!", wasAssist ? "#38bdf8" : "#fde047");
          } else {
            state.matchScore.cpu += pts;
            state.matchScore.cpuPopTimer = 0.48;
            spawnScorePopup(rimX, rimY, "+" + pts + "!", "#f87171");
          }
          syncScorePopDOM();
        }

        function checkAndHandleMatchWin(rimX, rimY) {
          const target = state.matchScore.target;
          if (!target || target <= 0) return false;
          if (state.matchScore.you >= target) {
            state.matchScore.winner = "you";
            state.playPhase = "match_over";
            state.inbound.active = false;
            state.fx.crowdCheerTimer = 3.0;
            SoundEngine.playWhistle(true);
            spawnSparkles(rimX, rimY, "#facc15", 32);
            spawnSparkles(rimX, rimY, "#38bdf8", 24);
            setCoachMessage("celebrate", "🏆", "YOU WIN!!", 4.0);
            return true;
          }
          if (state.matchScore.cpu >= target) {
            state.matchScore.winner = "cpu";
            state.playPhase = "match_over";
            state.inbound.active = false;
            SoundEngine.playWhistle(false);
            spawnSparkles(rimX, rimY, "#f87171", 20);
            setCoachMessage("warn", "🏀", "CPU WINS! REMATCH!", 4.0);
            return true;
          }
          return false;
        }

        function resetMatchScores() {
          const keepTarget = state.matchScore && state.matchScore.target !== undefined ? state.matchScore.target : 11;
          state.matchScore = {
            you: 0,
            cpu: 0,
            stops: 0,
            steals: 0,
            target: keepTarget,
            winner: null,
            youPopTimer: 0,
            cpuPopTimer: 0,
          };
          while (state.fx.scorePopups.length > 0) _popupPool.push(state.fx.scorePopups.pop());
        }

        function startNewMatchGame() {
          resetMatchScores();
          if (!state.fullCourt && state.scenario === "match") {
            state.role = state.matchOriginRole || "offense";
          }
          resetScenario();
          SoundEngine.playWhistle(false);
          setCoachMessage("good", "🏆", "NEW MATCH! SCORE!", 1.2);
          syncAllDOM();
          renderFrame();
        }

        function setTargetScore(targetPts) {
          const val = parseInt(targetPts, 10);
          if (val !== 11 && val !== 21 && val !== 0) return;
          state.matchScore.target = val;
          if (state.playPhase === "match_over") {
            if (val === 0 || (state.matchScore.you < val && state.matchScore.cpu < val)) {
              state.matchScore.winner = null;
              resetScenario();
            }
          } else if (val > 0 && (state.fullCourt || state.scenario === "match")) {
            const rim = getTeamTargetRim("offense");
            checkAndHandleMatchWin(rim.x, rim.y);
          }
          syncAllDOM();
          renderFrame();
        }

        function spawnSparkles(wx, wy, color, count) {
          const sparks = state.fx.sparkles;
          for (let i = 0; i < count; i++) {
            if (sparks.length >= 64) break;
            const ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
            const spd = 1.2 + Math.random() * 2.4;
            const item = _sparklePool.length > 0 ? _sparklePool.pop() : {};
            item.x = wx;
            item.y = wy;
            item.z = 1.4 + Math.random() * 0.9;
            item.vx = Math.cos(ang) * spd;
            item.vy = Math.sin(ang) * spd;
            item.vz = 1.6 + Math.random() * 2.0;
            item.life = 0.7;
            item.maxLife = 0.7;
            item.color = color;
            sparks.push(item);
          }
        }

        function getEffectiveZoom() {
          const az = state.cam && state.cam.autoZoom ? state.cam.autoZoom : 1.0;
          const uz = state.cam && state.cam.userZoom ? state.cam.userZoom : 1.0;
          return clamp(az * uz, 0.7, 1.85);
        }

        function setUserZoom(val) {
          state.cam.userZoom = clamp(Number(val) || 1.0, 0.8, 1.5);
          syncAllDOM();
          renderFrame();
        }

        function adjustUserZoom(delta) {
          setUserZoom((state.cam.userZoom || 1.0) + delta);
        }

        function getUserAssignedOffenseMan() {
          if (!isUserOnDefenseNow()) return null;
          return state.fullCourt ? state.defense[0] : state.offense[0];
        }

        function computeLooseBallDropSpot(out) {
          const b = state.ball;
          const cLen = getCourtLength();
          const dzFloor = Math.max(0, b.z - 0.24);
          const discFloor = b.lvz * b.lvz + 2.0 * 9.8 * dzFloor;
          const tFloor = clamp((b.lvz + Math.sqrt(Math.max(0, discFloor))) / 9.8, 0, 1.35);

          let tTarget = tFloor;
          if (b.z > 1.45 || b.lvz > 0.6) {
            const discCatch = b.lvz * b.lvz + 2.0 * 9.8 * (b.z - 1.45);
            if (discCatch >= 0) {
              const tCatch = clamp((b.lvz + Math.sqrt(discCatch)) / 9.8, 0, tFloor);
              tTarget = lerp(tCatch, tFloor, 0.5);
            }
          }

          const predX = clamp(b.x + b.lvx * tTarget, -COURT.halfW + 0.45, COURT.halfW - 0.45);
          let predY = b.y + b.lvy * tTarget;
          if (predY < 1.28 && Math.abs(predX) <= 1.15) {
            predY = 1.29 + (1.28 - predY) * 0.58;
          } else if (state.fullCourt && predY > COURT.fullLength - 1.28 && Math.abs(predX) <= 1.15) {
            predY = COURT.fullLength - 1.29 - (predY - (COURT.fullLength - 1.28)) * 0.58;
          }
          predY = clamp(predY, 0.55, cLen - 0.55);

          const floorX = clamp(b.x + b.lvx * tFloor, -COURT.halfW + 0.45, COURT.halfW - 0.45);
          const floorY = clamp(b.y + b.lvy * tFloor, 0.55, cLen - 0.55);
          if (out) {
            out.x = predX;
            out.y = predY;
            out.floorX = floorX;
            out.floorY = floorY;
            out.tFloor = tFloor;
            return out;
          }
          return { x: predX, y: predY, floorX, floorY, tFloor };
        }

        function updateCamera(dt, instant) {
          const me = getControlledPlayer();
          if (!me) return;

          const defNow = isUserOnDefenseNow();
          const looseRim = state.ball.loose ? getTeamTargetRim(state.ball.shooterTeam || "offense") : null;
          const activeRimX = looseRim ? looseRim.x : COURT.rimX;
          const activeRimY = looseRim ? looseRim.y : state.fullCourt && defNow ? COURT.southRimY : COURT.rimY;
          const isTutMode = !state.fullCourt && (state.scenario === "tutorial" || state.scenario === "learn_d");
          const isPracticeDrill = !state.fullCourt && state.appMode === "practice";

          // 1) Smart Kid-Friendly First-Person (👀 FPS) Eye, Gaze Yaw, Auto-Pitch & Roll Director!
          const iHaveBall = !defNow && !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === 0;
          const meSpd = hypot2(me.vx || 0, me.vy || 0);
          const hasMoveKeys = keys.W || keys.A || keys.S || keys.D;
          if (!state.cam.dragging && dt > 0 && hasMoveKeys) {
            state.cam.fpsManualYawOffset = lerp(state.cam.fpsManualYawOffset || 0, 0, clamp(1.85 * dt, 0, 1));
            state.cam.fpsManualPitchOffset = lerp(state.cam.fpsManualPitchOffset || 0, 0, clamp(2.1 * dt, 0, 1));
          }

          let baseFpsYaw = Math.atan2(activeRimY - me.y, activeRimX - me.x);
          if (state.ball.loose) {
            const drop = computeLooseBallDropSpot(_scratchDrop);
            const ballAimX = lerp(activeRimX, state.ball.x, 0.65);
            const ballAimY = lerp(activeRimY, state.ball.y, 0.65);
            const aimX = lerp(ballAimX, drop.x, 0.46);
            const aimY = lerp(ballAimY, drop.y, 0.46);
            if (hypot2(aimX - me.x, aimY - me.y) > 0.28) {
              baseFpsYaw = Math.atan2(aimY - me.y, aimX - me.x);
            }
          } else if (state.ball.inFlight && state.ball.flightType === "shot") {
            const aimX = lerp(activeRimX, state.ball.x, 0.65);
            const aimY = lerp(activeRimY, state.ball.y, 0.65);
            if (hypot2(aimX - me.x, aimY - me.y) > 0.35) {
              baseFpsYaw = Math.atan2(aimY - me.y, aimX - me.x);
            }
          } else if (defNow) {
            const myMan = getUserAssignedOffenseMan();
            const dBall = hypot2(state.ball.x - me.x, state.ball.y - me.y);
            const angBall = dBall > 0.25 ? Math.atan2(state.ball.y - me.y, state.ball.x - me.x) : baseFpsYaw;
            if (myMan) {
              const dMan = hypot2(myMan.x - me.x, myMan.y - me.y);
              const angMan = dMan > 0.25 ? Math.atan2(myMan.y - me.y, myMan.x - me.x) : angBall;
              const manIsHolder = !state.ball.inFlight && hypot2(myMan.x - state.ball.x, myMan.y - state.ball.y) < 0.85;
              const passToMyMan = state.ball.inFlight && state.ball.flightType === "pass" && state.ball.targetIdx === myMan.id;
              const tutCloseout = state.scenario === "learn_d" && state.tutorial.step === 4 && state.tutorial.subPhase === "closeout_now";
              if (manIsHolder) {
                baseFpsYaw = angMan;
              } else if (passToMyMan || tutCloseout) {
                baseFpsYaw = lerpAngle(angBall, angMan, 0.85);
              } else {
                const spanBM = wrapAngle(angBall - angMan);
                if (Math.abs(spanBM) <= 1.2) {
                  baseFpsYaw = lerpAngle(angMan, angBall, 0.5);
                } else {
                  // Wide weak-side split (> 69 deg): keep ball-handler inside FOV (~30 deg) angled toward myMan!
                  baseFpsYaw = wrapAngle(angBall - (spanBM > 0 ? 0.52 : -0.52));
                }
              }
            } else {
              baseFpsYaw = angBall;
            }
          } else if (iHaveBall) {
            const rimYaw = Math.atan2(COURT.rimY - me.y, COURT.rimX - me.x);
            if (meSpd > 0.65) {
              const toRimD = Math.max(0.05, hypot2(COURT.rimX - me.x, COURT.rimY - me.y));
              const velDotRim = (me.vx * (COURT.rimX - me.x) + me.vy * (COURT.rimY - me.y)) / (meSpd * toRimD);
              if (velDotRim > -0.25) {
                baseFpsYaw = lerpAngle(rimYaw, Math.atan2(me.vy, me.vx), 0.18);
              } else {
                baseFpsYaw = rimYaw;
              }
            } else {
              baseFpsYaw = rimYaw;
            }
          } else {
            const passer = state.offense[clamp(state.ball.holderIdx, 0, state.offense.length - 1)];
            const blendRim = state.fullCourt && me.y > 11.5 && meSpd > 2.8 && me.vy < -0.5 ? 0.62 : 0.48;
            const aimX = passer ? lerp(passer.x, COURT.rimX, blendRim) : COURT.rimX;
            const aimY = passer ? lerp(passer.y, COURT.rimY, blendRim) : COURT.rimY;
            if (hypot2(aimX - me.x, aimY - me.y) > 0.35) {
              baseFpsYaw = Math.atan2(aimY - me.y, aimX - me.x);
            }
          }

          // Natural Target-Spot Gaze Guidance in Tutorials (LEARN / LEARN D) & Off-Ball Practice Drills!
          let spotGuideDist = -1;
          if (
            !state.ball.loose &&
            !(state.ball.inFlight && state.ball.flightType === "shot") &&
            state.targetSpot.active &&
            (isTutMode || (isPracticeDrill && !iHaveBall))
          ) {
            const dSpot = hypot2(state.targetSpot.x - me.x, state.targetSpot.y - me.y);
            if (dSpot > 0.48) {
              spotGuideDist = dSpot;
              const spotYaw = Math.atan2(state.targetSpot.y - me.y, state.targetSpot.x - me.x);
              const blendW = isTutMode ? (iHaveBall ? 0.36 : 0.72) : 0.42;
              baseFpsYaw = lerpAngle(baseFpsYaw, spotYaw, blendW);
              const maxCone = isTutMode ? 0.44 : 0.56; // <= 25.2 deg in tutorials, <= 32.1 deg in practice (well inside +/-43 deg FOV!)
              const coneErr = wrapAngle(spotYaw - baseFpsYaw);
              if (Math.abs(coneErr) > maxCone) {
                baseFpsYaw = wrapAngle(spotYaw - (coneErr > 0 ? maxCone : -maxCone));
              }
            }
          }

          state.cam.targetFpsYaw = wrapAngle(baseFpsYaw + (state.cam.fpsManualYawOffset || 0));
          if (instant || dt <= 0 || state.cam.dragging) {
            state.cam.fpsYaw = state.cam.targetFpsYaw;
            state.cam.velFpsYaw = 0;
          } else {
            state.cam.fpsYaw = smoothDampAngle(state.cam.fpsYaw, state.cam.targetFpsYaw, state.cam, "velFpsYaw", 0.14, 8.2, Math.min(dt, 0.04));
          }

          // Compute 7-Year-Old Eye Position (1.16m standing, crouch dip, jump elevation, gentle stride bob & contact jolt!)
          let crouchDrop = 0;
          if ((me.boxOutTimer || 0) > 0 && (me.jumpZ || 0) <= 0.02) crouchDrop = 0.11;
          else if (iHaveBall && state.ball.gatherTimer > 0) crouchDrop = 0.09;
          else if (iHaveBall) crouchDrop = 0.055 + (state.rhythm.crossoverTimer > 0 ? 0.04 : 0);
          else if (defNow) crouchDrop = 0.08;
          else if ((me.crouch || 0) > 0.1) crouchDrop = 0.06 * me.crouch;

          const runBlendFps = (me.jumpZ || 0) > 0.02 ? 0 : clamp((meSpd - 0.25) / 3.8, 0, 1);
          const strideBobZ = Math.sin((me.stridePhase || 0) * 2.0) * 0.015 * runBlendFps;
          const cShake = clamp((me.contactTimer || 0) / 0.26, 0, 1);
          const contactBumpZ = Math.sin(state.simTime * 42.0) * 0.02 * cShake;

          const cosFY = Math.cos(state.cam.fpsYaw);
          const sinFY = Math.sin(state.cam.fpsYaw);
          state.cam.fpsEyeX = me.x + cosFY * 0.12;
          state.cam.fpsEyeY = me.y + sinFY * 0.12;
          state.cam.fpsEyeZ = clamp(1.16 + (me.jumpZ || 0) - crouchDrop + strideBobZ + contactBumpZ, 0.88, 2.3);

          const rimHorizDist = Math.max(0.85, hypot2(activeRimX - state.cam.fpsEyeX, activeRimY - state.cam.fpsEyeY));
          // Steady hoop focus between rim (z = 3.05m) and backboard center (z = 3.25m) -> z = 3.15m
          const hoopFocusZ = 3.15;
          const rimElevAng = Math.atan2(hoopFocusZ - state.cam.fpsEyeZ, rimHorizDist);
          const desiredRimScreenOffset = lerp(0.34, 0.2, clamp((rimHorizDist - 2.0) / 6.0, 0, 1));
          const pitchForRim = clamp(rimElevAng - desiredRimScreenOffset, -0.09, 0.36);

          let baseFpsPitch = pitchForRim;
          if (state.ball.inFlight && state.ball.flightType === "shot") {
            // Keep eyes locked steadily on the rim (3.05m) & backboard (3.25m) rather than chasing 4.5m shot apex!
            baseFpsPitch = clamp(Math.max(pitchForRim, rimElevAng - 0.18), -0.09, 0.36);
          } else if (state.ball.loose) {
            const bDist = Math.max(1.1, hypot2(state.ball.x - state.cam.fpsEyeX, state.ball.y - state.cam.fpsEyeY));
            const cappedBallZ = Math.min(state.ball.z, 3.25);
            const ballElev = Math.atan2(cappedBallZ - state.cam.fpsEyeZ, bDist) - 0.14;
            baseFpsPitch = clamp(lerp(pitchForRim, ballElev, 0.48), -0.14, 0.36);
          } else if (state.ball.inFlight) {
            baseFpsPitch = clamp(pitchForRim * 0.8, -0.12, 0.28);
          } else if (defNow) {
            baseFpsPitch = clamp(rimElevAng * 0.18 - 0.05, -0.16, 0.28);
          } else if (!iHaveBall && rimHorizDist > 8.0) {
            baseFpsPitch = clamp(pitchForRim * 0.72 - 0.02, -0.12, 0.3);
          }

          // Frame floor targetSpot (z = 0.05m) cleanly inside vertical FOV so nearby tutorial/practice rings never clip off bottom!
          const minFpsPitch = spotGuideDist > 0.62 && (!iHaveBall || isTutMode) ? -0.4 : -0.22;
          if (spotGuideDist > 0.62 && (!iHaveBall || isTutMode)) {
            const eyeToSpot = Math.max(0.75, hypot2(state.targetSpot.x - state.cam.fpsEyeX, state.targetSpot.y - state.cam.fpsEyeY));
            const spotElev = Math.atan2(0.05 - state.cam.fpsEyeZ, eyeToSpot);
            const maxPitchForSpot = spotElev + 0.25;
            if (baseFpsPitch > maxPitchForSpot) {
              baseFpsPitch = clamp(lerp(baseFpsPitch, maxPitchForSpot, isTutMode ? 0.94 : 0.8), minFpsPitch, 0.36);
            }
          }

          state.cam.targetFpsPitch = clamp(baseFpsPitch + (state.cam.fpsManualPitchOffset || 0), minFpsPitch, 0.36);
          if (instant || dt <= 0 || state.cam.dragging) {
            state.cam.fpsPitch = state.cam.targetFpsPitch;
            state.cam.velFpsPitch = 0;
          } else {
            state.cam.fpsPitch = clamp(
              smoothDampScalar(state.cam.fpsPitch, state.cam.targetFpsPitch, state.cam, "velFpsPitch", 0.13, 6.8, Math.min(dt, 0.04)),
              minFpsPitch,
              0.36
            );
          }

          const localContactRight = (me.contactDirX || 0) * -sinFY + (me.contactDirY || 0) * cosFY;
          const crossRoll = state.rhythm.crossoverTimer > 0 ? (state.rhythm.crossoverDir || 1) * 0.04 : 0;
          state.cam.fpsRoll = clamp(crossRoll + localContactRight * 0.048 * cShake, -0.12, 0.12);

          // 2) Weighted 3rd-Person Smart Director Focus: 46% YOU + 38% Ball + 16% Active Rim
          const rawFX = 0.46 * me.x + 0.38 * state.ball.x + 0.16 * activeRimX;
          const rawFY = 0.46 * me.y + 0.38 * state.ball.y + 0.16 * activeRimY;

          let targetFX = 0.0;
          let targetFY = 7.0;
          let targetAutoZoom = 1.0;

          if (state.cam.preset === "auto") {
            const spread = Math.max(
              hypot2(me.x - state.ball.x, me.y - state.ball.y),
              hypot2(me.x - activeRimX, me.y - activeRimY) * 0.58,
              hypot2(state.ball.x - activeRimX, state.ball.y - activeRimY) * 0.58
            );
            targetAutoZoom = lerp(1.16, 0.94, clamp((spread - 3.8) / 8.7, 0, 1));

            if (state.fullCourt) {
              // Smoothly open North Hoop (-108..-113 deg) on offense & South Hoop (-67..-72 deg) on defense
              const endBias = clamp((14.0 - rawFY) / 11.5, -1.0, 1.0);
              const sideBias = clamp(rawFX * 0.018, -0.08, 0.08);
              state.cam.targetYaw = wrapAngle(-Math.PI * 0.5 - endBias * 0.35 + sideBias);
              targetFX = clamp(rawFX * 0.68, -3.4, 3.4);
              targetFY = clamp(rawFY, 5.4, 22.6);
            } else {
              // Half-Court Smart 3/4 Director Angle (+/- 22 deg) so passing lanes & defender vision open stereoscopically
              const avgWX = 0.56 * me.x + 0.44 * state.ball.x;
              state.cam.targetYaw = clamp(-avgWX * 0.068, -0.38, 0.38);
              targetFX = clamp(rawFX * 0.65, -3.2, 3.2);
              targetFY = clamp(rawFY * 0.72 + 1.6, 4.2, 7.8);
            }
          } else {
            if (state.cam.preset === "tv") {
              state.cam.targetYaw = CAMERA_PRESETS.tv;
            } else if (state.cam.preset === "iso") {
              state.cam.targetYaw = CAMERA_PRESETS.iso;
            } else if (state.cam.preset === "behind") {
              // NBA 2K Cam: swivel 180 deg on Full-Court defense so South Hoop stays ahead!
              if (state.fullCourt && !state.ball.loose) {
                state.cam.targetYaw = defNow ? Math.PI : CAMERA_PRESETS.behind;
              } else if (!state.fullCourt) {
                state.cam.targetYaw = CAMERA_PRESETS.behind;
              }
            } else if (state.cam.preset === "follow") {
              const gx = activeRimX - me.x;
              const gy = activeRimY - me.y;
              if (hypot2(gx, gy) > 0.25) {
                state.cam.targetYaw = Math.atan2(gx, -gy);
              }
            }

            targetAutoZoom = 1.0;
            if (state.fullCourt) {
              if (state.cam.preset === "follow") {
                targetFX = clamp(me.x * 0.5, -3.5, 3.5);
                targetFY = clamp(me.y, 7.5, 20.5);
              } else {
                targetFX = clamp(rawFX * 0.42, -2.6, 2.6);
                targetFY = clamp(rawFY, 6.2, 21.8);
              }
            } else {
              if (state.cam.preset === "behind" && Math.abs(state.cam.yaw) < 0.05) {
                targetFX = clamp(me.x * 0.42, -3.1, 3.1);
                targetFY = 6.6;
              } else if (state.cam.preset === "follow") {
                targetFX = clamp(me.x * 0.48, -3.2, 3.2);
                targetFY = clamp(me.y * 0.55 + 2.6, 4.2, 8.4);
              } else {
                targetFX = clamp(me.x * 0.28, -2.2, 2.2);
                targetFY = 6.5;
              }
            }
          }

          state.cam.targetAutoZoom = targetAutoZoom;

          if (instant || dt <= 0 || state.cam.dragging) {
            state.cam.yaw = state.cam.targetYaw;
            state.cam.focusX = targetFX;
            state.cam.focusY = targetFY;
            state.cam.autoZoom = targetAutoZoom;
            state.cam.velFX = 0;
            state.cam.velFY = 0;
            state.cam.velYaw = 0;
            state.cam.velZoom = 0;
          } else {
            const dtCam = Math.min(dt, 0.04);
            const is2KSwivel = state.cam.preset === "behind" && state.fullCourt;
            const yawSmooth = state.cam.preset === "auto" ? 0.46 : is2KSwivel ? 0.3 : 0.26;
            const yawMaxSpd = is2KSwivel ? 6.2 : 2.15;
            const posSmooth = state.cam.preset === "auto" ? 0.34 : 0.24;
            const zoomSmooth = 0.45;
            state.cam.yaw = smoothDampAngle(state.cam.yaw, state.cam.targetYaw, state.cam, "velYaw", yawSmooth, yawMaxSpd, dtCam);
            state.cam.focusX = smoothDampScalar(state.cam.focusX, targetFX, state.cam, "velFX", posSmooth, 16.0, dtCam);
            state.cam.focusY = smoothDampScalar(state.cam.focusY, targetFY, state.cam, "velFY", posSmooth, 18.0, dtCam);
            state.cam.autoZoom = smoothDampScalar(state.cam.autoZoom, targetAutoZoom, state.cam, "velZoom", zoomSmooth, 1.4, dtCam);
          }
        }

        function updateEffects(dt, realDt) {
          if (keys.SpaceFlash > 0) keys.SpaceFlash = Math.max(0, keys.SpaceFlash - dt);
          if (keys.CallFlash > 0) keys.CallFlash = Math.max(0, keys.CallFlash - dt);
          if (keys.ViewFlash > 0) keys.ViewFlash = Math.max(0, keys.ViewFlash - dt);
          if (state.uiKeyWFlash > 0) state.uiKeyWFlash = Math.max(0, state.uiKeyWFlash - dt);
          if (state.fx.netSwishTimer > 0) state.fx.netSwishTimer = Math.max(0, state.fx.netSwishTimer - dt);
          if (state.fx.crowdCheerTimer > 0) state.fx.crowdCheerTimer = Math.max(0, state.fx.crowdCheerTimer - dt);

          if (state.matchScore.youPopTimer > 0 || state.matchScore.cpuPopTimer > 0) {
            if (state.matchScore.youPopTimer > 0) {
              state.matchScore.youPopTimer = Math.max(0, state.matchScore.youPopTimer - dt);
            }
            if (state.matchScore.cpuPopTimer > 0) {
              state.matchScore.cpuPopTimer = Math.max(0, state.matchScore.cpuPopTimer - dt);
            }
            syncScorePopDOM();
          }

          const me = getControlledPlayer();
          state.fx.camX = lerp(state.fx.camX, clamp(me.x * 0.42, -3.1, 3.1), clamp(5.8 * dt, 0, 1));
          updateCamera(realDt !== undefined ? realDt : dt, false);

          const pops = state.fx.scorePopups;
          for (let i = pops.length - 1; i >= 0; i--) {
            const pop = pops[i];
            pop.life -= dt;
            if (pop.life <= 0) {
              const lastIdx = pops.length - 1;
              if (i !== lastIdx) pops[i] = pops[lastIdx];
              pops.pop();
              _popupPool.push(pop);
              continue;
            }
            pop.z += pop.vz * dt;
            pop.vz *= 0.96;
          }

          const sparks = state.fx.sparkles;
          for (let i = sparks.length - 1; i >= 0; i--) {
            const sp = sparks[i];
            sp.life -= dt;
            if (sp.life <= 0) {
              const lastIdx = sparks.length - 1;
              if (i !== lastIdx) sparks[i] = sparks[lastIdx];
              sparks.pop();
              _sparklePool.push(sp);
              continue;
            }
            sp.x += sp.vx * dt;
            sp.y += sp.vy * dt;
            sp.z = Math.max(0.1, sp.z + sp.vz * dt);
            sp.vz -= 6.5 * dt;
          }

          const dusts = state.fx.dusts;
          for (let i = dusts.length - 1; i >= 0; i--) {
            const du = dusts[i];
            du.life -= dt;
            if (du.life <= 0) {
              const lastIdx = dusts.length - 1;
              if (i !== lastIdx) dusts[i] = dusts[lastIdx];
              dusts.pop();
              _dustPool.push(du);
              continue;
            }
            du.x += du.vx * dt;
            du.y += du.vy * dt;
            du.z += du.vz * dt;
          }
        }

        function stepSimulation(realDt) {
          const clampedReal = Math.min(realDt, 0.05);
          if (state.coach.lockTimer > 0) {
            state.coach.lockTimer = Math.max(0, state.coach.lockTimer - clampedReal);
          }
          if (state.paused) return;

          const dt = clampedReal * state.speedScale;
          state.simTime += dt;
          tickAllPlayerTimers(dt);

          if (state.playPhase !== "celebrate" && state.playPhase !== "match_over") {
            updateUserPlayer(dt);
            updateTargetSpot(dt);
            updateOffenseAI(dt);
            updateDefendersAI(dt);
            resolvePlayerCollisionsAndJostling(dt);
            updateDribblePressure(dt);
            evaluateSpacingAndLane(dt);
            updatePassTarget();
            updateTutorialLogic(dt);
          } else {
            state.passTarget.idx = -1;
            state.dribblePressure.timer = 0;
            state.dribblePressure.ratio = 0;
          }
          updateAllPlayerFacings(dt);
          updateBallAndPhases(dt);
          updateEffects(dt, clampedReal);
          syncLiveBadgesDOM();
          syncKeycapsDOM();
        }

        /* =====================================================================
         * 9. View B Renderer: Broadcast Tactical Board (360 Cones & Pass Target)
         * ===================================================================== */
        const canvasA = document.getElementById("canvasA");
        const canvasB = document.getElementById("canvasB");
        const ctxA = canvasA.getContext("2d");
        const ctxB = canvasB.getContext("2d");
        const DOM_HOLDER_A = document.getElementById("holderA");
        const DOM_HOLDER_B = document.getElementById("holderB");
        const CANVAS_HOLDERS = [
          { holder: DOM_HOLDER_A, canvas: canvasA },
          { holder: DOM_HOLDER_B, canvas: canvasB },
        ];

        const THREE_BREAK_ANG = Math.atan2(COURT.threeBreakY - COURT.rimY, COURT.threeCornerX);
        const COS_045 = Math.cos(0.45);
        const SIN_045 = Math.sin(0.45);
        const CONE_HALF_ANG_38 = (38 * Math.PI) / 180;
        const TAN_43_DEG = Math.tan((43 * Math.PI) / 180);
        const TAN_32_5_DEG = Math.tan((32.5 * Math.PI) / 180);
        const _scratchBoardDrop = { x: 0, y: 0 };

        function getActualFpsHalfHFov(fallbackW, fallbackH) {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const useA = state.viewMode !== "b" && canvasA.width > 0 && canvasA.height > 0;
          const w = useA ? canvasA.width / dpr : fallbackW;
          const h = useA ? canvasA.height / dpr : fallbackH;
          const focal = Math.min(w / (2 * TAN_43_DEG), h / (2 * TAN_32_5_DEG)) * clamp(state.cam.userZoom || 1.0, 0.8, 1.4);
          return Math.atan2(w * 0.5, Math.max(1, focal));
        }

        const _boardBoxes = [
          { x: 0, y: 0, w: 0, h: 0 },
          { x: 0, y: 0, w: 0, h: 0 },
          { x: 0, y: 0, w: 0, h: 0 },
          { x: 0, y: 0, w: 0, h: 0 },
          { x: 0, y: 0, w: 0, h: 0 },
          { x: 0, y: 0, w: 0, h: 0 },
        ];
        let _boardBoxCount = 0;
        const BOARD_CAND_DX = [0, 0, -28, 28, 0, 0, -28, 28, -56, 56, 0, 0];
        const BOARD_CAND_DY = [0, 1, 0, 0, -22, 22, 1, 1, 0, 0, -42, 42];

        function _resetBoardPillObstacles(W, H) {
          _boardBoxCount = 0;
          const b0 = _boardBoxes[_boardBoxCount++];
          b0.x = W - 96;
          b0.y = H - 37;
          b0.w = 88;
          b0.h = 30;
          if (state.paused) {
            const b1 = _boardBoxes[_boardBoxCount++];
            b1.x = W * 0.5 - 92;
            b1.y = 6;
            b1.w = 184;
            b1.h = 32;
          }
        }

        function drawBoardSpotLabelPill(ctx, text, rx, ry, borderCol, textCol, fontPx, W, H, altY) {
          if (!text) return;
          const bw = W || 420;
          const bh = H || 270;
          ctx.font = "900 " + fontPx + "px sans-serif";
          ctx.textAlign = "center";
          const tw = Math.ceil(ctx.measureText(text).width);
          const pw = Math.min(Math.max(38, bw - 8), Math.max(38, tw + 12));
          const ph = fontPx + 7;
          const minX = 4;
          const maxX = Math.max(minX, bw - pw - 4);
          const minY = 4;
          const maxY = Math.max(minY, bh - ph - 4);
          const pad = 3;

          let chosenX = clamp(rx - pw * 0.5, minX, maxX);
          let chosenY = clamp(ry - ph * 0.5, minY, maxY);
          const hasAlt = altY !== undefined && Number.isFinite(altY);

          for (let c = 0; c < BOARD_CAND_DX.length; c++) {
            const useAlt = BOARD_CAND_DY[c] === 1;
            if (useAlt && !hasAlt) continue;
            const baseCy = useAlt ? altY : ry + BOARD_CAND_DY[c];
            const cx = clamp(rx + BOARD_CAND_DX[c] - pw * 0.5, minX, maxX);
            const cy = clamp(baseCy - ph * 0.5, minY, maxY);
            let hit = false;
            for (let i = 0; i < _boardBoxCount; i++) {
              const ob = _boardBoxes[i];
              if (cx < ob.x + ob.w + pad && cx + pw + pad > ob.x && cy < ob.y + ob.h + pad && cy + ph + pad > ob.y) {
                hit = true;
                break;
              }
            }
            if (!hit) {
              chosenX = cx;
              chosenY = cy;
              break;
            }
          }

          if (_boardBoxCount < _boardBoxes.length) {
            const slot = _boardBoxes[_boardBoxCount++];
            slot.x = chosenX;
            slot.y = chosenY;
            slot.w = pw;
            slot.h = ph;
          }

          ctx.fillStyle = "rgba(15, 23, 42, 0.90)";
          ctx.strokeStyle = borderCol;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(chosenX, chosenY, pw, ph, 6);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = textCol;
          ctx.fillText(text, chosenX + pw * 0.5, chosenY + ph * 0.5 + fontPx * 0.34);
        }

        function resizeCanvases() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          for (let i = 0; i < CANVAS_HOLDERS.length; i++) {
            const h = CANVAS_HOLDERS[i].holder || document.getElementById(i === 0 ? "holderA" : "holderB");
            const c = CANVAS_HOLDERS[i].canvas;
            if (!h || h.offsetParent === null) continue;
            const w = Math.max(240, h.clientWidth);
            const ht = Math.max(220, h.clientHeight);
            const rw = Math.round(w * dpr);
            const rh = Math.round(ht * dpr);
            if (c.width !== rw || c.height !== rh) {
              c.width = rw;
              c.height = rh;
            }
          }
        }

        function drawCameraBadgeOnBoard(ctx, W, H, arrowScreenAng) {
          const cx = W - 44;
          const cy = H - 22;
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.90)";
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.roundRect(cx - 34, cy - 13, 68, 26, 8);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#bae6fd";
          ctx.font = "900 10px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText(state.cam.preset === "fps" ? "👀" : "🎥", cx - 28, cy + 4);

          const ax = cx + 12;
          const ay = cy;
          ctx.fillStyle = "rgba(56, 189, 248, 0.32)";
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.arc(ax, ay, 11, arrowScreenAng - 0.48, arrowScreenAng + 0.48);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "#facc15";
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(ax - Math.cos(arrowScreenAng) * 5, ay - Math.sin(arrowScreenAng) * 5);
          ctx.lineTo(ax + Math.cos(arrowScreenAng) * 8, ay + Math.sin(arrowScreenAng) * 8);
          ctx.stroke();
          ctx.restore();
        }

        /* Pure Orthogonal WASD 4-Way Cross Pad Badge for 📋 BOARD Mode */
        function drawBoardCardinalBadge(ctx, W, H) {
          const cx = W - 52;
          const cy = H - 22;
          ctx.save();
          ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.roundRect(cx - 42, cy - 13, 84, 26, 8);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#7dd3fc";
          ctx.font = "900 9.5px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText("WASD", cx - 35, cy + 3.5);

          const px = cx + 21;
          const py = cy;
          ctx.strokeStyle = "#64748b";
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(px, py - 8);
          ctx.lineTo(px, py + 8);
          ctx.moveTo(px - 8, py);
          ctx.lineTo(px + 8, py);
          ctx.stroke();

          const drawTip = (dx, dy, active) => {
            ctx.fillStyle = active ? "#facc15" : "#cbd5e1";
            ctx.beginPath();
            ctx.arc(px + dx, py + dy, active ? 3.2 : 2.3, 0, Math.PI * 2);
            ctx.fill();
          };
          drawTip(0, -8, keys.W);
          drawTip(0, 8, keys.S);
          drawTip(-8, 0, keys.A);
          drawTip(8, 0, keys.D);
          ctx.restore();
        }

        function renderFullCourtTopDownB(W, H) {
          _resetBoardPillObstacles(W, H);
          const pad = 10;
          const scale = Math.min((W - pad * 2) / COURT.fullLength, (H - pad * 2 - 4) / COURT.width);
          const courtPxW = COURT.fullLength * scale;
          const courtPxH = COURT.width * scale;
          const leftX = (W - courtPxW) * 0.5;
          const topY = (H - courtPxH) * 0.5;
          const midY = topY + courtPxH * 0.5;
          const userDefNow = isUserOnDefenseNow();
          const fpsHalfHFov = state.cam.preset === "fps" ? getActualFpsHalfHFov(W, H) : 0;

          // Horizontal mapping matching TV Cam (South y=28 on LEFT, North y=0 on RIGHT, wx=-7.5 TOP, wx=+7.5 BOTTOM)
          const mapX = (wy) => leftX + (COURT.fullLength - wy) * scale;
          const mapY = (wx) => midY + wx * scale;
          const mapAng = (rad) => rad + Math.PI * 0.5;

          // Royal Blue Court Apron
          ctxB.fillStyle = "#1e3a8a";
          ctxB.fillRect(leftX - 7, topY - 7, courtPxW + 14, courtPxH + 14);

          // Maple Hardwood Planks (2 batched fill passes instead of 28 fillRects)
          ctxB.fillStyle = "#eec68a";
          ctxB.fillRect(leftX, topY, courtPxW, courtPxH);
          ctxB.fillStyle = "rgba(180, 118, 48, 0.11)";
          ctxB.beginPath();
          for (let ym = 0; ym < 28; ym += 2) ctxB.rect(mapX(ym + 1), topY, scale, courtPxH);
          ctxB.fill();
          ctxB.fillStyle = "rgba(255, 245, 225, 0.13)";
          ctxB.beginPath();
          for (let ym = 1; ym < 28; ym += 2) ctxB.rect(mapX(ym + 1), topY, scale, courtPxH);
          ctxB.fill();

          // Right Key (North Hoop y = 0..5.8, Blue YOU Target) & Left Key (South Hoop y = 22.2..28, Red CPU Target)
          ctxB.fillStyle = "rgba(37, 99, 235, 0.80)";
          ctxB.fillRect(mapX(COURT.paintLen), mapY(-COURT.paintHalfW), COURT.paintLen * scale, COURT.paintHalfW * 2 * scale);
          ctxB.fillStyle = "rgba(220, 38, 38, 0.76)";
          ctxB.fillRect(leftX, mapY(-COURT.paintHalfW), COURT.paintLen * scale, COURT.paintHalfW * 2 * scale);

          // Subtle Floor Goal Labels
          ctxB.save();
          ctxB.font = "900 10px sans-serif";
          ctxB.textAlign = "center";
          ctxB.fillStyle = "rgba(29, 78, 216, 0.55)";
          ctxB.fillText("YOU SCORE ▶", mapX(9.2), midY + 4);
          ctxB.fillStyle = "rgba(185, 28, 28, 0.55)";
          ctxB.fillText("◀ DEFEND", mapX(18.8), midY + 4);
          ctxB.restore();

          // Crisp Court Lines, Midcourt, Circles & 3PT Arcs (batched white stroke)
          ctxB.strokeStyle = "#ffffff";
          ctxB.lineWidth = 2.0;
          ctxB.strokeRect(leftX, topY, courtPxW, courtPxH);
          ctxB.strokeRect(mapX(COURT.paintLen), mapY(-COURT.paintHalfW), COURT.paintLen * scale, COURT.paintHalfW * 2 * scale);
          ctxB.strokeRect(leftX, mapY(-COURT.paintHalfW), COURT.paintLen * scale, COURT.paintHalfW * 2 * scale);

          const breakAng = THREE_BREAK_ANG;
          ctxB.beginPath();
          ctxB.moveTo(mapX(COURT.midY), topY);
          ctxB.lineTo(mapX(COURT.midY), topY + courtPxH);
          ctxB.moveTo(mapX(COURT.midY) + 1.8 * scale, midY);
          ctxB.arc(mapX(COURT.midY), midY, 1.8 * scale, 0, Math.PI * 2);
          ctxB.moveTo(mapX(COURT.paintLen) + COURT.ftRadius * scale, midY);
          ctxB.arc(mapX(COURT.paintLen), midY, COURT.ftRadius * scale, 0, Math.PI * 2);
          ctxB.moveTo(mapX(COURT.fullLength - COURT.paintLen) + COURT.ftRadius * scale, midY);
          ctxB.arc(mapX(COURT.fullLength - COURT.paintLen), midY, COURT.ftRadius * scale, 0, Math.PI * 2);
          ctxB.moveTo(mapX(COURT.rimY), midY + COURT.noChargeRadius * scale);
          ctxB.arc(mapX(COURT.rimY), midY, COURT.noChargeRadius * scale, Math.PI * 0.5, Math.PI * 1.5);
          ctxB.moveTo(mapX(COURT.southRimY), midY - COURT.noChargeRadius * scale);
          ctxB.arc(mapX(COURT.southRimY), midY, COURT.noChargeRadius * scale, -Math.PI * 0.5, Math.PI * 0.5);
          ctxB.moveTo(mapX(0), mapY(-COURT.threeCornerX));
          ctxB.lineTo(mapX(COURT.threeBreakY), mapY(-COURT.threeCornerX));
          ctxB.arc(mapX(COURT.rimY), midY, COURT.threeRadius * scale, -(Math.PI * 0.5 + breakAng), Math.PI * 0.5 + breakAng, true);
          ctxB.lineTo(mapX(0), mapY(COURT.threeCornerX));
          ctxB.moveTo(mapX(COURT.fullLength), mapY(-COURT.threeCornerX));
          ctxB.lineTo(mapX(COURT.southThreeBreakY), mapY(-COURT.threeCornerX));
          ctxB.arc(mapX(COURT.southRimY), midY, COURT.threeRadius * scale, -(Math.PI * 0.5 - breakAng), Math.PI * 0.5 - breakAng, false);
          ctxB.lineTo(mapX(COURT.fullLength), mapY(COURT.threeCornerX));
          ctxB.stroke();

          // Both Backboards & Rims
          ctxB.strokeStyle = "#0f172a";
          ctxB.lineWidth = 3.2;
          ctxB.beginPath();
          ctxB.moveTo(mapX(COURT.backboardY), mapY(-COURT.backboardHalfW));
          ctxB.lineTo(mapX(COURT.backboardY), mapY(COURT.backboardHalfW));
          ctxB.moveTo(mapX(COURT.southBackboardY), mapY(-COURT.backboardHalfW));
          ctxB.lineTo(mapX(COURT.southBackboardY), mapY(COURT.backboardHalfW));
          ctxB.stroke();

          ctxB.strokeStyle = "#ea580c";
          ctxB.lineWidth = 2.6;
          const rimRPx = COURT.rimRadius * scale + 1.5;
          ctxB.beginPath();
          ctxB.arc(mapX(COURT.rimY), midY, rimRPx, 0, Math.PI * 2);
          ctxB.moveTo(mapX(COURT.southRimY) + rimRPx, midY);
          ctxB.arc(mapX(COURT.southRimY), midY, rimRPx, 0, Math.PI * 2);
          ctxB.stroke();

          // Target Spot Circle (WCAG AA >= 5.0:1 dark label capsule)
          if (state.showHints && state.targetSpot.active) {
            const pulse = 1 + Math.sin(state.simTime * 5.2) * 0.07;
            const rx = mapX(state.targetSpot.y);
            const ry = mapY(state.targetSpot.x);
            const rr = state.targetSpot.radius * scale * pulse;
            ctxB.save();
            ctxB.fillStyle = userDefNow ? "rgba(56, 189, 248, 0.24)" : "rgba(34, 197, 94, 0.26)";
            ctxB.strokeStyle = userDefNow ? "#38bdf8" : "#16a34a";
            ctxB.lineWidth = 2.4;
            ctxB.setLineDash([6, 4]);
            ctxB.beginPath();
            ctxB.arc(rx, ry, rr, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.setLineDash([]);
            drawBoardSpotLabelPill(
              ctxB,
              state.targetSpot.label,
              rx,
              ry,
              userDefNow ? "#38bdf8" : "#4ade80",
              userDefNow ? "#bae6fd" : "#86efac",
              10,
              W,
              H
            );
            ctxB.restore();
          }

          // On-Ball Direct Pass Target Ring (E Key)
          if (
            !userDefNow &&
            !state.ball.inFlight &&
            !state.ball.loose &&
            state.ball.holderTeam === "offense" &&
            state.ball.holderIdx === 0 &&
            state.passTarget.idx > 0
          ) {
            const me = state.offense[0];
            const targetMate = state.offense[state.passTarget.idx];
            const mx = mapX(me.y);
            const my = mapY(me.x);
            const tx = mapX(targetMate.y);
            const ty = mapY(targetMate.x);
            const ringR = 0.92 * scale * (1 + Math.sin(state.simTime * 6.5) * 0.09);

            ctxB.save();
            ctxB.strokeStyle = state.passTarget.laneOpen ? "rgba(56, 189, 248, 0.85)" : "rgba(251, 146, 60, 0.85)";
            ctxB.lineWidth = 2.2;
            ctxB.setLineDash([5, 4]);
            ctxB.beginPath();
            ctxB.moveTo(mx, my);
            ctxB.lineTo(tx, ty);
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.fillStyle = state.passTarget.laneOpen ? "rgba(56, 189, 248, 0.24)" : "rgba(251, 146, 60, 0.22)";
            ctxB.strokeStyle = state.passTarget.laneOpen ? "#38bdf8" : "#fb923c";
            ctxB.lineWidth = 2.4;
            ctxB.beginPath();
            ctxB.arc(tx, ty, ringR, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            drawBoardSpotLabelPill(
              ctxB,
              "🎯 #" + targetMate.number + " E",
              tx,
              ty + ringR + 9,
              state.passTarget.laneOpen ? "#38bdf8" : "#fb923c",
              state.passTarget.laneOpen ? "#7dd3fc" : "#fed7aa",
              9.5,
              W,
              H,
              ty - ringR - 9
            );
            ctxB.restore();
          }

          // Amber Dribble Strip Warning Ring (TIGHT!)
          if (state.dribblePressure.ratio >= 0.48) {
            const me = state.offense[0];
            ctxB.save();
            ctxB.fillStyle = "rgba(245, 158, 11, 0.28)";
            ctxB.strokeStyle = "#f59e0b";
            ctxB.lineWidth = 2.8;
            ctxB.beginPath();
            ctxB.arc(mapX(me.y), mapY(me.x), (0.95 + Math.sin(state.simTime * 18) * 0.12) * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();
          }

          // Defender Vision Cones (zero slice allocation)
          const coneR = 2.3 * scale;
          const defList = userDefNow ? state.offense : state.defense;
          for (let i = userDefNow ? 1 : 0; i < defList.length; i++) {
            const d = defList[i];
            const sx = mapX(d.y);
            const sy = mapY(d.x);
            const dirAng = mapAng(d.facing !== undefined ? d.facing : d.gazeAngle);
            ctxB.fillStyle = d.ballWatchFactor > 0.55 ? "rgba(250, 204, 21, 0.26)" : "rgba(239, 68, 68, 0.14)";
            ctxB.beginPath();
            ctxB.moveTo(sx, sy);
            ctxB.arc(sx, sy, coneR, dirAng - CONE_HALF_ANG_38, dirAng + CONE_HALF_ANG_38);
            ctxB.closePath();
            ctxB.fill();
          }

          // Defensive Matchup Tether + Assigned Man Target Ring (Full-Court Defense)
          if (userDefNow) {
            const meBlue = state.offense[0];
            const myMan = getUserAssignedOffenseMan();
            if (meBlue && myMan) {
              const mx = mapX(meBlue.y);
              const my = mapY(meBlue.x);
              const ox = mapX(myMan.y);
              const oy = mapY(myMan.x);
              ctxB.save();
              ctxB.strokeStyle = "rgba(56, 189, 248, 0.88)";
              ctxB.lineWidth = 2.4;
              ctxB.setLineDash([5, 4]);
              ctxB.beginPath();
              ctxB.moveTo(mx, my);
              ctxB.lineTo(ox, oy);
              ctxB.stroke();
              ctxB.setLineDash([]);
              ctxB.fillStyle = "rgba(56, 189, 248, 0.22)";
              ctxB.strokeStyle = "#38bdf8";
              ctxB.lineWidth = 2.4;
              ctxB.beginPath();
              ctxB.arc(ox, oy, Math.max(12, 0.72 * scale), 0, Math.PI * 2);
              ctxB.fill();
              ctxB.stroke();
              ctxB.restore();
            }
          }

          // In-Flight Pass / Shot Trajectory Guide & Loose Rebound Landing Target Ring on Full-Court Board
          if (state.ball.inFlight) {
            const fx = mapX(state.ball.fromY);
            const fy = mapY(state.ball.fromX);
            const tx = mapX(state.ball.toY);
            const ty = mapY(state.ball.toX);
            const isShot = state.ball.flightType === "shot";
            ctxB.save();
            ctxB.strokeStyle = isShot ? "rgba(250, 204, 21, 0.85)" : "rgba(56, 189, 248, 0.85)";
            ctxB.lineWidth = 2.2;
            ctxB.setLineDash([5, 4]);
            ctxB.beginPath();
            ctxB.moveTo(fx, fy);
            ctxB.lineTo(tx, ty);
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.strokeStyle = isShot ? "#facc15" : "#38bdf8";
            ctxB.lineWidth = 2.2;
            ctxB.beginPath();
            ctxB.arc(tx, ty, (0.58 + Math.sin(state.simTime * 9.0) * 0.08) * scale, 0, Math.PI * 2);
            ctxB.stroke();
            ctxB.restore();
          } else if (state.ball.loose) {
            const drop = computeLooseBallDropSpot(_scratchBoardDrop);
            const dx = mapX(drop.y);
            const dy = mapY(drop.x);
            const bxCur = mapX(state.ball.y);
            const byCur = mapY(state.ball.x);
            ctxB.save();
            ctxB.strokeStyle = "rgba(250, 204, 21, 0.85)";
            ctxB.lineWidth = 2.0;
            ctxB.setLineDash([4, 3]);
            ctxB.beginPath();
            ctxB.moveTo(bxCur, byCur);
            ctxB.lineTo(dx, dy);
            ctxB.stroke();
            ctxB.fillStyle = "rgba(56, 189, 248, 0.25)";
            ctxB.strokeStyle = "#38bdf8";
            ctxB.lineWidth = 2.4;
            ctxB.beginPath();
            ctxB.arc(dx, dy, (0.76 + Math.sin(state.simTime * 10.0) * 0.09) * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.strokeStyle = "#facc15";
            ctxB.lineWidth = 2.0;
            ctxB.beginPath();
            ctxB.arc(dx, dy, (1.02 + Math.cos(state.simTime * 10.0) * 0.08) * scale, 0, Math.PI * 2);
            ctxB.stroke();
            ctxB.restore();
          }

          // Player Tokens
          const drawFCToken = (p, isBlue, isMe, hasBallNow) => {
            const sx = mapX(p.y);
            const sy = mapY(p.x);
            const rPx = Math.max(8.5, 0.52 * scale);
            const fAng = mapAng(p.facing !== undefined ? p.facing : p.gazeAngle);
            const cf = Math.cos(fAng);
            const sf = Math.sin(fAng);

            ctxB.fillStyle = "rgba(15, 23, 42, 0.35)";
            ctxB.beginPath();
            ctxB.arc(sx, sy + 2, rPx, 0, Math.PI * 2);
            ctxB.fill();

            if (hasBallNow) {
              const bPulse = 1 + Math.sin(state.simTime * 8.5) * 0.08;
              ctxB.strokeStyle = "#fb923c";
              ctxB.lineWidth = 3.2;
              ctxB.beginPath();
              ctxB.arc(sx, sy, (rPx + 5.6) * bPulse, 0, Math.PI * 2);
              ctxB.stroke();
              ctxB.strokeStyle = "#ffffff";
              ctxB.lineWidth = 1.6;
              ctxB.beginPath();
              ctxB.arc(sx, sy, rPx + 2.8, 0, Math.PI * 2);
              ctxB.stroke();
            }

            if (isMe) {
              if (state.cam.preset === "fps") {
                const fovScreenAng = mapAng(state.cam.fpsYaw);
                const fovR = 6.5 * scale;
                ctxB.fillStyle = "rgba(250, 204, 21, 0.20)";
                ctxB.strokeStyle = "rgba(250, 204, 21, 0.74)";
                ctxB.lineWidth = 1.6;
                ctxB.beginPath();
                ctxB.moveTo(sx, sy);
                ctxB.arc(sx, sy, fovR, fovScreenAng - fpsHalfHFov, fovScreenAng + fpsHalfHFov);
                ctxB.closePath();
                ctxB.fill();
                ctxB.stroke();
              }
              ctxB.strokeStyle = "#facc15";
              ctxB.lineWidth = 3.8;
              ctxB.beginPath();
              ctxB.arc(sx, sy, rPx + 3.8, 0, Math.PI * 2);
              ctxB.stroke();
            }

            const noseR = rPx + 3.8;
            const baseR = rPx - 1;
            ctxB.fillStyle = isMe ? "#facc15" : "#ffffff";
            ctxB.beginPath();
            ctxB.moveTo(sx + cf * noseR, sy + sf * noseR);
            ctxB.lineTo(sx + (cf * COS_045 + sf * SIN_045) * baseR, sy + (sf * COS_045 - cf * SIN_045) * baseR);
            ctxB.lineTo(sx + (cf * COS_045 - sf * SIN_045) * baseR, sy + (sf * COS_045 + cf * SIN_045) * baseR);
            ctxB.closePath();
            ctxB.fill();

            const oppTokenFC = !isBlue;
            ctxB.fillStyle = isBlue ? "#2563eb" : p.offBalanceTimer > 0 && oppTokenFC ? "#f97316" : "#dc2626";
            ctxB.strokeStyle = "#ffffff";
            ctxB.lineWidth = 1.9;
            ctxB.beginPath();
            ctxB.arc(sx, sy, rPx, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();

            ctxB.fillStyle = isMe ? "#fef08a" : "#ffffff";
            ctxB.font = "900 10px sans-serif";
            ctxB.textAlign = "center";
            ctxB.fillText(isMe ? "★" : String(p.number), sx, sy + 3.5);
            if (oppTokenFC && p.offBalanceTimer > 0) {
              ctxB.font = "900 11px sans-serif";
              ctxB.fillText("⚡", sx, sy - rPx - 3);
            }
          };

          for (let i = 0; i < state.defense.length; i++) {
            const hb = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "defense" && state.ball.holderIdx === i;
            drawFCToken(state.defense[i], false, false, hb);
          }
          for (let i = 0; i < state.offense.length; i++) {
            const hb = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === i;
            drawFCToken(state.offense[i], true, i === 0, hb);
          }

          // Basketball Token
          const bx = mapX(state.ball.y);
          const by = mapY(state.ball.x);
          if (state.ball.gatherTimer > 0 || state.ball.loose) {
            ctxB.strokeStyle = state.ball.loose ? "#38bdf8" : "#facc15";
            ctxB.lineWidth = 2.6;
            ctxB.beginPath();
            ctxB.arc(bx, by, 11 + Math.sin(state.simTime * 22) * 2, 0, Math.PI * 2);
            ctxB.stroke();
          }
          const ballR = Math.max(5.8, (0.3 + Math.min(0.16, state.ball.z * 0.04)) * scale);
          ctxB.fillStyle = "#f97316";
          ctxB.strokeStyle = "#7c2d12";
          ctxB.lineWidth = 1.8;
          ctxB.beginPath();
          ctxB.arc(bx, by, ballR, 0, Math.PI * 2);
          ctxB.fill();
          ctxB.stroke();

          // In 📋 BOARD sole view (or board-focused input), show orthogonal WASD cross instead of 3D camera compass
          if (state.viewMode === "b" || isBoardInputActive()) {
            drawBoardCardinalBadge(ctxB, W, H);
          } else {
            drawCameraBadgeOnBoard(ctxB, W, H, state.cam.preset === "fps" ? mapAng(state.cam.fpsYaw) : state.cam.yaw);
          }
          if (state.paused) drawPauseOverlayPill(ctxB, W);
        }

        function renderTopDownB() {
          if (state.viewMode === "a") return;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const W = canvasB.width / dpr;
          const H = canvasB.height / dpr;
          if (W <= 0 || H <= 0) return;

          ctxB.save();
          ctxB.scale(dpr, dpr);

          ctxB.fillStyle = "#0f172a";
          ctxB.fillRect(0, 0, W, H);

          if (state.fullCourt) {
            renderFullCourtTopDownB(W, H);
            ctxB.restore();
            return;
          }

          const pad = 11;
          const scale = Math.min((W - pad * 2) / COURT.width, (H - pad * 2) / COURT.length);
          const courtPxW = COURT.width * scale;
          const courtPxH = COURT.length * scale;
          const originX = (W - courtPxW) * 0.5 + courtPxW * 0.5;
          const originY = (H - courtPxH) * 0.5;
          _resetBoardPillObstacles(W, H);
          const fpsHalfHFov = state.cam.preset === "fps" ? getActualFpsHalfHFov(W, H) : 0;

          const toSX = (wx) => originX + wx * scale;
          const toSY = (wy) => originY + wy * scale;

          // Royal Blue Court Apron
          ctxB.fillStyle = "#1e3a8a";
          ctxB.fillRect(toSX(-COURT.halfW) - 8, toSY(0) - 8, courtPxW + 16, courtPxH + 16);

          // Maple Hardwood Planks (2 batched fill passes instead of 14 fillRects)
          ctxB.fillStyle = "#eec68a";
          ctxB.fillRect(toSX(-COURT.halfW), toSY(0), courtPxW, courtPxH);
          ctxB.fillStyle = "rgba(180, 118, 48, 0.12)";
          ctxB.beginPath();
          for (let xm = -6; xm <= 6; xm += 2) ctxB.rect(toSX(xm), toSY(0), scale, courtPxH);
          ctxB.fill();
          ctxB.fillStyle = "rgba(255, 245, 225, 0.14)";
          ctxB.beginPath();
          for (let xm = -7; xm <= 5; xm += 2) ctxB.rect(toSX(xm), toSY(0), scale, courtPxH);
          ctxB.fill();

          // Inside 3-pt warm highlight & Two-Tone Paint
          const startAng = THREE_BREAK_ANG;
          const endAng = Math.PI - startAng;
          ctxB.fillStyle = "rgba(255, 250, 235, 0.20)";
          ctxB.beginPath();
          ctxB.moveTo(toSX(-COURT.threeCornerX), toSY(0));
          ctxB.lineTo(toSX(-COURT.threeCornerX), toSY(COURT.threeBreakY));
          ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), COURT.threeRadius * scale, endAng, startAng, true);
          ctxB.lineTo(toSX(COURT.threeCornerX), toSY(0));
          ctxB.closePath();
          ctxB.fill();

          ctxB.fillStyle = "#1d4ed8";
          ctxB.fillRect(toSX(-COURT.paintHalfW), toSY(0), COURT.paintHalfW * 2 * scale, COURT.paintLen * scale);
          ctxB.fillStyle = "rgba(234, 88, 12, 0.25)";
          ctxB.fillRect(toSX(-COURT.paintHalfW + 0.35), toSY(0), (COURT.paintHalfW * 2 - 0.7) * scale, COURT.paintLen * scale);

          // Crisp Court Lines (batched white stroke)
          ctxB.strokeStyle = "#ffffff";
          ctxB.lineWidth = 2.2;
          ctxB.strokeRect(toSX(-COURT.halfW), toSY(0), courtPxW, courtPxH);
          ctxB.strokeRect(toSX(-COURT.paintHalfW), toSY(0), COURT.paintHalfW * 2 * scale, COURT.paintLen * scale);

          ctxB.beginPath();
          ctxB.arc(toSX(0), toSY(COURT.paintLen), COURT.ftRadius * scale, 0, Math.PI * 2);
          ctxB.moveTo(toSX(COURT.noChargeRadius), toSY(COURT.rimY));
          ctxB.arc(toSX(0), toSY(COURT.rimY), COURT.noChargeRadius * scale, 0, Math.PI);
          ctxB.moveTo(toSX(-1.8), toSY(COURT.length));
          ctxB.arc(toSX(0), toSY(COURT.length), 1.8 * scale, Math.PI, Math.PI * 2);
          ctxB.moveTo(toSX(-COURT.threeCornerX), toSY(0));
          ctxB.lineTo(toSX(-COURT.threeCornerX), toSY(COURT.threeBreakY));
          ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), COURT.threeRadius * scale, endAng, startAng, true);
          ctxB.lineTo(toSX(COURT.threeCornerX), toSY(0));
          ctxB.stroke();

          // Backboard & Rim
          ctxB.strokeStyle = "#0f172a";
          ctxB.lineWidth = 3.5;
          ctxB.beginPath();
          ctxB.moveTo(toSX(-COURT.backboardHalfW), toSY(COURT.backboardY));
          ctxB.lineTo(toSX(COURT.backboardHalfW), toSY(COURT.backboardY));
          ctxB.stroke();

          ctxB.strokeStyle = "#ea580c";
          ctxB.lineWidth = 2.8;
          ctxB.beginPath();
          ctxB.arc(toSX(COURT.rimX), toSY(COURT.rimY), (COURT.rimRadius + state.fx.netSwishTimer * 0.12) * scale, 0, Math.PI * 2);
          ctxB.stroke();

          // Help Triangle Gem Overlay
          if (state.role === "defense" && state.helpTriangle.show) {
            const meDef = state.defense[0];
            const myMan = state.offense[0];
            ctxB.save();
            ctxB.fillStyle = "rgba(16, 185, 129, 0.24)";
            ctxB.strokeStyle = "#10b981";
            ctxB.lineWidth = 2.4;
            ctxB.setLineDash([6, 4]);
            ctxB.beginPath();
            ctxB.moveTo(toSX(state.ball.x), toSY(state.ball.y));
            ctxB.lineTo(toSX(myMan.x), toSY(myMan.y));
            ctxB.lineTo(toSX(meDef.x), toSY(meDef.y));
            ctxB.closePath();
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();
          }

          // Target Spot Circle (WCAG AA >= 5.0:1 dark label capsule)
          const isTutMode = state.scenario === "tutorial" || state.scenario === "learn_d";
          if ((state.showHints || isTutMode) && state.targetSpot.active) {
            const pulse = 1 + Math.sin(state.simTime * 5.2) * 0.07;
            const rx = toSX(state.targetSpot.x);
            const ry = toSY(state.targetSpot.y);
            const rr = state.targetSpot.radius * scale * pulse;
            const isWarnSpot = state.targetSpot.isWarn;

            ctxB.save();
            ctxB.fillStyle = isWarnSpot ? "rgba(245, 158, 11, 0.28)" : "rgba(34, 197, 94, 0.28)";
            ctxB.strokeStyle = isWarnSpot ? "#f59e0b" : "#16a34a";
            ctxB.lineWidth = 2.8;
            ctxB.setLineDash([7, 5]);
            ctxB.beginPath();
            ctxB.arc(rx, ry, rr, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.setLineDash([]);

            drawBoardSpotLabelPill(
              ctxB,
              state.targetSpot.label,
              rx,
              ry,
              isWarnSpot ? "#fbbf24" : "#4ade80",
              isWarnSpot ? "#fde047" : "#86efac",
              11,
              W,
              H

          }

          // On-Ball Direct Pass Target Ring & Sky-Blue Guide (E Key)
          if (state.role === "offense" && !state.ball.inFlight && state.ball.holderIdx === 0 && state.passTarget.idx > 0) {
            const me = state.offense[0];
            const targetMate = state.offense[state.passTarget.idx];
            const mx = toSX(me.x);
            const my = toSY(me.y);
            const tx = toSX(targetMate.x);
            const ty = toSY(targetMate.y);
            const pulse = 1 + Math.sin(state.simTime * 6.5) * 0.09;
            const ringR = 0.92 * scale * pulse;

            ctxB.save();
            ctxB.strokeStyle = state.passTarget.laneOpen ? "rgba(56, 189, 248, 0.85)" : "rgba(251, 146, 60, 0.85)";
            ctxB.lineWidth = 2.4;
            ctxB.setLineDash([6, 5]);
            ctxB.beginPath();
            ctxB.moveTo(mx, my);
            ctxB.lineTo(tx, ty);
            ctxB.stroke();
            ctxB.setLineDash([]);

            ctxB.fillStyle = state.passTarget.laneOpen ? "rgba(56, 189, 248, 0.24)" : "rgba(251, 146, 60, 0.22)";
            ctxB.strokeStyle = state.passTarget.laneOpen ? "#38bdf8" : "#fb923c";
            ctxB.lineWidth = 2.6;
            ctxB.beginPath();
            ctxB.arc(tx, ty, ringR, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();

              ctxB,
              "🎯 #" + targetMate.number + " E",

              ty + ringR + 10,
              state.passTarget.laneOpen ? "#38bdf8" : "#fb923c",
              state.passTarget.laneOpen ? "#7dd3fc" : "#fed7aa",
              10.5,
              W,
              H,

            ctxB.restore();

          // Amber Dribble Strip Warning Ring in Half-Court
          if (state.dribblePressure.ratio >= 0.48 && state.role === "offense") {

            ctxB.save();
            ctxB.fillStyle = "rgba(245, 158, 11, 0.26)";
            ctxB.strokeStyle = "#f59e0b";
            ctxB.lineWidth = 2.8;
            ctxB.beginPath();
            ctxB.arc(toSX(me.x), toSY(me.y), (0.92 + Math.sin(state.simTime * 18) * 0.1) * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.restore();

          // Crowding Warning Ring
          if (state.role === "offense" && state.lane.crowdedTeammateIdx !== -1) {

            ctxB.strokeStyle = "#ea580c";

            ctxB.arc(toSX(mate.x), toSY(mate.y), COURT.crowdingDist * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();

          }

          // Defender Vision Cones (±38 deg, synced with 3D facing!)
          for (let i = 0; i < state.defense.length; i++) {
            const d = state.defense[i];
            if (state.role === "defense" && i === 0) continue;
            const sx = toSX(d.x);
            const sy = toSY(d.y);
            const coneR = (d.ballWatchFactor > 0.55 ? 3.1 : 2.3) * scale;

            ctxB.fillStyle = d.ballWatchFactor > 0.55 ? "rgba(250, 204, 21, 0.30)" : "rgba(239, 68, 68, 0.15)";
            ctxB.beginPath();
            ctxB.moveTo(sx, sy);
            ctxB.arc(sx, sy, coneR, dirAng - CONE_HALF_ANG_38, dirAng + CONE_HALF_ANG_38);
            ctxB.closePath();
            ctxB.fill();
          }

          // Flowing Neon Green Passing Lane or Red Blocked X
          if (state.role === "offense" && !state.ball.inFlight && state.ball.holderIdx !== 0) {
            const passer = state.offense[state.ball.holderIdx];
            const me = state.offense[0];
            const x1 = toSX(passer.x);
            const y1 = toSY(passer.y);
            const x2 = toSX(me.x);
            const y2 = toSY(me.y);

            ctxB.save();
            if (state.lane.open) {
              ctxB.strokeStyle = "rgba(34, 197, 94, 0.36)";
              ctxB.lineWidth = 9;
              ctxB.beginPath();
              ctxB.moveTo(x1, y1);
              ctxB.lineTo(x2, y2);
              ctxB.stroke();

              ctxB.strokeStyle = "#16a34a";
              ctxB.lineWidth = 3.5;
              ctxB.beginPath();
              ctxB.moveTo(x1, y1);
              ctxB.lineTo(x2, y2);
              ctxB.stroke();

              const dxL = x2 - x1;
              const dyL = y2 - y1;
              const invL = 1 / Math.max(0.001, Math.hypot(dxL, dyL));
              const ux = dxL * invL;
              const uy = dyL * invL;
              const px = -uy;

                ctxB.lineWidth = 2.2;
                ctxB.beginPath();
                ctxB.moveTo(bx - 3.5, by - 3.5);
                ctxB.lineTo(bx + 3.5, by + 3.5);
                ctxB.moveTo(bx + 3.5, by - 3.5);
                ctxB.lineTo(bx - 3.5, by + 3.5);

          // Defensive Matchup Tether + Assigned Man Target Ring (Half-Court Defense)

              ctxB.moveTo(mx, my);
              ctxB.lineTo(ox, oy);
              ctxB.stroke();
              ctxB.setLineDash([]);
              ctxB.fillStyle = "rgba(56, 189, 248, 0.22)";
              ctxB.strokeStyle = "#38bdf8";
              ctxB.lineWidth = 2.6;
              ctxB.beginPath();
              ctxB.arc(ox, oy, Math.max(14, 0.72 * scale), 0, Math.PI * 2);

              ctxB.stroke();
              ctxB.restore();

          }

          // In-Flight Pass / Shot Trajectory Guide on Half-Court Board
          if (state.ball.inFlight) {
            const fx = toSX(state.ball.fromX);
            const fy = toSY(state.ball.fromY);
            const tx = toSX(state.ball.toX);
            const ty = toSY(state.ball.toY);

            ctxB.lineWidth = 2.4;
            ctxB.setLineDash([5, 4]);
            ctxB.beginPath();
            ctxB.moveTo(fx, fy);
            ctxB.lineTo(tx, ty);
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.strokeStyle = isShot ? "#facc15" : "#38bdf8";
            ctxB.lineWidth = 2.4;
            ctxB.beginPath();
            ctxB.arc(tx, ty, (0.58 + Math.sin(state.simTime * 9.0) * 0.08) * scale, 0, Math.PI * 2);
            ctxB.stroke();
            ctxB.restore();
          } else if (state.ball.loose) {
            const drop = computeLooseBallDropSpot(_scratchBoardDrop);
            const dx = toSX(drop.x);
            const dy = toSY(drop.y);
            const bxCur = toSX(state.ball.x);
            const byCur = toSY(state.ball.y);
            ctxB.save();
            ctxB.strokeStyle = "rgba(250, 204, 21, 0.88)";
            ctxB.lineWidth = 2.2;
            ctxB.setLineDash([4, 3]);
            ctxB.beginPath();
            ctxB.moveTo(bxCur, byCur);
            ctxB.lineTo(dx, dy);
            ctxB.stroke();
            ctxB.fillStyle = "rgba(56, 189, 248, 0.26)";
            ctxB.strokeStyle = "#38bdf8";
            ctxB.lineWidth = 2.6;
            ctxB.beginPath();
            ctxB.arc(dx, dy, (0.76 + Math.sin(state.simTime * 10.0) * 0.09) * scale, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();
            ctxB.setLineDash([]);
            ctxB.strokeStyle = "#facc15";
            ctxB.lineWidth = 2.2;
            ctxB.beginPath();
            ctxB.arc(dx, dy, (1.02 + Math.cos(state.simTime * 10.0) * 0.08) * scale, 0, Math.PI * 2);

          // Glossy Player Tokens + 360 Facing Indicator
          function drawToken(p, isOff, isMe, hasBallNow) {
            const sx = toSX(p.x);
            const sy = toSY(p.y);
            const rPx = Math.max(10.5, 0.5 * scale);
            const fAng = p.facing !== undefined ? p.facing : p.gazeAngle;
            const cf = Math.cos(fAng);
            const sf = Math.sin(fAng);

            // Drop shadow
            ctxB.fillStyle = "rgba(15, 23, 42, 0.35)";
            ctxB.beginPath();
            ctxB.arc(sx, sy + 2.5, rPx, 0, Math.PI * 2);
            ctxB.fill();

            if (hasBallNow) {
              const bPulse = 1 + Math.sin(state.simTime * 8.5) * 0.08;
              ctxB.strokeStyle = "#fb923c";
              ctxB.lineWidth = 3.5;
              ctxB.beginPath();
              ctxB.arc(sx, sy, (rPx + 6.5) * bPulse, 0, Math.PI * 2);
              ctxB.stroke();
              ctxB.strokeStyle = "#ffffff";
              ctxB.lineWidth = 1.8;
              ctxB.beginPath();
              ctxB.arc(sx, sy, rPx + 3.2, 0, Math.PI * 2);
              ctxB.stroke();
            }

            if (isMe) {
              if (state.cam.preset === "fps") {
                const fovR = 6.5 * scale;
                ctxB.fillStyle = "rgba(250, 204, 21, 0.20)";
                ctxB.strokeStyle = "rgba(250, 204, 21, 0.74)";
                ctxB.lineWidth = 1.8;
                ctxB.beginPath();
                ctxB.moveTo(sx, sy);
                ctxB.arc(sx, sy, fovR, state.cam.fpsYaw - fpsHalfHFov, state.cam.fpsYaw + fpsHalfHFov);
                ctxB.closePath();
                ctxB.fill();
                ctxB.stroke();
              }
              ctxB.strokeStyle = "#facc15";
              ctxB.lineWidth = 4.5;
              ctxB.beginPath();
              ctxB.arc(sx, sy, rPx + 4.5, 0, Math.PI * 2);
              ctxB.stroke();
            }

            // Directional facing nose chevron on rim of token
            const noseR = rPx + 4.2;
            const baseR = rPx - 1;
            ctxB.fillStyle = isMe ? "#facc15" : "#ffffff";
            ctxB.beginPath();
            ctxB.moveTo(sx + cf * noseR, sy + sf * noseR);
            ctxB.lineTo(sx + (cf * COS_045 + sf * SIN_045) * baseR, sy + (sf * COS_045 - cf * SIN_045) * baseR);
            ctxB.lineTo(sx + (cf * COS_045 - sf * SIN_045) * baseR, sy + (sf * COS_045 + cf * SIN_045) * baseR);
            ctxB.closePath();
            ctxB.fill();

            const isOppToken = isOpponentTeamSide(isOff);
            ctxB.fillStyle = isOff
              ? p.offBalanceTimer > 0 && isOppToken
                ? "#f97316"
                : "#2563eb"
              : p.offBalanceTimer > 0 && isOppToken
                ? "#f97316"
                : "#dc2626";
            ctxB.strokeStyle = "#ffffff";
            ctxB.lineWidth = 2.2;
            ctxB.beginPath();
            ctxB.arc(sx, sy, rPx, 0, Math.PI * 2);
            ctxB.fill();
            ctxB.stroke();

            // Glossy top highlight arc
            ctxB.fillStyle = "rgba(255, 255, 255, 0.25)";
            ctxB.beginPath();
            ctxB.arc(sx, sy - rPx * 0.25, rPx * 0.65, 0, Math.PI * 2);
            ctxB.fill();

            ctxB.fillStyle = isMe ? "#fef08a" : "#ffffff";
            ctxB.font = "900 11.5px sans-serif";
            ctxB.textAlign = "center";
            ctxB.fillText(isMe ? "★" : String(p.number), sx, sy + 4);

            if (p.offBalanceTimer > 0 && isOppToken) {
              ctxB.font = "900 13px sans-serif";
              ctxB.fillText("⚡", sx, sy - rPx - 4);
            } else if (!isOff && p.ballWatchFactor > 0.55) {
              ctxB.font = "900 12px sans-serif";
              ctxB.fillText("👀", sx, sy - rPx - 4);
            }
          }

          for (let i = 0; i < state.defense.length; i++) {
            const hb = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "defense" && state.ball.holderIdx === i;
            drawToken(state.defense[i], false, state.role === "defense" && i === 0, hb);
          }
          for (let i = 0; i < state.offense.length; i++) {
            const hb = !state.ball.inFlight && !state.ball.loose && state.ball.holderTeam === "offense" && state.ball.holderIdx === i;
            drawToken(state.offense[i], true, state.role === "offense" && i === 0, hb);
          }

          // Basketball Token + Pre-shot Gather Warning Halo
          const bx = toSX(state.ball.x);
          const by = toSY(state.ball.y);
          if (state.ball.gatherTimer > 0) {
            ctxB.strokeStyle = "#facc15";
            ctxB.lineWidth = 3;
            ctxB.beginPath();
            ctxB.arc(bx, by, 13 + Math.sin(state.simTime * 22) * 2, 0, Math.PI * 2);
            ctxB.stroke();
          }
          const ballR = Math.max(6.8, (0.29 + Math.min(0.18, state.ball.z * 0.04)) * scale);
          ctxB.fillStyle = "#f97316";
          ctxB.strokeStyle = "#7c2d12";
          ctxB.lineWidth = 2;
          ctxB.beginPath();
          ctxB.arc(bx, by, ballR, 0, Math.PI * 2);
          ctxB.fill();
          ctxB.stroke();

          // In 📋 BOARD sole view (or board-focused input), show orthogonal WASD cross instead of 3D camera compass
          if (state.viewMode === "b" || isBoardInputActive()) {
            drawBoardCardinalBadge(ctxB, W, H);
          } else {
            drawCameraBadgeOnBoard(ctxB, W, H, state.cam.preset === "fps" ? state.cam.fpsYaw : state.cam.yaw - Math.PI * 0.5);
          }

          if (state.paused) drawPauseOverlayPill(ctxB, W);
          ctxB.restore();
        }

        /* =====================================================================
         * 10. View A 3D Projection, Collision-Free Labels & Arena Hoop Geometry
         * ===================================================================== */
        const REF_W = 420;
        const REF_H = 270;
        const STACK_W = 56;
        const STACK_H = 72;
        const SPR_W = STACK_W;
        const SPR_H = STACK_H;
        const STACK_LAYERS = 28;
        const STACK_ANGLES = 24;

        function makeUnitCircleLUT(segs) {
          const cos = new Float64Array(segs + 1);
          const sin = new Float64Array(segs + 1);
          for (let i = 0; i <= segs; i++) {
            const a = (i / segs) * Math.PI * 2;
            cos[i] = Math.cos(a);
            sin[i] = Math.sin(a);
          }
          return { segs, cos, sin };
        }

        const UNIT_CIRCLE_8 = makeUnitCircleLUT(8);
        const UNIT_CIRCLE_10 = makeUnitCircleLUT(10);
        const UNIT_CIRCLE_12 = makeUnitCircleLUT(12);
        const UNIT_CIRCLE_16 = makeUnitCircleLUT(16);
        const UNIT_CIRCLE_20 = makeUnitCircleLUT(20);
        const UNIT_CIRCLE_32 = makeUnitCircleLUT(32);
        const UNIT_CIRCLE_36 = makeUnitCircleLUT(36);

        const RIG_JOINT_KEYS = [
          "pelvis",
          "waist",
          "chest",
          "shoulderCenter",
          "neck",
          "head",
          "headTop",
          "L_shoulder",
          "R_shoulder",
          "L_elbow",
          "R_elbow",
          "L_hand",
          "R_hand",
          "L_hip",
          "R_hip",
          "L_knee",
