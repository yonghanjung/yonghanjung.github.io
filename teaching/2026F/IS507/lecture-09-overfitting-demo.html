<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overfitting and Double Descent</title>
<style>
:root {
  --bg: #FFFFFF; --panel: #F8FAFC; --ink: #11233F; --muted: #53657A; --line: #CBD5E1;
  --grid: #E2E8F0; --navy: #173B7A; --teal: #0E7490; --testfill: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
    --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --testfill: #0F172A;
  }
}
:root[data-theme="dark"] {
  --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
  --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --testfill: #0F172A;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 19px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 28px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 14px; }
h1 { font-size: 30px; margin: 0; }
.tabs { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tabs button { flex: 1 1 auto; border: 0; border-radius: 0; padding: 8px 20px; background: var(--bg); color: var(--ink);
               font-weight: 700; font-size: 19px; }
.tabs button[aria-pressed="true"] { background: var(--teal); color: #FFFFFF; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 26px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 19px; margin-bottom: 6px; }
.ctl output { font-variant-numeric: tabular-nums; color: var(--teal); font-size: 22px; }
.ctl label.check { justify-content: flex-start; align-items: center; gap: 10px; margin-top: 26px; cursor: pointer; }
.check input { width: 24px; height: 24px; accent-color: var(--teal); }
input[type=range] { width: 100%; height: 28px; accent-color: var(--teal); }
select, input[type=number], button { font: inherit; color: var(--ink); background: var(--bg);
       border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
select { width: 100%; }
.row { display: flex; gap: 8px; }
.row input { width: 100%; min-width: 0; }
button { cursor: pointer; white-space: nowrap; }
.readouts { display: flex; flex-wrap: wrap; gap: 8px 40px; margin: 16px 4px 12px; font-size: 26px; }
.readouts b { font-variant-numeric: tabular-nums; }
.plots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .plots { grid-template-columns: 1fr; } }
canvas { width: 100%; height: 480px; display: block; border: 1px solid var(--line); border-radius: 12px; }
@media (max-width: 600px) { body { font-size: 17px; } h1 { font-size: 24px; } .readouts { font-size: 21px; } canvas { height: 380px; } }
.tr { color: var(--navy); } .te { color: var(--teal); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
<div class="top">
  <h1>Overfitting and double descent</h1>
  <div class="tabs" role="group" aria-label="View">
    <button type="button" id="vOF" aria-pressed="true">Overfitting</button>
    <button type="button" id="vDD" aria-pressed="false">Double descent</button>
  </div>
</div>
<section class="controls" aria-label="Settings">
  <div class="ctl"><label for="src">Data</label>
    <select id="src"><option value="lecture">Lecture data</option><option value="fresh">New random data</option></select></div>
  <div class="ctl"><label for="n">Training points <output id="nOut" for="n"></output></label>
    <input type="range" id="n" min="2" max="100" value="10"></div>
  <div class="ctl"><label for="m">Test points <output id="mOut" for="m"></output></label>
    <input type="range" id="m" min="1" max="1000" value="50"></div>
  <div class="ctl"><label for="d">Degree d <output id="dOut" for="d"></output></label>
    <input type="range" id="d" min="0" max="50" value="3"></div>
  <div class="ctl"><label for="lam">Penalty &lambda; <output id="lamOut" for="lam"></output></label>
    <input type="range" id="lam" min="0" max="70" value="0"></div>
  <div class="ctl"><label class="check"><input type="checkbox" id="showTest" checked> Show test data</label></div>
  <div class="ctl" id="seedBox" hidden><label for="seed">Seed</label>
    <div class="row"><input type="number" id="seed" value="507"><button id="redraw" type="button">New draw</button></div></div>
</section>
<div class="readouts" aria-live="polite">
  <span id="Dbox"></span>
  <span class="tr">Training RMSE <b id="trv"></b></span>
  <span class="te" id="teBox">Test RMSE <b id="tev"></b></span>
</div>
<div class="plots">
  <canvas id="fitc" role="img" aria-label="Training points, test points, the truth, and the fitted polynomial"></canvas>
  <canvas id="errc" role="img" aria-label="Training and test RMSE against the degree"></canvas>
</div>
</main>
<!-- Least squares up to degree n - 1: Vandermonde with Arnoldi (Brubeck, Nakatsukasa, and Trefethen, SIAM Review 63(2), 2021).

     smallest int h^2 dx + int x(1 - x) h'(x)^2 dx on [0, 1], i.e. the smallest Legendre weights sum (1 + k(k + 1)) theta_k^2.
     Lecture data: fixed lists of 100 training and 50 test points (the truth sin(2 pi x) plus noise with SD 0.3); test points beyond
     the first 50 are new draws from the same model with seed 2026. Just past n - 1 an RMSE above 1,000 shows as > 1,000.
     Penalty lambda > 0: least squares plus lambda times that same C(h), for every degree; slider position s gives lambda = 10^(s/10 - 7). -->

// Least-squares polynomial fits of every degree 0..Dmax at once, by Vandermonde with Arnoldi
// (Brubeck, Nakatsukasa, and Trefethen 2021, SIAM Review 63(2)): the basis is orthonormal on the training points,
// so the fit of degree D uses the first D + 1 coefficients, and no ill-conditioned Vandermonde matrix is formed.
function arnoldiFit(x, y, Dmax) {

      for (let j = 0; j <= k; j++) {
        let s = 0; for (let i = 0; i < m; i++) s += Q[j][i] * q[i];
        s /= m; h[j] += s;
        for (let i = 0; i < m; i++) q[i] -= s * Q[j][i];
      }
    }
    let nrm = 0; for (let i = 0; i < m; i++) nrm += q[i] * q[i];
    h[k + 1] = Math.sqrt(nrm / m);
    H.push(h);
    Q.push(q.map(v => v / h[k + 1]));

// ---------- data ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function drawPool(seed, N) {                               // x uniform on [0, 1], y = sin(2 pi x) + 0.3 z

    x.push(xi); y.push(Math.sin(2 * Math.PI * xi) + 0.3 * Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2));

function makePool() {
  if (el.src.value === "lecture") {

  }

  return out;

// ---------- past n - 1: the smoothest curve through every training point ----------
// Among all polynomials of degree <= d through every distinct training point, the one with the smallest
// int h^2 dx + int x(1 - x) h'(x)^2 dx = sum_k (1 + k(k + 1)) theta_k^2 (Legendre basis orthonormal on [0, 1]).
// Kernel form h(x) = sum_i alpha_i K_d(x, x_i), K_d(x, z) = sum_{k <= d} L_k(x) L_k(z) / w_k; K_d(X, X) = R^T R by Givens updates.

let view = "OF", cache = null, curD = 3;

  const sums = new Map();

function clipTo(ctx, W, H) { ctx.save(); ctx.beginPath(); ctx.rect(PAD.l, PAD.t, W - PAD.l - PAD.r, H - PAD.t - PAD.b); ctx.clip(); }
function drawFit(st) {

function legend(ctx, items) {                              // one row of keys above the plot

function drawErr(st) {

  if (el.showTest.checked) series.push(["te", css("--teal")]);
  for (const [key, col] of series) {
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3; ctx.beginPath();
    for (let k = 0; k <= top; k++) { const e = errAt(k)[key]; const px = X(k), py = Y(Math.min(e, TOP)); k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke();

      const e = errAt(k)[key], px = X(k);

  if (dd && !c.pen) { ctx.font = "16px system-ui, sans-serif"; ctx.fillStyle = css("--muted"); ctx.textAlign = "left"; ctx.textBaseline = "top";
            ctx.fillText("d = n − 1", X(c.mD - 1) + 5, PAD.t + 4); }
  legend(ctx, [["line", css("--navy"), "training"], ...(el.showTest.checked ? [["line", css("--teal"), "test"]] : []),

// ---------- update ----------
function fmt(v, capped) {

function render() {

  const g = []; for (let i = 0; i <= 700; i++) g.push(i / 700);

const el = Object.fromEntries(["src", "n", "m", "d", "seed", "redraw", "seedBox", "nOut", "mOut", "dOut", "Dbox", "trv", "tev", "teBox",
