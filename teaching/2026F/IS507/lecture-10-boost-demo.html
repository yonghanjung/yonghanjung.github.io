<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boosting Residuals Explorer</title>
<style>
:root {
  --bg: #FFFFFF; --panel: #F8FAFC; --ink: #11233F; --muted: #53657A; --line: #CBD5E1;
  --grid: #E2E8F0; --navy: #173B7A; --teal: #0E7490; --rust: #9A3412; --on-teal: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
    --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
  --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 19px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 28px; }
h1 { font-size: 30px; margin: 0 0 14px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; }
.eta { display: flex; align-items: center; gap: 12px; flex: 1 1 320px; font-weight: 700; }
.eta input { flex: 1; height: 28px; accent-color: var(--teal); }
.eta output, .count b { font-variant-numeric: tabular-nums; color: var(--teal); font-size: 22px; }
.count { font-size: 22px; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
         border-radius: 8px; padding: 6px 14px; cursor: pointer; }
button.primary { background: var(--teal); color: var(--on-teal); border-color: var(--teal); font-weight: 700; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.plots { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
@media (max-width: 900px) { .plots { grid-template-columns: 1fr; } }
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }
canvas { width: 100%; display: block; border: 1px solid var(--line); border-radius: 12px; }
#fit { height: 300px; } #res { height: 260px; } #curve { height: 300px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 20px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
@media (max-width: 600px) { body { font-size: 17px; } h1 { font-size: 24px; } #fit, #res, #curve { height: 240px; } }
</style>
</head>
<body>
<main>
  <h1>Boosting: each stump fits what is left</h1>

  <div class="controls">
    <label class="eta" for="eta">η <input id="eta" type="range" min="0.05" max="1" step="0.05" value="0.3"> <output id="etao"></output></label>
    <div class="buttons">
      <button id="add1" type="button" class="primary">Add 1 stump</button>
      <button id="add10" type="button">Add 10 stumps</button>
      <button id="reset" type="button">Start over</button>
    </div>
    <div class="count">M = <b id="m">0</b></div>
  </div>

  <div class="plots">
    <div class="col">
      <canvas id="fit" role="img" aria-label="Training patients by BMI with the boosted fit h_M"></canvas>
      <canvas id="res" role="img" aria-label="Residuals of the current fit with the next stump fitted to them"></canvas>
    </div>
    <div class="col">
      <canvas id="curve" role="img" aria-label="Training and test RMSE against the number of trees"></canvas>
      <table>
        <thead><tr><th></th><th>Training</th><th>Test</th></tr></thead>
        <tbody><tr><td>RMSE</td><td id="trr"></td><td id="ter"></td></tr></tbody>
      </table>
    </div>
  </div>
</main>

// DATA-END

const $ = id => document.getElementById(id);
const TR = DATA.train, TE = DATA.test, N = TR.y.length;
TR.bmi = TR.bmi.map(Math.fround); TE.bmi = TE.bmi.map(Math.fround);   // float32, as scikit-learn compares cuts
const ORD = [...Array(N).keys()].sort((a, b) => TR.bmi[a] - TR.bmi[b]);   // training patients sorted by BMI
const MEAN = TR.y.reduce((s, v) => s + v, 0) / N;
let M = 0;

// Best least-squares cut of residuals r over sorted positions [lo, hi): the first largest gain, as scikit-learn.
function bestCut(r, lo, hi) {
  let tot = 0; for (let p = lo; p < hi; p++) tot += r[ORD[p]];
  let best = null, gain = -Infinity, sl = 0;
  for (let p = lo + 1; p < hi; p++) {
    sl += r[ORD[p - 1]];
    const a = TR.bmi[ORD[p - 1]], b = TR.bmi[ORD[p]];
    if (a === b) continue;
    const nl = p - lo, nr = hi - p, g = sl * sl / nl + (tot - sl) * (tot - sl) / nr;
    if (g > gain) { gain = g; best = { p, cut: a / 2 + b / 2 }; }
  }
  return best;
}
function meanOf(r, lo, hi) { let s = 0; for (let p = lo; p < hi; p++) s += r[ORD[p]]; return s / (hi - lo); }
function node(r, lo, hi, depth) {                      // a stump on BMI: one cut, two leaf means
  const c = depth < 1 && hi - lo > 1 ? bestCut(r, lo, hi) : null;
  if (!c) return { leaf: meanOf(r, lo, hi) };
  return { cut: c.cut, left: node(r, lo, c.p, depth + 1), right: node(r, c.p, hi, depth + 1) };
}
const predict = (t, x) => t.leaf !== undefined ? t.leaf : predict(x <= t.cut ? t.left : t.right, x);

// Run M rounds with learning rate eta. Returns the fits, the next tree, and the RMSE after each round.
function run(eta, M) {
  const h = new Array(N).fill(MEAN), ht = new Array(TE.y.length).fill(MEAN), trees = [], tr = [], te = [];
  const rm = (yy, p) => Math.sqrt(yy.reduce((s, v, i) => s + (v - p[i]) ** 2, 0) / yy.length);
  tr.push(rm(TR.y, h)); te.push(rm(TE.y, ht));
  let next = null;
  for (let m = 0; m <= M; m++) {
    const r = TR.y.map((v, i) => v - h[i]);
    const t = node(r, 0, N, 0);
    if (m === M) { next = t; break; }
    trees.push(t);
    for (let i = 0; i < N; i++) h[i] += eta * predict(t, TR.bmi[i]);
    for (let i = 0; i < ht.length; i++) ht[i] += eta * predict(t, TE.bmi[i]);
    tr.push(rm(TR.y, h)); te.push(rm(TE.y, ht));
  }
  return { trees, next, tr, te, h };
}
function hAt(S, eta, x) { let v = MEAN; for (const t of S.trees) v += eta * predict(t, x); return v; }

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function setup(c) {
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * d); c.height = Math.round(r.height * d);
  const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, r.width, r.height);
  return [g, r.width, r.height];
}
const PAD = { l: 64, r: 16, t: 34, b: 46 };
function frame(g, w, h, xr, yr, xt, yt, xlab) {
  const px = x => PAD.l + (x - xr[0]) / (xr[1] - xr[0]) * (w - PAD.l - PAD.r);
  const py = y => h - PAD.b - (y - yr[0]) / (yr[1] - yr[0]) * (h - PAD.t - PAD.b);
  g.strokeStyle = css("--grid"); g.lineWidth = 1; g.fillStyle = css("--muted"); g.font = "15px system-ui, sans-serif";
  g.textAlign = "center"; g.textBaseline = "top";
  for (const t of xt) { g.beginPath(); g.moveTo(px(t), PAD.t); g.lineTo(px(t), h - PAD.b); g.stroke(); g.fillText(t, px(t), h - PAD.b + 5); }
  g.textAlign = "right"; g.textBaseline = "middle";
  for (const t of yt) { g.beginPath(); g.moveTo(PAD.l, py(t)); g.lineTo(w - PAD.r, py(t)); g.stroke(); g.fillText(t, PAD.l - 8, py(t)); }
  g.textAlign = "center"; g.textBaseline = "bottom"; g.fillText(xlab, (PAD.l + w - PAD.r) / 2, h - 2);
  return [px, py];
}
function legend(g, items) {                            // items: [label, color, "dot" | "line" | "dash"]
  let x = PAD.l; const y = 17; g.font = "15px system-ui, sans-serif"; g.textAlign = "left"; g.textBaseline = "middle";
  for (const [lab, col, kind] of items) {
    g.strokeStyle = g.fillStyle = col;
    if (kind === "dot") { g.beginPath(); g.arc(x + 5, y, 4, 0, 2 * Math.PI); g.fill(); x += 14; }
    else { g.lineWidth = 3; g.setLineDash(kind === "dash" ? [6, 4] : []); g.beginPath(); g.moveTo(x, y); g.lineTo(x + 22, y); g.stroke(); g.setLineDash([]); x += 28; }
    g.fillStyle = css("--ink"); g.fillText(lab, x, y); x += g.measureText(lab).width + 22;
  }
}
function step(g, px, py, f, xr, col, width, dash) {    // draw a function of BMI that is flat between cuts
  g.strokeStyle = col; g.lineWidth = width; g.setLineDash(dash || []); g.beginPath();
  for (let k = 0; k <= 600; k++) { const x = xr[0] + k / 600 * (xr[1] - xr[0]), y = py(f(x)); k ? g.lineTo(px(x), y) : g.moveTo(px(x), y); }
  g.stroke(); g.setLineDash([]);
}
const XR = [17, 44], XT = [20, 25, 30, 35, 40];

function update() {
  const eta = +$("eta").value, S = run(eta, M);
  $("etao").textContent = eta.toFixed(2); $("m").textContent = M;
  $("trr").textContent = S.tr[M].toFixed(1); $("ter").textContent = S.te[M].toFixed(1);

  // 1. the patients and the boosted fit h_M
  let [g, w, h] = setup($("fit")), [px, py] = frame(g, w, h, XR, [0, 360], XT, [0, 100, 200, 300], "BMI");
  g.fillStyle = css("--navy"); g.globalAlpha = 0.45;
  for (let i = 0; i < N; i++) { g.beginPath(); g.arc(px(TR.bmi[i]), py(TR.y[i]), 3, 0, 2 * Math.PI); g.fill(); }
  g.globalAlpha = 1;
  step(g, px, py, x => hAt(S, eta, x), XR, css("--teal"), 3.5);
  legend(g, [["progression", css("--navy"), "dot"], ["h_M(x)", css("--teal"), "line"]]);

  // 2. what is left: residuals y - h_M(x), and the next stump fitted to them
  [g, w, h] = setup($("res")); [px, py] = frame(g, w, h, XR, [-200, 200], XT, [-200, -100, 0, 100, 200], "BMI");
  g.strokeStyle = css("--muted"); g.lineWidth = 1.5; g.beginPath(); g.moveTo(PAD.l, py(0)); g.lineTo(w - PAD.r, py(0)); g.stroke();
  g.fillStyle = css("--navy"); g.globalAlpha = 0.45;
  for (let i = 0; i < N; i++) { g.beginPath(); g.arc(px(TR.bmi[i]), py(TR.y[i] - S.h[i]), 3, 0, 2 * Math.PI); g.fill(); }
  g.globalAlpha = 1;
  step(g, px, py, x => predict(S.next, x), XR, css("--rust"), 3.5);
  legend(g, [["residual y − h_M(x)", css("--navy"), "dot"], ["next stump", css("--rust"), "line"]]);

  // 3. training and test RMSE as trees are added
  const mx = Math.max(20, M);
  [g, w, h] = setup($("curve"));
  const xt = []; for (let k = 0; k <= mx; k += mx <= 20 ? 5 : mx <= 100 ? 20 : mx <= 200 ? 50 : 100) xt.push(k);
  [px, py] = frame(g, w, h, [0, mx], [20, 100], xt, [20, 40, 60, 80, 100], "number of trees M");
  for (const [arr, col] of [[S.tr, css("--navy")], [S.te, css("--teal")]]) {
    g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath();
    arr.forEach((v, k) => k ? g.lineTo(px(k), py(v)) : g.moveTo(px(k), py(v))); g.stroke();
    g.fillStyle = col; g.beginPath(); g.arc(px(M), py(arr[M]), 5, 0, 2 * Math.PI); g.fill();
  }
  legend(g, [["training", css("--navy"), "line"], ["test", css("--teal"), "line"]]);
}
const add = k => { M = Math.min(500, M + k); update(); };
$("add1").addEventListener("click", () => add(1));
$("add10").addEventListener("click", () => add(10));
$("reset").addEventListener("click", () => { M = 0; update(); });
$("eta").addEventListener("input", update);
window.addEventListener("resize", update);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);
new MutationObserver(update).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
// A link such as #m=3 opens the demo after 3 trees (used for the slide screenshots).
const hm = location.hash.match(/m=(\d+)/); if (hm) M = Math.min(500, +hm[1]);
update();
