<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-Input Explorer</title>
<style>
:root {
  --bg: #FFFFFF; --panel: #F8FAFC; --ink: #11233F; --muted: #53657A; --line: #CBD5E1;
  --grid: #E2E8F0; --navy: #173B7A; --teal: #0E7490; --rust: #9A3412; --on-teal: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
    --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
  --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 28px; }
h1 { font-size: 28px; margin: 0 0 14px; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 24px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.ctl h2 { font-size: 17px; margin: 0 0 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
         border-radius: 8px; padding: 5px 12px; cursor: pointer; }
button.primary { background: var(--teal); color: var(--on-teal); border-color: var(--teal); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); border-color: var(--teal); font-weight: 700; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--teal); }
.sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 24px; margin: 12px 0 0;
           background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; }
.sliders label { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 16px; }
.sliders output { font-variant-numeric: tabular-nums; color: var(--teal); }
input[type=range] { width: 100%; accent-color: var(--teal); }
input[type=range]:disabled { opacity: 0.4; }
.eq { font-size: 20px; margin: 14px 4px 10px; overflow-wrap: anywhere; }
.views { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .views { grid-template-columns: 1fr; } }
canvas.big { width: 100%; aspect-ratio: 1 / 0.82; display: block; border: 1px solid var(--line); border-radius: 12px; }
#v3d { cursor: grab; touch-action: none; }
.lower { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; margin-top: 16px; }
@media (max-width: 860px) { .lower { grid-template-columns: 1fr; } }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.panel h2 { font-size: 17px; margin: 0 0 10px; }
.pieces { display: flex; flex-wrap: wrap; gap: 12px; }
.piece { text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }
.piece canvas { width: 84px; height: 84px; display: block; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 4px; }
.piece.sum canvas { border: 2px solid var(--teal); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 17px; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
.metrics { margin-top: 14px; font-size: 19px; }
@media (max-width: 600px) { body { font-size: 16px; } h1 { font-size: 23px; } .eq { font-size: 17px; } }
</style>
</head>
<body>
<main>
  <h1>Two inputs: the data, a menu, the fitted rule</h1>

  <div class="controls">
    <div class="ctl"><h2>Task</h2>
      <div class="seg" id="task" role="group" aria-label="Task">
        <button type="button" data-v="reg" aria-pressed="false">Regression</button>
        <button type="button" data-v="cls" aria-pressed="true">Classification</button>
      </div></div>
    <div class="ctl"><h2>Data</h2><div class="seg" id="data" role="group" aria-label="Data"></div></div>
    <div class="ctl"><h2>Basis</h2>
      <div class="seg" id="menu" role="group" aria-label="Basis">
        <button type="button" data-v="line" aria-pressed="true">Line</button>
        <button type="button" data-v="poly2" aria-pressed="false">Poly 2</button>
        <button type="button" data-v="poly3" aria-pressed="false">Poly 3</button>
        <button type="button" data-v="spline" aria-pressed="false">Spline</button>
        <button type="button" data-v="step" aria-pressed="false">Step</button>
        <button type="button" data-v="neural" aria-pressed="false">Neural</button>
      </div></div>
    <div class="ctl"><h2>Fit</h2>
      <button id="fit" type="button" class="primary">Find the best β</button>
      <label class="check"><input id="test" type="checkbox"> <span>Show test data</span></label>
    </div>
  </div>

  <div class="sliders" id="sliders"></div>

  <p class="eq" id="eq"></p>

  <div class="views">
    <canvas class="big" id="v3d" role="img" aria-label="Three-dimensional view: the data and the fitted surface; drag to turn"></canvas>
    <canvas class="big" id="v2d" role="img" aria-label="The same seen from above"></canvas>
  </div>

  <div class="lower">
    <div class="panel"><h2>Pieces φ<sub>k</sub>(x) and weights β<sub>k</sub></h2><div class="pieces" id="pieces"></div></div>
    <div class="panel"><h2>Data</h2>
      <table><thead><tr><th>row</th><th>x₁</th><th>x₂</th><th>y</th></tr></thead><tbody id="rows"></tbody></table>
      <table class="metrics"><thead><tr><th></th><th>Training</th><th>Test</th></tr></thead>
        <tbody><tr><td id="mname"></td><td id="mtr"></td><td id="mte"></td></tr></tbody></table>
    </div>
  </div>
</main>

  for (let k = 0; k < 4; k++) line(P(...C4[k], fl), P(...C4[(k + 1) % 4], fl), css("--grid"), 1);
  line(P(-1, -1, zr[0]), P(-1, -1, zr[1]), css("--grid"), 1);
  g.fillStyle = css("--muted"); g.font = "14px system-ui, sans-serif"; g.textAlign = "center";
  let q = P(1.18, -1, fl); g.fillText("x₁", q[0], q[1]); q = P(-1, 1.18, fl); g.fillText("x₂", q[0], q[1]);
  q = P(-1, -1, zr[1]); g.fillText(task === "reg" ? "y" : "score t", q[0], q[1] - 8);
  // the zero plane for classification
  if (task === "cls") {
    g.fillStyle = css("--muted"); g.globalAlpha = 0.10; g.beginPath(); C4.forEach((c, k) => { const p = P(c[0], c[1], 0); k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.fill(); g.globalAlpha = 1;
  }
  // the surface, far quads first
  const N = 22, quads = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const xs = [-1 + 2 * i / N, -1 + 2 * (i + 1) / N], ys = [-1 + 2 * j / N, -1 + 2 * (j + 1) / N];
    const c = [[xs[0], ys[0]], [xs[1], ys[0]], [xs[1], ys[1]], [xs[0], ys[1]]].map(([a, bb]) => P(a, bb, value(b, a, bb)));
    const zm = value(b, (xs[0] + xs[1]) / 2, (ys[0] + ys[1]) / 2);
    quads.push({ c, d: c.reduce((s, p) => s + p[2], 0) / 4, u: task === "reg" ? (zs(zm) / 0.8) : Math.sign(zm) * Math.min(1, Math.abs(zm) / zr[1] * 1.6) });
  }
  quads.sort((A, B) => B.d - A.d);
  for (const Q of quads) {
    g.fillStyle = diverge(Q.u, 0.55); g.strokeStyle = css("--line"); g.lineWidth = 0.5;
    g.beginPath(); Q.c.forEach((p, k) => k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); g.stroke();
  }
  // the boundary t = 0 for classification
  if (task === "cls") for (const [a, c] of zeroCurve(b, 60)) line(P(a[0], a[1], 0), P(c[0], c[1], 0), css("--rust"), 3);
  // the data
  for (let i = 0; i < D.y.length; i++) {
    const p = P(D.x1[i], D.x2[i], task === "reg" ? D.y[i] : 0);
    if (task === "reg") { g.fillStyle = css("--ink"); g.beginPath(); g.arc(p[0], p[1], 1.8, 0, 2 * Math.PI); g.fill(); }
    else if (D.y[i]) { g.fillStyle = css("--teal"); g.beginPath(); g.arc(p[0], p[1], 2, 0, 2 * Math.PI); g.fill(); }
    else { g.strokeStyle = css("--navy"); g.lineWidth = 1; g.strokeRect(p[0] - 2, p[1] - 2, 4, 4); }
  }
  g.fillStyle = css("--muted"); g.font = "13px system-ui, sans-serif"; g.textAlign = "right"; g.fillText("drag to turn", w - 10, h - 10);
}

function draw2d(b) {
  const [g, w, h] = setup($("v2d")), D = points($("test").checked ? "test" : "train");
  const s = Math.min(w, h) - 40, ox = (w - s) / 2, oy = (h - s) / 2, px = x => ox + (x + 1) / 2 * s, py = y => oy + (1 - y) / 2 * s;
  const R = 120, c = s / R;
  let zr = [0, 1];
  if (task === "reg") { const ys = DATA.reg[key].train; zr = [Math.min(...ys), Math.max(...ys)]; }
  const mid = (zr[0] + zr[1]) / 2, half = (zr[1] - zr[0]) / 2;
  for (let i = 0; i < R; i++) for (let j = 0; j < R; j++) {
    const x = -1 + (i + 0.5) / R * 2, y = 1 - (j + 0.5) / R * 2, v = value(b, x, y);
    g.fillStyle = task === "reg" ? diverge((v - mid) / half, 0.7) : (v > 0 ? diverge(1, 0.18) : diverge(0, 0));
    g.fillRect(ox + i * c, oy + j * c, c + 0.6, c + 0.6);
  }
  g.strokeStyle = css("--line"); g.lineWidth = 1; g.strokeRect(ox, oy, s, s);
  if (task === "cls") { g.strokeStyle = css("--rust"); g.lineWidth = 2.5; for (const [a, e] of zeroCurve(b, 80)) { g.beginPath(); g.moveTo(px(a[0]), py(a[1])); g.lineTo(px(e[0]), py(e[1])); g.stroke(); } }
  for (let i = 0; i < D.y.length; i++) {
    const x = px(D.x1[i]), y = py(D.x2[i]);
    if (task === "reg") { g.fillStyle = diverge((D.y[i] - mid) / half, 1); g.strokeStyle = css("--ink"); g.lineWidth = 0.6; g.beginPath(); g.arc(x, y, 2.6, 0, 2 * Math.PI); g.fill(); g.stroke(); }
    else if (D.y[i]) { g.fillStyle = css("--teal"); g.beginPath(); g.arc(x, y, 2.4, 0, 2 * Math.PI); g.fill(); }
    else { g.strokeStyle = css("--navy"); g.lineWidth = 1; g.strokeRect(x - 2.3, y - 2.3, 4.6, 4.6); }
  }
  g.fillStyle = css("--muted"); g.font = "14px system-ui, sans-serif"; g.textAlign = "center";
  g.fillText("x₁", ox + s / 2, oy + s + 16); g.save(); g.translate(ox - 12, oy + s / 2); g.rotate(-Math.PI / 2); g.fillText("x₂", 0, 0); g.restore();
}

function drawPieces(b) {
  const box = $("pieces"); box.innerHTML = "";
  const make = (label, f, sum) => {
    const d = document.createElement("div"); d.className = "piece" + (sum ? " sum" : "");
    const c = document.createElement("canvas"); d.appendChild(c); const t = document.createElement("div"); t.innerHTML = label; d.appendChild(t); box.appendChild(d);
    const [g, w, h] = setup(c), R = 42; let m = 1e-9;
    const vals = []; for (let j = 0; j < R; j++) for (let i = 0; i < R; i++) { const v = f(-1 + (i + 0.5) / R * 2, 1 - (j + 0.5) / R * 2); vals.push(v); m = Math.max(m, Math.abs(v)); }
    vals.forEach((v, k) => { g.fillStyle = diverge(v / m, 0.9); g.fillRect((k % R) * w / R, Math.floor(k / R) * h / R, w / R + 0.6, h / R + 0.6); });
  };
  const fmt = v => (v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
  const nm = MENUS[menu].names;
  for (let k = 0; k < nm.length; k++) make(`${nm[k]}<br>β = ${fmt(b[k + 1])}`, (x1, x2) => pieces(x1, x2)[k]);
  make(`sum, β₀ = ${fmt(b[0])}<br>${task === "reg" ? "prediction" : "score t"}`, (x1, x2) => value(b, x1, x2) - (task === "reg" ? 0 : 0), true);
}

function buildSliders() {                              // one slider per weight: β0 and one for each piece
  const b = beta(), nm = ["β₀", ...MENUS[menu].names.map((n, k) => `β${k + 1} · ${n}`)], box = $("sliders");
  box.innerHTML = nm.map((n, k) => `<div><label for="s${k}"><span>${n}</span> <output id="o${k}"></output></label><input id="s${k}" type="range"></div>`).join("");
  b.forEach((v, k) => {
    const el_ = $("s" + k), span = Math.max(SPAN[task], Math.ceil(Math.abs(v) * 1.25));
    el_.min = -span; el_.max = span; el_.step = span / 400; el_.value = v;
    el_.addEventListener("input", () => { beta()[k] = +el_.value; refresh(); });
  });
}
function refresh() {
  const b = beta(), fmt = (v, d) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
  b.forEach((v, k) => { const o = $("o" + k); if (o) o.textContent = fmt(v, 2); });
  const terms = MENUS[menu].names.map((nm, k) => (b[k + 1] < 0 ? " − " : " + ") + Math.abs(b[k + 1]).toFixed(2) + " " + nm).join("");
  $("eq").textContent = (task === "reg" ? "h(x) = " : "score t(x) = ") + fmt(b[0], 2) + terms + (task === "cls" ? ";  predict 1 if t > 0" : "");
  const D = points("train");
  $("rows").innerHTML = [0, 1, 2, 3, 4, 5].map(i => `<tr><td>${i + 1}</td><td>${D.x1[i].toFixed(3)}</td><td>${D.x2[i].toFixed(3)}</td><td>${task === "reg" ? D.y[i].toFixed(3) : D.y[i]}</td></tr>`).join("")
    + `<tr><td colspan="4">… ${D.y.length} training rows, ${points("test").y.length} test rows</td></tr>`;
  $("mname").textContent = task === "reg" ? "RMSE" : "Accuracy";
  $("mtr").textContent = metric(b, "train").toFixed(3); $("mte").textContent = metric(b, "test").toFixed(3);
  draw3d(b); draw2d(b); drawPieces(b);
}
function update() { buildSliders(); refresh(); }

function press(group, v) { document.querySelectorAll(`#${group} button`).forEach(o => o.setAttribute("aria-pressed", String(o.dataset.v === String(v)))); }
function fillData() {
  $("data").innerHTML = SETS[task].map(k => `<button type="button" data-v="${k}" aria-pressed="${k === key}">${k}</button>`).join("");
  document.querySelectorAll("#data button").forEach(bt => bt.addEventListener("click", () => { key = bt.dataset.v; press("data", key); update(); }));
}
document.querySelectorAll("#task button").forEach(bt => bt.addEventListener("click", () => {
  task = bt.dataset.v; key = SETS[task][0]; press("task", task); fillData(); update();
}));
document.querySelectorAll("#menu button").forEach(bt => bt.addEventListener("click", () => { menu = bt.dataset.v; press("menu", menu); update(); }));
$("fit").addEventListener("click", () => { B[slot()] = fit(); update(); });
$("test").addEventListener("input", refresh);
let drag = null;
$("v3d").addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, az, el]; $("v3d").setPointerCapture(e.pointerId); });
$("v3d").addEventListener("pointermove", e => {
  if (!drag) return; az = drag[2] + (e.clientX - drag[0]) * 0.01; el = Math.max(0.05, Math.min(1.45, drag[3] + (e.clientY - drag[1]) * 0.01)); draw3d(beta());
});
$("v3d").addEventListener("pointerup", () => { drag = null; });
window.addEventListener("resize", refresh);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refresh);
new MutationObserver(refresh).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
fillData(); update();
</script>
</body>
