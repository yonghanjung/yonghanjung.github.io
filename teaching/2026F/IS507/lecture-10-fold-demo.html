<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folding Layers Explorer</title>
<style>
:root {
  --bg: #FFFFFF; --panel: #F8FAFC; --ink: #11233F; --muted: #53657A; --line: #CBD5E1;
  --grid: #E2E8F0; --navy: #173B7A; --teal: #0E7490; --rust: #9A3412; --on-teal: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
    --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
  --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 19px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 28px; }
h1 { font-size: 30px; margin: 0 0 14px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; }
.ctl { display: flex; align-items: center; gap: 12px; flex: 1 1 360px; font-weight: 700; }
.ctl input { flex: 1; height: 28px; accent-color: var(--teal); }
.ctl output, .acc b { font-variant-numeric: tabular-nums; color: var(--teal); font-size: 24px; }
.acc { font-size: 22px; }
input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.plots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 760px) { .plots { grid-template-columns: 1fr; } }
canvas { width: 100%; aspect-ratio: 1 / 1; display: block; border: 1px solid var(--line); border-radius: 12px; }
@media (max-width: 600px) { body { font-size: 17px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<main>
  <h1>Fold more, and the region becomes a circle</h1>

  <div class="controls">
    <label class="ctl" for="L">Folds L <input id="L" type="range" min="0" max="5" step="1" value="0"> <output id="Lo"></output></label>
    <div class="acc">Accuracy <b id="acc"></b></div>
  </div>

  <div class="plots" style="grid-template-columns: minmax(0, 640px); justify-content: center">
    <canvas id="plane" role="img" aria-label="The points, and the region the network calls inside"></canvas>
  </div>
</main>

const $ = id => document.getElementById(id);
const N = DATA.y.length;
// The same folds as the notebook: the x2-axis, the x1-axis, then the middle line of the wedge left over.
function fold(p, L) {
  let [x, y] = p, a = Math.PI / 2;
  if (L >= 1) x = Math.abs(x);
  if (L >= 2) y = Math.abs(y);
  for (let k = 0; k < L - 2; k++) {
    const th = a / 2, c = Math.cos(th), s = Math.sin(th);
    const u1 = x * c + y * s, u2 = -Math.abs(-x * s + y * c);
    x = u1 * c - u2 * s; y = u1 * s + u2 * c; a = th;
  }
  return [x, y];
}
const MIRRORS = L => {                                   // the angle of each mirror line used by L folds
  const m = []; if (L >= 1) m.push(Math.PI / 2); if (L >= 2) m.push(0);
  let a = Math.PI / 2; for (let k = 0; k < L - 2; k++) { a /= 2; m.push(a); } return m;
};
const logistic = t => 1 / (1 + Math.exp(-t));
function fitLine(F) {                                    // logistic regression with the L2 penalty of scikit-learn, C = DATA.C
  let w = [0, 0, 0];                                     // intercept, w1, w2
  for (let it = 0; it < 200; it++) {
    const g = [0, w[1] / DATA.C, w[2] / DATA.C], H = [[1e-9, 0, 0], [0, 1 / DATA.C, 0], [0, 0, 1 / DATA.C]];
    for (let i = 0; i < N; i++) {
      const x = [1, F[i][0], F[i][1]], q = logistic(w[0] + w[1] * x[1] + w[2] * x[2]), r = q * (1 - q);
      for (let a = 0; a < 3; a++) { g[a] += (q - DATA.y[i]) * x[a]; for (let b = 0; b < 3; b++) H[a][b] += r * x[a] * x[b]; }
    }
    const d = solve3(H, g); w = w.map((v, k) => v - d[k]);
    if (Math.max(...d.map(Math.abs)) < 1e-12) break;
  }
  return w;
}
function solve3(A, b) {
  const M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < 3; c++) {
    let p = c; for (let r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < 3; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k <= 3; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((r, i) => r[3] / r[i]);
}

function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function setup(c) {
  const r = c.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * d); c.height = Math.round(r.height * d);
  const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, r.width, r.height);
  return [g, r.width, r.height];
}
function axes(w, h) { const m = 14, s = Math.min(w, h) - 2 * m; return [x => m + (x + 1) / 2 * s, y => m + (1 - y) / 2 * s, s, m]; }
function points(g, px, py, P) {
  for (let i = 0; i < N; i++) {
    const x = px(P[i][0]), y = py(P[i][1]);
    if (DATA.y[i]) { g.fillStyle = css("--teal"); g.beginPath(); g.arc(x, y, 3.2, 0, 2 * Math.PI); g.fill(); }
    else { g.strokeStyle = css("--navy"); g.lineWidth = 1.1; g.strokeRect(x - 3, y - 3, 6, 6); }
  }
}
function frame(g, px, py) {
  g.strokeStyle = css("--grid"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(px(-1), py(0)); g.lineTo(px(1), py(0)); g.moveTo(px(0), py(-1)); g.lineTo(px(0), py(1)); g.stroke();
}

function update() {
  const L = +$("L").value, X = DATA.x1.map((v, i) => [v, DATA.x2[i]]), F = X.map(p => fold(p, L)), w = fitLine(F);
  const say = p => w[0] + w[1] * p[0] + w[2] * p[1] > 0;
  let ok = 0; for (let i = 0; i < N; i++) ok += (say(F[i]) ? 1 : 0) === DATA.y[i] ? 1 : 0;
  $("Lo").textContent = L; $("acc").textContent = (ok / N).toFixed(3);

  // the plane, with the region the network calls inside (one line on the folded plane, unfolded)
  let [g, wd, ht] = setup($("plane")), [px, py, s, m] = axes(wd, ht);
  frame(g, px, py);
  const R = 160, cell = s / R;
  g.fillStyle = css("--teal"); g.globalAlpha = 0.18;
  for (let i = 0; i < R; i++) for (let j = 0; j < R; j++) {
    const x = -1 + (i + 0.5) / R * 2, y = 1 - (j + 0.5) / R * 2;
    if (say(fold([x, y], L))) g.fillRect(m + i * cell, m + j * cell, cell + 0.5, cell + 0.5);
  }
  g.globalAlpha = 1;
  g.save(); g.beginPath(); g.rect(m, m, s, s); g.clip(); points(g, px, py, X); g.restore();

}
