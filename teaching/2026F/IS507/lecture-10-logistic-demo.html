<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Approval Explorer</title>
<style>
:root {
  --bg: #FFFFFF; --panel: #F8FAFC; --ink: #11233F; --muted: #53657A; --line: #CBD5E1;
  --grid: #E2E8F0; --navy: #173B7A; --teal: #0E7490; --rust: #9A3412; --on-teal: #FFFFFF; --ring: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
    --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A; --ring: #E2E8F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
  --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A; --ring: #E2E8F0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 19px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 28px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; margin-bottom: 14px; }
h1 { font-size: 30px; margin: 0; }
.sub { color: var(--muted); }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px 26px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 19px; margin-bottom: 6px; }
.ctl output { font-variant-numeric: tabular-nums; color: var(--teal); font-size: 22px; }
.ctl label.check { justify-content: flex-start; align-items: center; gap: 10px; margin-top: 8px; cursor: pointer; font-weight: 400; }
.check input { width: 22px; height: 22px; accent-color: var(--teal); }
input[type=range] { width: 100%; height: 28px; accent-color: var(--teal); }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
         border-radius: 8px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--teal); color: var(--on-teal); border-color: var(--teal); font-weight: 700; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.readouts { display: flex; flex-wrap: wrap; gap: 8px 40px; margin: 16px 4px 12px; font-size: 26px; }
.readouts b { font-variant-numeric: tabular-nums; }
.eq { font-size: 26px; margin: 4px 4px 0; }
.plots { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
@media (max-width: 900px) { .plots { grid-template-columns: 1fr; } }
canvas { width: 100%; height: 480px; display: block; border: 1px solid var(--line); border-radius: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); border-color: var(--teal); font-weight: 700; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 20px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.rule { font-size: 20px; margin: 0 0 12px; }
.ctl label + input[type=range] { margin-bottom: 6px; }
.note { color: var(--muted); font-size: 16px; margin: 10px 4px 0; }
@media (max-width: 600px) { body { font-size: 17px; } h1 { font-size: 24px; } .readouts, .eq { font-size: 21px; } canvas { height: 360px; } }
.te { color: var(--teal); } .ru { color: var(--rust); } .mu { color: var(--muted); }
</style>

</head>
<body>
<main>
  <div class="top">
    <h1>Credit card: approve or decline?</h1>
  </div>

  <div class="controls">
    <div class="ctl">
      <label><span>Model</span></label>
      <div class="seg" id="model" role="group" aria-label="Model">
        <button type="button" data-m="lin" aria-pressed="true">logistic: income, age</button>
        <button type="button" data-m="sieve" aria-pressed="false">logistic sieve: income, age pieces</button>
      </div>
      <div class="buttons" style="margin-top:12px">
        <button id="fitbtn" type="button" class="primary">Find the best β (training data)</button>
        <button id="reset" type="button">Reset β to 0</button>
      </div>
      <label class="check"><input id="test" type="checkbox"> <span>Show test applicants</span></label>
    </div>
    <div class="ctl" id="sliders">
      <label for="b0"><span>β<sub>0</sub></span> <output id="b0o"></output></label>
      <input id="b0" type="range" min="-12" max="6" step="0.01" value="0">
      <label for="b1"><span>β<sub>income</sub></span> <output id="b1o"></output></label>
      <input id="b1" type="range" min="-1" max="2" step="0.005" value="0">
      <label for="b2"><span>β<sub>age</sub></span> <output id="b2o"></output></label>
      <input id="b2" type="range" min="-0.2" max="0.2" step="0.001" value="0">
    </div>
  </div>

  <div class="plots">
    <canvas id="map" role="img" aria-label="Applicants by income and age; the shaded region is where the model approves"></canvas>
    <div class="panel">
      <p class="rule">Approve if q(Y=1 | X=x) &gt; 0.5</p>
      <table>
        <thead><tr><th></th><th>Training</th><th>Test</th></tr></thead>
        <tbody>
          <tr><td>Accuracy</td><td id="tra"></td><td id="tea"></td></tr>
          <tr><td>Log loss</td><td id="trl"></td><td id="tel"></td></tr>
        </tbody>
      </table>
      <p class="note" id="nbeta"></p>
    </div>
  </div>
  <p class="note">Simulated applicants (seed 2220), not real data; written by <code>lecture-10-notebook-2026-10-08-v1.ipynb</code>.</p>
</main>

  const px = x => PAD.l + (x - xr[0]) / (xr[1] - xr[0]) * (w - PAD.l - PAD.r);
  const py = y => h - PAD.b - (y - yr[0]) / (yr[1] - yr[0]) * (h - PAD.t - PAD.b);
  g.strokeStyle = css("--grid"); g.lineWidth = 1; g.fillStyle = css("--muted"); g.font = "15px system-ui, sans-serif";
  g.textAlign = "center"; g.textBaseline = "top";
  for (const t of xt) { g.beginPath(); g.moveTo(px(t), PAD.t); g.lineTo(px(t), h - PAD.b); g.stroke(); g.fillText(t, px(t), h - PAD.b + 6); }
  g.textAlign = "right"; g.textBaseline = "middle";
  for (const t of yt) { g.beginPath(); g.moveTo(PAD.l, py(t)); g.lineTo(w - PAD.r, py(t)); g.stroke(); g.fillText(t, PAD.l - 8, py(t)); }
  g.textAlign = "center"; g.textBaseline = "bottom"; g.font = "16px system-ui, sans-serif";
  g.fillText(xlab, (PAD.l + w - PAD.r) / 2, h - 4);
  g.save(); g.translate(16, (PAD.t + h - PAD.b) / 2); g.rotate(-Math.PI / 2); g.textBaseline = "middle"; g.fillText(ylab, 0, 0); g.restore();
  return [px, py];
}
const XR = [0.5, 12.5], YR = [18, 72];

function update() {
  $("sliders").hidden = model !== "lin";
  if (model === "sieve" && !betaS) betaS = new Array(3 + DATA.knots.length).fill(0);
  const beta = currentBeta();
  ["b0", "b1", "b2"].forEach((id, k) => $(id + "o").textContent = (+$(id).value).toFixed(k === 0 ? 2 : 3));
  const [tra, trl] = scores(beta, DATA.train), [tea, tel] = scores(beta, DATA.test);
  $("tra").textContent = tra.toFixed(3); $("trl").textContent = trl.toFixed(3);
  $("tea").textContent = tea.toFixed(3); $("tel").textContent = tel.toFixed(3);
  $("nbeta").textContent = model === "lin" ? "" : beta.some(v => v) ? "Fitted " + beta.length + " weights by maximum likelihood." : "Press Find the best β.";

  const [g, w, h] = setup($("map"));
  g.clearRect(0, 0, w, h);
  const [px, py] = axes(g, w, h, XR, YR, "monthly income (thousand dollars)", "age", [2, 4, 6, 8, 10, 12], [20, 30, 40, 50, 60, 70]);
  g.save(); g.beginPath(); g.rect(PAD.l, PAD.t, w - PAD.l - PAD.r, h - PAD.t - PAD.b); g.clip();
  const NX = 240, NY = 180, off = document.createElement("canvas"); off.width = NX; off.height = NY;
  const og = off.getContext("2d"); og.fillStyle = css("--teal");
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) {
    const inc = XR[0] + (i + 0.5) / NX * (XR[1] - XR[0]), age = YR[1] - (j + 0.5) / NY * (YR[1] - YR[0]);
    if (q(beta, inc, age) > 0.5) og.fillRect(i, j, 1, 1);
  }
  g.globalAlpha = 0.16; g.imageSmoothingEnabled = false;
  g.drawImage(off, PAD.l, PAD.t, w - PAD.l - PAD.r, h - PAD.t - PAD.b); g.globalAlpha = 1;
  const D = $("test").checked ? DATA.test : DATA.train, r = $("test").checked ? 2.6 : 4;
  for (let i = 0; i < D.y.length; i++) {
    const x = px(D.inc[i]), y = py(D.age[i]);
    if (D.y[i]) { g.fillStyle = css("--teal"); g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fill(); }
    else { g.strokeStyle = css("--navy"); g.lineWidth = 1.5; g.strokeRect(x - r, y - r, 2 * r, 2 * r); }
  }
  g.restore();
  g.font = "15px system-ui, sans-serif"; g.textAlign = "left"; g.textBaseline = "middle";
  const lx = PAD.l + 12, ly = PAD.t + 14;
  g.fillStyle = css("--teal"); g.beginPath(); g.arc(lx, ly, 5, 0, 2 * Math.PI); g.fill();
  g.fillStyle = css("--ink"); g.fillText("approved", lx + 10, ly);
  g.strokeStyle = css("--navy"); g.lineWidth = 1.5; g.strokeRect(lx + 90, ly - 5, 10, 10);
  g.fillStyle = css("--ink"); g.fillText("declined", lx + 106, ly);
  g.fillStyle = css("--teal"); g.globalAlpha = 0.25; g.fillRect(lx + 180, ly - 6, 14, 12); g.globalAlpha = 1;
  g.fillStyle = css("--ink"); g.fillText("model approves", lx + 200, ly);
}
document.querySelectorAll("#model button").forEach(b => b.addEventListener("click", () => {
  model = b.dataset.m;
  document.querySelectorAll("#model button").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  update();
}));
$("fitbtn").addEventListener("click", () => {
  const beta = fitMLE();
  if (model === "lin") { $("b0").value = beta[0]; $("b1").value = beta[1]; $("b2").value = beta[2]; }
  else betaS = beta;
  update();
});
$("reset").addEventListener("click", () => {
  ["b0", "b1", "b2"].forEach(id => $(id).value = 0); betaS = null; update();
});
["b0", "b1", "b2", "test"].forEach(id => $(id).addEventListener("input", update));
window.addEventListener("resize", update);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);
new MutationObserver(update).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
update();
</script>
