<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Approval Explorer</title>
<style>
:root {
  --bg: #FFFFFF; --panel: #F8FAFC; --ink: #11233F; --muted: #53657A; --line: #CBD5E1;
  --grid: #E2E8F0; --navy: #173B7A; --teal: #0E7490; --rust: #9A3412; --on-teal: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
    --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F172A; --panel: #16213A; --ink: #E2E8F0; --muted: #94A3B8; --line: #334155;
  --grid: #1E293B; --navy: #8FB3F0; --teal: #38BDD8; --rust: #F59E73; --on-teal: #0F172A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 19px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 18px 16px 28px; }
h1 { font-size: 30px; margin: 0 0 14px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 26px;
         background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.step h2 { font-size: 19px; margin: 0 0 10px; }
.step h2 .n { display: inline-block; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; text-align: center;
              background: var(--teal); color: var(--on-teal); font-size: 16px; margin-right: 8px; }
.step label { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; margin-bottom: 2px; }
.step output { font-variant-numeric: tabular-nums; color: var(--teal); font-size: 21px; }
.step label.check { justify-content: flex-start; align-items: center; gap: 10px; cursor: pointer; font-weight: 400; }
.check input { width: 22px; height: 22px; accent-color: var(--teal); }
input[type=range] { width: 100%; height: 28px; accent-color: var(--teal); margin: 0 0 6px; }
input[type=range]:disabled { opacity: 0.4; }
button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
         border-radius: 8px; padding: 6px 14px; cursor: pointer; }
button.primary { background: var(--teal); color: var(--on-teal); border-color: var(--teal); font-weight: 700; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.seg { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); border-color: var(--teal); font-weight: 700; }
.hint { color: var(--muted); font-size: 16px; margin: 8px 0 0; }
.eq { font-size: 22px; margin: 16px 4px 10px; overflow-wrap: anywhere; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0 4px 8px; font-size: 17px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { display: inline-block; }
.plots { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
@media (max-width: 900px) { .plots { grid-template-columns: 1fr; } }
canvas { width: 100%; height: 440px; display: block; border: 1px solid var(--line); border-radius: 12px; }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.rule { font-size: 21px; margin: 0 0 12px; font-weight: 700; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 20px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
@media (max-width: 600px) { body { font-size: 17px; } h1 { font-size: 24px; } .eq { font-size: 18px; } canvas { height: 340px; } }
</style>
</head>
<body>
<main>
  <h1>Credit card: approve or decline?</h1>

  <div class="steps">
    <div class="step">
      <h2><span class="n">1</span>Model</h2>
      <div class="seg" id="model" role="group" aria-label="Model">
        <button type="button" data-m="lin" aria-pressed="true">Logistic</button>
        <button type="button" data-m="sieve" aria-pressed="false">Logistic sieve</button>
      </div>
    </div>
    <div class="step">
      <h2><span class="n">2</span>Move β</h2>
      <label for="b0"><span>β<sub>0</sub></span> <output id="b0o"></output></label>
      <input id="b0" type="range" min="-8" max="6" step="0.01" value="3">
      <label for="b1"><span>β<sub>age</sub></span> <output id="b1o"></output></label>
      <input id="b1" type="range" min="-0.3" max="0.3" step="0.001" value="-0.06">
    </div>
    <div class="step">
      <h2><span class="n">3</span>Fit</h2>
      <button id="fitbtn" type="button" class="primary">Find the best β</button>
    </div>
    <div class="step">
      <h2><span class="n">4</span>Test</h2>
      <label class="check"><input id="test" type="checkbox"> <span>Show test data</span></label>
      <p class="hint"><button id="reset" type="button">Start over</button></p>
    </div>
  </div>

  <p class="eq" id="eq"></p>
  <div class="legend">
    <span><svg class="sw" width="12" height="12"><circle cx="6" cy="6" r="5" fill="currentColor" style="color:var(--teal)"/></svg>approved</span>
    <span><svg class="sw" width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--navy)"/></svg>declined</span>
    <span><svg class="sw" width="26" height="12"><line x1="1" y1="6" x2="25" y2="6" stroke="currentColor" stroke-width="3" style="color:var(--muted)"/></svg>share approved by age</span>
    <span><svg class="sw" width="26" height="12"><line x1="1" y1="6" x2="25" y2="6" stroke="currentColor" stroke-width="3" style="color:var(--rust)"/></svg>q(Y=1 | age)</span>
    <span><svg class="sw" width="16" height="12"><rect width="16" height="12" fill="currentColor" opacity="0.22" style="color:var(--teal)"/></svg>approve</span>
  </div>

  <div class="plots">
    <canvas id="map" role="img" aria-label="Approval against age, with the model's probability curve and the ages it approves"></canvas>
    <div class="panel">
      <p class="rule">Approve if q(Y=1 | age) &gt; 0.5</p>
      <table>
        <thead><tr><th></th><th>Training</th><th>Test</th></tr></thead>
        <tbody>
          <tr><td>Accuracy</td><td id="tra"></td><td id="tea"></td></tr>
          <tr><td>Cross-entropy</td><td id="trl"></td><td id="tel"></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
